N9。A/B/C 错误：N3/N4/N6不符。", "2931": "B 正确：UPF与SMF之间的接口为N4。A/C/D 错误：N3/N6/N9不符。", "2932": "C 正确：UPF与MEC之间的接口为N6。A/B/D 错误：N3/N4/N9不符。", "2933": "B 正确：UPF下沉主要解决传输路径时延。A/C/D 错误：无线空口/传输设备/核心网设备时延不符。", "2934": "A 正确：UPF和AN之间的接口是N3接口。B/C/D 错误：N9/SBI/N6不符。", "2935": "B 正确：UPF发给gNB数据中的QFI封装在GTP-U协议层。A/C/D 错误：SDAP/IP/PDCP不符。", "2936": "A 正确：UPF的N4接口是信令面接口（与SMF）。B/C/D 错误：N6/N3/N9不符。", "2937": "D 正确：UE在每个NR serving小区下最多监听3个通过C-RNTI加扰的DCI Format。A/B/C 错误：2/4/1不符。", "2938": "C 正确：UE在每个NR serving小区下最多监听3个通过C-RNTI加扰的DCI Format。A/B/D 错误：1/2/4不符。", "2939": "B 正确：UE开机注册或脱网重新注册时小区选择算法根据S准则选择合适的小区。A/C/D 错误：R准则/高优先级/低优先级不符。", "2940": "A 正确：UE与speedtest测速服务器之间测试期间交互的是PSH（push）类型报文。B/C/D 错误：URG/ACK/SYN不符。", "2941": "A 正确：UE与AMF之间的接口为N1。B/C/D 错误：N2/N3/N4不符。", "2942": "A 正确：UE用PRACH Mask Index来指定其用哪个子帧接入。B/C/D 错误：PRACH Configuration/根序列/频偏不符。", "2943": "B 正确：UE计算发射功率时估计的路损是下行路损（用下行测量估计）。A/C/D 错误：上行/上下行/都不对不符。", "2944": "C 正确：RAR时间窗窗口起始于preamble发送完，UE等待接收RAR的窗口为3ms（标准表述）。A/B/D 错误：1/2/5不符。", "2945": "A 正确：UE的能力等级信息可以在Initial UE Context Setup（初始上下文建立）消息中读取。B/C/D 错误：RRC连接/连接建立/MIB不符。", "2946": "D 正确：U/C是将中频信号变换成射频信号后提供给功放。A/B/C 错误：调制器/解调器/LNB不符。", "2947": "B 正确：TTI bundling支持的调制方式为QPSK。A/C/D 错误：BPSK/16QAM/64QAM不符。", "2948": "A 正确：TTI bundling子帧捆绑是LTE中针对处于上行（小区边缘）的特殊调度方式。B/C/D 错误：下行/上下行均用/都不对不符。", "2949": "B 正确：TETRA系统信道间隔25KHz。A/C/D 错误：15/30/45不符。", "2950": "B 正确：TETRA系统收发双工间隔是45MHz。A/C/D 错误：30/90/120不符。", "2951": "B 正确：TETRA数字集群系统采用π/4 DQPSK调制方式。A/C/D 错误：QPSK/8PSK/16QAM不符。", "2952": "D 正确：TETRA数字集群采用时分多址技术，在25KHz频带中可传4路话音。A/B/C 错误：1/2/3不符。", "2953": "C 正确：telnet到RRU后查看RRU衰减的命令是attshow。A/B/D 错误：tcpw/rssishow/txatt不符。", "2954": "A 正确：telnet到RRU后查看RRU发射功率的命令是tcpw。B/C/D 错误：rssishow/attshow/txatt不符。", "2955": "A 正确：TD-LTE解决深度覆盖增加LTE系统带宽的措施不可取。B/C/D 正确：降低频点用低频段/分层组网/家庭基站均为可取措施。", "2956": "A 正确：TD-LTE日常所说的A频段指2010MHz~2025MHz。B/C/D 错误：2570-2620/2320-2370/1880-1920不符。", "2957": "B 正确：TD-LTE路测系统软件中RSRP含义是参考信号接收电平。A/C/D 错误：参考功率/码功率/强度指示不符。", "2958": "B 正确：TCP协议工作于TCP/IP协议栈的传输层。A/C/D 错误：应用层/网络层/数据链路层不符。", "2959": "C 正确：TCP和UDP的协议开销相同（其实不同）的说法不正确，本题选不正确项。A/B/D 正确：TCP面向连接UDP无连接/TCP可靠UDP不可靠/UDP不能流量控制均正确。", "2960": "C 正确：TCP/IP协议的层次模型有链路层、网络层、传输层、应用层。A/B/D 错误：传送层/会话层/控制层不符。", "2961": "C 正确：TCP/IP是因特网的通信协议。A/B/D 错误：服务/功能/通信线路不符。", "2962": "B 正确：sub-6GHz频段5G能支持的最大带宽为100MHz。A/C/D 错误：80/150/200不符。", "2963": "C 正确：STM-N一帧的字节数是270×N×9（270N×9）。A/B/D 错误：270×9/274N9/261N9不符。", "2964": "D 正确：STM-N帧由段开销、管理单元指针、信息净负荷三个基本部分组成。A/B/C 错误：组合不符。", "2965": "B 正确：STM-N的复用方式是字节间插。A/C/D 错误：统计复用/比特间插/帧间插不符。", "2966": "D 正确：STM-4每秒可传输的帧数是8000帧（所有SDH速率均为8000帧/秒）。A/B/C 错误：1000/2000/4000不符。", "2967": "C 正确：STM-4传输的频率是8000帧/s。A/B/D 错误：16000/2000/1000不符。", "2968": "B 正确：STM-1帧结构中最多可映射3个PDH三次群信号（140Mb/s×3）。A/C/D 错误：1/63/64不符。", "2969": "B 正确：STM-1电接口比特率容差是±20ppm。A/C/D 错误：±15/±30/±50不符。", "2970": "C 正确：STM-16可容纳16个PDH 140Mb/s信号。A/B/D 错误：1/8/64不符。", "2971": "C 正确：SSPA的P1功率是1dB压缩点功率。A/B/D 错误：额定功率/饱和功率/最小功率不符。", "2972": "A 正确：SS burst set中所有的SS block需要在5ms内发完。B/C/D 错误：10/15/20不符。", "2973": "C 正确：SS Block在频域上占用20个RB。A/B/D 错误：10/15/25不符。", "2974": "B 正确：SS Block pattern为caseC、FDD模式且频率为3-6GHz时，可支持的最大波束数为8。A/C/D 错误：4/32/64不符。", "2975": "D 正确：SSB burst中所有的SSB需要在5ms内发完。A/B/C 错误：20/15/10不符。", "2976": "D 正确：SNMP协议中Trap报文的目的端口是162。A/B/C 错误：164/161/163不符。", "2977": "D 正确：SNMP协议所使用的端口号为161/162。A/B/C 错误：80/81、20/21、9800/9801不符。", "2978": "B 正确：SNMP协议承载在传输层UDP协议之上。A/C 错误：TCP不符。", "2979": "C 正确：SMTP、FTP、POP3、TELNET的TCP端口号分别是25、21、110、23。A/B/D 错误：端口对应不符。", "2980": "D 正确：SMF和UPF的接口是N4。A/B/C 错误：N1/N2/N3不符。", "2981": "A 正确：SkyBridge宽带卫星接入系统在2002年开始运行，通过80颗低轨卫星提供服务。B/C/D 错误：年份不符。", "2982": "A 正确：sitemaster校准时选择STARTCAL单词进入校准状态。B/C/D 错误：AUTOSCALE/LIMIT/ESCAPE不符。", "2983": "C 正确：Silvester人工呼吸法动作应该每分钟重复进行12次。A/B/D 错误：10/11/13不符。", "2984": "B 正确：SIB5下发异频邻区测量信息。A/C/D 错误：同频邻区/UTRAN邻区/GERAN邻区不符。", "2985": "C 正确：SDMA通过点波束天线识别不同的用户。A/B/D 错误：滤波器/时间选通门/相关器不符。", "2986": "B 正确：SDH主要由交叉连接网、接入端口和监控单元三部分组成。A/C/D 错误：主控单元/电源单元/输出端口不符。", "2987": "C 正确：SDH微波信道机为了使用公务电话必须启用的字节是E1。A/B/D 错误：D1/D2/E2不符。", "2988": "C 正确：SDH网络中最基本模块STM-1传输速率为155.52Mbit/s。A/B/D 错误：51.84/466.56/622.08不符。", "2989": "A 正确：SDH双向环复用段倒换可用2纤或4纤方式，通道倒换环只用2纤方式。B/C/D 错误：5/3/4不符。", "2990": "B 正确：SDH网络同步交换节点时钟采用的基本方法是主-从同步。A/C/D 错误：相互同步/准同步/伪同步不符。", "2991": "A 正确：SDH同步网广泛采用的同步方式是同步方式中的等级主从同步方式。B/C/D 错误：组合方式不符。", "2992": "A 正确：SDH设备工作在物理层。B/C/D 错误：数据链路/传输层/网络层不符。", "2993": "C 正确：SDH的帧结构包含再生段开销、复用段开销、管理单元指针、信息净负荷。A/B/D 错误：组合不符。", "2994": "A 正确：SDH的基本模块是AUG-1。B/C/D 错误：AUG-4/16/64不符。", "2995": "D 正确：SDH各种自愈环的倒换时间均应不超过50ms。A/B/C 错误：1000/250/500不符。", "2996": "C 正确：SDH传送网同步传送模块STM-1对应的传输速率是155.520Mb/s。A/B/D 错误：2.048/139.264/622.080不符。", "2997": "D 正确：SCG失败时SN配置的测量通过MN路由正确。A/B/C 错误：悬挂SCG承载/不维持MN和SN/不执行配置均不符。", "2998": "D 正确：SC-FDMA与OFDM相比主要特点是能够降低峰均比。A/B/C 错误：提高频谱效率/简化系统实现/没区别不符。", "2999": "A 正确：SC/APC和SC/PC对接最大可产生10db的衰减（端面不匹配）。B/C/D 错误：30/20/5不符。", "3000": "A 正确：SA组网为保证语音结束后能立即返回5G需要采用Fast Return技术。B/C/D 错误：空闲态重选/CSFB/SRVCC不符。", "3001": "B 正确：S-ALOHA方式是指时隙ALOHA方式。A/C/D 错误：预留信道/自适应TDMA/纯随机方式不符。", "3002": "D 正确：S330 NCP配置网元IP中途意外退出CMD窗口时会无限等待，需要重新启动NCP。A/B/C 错误：处理方式不符。", "3003": "D 正确：S1接口不支持的功能是支持连接态UE在LTE系统间切换（X2功能）。A/B/C 正确：SGW承载业务管理/NAS信令传输/网络共享均为S1支持功能。", "3004": "A 正确：RRU与铁塔用不小于25mm²的地线与铁塔塔身连接，长度须不小于1m。B/C/D 错误：20/15/10不符。", "3005": "C 正确：RRC连接建立成功次数统计触发的信令是RRC connection setup complete（完成）。A/B/D 错误：请求/建立/释放不符。", "3006": "A 正确：RLC层用于检测、纠错的实体是AM实体（确认模式）。B/C/D 错误：MAC/UM/TM不符。", "3007": "A 正确：RF优化测试以DT测试为主。B/C/D 错误：CQT测试/话务报告/投诉不符。", "3008": "A 正确：R-ALOHA方式是指在ALOHA信道上开一个预约（预留）方式。B/C/D 错误：时隙ALOHA/自适应TDMA/纯随机不符。", "3009": "A 正确：RAKE接收机的基本原理是利用了分集接收技术。B/C/D 错误：极化分集/时间分集/频率分集不符。", "3010": "C 正确：RACH是随机接入信道。A/B/D 错误：物理上行共享/物理上行控制/广播信道不符。", "3011": "A 正确：QinQ技术通过堆叠两个802.1Q包头有效扩展VLAN数目至4096*4096。B/C/D 错误：2048/1024/512组合不符。", "3012": "B 正确：QCI5承载对应的业务类型是IMS信令。A/C/D 错误：会话语音/会话视频/互动游戏不符。", "3013": "D 正确：PUSCH信道误块率是反映无线接口信号传输质量的重要指标。A/B/C 错误：重传率/时延/负荷不符。", "3014": "A 正确：PUSCH是物理上行共享信道。B/C/D 错误：物理上行控制/随机接入/广播信道不符。", "3015": "C 正确：PTP协议报文分为事件报文和通用报文两类，事件报文需要进行时戳处理。A/B/D 错误：组合不符。", "3016": "D 正确：PRACH在频域上占用6个RB。A/B/C 错误：3/4/5不符。", "3017": "B 正确：PON接入网使用的传输介质是单模光纤。A/C/D 错误：铜线/光纤同轴混合/多模光纤不符。", "3018": "A 正确：PON的组网方式中FTTH是最终的理想组网方式。B/C/D 错误：FTTB/FTTC/FTTN不符。", "3019": "B 正确：PCM30/32路帧结构中TS0时隙传帧同步码字和告警信息。A/C/D 错误：TS16/TS1/TS31不符。", "3020": "A 正确：PCI冲突告警产生的原因是同频相邻小区的物理小区ID相同。B/C/D 错误：异频/邻区组合不符。", "3021": "B 正确：PBCH中的DM-RS的频域RE位置由PCI模4确定。A/C/D 错误：模3/模6/模30不符。", "3022": "B 正确：PBCH采用的调制方式为QPSK。A/C/D 错误：BPSK/16QAM/64QAM不符。", "3023": "B 正确：path switch request信令是X2切换特有的。A/C/D 错误：S1切换/站内切换/前面所有不符。", "3024": "A 正确：OTN是以波分复用为基础、在光层组织网络的骨干传送网。B/C/D 错误：时分复用/频分复用/都不对不符。", "3025": "A 正确：OTDR无法测试的项目是带宽。B/C/D 正确：光纤曲线/回波损耗/熔接损耗均可用OTDR测试。", "3026": "C 正确：OTDR可用于衰减系数的测量。A/B/D 错误：平均发送光功率/接收机灵敏度/色散系数不符。", "3027": "A 正确：OTDR的工作特性中动态范围决定了OTDR所能测量的最远距离。B/C/D 错误：分辨率/盲区/发射功率不符。", "3028": "C 正确：Option3X用户面的锚点是gNB（5G基站）。A/B/D 错误：MME/eNB/SGW不符。", "3029": "C 正确：ONU的作用是为光接入网提供直接的或远端的用户端接口。A/B/D 错误：计算机/局端/互联网不符。", "3030": "A 正确：OI表示过载指示。B/C/D 错误：质差/弱覆盖/电量不足不符。", "3031": "B 正确：ODU2在OTN中代表的速率为10G。A/C/D 错误：2.5G/40G/100G不符。", "3032": "A 正确：OTDR测试中产生盲区的主要因素是反射事件（菲涅尔反射）。B/C/D 错误：增益现象/非反射事件/动态范围不符。", "3033": "B 正确：OTDR设置折射率小于光纤实际折射率时，测定的长度大于实际光纤长度。A/C/D 错误：大于等于/小于/小于等于不符。", "3034": "D 正确：OBO的主要中文含义是输出回退（Output Back Off）。A/B/C 错误：输入回退/室外功放/广播干扰不符。", "3035": "D 正确：N个节点完全互联的网型网需要的传输电路数为N(N-1)/2。A/B/C 错误：N(N-1)/N/N-1不符。", "3036": "D 正确：NSA组网架构中4G基站和5G基站共用4G核心网。A/B/C 错误：2G/3G/5G不符。", "3037": "B 正确：NR小区其它下行信道都是基于PDCCH信道作为基准来提供功率的。A/C/D 错误：PBCH/MaxTransmitPower/CSI-RS不符。", "3038": "D 正确：NR的一个小区有64个前导码。A/B/C 错误：4/8/16不符。", "3039": "C 正确：NFV可以实现软硬件解耦功能。A/B/D 错误：手机SIM卡分离/控制承载分离/控制业务分离不符。", "3040": "C 正确：NEC iPASOLINK微波出现Cable open告警最大可能故障点部位为中频线缆。A/B/D 错误：ODU/IDU/天线不符。", "3041": "B 正确：NEC iPASOLINK宽带微波IDU高温告警最大可能故障点部位为风扇模块。A/C/D 错误：电源模块/基带业务模块/调制解调不符。", "3042": "C 正确：NB-IoT对时延要求敏感的说法错误（NB-IoT时延不敏感，容忍时延大），本题选错误项。A/B/D 正确：Inband部署/NB覆盖增强20dB/下行15kHz OFDMA均正确。", "3043": "C 正确：对比GSM覆盖，NB-IoT有20dB的覆盖增强。A/B/D 错误：5/10/40不符。", "3044": "D 正确：NB-IoT下行载波带宽为180kHz。A/B/C 错误：3.75/15/30不符。", "3045": "A 正确：NB-IoT的技术标准是3GPP组织定义的。B/C/D 错误：3GPP2/IEEE/IETS不符。", "3046": "B 正确：NB-IoT小区参考信号功率在SIB2消息发给终端。A/C/D 错误：MIB/RRC连接建立/完成不符。", "3047": "A 正确：NB-IoT下行采用的多址技术是OFDMA。B/C/D 错误：SFDMA/SCMA/FDMA不符。", "3048": "D 正确：NB-IoT上行资源的最小调度单位是RU（Resource Unit）。A/B/C 错误：RB/RE/PRB不符。", "3049": "B 正确：NB-IoT上下行分别采用的多址技术是SCFDMA、OFDMA。A/C/D 错误：顺序/组合不符。", "3050": "A 正确：MU-MIMO适合负载较重、容量需求大的场景使用。B/C/D 错误：负载轻/高速移动/超远覆盖不符。", "3051": "A 正确：MSTP技术源于SDH。B/C/D 错误：PDH/POS/ATM不符。", "3052": "C 正确：MSTP的中文名称是多业务传送平台。A/B/D 错误：波分复用/光传送网/全光网络不符。", "3053": "B 正确：MIB走BCH传输信道。A/C 错误：PCH/DL-SCH不符。", "3054": "D 正确：Massive MIMO不适合地铁隧道场景部署（信道相关性高多流受限）。A/B/C 正确：核心CBD/高层酒店/高层居民区均为适合场景。", "3055": "A 正确：L频段卫星通信系统的工作频段为1~2GHz。B/C/D 错误：2-3/3-6/7-8不符。", "3056": "A 正确：L波段（长波长波段）波长范围是1565nm~1625nm。B/C/D 错误：1530-1565/1310-1510/1510-1530不符。", "3057": "A 正确：LTE最多可同时支持40个用户得到调度。B/C/D 错误：88/22/80不符。", "3058": "A 正确：LTE中无论是正常子帧还是特殊子帧，长度均为1ms。B/C/D 错误：2/10/20不符。", "3059": "A 正确：LTE中核心网的名称是EPC。B/C/D 错误：EPS/UTRAN/EUTRAN不符。", "3060": "A 正确：LTE支持硬切换（同频硬切换）。B/C/D 错误：软切换/更软切换/不支持不符。", "3061": "B 正确：LTE语音业务最终解决方案是VoLTE。A/C/D 错误：CSFB/SRVCC/NIOT不符。", "3062": "D 正确：LTE有6个天线端口（0-5）。A/B/C 错误：3/4/5不符。", "3063": "B 正确：LTE有504个PCI。A/C/D 错误：126/512/268不符。", "3064": "D 正确：LTE协议中所能支持的最大RB个数为100（20MHz）。A/B/C 错误：6/20/50不符。", "3065": "D 正确：LTE协议栈中控制面传输层采用的协议是SCTP。A/B/C 错误：IP/UDP/GTPU不符。", "3066": "B 正确：LTE协议规定的UE最大发射功率为23dBm。A/C/D 错误：20/30/33不符。", "3067": "D 正确：LTE下行没有采用TSTD多天线技术（TSTD是TD-SCDMA技术）。A/B/C 正确：SFBC/FSTD/波束赋形均为LTE下行多天线技术。", "3068": "B 正确：LTE下行控制信道中覆盖受限的是PDCCH。A/C/D 错误：PBCH/PHICH/PCFICH不符。", "3069": "A 正确：LTE下行多址采用OFDMA技术。B/C/D 错误：MIMO/SFDMA/RACH不符。", "3070": "A 正确：LTE系统中采用SC-FDMA技术是为了降低峰均比。B/C/D 错误：增大峰均比/降低峰值/增大均值不符。", "3071": "D 正确：LTE系统中一个无线帧时间长度为10ms。A/B/C 错误：0.5/1/5不符。", "3072": "B 正确：LTE系统中X2接口是eNodeB与eNodeB之间的接口。A/C/D 错误：MME/RNC/SGSN不符。", "3073": "A 正确：LTE系统由EPC、eNodeB、UE三部分组成。B/C/D 错误：MME/PDSN/P-GW不符。", "3074": "C 正确：LTE系统用户传输数据主要使用共享信道。A/B/D 错误：专用/公用/信令信道不符。", "3075": "D 正确：LTE系统是第四代移动通信系统。A/B/C 错误：一/二/三代不符。", "3076": "B 正确：LTE系统内的切换通常在100-200ms时间内完成。A/C/D 错误：1-100/300-500/500-1000不符。", "3077": "D 正确：LTE系统核心网不包括eNB网元（eNB是无线接入网）。A/B/C 正确：MME/SGW/PGW均属核心网。", "3078": "A 正确：LTE系统带宽在PBCH信道中承载。B/C/D 错误：PDCCH/PDSCH/PHICH不符。", "3079": "C 正确：LTE系统传输用户数据主要使用共享信道。A/B/D 错误：专用/公用/信令信道不符。", "3080": "C 正确：LTE为实现双流而采用的多天线方案是空分复用。A/B 错误：发射分集/波束赋形不符。", "3081": "A 正确：LTE解决深度覆盖增加LTE系统带宽的措施不可取。B/C/D 正确：降低频点/分层组网/家庭基站均为可取措施。", "3082": "A 正确：LTE网络中终端与eNodeB间接口是Uu，eNodeB之间接口是X2，与核心网是S1。B/C/D 错误：接口组合不符。", "3083": "C 正确：LTE上行多址采用SC-FDMA技术。A/B/D 错误：OFDMA/MIMO/RACH不符。", "3084": "A 正确：LTE上下行传输使用的最小资源单位是RE（资源粒子）。B/C/D 错误：RR/TE/MM不符。", "3085": "B 正确：LTE上下行传输使用的最小资源单位叫做RE。A/C/D 错误：PRB/REG/CCE不符。", "3086": "D 正确：LTE接口不包括Iub接口（Iub是UMTS接口）。A/B/C 正确：X2/S1-U/S1-MME均为LTE接口。", "3087": "C 正确：LTE基站设备中的射频单元称为RRU。A/B/D 错误：AAU/BBU/BTS不符。", "3088": "B 正确：LTE的终端有5个等级（Cat1-Cat5等）。A/C/D 错误：3/6/9不符。", "3089": "D 正确：LTE产业链包括系统设备、终端芯片、仪器仪表、业务等环节。A/B/C 错误：环节组合不符。", "3090": "B 正确：LTE不支持3*3 MIMO（支持2*2/4*4/4*2）。A/C/D 正确：2*2/4*4/4*2均为LTE支持MIMO。", "3091": "D 正确：LTE FDD中A5事件指服务小区差于门限1且邻区好于门限2。A/B/C 错误：单门限事件不符。", "3092": "D 正确：LTE FDD基站对时间（相位）同步无要求（只要求频率）。A/B/C 错误：1.5/1/3μs不符。", "3093": "A 正确：LTE、5G基站回传接口与CPRI接口没有使用到155Mbps光模块速率。B/C/D 正确：1.25G/10G/25G均使用。", "3094": "C 正确：LNB接收信号电平-23dBm约等于0.005mW。A/B/D 错误：0.05/0.01/0.1不符。", "3095": "C 正确：LNB将高频信号转换至中频950MHz-2050MHz。A/B/D 错误：70/140、500-1000、800-900不符。", "3096": "C 正确：LNB将高频信号转换至950/2050MHz中频。A/B/D 错误：70/140、500/1000、800/900不符。", "3097": "D 正确：LNA是指低噪声放大器。A/B/C 错误：双工器/上下行转换器/高功率放大器不符。", "3098": "B 正确：LNA的输出频段在RF（射频）。A/C/D 错误：IF/S频段/L频段不符。", "3099": "C 正确：LMDS业务是一种以广播方式提供的宽带接入业务。A/B/D 错误：点到点/网状型/MESH不符。", "3100": "C 正确：LAN基于广播的以太网中所有工作站都可以接收到发送到网上的广播帧。A/B/D 错误：电信号/比特流/数据包不符。", "3101": "D 正确：Ku频段下行LNB设备本振为11300MHz（11.3GHz）。A/B/C 错误：2225/1750/5150不符。", "3102": "B 正确：Ku频段卫星为上行14GHz、下行11GHz/12GHz。A/C/D 错误：10/18/22不符。", "3103": "A 正确：Ku频段卫星上下行转发频率差为1748或1750MHz。B/C/D 错误：2225/5150/11300不符。", "3104": "C 正确：Ku频段上行BUC设备本振为13050MHz。A/B/D 错误：5150/11300/14050不符。", "3105": "C 正确：Ka卫星波束切换功能通过网管、MODEM及天线控制器三者之间交互实现。A/B/D 错误：业务终端/电源单元/天线不符。", "3106": "C 正确：Ka波段可用带宽可达3500MHz。A/B/D 错误：2500/3000/4000不符。", "3107": "D 正确：Ka波段指的是26.5-40GHz之间的频段。A/B/C 错误：4-7/7-12/12-18不符。", "3108": "D 正确：Ka便携站目前最常用的极化方式为右旋圆极化。A/B/C 错误：水平/垂直/左旋不符。", "3109": "D 正确：Ka-VSAT使用IP传输链路。A/B/C 错误：5M/E1/25M不符。", "3110": "C 正确：Ka-VSAT的BUC本振一般为27.6GHz。A/B/D 错误：27.4/27.5/27.7不符。", "3111": "C 正确：Ka-VSAT采用圆极化的极化方式。A/B/D 错误：垂直极化/线极化/椭圆极化不符。", "3112": "B 正确：ITU-T命名色散位移单模光纤为G.653光纤。A/C/D 错误：G.652/G.654/G.655不符。", "3113": "C 正确：ITU-T G984规定GPON下行带宽2.5Gbps，实际带宽约为2.3Gbps。A/B/D 错误：2.1/2.4/2.2不符。", "3114": "D 正确：ITU-T G.826建议规定了误块秒比ESR、严重误块秒比SESR和背景误块比BBER三个参数。A/B/C 错误：不可用秒US/误码秒ES/严重误码秒比不符。", "3115": "B 正确：IP协议的特征是不可靠、无连接。A/C/D 错误：可靠/面向连接不符。", "3116": "D 正确：IP接入方式可分为直接接入方式、隧道方式、路由方式和MPLS方式。A/B/C 错误：LMDS/Bluetooth/GPRS不符。", "3117": "C 正确：IP地址中主机地址全为1表示广播地址。A/B/D 错误：第一台计算机/本网络地址/地址无效不符。", "3118": "B 正确：IP地址中主机地址全为0表示本网络的地址。A/C/D 错误：第一台计算机/广播地址/地址无效不符。", "3119": "B 正确：不属于专用地址的是255.0.0.0（A类公有地址网段）。A/C/D 正确：10.0.0.0/172.16.0.0/192.168.0.0均为私有地址。", "3120": "A 正确：IP地址132.119.100.200子网掩码255.255.255.240，所在子网是132.119.100.192。B/C/D 错误：子网地址不符。", "3121": "B 正确：IP地址129.9.100.160为B类地址（129-191段）。A/C/D 错误：D/A/C类不符。", "3122": "A 正确：IP报文TTL值的最大值是255。B/C/D 错误：256/63/64不符。", "3123": "A 正确：IP报文头中固定长度部分为20字节。B/C/D 错误：30/50/40不符。", "3124": "C 正确：IPv6使用128位的地址空间。A/B/D 错误：32/64/256不符。", "3125": "D 正确：IPRAN网络承载5G业务时，5G基站侧接入侧采用10GE光接口。A/B/C 错误：FE电/GE电/10G POS光不符。", "3126": "D 正确：MPLS可以提高路由器转发速度的说法错误（MPLS不提高转发速度，是转发机制不同），本题选错误项。A/B/C 正确：工作在2.5层/支持任意网络层和数据链路层/支持多重标签嵌套均正确。", "3127": "A 正确：IPRAN采用路由器架构，将三层转发和MPLS二层转发相结合。B/C/D 错误：以太网交换机/IP交换/软交换不符。", "3128": "B 正确：IP-Over-SDH体系中的数据链路层协议采用的是PPP和HDLC。A/C/D 错误：协议组合不符。", "3129": "B 正确：INTERNET采用的网间互连协议是TCP/IP。A/C/D 错误：IP/IPX/TCP不符。", "3130": "B 正确：IEEE无线网络802.11b的传输速率是11Mbps。A/C/D 错误：10/54/100不符。", "3131": "C 正确：IEEE802.11工作组制定的802.11a/g WLAN理论无线速率标准是54M。A/B/D 错误：2M/11M/600M不符。", "3132": "A 正确：IDR通信系统中一个2MB/s载波在卫星上占用带宽2.0025MHz。B/C/D 错误：2.048/2.0500/2.2000不符。", "3133": "A 正确：IDR通信方式上行线路的调制一般采用QPSK。B/C/D 错误：FSK/PCM/BPSK不符。", "3134": "C 正确：IDR数字群路制方式信息码率范围为64kB/s到44.736Mb/s，中速率数据名称由此而来。A/B/D 错误：速率范围不符。", "3135": "A 正确：IDR辅助帧（报头）速率为96KBps。B/C/D 错误：86/72/64不符。", "3136": "A 正确：IDR调制解调器中发端时钟通常采用地面时钟。B/C/D 错误：卫星时钟/内部时钟/外部时钟不符。", "3137": "B 正确：基带信号内环测试正常但MODEM中频对城内环测不正常，故障段落可能在MODEM。A/C/D 错误：HPA/光端机/城内终端不符。", "3138": "B 正确：IDR电路调制方式QPSK。A/C/D 错误：MSK/QAM/OFDM不符。", "3139": "D 正确：IDR电路24小时累计比特差错率应小于1e-06。A/B/C 错误：0.001/0.0001/1e-05不符。", "3140": "B 正确：IDR的数据速率范围在64kBit/s～44.7MBit/s。A/C/D 错误：范围不符。", "3141": "C 正确：IDR的全称是中数据速率载波系统（Intermediate Data Rate）。A/B/D 错误：低/高/大容量不符。", "3142": "A 正确：IDR的编码方式3/4 FEC（前向纠错）。B/C/D 错误：ARQ/HEC/SBC不符。", "3143": "B 正确：ICIC是频域的干扰规避（小区间干扰协调）。A/C/D 错误：时域/空域/码域不符。", "3144": "B 正确：ICIC技术是用来解决同频干扰。A/C/D 错误：邻频/随机/异系统干扰不符。", "3145": "B 正确：ICIC技术是用来解决同频干扰。A/C/D 错误：邻频/随机/异系统干扰不符。", "3146": "C 正确：ICIC测量标识中属于下行标识的是RNTP。A/B 错误：HII/OI均为上行标识。", "3147": "B 正确：IBO的主要中文含义是输入回退（Input Back Off）。A/C/D 错误：室内单元/广播干扰/输出回退不符。", "3148": "D 正确：HTTPS协议的默认端口号是443。A/B/C 错误：20/23/80不符。", "3149": "A 正确：HPA增益测试属于单机测试。B/C/D 错误：联机测试/卫星链路开通测试/分系统测试不符。", "3150": "C 正确：HPA是非线性放大器，线性工作区一般从0至饱和工作点回退3dB。A/B/D 错误：2/2.5/3.5不符。", "3151": "A 正确：HPA的主要中文含义是高功率放大器（High Power Amplifier）。B/C/D 错误：中功率/低噪声/变频器不符。", "3152": "D 正确：HPA的增益主要由IPA（中间功率放大器）和TWT提供。A/B/C 错误：U/C/LNA/D/C不符。", "3153": "C 正确：HLS协议流媒体分发中客户端向服务器请求的是m3u8文件。A/B/D 错误：flv/mp4/html不符。", "3154": "A 正确：Hemibeam的中文含义是半球波束。B/C/D 错误：半功率波束/全球波束/区域波束不符。", "3155": "C 正确：HARQ的信息承载在PHICH信道上。A/B/D 错误：PDCCH/PDSCH/PCFICH不符。", "3156": "B 正确：H.264在同等图像质量条件下压缩比是MPEG-2的2倍以上。A/C/D 错误：1.5/2.5/3不符。", "3157": "D 正确：H.264图像传输格式实际上是MPEG-4的第十部分。A/B/C 错误：第二/第六/第四部分不符。", "3158": "C 正确：H248协议又称MEGACO协议。A/B/D 错误：SIP/RTP/MGCP不符。", "3159": "A 正确：GPS至少不能有0.25（4分之1以上）的阻挡，否则无法锁星或工作不正常。B/C/D 错误：0.5/0.75/1不符。", "3160": "C 正确：GPS系统提供三维定位和定时至少需要4颗卫星。A/B/D 错误：2/3/5不符。", "3161": "A 正确：GPS系统使用的1200MHz/1500MHz左右的信号属于L波段。B/C/D 错误：S/C/Ku波段不符。", "3162": "A 正确：GPS天线要求无遮挡立体角大于90度。B/C/D 错误：120/150/180不符。", "3163": "C 正确：GPS天线输入电压大约为5.0V。A/B/D 错误：2.8/3.8/5.8不符。", "3164": "A 正确：GPS天线的供电是5V。B/C/D 错误：12/24/48不符。", "3165": "A 正确：GPS天馈馈线的正常电压约为直流、5.1V。B/C/D 错误：交流/48V不符。", "3166": "D 正确：GPON系统中采用强制单纤双向传输方式。A/B/C 错误：单纤单向/双纤双向/双纤单向不符。", "3167": "A 正确：gNB之间的接口称为Xn接口。B/C/D 错误：NG-C/X2/Uu不符。", "3168": "C 正确：gNB向INACTIVE态UE发送Paging消息时使用的寻呼标识为I-RNTI。A/B/D 错误：S-TMSI/RNTI/P-RNTI不符。", "3169": "D 正确：gNB配置一个上下行解耦小区，CU上配置的小区数加上DU上配置的小区数共计4个。A/B/C 错误：1/2/3不符。", "3170": "D 正确：GE/10GE/100GE业务的频偏范围是100ppm。A/B/C 错误：10/20/50不符。", "3171": "C 正确：G.655光纤的零色散点波长在1550nm附近。A/B/D 错误：1310/1500/1600不符。", "3172": "C 正确：G.652光纤可以将25Gbit/s速率的信号无电再生中继传输至少600公里左右。A/B/D 错误：200/400/800不符。", "3173": "A 正确：G/T值越高地球站接收能力越强。B/C/D 错误：弱/不确定/相同不符。", "3174": "A 正确：G/T值的计算与参考点无关（G/T是接收品质因数）。B/C/D 错误：T值/G值/都有关系不符。", "3175": "A 正确：FTTH的意思是光纤到户。B/C/D 错误：光纤到办公室/路边/楼不符。", "3176": "A 正确：FTTB是指光纤到大楼。B/C/D 错误：光纤到路边/用户/交接箱不符。", "3177": "A 正确：FSS的主要中文含义是指卫星固定业务。B/C/D 错误：卫星移动/临时/中继业务不符。", "3178": "C 正确：FLU的主要中文含义是指全链路测试。A/B/D 错误：简单/存在载频/业务链路测试不符。", "3179": "D 正确：FET是场效应管功率放大器（Field Effect Transistor）。A/B/C 错误：固态/速调管/行波管不符。", "3180": "B 正确：FEC的主要中文含义是前向纠错（Forward Error Correction）。A/C/D 错误：后向/正向/反向纠错不符。", "3181": "A 正确：FC/PC光纤接头是圆形光纤接头、微凸球面研磨抛光。B/C/D 错误：方型/8度角/方型凸球面不符。", "3182": "D 正确：E-UTRAN系统中基站的覆盖半径最大可达100km。A/B/C 错误：10/30/50不符。", "3183": "D 正确：eSRVCC方案相对SRVCC增强在于减少切换时长，eSRVCC切换时长小于300ms。A/B/C 错误：20/40/160不符。", "3184": "A 正确：EPON在OLT和ONU之间规定了一种控制机制是MPCP（多点控制协议）。B/C/D 错误：OAM/RS/PHY不符。", "3185": "A 正确：eNodeB与核心网之间的接口是S1。B/C/D 错误：S2/X1/X2不符。", "3186": "A 正确：eNodeB下发TA给UE是为了使UE获得上行时间同步。B/C/D 错误：频率同步/下行信道质量/准入技术不符。", "3187": "A 正确：eNodeB和MME之间的S1接口传输层使用的是SCTP流控制协议。B/C/D 错误：TCP/UDP/IPX-SPX不符。", "3188": "A 正确：eNodeB侧处理S1接口用户面数据的协议层是GTPU/UDP。B/C/D 错误：S1AP/SCTP/X2AP/RRC不符。", "3189": "B 正确：eNodeB侧处理S1接口控制面数据的协议层是S1AP/SCTP。A/C/D 错误：GTPU/UDP/SCTP-IP/RRC不符。", "3190": "C 正确：EIRP是指有效全向辐射功率。A/B/D 错误：天线增益/发射功率/等效噪声温度不符。", "3191": "A 正确：Ec/Io衡量的是导频信道的覆盖强度。B/C/D 错误：同步/寻呼/业务信道不符。", "3192": "B 正确：Eb/No正确解释是每比特功率与噪声密度比。A/C/D 错误：载波功率与噪声密度比/载波与等效噪声温度比/单位载波与单位噪声密度不符。", "3193": "A 正确：E1信号采用的码型为HDB3。B/C/D 错误：CMI/NRZ/AMI不符。", "3194": "B 正确：DWDM指的是密集波分复用。A/C/D 错误：波分复用/波长分插复用器/频分复用不符。", "3195": "A 正确：DVB的主要中文含义是数字视频广播标准。B/C/D 错误：标清电视/高清电视/宽带视频广播标准不符。", "3196": "B 正确：DVB-S系统的视频采用标准的MPEG-2压缩编码。A/C/D 错误：MPEG-1/3/5不符。", "3197": "A 正确：DVB-S所采用的调制方式是QPSK。B/C/D 错误：QAM/8PSK/4PSK不符。", "3198": "A 正确：DVB-S的含义是卫星数字电视广播。B/C/D 错误：电缆/光纤/地面数字电视广播不符。", "3199": "D 正确：DVB-S标准提供了一套完整的适用于卫星传输的数字电视系统规范。A/B/C 错误：模拟电视/数据/语音不符。", "3200": "C 正确：DU与AAU接口首选eCPRI方案。A/B/D 错误：CPRI/OBSAI/REC不符。", "3201": "B 正确：DS3接口速率为45MBPS。A/C/D 错误：34/155/622不符。", "3202": "C 正确：DCME是数字电路倍增设备（Digital Circuit Multiplication Equipment）。A/B/D 错误：调制/编码/解调设备不符。", "3203": "A 正确：dBm是以1mW为基准值。B/C/D 错误：1uW/1W/10W不符。", "3204": "C 正确：dBi与dBd的关系是dBi=2.15+dBd。A/B/D 错误：关系式不符。", "3205": "A 正确：DAMA的含义是按需分配、多址接入。B/C/D 错误：动态/预约/预分配不符。", "3206": "B 正确：D/C是将射频信号变换成中频信号后提供给解调器。A/C/D 错误：调制器/LNB/功放不符。", "3207": "C 正确：C网应急通信车卫星系统所采用的功放是固态放大器。A/B/D 错误：速调管/行波管/KA波段不符。", "3208": "A 正确：C网应急通信车（小车）中CDM600L所使用的数据接口类型为G.703U。B/C/D 错误：G.703B/RS232/V.35不符。", "3209": "A 正确：C网应急基站车卫星系统LNB的本振频率是11250MHz。B/C/D 错误：11300/11350/13050不符。", "3210": "B 正确：C网应急基站车目前主要配备VERTEX-RSI KU 1.35米双向车载卫星天线。A/C/D 错误：1.2/1.0/0.9不符。", "3211": "A 正确：C网小型应急车出发前务必确保车顶卫星天线倒伏，升降杆闭合收于车后并锁定。B/C/D 错误：支起/侧向/横向不符。", "3212": "C 正确：C频段卫星通信常用的下上行频率为4GHz/6GHz。A/B/D 错误：2-4/1.5-1.6/7-8不符。", "3213": "C 正确：C频段卫星天线馈源LNB的本振频率为5.150GHz。A/B/D 错误：11.30/10.75/10不符。", "3214": "C 正确：C频段卫星上下行转发频率差为2225MHz。A/B/D 错误：1748/1750/2500不符。", "3215": "D 正确：C波段卫星转发器上下行线路的频率差为2225MHz。A/B/C 错误：11300/11250/1750不符。", "3216": "B 正确：C波段卫星通信特点描述正确的是抗雨衰能力强、天线尺寸较大。A/C/D 错误：抗干扰强天线小/不易结冰/天线小更便宜不符。", "3217": "A 正确：C波段的信号比Ku波段信号抗雨衰能力强。B/C/D 错误：弱/一样/不确定不符。", "3218": "B 正确：C波段的工作频段是4-8GHz。A/C/D 错误：1-2/11-18/25-32不符。", "3219": "B 正确：CU与核心网之间的网络称为回传网。A/C/D 错误：前传网/中传网/核心网不符。", "3220": "B 正确：CU-DU之间的接口是F1。A/C/D 错误：E1/N1/S1不符。", "3221": "D 正确：CU/DU在PDCP侧进行划分，CU包含PDCP及以上，DU包含其以下。A/B/C 错误：MAC/RLC/RRC不符。", "3222": "A 正确：CU/DU合一情况下数据传输不包括中传。B/C/D 正确：前传/回传/远传均涉及。", "3223": "B 正确：comtech-570设备配置参数不能直接通过面板直接操作方式实现。A/C/D 正确：vload/telnet/超级终端均可操作。", "3224": "A 正确：CL（升力系数）13和10相比，前者产生更大升力。B/C 错误：后者/相等不符。", "3225": "B 正确：CIF格式图像的分辨率为352×288。A/C/D 错误：176×144/704×576/1408×1152不符。", "3226": "B 正确：CDMA卫星中继应急入网系统中卫星频段资源一般由主控站统一调度和管理。A/C/D 错误：卫星公司/基站侧端站/随机不符。", "3227": "B 正确：CDMA卫星中继应急入网系统卫星主站采用的是CDM625卫星调制解调器。A/C/D 错误：CDM570/CDM570L/CDM600不符。", "3228": "D 正确：CDM-625支持四个E1接口将四路E1复合成一个载波，避免了发射多载波时的功放回退。A/B/C 错误：交调干扰/功率抑制/功率不稳定不符。", "3229": "C 正确：CDM-625卫星调制器的作用是把基带信号变为IF信号。A/B/D 错误：模拟变数字/数字变模拟/RF变基带不符。", "3230": "B 正确：CDM-625卫星MODEM的管理可以很方便地集成到基于IP的管理系统中。A/C/D 错误：DVB/V.35/ATM不符。", "3231": "C 正确：CDM625A设备加装IP处理卡后新增了网桥模式功能。A/B/D 错误：路由/载波叠加/高阶调制不符。", "3232": "A 正确：C/I是指载波功率与干扰噪声功率之比。B/C/D 错误：每Hz干扰噪声/交调噪声/热噪声之比不符。", "3233": "B 正确：BUC的主要中文含义是块上变频器（Block Up Converter）。A/C 错误：上行控制单元/系统控制总线不符。", "3234": "A 正确：BTS软件包存放在BSC硬盘的BCF_PACK目录下。B/C/D 错误：HWDATA/SCMANA/BSCSTA不符。", "3235": "A 正确：BSC与BTS之间的接口为ABis接口。B/C/D 错误：A/Um/V5不符。", "3236": "B 正确：BSC是指基站控制器。A/C/D 错误：基站/天线/云台不符。", "3237": "B 正确：BSC从MSC提取时钟同步信号。A/C/D 错误：HLR/BTS/TRU不符。", "3238": "D 正确：BSC2i的最大容量是512个TRX。A/B/C 错误：248/256/384不符。", "3239": "A 正确：BPSK调制中每个编码符号可以携带1比特信息。B/C/D 错误：2/3/4不符。", "3240": "B 正确：BPSK的主要中文含义是二相相移键控。A/C/D 错误：四相/八相/十六相不符。", "3241": "A 正确：BGP/MPLS VPN使用BGP在骨干网发布VPN路由，使用MPLS在骨干网转发VPN报文。B/C/D 错误：协议组合不符。", "3242": "B 正确：BGAN卫星终端正常使用的信号强度一般要求在50dBHz以上。A/C/D 错误：40/60/70不符。", "3243": "A 正确：BGAN TT探险家500型海事卫星电话EIRP为15.1dBW±1dB。B/C/D 错误：15.1dBm/37.5dBm/20dBW不符。", "3244": "C 正确：BGAN700通信传送64kBps速率数据最小信号值不小于54dBHz。A/B/D 错误：30/40/60不符。", "3245": "C 正确：BGAN700通信传送32kBps速率数据最小信号值不小于51dBHz。A/B/D 错误：30/40/60不符。", "3246": "A 正确：BGAN700通信必须的信号最小信号值不小于50dBHz。B/C/D 错误：60/70/100不符。", "3247": "D 正确：BGAN700对星完毕后会在显示屏幕显示READY。A/B/C 错误：SEARCHING/REGISTERING/BUSY不符。", "3248": "B 正确：BGAN500型海事卫星可提供的主要业务有语音、传真、数据。A/C/D 错误：视频/ADSL/数字中继不符。", "3249": "C 正确：BDC的主要中文含义是块下变频器（Block Down Converter）。A/B/D 错误：下行控制单元/系统控制总线/块上变频器不符。", "3250": "A 正确：BASS-260刷卡出现继电器闭合声但门开不了，原因是门锁的连接线未接触，主机没收到信号。B/C 错误：继电器坏/门锁不合格不符。", "3251": "C 正确：AUPC可用于全双工链路的自动功率控制。A/B/D 错误：单工/半双工/双工不符。", "3252": "C 正确：ATM信元的交换方式为电路交换和分组交换的组合。A/B/D 错误：电路交换/分组交换/毫无联系不符。", "3253": "B 正确：ATM协议工作在链路层。A/C/D 错误：物理层/网络层/传输层不符。", "3254": "A 正确：ARTEL DL400视频光端机使用的圆型光接口称为FC。B/C/D 错误：SC/LC/BNC不符。", "3255": "A 正确：ARQ机制是RLC AM（确认模式）主要功能。B/C/D 错误：RLC UM/PDCP/MAC不符。", "3256": "A 正确：ARP协议实现IP地址转换成MAC地址的功能。B/C/D 错误：MAC转IP/IP转SAP/URL转IP不符。", "3257": "C 正确：ARP协议的作用是将IP地址映射到第二层地址（MAC）。A/B/D 错误：广播IP/连接IP层TCP层/端口映射IP不符。", "3258": "D 正确：APS协议倒换时K1字节的源节点代码表示APS协议动作的源接点。A/B/C 错误：信号失效/桥接/倒换不符。", "3259": "A 正确：AMR-WB的帧长是20ms。B/C/D 错误：10/5/1不符。", "3260": "B 正确：ALOHA方式是指完全随机多址。A/C/D 错误：跳频码分/直接序列码分/固定多址不符。", "3261": "B 正确：AG与普通电话用户可通过双绞线进行相联。A/C/D 错误：网线/同轴电缆/光缆不符。", "3262": "A 正确：AGC功能的作用有降低阻塞干扰。B/C/D 错误：杂散/三阶互调/二次谐波干扰不符。", "3263": "C 正确：AGCH的作用是告知MS所分配的SDCCH。A/B/D 错误：跳频序列/切换信息/以上皆是不符。", "3264": "B 正确：ADSL技术传输距离与传输速率的关系是距离越远速率越低。A/C/D 错误：无关系/其他/越近越高不符。", "3265": "A 正确：ACU的主要中文含义是天线控制单元。B/C/D 错误：幅度控制/功率控制/信号控制不符。", "3266": "B 正确：AAU5612提供的CPRI接口最大带宽是4*24.33024Gbps。A/C/D 错误：带宽值不符。", "3267": "C 正确：AA-TDMA方式是指自适应调整TDMA方式。A/B/D 错误：预留信道/时隙ALOHA/纯随机不符。", "3268": "C 正确：Ⅰ级响应现场指挥成立以事发省（区、市）通信管理局指挥为主的现场通信保障应急指挥机构。A/B/D 错误：工信部/应急管理部/市通信管理局不符。", "3269": "C 正确：802.1Q标签头TPID的标准值为8100。A/B/D 错误：8147/8847/88A8不符。", "3270": "C 正确：802.11协议定义了无线的物理层和介质访问控制层。A/B/D 错误：层位组合不符。", "3271": "B 正确：802.11g向下兼容802.11b。A/C/D 错误：802.11a/e/f不符。", "3272": "D 正确：7米水泥电杆在普通土的洞深为1.4m。A/B/C 错误：0.8/1/1.2不符。", "3273": "A 正确：720P的含义为分辨率1280×720逐行扫描。B/C/D 错误：分辨率/隔行不符。", "3274": "C 正确：700W行波管功放的连续可调增益是25dB。A/B/D 错误：15/20/30不符。", "3275": "A 正确：7/8馈线最小弯曲半径为单次250mm、多次420mm。B/C/D 错误：弯曲半径不符。", "3276": "B 正确：60路IDR 2048KBps载频的通信容量，基带解调处理方式是ADPCM。A/C/D 错误：透明/CDMA/跳频不符。", "3277": "B 正确：5G专网中网络能力云是边缘计算的核心，通过边缘计算运营平台提供云网协同统一运营。A/C/D 错误：服务/运维/业务能力不符。", "3278": "A 正确：5G主要选择TDD制式。B/C/D 错误：FDD/UMTS/GSM不符。", "3279": "B 正确：5G初期终端产品形态以eMBB场景为主。A/C/D 错误：ICIC/mMTC/URLLC不符。", "3280": "A 正确：5G中的移动性管理属于AMF网元的功能。B/C/D 错误：SMF/PCF/UPF不符。", "3281": "A 正确：5G用户面协议栈基于LTE用户面协议栈，新增了SDAP层。B/C/D 错误：PDCP/RLC/MAC不符。", "3282": "D 正确：5G应急车桅杆上安装的设备是AAU。A/B/C 错误：RRU/ODU/CU-DU不符。", "3283": "D 正确：5G系统中UPF网元功能相当于SGW+PGW的网关。A/B/C 错误：AMF/PCF/SMF不符。", "3284": "D 正确：5G无线资源调度的最小单位是时隙。A/B/C 错误：子帧/符号/无线帧不符。", "3285": "A 正确：5G低时延高可靠场景时延要求小于等于1ms。B/C/D 错误：5/10/80不符。", "3286": "A 正确：5G网络引入网络切片技术应对差异化业务挑战。B/C/D 错误：边缘计算/SB/NFV-SDN不符。", "3287": "C 正确：5G网络要满足用户随时随地100Mbps以上的体验速率。A/B/D 错误：10/50/1000不符。", "3288": "B 正确：5G网络架构通过前传、中传、回传三部分实现分层接入、灵活终结、统一控制。A/C/D 错误：顺序不符。", "3289": "B 正确：5G网络测试中终端侧CPE与gNB之间测试距离要求大于10米。A/C/D 错误：5米/小于10/小于5不符。", "3290": "C 正确：5G通信与C波段卫星通信产生干扰时主要受干扰影响的是地面卫星站信号接收。A/B/D 错误：5G基站接收/卫星站发射/5G基站发射不符。", "3291": "D 正确：5G是ITU定义的第五代移动通信标准，正式名字是IMT-2020。A/B/C 错误：IMT-2000/2005/2010不符。", "3292": "C 正确：5G实验局NSA组网建议采用Option3x架构。A/B/D 错误：Option3/3a/7x不符。", "3293": "D 正确：5G每平方公里至少支持100万台设备。A/B/C 错误：1000/1万/10万不符。", "3294": "B 正确：5G理论速度可达到1Gbps。A/C/D 错误：100M/50M/500M不符。", "3295": "C 正确：5G控制信道和广播信道采用预定义权值生成离散的静态波束。A/B/D 错误：宽波束/半静态/动态不符。", "3296": "D 正确：5G空口下行物理信道不包括PRACH（PRACH是上行信道）。A/B/C 正确：PDSCH/PBCH/PDCCH均为下行信道。", "3297": "B 正确：5G建网初期要达到随时随地100Mbps的体验速率。A/C/D 错误：50M/1G/10G不符。", "3298": "A 正确：5G建网初期网络规划的边缘速率合理选择是50~100M。B/C/D 错误：10G/10M/1G不符。", "3299": "B 正确：5G基站和UPF服务器通过业务交换机和STN-A/B设备对接三层网关。A/C/D 错误：二层/四层/五层网关不符。", "3300": "D 正确：5G基站的CU和DU之间的传输属于5G传送网的中传部分。A/B/C 错误：都不是/回传/前传不符。", "3301": "A 正确：5G基站CU和DU之间的接口是F1接口。B/C/D 错误：NG/eCPRI/Xn不符。", "3302": "B 正确：5G功放支持4GHz以上高频段和更高功放效率需采用GaN材料。A/C/D 错误：Si/GaAs/LDMOS不符。", "3303": "B 正确：5G高频主要有应用常见是热点高容量。A/C/D 错误：连续广域覆盖/无人驾驶/物联网不符。", "3304": "A 正确：5G高频新空口主要应用于热点高容量场景。B/C/D 错误：连续广域覆盖/低时延高可靠/低功耗大连接不符。", "3305": "D 正确：大规模天线形成的波束非常（宽）的说法错误（波束窄），本题选错误项。A/B/C 正确：高频波长短可密集部署/可形成波束/相控阵可调移相器均正确。", "3306": "A 正确：5G定制网模式提供网+边+云+X的专属方案。B/C/D 错误：网+边/网+云/网+X不符。", "3307": "A 正确：5G定制网不包含尊享类型（尊享是联通品牌；电信定制网为致远/比邻/如翼）。B/C/D 正确：致远/比邻/如翼均为定制网类型。", "3308": "B 正确：5G定义的最小小区带宽是5MHz。A/C/D 错误：3/10/15不符。", "3309": "B 正确：5G定义的最小小区带宽是5MHz。A/C/D 错误：3/10/15不符。", "3310": "C 正确：5G的C波段中定义的两个相邻频点号的间隔是15kHz。A/B/D 错误：5/30/60不符。", "3311": "C 正确：5G单验时的选点RI要求至少不低于3。A/B/D 错误：1/2/4不符。", "288": "B 正确：扩频通信中干扰信号经解扩频处理后，其功率谱带宽变宽（干扰被展宽、功率谱密度降低）。A/C/D 错误：变窄/不变/与有用一致不符。", "289": "C 正确：宽带VSAT网中远端站需宽带宽或实时性较高业务时采用SCPC（单路单载波）。A/B/D 错误：MCPC/S-TDMA/广播不符。", "290": "B 正确：空气不流通的狭小地方使用二氧化碳灭火器可能造成缺氧危险（CO2排挤氧气）。A/C/D 错误：中毒/爆炸/着火不符。", "291": "A 正确：能上网不能打电话，可能是移动中心核心网络维护中心没做数据（核心网语音数据未配置）。B/C 错误：无线/传输中心不符。", "292": "B 正确：RRC重配丢失或未收到完成消息或eNB内部配置UE失败时，由MME发起释放。A/C/D 错误：UE/S-GW/PDN不符。", "293": "B 正确：开关电源监控中电池电流显示为负值表示电池正在放电（流出电流）。A/C 错误：充电/不一定不符。", "294": "A 正确：E1数字中继接口速率为2048kBit/s。B/C/D 错误：1544/144/8192不符。", "295": "B 正确：工信部应急网两个小站间通常采用网状结构实现通信（互为备份）。A/C/D 错误：树状/网树状/星状不符。", "296": "B 正确：静止卫星一问一答往返传播延迟约0.54秒（双程）。A/C/D 错误：0.27/0.36/0.77不符。", "297": "C 正确：井内作业安全注意事项有人孔周围设置安全标志、地面设专人监护（选C）。A 错误：打开井盖直接进入（必须先测气）。B 错误：不必须两人同时作业（应一人作业一人监护）。D 错误：不得用杆管代替梯子。E 错误：严禁在人孔内抽烟。", "298": "D 正确：压缩机工作电流测试应在制冷工作时状态下测试。A/B/C 错误：室外机工作/制热/开启时不符。", "299": "A 正确：上行业务调度使用的DCI格式是DCI0。B/C/D 错误：DCI1/DCI1A/DCI2A为下行格式。", "300": "D 正确：换星操作前应先检查机械限位（防止天线越限损坏）。A/B/C 错误：跟踪/极化/软限位不符。", "301": "B 正确：调制特性测试用SSPA时功率应回退2～3dB（保证线性）。A/C/D 错误：1-2/3-4/5-6不符。", "302": "D 正确：SDH误码测试误码率低于1e-11时认为系统误码指标合格。A/B/C 错误：0.01/1e-5/1e-8不符。", "303": "C 正确：接地配线是指设备连接到接地排的连接线（机架到接地排）。A/B/D 错误：埋地导线/接地体到接地排/设备到接地体不符。", "304": "A 正确：通信设备的机架接到直流接地系统上。B/C/D 错误：TN制设备/变压器电机/互感器二次绕组属保护接地。", "305": "B 正确：郊区农村大面积覆盖宜选用高增益天线（远距离覆盖）。A/C/D 错误：泄漏电缆/八木/吸顶不符。", "306": "D 正确：郊区建筑物穿透损耗典型值15dB。A/B/C 错误：30/25/20不符。", "307": "B 正确：交流配电室向设备供电前应确认无人员工作后方可供电，并挂警示牌。A/C 错误：检查/进入不符。", "308": "C 正确：江河湖泊水面上作业必须携带必要救生用具，穿好救生衣。A/B/D 错误：泳衣/泳镜/泳帽不符。", "309": "A 正确：监控主机“通道号”含义是输入通道号。B/C/D 错误：输出/自定义/厂商固定不符。", "310": "B 正确：监控单元电池电流为负值表示电池正在放电。A/C 错误：充电/不一定不符。", "311": "A 正确：架空光缆挂钩卡挂间距50cm、允许偏差±3cm，电杆两侧25cm处各设一挂钩。B/C/D 错误：组合不符。", "312": "A 正确：土壤电阻率100Ω·M以下时架空吊线地线接地电阻应小于20Ω。B/C/D 错误：30/35/45不符。", "313": "C 正确：极化分集发射功率分配到两副天线，约有3dB损失。A/B/D 错误：1/2/4dB不符。", "314": "C 正确：基站正式移交乙方维护40个工作日内，乙方应对设备器件完好率进行认定检测并建档。A/B/D 错误：15/30/60不符。", "315": "A 正确：机翼驻点处是空气与前缘相遇的地方（气流停滞点）。B/C 错误：后缘/都不正确不符。", "316": "A 正确：高压电线断落地面，导线断落点周围10米内禁止人员入内（防跨步电压）。B/C/D 错误：20/25/30不符。", "317": "A 正确：后备式UPS市电故障时逆变器才启动进行工作。B/C/D 错误：电池充电电路/静态开关/滤波器不符。", "318": "C 正确：精密空调去湿加热状态电功耗最大（压缩机+加热器同时工作）。A/B/D 错误：制冷/制冷加湿/加热加湿功耗次之。", "319": "B 正确：海蛇致命但可食用（肉可食、毒在毒腺）。A/C/D 错误：水母/河豚/鸡心螺不可食或危险。", "320": "B 正确：光纤资源充足或DU分布式部署场景，5G前传方案以光纤前传为主。A/C/D 错误：无源WDM/WDM PON/有源WDM不符。", "321": "B 正确：光接收机再生任务是把升余弦波形恢复成数字信号（判决再生）。A/C/D 错误：模拟/电子/光子信号不符。", "322": "C 正确：光纤通信中传输带宽是决定中继距离的主要因素之一。A/B/D 错误：芯径/抗电磁干扰/电调制方式不符。", "323": "C 正确：光纤通信系统中光波、光纤、光电转换器分别用作载波、传输媒介、光源和光电检测器（组合最完整）。A/B/D 错误：用途组合不符。", "324": "C 正确：光纤通信目前普遍采用1.31μm、1.55μm光波长（低损耗窗口）。A/B 错误：0.63/0.85组合为早期。", "325": "B 正确：保证传输信道光单向传输时采用光隔离器。A/C/D 错误：衰减器/耦合器/连接器不符。", "326": "A 正确：EDFA作前置放大器使用可显著提高光接收机灵敏度（低噪声放大微弱信号）。B/C/D 错误：后置/功率/中继不符。", "327": "C 正确：SC/PC中“/”后半部分PC表示光纤接头截面工艺（研磨方式）。A/B/D 错误：光纤类型/制作工艺/连接器工艺不符。", "328": "B 正确：光通信中一个法兰盘损耗约0.5dB。A/C/D 错误：0.2/0.9/1.2不符。", "329": "A 正确：1490nm光信号每公里损耗约0.36dB。B/C/D 错误：0.90/0.72/0.18不符。", "330": "A 正确：ODN 1:16光分路器损耗约12dB（理论10log16≈12）。B/C/D 错误：9/16/14不符。", "331": "A 正确：新ECC协议栈分配IP按照机架内光板启动的顺序分配。B/C/D 错误：槽位顺序/任意/确定顺序不符。", "332": "A 正确：故障检测中可检测连通性的命令是PING。B/C/D 错误：SHOW VERSION/IPCONFIG/DISPLAY不符。", "333": "B 正确：目前主流防火墙采用应用状态检测技术（状态检测包过滤）。A/C/D 错误：简单包过滤/代理/防病毒不符。", "334": "C 正确：高原地区作业需穿戴紫外线防护装备（高原紫外线强）。A/B/D 错误：日光照射/防水/红外线不符。", "335": "C 正确：高压线下方作业时身体及金属工具距高压线及电力设施至少4米。A/B/D 错误：2/3/5不符。", "3312": "D 正确：5G单验时SIM卡签约速率要求不低于2Gbps。A/B/C 错误：500M/800M/1G不符。", "3313": "B 正确：5G场景中URLLC是超可靠、低时延通信。A/C 错误：海量机器类/增强型移动宽带不符。", "3314": "C 正确：5G场景中eMBB是增强型移动宽带。A/B 错误：海量机器类/超可靠低时延不符。", "3315": "A 正确：5G参数集包含SCS+CP（子载波间隔+循环前缀）。B/C/D 错误：BWP/Bandwidth/Slot format不符。", "3316": "B 正确：5G边缘计算功能组成为UPF+MEC平台。A/C/D 错误：AMF/NEF/NRF与MEC组合不符。", "3317": "A 正确：5G NR的信道带宽利用率最高可达98.28%。B/C/D 错误：90.28/92.55/97.32不符。", "3318": "A 正确：5G NGC中AMF网络功能负责终端的移动性管理。B/C/D 错误：SMF/AUSF/UPF不符。", "3319": "C 正确：5GC下发用于标识终端用户切片信息是S-NSSAI。A/B/D 错误：vlan/slice ID/基站接口IP不符。", "3320": "D 正确：5GC融合计费场景引入SCP负责SMF和CHF之间计费请求和响应消息的转发。A/B/C 错误：SMF/CHF/CGF不符。", "3321": "C 正确：568B线序为白橙、橙、白绿、蓝、白蓝、绿、白棕、棕。A/B/D 错误：线序不符。", "3322": "C 正确：568B线序测试仪指示灯顺序应为12345678，显示13245678说明网线制作错误，应重做。A/B/D 错误：正常连接/交叉线/双机互联不符。", "3323": "A 正确：568B线序在网络测试仪上指示灯顺序是12345678。B/C/D 错误：顺序不符。", "3324": "C 正确：50欧姆同轴电缆是指电缆的终端匹配器电阻为50欧姆（特性阻抗）。A/B/D 错误：中心导体电阻/星导体屏蔽电阻/连接件电阻不符。", "3325": "C 正确：4K视频的传输速率是12Gbps。A/B/D 错误：10/11/14不符。", "3326": "D 正确：4K的分辨率是3840*2160。A/B/C 错误：512*1024/1920*1080/1920*2160不符。", "3327": "A 正确：4K采用H.265编码技术。B/C/D 错误：H.263/H.264/H.262不符。", "3328": "D 正确：4K SDI数字视频信号的码率为12Gbps。A/B/C 错误：1.5G/3G/6G不符。", "3329": "A 正确：4G中PRACH信道在每个子帧上最多只能配置1个。B/C/D 错误：2/3/4不符。", "3330": "A 正确：4G中PRACH信道时域位置由PRACH Configuration Index参数决定。B/C/D 错误：Preamble Format/ZCZCConfig/Ncs不符。", "3331": "C 正确：4G基站BBU和RRU设备之间通过光纤传输（CPRI）。A/B/D 错误：双绞线/同轴电缆/跳线不符。", "3332": "D 正确：-48V直流供电系统中衡重杂音电压≤4mv。A/B/C 错误：1/2/3不符。", "3333": "D 正确：-48V直流电源全程最大允许压降为3.2V。A/B/C 错误：1/2/5不符。", "3334": "B 正确：-48V直流电源电压变动范围为-40V～-57V。A/C/D 错误：范围不符。", "3335": "B 正确：48V电源系统直流放电回路全程压降不应大于3.2V。A/C/D 错误：2/4.1/5.3不符。", "3336": "A 正确：40W功率按dBm单位折算为46dBm（10lg40000=46）。B/C/D 错误：-36/36/-46不符。", "3337": "C 正确：Nera mini-m天线对星方向是东南方向。A/B/D 错误：西南/东北/西北不符。", "3338": "B 正确：3GPP R8及以后的SGSN与MME之间的接口是S3。A/C/D 错误：S6/S4/S12不符。", "3339": "B 正确：3GPP R16协议中定义的毫米波中最大带宽会到400MHz。A/C/D 错误：100/60/20不符。", "3340": "B 正确：2V电池串联使用中若有一个蓄电池反极，使电池组电压减少4V以上。A/C/D 错误：2/6/8不符。", "3341": "B 正确：2MBps IDR业务卫星的分配带宽为2002.5KHz。A/C/D 错误：1552.8/2048/2144不符。", "3342": "A 正确：24GHz频段最多可以划分为14个信道。B/C/D 错误：13/11/3不符。", "3343": "D 正确：20MHz小区支持的子载波个数为1200（100RB×12）。A/B/C 错误：300/600/900不符。", "3344": "C 正确：2023年5月12日是我国第15个全国“防灾减灾日”。A/B/D 错误：11/13/14不符。", "3345": "C 正确：2023年5月12日全国“防灾减灾日”主题是防范灾害风险、护航高质量发展。A/B/D 错误：主题不符。", "3346": "A 正确：2022年计划在北京和张家口举办的冬奥会属于一类活动。B/C/D 错误：二/三/四类不符。", "3347": "C 正确：2016年世界首颗量子科学实验卫星墨子号发射。A/B/D 错误：中星16/量子号/亚太6D不符。", "3348": "B 正确：1毫瓦与1瓦约相差30dB（10lg1000）。A/C/D 错误：20/1000/100不符。", "3349": "C 正确：1根10米架内跳纤受损，通常使用可见光笔查找受损点位置。A/B/D 错误：光源/光功率计/尾纤识别仪不符。", "3350": "B 正确：1W等于30dBm。A/C/D 错误：20/33/40不符。", "3351": "A 正确：1964年8月19日美国发射了世界上第一颗地球同步静止轨道通信卫星“同步3号”。B/C/D 错误：法国/原苏联/中国不符。", "3352": "C 正确：1957年10月4日原苏联发射了第一颗人造地球卫星。A/B/D 错误：美国/法国/中国不符。", "3353": "C 正确：18GHz/21GHz与800MHz室内链路损耗相差约10dB。A/B/D 错误：6/8/12不符。", "3354": "B 正确：18000英尺高度的大气重量仅仅是海平面时的一半。A/C 错误：三分之一/四分之一不符。", "3355": "A 正确：1740号码欠费之后具体拆机销户时间是3个月。B/C/D 错误：2/1/6不符。", "3356": "D 正确：16APSK调制中每个编码符号可以携带4个比特信息。A/B/C 错误：1/2/3不符。", "3357": "A 正确：15+19*5描述的结构是1.5mm钢丝+5根1.9mm（钢丝绞合）。B/C/D 错误：根数/FRP不符。", "3358": "B 正确：1310nm波长的激光在G.652光纤中每公里衰减值一般为0.25db左右。A/C/D 错误：0.4/1/0.5不符。", "3359": "B 正确：127.0.0.1是环回地址，题目说12710051不是环回地址是错误的，本题答“错误”。A 错误：答“对”不符。", "3360": "D 正确：127.0.0.1代表自环地址（环回地址）。A/B/C 错误：组播地址/E类地址/广播地址不符。", "3361": "A 正确：10KV三相供电电压允许偏差为额定电压的±7%。B/C 错误：±10/+7-10不符。", "3362": "D 正确：1:8功分器不带放大，输入信号比输出信号高9dB（10lg8）。A/B/C 错误：2/4/6不符。", "3363": "C 正确：1:4功率分配器的插入损耗是6dB（10lg4）。A/B/D 错误：3/4/9不符。", "3364": "D 正确：1:4功分器的插入损耗为6dB。A/B/C 错误：4/3/2不符。", "3365": "D 正确：1:32的光分器光功率损耗约为17dB（10lg32=15+2≈17）。A/B/C 错误：9/20/12不符。", "3366": "C 正确：1:2分光器衰减约3db，1:64分光器衰减大约稍大于18db（10lg64=18）。A/B/D 错误：15/12/9不符。", "3367": "C 正确：1:16的光分器光功率损耗约为12dB（10lg16=12）。A/B/D 错误：9/15/18不符。", "3368": "B 正确：PDSCH用于传输来自DL-SCH和PCH的数据（RAR、Paging等）。A/C/D 错误：BCH/RACH/UL-SCH不符。", "3369": "B 正确：《中华人民共和国无线电管理条例》是行政法规。A/C 错误：法律/部门规章不符。", "3370": "B 正确：《中华人民共和国网络安全法》自2017年6月1日起施行（42887为Excel序列日期）。A/C/D 错误：日期不符。", "3371": "B 正确：《中华人民共和国突发事件应对法》由第十届全国人民代表大会常务委员会通过。A/C/D 错误：九/十一/十二不符。", "3372": "C 正确：《突发事件应对法》由第十届全国人大常委会于2007年8月30日通过（45231为Excel序列日期）。A/B/D 错误：日期不符。", "3373": "B 正确：《中华人民共和国民用航空法》自1996年3月1日起施行。A/C 错误：日期不符。", "3374": "D 正确：《中华人民共和国劳动法》自1995年1月1日起施行（34700为Excel序列日期）。A/B/C 错误：日期不符。", "3375": "B 正确：《中国民用航空法》中“航空人员”指从事民用航空活动的空勤人员和地面人员。A/C 错误：空勤人员/飞行人员和地面人员不符。", "3376": "A 正确：“飞行人员”指在飞行中直接操纵航空器和航空器导航设备的人员。B/C 错误：机组/机长和副驾驶不符。", "3377": "A 正确：《网络安全法》规定网络运营者应当制定网络安全事件应急预案。B/C/D 错误：补救措施/演练方案/规章制度不符。", "3378": "A 正确：《突发事件应对法》预警级别分为红、橙、黄、蓝四级。B/C/D 错误：颜色顺序不符。", "3379": "B 正确：《生产安全事故报告和调查处理条例》规定事故发生后事故现场有关人员应当立即向本单位负责人报告。A/C 错误：安全管理人员/特种作业人员不符。", "3380": "C 正确：《劳动法》规定劳动合同自依法订立之日起生效。A/B/D 错误：签字之日起/签字盖章之日起/鉴证之日起不符。", "3381": "D 正确：《国家突发公共事件总体应急预案》规定特别重大或重大突发公共事件发生后，各地区各部门要在4小时内向国务院报告。A/B/C 错误：1/2/3不符。", "3382": "A 正确：《安全生产法》所指危险品包括易燃易爆物品、危险化学品、放射性物品等。B/C 错误：枪支弹药/高压气瓶手持电动工具不符。", "3383": "A 正确：《安全生产法》将安全第一、预防为主规定为我国安全生产工作的基本方针。B/C/D 错误：加大惩罚/群防群治/确保安全不符。", "3384": "A 正确：《安全生产法》规定的安全生产管理方针是安全第一、预防为主。B/C 错误：安全为了生产/人人有责不符。", "3385": "B 正确：《“十四五”国家应急体系规划》指出要“坚持依法治理，运用法治思维和法治方式”。A/C/D 错误：法治法制组合不符。", "3386": "A 正确：《“十四五”国家应急体系规划》提出健全中央统筹指导、地方作为主体、灾区群众广泛参与的机制。B/C/D 错误：地方应急部门/公安/党委不符。", "3387": "C 正确：“失速”指的是飞机以大于临界迎角飞行。A/B 错误：失去速度/速度太快不符。", "3388": "B 正确：“三线交越”规范与电力用户线交越在0.6米以上。A/C/D 错误：0.4/0.8/1不符。", "3389": "B 正确：“第一宇宙速度”又称环绕速度，从地球表面发射卫星所需最低速度为7.9Km/s。A/C/D 错误：6.5/11.2/16.7不符。", "3390": "C 正确：“低时延高可靠通信”对应5G的uRLLC场景。A/B/D 错误：eMBB/eNBB/mRLLC不符。", "3391": "A 正确：“打虎”、“拍蝇”、“猎狐”多管齐下，反腐败斗争取得压倒性胜利并全面巩固。B/C 错误：党风廉政建设/党风政风建设不符。", "3392": "C 正确：电源和配电两者组合统称为供电系统。A/B 错误：电缆和配电/电源和电缆不符。", "3393": "C 正确：固定翼航空器平台结构通常包括机翼、机身、尾翼和起落架等。A/B 错误：单旋翼/多旋翼不符。", "3394": "C 正确：供电系统的功能是向无人机各用电系统或设备提供满足预定设计要求的电能。A/B 错误：配电系统/电源不符。", "3395": "D 正确：(Co+No)/No的测试是用频谱仪来测量的。A/B/C 错误：选频表/功率计/频率计数器不符。", "3396": "C 正确：CDM625最多能支持四个E1接口。A/B/D 错误：CDM600/CDM570(L)/CDM550不符。", "3397": "B 正确：通信机房主要分为有人职守的机房和无人职守的机房。A/C/D 错误：电力/传输机动/数据机房不符。", "3398": "A 正确：国务院制定国家突发事件总体应急预案，组织制定国家突发事件专项应急预案。B/C/D 错误：国务院有关部门/全国人大常委会/省级政府不符。", "3399": "D 正确：外部预警信息指电信行业外突发的可能需要通信保障或可能对通信网产生重大影响的事件警报。A/B/C 错误：国家/国际/内部预警信息不符。", "3400": "A 正确：G/T值指地球站接收机入口天线增益与系统噪声温度的比值，表示接收品质因数。B/C/D 错误：EIRP/ELU-ALU/BER不符。", "3401": "B 正确：严禁在互联网上发布国家秘密信息或在公共论坛发布涉及国家秘密的内容。A/C 错误：禁止/严格不符。", "3402": "A 正确：保密性原则保证只有发送方与接收方能访问消息内容。B/C/D 错误：鉴别/完整性/访问控制不符。", "3403": "C 正确：公民、法人和其他组织有义务参与突发事件应对工作（全选）。A/B/D 错误：单一主体不符。", "3404": "A 正确：工会组织应参加职工伤亡事故和职业危害的调查处理。B/C/D 错误：环保部门/财务部门/上级部门不符。", "3405": "C 正确：15m以上的高空作业必须办理高空作业审批手续。A/B/D 错误：5/10/20不符。", "3406": "D 正确：OTDR仪表可进行光纤长度、传输衰减、接头衰减和故障定位等测量。A/B/C 错误：光源/光功率计/多波长计不符。", "3407": "C 正确：国务院信息产业主管部门依照《中华人民共和国电信条例》的规定对全国电信业实施监督管理。A/B/D 错误：通信管理局/运营商/国务院不符。", "3408": "D 正确：卷积云一般预示着晴朗的天气。A/B/C 错误：高层云/层积云/卷层云不符。", "3409": "B 正确：TDMA要求有精确的同步，保证各地球站信号按指定时隙传输不发生时间重叠。A/C/D 错误：CDMA/FDMA/SDMA不符。", "3410": "C 正确：越区覆盖需要通过增大天线下倾角或降低天线高度来解决。A/B/D 错误：上下行弱覆盖/切换失败不符。", "3411": "D 正确：SSL协议主要用于加密机制。A/B/C 错误：HTTP/FTP/TELNET不符。", "3412": "A 正确：UDM/UDR为每个UE签约支持的NSSAI。B/C/D 错误：PCF/NRF/NSSF不符。", "3413": "B 正确：ODN为OLT与ONU之间提供光传输手段，完成光信号功率分配任务。A/C/D 错误：OLT/ONU/ONT不符。", "3414": "B 正确：网状网中的各卫星小站彼此可经卫星直接沟通。A/C/D 错误：星状网/树形网/环形网不符。", "3415": "B 正确：网状网中各VSAT站彼此可经卫星直接沟通，是无中心、分散的网络结构。A/C/D 错误：星形网/混合网络/环状网不符。", "3416": "C 正确：链形网络拓扑是将网中的节点一一串联，首尾两端开放。A/B/D 错误：网孔形/星形/树形不符。", "3417": "C 正确：环型网络具有自愈能力。A/B/D 错误：链型/星型/总线型不符。", "3418": "B 正确：SaaS通过网络运行，为最终用户提供应用服务。A/C/D 错误：PaaS/IaaS/MEC不符。", "3419": "D 正确：雷雨天不得在电杆、铁塔、大树、广告牌下躲避。A/B/C 错误：炎热/寒冷/冰雪不符。", "3420": "C 正确：树形拓扑可以看成线形拓扑结构和星形拓扑结构的结合。A/B/D 错误：线形/星形/环形不符。", "3421": "A 正确：团结奋斗是中国人民创造历史伟业的必由之路。B/C/D 错误：团结统一/一致/一心不符。", "3422": "C 正确：蒸发器中产生的水是制冷系统中水分的主要来源。A/B/D 错误：托盘漏水/外界空气渗入/器件损坏不符。", "3423": "B 正确：漂移指数字信号特定时刻相对理想时间位置的长时间偏离。A/C/D 错误：抖动/取空/溢出不符。", "3424": "C 正确：误码指经接收、判决、再生后数字码流中某些比特发生差错，使传输信息产生损伤。A/B/D 错误：乱码/错码/差错码不符。", "3425": "A 正确：圆极化波指电场强度合成矢量端点随时间变化所描绘的轨迹是圆。B/C/D 错误：线极化/椭圆极化/正交极化不符。", "3426": "A 正确：永久性封堵指采用完整、能达到规定耐火极限、起到防火防烟功能的防火封堵系统。B/C/D 错误：临时性/工序性/间隙性不符。", "3427": "C 正确：MPCP是在OLT和ONU之间规定的一种控制机制。A/B/D 错误：CRC/FCS/LLID不符。", "3428": "D 正确：跳纤用于网元设备光口之间、或光口与ODF等配线设施端子之间、或ODF端子之间的连接。A/B/C 错误：尾纤/法兰/OTDR不符。", "3429": "B 正确：尾纤用于光缆与网元设备或ODF等配线设施连接，只用一端有连接插头。A/C/D 错误：法兰/OTDR/跳纤不符。", "3430": "D 正确：消防和抢险是应急救援工作的核心内容之一，目的是尽快控制事故发展、防止蔓延。A/B/C 错误：人群疏散/伤员治疗/警戒治安不符。", "3431": "B 正确：通播组呼叫是一种一点对多点、同时与多个通话组进行通信的呼叫方式。A/C/D 错误：组呼/紧急呼叫/私密呼叫不符。", "3432": "D 正确：LDPC是先进的前向纠错技术，性能更接近Shannon极限。A/B/C 错误：TPC/VIT/VIT+RS不符。", "3433": "A 正确：马克思主义是我们立党立国、兴党兴国的根本指导思想。B/C 错误：中华优秀传统文化/毛泽东思想不符。", "3434": "A 正确：功率放大器是卫星通信系统的关键部件，负责将射频信号放大并传送到天线。B/C/D 错误：上变频器/LNB/下变频器不符。", "3435": "D 正确：卷层云是唯一会在太阳或月亮周围产生光晕的云层。A/B/C 错误：卷云/卷积云/层积云不符。", "3436": "A 正确：通信电源是通信局（站）电源的主体和关键组成部分。B/C/D 错误：整流器/防雷器/逆变器不符。", "3437": "D 正确：中国特色社会主义是实现中华民族伟大复兴的必由之路。A/B/C 错误：改革开放/从严治党/社会主义不符。", "3438": "A 正确：Ku上变频器是实现信号从IF到RF转换的单元设备。B/C/D 错误：MODEM/高功放/Ku下变频器不符。", "3439": "A 正确：安全生产责任制是生产经营单位各项安全生产规章制度的核心。B/C/D 错误：领导负责制/岗位职责/安全工作准则不符。", "3440": "B 正确：本机振荡器是上下变频器实现变频的元件。A/C/D 错误：低噪放/衰减器/滤波器不符。", "3441": "D 正确：3.5GHz是全球5G中低频部署的最主流频段。A/B/C 错误：1.8/2.1/2.6不符。", "3442": "C 正确：客户是企业生存和发展的根基。A/B/D 错误：领导/员工/设备供应商不符。", "3443": "B 正确：IP是面向无连接的控制平面和转发平面，MPLS是面向无连接的控制平面，ATM是面向连接。A/C/D 错误：组合不符。", "3444": "B 正确：时间分集是利用基站和移动台的RAKE接收机来完成的。A/C/D 错误：频率分集/空间分集/都不是不符。", "3445": "C 正确：端口聚合是将多个端口聚合在一起形成汇聚组，实现负荷在成员端口分担。A/B/D 错误：端口组/负载均衡/绑定不符。", "3446": "C 正确：OSPF是基于链路状态的路由协议。A/B/D 错误：静态路由/RIP/IGRP不符。", "3447": "D 正确：电压和频率是衡量电力系统电能质量的两个基本参数。A/B/C 错误：功率/电流组合不符。", "3448": "A 正确：MMSS是海事卫星通信系统的缩写（Maritime Mobile Satellite Service）。B/C/D 错误：AMSS/LMSS/INMARSAT不符。", "3449": "D 正确：电信监管是国家对电信行业依法进行的监督和管理。A/B/C 错误：互联互通/价格控制/服务监管不符。", "3450": "A 正确：云网是服务行业最优的5G网络模式。B/C/D 错误：行业虚拟专网/专线/无线网不符。", "3451": "C 正确：P-GW是分组数据接口的终接点，与各分组数据网络连接提供会话连接。A/B/D 错误：MME/S-GW/HSS不符。", "3452": "A 正确：NCC是地球站的网络控制中心（Network Control Center）。B/C/D 错误：IDU/ACU/ODU不符。", "3453": "B 正确：全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。A/C/D 错误：自我革命/反腐败斗争/纪律建设不符。", "3454": "A 正确：单位行政第一把手是本单位安全生产的第一责任人。B/C/D 错误：分管领导/安全生产领导小组/综合部不符。", "3455": "A 正确：生命安全和职业健康是安全生产本质的核心。B/C/D 错误：设备安全/环境安全/资产安全不符。", "3456": "D 正确：TCP/IP是Internet的核心协议。A/B/C 错误：UDP/X.25/ICMP不符。", "3457": "B 正确：A2事件指服务小区质量低于一个绝对门限，用于打开频间测量和激活gap。A/C/D 错误：A1/A3/A4不符。", "3458": "D 正确：电气事故按照灾害形式可以分为人身事故、设备事故、火灾、爆炸等。A/B/C 错误：安全/机房/火灾不符。", "3459": "D 正确：LNA设备属于卫星地面站下行射频设备。A/B/C 错误：UPC/HPA/BUC不符。", "3460": "D 正确：电气设备必须有保护性接地、接零装置，并经常检查连接的牢固性。A/B/C 错误：电能/电路/电流不符。", "3461": "B 正确：ICT融合是运营商在MEC的差异化优势。A/C/D 错误：IDC/COP/BPO不符。", "3462": "D 正确：更换过磁罗盘部件安装位置、使用地点距上次使用远、起飞后自己飘移都需要对无人机进行磁罗盘校准（以上均是）。A/B/C 错误：单一情况不符。", "3463": "A 正确：1.12GHz-2.6GHz频率属于L波段。B/C/D 错误：4-8/12-14/20-30不符。", "3464": "B 正确：500kHz是莫尔斯无线电报的国际遇险和呼叫频率。A/C/D 错误：150/490/518不符。", "3465": "B 正确：3名及以上驾驶员持有《准驾证》的车辆单位必须建立驾驶员学习小组。A/C/D 错误：2/5/8不符。", "3466": "A 正确：二氧化碳灭火器原理是依靠窒息作用和部分冷却作用灭火。B/C/D 错误：泡沫/干粉/水基不符。", "3467": "B 正确：两路RS232数据占用一个64k时隙。A/C/D 错误：一/三/四不符。", "3468": "D 正确：空间复用类MIMO技术能够提升传输速率。A/B/C 错误：接收分集/发射分集/空分多址不符。", "3469": "A 正确：RoHC可大大降低头开销，提高VoLTE语音用户容量、数据吞吐量、增强边缘覆盖。B/C 错误：SPS/TTI bundling不符。", "3470": "D 正确：ARQ纠错方式是有反馈控制（自动重传请求）。A/B/C 错误：CRC/Viterbi/QPSK不符。", "3471": "B 正确：DRS仅用于波束赋型模式，用于UE解调。A/C/D 错误：DMRS/SRS/CRS不符。", "3472": "A 正确：SRVCC解决语音控制和移动到CS网络切换时的语音连续性问题。B/C/D 错误：EPC/MME/IMS不符。", "3473": "D 正确：通信保障应急指挥机构接到事件信息报告后应立即采取应对措施并及时上报。A/B/C 错误：工信部/通信管理局/运营企业不符。", "3474": "A 正确：OFDM将信道分成若干正交子信道，将高速数据信号转换成并行的低速子数据流。B/C/D 错误：MIMO/HARQ/AMC不符。", "3475": "C 正确：韩国建立了第一个EVDO Rev0商用网络。A/B/D 错误：美国/日本/香港不符。", "3476": "B 正确：MIMO技术是在不相关的各个天线上分别发送多个数据流，不增加带宽和天线发送功率提高速率。A/C/D 错误：OFDM/HARQ/AMC不符。", "3477": "D 正确：光波分复用技术可使单一波长的光信道变为数个不同波长的光信道同时传输。A/B/C 错误：光时分/光频分/微波副载波不符。", "3478": "C 正确：六级大风（包括六级）以上时应停止脚手架作业。A/B/D 错误：四/五/七级不符。", "3479": "A 正确：LEO（低轨）轨道卫星信号传输时延最小。B/C/D 错误：MEO/GEO/SEO不符。", "3480": "C 正确：GEO（静止轨道）轨道卫星波束覆盖范围最大。A/B/D 错误：LEO/MEO/VLEO不符。", "3481": "B 正确：SDH光端机一般容量较大，可达16E1-4032E1。A/C/D 错误：PDH/SPDH/PSDH不符。", "3482": "A 正确：PDH光端机是点到点应用，容量较小，一般4E1、8E1、16E1。B/C/D 错误：SDH/SPDH/PSDH不符。", "3483": "A 正确：完整、准确、全面贯彻新发展理念，着力推动高质量发展（①②③）。B/C/D 错误：组合不符。", "3484": "A 正确：工业和信息化部负责制定相关标准，明确国家级专业队伍的认定条件。B/C/D 错误：省公司/本单位/通信管理局不符。", "3485": "A 正确：国家网信部门负责统筹协调网络安全工作和相关监督管理工作。B/C/D 错误：电信主管部门/公安部门/以上均是不符。", "3486": "A 正确：工业和信息化部负责国家级专业队伍的资格认定、业务指导、指挥调度和监督检查。B/C/D 错误：省通信管理局/各集团公司/国家应急办不符。", "3487": "C 正确：工业和信息化部负责国家级专业队伍的资格认定、业务指导、指挥调度和监督检查。A/B/D 错误：本单位/应急管理局/省公司不符。", "3488": "B 正确：S-GW负责UE用户平面数据传送、转发和路由切换。A/C/D 错误：MME/P-GW/HSS不符。", "3489": "D 正确：雷电放电具有电流大、电压高等特点，其能量释放出来可能产生极大的破坏力。A/B/C 错误：滚雷/高压电/雷击不符。", "3490": "C 正确：BOX限位方式不是为了保护天线而设定。A/B/D 正确：软限位/预限位/机械限位均为天线保护方式。", "3491": "A 正确：无线接通率反映小区对UE呼叫的接纳能力，直接影响用户对网络使用的感受。B/C/D 错误：RRC建立成功率/E-RAB建立阻塞率/E-RAB建立成功率不符。", "3492": "C 正确：E-RAB掉话率反映系统的通讯保持能力。A/B/D 错误：E-RAB建立阻塞率/切换成功率/RRC重建成功率不符。", "3493": "D 正确：散射发生在粗糙表面、小物体或其它不规则物体，如树叶、街道标志和灯柱等。A/B/C 错误：直射/反射/绕射不符。", "3494": "B 正确：县级人民政府对本行政区域内突发事件的应对工作负责。A/C/D 错误：省级/当地政府/卫生行政部门不符。", "3495": "D 正确：驻波比定义为波腹电压与波节电压之比。A/B/C 错误：行波系数/反射系数/回波损耗不符。", "3496": "A 正确：OLT的作用是为光接入网提供网络侧与本地交换机之间的接口，并经ODN与用户相连。B/C/D 错误：ODN/ONU/ONT不符。", "3497": "D 正确：已结束已确认的告警可以在历史库中查询到。A/B/C 错误：未结束/未确认状态不符。", "3498": "C 正确：GFP的封装效率与净荷内容无关，无需透明性处理，网络安全性较高。A/B/D 错误：PPP-HDLC/LAPS/都不是不符。", "3499": "D 正确：32PSK的调制方式对C/N的门限要求最高（高阶调制）。A/B/C 错误：QPSK/8PSK/16QAM不符。", "3500": "C 正确：气缸总容积与燃烧室容积的比值称为压缩比。A/B/D 错误：容积比不符。", "3501": "B 正确：EIRP代表为使接收天线接收到相同功率，一个各向同性天线必须发射的等效功率。A/C/D 错误：G/T/ELU-ALU/BER不符。", "3502": "D 正确：选用低轨道卫星措施可以降低卫星通信的传输时延。A/B/C 错误：高通量/高轨/大功率卫星不符。", "3503": "A 正确：PLMN参数用于配置切片List所属运营商的公共陆地移动网络。B/C/D 错误：TAC/切片区分标识/切片子网实例ID不符。", "3504": "B 正确：MIMO技术是在不相关各个天线上分别发送多个数据流，利用多径衰落，不增加带宽和天线发送功率提高容量。A/C/D 错误：OFDM/HARQ/AMC不符。", "3505": "D 正确：动物疫情不属于自然灾害（属于公共卫生事件）。A/B/C 正确：水旱灾害/气象灾害/海洋灾害均属自然灾害。", "3506": "D 正确：人井抽水不是日常维护工作（是周期性专项维护）。A/B/C 正确：除草培土/刷字描漆/清除杂物均为日常维护。", "3507": "A 正确：地面中继站不是海事卫星通信系统的组成部分。B/C/D 正确：岸站/船站/通信卫星均为海事卫星通信系统组成部分。", "3508": "B 正确：光缆熔接机法不是常用的衰减测试方法。A/C/D 正确：剪断法/插入法/OTDR法均为常用衰减测试方法。", "3509": "D 正确：软切换不是LTE切换技术特点（LTE是硬切换）。A/B/C 正确：硬切换/后向切换/终端辅助切换均为LTE切换特点。", "3510": "C 正确：铃流不能通过交换机的数字交换网络(DSN)。A/B/D 正确：话音/信号音/DTMF信令均可通过。", "3511": "C 正确：多径干扰不会对卫星通信信号产生影响（卫星链路视距传输无多径）。A/B/D 正确：大气损耗/雨衰/时延均影响卫星通信。", "3512": "D 正确：数值口径表征了光纤的集光能力。A/B/C 错误：折射率/模场直径/截止波长不符。", "3513": "A 正确：G/T表示地球站接收卫星信号的能力。B/C/D 错误：EIRP/ELU-ALU/BER不符。", "3514": "A 正确：在线式UPS中切换时间最短（零切换）。B/C/D 错误：在线互动式/后备式/互动式不符。", "3515": "C 正确：50mA（有效值）以上的工频交流电流通过人体，一般可能引起心室颤动或心脏停止跳动。A/B/D 错误：20/40/100不符。", "3516": "C 正确：0dBm属于测试用的电视伴音信号的标准电平。A/B/D 错误：3/1/-3不符。", "3517": "B 正确：2016年8月6日被誉为中国版海事卫星的天通一号01星发射升空进入地球同步轨道。A/C/D 错误：年份不符。", "3518": "A 正确：降低天线高度可以减小信号的覆盖范围，但是能够提高系统的容量。B/C/D 错误：增加高度/增大倾角/减小倾角不符。", "3519": "AB 正确：做放电试验时通常需要假负载和电压表工具。C/D 错误：示波器/电导仪不符。", "3520": "ABC 正确：最常用的信号调制方式有幅度键控、频率键控、相位键控。", "3521": "BCD 正确：综合性应急演练过程可分为演练准备、演练实施、演练总结三个阶段。A 错误：演练策划不符。", "3522": "ABC 正确：自然灾害主要包括水旱灾害、地震灾害、气象灾害、地质灾害、海洋灾害、生物灾害和森林草原火灾等。D 错误：原子弹爆炸不符。", "3523": "ABCD 正确：自救互救要领包括事先在避灾场所搭建临时住所、将部分生活用品转移、适当准备交换物资、准备充足食品和饮用水。", "3524": "ABC 正确：自动寻星天线室外部分包括卫星天线、LNB、BUC。D 错误：调制解调器是室内设备。", "3525": "ABD 正确：自动化机组自动保护功能测试主要项目有过速保护、水温高保护、机油油压低保护。C/E 错误：机油油压高/故障停车不符。", "3526": "ACD 正确：自动对星要进行DEPLOY、LOCATE、POSITIONN三个操作。B 错误：SETTINGS不符。", "3527": "ACD 正确：自承式架空光缆初始垂度由吊线原始垂度、架挂方式、光缆结构重量等多方面因素决定。B 错误：架空高度不符。", "3528": "BD 正确：转发器通常分为透明转发器和处理转发器两种基本类型。A/C 错误：遥测/控制转发器不符。", "3529": "AD 正确：专业队伍应配备与日常办公、车辆安置、设备保管以及日常训练等业务工作相适合的场所。B/C 错误：维护建设/物资储备不符。", "3530": "AB 正确：专业队伍主要负责人由本单位或省公司分管领导、二级部门主要领导担任。C/D 错误：部门领导/省管局领导不符。", "3531": "ABC 正确：专业队伍应建立完善日常工作规范、操作维护、指挥调度流程，以及车辆和装备的工作规章、承担任务统计等内部管理制度。D 错误：工作流程不符。", "3532": "AD 正确：专业队伍所在单位应为其提供人身意外保险、防护装备等安全保障。B/C 错误：特种作业培训/专业技能培训不符。", "3533": "ABC 正确：专业队伍所在单位负责队伍建设、运行管理和指挥调度，制定人员配备、装备更新、运行维护、专业培训及演练等。D 错误：应急保障不符。", "3534": "AC 正确：专业队伍根据保障特点及跨省保障要求制定总体应急预案和专项预案。B/D 错误：专业应急预案/突发应急预案不符。", "3535": "ABCDE 正确：专项预案应包括总则、事前准备、事中处理、事后处置、附录五部分主要内容。", "3536": "ACDE 正确：注意观察柴油机运行过程中的变化，尤其是机油压力、冷却液温度、排烟情况、机器运转时的响声。B 错误：机油温度不符。", "3537": "ABCD 正确：主控站由应用设备分系统、网管分系统、调制解调器分系统、射频分系统组成。", "3538": "ABC 正确：主控站Modem分系统中CDM570调制解调器主要功能有生成突发时间计划、解调端站回传STDMA载波、接收端站回传自动切换请求。D 错误：发送实时数据不符。", "3539": "ABC 正确：CDD564调制解调器收到数据类型包括端站回传的应急业务数据、端站设备状态信息、端站MODEM回传的切换请求。D 错误：发送端站CDM570配置不符。", "3540": "AB 正确：重复接地的作用有降低漏电设备外壳的对地电压、减轻零线断线时的触电危险。C/D 错误：降低接地电阻值/增强防雷能力不符。", "3541": "BCD 正确：中星16号信关站分别部署在成都、怀来、喀什。A 错误：武汉不符。", "3542": "AB 正确：中星16号卫星反向链路能够工作在TDMA和SCPC模式。C/D 错误：CDMA/OFDM不符。", "3543": "ABCD 正确：中暑的症状有头痛、脉搏快而有力、脸色燥红、体温升高。", "3544": "ABCD 正确：中华人民共和国政府在突发事件的预防、监测与预警、应急处置与救援、事后恢复与重建等方面同外国政府和国际组织开展合作和交流。", "3545": "AC 正确：中国通信卫星都采用由垂直极化和水平极化构成的双线极化频率复用方式。B/D 错误：圆极化/左旋极化不符。", "3546": "ABCD 正确：中国电信核心价值观是全面创新、求真务实、以人为本、共创价值。", "3547": "ABC 正确：中国电信的业务平台共分为业务能力平台、内容服务平台、应用服务平台。D 错误：业务管理平台不符。", "3548": "AB 正确：中国电信企业文化纲要中提及的行为准则包括企业行为准则和员工行为准则。C/D 错误：用户/服务商行为准则不符。", "3549": "ACDE 正确：中国电信的核心价值观是全面创新、求真务实、以人为本、共创价值。B 错误：变革创新不符。", "3550": "BCD 正确：中国电信5G定制网提供如翼、比邻、致远三种服务模式。A 错误：边缘不符。", "3551": "AB 正确：制热方式有热泵制热和电加热两种。C/D 错误：水加热/都不对不符。", "3552": "AB 正确：制冷剂液体经节流装置节流后变为低压、低温的制冷剂。C/D 错误：高压/高温不符。", "3553": "ABC 正确：指南针使用应远离铁丝网10米、高压线50米、含磁铁如磁性容器10米，避免磁针错乱。D 错误：远离人群10米不符。", "3554": "AB 正确：直流供电回路中直流配电设备至高压控制及信号设备的电力线，应按容许电流和容许电压降选择校验。C/D 错误：机械强度/电力线线径不符。", "3555": "ABC 正确：直流浮充供电系统作用有后备电源、平滑滤波、调节系统电压。D 错误：高阻配电不符。", "3556": "ABD 正确：直放站作用有转发基站信号扩大覆盖、盲区覆盖改善网络覆盖、话务分流。C 错误：改善接收信号质量提高基站不符。", "3557": "ABD 正确：直放站作用有转发基站信号、盲区覆盖改善现有网络覆盖、提高基站设备利用率。C 错误：改善接收信号质量不符。", "3558": "ABCD 正确：直放站干扰基站的原因有上行输出噪声干扰、放大器线性不好、下行交调产物串入上行干扰基站、收发天线隔离不够系统自激。", "3559": "ABC 正确：整流器的遥测能够实现整流器输出总电压、输出总电流、单个整流模块输出电流数据的采集。D 错误：开关机状态属遥信。", "3560": "ABCD 正确：真空断路器由操作机构、灭弧室绝缘架、底座、真空灭弧室组成。", "3561": "AD 正确：造成漏电断路器动作的原因有漏电和漏电短路器损坏。B/C 错误：短路/过流不符。", "3562": "ABCD 正确：造成漏电断路器动作的原因有漏电、短路、过流、电断路器损坏。", "3563": "BC 正确：造成火灾主要死亡原因的是缺氧窒息死亡和中毒死亡。A/D 错误：大面积烧伤死亡/坠落死亡不符。", "3564": "ABD 正确：执行应急通信任务时可利用的自然接地体有与大地一体的金属自来水管、接地的金属结构、自流井金属管。C 错误：煤气管不符（煤气管道严禁作接地体）。", "3565": "ABCD 正确：长链改造成环的关键操作有保存配置、增加保护隧道、更改业务路由、备份原始数据。", "3566": "CD 正确：在移动通信网络中天线下倾的主要作用是减少干扰和增强信号强度（控制覆盖）。A/B 错误：提高天线增益/扩大覆盖范围不符。", "3567": "ABCD 正确：野外无指北针辨别方向的方法有利用太阳和时表判定、利用大树年轮辨别、利用太阳阴影判定、利用南十字星座判定。", "3568": "ABCD 正确：DT测试可以评估网络的接通率、掉话率、覆盖率、话音质量指标。", "3569": "ABCD 正确：DT测试可以评估网络的误码率、掉话率、覆盖率、话音质量指标。", "3570": "ABCD 正确：卫星通信中除自由空间传播损耗外还存在宇宙噪声、大气噪声、降雨噪声、地面噪声等外部噪声。", "3571": "ABD 正确：Ku频段下行频率转为L频段，其本振频率有10GHz、10.75GHz、11.3GHz。C 错误：11GHz不符。", "3572": "ABD 正确：不属于传输质量主要技术指标的是EIRP、G/T、天线的尺寸和工作频率。C 正确：载噪比属于传输质量主要技术指标。", "3573": "BD 正确：卫星带宽压缩方式中可保证数据速率不变的情况下节约卫星带宽资源的技术方式是载波叠加和高阶调制。A/C 错误：时隙插入/数字复用不符。", "3574": "ACD 正确：通信网运行的电源主要有线性电源、相控电源、开关电源。B 错误：矩阵电源不符。", "3575": "ABC 正确：数字微波接力系统中为提高频谱利用率可采用多进制调制、频谱赋形技术、交叉极化频率再用技术。D 错误：同步技术不符。", "3576": "ABDE 正确：在生产过程中事故是指造成人员伤害、人员死亡、职业病、财产损失或其它损失的意外事件。C 错误：管理混乱不符。", "3577": "ACD 正确：山顶作业遇雷雨应躲至相对低洼处或干燥掩体遮蔽、严禁将杆架伞锄头等金属器具举过头顶、关掉无线通信设备。B 错误：保持无线通讯设备畅通不符（雷雨应关机）。", "3578": "BD 正确：三相交流供电星型接法中，线电流等于相电流，线电压等于√3倍相电压。A/C 错误：线电压等于相电压/线电流等于√3倍相电流不符。", "3579": "ACD 正确：地面气温超过40度或低于零下、附近地区有雷雨天气、有雾或有冰冻霜雪情况下铁塔天馈线维护不能施工。B 错误：3级风以上不符（可施工）。", "3580": "ABCDEF 正确：木材缺乏时可替代燃料有动物的粪便、泥炭、煤、页岩、油料、动物油脂。", "3581": "ABCD 正确：野外无火柴和打火机时点火方法有使用凸透镜、用火石打火、利用车上的电池生火、钻木取火。", "3582": "ABCD 正确：宽带VSAT网络中VOIP影响语音质量的因素有带宽、时延、丢包、抖动。", "3583": "ABC 正确：宽带VSAT网络业务的建立由TOS值触发，TOS24对应2048k、TOS25对应1024k、TOS26对应126k。D 错误：TOS27,64k不符。", "3584": "AC 正确：宽带VSAT网络中目前所使用的PBX型号有CNG1000和CNG8000。B/D 错误：CNG2000/CNG3000不符。", "3585": "ACD 正确：各小站STDMA突发载波中包括前导码、保护带宽、数据时隙信息。B 错误：动态时隙不符。", "3586": "BD 正确：宽VSAT应急网中卫星地面站CDM570调制解调器的功能是卫星路由器和调制解调。A/C 错误：低噪声放大/频率变换不符。", "3587": "AD 正确：光纤通信中主要性能指标是衰减系数和色散系数。B/C 错误：误码/抖动不符。", "3588": "ABCD 正确：缆芯结构要求使光纤在缆内处于最佳位置与状态、金属线对妥善安排、加强元件经受允许张力、缆芯截面尽可能小。", "3589": "AC 正确：在覆盖区域内通过CQT和DT来准确收集网络数据。B/D 错误：MST/MT不符。", "3590": "ABD 正确：链路聚合技术优势有提高网络的可靠性、实现流量负荷分担、提高链路带宽。C 错误：便于复制数据进行分析不符。", "3591": "ABCD 正确：发电过程中必须定时记录的数据有时间、电压、电流、频率。", "3592": "ABD 正确：短波自适应通信系统中最常用的测量参数是信噪比、多径时延、误码率。C 错误：比特率不符。", "3593": "ABCD 正确：通信保障工作坚持统一领导分级负责、属地为主快速反应、严密组织密切协同、依靠科技保障有力的原则。", "3594": "BCD 正确：同等接收指标条件下高阶调制技术应用的不利因素有解调门限、发射功率、设备成本。A 错误：占用带宽不符（高阶调制占用带宽小）。", "3595": "ABCD 正确：解决覆盖太远措施有加大天线下倾角、减小基站静态功率等级、提高MS最小接入电平、提高RACH忙门限。", "3596": "ABCD 正确：传播模型计算路径损耗时需要确定频率、距离、基站天线和移动台有效高度、环境校正因子。", "3597": "ABCD 正确：不同野外环境单独作业需采取不同安全预防措施：炎热寒冷冰雪天气施工防护、雷雨天不在电杆铁塔下、林区草原荒山严禁烟火、徒步涉水河流沼泽采取措施。", "3598": "ABCD 正确：LTE中影响下行FTP下载速率的因素有UE所处无线环境RSRP、小区正在做业务的用户数量、文件下载进程数、FTP服务器性能。", "3599": "ABCD 正确：LTE网络优化中对切换性能的优化措施有PCI调整、功率调整、切换参数优化、邻区优化。", "3600": "ABCD 正确：LTE网络优化中对切换性能的优化措施有PCI调整、功率调整、切换参数优化、邻区优化。", "3601": "AB 正确：DWDM中衰耗和色散是限制传输距离的主要因素。C/D 错误：温度/四波混频不符。", "3602": "ACD 正确：运转中的发电机应在油压低、转速高、电压异常故障时停机。B 错误：水温低不符（水温低不是故障）。", "3603": "CD 正确：圆极化包含相互正交的左旋和右旋两种极化方式。A/B 错误：水平/垂直不符。", "3604": "ABCD 正确：预警信息的管理包括信息收集、处理、辨伪、存储、推断。", "3605": "AD 正确：预警级别的划分标准由国务院或国务院确定的部门制定。B/C 错误：省级人民政府/全国人民代表大会不符。", "3606": "ABDE 正确：预警分析系统的实现包括监测、识别、诊断、评价等环节。C 错误：纠错不符。", "3607": "ABC 正确：预防车辆落水措施包括沿水边停车不车头对水、不得不面向水停车时挂倒挡、背对水停车换挡时先手刹。D 错误：自动挡挂P挡不符。", "3608": "ABC 正确：语音编码的目的是减少信源冗余解除信源相关性、压缩语音码率、提高信源有效性。D 错误：提高通信可靠性不符。", "3609": "BC 正确：雨雪天气、夜间应低速行驶，严禁空挡滑行和下25度以上陡坡。A/D 错误：低速行驶/下35度以上不符。", "3610": "ABC 正确：与相控电源相比开关电源体积小、重量轻、无可闻噪声（风扇除外）。D 错误：功率大不符。", "3611": "CD 正确：与单模光纤相比多模光纤优势是制造更容易、接续更容易。A/B 错误：传输容量更大/传输距离更远不符。", "3612": "ABCD 正确：VSAT卫星通信网特点有面向用户而不是面向网络、小口径天线、智能化、安装方便。", "3613": "ABCD 正确：有可能导致掉线的原因有覆盖因素、上行干扰、下行干扰、终端原因。", "3614": "BCD 正确：有关政府及其部门采取的应对突发事件措施应与突发事件可能造成社会危害的程度、范围、性质相适应。A 错误：种类不符。", "3615": "AC 正确：油箱使用完毕应先关闭负荷，后关闭油机。B/D 错误：先关油机/后关负荷不符。", "3616": "ABD 正确：油机的“三滤”指空气滤清器、机油滤清器、燃油滤清器。C 错误：水滤清器不符。", "3617": "AB 正确：油底壳机油过少应添加同型号机油，如机油脏则更换机油。C/D 错误：添加燃油/不必处理不符。", "3618": "BCD 正确：由于所对通信卫星轨道位置不同、通信方位和仰角不同，住宅高度限制曲线在一个扇面内的一蔟曲线。A 错误：高度不同不符。", "3619": "BD 正确：使频谱仪显示噪声抖动减小的方法是减小VBW和采用平均。A/C 错误：减小RBW/增大扫宽不符。", "3620": "ABD 正确：提高频谱仪灵敏度的方法有尽可能小的分辨率带宽RBW、打开前置放大器、充分利用视频滤波器VBW。C 错误：衰减值设为最大不符（衰减减小灵敏度）。", "3621": "AC 正确：频谱仪DISPLAYLINE测量下行载波，RS为6.67Mbps、RB为19.3Mbps的读数值符合。B/D 错误：数值不符。", "3622": "BCD 正确：用光时域反射仪在光纤单端测量光纤长度的方法有单点0技术、单点1技术、两点技术。A 错误：两点0技术不符。", "3623": "ABCD 正确：影响无线覆盖的主要因素有天线的挂高和方向、天线增益、内置电倾角和机械倾角、天线水平半功率角和垂直半功率角。", "3624": "ABCD 正确：影响无线覆盖的主要因素有天线的挂高和方向、天线增益、内置电倾角和机械倾角、天线水平半功率角和垂直半功率角。", "3625": "ABCD 正确：影响市电供电电源质量的污染包括电压浪涌、电压瞬变、过压、欠压。", "3626": "ABCD 正确：影响燃油雾化的主要因素有喷油压力、喷孔直径、燃油品质、喷射背压。", "3627": "ABD 正确：影响基站上行覆盖的因素有基站灵敏度、天线分集增益、天线增益和挂高。C 错误：移动台接收灵敏度不符。", "3628": "BCD 正确：影响话务量大小的因素有占用时长、呼叫强度、时间范围。A 错误：设备的状态不符。", "3629": "ACD 正确：影响电池寿命的因素有温度、放电深度、放电电流大小。B 错误：湿度不符。", "3630": "ABC 正确：影响电池容量的因素有正极板栅腐蚀、电池失水、早期容量损失。D 错误：负极板硝酸盐化不符。", "3631": "ABCD 正确：应急预案体系建设基本原则是遵守国家相关法律法规、在保障人员生命安全前提下处置、统一领导分级指挥、充分利用现有资源突出保障重点。", "3632": "ABC 正确：应急预案从组网方式和实现手段分为独立组网、大网延伸、联合组网。D 错误：跨行业组网不符。", "3633": "ABCDE 正确：应急物资调用单位需对借入的应急资产建立台账，详细记录生产厂家、型号、资产名称、来源、使用去向等信息。", "3634": "AC 正确：应急卫星基站车射频接收信号经功分器后主要提供给Modem和信标机。B/D 错误：天控器/交换机不符。", "3635": "ABD 正确：应急通信专业队伍具备保障现场语音、图像、数据、位置等信息采集回传的能力。C 错误：险情不符。", "3636": "ABC 正确：应急通信预案要具有可操作性、有效性、实时性。D 错误：唯一性不符。", "3637": "ABCD 正确：应急通信现场通信设备供电方式有应急车配置的发动机发电、应急现场市电供电、应急车内蓄电池供电、其他外部发电机发电。", "3638": "AC 正确：应急通信系统应该能做到保障重要信息的传输、快速有效地指挥。B/D 错误：保障公众通信/快速有效参加救援不符。", "3639": "ABCD 正确：应急通信指出现自然或人为的突发性紧急情况如洪水、地震、战争、恐怖袭击时，原有公众通信设施可能瘫痪情况下提供的通信。", "3640": "AB 正确：应急通信是国家应急保障体系的重要组成部分，是政府行使社会管理、公共服务责任的需要。C/D 错误：政府职能/为人民服务不符。", "3641": "BCD 正确：应急通信是公用通信网络的重要组成部分，承担的任务有平时服务、急时应急、战时应战。A 错误：平时应急不符。", "3642": "AB 正确：应急通信设备维护质量重点体现在设备完好率和系统可用性方面。C/D 错误：设备周转率/设备使用率不符。", "3643": "ABCD 正确：应急通信特点有应急通信的时间和地点不确定、通信网络本身受紧急事件破坏、容量需求不均衡、对通信能力需求不确定性。", "3644": "ABC 正确：应急通信具有随机性、不确定性、紧急性等特点。D 错误：永久性不符。", "3645": "ABD 正确：应急通信各专业队伍参照配置标准定期更新应急通信装备，建立物资储备、维护、调度等动态管理台账。C 错误：管理不符（管理是台账性质，选储备/维护/调度）。", "3646": "AD 正确：应急通信从性质来分可以分为应急服务和应急保障。B/C 错误：应急抢修/应急支撑不符。", "3647": "ABC 正确：应急通信承担的主要任务包括平时服务、急时应急、战时应战。D 错误：市场营销不符。", "3648": "ABCD 正确：应急通信车常见的传输方式有微波、光纤、网桥、卫星。", "3649": "ABC 正确：应急通信保障体系包含三要素是组织机构和人员、应急预案与演练、物资装备与调度。D 错误：保障手段和工具不符。", "3650": "ABD 正确：应急通信保障对外保障主要包括应对突发公共事件、抢险救灾、商业活动等。C 错误：公网支撑不符（公网支撑是对内保障）。", "3651": "ABCD 正确：应急通信保障对内保障主要包括大网补充、应急及临时支撑、业务的支持、故障恢复等。", "3652": "AC 正确：应急宽带VSAT系统采用TDM/STDMA和TDM/SCPC通信技术工作模式。B/D 错误：S-TDMA/SCPC-DAMA不符。", "3653": "ABCD 正确：应急基站上电开通后无法切换可能原因有邻区关系配置有误、GPS天线被遮挡、搜索窗配置不合理、位于BSC边界没配外部邻区。", "3654": "BCD 正确：应急基站上电开通后通话断续可能原因有天馈线驻波高、邻区配置不合理、传输误码高。A 错误：基站发射功率高不符。", "3655": "ACD 正确：应急管理具有高负荷、高压力、高风险的特点。B 错误：高效益不符。", "3656": "ABCD 正确：应急管理部统一建设应急资源管理平台、“互联网+执法”、应急管理“一张图”、“天眼”卫星监测系统等应用系统。", "3657": "AB 正确：应急管理部建设大型长航时无人机空中骨干节点及区域地面骨干节点，坚持装备利旧制式兼容强化融合、单兵数字化战场网络化作战一体化。C/D 错误：分层部署/互联物联智联不符。", "3658": "AB 正确：应急车卫星电路调测时在与对端机房发射接收各项参数确认前应保持卫星功放开关关闭、TX-IF的CARRIER关闭。C/D 错误：打开载波/打开功放不符。", "3659": "DE 正确：应急车辆不定期保养包括走合期保养和季节性保养。A/B/C 错误：自主性/强制性/定期性不符。", "3660": "ABD 正确：引起卫星调制解调器接收灯不亮的原因有天线未对准卫星、LNB供电(DC)没有加上、接收带宽设置有误。C 错误：接收频率设置无误不符（设置无误不会导致不亮）。", "3661": "ACD 正确：音视频系统由视频会议系统、音视频编码器、音视频矩阵等组成。B 错误：调制解调器不符。", "3662": "ABD 正确：阴雨天气进行卫星对星操作可能出现接收电平过低、卫星载波中断、接收电平不稳定现象。C 错误：功放无法开启不符。", "3663": "AB 正确：蓄电池放电电流越小放电容量越大、温度降低放电容量减小的描述正确。C/D 错误：电流越大容量越大/温度降低容量增大不符。", "3664": "ABC 正确：eMBB典型应用有AR教学、VR游戏、大型会议。D 错误：车辆自动驾驶属uRLLC。", "3665": "ABD 正确：闭环空间复用适用于SINR较高、开环空间复用适用于SINR较低、开环发射分集适用于SINR较低（的描述正确）。C 错误：闭环发射分集适用条件不符。", "3666": "AB 正确：X2切换的选择优先于S1切换、X2切换两个基站使用同一个MME的说法正确。C/D 错误：X2使用同一SGW/数据反传可用S1不符。", "3667": "AC 正确：电源地(GND/BGND)是工作地、保护地(PGND)接到保护地排的说法正确。B/D 错误：有源器件不需外部电源/无源器件需外部工作电源不符。", "3668": "ABD 正确：拉线塔拉线对地夹角可以超过60度（错误）、楼顶桅杆接地不须和楼顶接地网连接（错误）、铁塔安装螺丝可以以小代大（错误），本题选错误说法。C 正确：桅杆高度超出4米需装脚钉。", "3669": "ABC 正确：VSAT站只能组成相同规模（错误）、VSAT网络中各站点速率相同（错误）、VSAT网络只能用作数据（错误），本题选不正确说法。D 正确：VSAT网络可以是交互的网络。", "3670": "ABC 正确：语音差错控制技术有循环冗余校验(CRC)、前向纠错(FEC)、自动要求重发(ARQ)技术。D 错误：后向纠错不符。", "3671": "CD 正确：语音参量编码技术有线性预测声码器(LPC)、多脉冲线性预测编码器(MPLPC)。A/B 错误：PCM/DM属波形编码。", "3672": "AB 正确：语音波形编码技术有脉冲编码调制(PCM)、增量调制(DM)。C/D 错误：LPC/MPLPC属参量编码。", "3673": "ABC 正确：小站设备有小孔径的天线、室外单元、室内单元。D 错误：网络控制中心是主站设备。", "3674": "ABC 正确：通信电源交流供电系统包括高压配电所、油机发电机、UPS。D 错误：直流配电屏属直流供电系统。", "3675": "AB 正确：UPS组成部分有逆变器、静态开关。C/D 错误：开关电源/直流变换器不符。", "3676": "AD 正确：SDH特点有同步复用、按字复用。B/C 错误：信号速率未统一/155M以下无标准光接口不符。", "3677": "ABC 正确：GSM下行公共信道有PCH、AGCH、RACH（RACH为上行共用）。D 错误：ACCH不符。", "3678": "ABD 正确：应急资源管理平台应急资源调度入口是应急事件、应急演练、应急任务。C 错误：应急预案不符。", "3679": "ABC 正确：TAC取值范围正确的是10043、9489、9450（16位最大65535）。D 错误：65536超出范围不符。", "3680": "BD 正确：驻波比正常范围是1.2和1.3。A/C 错误：1.7/1.8偏高不符。", "3681": "BD 正确：导致交叉极化干扰的因素有天线馈源薄膜受损未能及时更换、有其他物质掉进馈源。A/C 错误：降雨天气/发射功率过大不符。", "3682": "BD 正确：导致交叉极化干扰的因素有天馈源薄膜受损未更换、有其他物质掉进馈源。A/C 错误：降雨/发射功率过大不符。", "3683": "ABD 正确：单模光纤有G.652.D、G.654、B6.b3（G.657.B3）。C 错误：OM4是多模光纤。", "3684": "BD 正确：TDMA多址方式特性是不存在互调干扰、需网络时间同步。A/C 错误：技术简单/抗多径干扰不符。", "3685": "ABCD 正确：传输资源管理范畴内的设备有PTN设备、无线光纤拉远设备、微波设备、OLT设备。", "3686": "CD 正确：E1和STM-N类型的接口不能接入以太网信号。A/B 正确：FE/GE均可接入以太网。", "3687": "AD 正确：工作在5GHz的技术有雷达和数字卫星（5GHz频段）。B/C 错误：蓝牙/红外不符。", "3688": "CD 正确：10G光模块有XFP和SFP+。A/B 错误：SFP/XFP+不符（SFP是1G，XFP+不是标准叫法）。", "3689": "CD 正确：10G光模块有XFP和SFP+。A/B 错误：SFP/XFP+不符。", "3690": "ABC 正确：PDCP层处理的功能有IP头压缩、加解密、完整性校验。D 错误：对用户数据进行AM/UM模式处理是RLC层功能。", "3691": "AC 正确：防静电工具有防静电腕带、三芯插头电烙铁。B/D 错误：金属镊子/金属芯片起拔器不符。", "3692": "CDE 正确：RSRP-85/SINR（较高）、RSRP-75/SINR、RSRP-65/SINR场景测速能满足室内定点1Gbps以上要求。A/B 错误：RSRP-105/-95信号较差不符。", "3693": "AC 正确：描述下行接收系统主要性能指标是系统增益、噪声系数。B/D 错误：饱和输出功率/三阶交调截止点不符。", "3694": "ABC 正确：决定频谱仪扫描时间的参数有扫描带宽、RBW、VBW(VBW＜RBW时)。D 错误：频率不符。", "3695": "CD 正确：不是FDMA多址方式特性的是抗多径干扰、需网络时间同步（FDMA无需全网同步）。A/B 正确：技术简单/存在互调干扰均为FDMA特性。", "3696": "AB 正确：VSAT系统工作频段有14/11GHz（Ku）和3/4GHz（C）。C/D 错误：1/2GHz/15/16GHz不符。", "3697": "ABD 正确：由感应电动势产生的电流叫感应电流、线圈本身电流变化引起自感、自感现象将产生自感电动势的描述正确。C 错误：自感现象将产生自感电流不符。", "3698": "AB 正确：可以测量直流电压的仪表有数字万用表、数字示波器。C/D 错误：电力谐波分析仪/杂音测量仪不符。", "3699": "ABD 正确：多径效应、多普勒效应、远近效应不属于慢衰落损耗（属快衰落/其它）。C 正确：阴影效应属于慢衰落。", "3700": "BCD 正确：属于高阶调制的有8QAM、16QAM、8PSK。A 错误：OQPSK不符。", "3701": "AD 正确：海事卫星电话信号强度45.7dBm和40.3dBm偏低，有可能造成拨号失败。B/C 错误：52.3/55.3dBm正常。", "3702": "AB 正确：天线口径越大增益越高、波长越长波瓣越宽、口径越大的描述正确。C/D 错误：口径与增益/波瓣关系不符。", "3703": "AD 正确：切断电源时先断开分路负载再分闸、合上电源时先合闸再合分路负载属于安全规范。B/C 错误：顺序不符。", "3704": "BD 正确：NGN网络是业务驱动型的网络、NGN网络中主要涉及软交换的说法正确。A/C 错误：NGN和软交换同一概念/只能提供多媒体业务不符。", "3705": "ABD 正确：不是所有Ka便携站都能工作（各型号覆盖不同）、佰才邦KaLTE可以工作在Ka频段、目前新疆无法使用的陈述正确。C 错误：佰才邦KaLTE便携站无法（在Ka工作）不符。", "3706": "ABD 正确：不属于测试用电视伴音信号标准电平的是3dBm、1dBm、-3dBm。C 正确：0dBm属于标准电平。", "3707": "ABC 正确：电源柜、列头柜、ODF不是传输设备的2M口成端。D 正确：DDF是2M口成端。", "3708": "ABD 正确：柴油发电机启动系统包括启动马达、交流发电机、蓄电池。C 错误：开关电源不符。", "3709": "ABC 正确：柴油发电机供油系统包括喷油嘴、高压油泵、柴油滤清器。D 错误：机油泵不符（机油系统）。", "3710": "ABC 正确：静中通卫星通信系统设备有1.8米KU频段天线、40W KU频段ODU、CDM570室内单元。D 错误：CDM564室内单元不符。", "3711": "ABC 正确：静中通卫星通信系统设备有1.8米KU频段天线、40W KU频段ODU、CDM570室内单元。D 错误：CDM564室内单元不符。", "3712": "ABC 正确：对卫星链路在转发器上占用带宽进行压缩的技术有高阶调制、时隙插入取出、载波叠加技术。D 错误：前向纠错技术不符。", "3713": "ABC 正确：以习近平新时代中国特色社会主义思想为指导，建设信息化、体系完备、技术先进的应急通信体系。D 错误：协同高效不符。", "3714": "AD 正确：移动站MODEM分系统配置设备型号包括CDM570和CDM-562。B/C 错误：CDM564/CDM625不符。", "3715": "ABD 正确：移动通信系统一般由发信机、收信机、天馈线构成。C 错误：铁塔不符。", "3716": "ABD 正确：移动通信系统目前采用FDMA、TDMA、CDMA多址方式。C 错误：SCDMA不符。", "3717": "ABCD 正确：移动通信基站常用的天线有全向天线、定向天线、特殊天线、多天线系统。", "3718": "BCD 正确：移动发电机组分为车载式、拖车式、便携式。A/E 错误：推车式/静音式不符。", "3719": "ABCD 正确：一台通信开关电源包含交流配电、直流配电、整流模块、监控模块几个部分。E 错误：监控后台不符。", "3720": "AC 正确：TWT高功放放大两个临近载波f1及f2，属于三阶互调产物的是2f1-f2和2f2-f1。B/D 错误：2f1+f2/2f2+f1不符。", "3721": "AC 正确：TWT高功放放大两个临近载波f1及f2，属于三阶互调产物的是2f1-f2和2f2-f1。B/D 错误：2f1+f2/2f2+f1不符。", "3722": "ABC 正确：一般光纤存在模式色散、材料色散、波导色散三种色散。D 错误：色度色散不符。", "3723": "AB 正确：野外作业遇雷雨时作业人员应放下手中金属器具、严禁在大树下电杆旁和涵洞内躲避。C/D 错误：金属器具搬到大树下/躲到树林中不符。", "3724": "ABCD 正确：野外作业安全注意事项有配备通信工具保证随时联系、深山密林防止误踩深坑、施工人员不单独远离作业场所、作业完毕清点人数。", "3725": "BCD 正确：野外遇大型野生动物应从下风口离开、保持肃静、以左右迂回方式向下坡逃离避免伤害。A 错误：从上风口离开不符。", "3726": "ABCD 正确：野外饮用水清洁消毒常用方法有沉淀、消毒、过滤、煮沸。", "3727": "BCD 正确：野外抢修如遇雷雨天气不能去电线杆、铁塔、大树进行躲避。A 正确：室内可以躲避。", "3728": "ABC 正确：野外搭建帐篷应注意方向（门不要对着风口）、清理地面尖锐物体、地钉打好固定外帐。D 错误：雨天附近不要挖排水沟不符（应挖排水沟）。", "3729": "ACD 正确：野菜鉴别方法有取嫩叶品尝是否有苦涩味、煮后有大量泡沫说明含有毒素、牲畜能吃的野菜人也能吃。B 错误：煮汤加牛奶检验法不符。", "3730": "ACD 正确：严禁患有心脏病、高血压、癫痫病和其他不适宜高处作业人员从事高处作业。B 错误：糖尿病不符。", "3731": "CD 正确：亚太6D卫星所使用的频率包括Ka和Ku频段。A/B 错误：S/C频段不符。", "3732": "AC 正确：雪对卫星通信进行干扰的形式有下雪引起的衰耗、覆盖天线后的折射干扰。B/D 错误：低温/雪化成水不符。", "3733": "AC 正确：雪对卫星通信干扰形式有下雪引起的衰耗、覆盖天线后的折射干扰。B/D 错误：低温/雪化成水不符。", "3734": "CD 正确：蓄电池组浮充工作方式下的作用包括补充自放电的容量损失、放电后充电。A/B 错误：修复单体电压均衡/活化蓄电池不符。", "3735": "ABC 正确：蓄电池组充电方式有恒流充电法、恒压充电法、恒压限流充电法。D 错误：恒压恒流充电法不符。", "3736": "ABCDE 正确：蓄电池维护应注意的事项包括充电不足、充电过剩、温度过高或过低、放电电压过低、放电后的长时间搁置。", "3737": "ABD 正确：蓄电池维护“三防一及时”中三防是指防高温、防过放电、防过充电。C 错误：防低温不符。", "3738": "AB 正确：蓄电池清洁应采取避免产生静电的措施，用湿布清洁、禁止汽油接触蓄电池的说法正确。C/D 错误：允许酒精接触/用干布清洁不符。", "3739": "ABCD 正确：信源可以是多种形式的，如语音、文字、图像、数据等。", "3740": "ABCD 正确：信源基站的接入方式有微蜂窝基站接入、基站直接接入、直放站接入、光纤接入。", "3741": "AD 正确：BPSK的bits/Hz为1，16QAM的bits/Hz为4。B/C 错误：BPSK 2/16QAM 3不符。", "3742": "ABC 正确：信标机显示接收电平-83.5dBm原因可能是车体不稳、阴雨天、没有手动调节到最大值。D 错误：LNB馈电未开启不符（未开启则无电平显示）。", "3743": "ABCDE 正确：心包积液引起心脏压塞的主要征象有颈静脉怒张静脉压异常升高、血压下降脉压减少严重者休克、奇脉、心音减弱遥远、呼吸困难端坐呼吸可有发绀。", "3744": "ACD 正确：消防安全的三知是知本岗位的火灾危险性、防火知识、灭火知识。B 错误：本岗位业务不符。", "3745": "BCD 正确：消防安全的三会是会报火警、会扑救初起火灾、会疏散逃生。A 错误：会打电话不符。", "3746": "AB 正确：相对于油机发电，市电优点是经济、环保。C/D 错误：应有尽有/价格非常便宜不符。", "3747": "CD 正确：线性极化波中两种常用的极化方式是水平极化波和垂直极化波。A/B 错误：左旋/右旋极化波不符。", "3748": "BD 正确：现在利用数字电视编码器进行图像传输的制式主要是MPEG-2和MPEG-4。A/C 错误：MPEG-1/MPEG-3不符。", "3749": "ABCD 正确：现代通信中主要的传输介质有光纤、同轴铜缆、双绞线、无线。", "3750": "CD 正确：现代通信网中主要采用电路交换、分组交换及IP交换、ATM交换等交换形式。A/B 错误：业务交换/无线交换不符。", "3751": "BC 正确：现代通信设备常用的供电电压为±24V和-48V。A/D 错误：±12V/±15V不符。", "3752": "ABCD 正确：现代通信传输媒介主要有电缆、微波、通信卫星、光纤等。", "3753": "BCD 正确：县级人民政府应当对行政区域内危险源、危险区域进行调查、登记、风险评估，定期检查监控。A 错误：备案不符。", "3754": "ABCD 正确：县级人民政府及其有关部门、街道办事处、乡级人民政府、居民委员会、村民委员会应当及时调解处理可能引发社会安全事件的矛盾纠纷。", "3755": "ACD 正确：显示分辨率1920×1080p中p表示逐行，隔行、隔帧、逐帧表述不正确（本题选不正确项）。B 正确：逐行。", "3756": "CD 正确：不用于光缆线路光纤通道测试的是2M综合测试仪、光接收机。A/B 正确：OTDR/光源光功率计用于光纤通道测试。", "3757": "ABC 正确：天通移动通信系统卫星轨位有101.4°E、125°E、81.5°E。D 错误：138不符。", "3758": "ABCD 正确：干扰抑制技术有波束赋形天线技术、干扰随机化技术、干扰消除技术、干扰协调技术。", "3759": "ABD 正确：5G无线技术创新有大规模天线阵列、超密集组网、新型多址。C 错误：网络功能虚拟化属网络技术创新。", "3760": "ABCDE 正确：微分集包括空间分集、频率分集、极化分集、场分量分集、角度分集。", "3761": "BCD 正确：光纤端面处理要使用的工具有光纤切割刀、光纤护套剥除器、清洗工具。A 错误：断线钳不符。", "3762": "AC 正确：LTE系统中的网元有MME和eNodeB。B/D 错误：RNC/NodeB属3G/2G网元。", "3763": "ABD 正确：信标机、天线控制器、MODEM不需要预热。C 正确：功放需要预热。", "3764": "ABC 正确：天线的电气指标有增益、驻波比、波束宽度。D 错误：天线重量属机械指标。", "3765": "AC 正确：卫星MODEM的编码方式有VIT（维特比）和TPC。B/D 错误：VTT/FTD不符。", "3766": "BCD 正确：资源拓扑、业务开通、基础功能模块不包含基站资源管理流程。A 正确：网络割接属于基站资源管理流程。", "3767": "BC 正确：用于提高速率的技术是MassiveMIMO和MassiveCA。A/D 错误：0.5msTTI（缩短时延）/SOMA不符。", "3768": "ABC 正确：在输入功率相等的条件下实际天线与理想辐射单元在空间同一点产生信号功率密度之比、定量描述天线把输入功率辐射出去程度、增益与天线方向图有密切关系的说法正确。D 错误：定向天线增益比全向天线（不一定小，该句被截断不符）。", "3769": "ABCD 正确：5G网络描述正确的是网络性能更优质、网络运营更智能、网络功能更灵活、网络生态更友好。", "3770": "ACD 正确：5G定制网的特性有高带宽、低时延、广连接。B 错误：易维护不符。", "3771": "BCD 正确：天线控制器、信标机、MODEM设备不需要预热。A 正确：功放需要预热。", "3772": "ABC 正确：属于网络规划的是链路预算、PCI规划、容量估算。D 错误：选址不符（选址属勘察）。", "3773": "BCD 正确：天馈系统包括天线、馈线及跳线、避雷器。A 错误：调制器不符。", "3774": "AD 正确：上行参考信号的作用不包括小区搜索和切换。B/C 正确：上行信道质量测量/估计用于eNodeB调度属于其作用。", "3775": "ABCD 正确：引发交流故障的原因有交流停电、交流输入过欠压、交流接触器损坏、交流空开跳闸。", "3776": "CD 正确：属于单工通信的是126寻呼台、FM调频广播。A/B 错误：GSM系统/110调度指挥中心为双工。", "3777": "ABCD 正确：安全用电间接接触防护措施有接地、接零、双重绝缘、自动断开电源。", "3778": "ABCD 正确：《“十四五”国家应急体系规划》提出的强化灾害应对准备凝聚同舟共济保障合力包括强化应急预案准备、强化应急物资准备、强化紧急运输准备、强化救助恢复准备。", "3779": "BCD 正确：表征相对值的参数是dBi、dBd、dB。A 错误：dBm是绝对功率值。", "3780": "ABC 正确：KU频段下行频率有10.95～11.75GHz、11.7～12.2GHz、12.25～12.75GHz。D 错误：12.75～14GHz属上行频率。", "3781": "ABCD 正确：数字调制方式有ASK、PSK、QAM、FSK。", "3782": "ABCD 正确：静中通车载发电机启动失败原因有燃料油路中有空气、冷却液管路中有空气、启动电瓶电压低、环境温度较低预热时间不够。", "3783": "ABC 正确：影响蓄电池组寿命的项目有放电深度、过充电程度、温度。D 错误：均无影响不符。", "3784": "BCD 正确：属于数字调制的是ASK、QAM、FSK。A 错误：DAM不符。", "3785": "BD 正确：LTE上行参考信号有DMRS和SRS。A/C 错误：CRS/DRS是下行信号。", "3786": "AC 正确：商业社会活动、内部的业务支撑属于应急服务内容。B/D 错误：重大通信事故/应对突发公共事件属应急保障内容。", "3787": "BCD 正确：重大通信事故、突发公共事件、战争军事演习属于应急保障内容。A 错误：商业社会活动属应急服务内容。", "3788": "BD 正确：造成该省(区、市)多个基础电信运营企业通信故障、通信网络故障可能升级造成该省通信瘫痪属于突发公共事件Ⅱ级（重大）。A/C 错误：多省（区、市）通信故障属Ⅰ级（特别重大）。", "3789": "BD 正确：公共设施和设备事故、工矿商贸等企业的各类安全事故属于事故灾难。A/C 错误：恐怖袭击属社会安全事件/地质灾害属自然灾害。", "3790": "ABC 正确：恐怖袭击事件、经济安全事件、涉外突发事件属于社会安全事件。D 错误：传染病疫情属公共卫生事件。", "3791": "ABC 正确：传染病疫情、群体性不明原因疾病、食品安全和职业危害属于公共卫生事件。D 错误：交通运输事故属事故灾难。", "336": "B 正确：高压线附近架空作业最小距离：35KV以下为2.5m，35KV以上为4m。A/C/D 错误：组合不符。", "337": "B 正确：高压电力线附近通信线路最小空距：35千伏以下2.5米，以上4.0米。A/C/D 错误：组合不符。", "338": "D 正确：高山雪地大雪纷飞数小时后应先等待24小时，落雪有着落后再出发（防雪崩）。A/B/C 错误：4/8/16小时不符。", "339": "C 正确：飞行中遇积冰应柔和操纵飞机保持飞行高度（避免剧烈机动失速）。A/B 错误：用力修正/调马力不符。", "340": "B 正确：反向信道中PN长码的作用为扩频（区分用户+扩频）。A/C/D 错误：调制/扰码/解扩不符。", "341": "C 正确：CDMA2000反向链路用长PN偏移量区分不同用户。A/B/D 错误：WAlsh码（前向）/短PN/时隙不符。", "342": "B 正确：发送站扰码器位于纠错编码器和调制器之前（先扰码后调制）。A/C/D 错误：位置不符。", "343": "C 正确：多个告警并存时应先处理优先级高的原发告警。A/B/D 错误：低至高/近及远/时间顺序不符。", "344": "C 正确：远端站路由表设置中小站564选择该小站570IP地址作为网关（本端网关）。A/B/D 错误：地址组合不符。", "345": "B 正确：业务抢通顺序应首先抢通通话类业务，然后抢数据类业务（语音优先）。A/C/D 错误：集团客户/普通客户优先不符。", "346": "A 正确：对流层内空气温度随高度增加而降低（每千米约降6.5℃）。B/C 错误：升高/不变不符。", "347": "A 正确：短波通信距离60公里以上必须采用天波传播方式（电离层反射）。B/C/D 错误：空间波/散射波/地波不符。", "348": "B 正确：短波地波沿地表传播距离取决于地表介质特性（导电率影响衰耗）。A/C 错误：分布结构/地理位置不符。", "349": "C 正确：电子器件装配到电路板上后对静电仍然敏感（静电损伤仍可能）。A/B/D 错误：任意袋放/跌落才发生/不再敏感均错。", "350": "C 正确：PTN电路名称的后缀是/P（以太网电路标识）。A/B/D 错误：/λ/D/O不符。", "351": "B 正确：电话通信网中用户终端设备主要为电话机。A/C/D 错误：电缆/交换机/光纤是网络设备。", "352": "B 正确：电磁感应中感应电流的磁场总是跟原来磁场方向相反（楞次定律，阻碍变化）。A/C/D 错误：相同/具体判断/无法确定不符。", "353": "B 正确：车辆汽油与细沙混合在容器里可以燃烧得很好（细沙吸附汽油缓燃）。A/C/D 错误：土/石块/铁不符。", "354": "B 正确：地面链路收发端口与CDM-625的2M非平衡口连接时对应TX（发送）。A/C/D 错误：RX/IN/OUT不符。", "355": "C 正确：地表风向不同于高空是因为风和地面之间的摩擦作用。A/B 错误：地形影响气压/地转偏向力不符。", "356": "C 正确：中继段衰减测试不属于单盘测试（是成段测试）。A/B/D 错误：单盘长度/后向散射曲线/折射率均属单盘测试。", "357": "D 正确：大于30度的陡坡或悬崖工作时应使用保险绳和安全带。A/B/C 错误：15/20/25不符。", "358": "B 正确：纯电容正弦交流电路消耗无功功率，单位为Var（乏）。A 错误：电容器隔直通交（说反）。C 错误：电流超前电压90°。D 错误：I=U/XC而非I=u/R。", "359": "A 正确：处理故障时值班维护人员遵循收端指挥、发端配合的原则。B/C 错误：发端指挥/轮流指挥不符。", "360": "B 正确：城区控制覆盖防越区，通常选用带机械电调下倾的定向天线（可调下倾角）。A/C/D 错误：预置电下倾/高增益机械/全向不符。", "361": "A 正确：城区环境优先采用65度智能天线（窄波束精准覆盖）。B/C/D 错误：90/120/360不符。", "362": "D 正确：640设备XCU中vc发送流量指UNI向NNI的数据流量。A/B/C 错误：FE/SYS/NNI-UNI不符。", "363": "A 正确：测量报告RSRPresult=95对应实际RSRP范围为-46≤RSRP（映射为-140+95=-45，即-46≤RSRP≤-45，选A）。B/C/D 错误：范围不符。", "364": "B 正确：测量报告消息中最多上报8个小区的测量结果。A/C/D 错误：4/16/32不符。", "365": "C 正确：不可用时间和可用时间定义中误码率门限为0.001（严重误码秒门限）。A/B/D 错误：1e-6/1e-12/1e-9不符。", "366": "C 正确：波分系统收端光信噪比降低最主要原因是EDFA的使用（放大引入ASE噪声）。A/B/D 错误：光纤类型/分波合波/衰减不符。", "367": "A 正确：波分复用系统绝对频率参考点是193.1THz。B/C/D 错误：192.1/187.0/196.0不符。", "368": "B 正确：并联运行的同一电力系统中任一瞬间的频率在全系统都是统一的。A/C 错误：电压/波形不符。", "369": "C 正确：“支路中较小的电阻获得较小的电流”不正确（并联电阻越小电流越大），本题选不正确项。A/B 正确：电压相等、总电流等于分路电流之和均正确。", "370": "C 正确：标准大气海平面气温15℃、气压1013.25hPa。A/B/D 错误：1000hPa/760mmHg（无温度）/不符。", "371": "A 正确：编制火灾事故应急预案首先确定控制火势方法和步骤，明确灭火方法。B/C 错误：调控风流/救援方案不符。", "372": "A 正确：安装EasyTraffic前需要修改ConfigCenter.properties文件。B/C/D 错误：an-commonsh/maomserver/etl不符。", "373": "D 正确：安装CORBA接口环境装完jdk131后需添加JAVAHOME系统环境变量。A/B/C 错误：其他变量不符。", "374": "B 正确：X2切换中由MME负责通知SGW修改承载。A/C/D 错误：eNodeB/PGW/HSS不符。", "375": "B 正确：Windows中查看DNS服务器IP的命令是nslookup。A/C/D 错误：DNSserver/DNSconfig/DNSip非命令。", "376": "D 正确：Windows网关指路由器的地址（默认网关为出口路由器）。A/B/C 错误：服务器/本机/网络地址不符。", "377": "A 正确：VSAT系统小站与主站之间通常使用单跳方式通信（经卫星一次转发）。B/C/D 错误：双跳/多跳/不确定不符。", "378": "D 正确：VSAT地球站室外设备不包括MODEM（调制解调器是室内设备）。A/B/C 错误：天线/双工器/低噪声放大器均室外。", "379": "B 正确：VSAT网从主站经卫星到小站方向的信道称为外（出）向信道。A/C/D 错误：内（入）向/上行/下行不符（以主站视角命名）。", "380": "A 正确：VSAT网从小站经卫星向主站方向发射的信道称为内（入）向信道。B/C/D 错误：外（出）向/上行/下行不符。", "381": "B 正确：TDMA方式下最大信道利用率可达80%的是R-ALOHA（预约ALOHA）。A/C/D 错误：S-ALOHA/Stream/ATDMA不符。", "382": "C 正确：VoNR方案中UPF与SBC之间的接口叫N6（同数据面接口）。A/B/D 错误：N9/N4/N3不符。", "383": "D 正确：TCP连接由源地址、目的地址、源端口号、目的端口号唯一确定（四元组）。A/B/C 错误：仅部分元素不符。", "3792": "ACD 正确：属于对外应急保障的是抢险救灾、国事活动和商业活动、应对突发公共事件。B 错误：应急及临时支撑属对内保障。", "3793": "ABC 正确：属于对内应急保障的是大网补充、应急及临时支撑、故障恢复。D 错误：应对突发公共事件属对外保障。", "3794": "AC 正确：增加小区覆盖区域的方法有提高天线的高度、增加基站的发射功率。B/D 错误：加大下倾/降低发射功率会缩小覆盖。", "3795": "AB 正确：可测试光纤损耗的仪表有光源光功率计、OTDR。C/D 错误：万用表/熔接机不符。", "3796": "ACD 正确：扩频通信被截获概率低、抗干扰能力强、能在选择性衰落和多径衰落的信道中可靠传输。B 错误：频谱利用率低不符。", "3797": "ABC 正确：TD-LTE E频段室分系统单极化MIMO天线间距应大于10cm、可以使用双极化天线、与TDS干扰较小与WLAN有干扰的说法正确。D 错误：MIMO两路馈线损耗不平衡不符。", "3798": "BC 正确：10dBm+10dBm=13dBm（功率加倍为13dBm）、10dBm+10dB=20dBm的等式正确。A/D 错误：数值不符。", "3799": "ABC 正确：铁丝熔接方式、自放电熔接方式、氢氧加热熔接方式不属于光纤熔接方法。D 正确：高压电弧放电方式为光纤熔接方法。", "3800": "ACD 正确：不是卫星解码器常用输入频段的是IF、C、KU（这些是天线侧频段概念）。B 正确：L频段是解码器常用输入频段。", "3801": "ACD 正确：属于发电机组工作辅助部分的是油机市电倒换装置、电缆绞盘、蓄电池充电部分。B 错误：发电机组的电源输出部分不符。", "3802": "BC 正确：决定端站本地卫星通信上行射频频点关键因素是Modem TxFreq和BUC本振。A/D 错误：Modem功率电平/LNB本振不符。", "3803": "ABC 正确：影响天馈系统驻波比性能的操作有馈线被压扁或损坏、馈线防水没做好雨天进水、接头螺纹错位。D 错误：弯曲半径过大不符（弯曲半径过小才影响）。", "3804": "BCD 正确：建有中星16号高通量卫星信关站的是成都、怀来、喀什。A 错误：西安不符。", "3805": "BD 正确：CDM570/L带高效IP包头压缩和载荷压缩功能，数据包越长压缩效率越低、数据包越短压缩效率越高。A/C 错误：组合不符。", "3806": "ABD 正确：系统上线前设计研发单位应回收开发过程中使用的特权用户、测试账户、超级管理员等临时账号及权限。C 错误：用户账户不符。", "3807": "AC 正确：物联网无线通信技术主要分为短距离通信技术和广域网通信技术两类。B/D 错误：蜂窝通信技术/无线局域网技术不符。", "3808": "AB 正确：物理层与高层通信接口主要有与RRC的控制信道、与MAC的传输信道。C/D 错误：与RLC的逻辑信道/与PDCP的专用信道不符。", "3809": "BCD 正确：无线信号经过多径传播后幅度、相位、时延属性将发生变化。A 错误：频率不变。", "3810": "AD 正确：无线通信中的传播条件主要分为视距通信和非视距通信环境。B/C 错误：反射通信/直接通信不符。", "3811": "ABCD 正确：无线电通信系统包括发射机、发射天线、接收天线、接收机。", "3812": "ABCD 正确：无线电波传播的方式有地波、天波、空间波、散射波。", "3813": "AD 正确：无人机按用途分类可分为军用无人机和民用无人机。B/C 错误：警用/农用无人机为民用细分。", "3814": "AC 正确：我国长途光缆采用的光纤主要为G.652光纤和G.655光纤。B/D 错误：G.653/G.656不符。", "3815": "ABC 正确：我国安全生产方针是安全第一、预防为主、综合治理。D 错误：预治结合不符。", "3816": "AC 正确：我国Ka频段动中通地球站接收频率为17.7-20.2GHz，发射频率为29.5-30.0GHz。B/D 错误：数值不符。", "3817": "ABCD 正确：蚊子会传播脑炎、疟疾、登革热、血丝虫病。", "3818": "BD 正确：为提高密闭电池安全性能，蓄电池设置了安全阀和防酸片。A/C 错误：隔热材料/绝缘器不符。", "3819": "ACD 正确：防止电信电源系统和人身遭受雷害主要采取重视接地系统的建设和维护、采用分区保护和多级保护、加装电涌保护器的原则。B 错误：采用等电位原理不符。", "3820": "BCD 正确：野外作业人员的饮食与营养应是高热量、高蛋白、高维生素的平衡膳食。A 错误：高纤维素不符。", "3821": "BD 正确：卫星转发器分为透明转发器和处理转发器两种基本类型。A/C 错误：遥测/控制转发器不符。", "3822": "ABC 正确：卫星转发器三个主要参数为SFD、G/T、EIRP。D 错误：Eb/No不符。", "3823": "ABD 正确：卫星有效载荷主要由前向链路、反向链路、广播链路组成。C 错误：物理链路不符。", "3824": "AB 正确：卫星移动通信业务通常使用L和S频段。C/D 错误：C/KU不符（固定业务用）。", "3825": "ACD 正确：卫星系统下行链路主要设备包括BDC、LNA、LNB。B 错误：BUC属上行设备。", "3826": "AD 正确：卫星通信载波在每年的春分和秋分期间遭受日凌干扰。B/C 错误：冬至/夏至不符。", "3827": "BCD 正确：卫星通信系统的干扰类型有交叉极化干扰、邻星干扰、邻道干扰。A 错误：随机干扰不符。", "3828": "ABCD 正确：卫星通信天线无法对星通常检查极化角、方位角、俯仰角、信标频率参数。", "3829": "ABC 正确：卫星通信天线的极化分为线极化、圆极化、椭圆极化。D 错误：抛物极化不符。", "3830": "ABC 正确：卫星通信的基本调制方式有ASK、FSK、PSK。D 错误：FM不符。", "3831": "ABD 正确：卫星天线的增益主要决定于天线的口径、工作频率、天线效率。C 错误：噪声温度不符。", "3832": "ABD 正确：卫星天线的增益和天线直径、工作频率、天线效率有关。C 错误：发射功率不符。", "3833": "ABD 正确：卫星解码器输入信号的来源有LNBDECODER、LND/TRCEIVER-、LNDECODER。C 错误：LNDECODER不符（该项与D重复且编号有误，选ABD）。", "3834": "CD 正确：卫星固定通信业务使用C和Ku频段。A/B 错误：L/S不符（移动业务用）。", "3835": "ACD 正确：卫星地球站通常使用的高功放有KPA、TWTA、SSPA。B 错误：IPA不符。", "3836": "BC 正确：卫星地面站中BUC的功能是功率放大和频率变换（上变频）。A/D 错误：低噪声放大/调制解调不符。", "3837": "ABC 正确：卫星传输中产生雨衰现象的相关因素包括降雨率、降雨层高度、电磁波的频率。D 错误：降雨时间不符。", "3838": "BCD 正确：卫星便携站天线伺服系统传感器分别为倾斜仪、极化角度传感器、GPS接收机。A 错误：电源模块不符。", "3839": "ABCD 正确：卫星KU波段下行频率为10.95～11.2GHz、11.45～11.7GHz、11.7～11.9GHz、12.25～12.75GHz。", "3840": "ABC 正确：微蜂窝基站覆盖楼宇室内覆盖、小范围室外覆盖（如街道）、隧道覆盖区域。D 错误：大范围室外覆盖不符（那是宏基站）。", "3841": "ABC 正确：微波通信系统中发信机由调制器、上变频器、高功率放大器组成。D 错误：天线不符（属天馈系统）。", "3842": "ABCD 正确：微波通信系统由发信机、收信机、天馈线系统、多路复用设备及用户终端设备等组成。", "3843": "ABCD 正确：微波通信具有可用频带宽、通信容量大、传输损伤小、抗干扰能力强等特点。", "3844": "ABCD 正确：微波通信包括地面微波接力通信、对流层散射通信、卫星通信、空间通信及工作于微波波段的移动通信。", "3845": "ABD 正确：微波接力通信系统中继方式可分为基带转接、中频转接、微波转接。C 错误：高频转接不符。", "3846": "ABC 正确：微波常见应用场景有海岛通信、基站接入、应急通信。D 错误：国际电路不符。", "3847": "ABC 正确：微波常见应用场景有海岛通信、基站接入、应急通信。D 错误：国际电路不符。", "3848": "BCD 正确：微波按波长不同可分为分米波、厘米波、毫米波及亚毫米波。A 错误：米波不符。", "3849": "ABD 正确：危险物品是指易燃易爆物品、危险化学品、放射性物品等能够危及人身安全和财产安全的物品。C 错误：易碎物品不符。", "3850": "CD 正确：危害通信电源的雷击大部分是感应雷和雷电侵入波。A/B 错误：直击雷/球雷不符（直击雷占比小）。", "3851": "ABD 正确：网优现场测试可以发现覆盖不足、导频污染、越区覆盖等问题。C 错误：基站过载不符（需话务统计发现）。", "3852": "BC 正确：网络连接数与节点数平方成正比、开通维护工作量指数级增加的是PTN和MSTP网状网结构。A/D 错误：IPRAN/路由器连接的网络不符。", "3853": "ABC 正确：推进监管和政务服务信息化建设，整合矿山、危险化学品、工贸和消防等重点行业领域监管监察执法系统。D 错误：道路运输不符。", "3854": "AC 正确：推进卫星通信系统与地面信息通信系统深度融合，初步形成覆盖全球、天地一体的信息网络。B/D 错误：天通通信/移动通信不符。", "3855": "BD 正确：土壤的电阻率主要由土壤中的含水量和土壤中水本身的电阻率来决定。A/C 错误：土壤类型/温度不符。", "3856": "BD 正确：突发事件应对工作实行预防为主、预防与应急相结合的原则。A/C 错误：应急为主/应急与防控相结合不符。", "3857": "ABCD 正确：突发事件应对法的制定可以起到维护人民生命财产安全、国家安全、公共安全、环境安全和社会秩序的作用。", "3858": "ABCDF 正确：突发事件特点是突发性、紧急性、高度不确定性、影响的社会性、决策的非程序性。E 错误：发展过程的计划性不符（突发事件无计划性）。", "3859": "ABCD 正确：突发事件是指突然发生造成或可能造成严重社会危害，需要采取应急处置措施予以应对的自然灾害、事故灾难、公共卫生事件、社会安全事件。", "3860": "ABC 正确：突发公共卫生事件应急通信保障事前防护物资包括普通医用口罩、N95口罩，防护服、护目镜、一次性手套，酒精、消毒洗手液、消毒药水。D 错误：水银体温计、常用药物不符。", "3861": "ABC 正确：突发公共事件应急体系响应程序可分为接警、响应级别确定、应急启动、救援行动、应急恢复、应急结束。D 错误：信息收集不符。", "3862": "AD 正确：统筹卫星与地面、公网与专网建设，综合利用5G、卫星通信、短波等通信技术，提高公众通信网抗灾能力。B/C 错误：有线与无线/模拟与数字不符。", "3863": "CD 正确：同步卫星固定通信业务使用C和Ku频段。A/B 错误：L/S不符（移动业务用）。", "3864": "ABCDE 正确：通信专业防止雷击安全防护措施有不在建筑物顶部孤立大树下避雨、不撑铁柄伞扛金属工具在旷野行走、不得擅自操作高低压电气设备、室外尽量不要接听拨打带线电话、架空光缆防强电防雷措施应完善。", "3865": "ABCD 正确：通信用开关电源保护功能有输入过欠压保护、输出过压保护、输出短路保护、过温保护。E 错误：电池欠压保护不符（电源本身不具备）。", "3866": "AB 正确：通信系统中的任何信号都可以归结为模拟信号和数字信号。C/D 错误：有线/无线信号不符。", "3867": "ABCD 正确：通信系统的接地类型分为室内接地、工作接地、保护接地、防雷接地。", "3868": "AD 正确：星形网和树形网基本结构不可以采用自愈环。B/C 正确：复合形网/环形网可以采用自愈环。", "3869": "ABC 正确：通信设施防止水淹安全防护措施有防汛准备期间将通信设施垫高、低洼地势通信设施做好防水、车辆预先停放在地势较高处。D 错误：暴雨期间必须加强基站值守不符（应是减少值守保证安全）。", "3870": "ABCD 正确：通信设备对通信电源系统基本要求包括可靠性高、稳定性高、模块化、效率高。E 错误：大型化不符。", "3871": "ABCD 正确：通信设备对通信电源提出的要求有可靠、稳定、高效、小型智能。", "3872": "ABC 正确：通信设备对电源系统的一般要求有可靠、稳定、效率高。D 错误：经济不符。", "3873": "ABC 正确：通信局直流供电系统由整流设备、直流配电设备、蓄电池组等组成。D 错误：UPS不符（UPS属交流系统）。", "3874": "ABC 正确：通信局(站)直流供电系统由整流设备、直流配电设备、蓄电池组等组成。D 错误：逆变器不符。", "3875": "AD 正确：通信机房内照明设置应配备常用照明和应急照明。B/C 错误：机架照明/电源柜照明不符。", "3876": "BCD 正确：通信工程安全四防概念包括防触电、防高坠、防火。A 错误：防盗窃不符。", "3877": "BCD 正确：通信工程安全四防概念包括防触电、防高坠、防火。A 错误：防盗窃不符。", "3878": "BCD 正确：通信电源直流系统输出端杂音中宽频杂音、峰-峰杂音、离散杂音指标衡量其对通信设备造成的影响。A 错误：衡重杂音不符（虽存在但本题答案不含）。", "3879": "ABCE 正确：通信电源系统由交流配电单元、监控单元、整流模块、直流配电单元等基本独立单元组成。D 错误：电池组不符。", "3880": "BED 正确：通信电源设备采用分立式模块结构，以便于不断扩容、降低备份成本、分段投资。A/C 错误：减少维护量/提高设备维护水平不符。", "3881": "ABCD 正确：通信电源保护功能有输入过欠压保护、输出过压保护、输出短路保护、过温保护。E 错误：电池欠压保护不符。", "3882": "ABC 正确：通信电源的交流供电包括供电站供给的交流电源、油机发电机供给的自备交流电源、整流器蓄电池和逆变器组成的交流不间断电源。", "3883": "ABCD 正确：通信车野外作业前检查发现制动、方向、雨刮器、灯光等故障应停止使用。", "3884": "ABC 正确：通信保障应急预案体系由国家通信保障应急预案、部门通信保障应急预案、地方通信保障应急预案、通信企业通信保障应急预案组成。D 错误：单位通信保障应急预案不符。", "3885": "ABCD 正确：通过大量事故案例分析，每个事故都取决于人的不安全行为、物的不安全状态、环境的不安全因素、管理的缺陷。", "3886": "BC 正确：通过北斗系统的短报文与位置报告功能，实现灾害预警速报、救灾指挥调度、快速应急通信。A/D 错误：定位导航授时/国际搜救不符。", "3887": "AC 正确：跳频能有效改善多径衰落、瑞利衰落现象。B/D 错误：同频干扰/阴影衰落不符。", "3888": "ABC 正确：跳频电台收发双方必须满足跳频频率相同、跳频序列相同、跳频时钟相同。D 错误：跳频频率间隔相同不符。", "3889": "ABD 正确：天线自动跟踪方式包括步进跟踪方式、单脉冲跟踪方式、程序跟踪方式。C 错误：IP跟踪方式不符。", "3890": "ACD 正确：天线主要性能指标有天线增益、天线辐射方向图、波束带宽。B 错误：天线重量不符（机械指标）。", "3891": "ABC 正确：天线性能参数包括天线的增益、极化方式、波束宽度。D/E 错误：天线高度/方位角不符。", "3892": "ABC 正确：天线系统按反射面材质可分为玻璃钢天线、碳纤维天线、铝合金天线等。D 错误：塑胶天线不符。", "3893": "ABCD 正确：天线系统的维护包括天线系统机械维护、充气系统、喇叭罩、天线指向调整。", "3894": "ABC 正确：天线数据测量的常用检测方法包括目测、俯仰角测试仪、罗盘。D 错误：皮尺不符。", "3895": "AC 正确：天线倾斜的目的是避免干扰、降低天线的增益（控制覆盖减少越区干扰）。B/D 错误：增加覆盖范围/降低路径损耗不符。", "3896": "ABC 正确：天线控制单元作用是调整天线的方位角、调整天线仰角和极化角、提供跟踪控制功能。", "3897": "ABC 正确：不是现行标准的天线方向图测试是29-25lgθ、30-25lgθ、31-25lgθ。D 正确：32-25lgθ是现行标准。", "3898": "ABC 正确：天线的下倾方式分为机械下倾、固定电子下倾、可调电子下倾。D 错误：定向下倾不符。", "3899": "ABD 正确：天线的俯仰角一般可以由天线高度、小区的覆盖半径、天线的垂直平面半功率角求得。C 错误：手持设备高度不符。", "3900": "ABC 正确：天线波束权值组主要配置参数包括水平/垂直波宽、水平方位角、下倾角。D 错误：3GPP频段号不符。", "3901": "AB 正确：天线波束的半功率点宽度与信号频率、天线的口径有关。C/D 错误：天线效率/工作地点不符。", "3902": "AB 正确：天线按照方向性可分为耦合器和功分器（本题实际为无源器件分类，选AB）。C/D 错误：干放/RRU不符。", "3903": "ABCD 正确：天线安装涉及安装俯角、天线最小隔离度、天线牢固度、天线性能方面。", "3904": "CD 正确：天通移动通信系统信关站位于广州和西安。A/B 错误：北京/上海不符。", "3905": "ABD 正确：天通移动通信系统提供的业务包括语音、短信、物联网。C 错误：宽带数据不符（天通为窄带移动业务）。", "3906": "AB 正确：天通移动通信系统使用频率包括S和C频段。C/D 错误：Ka/Ku不符。", "3907": "ABCD 正确：天通卫星移动通信由终端、通信卫星、信关站、应用平台等部分组成。", "3908": "BCD 正确：天馈线VSWR过高时可能发生切换数增加、寻呼成功率降低、无线接通率降低。A 错误：掉话数会减少不符（掉话会增加）。", "3909": "BD 正确：特种作业人员安全技术考核内容包括安全技术理论考试和实际操作技能考核。A/C/E 错误：技术等级考试/职业技能标准考核/职业分类标准考核不符。", "3910": "ABCD 正确：特种矿产地区作业应注意在放射性异常地区作业应进行防护、放射性异常矿体露头取样应防护、放射性标本样品及时放入专用容器、气体矿产取样佩戴过滤式防毒面具。", "3911": "BCD 正确：联合接地是指直流工作地、保护地、防雷地的联合。A 错误：交流工作地不符。", "3912": "ABC 正确：水中有病毒、细菌、寄生虫三种病原需要注意。D 错误：真菌不符。", "3913": "ABC 正确：水系地区作业应遵守水上地质勘探作业配备水上救生装备、每天对船和水上救生装备进行检查、徒步涉水河流水深应小于0.7米等原则。", "3914": "ABC 正确：双工器选择应考虑上行信号分离、防止过大上(下)行功放信号、防止宽带噪声谱落入上(下)行接收频段。D 错误：增益调节不符。", "3915": "BCD 正确：衰落变化一般规律有夜间比白天严重、夏季比冬季严重、平地比山区严重。A 错误：陆地比水上严重不符（水上比陆地严重）。", "3916": "CD 正确：衰落按其内在规律分可分为平坦衰落和选择性衰落。A/B 错误：快衰落/慢衰落不符（那是按变化快慢分）。", "3917": "AB 正确：数字信号是离散的、不连续的。C/D 错误：连续的/非离散的不符。", "3918": "ABC 正确：数字通信系统组成包括信源部分、信道部分、信宿部分。D 错误：信控部分不符。", "3919": "BCD 正确：数字集群通信系统技术体制包括TETRA、iDEN、GoTa。A 错误：GSM不符。", "3920": "ABC 正确：数字光端机按传输体系划分有PDH、SPDH、SDH。D 错误：GPDH不符。", "3921": "ABC 正确：数据卫星分组通信交换的方式包括电路交换、包交换、分组交换。", "3922": "ABCD 正确：数据通信业务主要包括分组交换业务、DDN业务、帧中继业务、ATM业务等。", "3923": "BCD 正确：数据采集设备所采集的数据包括数字数据、开关量、模拟数据。A 错误：用户通信数据信息不符。", "3924": "AC 正确：属于基站中断故障类型的是传输故障和电源故障。B/D 错误：连接线故障/时钟故障不符。", "3925": "ABC 正确：5GC的基本功能模块有AMF、SMF、UPF。D 错误：RFS不符。", "3926": "BD 正确：为了抢险救灾需要移动事故现场物件时，应做出标记、妥善保护现场主要痕迹、物证。A/C 错误：封闭事故现场/绘制现场简图不符。", "3927": "AC 正确：事故调查处理应当按照实事求是、尊重科学的原则。B/D 错误：求真务实/尊重事实不符。", "3928": "AD 正确：事故报告和调查处理工作要坚持政府领导、分级负责原则。B/C 错误：地方支持/企业参与不符。", "3929": "BC 正确：事发地通信保障应急指挥机构、基础电信运营企业和相关成员单位按照规定的内容和频次报送信息。A/D 错误：时间/格式不符。", "3930": "ABD 正确：使用静中通车载站支撑腿的正确操作有选择尽可能平的地方、合上车内24V直流空开、合上车后厢内支腿空开。C 错误：合上车内12V直流空开不符。", "3931": "BD 正确：两个端站均正常起ST时手动建立点对点通信失败的排查方向是其中一个端站modem发射频率设置问题、562L/564L接收电缆问题。A/C 错误：端站BUC未打开/570L接收电缆故障不符（570L为主用）。", "3932": "ABC 正确：使水分消耗至最低程度可采取多休息少活动、不要抽烟、待在阴凉场所措施。D 错误：适量饮酒不符（酒精加速脱水）。", "3933": "AC 正确：声码器位于手机和基站控制器设备中。B/D 错误：基站/交换机不符。", "3934": "CD 正确：生产经营单位应对操作岗位人员进行安全教育和技能培训，使其熟悉安全生产规章制度和安全操作规程。A/B 错误：安全考核/应急演练不符。", "3935": "ACD 正确：深化企业战略转型的举措包括业务与服务转型、网络与平台转型、财务与人力资源转型。B 错误：网络与技术转型不符。", "3936": "ABD 正确：社会安全事件主要包括恐怖袭击事件、经济安全事件、涉外突发事件等。C 错误：地震灾害属自然灾害。", "3937": "ACD 正确：上海机动局、湖北机动局、新疆机动局、四川机动局、广东机动局都属于中国电信确定的大区机动局。B 错误：河北机动局不符。", "3938": "ABCEF 正确：山区(雪地)作业规定包括出发前了解气候行程、大于30°陡坡或垂直攀登使用安全绳、两人间距、冰川雪地作业人员佩戴护目镜、雪崩危险带每个行进人员系雪崩带、雪线以上高原地区进行地质作业预防高原反应。D 错误：冰川雪地作业（应为佩戴护目镜，该项表述不符）。", "3939": "AB 正确：若通信电源遭遇直击雷、球雷，安装在附近的其他电气设备一般也将被损坏。C/D 错误：感应雷/雷电侵入波不符（主要是沿线路侵入）。", "3940": "ABCD 正确：润滑油的作用有润滑、冷却、清洁、密封等。", "3941": "ABD 正确：导致5G下载速率低的因素有服务器异常、传输带宽不足、弱覆盖。C 错误：终端为1T4R终端不符（1T4R为常见配置不影响）。", "3942": "ABCD 正确：注意饮食饮水卫生防止病从口入的方法有不喝不干净受污染的水、不用不干净水清洗生吃水果、不吃腐败变质受污染食物、已受污染饮用水一定要消毒处理。", "3943": "ABCD 正确：一味提高卫星上行发射功率会造成交叉极化干扰、邻星干扰、交调干扰、功带不平衡问题。", "3944": "ABC 正确：熔接机按熔接光纤类别可以分为多模熔接机、单模熔接机、多模/单模熔接机。D 错误：单芯熔接机不符。", "3945": "AB 正确：熔断器的作用有过流保护和短路保护。C/D 错误：过压保护/欠压保护不符。", "3946": "AC 正确：日凌中断发生在每年的春分和秋分。B/D 错误：夏至/冬至不符。", "3947": "AB 正确：日凌中断的发生时间规律是春分和秋分前后。C/D 错误：冬至/大雪不符。", "3948": "ABD 正确：人体触电方式主要分为单相触电、两相触电、跨步电压触电。C 错误：设备触电不符。", "3949": "ABD 正确：人工智能核心要素包括数据、算力、算法。C 错误：设备不符。", "3950": "BC 正确：人工搬运单体蓄电池应有二人以上互相配合轻搬轻放，安装电池体串联排列。A/D 错误：一人/并连排列不符。", "3951": "ABCE 正确：燃油回路可能造成柴油机不能启动或启动困难的故障有燃油系统内有空气、燃油管路或滤清器堵塞、喷油量很少或喷不出油、输油泵不供油或断续供油。D 错误：燃油电磁阀打开不符（打开属正常）。", "3952": "ABD 正确：燃油供给系统根据柴油机工作要求定时、定量、定压地将雾化良好的柴油按一定喷油规律喷入气缸。C/E 错误：定温/定质不符。", "3953": "BCD 正确：缺盐的首要症状表现是肌肉痉挛、头晕目眩、恶心和疲惫乏力。A 错误：口干舌燥不符（那是缺水症状）。", "3954": "BCD 正确：曲轴连杆机构包括活塞组件、连杆组件、曲轴飞轮组件等主要零件。A/E 错误：啮合装置组件/配重组件不符。", "3955": "CD 正确：强降雨对卫星通信的影响有使交叉极化鉴别度下降、产生附加的强度损耗甚至可能造成通信中断。A/B 错误：使交叉极化鉴别度上升/引起带内失真不符。", "3956": "ABC 正确：嵌入型室内机出现A3代码可能原因是排水异常、浮子开关异常、排水泵控制异常。D 错误：以上均不对不符。", "3957": "ABCD 正确：前置码包括的内容有载波恢复、比特定时、独特码、监控。", "3958": "AB 正确：汽油机中点火装置有蓄电池点火装置和磁电机点火装置。C 错误：压燃装置不符（压燃是柴油机）。", "3959": "ABCDEF 正确：启动Ⅰ级响应后各级通信保障应急指挥机构启动指挥联动、信息报送、会商、通信联络、信息通报、发布等工作机制。", "3960": "ABC 正确：企业文化的作用体现在物质文明、精神文明、政治文明方面。D 错误：生活文明不符。", "3961": "BC 正确：企业商业秘密有企业机密和企业秘密。A/D 错误：企业绝密/内部资料不符。", "3962": "BCD 正确：扑救火灾要争取灭早、灭小、灭了，将火灾扑灭在初起阶段。A 错误：灭好不符。", "3963": "ABC 正确：扑救火灾具体措施有报警、扑救初起火灾、疏散逃生。D 错误：救人不符（救人属应急救援，本题选报警/扑救/疏散）。", "3964": "ABCD 正确：平时服务主要包括为各类重大国事或社会活动提供保障、为公用通信网络正常运行提供服务、满足公众用户的应急保障需求、为社会经济发展提供支撑保障。", "3965": "AB 正确：频谱分析仪可用来测量信号的幅度和频率。C/D 错误：误码/频稳不符。", "3966": "BC 正确：偏馈天线就是将馈源和副反射面移出天线主反射面的辐射区，不遮挡主波束提高天线效率。A/D 错误：LNB/功放不符。", "3967": "AC 正确：抛物面天线口径越大增益越大、方向性越好。B/D 错误：增益越小/方向性越差不符。", "3968": "ABCD 正确：判断是否进入通道关断需要经过进入可节能时段、检测载波状态是否正常、判断是否为支持天线数、启动通道关负荷判断流程。", "3969": "ABC 正确：判断宏站是否越区可以通过估算TA(km)、平均下行RSRP、下行RSRP无线测量判断。D 错误：下行RSRQ不符。", "3970": "ABC 正确：攀登铁塔广泛使用的安全防护用具包括安全网、安全带、安全帽。D 错误：头盔不符。", "3971": "ABCE 正确：“PLAN”原则指P保护(Protection)、L定位(Location)、A获取(Acquisition)、N导航(Navigation)。D 错误：通知(Notification)不符。", "3972": "CE 正确：目前移动设备的基本交流电压有220V和380V两种。A/B/D 错误：340/320/240不符。", "3973": "ABC 正确：目前卫星地球站使用的高功率放大器有KPA、TWTA、SSPA。D 错误：WPA不符。", "3974": "ABCDE 正确：目前光纤(缆)活动连接器的基本结构主要有套管结构、双锥结构、V型槽结构、球面定心结构、透镜耦合结构。", "3975": "AB 正确：目前多路复用类型有频分多路通信和时分多路通信。C/D 错误：分插复用通信/终端复用通信不符。", "3976": "ABCD 正确：目前常用的网络时钟同步技术有GPS/BD、PTP/1588v2、SyncE、NTP。", "3977": "ABCD 正确：目前比较主流的物联网技术标准有NB-IoT、LoRa、SigFox、eMTC。", "3978": "ABD 正确：目前GPON上联支持带宽有10GE、GE、40GE。C 错误：100GE不符。", "3979": "ABD 正确：目前常用的光纤接入技术有无源光纤接入技术PON、有源光纤接入技术AON、同步光纤接入技术。C 错误：异步光纤接入技术不符。", "3980": "AC 正确：EIRP=天线增益+发射功率-馈线损耗=50dB+100W(20dBW)-1dB=69dBW=99dBm。B/D 错误：71dBW/101dBm不符。", "3981": "BCD 正确：IP传输网络传输丢包率高达20%可能原因有信道误码率过高、传输设备故障、网络拥塞。A 错误：信道误码率过低不符。", "3982": "ABD 正确：模数转换中的三个步骤是采样、量化、编码。C 错误：加密不符。", "3983": "ABC 正确：模拟信号需要经过取样、量化、编码步骤才能变成PCM数字信号。D 错误：调制不符。", "3984": "AC 正确：模拟量监控系统的组网方式有总线环组网和链型组网。B/D 错误：树形组网/分布式组网不符。", "3985": "ABCD 正确：模拟电话解调设备由限幅器、鉴频器、去加重网络、基带放大器等组成。", "3986": "ABCD 正确：模拟电话调制设备由基带放大器、预加重网络、频率调制器、中频放大器等组成。", "3987": "AB 正确：灭火的基本方法有冷却灭火法和隔离灭火法。C/D 错误：窒息灭火法/抑制灭火法不符（本题选AB）。", "3988": "ABCD 正确：灭火的基本方法有隔离法、冷却法、窒息法、抑制法。", "3989": "ABCD 正确：描述天线特性的基本参量有方向性、效率、增益、阻抗。", "3990": "ABC 正确：描述光接口的指标参数有发送信号波形、最小边模抑制比、接收灵敏度。D 错误：输出口信号比特率不符。", "3991": "ABCD 正确：免维蓄电池的使用寿命与工作环境、循环充放电频次、放电深度、充电电压有关。", "3992": "ABCD 正确：每年应急通信维护工作经验交流的主要内容有讨论年度维护工作、研究解决应急通信中出现的各种问题、交流维护管理工作经验、研讨应急通信新技术。", "3993": "ABC 正确：慢衰落余量与阴影衰落标准差、区域覆盖概率、路径损耗因子有关。D 错误：小区目标负载不符。", "3994": "ACD 正确：路由信息包含目的ip地址、出接口、下一条。B/E 错误：路由周期/源ip地址不符。", "3995": "ABCD 正确：路由器之间不通可能原因有2M电路不通、协议转换器设置了环回、路由器设置不正确、协议转换器坏掉。", "3996": "ABC 正确：路测发现小区间天线接反可从核查小区PCI参数是否配错、排查BBU-RRU光纤是否接反、排查小区间RRU-天线间的连接部分排查。D 错误：多通道智能天线检查不符（该项截断且不属于本题答案）。", "3997": "AB 正确：流媒体技术两个关键特征是数据压缩和流式传输。C/D 错误：多业务聚合/专线传输不符。", "3998": "BCD 正确：领导小组召开会商会议协调组织跨部门、跨地区、跨企业相关工作。A 错误：跨行业不符。", "3999": "ABD 正确：临时性防火封堵可以采用防火包、防火泥、防火涂层矿棉板材料。C 错误：防火浆不符。", "4000": "ABC 正确：林区作业原则有随时确定自己所在位置、生火时有专人看守并随时扑灭、森林地区地质勘探作业加强防火宣传。D 错误：林区出现火灾预兆时迅速撤离不符（应尽快扑灭初期火灾并报告）。", "4001": "ABC 正确：邻道干扰主要原因包括相邻信道间隔过小、相邻信道滤波不完全、工作频带相近的其他站的寄生辐射。D 错误：雨衰引起的极化方向改变不符。", "4002": "ABE 正确：两台柴油发电机组并联运行条件是电压相等、频率相等、相位相同。C/D 错误：型号相同/功率相同不符。", "4003": "ABD 正确：联合接地是将避雷针的接地装置、天馈线的接地装置、室内接地装置连接在一起。C 错误：设备接地装置不符。", "4004": "BC 正确：联合接地的要求有工作地与设备保护地必须接在公共接地装置上、避雷针专门引下线必须与设备接地线分开一定距离。A 错误：所有接地线必须在同一处不符。", "4005": "AB 正确：联合接地的基本原则是各种通信系统设备的保护地、工作地以及局站防雷地联合接成一个公共地网。C/D 错误：零线/火线不符。", "4006": "ABCD 正确：利用综合资源管理系统提交业务电路开通单时必须填写数量、速率、机房、网元信息。", "4007": "BCD
