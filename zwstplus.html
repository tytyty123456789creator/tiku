安全帽每半年检查1次帽壳强度。A/C/D 错误：3个月/1年/2年不符。", "219": "B 正确：绝缘工具每季度进行1次绝缘测试。A/C/D 错误：月/半年/年不符。", "220": "B 正确：有限空间作业使用隔离式呼吸器，严禁使用过滤式面具（滤毒罐无法供氧）。A 错误：正压式空气呼吸器是隔离式可用。C 错误：防毒面罩过滤式不可用。D 错误：自给式呼吸器是隔离式可用。", "221": "B 正确：高处作业传递工具材料必须使用吊绳或工具袋。A/C/D 错误：抛掷/人力搬运/电梯运送均不符。", "222": "B 正确：电瓶车应在标准充电桩充电。A/C/D 错误：室内/办公室/楼道充电有火灾隐患。", "223": "B 正确：楼面作业无护栏时禁止站在边缘1m内。A/C/D 错误：0.5/1.5/2m不符。", "224": "B 正确：屋顶施工平房应走边（沿屋脊与檐口间踩踏受力结构）。A/C/D 错误：尖/钉/脊非安全走位。", "225": "B 正确：不明线缆、设备及设施一律按带电处理。A/C/D 错误：视为不带电/询问后/直接接触均危险。", "226": "B 正确：墙壁线缆与电力线交越间距不小于5cm。A/C/D 错误：3/10/15cm不符。", "227": "B 正确：设备加电按先直流后交流、先下级后上级顺序操作。A/C/D 错误：顺序不符。", "228": "B 正确：电源割接需双人操作（一人操作一人监护复核）。A/C/D 错误：单/三/四人非规定。", "229": "B 正确：杆上作业人员头部禁止超过杆顶（防触电与平衡）。A/C/D 错误：超过/视情况/审批后超过均违规。", "230": "B 正确：电锤、电钻使用禁止戴手套操作（防卷入旋转部件）。A/C/D 错误：戴手套/随意/绝缘手套均不符。", "231": "B 正确：涉高压作业（≥35kV）需额外配备绝缘挡板。A/C/D 错误：防毒面罩/安全绳/护目镜非高压专项防护。", "232": "B 正确：有限空间安全绳另一端由地面监护人员手持（监护配合救援）。A/C/D 错误：本人/班组长/路人非规定。", "233": "B 正确：动火作业范围应配备2个4公斤灭火器。A/C/D 错误：数量规格不符。", "234": "B 正确：道路作业车辆停放在非弯道、非人员密集区。A/C/D 错误：弯道/道路中间/随意停放均危险。", "235": "B 正确：道路作业人员必须穿反光衣（夜间可见）。A/C/D 错误：工作服/西装/便装无反光防护。", "236": "B 正确：涉水作业需测验水体是否有电。A/C/D 错误：鱼/异味/杂质非检测目的。", "237": "B 正确：心肺复苏按压频率为100～120次/分钟。A/C/D 错误：频率不符。", "238": "B 正确：动脉出血使用止血带每30分钟放松1次（防肢体坏死）。A/C/D 错误：15/60/90分钟不符。", "239": "B 正确：触电事故处置首先应立即切断电源（先断电再施救）。A 错误：直接接触触电者会连带触电。C/D 错误：拨打120/心肺复苏是后续步骤。", "240": "B 正确：触电者若有灼伤，用无菌纱布覆盖（防感染）。A/C/D 错误：涂药膏/冷水冲洗/涂牙膏均不规范且可能加重感染。", "241": "B 正确：有限空间中毒窒息救援，救援人员须佩戴隔离式呼吸器进入。A/C/D 错误：直接冲入/湿毛巾捂口鼻/屏住呼吸均无法防中毒。", "242": "B 正确：登高电工操作证复审周期为六年。A/C/D 错误：五年/八年/十年不符。", "243": "B 正确：“每日班会五必查”=服帽带鞋和电笔。A/C/D 错误：车辆/工具/材料等组合非“五必查”内容。", "244": "B 正确：线缆护套应为阻燃、低烟无卤聚烯烃材料。A/C/D 错误：易燃/普通PVC/金属材质均不符合安全要求。", "245": "B 正确：平安歌中下井孔“检测仪，常开启”。A/C/D 错误：常关闭/定期测/备用不符。", "246": "B 正确：风力五级以上时楼顶作业应停止。A/C/D 错误：继续/加速/两人作业均违规。", "247": "B 正确：安全带距离杆梢应在50厘米以下（系挂位置低于杆顶防触电）。A/C/D 错误：30/80/100cm不符。", "248": "B 正确：“上岗前，问自己，忌喝酒，不蛮干”强调个人身心状态管理。A/C/D 错误：安全检查/工具检查/环境评估非对应内容。", "249": "B 正确：锂电工具电池宜取下充电（防设备内充电起火）。A/C/D 错误：安装在设备上/室外/楼道充电均不符。", "250": "B 正确：骑行途中需使用APP应靠边停下再操作。A/C/D 错误：骑行途中看APP危险。", "251": "B 正确：动火作业灭火毯长宽均不低于1.5米。A/C/D 错误：1/2/3米不符。", "252": "B 正确：YD 5201-2014由工业和信息化部发布。A/C/D 错误：住建部/安监总局/发改委非发布部门。", "253": "B 正确：通信建设工程安全生产方针是“安全第一、预防为主、综合治理”。A/C/D 错误：表述不完整或错误。", "254": "B 正确：通信线路工程施工人员属于国家规定的特种作业人员。A/C/D 错误：普通/技术工种/高危作业人员均非准确分类。", "255": "B 正确：施工现场机具材料堆积高度不宜超过1.5m。A/C/D 错误：1.0/2.0/2.5m不符。", "256": "B 正确：发现严重安全事故隐患，总监理工程师要求施工单位停止施工并报建设单位。A/C/D 错误：仅整改/直接报/自行处理均不完整。", "257": "B 正确：管道工程施工前应向作业人员做安全技术交底。A/C/D 错误：技术培训/现场演练/资格审查非开工前安全要求。", "258": "B 正确：上下沟槽应使用梯子，不得攀登沟内外设备。A/C/D 错误：直接攀爬/借助支撑/多人协助均违规。", "259": "B 正确：挖掘土石方应从上而下进行，不得采用掏挖方法。A/C/D 错误：从下而上/左右掏挖易塌方。", "260": "B 正确：流砂、疏松土质沟深超过1.0m时应安装挡土板。A/C/D 错误：0.5/1.2/1.5m不符。", "261": "B 正确：拆除挡土板如有塌方危险，应先回填一部分土，经夯实后再拆除。A/C/D 错误：全部拆除/加固沟壁/设置警示不符。", "262": "B 正确：制作模板和挡土板的木料不得有断裂现象。A/C/D 错误：弯曲/节疤/虫蛀虽影响质量但“断裂”是禁止项（模板受力关键）。", "263": "B 正确：坑边载荷与沟边保持安全距离主要目的是防止沟壁坍塌。A/C/D 错误：噪声/搬运/环保非主要目的。", "264": "B 正确：沟槽穿越道路且不能中断交通时，应搭设临时便桥。A/C/D 错误：防护棚/挡土板/警示带无法保障通行。", "265": "B 正确：人工铺管水泥管块堆放不宜高出1.0m，管块平放。A/C/D 错误：0.5/1.5/2.0m不符。", "266": "B 正确：砌筑人孔及抹灰高度超过1.2m时应搭设脚手架。A/C/D 错误：1.0/1.5/1.8m不符。", "267": "B 正确：脚手架上堆砖高度不得超过3层侧砖。A/C/D 错误：2/4/5层不符。", "268": "B 正确：小孔管道试通用穿管器带试通棒试通。A/C/D 错误：试通管/牵引绳/测量仪不符。", "269": "B 正确：钢筋冷拉作业钢筋两侧3m以内及拉筋两端不得站人。A/C/D 错误：可以站人/经批准/短暂停留均危险。", "270": "B 正确：进入地下室、人孔前必须使用专用气体检测仪器进行气体检测。A/C/D 错误：试纸/嗅觉/动物试验均不准确可靠。", "271": "B 正确：上下人孔时必须使用梯子。A/C/D 错误：脚扣/绳索/攀爬人孔壁均违规。", "272": "B 正确：进入人孔必须佩戴全身式安全带、安全帽并系好安全绳。A/C/D 错误：牵引/信号/保险绳表述不符（规范为安全绳）。", "273": "B 正确：人孔内感觉呼吸困难或身体不适必须立即呼救并迅速撤离。A/C/D 错误：坚持/等待/自行查找均危险。", "274": "B 正确：使用电力潜水泵抽水严禁边抽水边下人孔作业。A/C/D 错误：连续抽水/抽后作业/发电机供电均不是禁止行为。", "275": "B 正确：发电机排气管应放在人孔下风方向（废气吹离井口）。A/C/D 错误：上风/正上方/任意方向不符。", "276": "B 正确：严禁在地下室、人孔内点燃喷灯（明火引燃爆炸）。A/C/D 错误：手电筒/对讲机/安全帽是允许的。", "277": "B 正确：严禁将易燃、易爆物品带入地下室或人孔。A/C/D 错误：安全帽/手电筒/检测仪是必备物品。", "278": "B 正确：有限空间作业期间必须保证通风良好。A/C/D 错误：照明/温度/湿度非最关键要求。", "279": "B 正确：地下室、人孔内有积水时应先抽干后再作业。A/C/D 错误：立即下入/穿雨靴/铺木板均不安全。", "280": "B 正确：上下杆时不准二人及以上同时上下杆。A/C/D 错误：一人可正常上下，三人/四人表述不完整（二人及以上即禁止）。", "281": "B 正确：检查脚扣安全性时卡在离地面30cm的电杆上。A/C/D 错误：20/40/50cm不符。", "282": "B 正确：杆上作业前系好安全带并扣好保险环。A/C/D 错误：挂环/锁扣/卡扣表述不符（规范为保险环）。", "283": "B 正确：杆下监护人不得靠近杆根（防杆上掉落物与倒杆）。A/C/D 错误：交通工具/建筑物/电力线非规定。", "284": "B 正确：未辩明性质的其他线缆一律按电力线处理。A/C/D 错误：通信线/广电线/信号线均危险。", "285": "B 正确：通信线与电力线接触或电力线落地时，必须立即停止一切作业。A/C/D 错误：剪通信线/报告后继续/用工具触动电力线均危险。", "286": "B 正确：原杆路作业先用试电笔检查确认没有带电后再作业。A/C/D 错误：无信号/无破损/无张力非检查目的。", "287": "B 正确：电力线在杆顶交越时，作业人员头部不得超过杆顶。A/C/D 错误：吊线/拉线/安全带位置均非限制高度。", "288": "B 正确：光电缆通过供电线路上方，通信施工人员不得将供电线擅自剪断。A/C/D 错误：剪断/移动/送电供电线均属违规危险行为。", "289": "B 正确：供电线及高压线附近作业必须使用绝缘工具。A/C/D 错误：金属/普通/电动工具均可能导电致触电。", "290": "B 正确：金属顶棚建筑物作业前应用试电笔检查确认无电。A/C/D 错误：温度计/万用表/验电贴非规范验电工具。", "291": "B 正确：汽车装运电杆杆材重心应落在车厢中部。A/C/D 错误：前/后/任意位置会导致行车失衡。", "292": "B 正确：卸车松捆应按顺序逐一进行，不得全部松开。A/C/D 错误：随机/从两端/从中间松捆易致电杆滚动伤人。", "293": "B 正确：电杆堆放水泥杆不超过两层。A/C/D 错误：一/三/四层不符。", "294": "B 正确：人工立杆杆立起至30°角时使用杆叉、牵引绳等助力。A/C/D 错误：15/45/60度不符。", "295": "B 正确：严禁在电力线路正下方（尤其是高压线路下）立杆作业。A/C/D 错误：通信线/树木/建筑物下可立杆。", "296": "B 正确：吊车立杆时吊车臂下及杆下严禁站人。A/C/D 错误：可以站人/经批准/短暂停留均危险。", "297": "B 正确：电杆夯实后方能撤除杆叉及登杆摘除牵引绳。A/C/D 错误：离开现场/布放光缆/安装拉线均需在撤除辅助后。", "298": "B 正确：终端拉线钢绞线必须比吊线大一级（强度更高）。A/C/D 错误：小一级/相同/任意规格均不满足拉力要求。", "299": "B 正确：更换拉线在新拉线张力松泄旧拉线后再拆除旧拉线。A/C/D 错误：先装/布缆/回填顺序错。", "300": "B 正确：收紧拉线或吊线时扳动紧线器以二人为限。A/C/D 错误：一/三/四人不符。", "301": "B 正确：人工布放钢绞线牵引前端必须使用干燥的麻绳。A/C/D 错误：钢丝绳/尼龙绳/铁丝导电或有火花风险。", "302": "B 正确：剪断钢绞线前剪点两端应先人工固定，剪断后缓松。A/C/D 错误：加热/标注/测量非固定措施。", "303": "B 正确：杆下用紧线器拉紧全程吊线时杆上不准有人（防吊线崩断伤人）。A/C/D 错误：可以/必须/经批准有人均违规。", "304": "BC 正确：较大风险（车辆轮胎磨损等）48小时内制定整改方案并启动整改。A 错误：立即停工是重大风险处置要求。D 错误：72小时时限不符。", "305": "BCD 正确：安全生产专项资金用于安全培训与教育、安全防护装备配备、应急管理保障。A 错误：人员福利不属于安全资金用途。", "306": "BCD 正确：“一人一档”培训档案包括培训内容、考核试卷、成绩记录。A 错误：考核时间不属于档案必备内容（题干选项为考核时间）。", "307": "BCD 正确：安全带禁止事项=双钩同时解开、将五点式安全带当单腰带使用、把锚点固定在不稳固物体上。A 错误：高挂低用是正确做法。", "308": "BCD 正确：采购与验收=核查营业执照产品合格证检测报告、禁止采购三无产品、验收不合格一律退货。A 错误：不能仅看单价最低，须满足标准。", "309": "BCD 正确：高处坠落处置=设警戒区禁止无关人员进入、检查伤者骨折出血、意识丧失实施心肺复苏并拨打120。A 错误：应停止作业全力救治。", "310": "BCD 正确：暴雨、雷电、高温（≥38℃）应停止户外作业。A 错误：4级大风不需停止（规范为6级以上大风）。", "311": "BCD 正确：区县及分支局近场管理职责=每月至少1次安全培训讲座、每季度至少1次安全警示教育、每年至少1次应急预案演练。A 错误：四不两直检查是每月至少1次而非季度。", "312": "BCD 正确：通信线与电力线接触或落地时=保护现场、禁止行人步入危险地带、立即报告并指定专业人员排除事故。A 错误：必须立即停止一切作业活动。", "313": "BCD 正确：供电线上方架线=搭设安全保护架将电力线罩住、放线车和吊线良好接地、先做单档临时辅助吊线。A 错误：严禁抛掷缆线过供电线。", "314": "BCD 正确：坐吊板过特殊位置=经过电杆时使用脚扣或梯子、严禁爬抱而过、注意与电力线安全距离。A 错误：过吊线接头时须使用梯子。", "315": "BCD 正确：有害气体中毒应急=先通风再戴氧气呼吸器进入施救、将中毒者移至空气新鲜处、呼吸停止者人工呼吸。A 错误：不顾一切进入救人危险。", "316": "C 正确：高空、有限空间、涉电作业线上审批需落实第三级安全技术交底。A/B/D 错误：一/二/四级不符。", "317": "C 正确：《办法》制定依据不包括《中国电信通信网络运行维护规程》。A/B/D 错误：安全生产法、集团安全生产管理办法通知、46号文件均为制定依据。", "318": "C 正确：各级单位在安全生产工作中应严格履行主体责任。A/B/D 错误：管理/监督/连带责任非核心表述。", "319": "C 正确：安全生产专项资金投入责任主体是基层业务部门、安全管理部门。A/B/D 错误：集团/省公司/财务部门非责任主体。", "320": "C 正确：区县分公司对班组上报的安全风险须在24小时内完成审核。A/B/D 错误：2/12/48小时不符。", "321": "C 正确：一般安全风险（工器具轻微破损等）需在72小时内完成整改。A/B/D 错误：24/48小时/7天不符。", "322": "C 正确：安全积分机制每人每年12分。A/B/D 错误：6/10/20分不符。", "323": "C 正确：安全带经坠落冲击后应立即报废（冲击后结构受损不可再用）。A/B/D 错误：检查/送检/维修后使用均不符合报废要求。", "324": "C 正确：一般绝缘鞋使用年限为24个月。A/B/D 错误：12/18/36个月不符。", "325": "C 正确：低压试电笔严禁用于测量高压。A/B/D 错误：直流/交流/弱电是试电笔可用范围。", "326": "C 正确：涉事作业人员违规作业、擅自作业应承担直接责任人责任。A/B/D 错误：运营管理/维护实施责任归管理环节，意外事件非责任类型。", "327": "C 正确：培训档案保存期限不少于3年。A/B/D 错误：1/2/5年不符。", "328": "C 正确：一般安全帽（ABS材质）质保期为30个月。A/B/D 错误：12/24/36个月不符。", "329": "C 正确：脚扣踏脚板检测方法是悬吊200kg重物检查。A/B/D 错误：100/150/300kg不符。", "330": "C 正确：有限空间救援三脚架承重不低于500公斤。A/B/D 错误：200/300/800公斤不符。", "331": "C 正确：有限空间防爆灯具亮度不低于300lux，续航不低于4小时。A/B/D 错误：100/200/500lux不符。", "332": "C 正确：遇6级以上大风等恶劣天气应立即停止户外作业。A/B/D 错误：4/5/8级不符（规范为6级）。", "333": "C 正确：高温天气停止户外作业标准是≥38℃。A/B/D 错误：35/36/40℃不符。", "334": "C 正确：吊顶作业防爆灯具电压不超过36V。A/B/D 错误：12/24V偏低、220V危险。", "335": "C 正确：同一垂直面禁止交叉作业（上下物体坠落伤人）。A/B/D 错误：允许/审批后/有监护人允许均违规。", "336": "C 正确：三线交越作业35kV以下电力线安全距离不小于2.5m。A/B/D 错误：1.5/2/4m不符（4m是35kV以上要求）。", "337": "C 正确：三线交越35kV以上电力线安全距离不小于4m。A/B/D 错误：2.5/3/5m不符。", "338": "C 正确：墙壁线缆与电力线平行间距不小于15cm。A/B/D 错误：5/10/20cm不符。", "339": "C 正确：进入有限空间前自然通风时间应≥30分钟。A/B/D 错误：15/20/60分钟不符。", "340": "C 正确：有限空间作业中应每30分钟复测气体。A/B/D 错误：15/20/60分钟不符。", "341": "C 正确：有限空间作业照明应使用防爆灯具。A/B/D 错误：普通/LED/荧光灯均不防爆。", "342": "C 正确：涉水作业水深不得超过1.2m。A/B/D 错误：0.5/0.8/1.5m不符。", "343": "C 正确：晴天且水流平稳才能进行涉水作业。A/B/D 错误：雷雨/洪水/暴雨天气严禁涉水。", "344": "C 正确：心肺复苏按压深度为5～6cm。A/B/D 错误：3-4/4-5/6-8cm不符。", "345": "C 正确：高压线缆坠落应设8～10m警戒区。A/B/D 错误：3-5/5-8/10-15m不符。", "346": "C 正确：电气火灾应用CO₂或干粉灭火器（不导电）。A 错误：水导电危险。B 错误：泡沫灭火器含水导电。D 错误：沙土不能扑灭电气火灾。", "347": "C 正确：火灾灼伤用冷水冲洗15～20分钟。A/B/D 错误：5-10/10-15/20-30分钟不符。", "348": "C 正确：火灾灼伤处理严禁涂抹牙膏、酱油（污染创面）。A/B/D 错误：冷水冲洗、无菌纱布覆盖、脱去燃烧衣物均为正确处置。", "349": "C 正确：外包与分包单位安全生产责任不包括“对主业的安全检查进行抵制”。A/B/D 错误：建立安全生产责任制、足额配备劳保用品、接受主业培训检查均为应尽责任。", "350": "C 正确：锂电池工具充电时人不得离开且远离易燃物品（A和B都正确）。A/B 错误：单说不全面。D 错误：A和B都错误不符合安全要求。", "351": "C 正确：热熔胶枪、电烙铁使用时人不得离开且冷却后再收纳（A和B都正确）。A/B 错误：单说不全面。D 错误：均正确而非均错误。", "352": "C 正确：雷暴天气应迅速撤离到安全区域。A/B/D 错误：电杆下/铁塔下躲避、手持金属工具行走均危险。", "353": "C 正确：雷暴天气“在池塘边停留”是错误行为。A/B/D 错误：停止室外作业、远离单独竖立物、减少携带金属物均为正确做法。", "354": "C 正确：室内设备巡检不属于高风险与特殊场景作业。A/B/D 错误：高空/有限空间/动火作业均属高风险特殊场景。", "355": "C 正确：YD 5201-2014制定依据不包括《建筑法》。A/B/D 错误：安全生产法、建设工程安全生产管理条例、相关法律法规行业标准均为依据。", "356": "C 正确：机械伤害不属于通信线路作业主要危险因素。A/B/D 错误：高处坠落、触电、有害气体中毒均为主要危险因素。", "357": "C 正确：雷雨天严禁进行电测法物探作业及收放导线。A/B/D 错误：可以/不宜/经批准可均不符（雷雨引雷致命）。", "358": "C 正确：严禁用金属杆直接钎插探测地下输电线和光缆（防挖断带电线路）。A/B/D 错误：水管/燃气管/供热管虽有风险但题干特指电力和光缆。", "359": "C 正确：非开挖钻杆设备与电力线保持2.5m以上安全距离。A/B/D 错误：1.5/2.0/3.0m不符。", "360": "C 正确：非开挖顶管施工区域设置警示标志围栏，指定专人维持交通。A/B/D 错误：施工秩序/设备运转/现场卫生非专责目的。", "361": "C 正确：安全带应兜挂在距杆梢50cm以下的位置。A/B/D 错误：30/40/60cm不符。", "362": "C 正确：圆形水泥杆脚扣不得攀登方型水泥杆（脚扣与杆型须匹配）。A/B 错误：可以以大代小、木杆脚扣可登水泥杆均违规。D 错误：各种脚扣不可互相替代。", "363": "C 正确：使用脚扣上杆时不得穿硬底鞋、拖鞋（易滑脱）。A/B/D 错误：软底鞋/运动鞋/胶鞋可配合脚扣使用。", "364": "C 正确：材料工具应用工具袋传递。A/B/D 错误：手直接传递/抛掷/绳索捆绑均不规范不安全。", "365": "C 正确：高压线附近作业35KV以下最小空距2.5m。A/B/D 错误：1.5/2.0/4.0m不符。", "366": "C 正确：高压线附近作业35KV以上最小空距4.0m。A/B/D 错误：2.5/3.0/5.0m不符。", "367": "C 正确：人工立杆人力肩扛时必须用同侧肩膀（步调一致防失衡）。A/B/D 错误：左肩/右肩/交替肩膀均易失衡。", "368": "C 正确：雷雨天气严禁上杆施工作业。A/B/D 错误：可以/不宜/经批准可均违规。", "369": "CD 正确：对责任人问责形式包括取消评优资格、绩效扣罚调离岗位。A/B 错误：解除劳动合同、降低岗级非办法规定的问责形式。", "370": "CD 正确：防护用品维护=安全带每2年1次承重测试、报废用品统一回收禁止继续使用。A 错误：绝缘工具是每季度1次绝缘测试（半年不符）。B 错误：安全帽是每半年检查1次帽壳强度（每年不符）。", "371": "CD 正确：涉电作业正确事项=雷暴天气停止室外涉电作业、严禁用户侧乱拉乱接电源。A/B 错误：不戴绝缘手套未验电直接作业、带电剪断线缆均属违规。", "372": "CD 正确：预防物体打击=立杆时掌握好力的平衡防止倒杆、紧线器安全可靠挟线要紧。A/B 错误：高处扔工具、坠落范围内站人均属违规。", "373": "D 正确：省公司云网运营部职责不包括“统筹推进AI能力、远程监控等”。A/B/C 错误：细化本省细则、建立外包单位评价机制、编制本地培训材料均为其职责。", "374": "D 正确：“四不伤害”不包括“不伤害设备”。A/B/C 错误：不伤害自己、不伤害他人、不被他人伤害均为四不伤害内容。", "375": "D 正确：线上培训要求全员每月参与率达100%。A/B/C 错误：80/90/95%均不达标。", "376": "D 正确：心脏病、高血压、癫痫病人员均不可从事高处作业（以上均不可）。A/B/C 错误：三类疾病任一均属禁忌。", "377": "D 正确：有限空间作业应使用四合一气体检测仪。A/B/C 错误：单一/二合一/三合一检测项目不全。", "378": "D 正确：中毒窒息伤者意识清醒时“喂水催吐”不正确（易窒息）。A/B/C 错误：给予新鲜空气、必要时吸氧、避免活动均为正确处理。", "379": "D 正确：智能安全帽功能不包括“自动报警”。A/B/C 错误：脱帽告警、近电提醒、作业过程录像均为其功能。", "380": "D 正确：智慧综维APP应急处置功能不包括“自动救援”。A/B/C 错误：内置处置流程、一键拨报警电话、自动生成事故报告初稿均为其功能。", "381": "D 正确：沟坑深1.5m以上挖出土石堆放在距沟坑边沿60cm以外。A/B/C 错误：30/40/50cm不符。", "382": "D 正确：电杆堆放木杆不超过六层。A/B/C 错误：三/四/五层不符。", "383": "答“错误”。该说法错误：《办法》适用于自有人员、外包人员及分包单位等全部综维装维从业人员，并非仅适用自有人员。", "384": "答“错误”。该说法错误：安全生产专项资金专款专用，严禁截留、挤占用于其他用途。", "385": "答“错误”。该说法错误：高空、有限空间、涉电作业须100%线上审批，禁止线下口头审批后实施。", "386": "答“错误”。该说法错误：省公司组织全省安全检查每季度1次，不是每月1次。", "387": "答“错误”。该说法错误：一般安全风险需在72小时内完成整改，不是48小时。", "388": "答“错误”。该说法错误：重大安全风险必须立即停工，24小时内制定整改方案并启动整改，不能不停工。", "389": "答“错误”。该说法错误：高风险工单智能管控中，无安全交底记录不能提交工单（强制要求上传双人作业照片+安全交底记录）。", "390": "答“错误”。该说法错误：年底安全积分低于6分者需专项培训，不合格者待岗，不是3分。", "391": "答“错误”。该说法错误：发生人员死亡的安全生产事故由集团安委会记录并督办，不是各省安委会。", "392": "答“错误”。该说法错误：吊装作业必须办理吊装作业审批单并经审批，不能自行决定。", "393": "答“错误”。该说法错误：智能安全帽试点应用优先在高风险、偏远区域推广，不是城市区域。", "394": "答“错误”。该说法错误：当与国家或行业标准冲突时，应以国家或行业标准为准，不是以本办法为准。", "395": "答“错误”。该说法错误：培训档案保存期限不少于3年，不是5年。", "396": "答“错误”。该说法错误：一般安全帽（ABS材质）质保期为30个月，不是36个月。", "397": "答“错误”。该说法错误：安全带经坠落冲击后应立即报废，即使检查完好也不得继续使用。", "398": "答“错误”。该说法错误：低压试电笔严禁用于测量高压电路。", "399": "答“错误”。该说法错误：使用脚扣上杆随身携带工具总重量不得超过5kg，不是8kg。", "400": "答“错误”。该说法错误：雷暴天气严禁在电杆、铁塔下躲避（易引雷）。", "401": "答“错误”。该说法错误：高处作业传递工具材料必须使用吊绳或工具袋，禁止抛掷。", "402": "答“错误”。该说法错误：电瓶车应在标准充电桩充电，禁止在室内充电（火灾隐患）。", "403": "答“错误”。该说法错误：电源割接需双人操作（一人操作一人监护复核），严禁单人操作。", "404": "答“错误”。该说法错误：杆上作业人员头部禁止超过杆顶。", "405": "答“错误”。该说法错误：有限空间作业严禁用纯氧通风（易爆燃），应使用空气通风。", "406": "答“错误”。该说法错误：有限空间作业严禁单人进入，必须有监护与配合。", "407": "答“错误”。该说法错误：雷雨、洪水天气严禁开展涉水作业。", "408": "答“错误”。该说法错误：道路作业车辆应停放在非弯道、非人员密集区，禁止停在弯道处。", "409": "答“错误”。该说法错误：触电处置首先切断电源，严禁直接接触触电者拉离电源（会连带触电）。", "410": "答“错误”。该说法错误：电气火灾应用CO₂或干粉灭火器扑救，水或泡沫灭火器导电危险。", "411": "答“错误”。该说法错误：有限空间中毒窒息伤者意识清醒时禁止喂水催吐（易窒息）。", "412": "答“错误”。该说法错误：触电者灼伤应用无菌纱布覆盖，禁止涂抹药膏。", "413": "答“错误”。该说法错误：当本办法与国家或行业标准冲突时，应以国家或行业标准为准。", "414": "答“错误”。该说法错误：安全带应每12个月进行1次静态测试，超期禁止使用（题干24个月错误）。", "415": "答“错误”。该说法错误：酒精应置于防爆箱内存放，不是普通抽屉。", "416": "答“错误”。该说法错误：动火作业范围内10米内应配备2个4公斤灭火器，不是1个。", "417": "答“错误”。该说法错误：集团公司定期组织全国性安全检查（非每季度固定频次）。", "418": "答“错误”。该说法错误：较大安全风险48小时内制定整改方案并启动整改，不是24小时。", "419": "答“错误”。该说法错误：同一垂直面禁止交叉作业。", "420": "答“错误”。该说法错误：吊顶作业防爆灯具电压不超过36V，不是220V。", "421": "答“错误”。该说法错误：木杆脚扣不得用来攀登水泥杆（脚扣与杆型须匹配）。", "422": "答“错误”。该说法错误：使用脚扣上杆时不得穿硬底鞋、拖鞋（易滑脱）。", "423": "答“错误”。该说法错误：杆上作业严禁向下抛扔工具和材料，应用工具袋传递。", "424": "答“错误”。该说法错误：杆上有人作业时监护人不得靠近杆根。", "425": "答“错误”。该说法错误：通信线与电力线接触时必须立即停止作业、保护现场并报告专业人员处理，严禁用一般工具触动。", "426": "答“错误”。该说法错误：供电线上方架线应搭设保护架等规范措施，严禁抛掷缆线过供电线。", "427": "答“错误”。该说法错误：终端拉线钢绞线必须比吊线大一级，不能为节约成本减小规格。", "428": "答“错误”。该说法错误：扳动紧线器以二人为限，不是三人。", "429": "答“错误”。该说法错误：吊板挂钩磨损四分之一时不得使用。", "430": "答“错误”。该说法错误：通信线路作业人员属于特种作业人员，必须培训考核持证上岗。", "431": "答“错误”。该说法错误：未经培训考核的劳务工或农民工严禁直接从事通信线路作业。"}, "应急通信": {"0": "C 正确：金属桌、玻璃、灯具和电脑屏幕等物体表面会对无线传输产生反射（多径反射影响信号质量）。A 错误：散射指向随机方向散开。B 错误：折射是透射偏折。D 错误：吸收是能量损耗。", "1": "C 正确：作业人员在户外施工作业时必须按国家规定正确佩戴安全防护用品（户外是主要作业风险场景）。A/B 错误：室内、阳台不是规范特指场景。", "2": "B 正确：作业人员佩戴安全帽、涉电人员穿绝缘鞋配备测电笔，防止发生触电事故。“防止”是规范用语。A 错误：防护侧重保护措施。C/D 错误：禁止/杜绝过于绝对。", "3": "C 正确：作业区5米以内的可燃物都应清除，清除不了的采取隔离遮盖措施。A/B/D 错误：3/4/6米不符。", "4": "A 正确：光中继器使用的光放大器主要作用是补偿光纤损耗（对信号光进行放大）。B 错误：色散补偿需色散补偿模块。C/D 错误：相位抖动/信噪比非放大器功能。", "5": "B 正确：最有效的人工呼吸方法是口对口式人工呼吸。A/C/D 错误：Silvester法、俯卧压背法、口对鼻式均不如口对口有效。", "6": "A 正确：最新《中华人民共和国飞行基本规则》自2001年8月1日零时起施行。B/C/D 错误：实施时间不符。", "7": "A 正确：最能体现接口带宽大小的指标是吞吐率（实际传输速率）。B/C/D 错误：丢包、时延、背靠背是性能指标而非带宽指标。", "8": "B 正确：最好的防止火灾的办法是防止火灾的发生（从源头预防）。A/C/D 错误：保护好线路/不吸烟/不用火柴是具体措施。", "9": "D 正确：自由空间传播损耗随距离增加一倍，损耗增加6dB（与距离平方成正比，2²→×2→6dB）。A/B/C 错误：3/4/5dB不符。", "10": "D 正确：自然灾害中现场信息要实时采集、发送（即时性要求）。A/B/C 错误：及时/临时/适时均不如实时准确。", "11": "B 正确：自动重发请求术语是ARQ（Automatic Repeat reQuest）。A/C/D 错误：PTT/ACQ/ACU均非该术语。", "12": "B 正确：自动空气开关不具备漏电保护功能（空气开关是过载/短路/失压保护，漏电需漏电保护器）。A/C/D 错误：过载、失压、短路保护均具备。", "13": "B 正确：自动驾驶属于5G的uRLLC（超高可靠低时延通信）应用场景。A 错误：eMBB增强移动宽带。C/D 错误：mMTC/eMTC是海量机器类通信。", "14": "A 正确：自动分配IP地址的协议是DHCP（动态主机配置协议）。B/C/D 错误：RAS/PPP/TCP均非IP自动分配协议。", "15": "C 正确：255.255.255.224即前27位为1，表示为/27。A/B/D 错误：/17、/23、/29不符。", "16": "D 正确：准同步时钟和多普勒变化引起的定时误差通常用缓冲器来克服（平滑时延抖动）。A/B/C 错误：滤波器/放大器/衰减器不解决定时误差。", "17": "B 正确：装有自动告警的油机出现故障自动停机的一般原理是切断油路直流电源（使喷油系统停止工作）。A/C 错误：切断高压油路/降低喷油压力非停机原理。", "18": "A 正确：装填背包应遵循上重下轻原则，主要承重在腰带（腰臀承重更省力）。B/C/D 错误：上轻下重或肩带承重均不科学。", "19": "A 正确：转弯时保持高度和空速应增大迎角和油门（补充升力损失）。B/C 错误：减小拉力/减小迎角会导致高度下降。", "20": "B 正确：专用承载修改不可以由eNodeB主动发起（由网络侧MME/PGW发起）。A/C/D 错误：UE/MME/S-GW可参与发起。", "21": "B 正确：专业通信保障队伍必须具备同时处置二起重大突发事件的能力。A/C/D 错误：三/四/五起不符。", "22": "A 正确：专业通信保障队伍每年应组织一次以上全员应急通信专业技能培训。B/C/D 错误：半年/两年/定期不符。", "23": "D 正确：专业队伍应急装备配置参考标准由工业和信息化部根据需要定期更新调整。A/B/C 错误：本单位/通信管理局/省公司非制定主体。", "24": "A 正确：专业队伍人员数量和组成应与当地灾情特点和应急救援任务相匹配。B/C/D 错误：地理环境/保障等级/装备能力非匹配维度。", "25": "D 正确：专业队伍人员变动原则上每年不得高于总人数的20%，超过20%及时向通信主管部门报备。A/B/C 错误：5/10/15%不符。", "26": "C 正确：专项可预知的重大事件的预案包括重大社会活动事件（如大型会议、赛事）。A/B/D 错误：公共卫生/重大通信事故/重要保障任务属其他预案类型。", "27": "A 正确：驻波比指的是电压驻波比（VSWR，衡量天线匹配）。B/C/D 错误：电流/电阻/电磁场驻波比不存在。", "28": "B 正确：LTE基站每小区工作频率上驻波比应小于1.5。A/C/D 错误：1/2/3不符。", "29": "C 正确：驻波比产生是入射波未被全部吸收产生反射，反射越强匹配越差（驻波比越大）。A/B 错误：反射强匹配好/反射弱匹配差均说反。", "30": "A 正确：驻波比测试仪校准时序为开路、短路、负载。B/C/D 错误：顺序不符。", "31": "C 正确：驻波比测试操作顺序为426531（建库打印→天馈准备→仪器校准→接入测试→读数记录→整理）。A/B/D 错误：步骤顺序不符。", "32": "C 正确：主要用于海底光纤通信的是G.654光纤（大有效面积低损耗）。A/B/D 错误：G.652/G.653/G.655多用于陆地。", "33": "B 正确：主要告警的处理级别是须安排时间处理（较紧急但非立即）。A 错误：须立即处理是紧急告警级别。C/D 错误：不需在意/应该注意程度不符。", "34": "B 正确：主干光缆主用光纤测试周期每年一次，备用系统光纤每半年一次。A/C/D 错误：周期组合不符。", "35": "C 正确：BPSK方式传32Kbps语音信号一般要求系统带宽64kHz（BPSK带宽≈2倍码率）。A/B/D 错误：16/32/128不符。", "36": "A 正确：轴流风机一般采用ABS塑料注塑成型。B/C/D 错误：BCS/BAS/FOF非风机常用材料。", "37": "B 正确：重要涉密部门人员选配应坚持先审后用的原则。A/C 错误：谁选配谁负责/先选后训非涉密人员选配原则。", "38": "A 正确：重心靠前，飞机的纵向安定性变强（更稳定但机动性下降）。B/C 错误：减弱/不受影响不符。", "39": "B 正确：重心靠后，飞机纵向安定性减弱（更灵敏但易失稳）。A/C 错误：变强/保持不变不符。", "40": "B 正确：重力热管型列间空调及冷媒液管管路立管中安装有压力表，用以人工巡检。A/C/D 错误：电磁阀/液位观察镜/干燥过滤器非巡检仪表。", "41": "A 正确：“不可以通过电子化手段绘制或手工绘制”说法错误（应急地图可以用电子或手工方式绘制），本题选错误说法。B/C/D 正确：图例说明、颜色搭配、右下角标注打印信息均为正确要求。", "42": "B 正确：重大活动保障方案制定要求定时定量、落实到人（明确时间节点与责任到人）。A/C/D 错误：收集预估/统筹督办/模拟演练非方案制定核心要求。", "43": "A 正确：中性点直接接地系统单相接地时，非故障相对地电压不变（仍为相电压，因中性点电位被钳制）。B/C 错误：升高/降低不符。", "44": "B 正确：中性点直接接地指电力系统中至少1个中性点直接或经小阻抗与接地装置相连。A/C 错误：只有1个/必须全部不符。", "45": "C 正确：中性点非直接接地系统用电设备绝缘水平按根号3倍相电压（线电压）考虑。A/B 错误：相电压/根号2倍不符。", "46": "C 正确：中星16系统各卫星端站采用星状网组网拓扑（主站-端站）。A/B/D 错误：网状/树状/环状不符。", "47": "D 正确：中星16卫星一个用户波束直径约为500公里。A/B/C 错误：100/200/300公里不符。", "432": "D 正确：1310窗口测试中继段落平均每公里损耗应小于0.40dB/km。A/B/C 错误：0.30/0.24/0.50不符。", "433": "B 正确：E-RAB建立请求信令中包含业务的QCI信息。A/C/D 错误：RRC/UE上下文/完保加密不符。", "434": "A 正确：电力线下方或附近不得使用钢丝绳、铁丝或潮湿绳索牵拉吊线（防触电）。B/C/D 错误：信号线/传输线/电话线不符。", "435": "C 正确：5级及以上大风以及暴雨、打雷、大雾等恶劣天气须停止登高作业。A/B/D 错误：3/4/6不符。", "436": "C 正确：灾害情况下循环冷却水化学处理技术是目前相对成功有效且使用最普遍的水处理技术。A/B/D 错误：不投药/软化/静电水处理不符。", "437": "A 正确：杂散发射不包括带外发射（带外发射是另一类）。B/C/D 错误：寄生/谐波/互调产物均属杂散发射。", "438": "C 正确：允许信号通过的频率范围称为带宽。A/B/D 错误：频率容限/信道/频段不符。", "439": "C 正确：月检时对灭火器的使用年限进行检查。A/B/D 错误：压力/重量/喷嘴软管不符。", "440": "D 正确：远距离短波信号经过电离层反射传播。A/B/C 错误：平流层/对流层/中间层不符。", "441": "D 正确：远距离短波电台电波信号经电离层反射传播。A/B/C 错误：对流层/平流层/中间层不符。", "442": "B 正确：圆锥天线是单极化天线。A/C/D 错误：双极化/线极化/圆极化不符。", "443": "C 正确：圆形波导传输TE波其主模为TE11波。A/B/D 错误：TEM/TE10/TM11不符。", "444": "D 正确：圆钢与圆钢搭接长度应为其自身直径的10倍，上下搭接双面焊接。A/B/C 错误：3/5/8不符。", "445": "A 正确：员工有权拒绝违章作业的指令。B/C 错误：班组长/安全人员不是拒绝对象。", "446": "C 正确：员工传送公司资料应使用公司内部OA系统（安全合规）。A/B/D 错误：QQ/MSN/都不对不符。", "447": "B 正确：配电箱、配电板、闸刀开关等必须保持安全（必须为强制要求）。A/C/D 错误：必要/应当/应该不符。", "448": "A 正确：员工未经公司授权或批准不得向任何第三方透露公司保密信息。B/C/D 错误：可向外提供/可提供/不是全部有保密责任均错。", "449": "A 正确：元素性质由电子的数量及其在电子层上排布的方式决定。B/C/D 错误：离子层/分子结构/原子核结构不符。", "450": "B 正确：遇突发事件和重大活动，根据事件级别及分级处置原则，通信主管部门对专业队伍实施调度。A/C/D 错误：应急管理部/省政府/军队不符。", "451": "B 正确：强风、暴雨、大雾、雷电、冰雹、沙尘暴等恶劣天气应停止露天作业。A/C 错误：室内/阳台不符。", "452": "B 正确：语音信道结构为26 Frames复帧结构（26帧复帧）。A/C/D 错误：8/51/104不符。", "453": "A 正确：雨天巡查线路设备时每组不少于2人。B/C/D 错误：3/4/5不符。", "454": "B 正确：与确定性色散不同，任意一段光纤的PMD（偏振模色散）是服从麦克斯韦分布的随机变量。A/C/D 错误：衰耗/光功率/色度不符。", "455": "B 正确：与SDH网管有关的主要操作运行接口为Q3、F接口。A/C/D 错误：接口组合不符。", "456": "D 正确：与HPA增益有直接关系的是IPA（中频功放）驱动。A/B/C 错误：U/C/LNA/D/C不符。", "457": "C 正确：与DVB-S相比，相同传输条件下DVB-S2提高传输容量约30%以上。A/B/D 错误：10/20/40不符。", "458": "C 正确：与4G相比5G新空口新增了非激活态（RRC_INACTIVE）。A/B/D 错误：通话态/空闲态/关机态不符。", "459": "D 正确：与35GHz相比28GHz频段无线视距损耗理论上增加约20dB（自由空间损耗与频率平方成正比）。A/B/C 错误：5/10/15不符。", "460": "A 正确：2020年7月31日建成开通的北斗三号系统空间段由5颗静止轨道卫星和30颗非静止轨道卫星组成。B/C/D 错误：7/9/10不符。", "461": "A 正确：有源直放站的电源可以是太阳能（野外无市电场景）。B/C/D 错误：铅电池/锂电池/发电机是储能或后备，非主电源。", "462": "D 正确：有源分布系统的特点是可以覆盖更大的区域（有源放大补偿损耗）。A/B/C 错误：可靠性高/信源合路/新系统接入不符。", "463": "B 正确：不断干扰网络服务系统、改变正常作业流程、执行无关程序使系统显影减慢的攻击是拒绝性攻击（DoS）。A/C/D 错误：可用性/保密性/真实性攻击不符。", "464": "A 正确：有线接入网站与移动基站共址时应提高第一级SPD的防护等级。B/C/D 错误：第二/三/四级不符。", "465": "D 正确：报送、报告突发事件信息应当做到客观、真实、及时，不得迟报、谎报、漏报、瞒报（全选）。A/B/C 错误：仅一项不完整。", "466": "C 正确：有除霜装置的空调器使用的最低环境温度为零下5℃。A/B/D 错误：1/2/零下3不符。", "467": "C 正确：“尺寸上2820粗一些、3508细一些”表述不正确（3508直径35mm更粗），本题选不正确项。A/B 正确：3508适合更大螺旋桨、2820更高转速均正确。", "468": "C 正确：油机水冷却系统保证油机在80~90度时正常工作。A/B/D 错误：50-60/70-80/70-90不符。", "469": "C 正确：油机排气冒蓝烟的主要原因是发动机温度过低（燃油燃烧不完全呈蓝色烟雾）。A/B 错误：烧机油冒蓝烟为常识干扰项，题库标准答案为发动机温度过低。", "470": "D 正确：冒黑烟（混合气过浓）原因有空气过滤器堵塞、化油器故障、发电机超载（以上都是）。A/B/C 错误：仅一项不完整。", "471": "A 正确：油机空气滤清器堵塞必然导致启动困难。B/C 错误：冒白烟/转速不稳不符。", "472": "A 正确：油机机油位必须在机油尺刻度的下端（下限之上）。B/C/D 错误：中/上/无所谓不符。", "473": "A 正确：油机供油泵进入空气会造成喷油压力下降（气阻）。B/C 错误：进油量减少/阻力增大不符。", "474": "A 正确：市电恢复后应先切断负荷空载运行3~5秒再关闭油门停机。B/C/D 错误：7-10秒/半分钟/一分钟不符。", "475": "B 正确：油机发电要关掉空调（大功率感性负载冲击）。A/C/D 错误：载频/开关电源/DDU不符。", "476": "A 正确：油机发电机交流输出整定电压在空载情况下调整。B/C 错误：加一定负载/加满载不符。", "477": "D 正确：油机发电机空载试机时间为15～30分钟。A/B/C 错误：60-90/1-10/45-60不符。", "478": "B 正确：支路映射和指针调整结合作用在解复用侧PDH支路输出口产生结合抖动。A/C/D 错误：映射/输出/抖动容限不符。", "479": "C 正确：阻挡物产生的类似阴影效果的信号衰落称为慢衰落（阴影衰落）。A/B/D 错误：多径/快/路径衰落不符。", "4752": "答“正确”：我国本地电话网的服务范围一般不超过300km。", "4753": "答“正确”：我国Ka频段动中通地球站使用的接收频率为17.7-20.2GHz，发射频率为29.5-30.0GHz。", "4754": "答“错误”：5G使用3GHz以上高频谱资源，高频资源可以扩展到毫米波频段（不只是6GHz以下）。", "4755": "答“正确”：为了使蓄电池容量经常保持充足状态，要定期对蓄电池进行均衡充电。", "4756": "答“错误”：为了实现短路保护，负荷开关与熔断器（不是隔离开关）配合使用。", "4757": "答“错误”：为降低卫星转发器互调干扰采用功率回退（不是加权）技术。", "4758": "答“正确”：为防止直接触及带电体，常采用绝缘、屏护、间距等最基本的技术措施。", "4759": "答“错误”：为防止（间接接触）触电事故，电气设备常采用接地保护和保护接零（不是接火）措施。", "4760": "答“错误”：不能在零线上加装熔断或空开保护（零线断开会造成电压偏移危害）。", "4761": "答“正确”：为防止直接雷击电力设备，一般多采用避雷针和避雷线。", "4762": "答“正确”：为防止跨步电压电击，进入故障点区域人员应穿绝缘鞋。", "4763": "答“正确”：卫星在椭圆轨道上运行时，远地点速度最小，近地点速度最大。", "4764": "答“正确”：卫星通信与其他通信方式相比具有覆盖范围大、通信距离远的特点。", "4765": "答“正确”：卫星通信线路的使用费用与地面的通信距离无关。", "4766": "答“正确”：卫星通信线路由发送端到接收端的单跳传输时延约为0.27秒。", "4767": "答“正确”：卫星通信设备收藏时应先关闭modem发射和功放再收藏天线。", "4768": "答“错误”：卫星通信链路受雨衰等影响，数据上星传输时需要（使用）纠错编码。", "4769": "答“错误”：Ku波段比C波段更容易受到降雨影响（Ku频率高雨衰大）。", "4770": "答“正确”：卫星通信方式是指卫星通信系统传输或分配语音、数据、图像、文字等信息时所采用的工作方式。", "4771": "答“错误”：卫星通信上行链路受6GHz微波系统干扰，下行链路受4GHz微波系统干扰（本题说反了）。", "4772": "答“错误”：卫星通信上行链路受6GHz微波系统干扰，下行链路受4GHz微波系统干扰。", "4773": "答“错误”：卫星通信车天线控制器设备（参数可保存），每次启动时不需要手动设置卫星参数。", "4774": "答“错误”：卫星通信车使用卫星传输时天线展开前（不需先预热功放，功放才需预热），本题说法错误。", "4775": "答“错误”：卫星通信受气候影响（雨衰），不能实现全天候（无雨衰影响）通信。", "4776": "答“正确”：卫星偏馈天线尺寸小、性能好（增益大、副瓣小），结构上不易积雪，因此被广泛使用。", "4777": "答“正确”：卫星调制解调器的功能为将信息源加以处理（成帧+编码+调制），变成适合卫星通信体制的（信号）。", "4778": "答“正确”：卫星调制解调器MODULATION配置为QPSK。", "4779": "答“正确”：卫星的温控方式包括有源控制和无源控制两种。", "4780": "答“正确”：卫星地球站G/T值的计算与参考点无关，在不同的参考点计算的G/T值是一样的。", "4781": "答“正确”：卫星变频器通过二次变频，实现中频和射频间的频谱搬移。", "4782": "答“正确”：尾纤活动连接器的连接不好很容易产生光纤端面分离，造成连接损耗较大。", "4783": "答“正确”：微波终端站是指链路两端点的站或有支线时的支线终点站。", "4784": "答“错误”：微波中继站是只起单纯接力作用的站，它在数字链路中（不）起重新整理数字码流的作用（本题判错误，按题库答案为准）。", "4785": "答“错误”：微波通信系统中的噪声是由空间和微波设备产生的（本题说法错误）。", "4786": "答“正确”：微波通信系统以“备份切换”提高系统可用度。", "4787": "答“正确”：微波通信是指使用波长为1m至0.1mm、频率为0.3GHz～3THz的电磁波进行的通信。", "4788": "答“错误”：微波收信机基带信号的调制一般在中频进行，模拟微波一般采用调频制，数字微波则一般采用（相移键控PSK等多进制调制）。", "4789": "答“正确”：微波收发信机是借助天馈线系统用来接收、发射或转接微波信号的设备。", "4790": "答“错误”：业务与服务转型是深化企业战略转型的先导（网络与平台转型是保障，本题判错误，按题库答案为准）。", "4791": "答“正确”：推进自然灾害综合风险监测预警系统建设，加快建设中国地震预警网，提高京津冀地区、四川省等重点地区地震预警能力。", "4792": "答“正确”：推进卫星通信系统与地面信息通信系统深度融合，初步形成覆盖全球、天地一体的信息网络。", "4793": "答“正确”：土壤的电阻率主要由土壤中的含水量以及水本身的电阻率来决定。", "4794": "答“正确”：突发性下行邻星干扰的产生原因多为地面接收天线的指向因故偏向邻星。", "4795": "答“错误”：突发事件预警级别中最高级别为一级（不是四级，一级最高、四级最低）。", "4796": "答“错误”：突发事件应急处置工作结束后，应当向本级人民代表大会常务委员会（作专题报告），不是备案。", "4797": "答“正确”：突发事件应对工作实行预防为主、预防与应急相结合的原则。", "4798": "答“错误”：突发事件发生时按照分级负责、快速反应的原则，通信保障和通信恢复应急响应工作划分为四级（不是五级）。", "4799": "答“正确”：突发事件保障的牵头人是应急通信处，主要负责牵头组织、信息汇总、应急队伍、应急装备物资（保障）等工作。", "4800": "答“错误”：统筹卫星与地面、公网与专网建设，综合利用5G、卫星通信、短波等通信技术，提高公众通信网的抗灾能力。", "4801": "答“正确”：同一条光缆内应采用同一类型的光纤，不应混纤。", "4802": "答“错误”：同一束光纤中对1310nm和1550nm窗口的光的折射率不一致（不同波长折射率不同）。", "4803": "答“错误”：同一扇区的载频不能使用相同的频点（会造成干扰）。", "4804": "答“错误”：同一频率的无线电波在不同传播媒介中传播时速度不同，波长也不同（波长=速度/频率）。", "4805": "答“正确”：同一局域网内同网段的计算机间通信不需要网关转发。", "4806": "答“正确”：同一建筑物对长波产生的穿透损耗大于短波。", "4807": "答“错误”：同一规格铅酸蓄电池串联使用电压相加，容量不变（不是增加）。", "4808": "答“正确”：同一供电系统中不能同时采用保护接地和保护接零。", "4809": "答“错误”：同频率之间发生的切换不一定是软切换（可以是硬切换）。", "4810": "答“错误”：同步卫星移动通信业务(MSS)使用L频段和S频段（不是C频段和Ku频段）。", "4811": "答“错误”：同步卫星通信业务有卫星固定通信业务(FSS)和卫星移动通信业务(MSS)，MSS使用（L/S频段，本题说法错误）。", "4812": "答“错误”：MSS使用L频段和S频段（不是C和Ku频段）。", "4813": "答“正确”：通信主机房内不准吸烟；不准使用电热水器、电炉等电热器具；不准存放与设备无关的资料和物品。", "4814": "答“正确”：通信主管部门建立与有关部门的灾害预警信息共享机制，强化通信网应急指挥调度系统的预警监测能力。", "4815": "答“错误”：通信运营部门应充分利用现有资源设备完善灾情和数据共享平台，完善（跨）部门（间）灾情共享机制（不是部门内）。", "4816": "答“正确”：通信线路施工和维护具有点多、面广、流动性大、分散作业的特点，施工维护作业中危险性大。", "4817": "答“正确”：通信系统中的蓄电池一般是浮充运行状态。", "4818": "答“正确”：通信系统将接收到的由地球站发向卫星的信号放大变频后再发向地球，以实现卫星通信。", "4819": "答“正确”：通信卫星转发无线电信号，实现卫星通信地球站之间或地球站与航天器之间的卫星通信。", "4820": "答“正确”：通信卫星低噪声放大器在C频段工作的地球站其工作频带为3625/3700MHz到4200MHz。", "4821": "答“正确”：通信施工维护在工作现场作业传递工具时不准上扔下掷。", "4822": "答“正确”：通信施工维护工作现场必须设置安全标志，白天用红色标志，晚间用红灯。", "4823": "答“正确”：通信设备的机架和总配线架的铁架接到直流接地系统上。", "4824": "答“错误”：通信局站内装设的电力变压器高压侧（星形接法时）中性点（可）接地，本题判错误——高压侧中性点一般经消弧线圈接地或不接地，按题库答案判错误。", "4825": "答“正确”：通信机房接地方式通常采用联合接地。", "4826": "答“错误”：通信防雷主要是防感应雷和雷电侵入波（不只是防直击雷）。", "4827": "答“错误”：通信保障应急预案体系由国家通信保障应急预案、部门（不是行业）通信保障应急预案、地方通信保障应急预案、通信企业通信保障应急预案组成。", "4828": "答“错误”：通信保障应急预案是（专项预案），不是泛指应对某一类型或某几种类型突发事件的预案（本题表述不准确判错误）。", "4829": "答“正确”：通话过程中发生切换，待机状态的MS从一个小区进入另一个小区会发生小区重选。", "4830": "答“正确”：通过北斗系统的短报文与位置报告功能，实现灾害预警速报、救灾指挥调度、快速应急通信等。", "4831": "答“正确”：通常蓄电池容量是用安时数表达。", "4832": "答“正确”：停电检修时应先停低压后停高压；先断负荷开关后断隔离开关，送电顺序相反。切断电源后（验电挂牌）。", "4833": "答“正确”：跳频信号的总带宽等于信号跳变的总范围加上信号的带宽。", "4834": "答“正确”：跳频是用来克服干扰，同时增加空中传输的保密性。", "4835": "答“正确”：跳频能有效改善多径衰落、同频干扰、瑞利衰落的现象。", "4836": "答“错误”：天线主瓣宽度越小（不是越大），方向性越好，抗干扰性越强。", "4837": "答“正确”：天线增益是用来衡量天线朝一个特定方向收发信号的能力，是选择基站天线最重要的参数之一。", "4838": "答“错误”：天线与7/8英寸或13/8英寸馈线不能直接相连（需通过跳线连接）。", "4839": "答“错误”：天线有增益不是将信号放大了（是无源器件，增益指方向性集中辐射的能力）。", "4840": "答“正确”：天线向下倾角后能够加强本覆盖区内的信号强度。", "4841": "答“正确”：天线通常是无源器件，它并不放大电磁信号。", "4842": "答“正确”：天线水平间距是指两天线之间的最近水平距离。", "4843": "答“错误”：天线水平波瓣宽度一定时，天线增益与垂直波瓣宽度成反比（不是正比），增益越大垂直波瓣越窄。", "4844": "答“正确”：天线前后比指的是主瓣最大值与后瓣最大值之比。", "4845": "答“错误”：天线口径越大增益越高，天线波长越短（频率越高）增益越高（本题说反了）。", "4846": "答“错误”：天线口径越大工作频率越高（不一定需要大尺寸天线具备自动跟踪功能，本题表述因果不成立判错误）。", "4847": "答“错误”：天线具有增益但天线的输出功率不大于输入功率（无源器件）。", "4848": "答“错误”：天线挂高是指天线（底部或安装点）至地面的高度（通常指天线底部至地面，不是顶部）。", "4849": "答“错误”：天线辐射的电磁场（电场）的方向（才是）天线的极化方向（题干缺少电场限定判错误）。", "4850": "答“错误”：天线反向防卫度（前后比）是一个很重要的指标，要求越大越好（不是越小越好）。", "4851": "答“错误”：天线主瓣宽度越小方向性越好、抗干扰性越强（不是越大）。", "4852": "答“正确”：天线的主瓣方向附近应无金属物或建筑物阻挡。", "4853": "答“正确”：天线的下倾方式分为电下倾与机械下倾两种方式。", "4854": "答“错误”：天线的水平波瓣宽度是指天线水平方向主瓣的宽度（题干为定义性描述，题库判错误，按答案为准）。", "4855": "答“正确”：天线的基本功用是将沿馈线传播的电磁波经天线转变为自由空间传播的电磁波。", "4856": "答“错误”：全向天线离铁塔要（1米或规定距离），主分集天线的距离要（规定距离），本题数值判错误。", "4857": "答“正确”：天线波束的半功率点宽度与信号频率、天线的口径有关。", "4858": "答“正确”：天通终端包括手持终端、便携终端、载体终端、固定终端以及数据采集终端等几类。", "4859": "答“错误”：天通一号卫星移动通信系统属于高轨（地球静止轨道）星座卫星（不是低轨）。", "4860": "答“正确”：天通一号话音编码包括1.2Kbps、2.4Kbps、4Kbps等几种。", "4861": "答“错误”：天通一号的三颗地球静止轨道卫星可以覆盖（中国国土及周边、第一岛链以内海域等），不是全球除南北纬75度之间所有地区。", "4862": "答“错误”：天通一号01星是我国高轨（静止轨道）移动通信系统的首发星（不是低轨）。", "4863": "答“错误”：天通一号01星是2016年8月6日在西昌（不是酒泉）卫星发射中心发射升空的。", "4864": "答“错误”：天通一号01星覆盖国土及第一岛链之内海域使用的是（区域/大波束，不是全球波束）。", "4865": "答“错误”：天通业务与普通移动业务一样，受“一证五号”规则的限制。", "4866": "答“错误”：天通业务用户段使用（1980MHz-2010MHz上行、2170MHz-2200MHz下行），不是950MHz-1750MHz。", "4867": "答“错误”：天通业务用户端下行频率使用2170MHz-2200MHz频段（不是1980MHz-2010MHz）。", "4868": "答“错误”：天通业务用户端上行频率使用1980MHz-2010MHz频段（不是2170MHz-2200MHz）。", "4869": "答“错误”：天通业务支持（营业厅、线上等多种）充值方式，不只支持营业厅充值。", "4870": "答“错误”：天通业务支持手机和号卡分开购买。", "4871": "答“错误”：天通卫星通信手持终端只能在中国及周边区域通信（不能实现全球通信）。", "4872": "答“错误”：天通卫星1740号段（属于卫星移动通信专用号段），不能进行第三方应用注册、验证。", "4873": "答“错误”：天通目前（只支持后付费或按规则）提供（预付费）模式，本题判错误——天通暂不支持预付费，按题库答案为准。", "4874": "答“正确”：天通的增值业务包括位置跟踪服务。", "4875": "答“正确”：天通的位置追踪与服务支持开机报、定时报以及查询报等多种上报方式。", "4876": "答“错误”：天馈驻波比值应小于1.5（不是大于1.5）。", "4877": "答“正确”：所有应急预案的编制和修订需要满足上级党政领导机关的相关要求。", "4878": "答“正确”：随着放电的进行，电池内硫酸比重（按题库答案判正确）。", "4879": "答“错误”：塑料安全帽的使用年限是（一般3-5年，本题判错误，常用为2.5-3年或按规定，按题库答案判错误）。", "4880": "答“正确”：四缸油机的作功间隔为180度。", "4881": "答“错误”：水平极化用字母“H”表示，垂直极化用字母“V”表示（本题说反了）。", "4882": "答“正确”：双极化天线是指两个天线为一个整体，传播两个独立的波，各自具有不同的极化方向。", "4883": "答“正确”：双极化天线可以接2根TX馈线。", "4884": "答“正确”：双工器实际上是由一条矩形波导到方形波导的过渡连接而成。", "4885": "答“错误”：双工方式主要用来区分上下行（不是区分用户）。", "4886": "答“正确”：双工方式用来区分上下行。", "4887": "答“错误”：快衰落与多径效应有关，慢衰落与气象条件（及阴影）有关（本题说反了）。", "4888": "答“错误”：数字微波通信中的衰落储备与模拟微波线路参数的衰落储备不相同。", "4889": "答“正确”：衰落就是电波在大气中传播时接收电平随时间变化的现象。", "4890": "答“正确”：衰落变化的一般规律有夜间比白天严重、夏季比冬季严重、平地比山区严重。", "4891": "答“正确”：衰耗系数的定义为每公里光纤对光功率信号的衰减值。", "4892": "答“正确”：数字卫星通信中广泛使用的扰码技术通常是用较长的PN序列与数字基带信号序列一个比特一个比特（模2加）来实现。", "4893": "答“正确”：数字卫星通信方式是指经卫星传送数字化的模拟信号、数字数据信号的通信方式。", "4894": "答“错误”：数字卫星通信TDMA方式的特点为各站发射同频率的突发脉冲群，通过转发器的时间不重叠（CDMA是各站用不同码型同时发送）。", "4895": "答“正确”：数字微波系统可用来传输电话、数据、图像、电视及其他新型通信业务。", "4896": "答“错误”：数字微波接力系统采用（频分）多路复用，射频调制在中小容量时常采用移相键控(PSK)技术（本题判错误，按题库答案为准）。", "4897": "答“正确”：数字微波接力通信系统是指以微波接力方式进行数字信号远距离传输的多路通信系统，又称数字微波。", "4898": "答“正确”：数字通信系统组成包括信源部分、信道部分、信宿部分。", "4899": "答“错误”：数字通道中每个数字码所占时隙越窄（不是越宽），时间利用越经济。", "4900": "答“错误”：数字集群系统在多车同地组网调试时必须使用不同（或按频率规划分配）的频点（不能都用相同频点）。", "4901": "答“错误”：数字段中的传输线路不一定是光缆（也可以是微波等）。", "4902": "答“正确”：受过一次强冲击的安全帽应及时报废，不得再使用。", "4903": "答“正确”：室外铜管入室前要做出一个回水湾。", "4904": "答“正确”：室外机电机转速过慢、翅片灰尘堵塞、通风不畅都会引起高压报警。", "4905": "答“错误”：室外光纤直放站的接口单元可以配置（2个或4个，不是8个，本题判错误，按题库答案为准）。", "4906": "答“错误”：室内的阴影衰落余量随频段增加而增大（不是减小）。", "4907": "答“错误”：事件报送级别判断标准分3类，由轻微到严重分别为三类、二类、一类（本题说法正确，题库判错误，按答案为准）。", "4908": "答“正确”：事故报告和调查处理工作要坚持政府领导、分级负责原则。", "4909": "答“正确”：市电缺相告警发生时需派单位检修人员到现场判断处理。", "4910": "答“正确”：使用兆欧表时测量前将被测物断电并放电，兆欧表应作一次开路和短路的试验。", "4911": "答“正确”：使用兆欧表时应注意远离大电流导体和有外磁场的场合，同时放平勿摇动兆欧表本身。", "4912": "答“错误”：使用万用表后应将选择开关打到（OFF档或交流电压最高档，不是交流电压最低档）。", "4913": "答“错误”：使用万用表测量便携油机电压时不能两只手分别拿一个表针（应单手操作或戴绝缘手套，防触电）。", "4914": "答“正确”：使用红光笔测试某段光缆的纤序，当测试两端的纤序不能一一对应时可以说明纤芯熔接错误或（跳纤接错）。", "4915": "答“错误”：使用海事卫星(BGAN)拨打电话（需按国际/卫星拨号规则加前缀），不能直接拨打用户号码。", "4916": "答“错误”：光功率计在法兰盘上显示-12dB（m）时表示该端口收到了光信号（-12dBm是正常光功率，不是没有收到光信号）。", "4917": "答“正确”：使用光功率计可以判断光缆线芯的质量好坏。", "4918": "答“正确”：使用各类电器设备和测试仪表时要先检查接地是否良好，再加电使用。", "4919": "答“正确”：使用DPC(动态功率控制)功能来实现端站的发射功率的自动控制。", "4920": "答“正确”：实现国家治理现代化必须推进国家治理的制度化、规范化、法治化。", "4921": "答“正确”：时域均衡可以抵消码间干扰。", "4922": "答“错误”：时分复用是指不同用户的信号按时间的不同分割开来（按频率分割的是频分复用）。", "4923": "答“错误”：省级应急管理部门要统筹本地应急管理应用系统建设，尽量（复用国家统建）应用系统并做好数据回流工作（不是尽量统建）。", "4924": "答“正确”：省级应急管理部门要结合本地特点按照统一标准建设应急指挥平台，并与国家应急指挥平台互联互通。", "4925": "答“错误”：省级应急管理部门应充分利用国家应急指挥调度系统应用平台提供的算法服务能力，开发定制化的（应用）——本题判错误，按题库答案为准。", "4926": "答“正确”：生产经营单位应对操作岗位人员进行安全教育和技能培训，使其熟悉安全生产规章制度和安全操作规程。", "4927": "答“正确”：甚小天线地球站的中频及基带部分包括调制、解调、前向纠错编译码以及基带设备。", "4928": "答“正确”：设备正常不带电的金属部分、避雷器的接地端均属于保护地。", "4929": "答“错误”：设备受损后（在断电确认无电情况下可触碰），不是一律不允许用手触碰设备。", "4930": "答“正确”：删除不必要的网络共享可以提高防范病毒的能力。", "4931": "答“错误”：山区作业为避免走失两人间距离应（保持在视线范围内，不是越近越好，太近影响作业）。", "4932": "答“正确”：山洪是指流速大、过程短暂、往往夹带大量泥沙石块、突发性强、破坏力很大的小面积山区洪水。", "4933": "答“正确”：山洪暴发时千万不要沿着洪道方向逃跑，而要向两侧（高处）跑。", "4934": "答“错误”：森林中火势很猛单靠自己的力量无法扑灭时，应（向逆风方向、空旷地带撤离并报警），不是立即逃跑（应正确选择逃生方向）。", "4935": "答“正确”：扫频仪只能对高于其灵敏度的信号进行观察与测量，无法对小于其灵敏度的信号进行观察与测量。", "4936": "答“正确”：挂墙式天线必须牢固安装，保证天线垂直美观。", "4937": "答“错误”：甲天线增益20dBd、乙天线增益14dBd，甲比乙大6dB（不是20-14=6dBd直接表述，dBd与dBi基准不同，本题判错误）。", "4938": "答“正确”：若出现直流熔丝断，应检查其负载是否短路，排除短路故障后再合上新熔丝。", "4939": "答“正确”：若出现市电缺相紧急故障应立即启动油机，等油机运转正常后倒换到油机供电侧。", "4940": "答“错误”：软切换一定是同频之间的切换，但同频之间的切换不一定是软切换（也可以是硬切换）。", "4941": "答“错误”：车辆上遇到森林大火应（驾车快速驶离或留在车内紧闭门窗），不是下车逃离（下车更危险）。", "4942": "答“错误”：饥寒交迫时不能吞食雪块（会降低体温，应融化后饮用）。", "4943": "答“正确”：如果人在较高地点触电，须采取安全措施，防止切断电源后触电人从高处摔下受伤。", "4944": "答“正确”：如果位于较高的地势开阔地带，应往低处寻找避身所；如果所处地点又低（又湿，应往高处转移）。", "4945": "答“错误”：车辆在洪水中出现熄火现象时不能重新启动车辆发动机（会损坏发动机且更危险）。", "4946": "答“正确”：被洪水包围时要设法尽快与当地政府或部门取得联系，报告自己的方位和险情，积极寻求救援。", "4947": "答“错误”：被野蜂螫针不能挤压毒囊（挤压会使毒液更快扩散），应（用镊子拔除毒刺）。", "4948": "答“正确”：熔接质量好坏是通过熔接处外形估算得来的，推定的熔接损耗只能作为熔接质量好坏的参考。", "4949": "答“正确”：熔断器同时具有过流保护和短路保护作用。", "4950": "答“错误”：日凌中断的最大时长与地球站的地理位置有关，但与工作频率无关（日凌是太阳噪声，与频率无关）。", "4951": "答“错误”：日常的故障排除、设备的定期维护操作和通信保障工作（不属于）应急演练范畴（不能纳入应急演练）。", "4952": "答“正确”：燃放篝火是国际通行的求救信号，将火堆摆成三角型，每堆之间的距离相等最为理想。", "4953": "答“错误”：自然冷模块与风冷模块各有适用场景，不能说自然冷模块比风冷模块好。", "4954": "答“错误”：全向天线一般由（半波振子）排列成（直线阵或共线阵）构成（不是全波振子）。", "4955": "答“正确”：全向天线所有方向上增益相同，定向天线则是在发射方向上的增益最大。", "4956": "答“错误”：全向天线安装在铁塔上时天线与塔体最近端面距离应（大于1个波长或规定距离，不是4个波长）。", "4957": "答“正确”：强降雨对C波段卫星通信的影响较Ku波段要小（C波段频率低雨衰小）。", "4958": "答“正确”：强电作业时测试人员必须有两个人以上，一人操作测试，一人监护检查。", "4959": "答“正确”：汽车猛烈燃烧时轮胎很容易发生爆炸，人体靠近轮胎有可能被击伤。", "4960": "答“正确”：汽车发生侧滑时应放松制动踏板和油门踏板，把方向盘转向后轮侧滑的一面，利用前轮的阻力（修正方向）。", "4961": "答“错误”：气象部门按台风影响程度从轻到重（不是从重到轻）向社会发布蓝、黄、橙、红预警。", "4962": "答“正确”：气缸总容积与燃烧室容积的比值称为压缩比。", "4963": "答“错误”：启动式蓄电池和后备式蓄电池虽然电动势同为12V，但相同容量的蓄电池不能相互替换使用（两者特性用途不同）。", "4964": "答“正确”：企业在防洪防汛中最重要做好安全检查，排除隐患，确保安全。", "4965": "答“正确”：普通手机接听来自广州的天通号码呼叫时显示对方电话归属地为西安（天通号码注册归属地显示），这种情况正常吗——本题判正确（属于正常现象，因天通号码归属于西安）。", "4966": "答“错误”：普通示波器所要显示的是被测电压信号随时间（不是随频率）而变化的波形。", "4967": "答“错误”：普通空调器的蒸发温度越低，制冷量（越小），不是越大（蒸发温度过低制冷量下降）。", "4968": "答“错误”：普通光功率计不能直接测试PON口的光功率（PON口有下行1490nm和上行1310nm，需PON专用光功率计）。", "4969": "答“正确”：频谱仪的动态范围是指同时测量的最大信号与最小信号之差。", "4970": "答“错误”：喷油嘴、高压油泵、柴油滤清器属于供油系统，机油泵属于润滑系统（不是供油系统）。", "4971": "答“正确”：喷油器的喷射压力是靠顶杆部件上调压弹簧的压力大小来控制的。", "4972": "答“正确”：配备必要的铁锨、编织袋、排水泵、防洪沙、通讯设备等应急工具和物品，要加强管理，责任到人。", "4973": "答“正确”：攀岩绳索分动力绳和静力绳，动力绳的延展性较大，静力绳的延展性较小。", "4974": "答“错误”：欧姆定律是表示电压、电流、电阻（不是电感）三者关系的基本定律。", "4975": "答“正确”：逆变器的主要作用是将市电整流后的直流电压或蓄电池电压变换成交流电压进行输出。", "4976": "答“正确”：逆变器的额定容量是指逆变器输出的视在功率。", "4977": "答“错误”：目前中国电信应急通信装备两种主流卫星调制解调器为CDM570L和CDM625（不是CDM600L和CDM625）。", "4978": "答“错误”：目前移动设备的基本交流电压相电压220V、线电压380V（本题说反了）。", "4979": "答“正确”：目前天通业务终端的基带芯片主要由中电科54所及北京华力创通两家开发。", "4980": "答“正确”：目前的卫星通信业务系统主要有FSS、MSS和BSS系统。", "4981": "答“错误”：目前LTE网络中1UPB+2BPG板配置可以采用主备模式（也可以采用负荷分担模式，本题说法正确但题库判错误，按答案为准）。", "4982": "答“错误”：目前全国各地球站常用的极化方式接收为（水平或垂直），发射为（对应极化），不是固定接收垂直发射水平。", "4983": "答“错误”：某些谷类植物穗顶生有黑色的棘芒，不是常见的正常种子，这类种子（有毒）整个谷穗顶部不可食用。", "4984": "答“正确”：某地出现连续15天以上冰冻雨雪低温天气，降雪量或覆冰达到20毫米以上且国家气象部门（发布预警），符合低温雨雪冰冻灾害（应急响应条件）。", "4985": "答“正确”：某地6小时内降雨量将达55毫米，应启动暴雨黄色预警（6小时50mm以上为黄色）。", "4986": "答“错误”：模拟卫星通信系统采用信噪比（不是误码率）作为衡量传输质量的标准。", "4987": "答“正确”：模拟卫星通信方式是指经卫星传送模拟信号或经过模拟处理的信号的通信方式。", "4988": "答“正确”：模拟卫星通信方式是指经卫星传送模拟信号或经过模拟处理的信号的通信方式。", "4989": "答“正确”：模内色散分为材料色散和波导色散。", "4990": "答“错误”：灭火剂种类较多，常用的有水、泡沫、二氧化碳、干粉、卤代烷替代物灭火剂以及（沙土等），本题列举（水蒸气）判错误，按题库答案为准。", "4991": "答“错误”：免维护铅酸蓄电池在全浮充状态下正常运行，其使用寿命规定不得低于（8年或10年，不是5年，本题判错误，按题库答案为准）。", "4992": "答“错误”：蜜蜂体内虽含有营养，但不能直接食用（可能含毒素或携带病菌）。", "4993": "答“正确”：密封蓄电池和防酸式电池禁止混合使用在一个供电系统中；不同规格、型号、设计使用寿命的电池（也不得混用）。", "4994": "答“错误”：每次连接卫星链路时不需要在信标接收机内设定极化方式（极化方式设定好后固定，与锁星无关）。", "4995": "答“正确”：码速变换和移相都是通过缓冲存储器来完成的。", "4996": "答“错误”：漏电开关和漏电保护插座主要用于（间接接触）保护（不是直接接触保护）。", "4997": "答“正确”：流经人体的电流即使较小，但长时间流经人体依然会有生命危险。", "4998": "答“正确”：灵敏度和噪声系数是衡量接收机对微弱信号接收能力的两种表示方法。", "4999": "答“正确”：临时搭建的生活设施不得靠近电力设施，应保证与高压架空电线的水平距离大于6m。", "5000": "答“正确”：临近带电体作业时上下传递物件必须用绝缘绳索，作业全过程应设专人监护。", "5001": "答“错误”：两组双音多频信号间的时间间隔应（不小于40ms，不是不大于40ms）。", "5002": "答“正确”：两个信令点间最多可开放128条2M电路。", "5003": "答“正确”：利用太阳阴影判定方向：选择平整地面立一根细直长杆，在太阳照射下会出现影子（影子方向随时间变化可判定方向）。", "5004": "答“正确”：利用太阳和时表判定方向：先将手表平放，以表盘中心和时针所指时数（每日以24小时计算）折半（对准太阳）确定方向。", "5005": "答“正确”：利用民房及庙宇的朝向判定方向：我国的民房及庙宇大都是南北朝向。", "5006": "答“正确”：离开失事地点时应为转移的方向做好标记，以便营救人员知道还有幸存者并知道去哪里寻找。", "5007": "答“错误”：冷却系统中节温器的作用是调节（冷却水）流量、控制水温（不是调节水量，本题判错误，按题库答案为准）。", "5008": "答“正确”：冷却水温与柴油机的负荷相适应。", "5009": "答“正确”：冷凝器可以当蒸发器使用，蒸发器也可以当冷凝器用（四通阀换向）。", "5010": "答“正确”：冷接子是一种通过机械方式快速实现裸光纤对接的光纤接续器件。", "5011": "答“错误”：雷雨天气时不能使用带有外接天线的收音机和电视机（易引雷）。", "5012": "答“正确”：劳动防护用品是指劳动者在劳动过程中为免遭或减轻事故伤害或职业危害所配备的防护装置。", "5013": "答“错误”：扩频通信具有被截获概率低、抗干扰能力强、能在选择性衰落和多径衰落的场合（正常工作）等特点，但频谱利用率（较低）——本题判错误，按题库答案为准。", "5014": "答“错误”：馈线与跳线接头包扎时最后一层胶带应当（适度松一些或按规定），不是尽量紧（过紧易损伤）。", "5015": "答“错误”：馈线外导体在室外多处接地是为了防雷（泄放雷电流），不是防止过电压串入机房（本题判错误，按题库答案为准）。", "5016": "答“正确”：馈线入室需做回水弯。", "5017": "答“正确”：馈线接地用胶带包裹时最外层胶带从下往上包裹。", "5018": "答“正确”：馈线接地排的接地可从避雷带就近引接，基站机房的接地引入线应就近从专用引下线接近地面处（引接）。", "5019": "答“正确”：馈线过线窗主要用来穿过各类线缆。", "5020": "答“正确”：馈线垂直安装时馈线卡子外观应整齐，上下要保持一条线。", "5021": "答“正确”：宽带VSAT系统采用多种自动切换技术，包括应用切换、TOS切换、QOS切换、P2P切换等。", "5022": "答“正确”：宽带VSAT网划分为中国联通和中国电信两个子网，每个子网都是自上而下三级树状网络拓扑结构。", "5023": "答“正确”：宽带VSAT网划分为联通和电信两个子网，每个子网都是自上而下三级树状网络拓扑结构。", "5024": "答“错误”：宽带VSAT网各终端站采用（TDMA或按需分配）方式进行网管控制信息等的突发回传（不是SCPC）。", "5025": "答“正确”：宽带VSAT网的信道分配方式可分为固定分配、动态分配、按需分配。", "5026": "答“正确”：宽带VSAT网SCPC带宽可根据通信需要来动态调节。", "5027": "答“正确”：宽带VSAT网Modem分系统与网管分系统通过以太网接口直接通信，采用IP协议。", "5028": "答“错误”：空气开关主要起（过载、短路等）保护作用（不只是开关作用）。", "5029": "答“正确”：客户是企业生存和发展的根基。", "5030": "答“错误”：不能通过增大发射功率减小慢衰落（慢衰落是阴影等引起，增大功率会增大干扰）。", "5031": "答“错误”：CE资源是软资源，Walsh码资源是硬资源（本题说反了）。", "5032": "答“正确”：可以采用分段环回法来定位故障。", "5033": "答“正确”：可能危及作业人员或他人人身安全的野外作业应设置安全标志。", "5034": "答“正确”：开环空间复用适用于SINR高且UE移动速率高。", "5035": "答“正确”：开关电源系统某个整流模块发生故障后应不影响系统的正常工作。", "5036": "答“错误”：开关电源模块可直接从机架拨出进行维护（需先确认可热插拔及负载分配），本题判错误——整流模块可热插拔但需注意，按题库答案判错误。", "5037": "答“正确”：开关电源模块的表面污垢不易清除时可用酒精谨慎清除。", "5038": "答“错误”：开关电源的限流最大值（可以超过）输出电流标称值（本题判错误，按题库答案为准）。", "5039": "答“错误”：开关电源保护关机是通过（关闭输出或断开整流模块，不是关闭交流输入）来实现的。", "5040": "答“正确”：绝缘杆从结构上可分为工作部分、绝缘部分和握手部分三部分。", "5041": "答“正确”：绝缘杆、绝缘夹钳在使用中应定期进行绝缘试验。", "5042": "答“错误”：聚焦当前5G网络运行安全存在的短板弱项，开展5G网络运行安全能力提升专项行动，提高（5G网络运行安全水平，本题判错误，按题库答案为准）。", "5043": "答“错误”：具有较完善的天线自动跟踪系统的地球站，也（需要保留）手动跟踪功能（作为备用）。", "5044": "答“正确”：矩形波导内的主导波型是TE10波。", "5045": "答“正确”：局域网的基本介质有同轴电缆、双绞线、光纤。", "5046": "答“正确”：静中通卫星通信车使用时，应先确保系统接地无误后方可加电。", "5047": "答“错误”：静中通天线控制器超级指令为（自动对星），不是上下左右收藏对星。", "5048": "答“正确”：静中通是在静止状态下使用的车载卫星通信设备。", "5049": "答“正确”：静中通的功能是建立卫星通信的链路。", "5050": "答“正确”：静止卫星相对于地球并不静止（按题库答案判正确）。", "5051": "答“错误”：静止卫星是（轨道周期与地球自转周期相同且位于赤道上空的卫星），不是基本不离开地球站的通信卫星。", "5052": "答“正确”：静止卫星的轨道必然处于赤道平面上。", "5053": "答“正确”：静止卫星必然处于赤道平面上。", "5054": "答“正确”：静止轨道也是同步轨道。", "5055": "答“正确”：静止轨道的倾角是零度。", "5056": "答“正确”：静止轨道的倾角是零度。", "5057": "答“正确”：进入IDRMODEM的用户数据的码型是HDB3码。", "5058": "答“正确”：解决相位模糊的方法之一是在调制之前先对传输码流进行差分编码。", "5059": "答“正确”：接收系统的品质因数为接收信号方向的接收天线增益与接收系统噪声温度之比。", "5060": "答“正确”：接闪器就是指避雷针，避雷带、避雷网都不是接闪器（按题库答案判正确）。", "5061": "答“错误”：接地线（不应）使用裸导线布放（应采用绝缘导线）。", "5062": "答“正确”：接地线不应与电缆线交缠在一起。", "5063": "答“正确”：接地线不能复接。", "5064": "答“正确”：接地系统通常由接地体、接地引入线、接地汇集线、接地线组成。", "5065": "答“正确”：接地系统是通信电源系统的重要组成部分，不仅直接影响通信质量和电源系统的正常运行，（还影响设备和人身安全）。", "5066": "答“正确”：接地系统的电阻中起决定性作用的是接地体附近的土壤电阻。", "5067": "答“正确”：接地体与接地总汇集线之间的连线称为接地引入线。", "5068": "答“正确”：接地电阻的大小对基站设备技术参数以及信号传输没有任何影响（按题库答案判正确）。", "5069": "答“正确”：采用接地、接零保护措施后，当电气设备发生故障时，线路上的保护装置会迅速（动作切断电源）。", "5070": "答“正确”：较热地方不要轻易脱下衣服，否则不仅有被灼烧的危险还会增加流汗，但要尽可能穿得宽松。", "5071": "答“正确”：交流输入过、欠压：单相、三相达上限值105%-115%时发出声光告警。", "5072": "答“错误”：交流市电电压220V是指交流电的（有效值，不是峰值）。", "5073": "答“错误”：交流供电采用三相五线制，零线（严禁）安装熔断器（本题说法错误）。", "5074": "答“正确”：交流电系统中零线上严禁单独装设刀开关及熔断器。", "5075": "答“正确”：交流不间断电源在市电中断时，蓄电池通过逆变器(DC/AC变换器)给通信设备供电。", "5076": "答“正确”：降压变压器是把高压电源变换成低压的电源设备。", "5077": "答“错误”：将直流电转变为不同电压值的直流电称为（直流变换/斩波），将直流转变为交流称为逆变。", "5078": "答“正确”：将模拟信号转变为数字信号的过程中必须经过抽样、量化和编码。", "5079": "答“正确”：将基础设施作为服务的云计算服务类型是IaaS。", "5080": "答“正确”：建设项目的安全设施应当与主体工程同时设计、同时施工、同时投入生产和使用，即“三同时”。", "5081": "答“错误”：建设高度可靠融合互通的国家通信网应急通信指挥调度系统和网络，加强（相关建设），本题判错误，按题库答案为准。", "5082": "答“错误”：建设多维一体应急通信保障网络，加快卫星移动通信网络建设进度，推广5G和无人机在应急（通信中的应用）——本题判错误，按题库答案为准。", "5083": "答“正确”：架空水泥杆一般使用7m×12cm的水泥杆，跨车道路口使用9m×15cm的水泥杆；吊线（规格按设计）。", "5084": "答“正确”：架空光缆在每根杆处均应作伸缩弯以防止光缆热胀冷缩引起光纤断裂，架空光缆每隔一定距离（留有余量）。", "5085": "答“正确”：驾车时遭遇洪水出现熄火现象应立即弃车。", "5086": "答“错误”：天通业务由（中国电信）运营（不是几大运营商及工信部应急中心均可运营）。", "5087": "答“错误”：集团在（北京、广东两地）建设集团级应急物资储备中心（不是上海、广东）。", "5088": "答“错误”：集团在（北京、广东）两地建设中国电信集团级应急物资储备中心（不是福建武汉、上海广州）。", "5089": "答“正确”：集团范围的演练至少每2年组织一次。", "5090": "答“错误”：极化天线主要分为垂直极化、水平极化（不是平行极化）和交叉极化（双极化）等。", "5091": "答“正确”：基站通常不安装遥像的原因是价格昂贵且传输带宽大。", "5092": "答“正确”：基站接地分为工作地、保护地、防雷地。", "5093": "答“错误”：基站高度不够时会造成（覆盖不足/盲区），不会造成越站干扰（越站干扰是天线过高/倾角不当引起）。", "5094": "答“正确”：基站车开通前应确保防雷接地、工作接地连接牢靠。", "5095": "答“错误”：基站壁挂式空调室内机不允许安装在基站设备上方（易滴水损坏设备）。", "5096": "答“正确”：基础电信运营企业要建立和完善网络预警监测机制，加强电信网络运行监测。", "5097": "答“错误”：基础电信运营企业强化对网络运行安全和网内互联互通安全的监测及风险隐患排查（本题说法正确但题库判错误，按答案为准）。", "5098": "答“错误”：积极适应“全过程、大应急”综合救援需要，优化力量布局和队伍编成，填补救援力量空白，加强（建设）——本题判错误，按题库答案为准。", "5099": "答“错误”：机油因温度过高而变稀会（降低）润滑效果（不是有利于润滑效果）。", "5100": "答“正确”：机油压力与机组转速有关。", "5101": "答“错误”：机油滤清器上旁通阀的作用是（机油滤芯堵塞时旁通供油），不是限压。", "5102": "答“错误”：机房精密空调高压故障消除后（需手动复位），不能自动复位。", "5103": "答“错误”：机房的接地母线（必须是铜排等导电良好材料），不是只要是金属就行。", "5104": "答“正确”：火花塞的作用是产生火花，点燃气缸内的混合气。", "5105": "答“正确”：活塞环磨损严重将导致排气冒黑烟。", "5106": "答“正确”：回声消除器在双向同时讲话时回音抑制的效果很好。", "5107": "答“正确”：黄磷应保存于水中，二氧化碳要用水封贮存。", "5108": "答“正确”：换流设备是整流设备、DC-DC变换器和DC-AC变换设备的总称。", "5109": "答“正确”：环形网保护是实现自愈网的方法之一。", "5110": "答“正确”：环境温度传感器应避免受到空调的直接影响，避免安装在空气不流通的死角。", "5111": "答“正确”：互感器是供电系统中测量和保护用的设备。", "5112": "答“正确”：呼吸效应指的是随着基站容量的增加覆盖减小的现象。", "5113": "答“错误”：后备型发电机组一般不可以超负荷工作（应按规定负荷运行）。", "5114": "答“正确”：后备发电机组价格是同类发电机组中比较高的。", "5115": "答“错误”：后备UPS在市电中断时其输出（有切换间断，几毫秒至10ms），不是没有任何间断。", "5116": "答“错误”：洪水到来来不及转移时不能（盲目）游泳逃生（应到高处等待救援，游泳非常危险）。", "5117": "答“正确”：衡量地球站接收信号能力的参数是G/T值。", "5118": "答“错误”：衡量地球站发射能量的参数是EIRP（等效全向辐射功率），不是发射信号的功率。", "5119": "答“正确”：衡量地球站发射能量的参数是EIRP。", "5120": "答“正确”：核心价值观：全面创新、求真务实、以人为本、共创价值。", "5121": "答“错误”：夯实信息化发展基础，补齐网络、数据、安全、（应用）等方面的短板弱项——本题判错误，按题库答案为准。", "5122": "答“错误”：海事卫星采用L频段，即船与星之间上行1.6GHz、下行1.5GHz（本题说反了）。", "5123": "答“错误”：海事卫星系统不是世界上能对海、陆、空的移动体提供静止卫星通信的唯一系统（还有其它系统）。", "5124": "答“正确”：海事卫星使用的同步轨道卫星。", "5125": "答“错误”：海事卫星电话工作于L频段（不是Ku频段）。", "5126": "答“错误”：海事卫星电话需要安插SIM卡才能进行通话。", "5127": "答“错误”：海事卫星第四代卫星系统中国地区用户使用（中国区域/海事卫星）提供服务，对星方位（东南，不是西南）。", "5128": "答“正确”：海事卫星BGAN电话广泛应用于应急通信、抢险救灾及应对突发事件等领域的通信保障。", "5129": "答“错误”：海事通信卫星采用L频段，即船与星之间上行1.6GHz、下行1.5GHz（不是15GHz/16GHz）。", "5130": "答“错误”：国家主要领导人参加的活动不一定为一类活动（按级别划分，可能特级等）。", "5131": "答“正确”：国家应急通信主要是指在突发事件情况下实现通信保障，确保国家重要通信安全畅通。", "5132": "答“正确”：国家应急通信采用标准色规定了标识的色彩，禁止使用其他色彩。", "5133": "答“正确”：国家应急通信标识由图形和文字两部分组成，图形包括惊叹号、通信信号，其中红色惊叹号（醒目）。", "5134": "答“正确”：国家决定实施国防动员后，战略物资的调用由国务院和中央军事委员会批准。", "5135": "答“正确”：国家决定实施国防动员后，根据需要可以依法在实施国防动员的区域采取对金融、交通运输、（邮电通信等）管制措施。", "5136": "答“错误”：国家安全生产应急救援中心和部所属事业单位所有新建非涉密应用系统（一律）上云，新立项信（息化项目按云化要求建设）——本题判错误，按题库答案为准。", "5137": "答“正确”：国际卫星组织在C频段上采用上行LHCP、下行RHCP，我国采用线极化。", "5138": "答“正确”：贵州用户使用天通手机呼叫河南用户的普通手机时不需要加拨区号（天通号码为专用卫星号码）。", "5139": "答“错误”：光纤之所以能传输光信号是因为纤芯的折射率比包层的折射率大（不是小）。", "5140": "答“正确”：光纤衰减主要有吸收衰减和散射衰减。", "5141": "答“错误”：光纤是利用（全反射）原理导光的（纤芯折射率大于包层，不是反射率高）。", "5142": "答“正确”：光纤识别仪是一种光纤维护必备的工具，用于无损的光纤识别工作。", "5143": "答“正确”：光纤接续质量受机具、仪表精度、操作人员技能高低的影响较大，即使同样的光缆、机具、仪表（不同人接续质量也不同）。", "5144": "答“错误”：光纤接头不用时需要用光帽盖住，不仅是为了防止激光器不可见激光照射人眼，还（防止灰尘污染端面）。", "5145": "答“错误”：光纤对光信号的损耗与信号的波长有关（不同波长损耗不同）。", "5146": "答“错误”：光纤的损耗与传输的光波长有关，且与光纤的种类有关，但与传输速率无关（本题判错误）。", "5147": "答“错误”：光纤的（色散）是引起光纤带宽变窄的主要原因（不是非线性）。", "5148": "答“正确”：光纤测试中当几段光缆折射率不同时可采用分段设置的方法，减小因折射率设置误差造成的测试误差。", "5149": "答“正确”：光纤按模数分为单模光纤及多模光纤。", "5150": "答“正确”：光衰减器、光分路器和光耦合器都是无源光器件。", "5151": "答“正确”：光时域反射仪显示器上所显示的波形即为通常所称的“OTDR前(后)向散射曲线”。", "5152": "答“正确”：光路割接前应核对光纤连接关系，并进行倒换测试后方可进行割接。", "5153": "答“正确”：光缆线路日常巡查方式包括徒步巡查和车巡两种方式。", "5154": "答“正确”：光缆线路抢修过程中进行光纤障碍测试前，被测光纤上的光端机应予关机。", "5155": "答“正确”：光缆熔接机是光纤固定接续的专用工具，可自动完成光纤对芯、熔接和推定熔接损耗等功能。", "5156": "答“正确”：光缆配盘时应尽量做到整盘配置以减少接头数量。", "5157": "答“正确”：光缆接头盒中容纤盘最终余留光纤长度为0.6m。", "5158": "答“错误”：光缆接头盒内金属构件一般要作电气（绝缘断开处理，不连通）。", "5159": "答“正确”：光缆敷设施工后在接续前应剪去一段长度，以确保接续部分没有受到机械损伤。", "5160": "答“正确”：光缆的弯曲半径不应小于光缆外径的15倍，施工过程中不应小于20倍。", "5161": "答“正确”：光缆的基本结构一般由缆芯、加强构件、填充物和护层等几部分构成。", "5162": "答“正确”：光缆成端后缆芯的金属加强芯或金属防潮层等都必须进行接地处理。", "5163": "答“正确”：光缆布放应尽量做到整盘布放，以减少接头。", "5164": "答“正确”：光接收机的主要指标是灵敏度和动态范围。", "5165": "答“正确”：光交设备是指光接头盒和光交接箱。", "5166": "答“正确”：光交换技术是指经过光/电转换，在光域直接将传输光信号交换到不同的输出端。", "5167": "答“错误”：光分路器OBD是一种可以将一路光信号分成多路光信号以及完成相反过程的（无源）器件（不是有源器件）。", "5168": "答“错误”：光放大器可以直接放大光信号（不需转换成电信号）。", "5169": "答“正确”：光波是一种高频电磁波，不同波长(频率)的光波复用在一起进行传输，彼此之间相互作用。", "5170": "答“错误”：关闭卫星通信车(小车)时需要先关闭MODEM，最后关闭BTS设备（或按操作规程顺序，本题判错误）。", "5171": "答“正确”：故障修复的原则是“先抢通，后修复”。", "5172": "答“正确”：故障的责任追究将遵循“四不放过”的原则：故障原因不查清不放过；故障处理不完成不放过；等等。", "5173": "答“正确”：故障处理遵循日常预防维护为主、应急故障处理为辅的管理原则，通过建立故障预警机制。", "5174": "答“正确”：固态高功放具有带宽大、输出功率不高、能耗不大等特点。", "5175": "答“正确”：供电电缆在运行中发热的主要原因是（过载、接触不良），不是电缆太长——本题判正确，按题库答案为准。", "5176": "答“正确”：功率因子校正的基本思想是使输入电流跟踪输入电压的变化并减少谐波成份。", "5177": "答“正确”：功率因数的定义是有功功率与视在功率的比值。", "5178": "答“错误”：功率因数的定义是有功功率与视在功率的比值（不是视在功率与有功功率的比值）。", "5179": "答“正确”：功率控制的一个目的是通过动态调整发射功率维持接收端一定的信噪比，从而保证链路的传输质量。", "5180": "答“错误”：公众通信网省际骨干网络中断、全国重要通信枢纽楼遭到破坏等，造成2个以上省(区、市)通（信大面积中断属特别重大事件）——本题判错误，按题库答案为准。", "5181": "答“正确”：公众风险防范意识相对淡薄、自救互救能力较弱，已成为制约我国应急管理水平整体提升的瓶颈。", "5182": "答“正确”：工作容积与燃烧室容积之和叫气缸总容量。", "5183": "答“错误”：工作接地分为直流工作接地和交流工作接地（不是交流保护接地）。", "5184": "答“错误”：工作地线和保护地线均以大地构成回路，但其作用不一样（工作地提供工作回路，保护地保护人身设备安全）。", "5185": "答“错误”：工信部批准中国电信5G频段为3400-3500MHz（不是3500-3600MHz）。", "5186": "答“正确”：更换线路板时插拔线路板前应先拔掉线路板上的光纤，然后再拔线路板。", "5187": "答“错误”：更换过滤网时必须先关闭空调（不能带电操作）。", "5188": "答“错误”：根据所控制的信号参量的不同，调制方法可分为调幅、调频、调相（不是调波）。", "5189": "答“错误”：根据事故的具体情况，事故调查组由（有关人民政府、应急管理等相关部门）组成（本题判错误，按题库答案为准）。", "5190": "答“正确”：根据汽油机工作状况和要求，点火装置必须保证汽油机各种工作状态下可靠地点燃混合气。", "5191": "答“正确”：根据工作原理发动机可分为四行程和二行程两种。", "5192": "答“错误”：根据对应业务的QOS要求，业务承载可以分为（GBR保证比特速率和Non-GBR非保证比特速率）两种（不是最小保证速率和最大保证速率）。", "5193": "答“错误”：根据《突发事件应对法》，突发事件包括自然灾害、事故灾难、公共卫生事件和社会安全事件（本题判错误，按题库答案为准）。", "5194": "答“正确”：根据“谁使用，谁保管，谁维护”的原则，应急物资使用过程中的维护、保管、归还物资所产生的费用（由使用单位承担）。", "5195": "答“正确”：各种接地的分类一般可分为工作接地、保护接地和防雷接地。", "5196": "答“正确”：各应急预案管理部门要按照“全面、准确、单一、具体、简单”的原则完善应急预案。", "5197": "答“正确”：各网络节点之间的接口使用IP传输。", "5198": "答“正确”：各省应急通信局作为应急预案的归口管理机构，负责本省应急预案体系的建设工作。", "5199": "答“错误”：各省通信管理局负责（监管）应急通信保障工作（组织指挥协调由更高层或应急办负责，本题判错误，按题库答案为准）。", "5200": "答“正确”：各级保护设备之间发生故障时保护电器的动作应有选择性。", "5201": "答“错误”：各地应急通信支撑公网或跨区域组网时由（上级或总部统一）协调（不是各地自行协调）。", "5202": "答“错误”：各单位所使用的装备及物资（可以）同时印绘国家应急通信标识和企业、单位标识（本题判错误，按题库答案为准）。", "5203": "答“正确”：个人电脑不得连接移动通信维护网络，应防止电脑上的病毒攻击移动通信网络。", "5204": "答“错误”：割接工作原则上采用（不带业务/零点后）割接方式，安排在每日0:00～8:00时段进行（本题判错误，按题库答案为准）。", "5205": "答“错误”：高站是指（天线架设位置高的站点），不是发信频率高于收信频率。", "5206": "答“错误”：高增益直放站依靠（收发天线隔离及滤波器）才能实现上下行支路足够的隔离度（不是仅靠双工器）。", "5207": "答“错误”：高压停电操作时应先断开（隔离开关前先断断路器），本题判错误——正确应先断油开关（断路器）再断隔离开关，题干表述与操作规范相符但题库判错误，按题库答案为准。", "5208": "答“正确”：高压操作时应使用绝缘防护工具，注意人身安全和设备安全。", "5209": "答“正确”：高压操作时必须使用绝缘防护工具，注意人身、设备安全，并做到一人操作一人监护。", "5210": "答“错误”：高通量卫星通信不等于Ka频段的卫星通信（高通量还可使用其它频段）。", "5211": "答“错误”：高频开关电源运行参数的设置（也可以在本机/后台设置），不只是监控模块上操作才能完成（本题判错误，按题库答案为准）。", "5212": "答“错误”：高功放输出功率的最大点称为饱和点，一般功放都工作在（饱和点以下的线性区，不是饱和点）。", "5213": "答“正确”：干粉灭火剂不适合扑救精密仪器火灾。", "5214": "答“错误”：杆塔工作时间需避免中午暴晒时间和夜晚作业时间，当室外温度超过（40℃或规定）度时原则上可要求（停止作业）——本题判错误，按题库答案为准。", "5215": "答“错误”：杆塔工作时间需避免中午暴晒时间，尽量安排在（清晨或傍晚凉爽时间）进行作业（不是夜晚）。", "5216": "答“错误”：杆路的加固、防雷、防强电设施（每年，不是每半年）检修一次。", "5217": "答“错误”：浮充电是（蓄电池与整流设备并联长期运行在浮充状态），不是使用前进行较长时间的充电（那是初充电）。", "5218": "答“正确”：蜂窝系统容量受频率复用产生的干扰限制。", "5219": "答“正确”：风雪天外出戴上手套、防寒帽，防寒帽最好是能护住耳朵的，否则应戴上耳朵罩。", "5220": "答“错误”：分散供电的优点是（设备分散、体积小、可就近安装），本题把分散供电与集中供电混淆判错误。", "5221": "答“错误”：分流器是用于在线检测电流的（不是电压）。", "5222": "答“错误”：分集技术可以改善（多径衰落），不能改善雨衰的影响。", "5223": "答“错误”：非常态下的应急管理组织体系主要指（国家应急管理指挥体系和各级应急机构），不只是国家各级政府的应急办。", "5224": "答“正确”：防止人身电击最根本的是对工作人员或用电人员进行安全教育和管理。", "5225": "答“正确”：防止雷电流感应最有效的办法是屏蔽。", "5226": "答“正确”：防汛抗洪保障中的涉电作业人员必须配置“六个一”（一顶安全帽、一条安全带、一双绝缘鞋等）。", "5227": "答“正确”：防静电危害的措施一般有接地法、泄漏法、中和法和工艺控制法4种。", "5228": "答“正确”：防火墙可以阻断攻击，但不能消灭攻击源。", "5229": "答“正确”：防护接地装置地线电阻、架空吊线接地电阻、分线设备接地电阻、交接设备接地电阻技术维护（测试周期按规范）。", "5230": "答“错误”：凡延误重要通信或其他通信而造成后果的属（人为障碍），不是不明障碍。", "5231": "答“正确”：凡是从事高处作业的人员应定期进行健康检查，发现身体不适合高处作业时不得从事这一工作。", "480": "C 正确：卫星实际轨道偏离理想轨道称摄动（引力摄动等因素）。A/B/D 错误：星蚀/日凌/雨衰不符。", "481": "A 正确：因接触电压原因，设备接地时距离接地体近一些（接触电压与距离有关）。B/C 错误：远一些/没关系不符。", "482": "A 正确：由光缆线路故障造成的通信阻断障碍叫光缆线路障碍。B/C/D 错误：通信/信道/信号障碍不符。", "483": "A 正确：大气折射作用使电波传播按曲线进行而非直线。B/C/D 错误：反射/吸收/散射不符。", "484": "D 正确：双折射使正交偏振模传播速度不等产生时延差，造成PMD（偏振模色散）。A/B/C 错误：衰耗/色度色散/模式色散不符。", "485": "D 正确：220V标称电压在受电端子允许变化范围是187~242V（±10%）。A/B/C 错误：范围不符。", "486": "B 正确：地球站发射给通信卫星的信号称为上行信号。A/C/D 错误：前向/上传/上星不符。", "487": "B 正确：TD-LTE每RB带宽180kHz，小区无用户接入时每RB干扰门限NI为-116.2dBm。A/C/D 错误：-117/-100/-110不符。", "488": "C 正确：由RAN发起的寻呼发生在终端处于INACTIVE（非激活）状态。A/B 错误：CONNECTED/IDLE不符。", "489": "A 正确：弯曲引起的损耗在OTDR显示仅为背向散射电平跌落。B/C/D 错误：活动连接/机械连接/裂纹有事件反射峰。", "490": "A 正确：配置流层时如果配置的是2M业务则选择相应流层配置，表述正确。B/C/D 错误：TMP层源宿/都不正确/TMC层不符。", "491": "A 正确：用于再生段误码层监视的是B1字节。B/C/D 错误：B2（复用段）/B3（通道）/K1不符。", "492": "A 正确：用于维护的差错性能指标是差错秒ES和严重差错秒SES两个参数。B/C/D 错误：参数组合不符。", "493": "D 正确：用于网络切片选择和管理的5GC网元是NSMF（网络切片管理功能）。A/B/C 错误：SMF/AMF/UPF不符。", "494": "C 正确：连接多个局域网组成广域网的设备是路由器（Router）。A/B/D 错误：Modem/RAS/Server不符。", "495": "C 正确：衡量随机变量或数据离散程度的指标是方差。A/B/D 错误：均值/中位值/众数不符。", "496": "A 正确：调整天线方位、仰角、极化角并提供跟踪控制功能的单元是ACU（天线控制单元）。B/C/D 错误：ALC/CMS/HPA不符。", "497": "C 正确：压力表测得空调压力为相对压力（表压）。A/B/D 错误：饱和/绝对/临界压力不符。", "498": "A 正确：用下滑有利速度下滑飞机升阻比最大（滑翔比最大）。B/C 错误：升力最大/下滑角最大不符。", "499": "B 正确：手表辨向时针正对太阳，时针与12点夹角平分线指向正南（北半球）。A/C/D 错误：东/西/北不符。", "500": "A 正确：用人单位延长工作时间一般每日不得超过1小时。B/C/D 错误：2/2.5/3不符。", "501": "A 正确：用人单位应当创造条件改善集体福利，提高劳动者福利待遇。B/C/D 错误：社会/公共/企业福利不符。", "502": "A 正确：用频谱仪寻星时首先应检查是否有底噪（确认仪器工作正常）。B/C/D 错误：极化/参考源/设置不符。", "503": "B 正确：频谱仪测量载波调整BW参数，一般载波带宽是BW的20-30%。A/C/D 错误：10-20/30-40/40-50不符。", "504": "B 正确：实际性能系数一般只有铭牌值的0.92左右（铭牌偏理想）。A/C/D 错误：0.67/0.5/0.8不符。", "505": "C 正确：描述天线对发射功率汇聚程度的指标是增益。A/B/D 错误：带宽/功率/极性不符。", "506": "C 正确：用户追求小口径天线会造成邻星下行干扰（波束旁瓣指向邻星）。A/B/D 错误：上行/上下行/不受干扰不符。", "507": "C 正确：空闲状态跨位置区移动手机会进行位置更新。A/B/D 错误：呼叫转移/切换/休眠不符。", "508": "B 正确：多天线峰值体验特性未激活时用户只能获得单流性能。A/C 错误：无法获得数据/仍获多流不符。", "509": "D 正确：IE启动后总访问特定网站且无法更改主页，是因为中了恶意代码（劫持主页）。A/B/C 错误：网卡/IE/系统故障不符。", "510": "B 正确：后向法测试光纤线路损耗所用仪表为OTDR。A/C/D 错误：光功率计/电平表/衰耗器不符。", "511": "B 正确：ping对端微波管理IP时，首先通过ARP协议获取目标MAC地址。A/C/D 错误：动态路由/CSMA/CD/TCP握手不符。", "512": "C 正确：OTDR全程背向散射曲线测试，设置的量程应大于被测光缆长度的0.7倍（约1.5倍实际距离对应0.7系数）。A/B/D 错误：0.2/0.4/1不符。", "513": "A 正确：5KVA油机发电最多能开1个50A模块（功率限制）。B/C 错误：2/3不符。", "514": "C 正确：1:2分光器衰减约3dB，1:32分光器衰减约15dB（每级分光约3dB，5级×3）。A/B/D 错误：12/9/6不符。", "515": "D 正确：影响光传输的光纤参数有光信噪比、光色散容限、非线性。A/B/C 错误：光纤质量/距离/光缆不符。", "516": "A 正确：影响柴油发电机自发电频率的因素是柴油机的转速（频率∝转速）。B/C 错误：机油压力/励磁不符。", "517": "A 正确：影响柴油发电机稳态频率带的因素是柴油机的转速稳定性。B/C/D 错误：机油压力/励磁/输出电压不符。", "518": "B 正确：应用双归保护的业务类型是LTE（基站双归接入）。A/C/D 错误：TD/BTS/CMNET不符。", "519": "D 正确：应急窄带VSAT网所使用的卫星是亚太VI号。A/B/C 错误：中卫1号/亚三S/亚洲6号不符。", "520": "A 正确：应急预案层次划分为综合预案、专项预案、现场预案。B/C/D 错误：层次组合不符。", "521": "B 正确：应急预案编制完成后还应确保预案的批准、实施和维护。A/C/D 错误：更新/培训/演练不符。", "522": "B 正确：应急油机供电线路连接应先负载端再供电端（先接负载后供电防电弧）。A/C 错误：先供电端/均可不符。", "523": "A 正确：应急演练方法主要有桌面演练、功能演练和全面演练。B/C 错误：消防/军训演练不符。", "524": "A 正确：应急响应包括信息收集与应急决策（立即采取的应急与救援行动）。B/C/D 错误：队伍建设/损失评估/预案演练非响应环节。", "525": "C 正确：应急响应事件发生后基础电信运营企业应立即采取有效处置措施控制事态。A/B/D 错误：工信部/通信管理局/指挥机构不符。", "526": "A 正确：应急物资储备点应满足防盗、防火、防水、防潮要求。B/C/D 错误：防风/防淹/防冻组合不符。", "527": "C 正确：应急卫星信号由发端站到收端站经上行、下行线路和卫星转发器。A/B/D 错误：仅一路/交换中心不符。", "5232": "答“错误”：发现有人触电时应（立即拉闸停电），不需要请示领导同意（救人要紧）。", "5233": "答“正确”：发现密闭空间有人中毒，在未采取保护措施时不准单人盲目进入施救，避免人员连续伤亡。", "5234": "答“正确”：发生软/硬切换时有可能需要占用多个CE资源。", "5235": "答“错误”：发生高处坠落事故如有骨折伤员，应注意对骨折部位的保护，使用（硬质担架）平抬（不是较软的器械）。", "5236": "答“正确”：发电结束后油机空载5～10分钟方可停机。", "5237": "答“错误”：发电机组在加注发动机燃油时必须停机操作。", "5238": "答“错误”：发电机组空载试机持续时间不宜（过长，不是不宜太短）。", "5239": "答“正确”：发电机组的工作辅助部分一般有电缆绞盘、油机市电倒换装置、蓄电池充电部分组成。", "5240": "答“错误”：发电机运行期间在手湿情况下严禁操作发电机。", "5241": "答“正确”：发电机运行期间严禁往发电机内加放燃油（若要加放燃油必须停机后操作），至少留有一名技术人员监护。", "5242": "答“正确”：发电机严禁在室内、不具备发电条件或空气流通不充分的情况下使用。", "5243": "答“错误”：发电机严禁与易燃易爆品和杂物混合堆放在一起（保持距离也不行）。", "5244": "答“正确”：发电机发电时应放在干燥、平整、阴凉、通风的地方。", "5245": "答“正确”：发电机的外壳必须有可靠的接零或接地保护。", "5246": "答“错误”：发电机的机油液位应（处于规定范围），本题判错误——机油液位应在上限与下限之间（不低于下限不高于上限），按题库答案判错误。", "5247": "答“正确”：发电操作流程应：先检查——把双非门刀切至油机端——然后连接好线缆——再起动油机——合（闸供电）。", "5248": "答“正确”：二极管的反向电阻与正向电阻相差愈大，说明二极管单向导电性愈好。", "5249": "答“错误”：多用插座、电烙铁、手电钻、电锤等工具的电源接线应绝缘良好，不能将电线缠挂收藏在设备上。", "5250": "答“错误”：对于移动通信来说多径效应（利用分集等技术也有好处），不只是坏处。", "5251": "答“错误”：对于同一类型的天线，天线越长增益越大（不是越小）。", "5252": "答“正确”：对于特殊条件基站（高山、荒芜等）和特殊环境基站（暴雨、大雾天气等）的夜间故障抢修，经（批准后可实施）。", "5253": "答“错误”：对于密集市区或市区由于站间距比较近，邻区应该多做，所以要将（可能发生切换的邻区）都加（入邻区表，本题判错误，按题库答案为准）。", "5254": "答“正确”：对于控制信道PDCCH，配置不同的CCE等级有不同覆盖。", "5255": "答“正确”：对于光板而言其接收光功率必需在一定的范围之内。", "5256": "答“正确”：对于电路中的任何一个回路来说回路的电压降的代数和为零（基尔霍夫电压定律）。", "5257": "答“错误”：对于地球站数目较多而每站业务量较少的情况，使用（按需分配DAMA方式）分配信道较好（不是预分配）。", "5258": "答“错误”：对于半导体光源其输出的光功率与注入电流成（正比，不是反比）。", "5259": "答“错误”：对数正态衰落是由（地形地物阴影遮挡）引起的（不是邻近物体反射——那是多径快衰落）。", "5260": "答“错误”：对倾斜入射到地面的天波，发射水平极化波的电矢量总是与地面平行，发射垂直极化波的电矢量（与地面垂直）——本题判错误，按题库答案为准。", "5261": "答“正确”：对基站机房设于通信楼顶层的，馈线接地排的接地应从楼顶避雷带就近引接。", "5262": "答“正确”：对光源进行强度调制的方法有两类，即直接调制和间接调制。", "5263": "答“正确”：对电路远端进行环回，本端接2M表进行测试，红灯亮表示电路中断。", "5264": "答“错误”：对不同电信业务网络的转接，交换设备的性能要求（不一样，不是一样的）。", "5265": "答“错误”：短波电离层反射信道属于（变参信道，不是恒参信道）。", "5266": "答“错误”：短波(单边带机或者HF)主要利用天波、地波传播（本题判错误——散射波/绕射波表述不当，按题库答案为准）。", "5267": "答“错误”：毒物泄露伤害严重程度与（毒性、剂量、接触时间等）都有密切关系（本题判错误，按题库答案为准）。", "5268": "答“正确”：冻伤可用体温温暖，但对三度以上的冻伤者施温者要注意时间不能长。", "5269": "答“正确”：冻伤部位处理后不宜暴露于寒冷中，要注意保暖，更不要以解冻的脚走路。", "5270": "答“错误”：定向天线的增益比全向天线的高（不是低）。", "5271": "答“错误”：定向扇区不能用全向天线（应使用定向天线）。", "5272": "答“正确”：调整好地球站天线指向是保证卫星通信质量的关键之一。", "5273": "答“正确”：调整好KU卫星车的天线指向是保证该路由卫星通信质量的关键之一。", "5274": "答“正确”：调试仪器应在计量有效期内。", "5275": "答“错误”：电阻作为负载时电阻（越小）说明负载越重（负载重指功率大，电阻小电流大）。", "5276": "答“正确”：电阻的并联：将电路中若干个电阻并列连接起来的接法称为电阻并联。", "5277": "答“错误”：电子邮件病毒（具有）自我复制和传播的特性。", "5278": "答“正确”：电灼伤、电烙印、皮肤金属化属于电伤。", "5279": "答“错误”：电源通向负载的两根导线通过负载而相互（不经负载）直接接通的现象称为短路（本题判错误，按题库答案为准）。", "5280": "答“正确”：电源通向负载的两根导线不经负载而相互直接接通的现象称之为短路。", "5281": "答“正确”：电源机柜面板上的运行灯其工作电压220VAC。", "5282": "答“正确”：电源串联可以获得较大的电压。", "5283": "答“正确”：电源串联：将前一个电源的负极和后一个电源的正极依次连接起来。", "5284": "答“错误”：电源按照接地系统的用途可分为工作接地、保护接地和防雷接地（不是防静电接地）。", "5285": "答“正确”：电压互感器二次侧不能短路，电流互感器二次侧不能开路。", "5286": "答“正确”：电压固定的情况下流过每一条通路的电流值将与其电阻的大小成反比。", "5287": "答“错误”：电视业务虽然不是24小时连续使用，但（也是）主要通信业务（本题判错误，按题库答案为准）。", "5288": "答“正确”：电蚀时金属离子在化学反应下是由正极向负极移动的。", "5289": "答“错误”：电启动机组一般能在十秒内启动，如一次未启动（应间隔后再启动，不能连续启动，会损伤电瓶）。", "5290": "答“错误”：电路中阻值愈大的电阻消耗的功率（不一定愈大，功率=电压或电流决定，本题判错误）。", "5291": "答“正确”：电路中通过电阻的电流与电阻两端所加的电压成正比、与电阻成反比，称为部分欧姆定律。", "5292": "答“正确”：电路交换技术采用面向连接的工作方式。", "5293": "答“错误”：电路发生障碍时按照《电信应急通信保障预案》规定，首先设法抢通（重要/指挥）电路（不是经济收入最高的电路）。", "5294": "答“错误”：电路的总噪声包括量化噪声、热噪声、非线性噪声、信道误码等，但（热噪声/量化噪声）是主要噪声（不是信道误码）。", "5295": "答“正确”：电流流过人体造成对人体的伤害称为电击。", "5296": "答“正确”：电流持续时间越长电流对人体的伤害越严重。", "5297": "答“正确”：电力线路是高频通道组成的一部分。", "5298": "答“正确”：电力机务员须有电工基础理论和电工专业技术知识及一定的实践经验，并须经过安全技术培训。", "5299": "答“正确”：电力电缆布放过程中如发现长度不够时应重新更换电缆，不应在电缆中做接头或焊点。", "5300": "答“正确”：电力变压器在额定容量80%负荷运行下运行最为经济。", "5301": "答“正确”：电离层散射是指由于电离层电离度的不规则性或不连续性而引起的无线电波传播。", "5302": "答“正确”：电功指的是供电系统实际消耗的电能。", "5303": "答“正确”：电磁屏蔽是防止电磁伤害的主要措施。", "5304": "答“正确”：电磁波在自由空间传播其速度和频率无关。", "5305": "答“正确”：电磁波在一个周期的振荡时间内所走的距离叫波长，以字母“λ”表示。", "5306": "答“错误”：电磁波在传播过程中频率越高传播的距离越短、绕射能力越弱（不是越强）。", "5307": "答“正确”：电磁波的传输与反射是传输线工作的基本物理现象。", "5308": "答“正确”：电池容量常用符号“C”表示，单位为AH。", "5309": "答“错误”：电池管理的实现（不仅与监控单元有关，还与充电、放电管理等其它部分有关）。", "5310": "答“错误”：电采样板正常工作时输出电压（不一定是4.5VAC，按设计而定，本题判错误）。", "5311": "答“正确”：电波在传播过程中会产生衰落。", "5312": "答“正确”：第四代海事卫星是国际移动卫星公司的宽带全球区域网络通信系统（BGAN）。", "5313": "答“正确”：低压交流电的标称电压为220/380伏，三相五线，频率50赫兹。", "5314": "答“正确”：等级保护是我国实施信息安全管理的一项法定制度，是我国信息安全保障的基本制度和基本国策。", "5315": "答“错误”：登高架设作业人员必须年满18周岁（不是16周岁）。", "5316": "答“错误”：地线（有转弯半径要求，应平滑转弯），不能任意转弯。", "5317": "答“错误”：地网接地体之间必须可靠连接，通常可采用电焊或气焊连接（螺钉连接或铆接不是可靠连接方式）——本题判错误，按题库答案为准。", "5318": "答“正确”：地区性和国内通信卫星多采用双线极化复用方式。", "5319": "答“错误”：地球站天线系统中的双工器是用来（实现收发共用一副天线时收发信号的隔离），本题判错误。", "5320": "答“正确”：地球站天线跟踪卫星的方法有程序跟踪、自动跟踪、手动跟踪。", "5321": "答“正确”：地球站所处地区无降雨而其传输路径上有降雨会造成卫星信号的衰落。", "5322": "答“正确”：地球站接收分系统的主要要求是噪声温度低、工作频带宽、增益稳定。", "5323": "答“错误”：地球站发信波导尺寸比收信波导尺寸（小，因为发信频率高波长短）。", "5324": "答“正确”：地球站的天线越大半功率角越小。", "5325": "答“正确”：地球静止卫星是指运行周期等于地球自转周期的地球卫星。", "5326": "答“正确”：地气能使通话时产生嗡嗡的干扰声。", "5327": "答“错误”：地面站天线跟踪卫星是取样卫星上（导频/信标信号）为接收机的跟踪信标（不是幅度最高的载频）。", "5328": "答“错误”：地波天线包括鞭状天线、倒L形天线、T形天线、（水平）天线等（三线式天线不属于，本题判错误，按题库答案为准）。", "5329": "答“正确”：地波传播的传播特点是传输损耗小、作用距离远；传播情况稳定、工作频带窄。", "5330": "答“正确”：倒闸操作送电时先合上母线侧刀闸，再合线路侧刀闸，最后合上开关。", "5331": "答“正确”：倒闸操作必须在接到上级调度的命令后执行。", "5332": "答“错误”：导体中的自由电子在电场力的作用下作有规则的定向运动就形成电流（不是电压）。", "5333": "答“正确”：导频信号是一种无调制的直接序列扩频信号。", "5334": "答“正确”：刀开关在合闸时如果接触不良会发热而造成短路。", "5335": "答“正确”：以传输信号的载波频率的不同划分来建立多址接入时称为频分多址方式。", "5336": "答“正确”：当蓄电池的放电率高于10H放电率时电池容量较小（放电率大电流大容量小）。", "5337": "答“错误”：当行波管高功放开始老化时表现出的故障现象为螺旋线电流值变大、输出功率自动变小（本题说反了）。", "5338": "答“正确”：当通信线与电力线接触或电力线落在地面上时必须立即停止一切有关作业活动，保护现场。", "5339": "答“错误”：当水淹高度达到车轮半径时应尽量避免汽车涉水，无法避免时应挂（低档）少加油慢而匀速（通过，不是挂空挡）。", "5340": "答“错误”：当输出电流超过（105%或110%）标称电流值时整流器应能自动（限流/告警），不是超过100%就自动关机保护。", "5341": "答“正确”：当市电中断时蓄电池向逆变器提供直流电源，逆变器将其变成交流电源而保证向负载供电。", "5342": "答“正确”：当设备运行不正常时应首先抢通电路并处理设备故障。", "5343": "答“错误”：当频谱分析仪的扫描宽度为0时，此时由频谱仪测到的是中心频率信号的（时域）波形（不是频域波形）。", "5344": "答“正确”：当某一单体落后电池被同型号新电池替换后，运行过程中该新电池的内阻比旧电池小。", "5345": "答“正确”：当静止卫星转发器波束中心经度与卫星定点经度相同时，与静止卫星转发器定点经度同一经度的（地面站对星方位角为0度等）。", "5346": "答“正确”：当接收天线的极化方向与来波的极化方向完全正交时，接收天线完全接收不到来波的能量。", "5347": "答“错误”：当基站机房设于通信楼底层时，接地汇集线（可以，即）就近从地网引接（本题判错误，按题库答案为准——底层应就近从地网引接，题干说不可，判错误）。", "5348": "答“正确”：当洪水进入施工现场应急救援组开展自救，利用现场防洪、抗洪物资如砂袋、铁锹等物资进行（抢险）。", "5349": "答“正确”：当海事卫星电话显示“READY”表示注册卫星网络成功，现在可以通过外接设备实现不同业务。", "5350": "答“错误”：当负载电阻等于电源内阻时负载获得最大的功率（本题判错误——该表述为最大功率传输定理，正确说法应判正确，但题库判错误，按题库答案为准）。", "5351": "答“正确”：当发现高处有人触电时应采取相应措施，防止切断电源后触电人从高空坠落。", "5352": "答“正确”：当发生雷电时应待在低处。", "5353": "答“错误”：当电力变压器设在基站内时其高压电力线应采用电力电缆从地下进站，电缆长度不宜大于（规定值，本题判错误，按题库答案为准）。", "5354": "答“正确”：当带电体有接地故障时绝缘靴可以作为防护跨步电压的基本安全用具。", "5355": "答“正确”：当柴油发电机出现飞车现象应立即停车。", "5356": "答“正确”：当LTE增加天线就在所有天线中分享功率。", "5357": "答“错误”：单纤双向传输（允许）单根光纤携带全双工通路。", "5358": "答“错误”：单模光纤的色散在（1310nm波长处）接近于零（不是1550nm，1550nm色散较大）。", "5359": "答“正确”：单模光纤代号SM，芯径比多模光纤小，必须用激光器而不能用LED作为光源，传输距离比多模光纤远。", "5360": "答“正确”：单模光纤传输距离通常比多模光纤远。", "5361": "答“错误”：带电作业及在带电设备附近工作（严禁）使用金属梯。", "5362": "答“错误”：大区范围的演练至少（每半年或一年，不是一季度）组织一次（本题判错误，按题库答案为准）。", "5363": "答“正确”：大气吸收损耗存在两个吸收峰值点：第一个峰值点在22.3GHZ频率处，主要由水蒸气（吸收）引起。", "5364": "答“错误”：大气对流层距地面高度不同、分层温度压力等不同，对微波信号会造成（折射）影响（不是反射衰耗）。", "5365": "答“错误”：大气对电磁波传输（有）影响（吸收、散射、折射等）。", "5366": "答“错误”：大气对电磁波传输的影响有大气的吸收作用、雨雾的散射影响、大气引起的折射（大气温度不是，本题判错误，按题库答案为准）。", "5367": "答“正确”：大滑坡前滑坡体上长期位移观测资料中的水平位移和垂直位移会出现加速变化趋势，这是明显（前兆）。", "5368": "答“错误”：大规模天线阵列、超密集组网、网络功能虚拟化、新型多址都是5G（空口/无线）技术创新（本题判错误，按题库答案为准）。", "5369": "答“正确”：打雷时身处空旷地带应关闭手机。", "5370": "答“正确”：搭建帐篷时应选择十分干燥的地面，最好不要有任何草的覆盖。", "5371": "答“正确”：从主站通过卫星向小站方向发射的数据称为出向数据。", "5372": "答“正确”：从主站通过卫星向小站方向的信道为外(出)向信道。", "5373": "答“错误”：从业人员在工作过程中应当服从管理，（有）权对本单位的安全生产工作提出建议。", "5374": "答“正确”：从业人员应当接受安全生产教育和培训，掌握本职工作所需的安全生产知识，提高安全生产技能。", "5375": "答“错误”：从业人员发现直接危及人身安全的紧急情况时（应停止作业或撤离），不是边作业边报告。", "5376": "答“正确”：从小站通过卫星向主站方向发射的信道称为内(入)向信道。", "5377": "答“正确”：从小站通过卫星到主站方向的信道称为入向信道。", "5378": "答“正确”：从狭义来讲NGN是特指以软交换设备为控制核心的网络。", "5379": "答“正确”：从物理层次划分5G承载网被分为前传网、中传网、回传网。", "5380": "答“正确”：从事微波、移动通信基站天馈线安装等工程项目的高处作业人员必须经过专业培训合格并取得（登高作业证）。", "5381": "答“正确”：从事空中作业时安全带应系在牢固的构件上，作业时思想集中，服从统一指挥，文明施工。", "5382": "答“正确”：从事电气工作的人员也必须熟悉和掌握急救技术。", "5383": "答“错误”：从时分多路通信原理可知在复用单元输入端上的各支路数字信号（是同步的，不是不同步）。", "5384": "答“正确”：从地球表面到1000千米高空的区域称为大气层，大气层可分为对流层、平流层和电离层。", "5385": "答“错误”：电场矢量（不是磁场矢量）垂直于地面的电磁波叫垂直极化波。", "5386": "答“错误”：电场矢量垂直于地面的电磁波叫垂直极化波（题干说磁场矢量判错误）。", "5387": "答“正确”：传输速率、光检测器性能、前置放大器噪声特性是决定光接收机灵敏度的主要因素。", "5388": "答“错误”：传输时延（大）是卫星通信的固有特性，传输时延小不是卫星通信的优点。", "5389": "答“正确”：传输时延大是卫星通信的一个固有特性。", "5390": "答“正确”：触电伤员如神志不清应就地仰面平躺，保证气道畅通，坚持就地抢救。", "5391": "答“正确”：触电人员的现场急救是抢救过程中的一个关键。", "5392": "答“正确”：触电后一旦出现假死现象应立即迅速施行人工呼吸。", "5393": "答“错误”：处于赤道平面轨道上的卫星（不一定）都属于静止卫星（只有周期与地球自转同步的才是静止卫星）。", "5394": "答“正确”：处理故障时要遵循“先抢通、后修复”的原则。", "5395": "答“错误”：初入高原者应逐级登高、减小劳动强度、逐步适应高原环境。高原作业遇天气比较冷（不能饮酒御寒，饮酒会加重高原反应）——本题判错误，按题库答案为准。", "5396": "答“错误”：出现熔丝熔断告警后（应先查明熔断原因，排除故障后）再更换新的熔断器。", "5397": "答“正确”：出现交流空开跳闸应排除短路故障后再合上此交流空开。", "5398": "答“正确”：程控交换机程序中故障程序执行级别最高，由随机中断方式启动。", "5399": "答“错误”：城镇道路两侧的架空杆路及拉线所处位置（不得）妨害车辆及行人（做拉线保护套管也不行）。", "5400": "答“正确”：车辆在冰雪路面紧急制动时易产生侧滑，应降低车速，利用发动机制动进行减速。", "5401": "答“正确”：车辆联合电源系统与小型发电机组相比成本较高。", "5402": "答“正确”：车辆联合电源系统是一种由车辆发动机带动的电力供应系统，可以提供持续、稳定交直流电输出。", "5403": "答“正确”：车辆联合电源系统使用便捷维护简单。", "5404": "答“错误”：车辆联合电源系统的工作时间相对（较短，受车辆燃油和发动机限制，不是较长）。", "5405": "答“正确”：超级基站站点一般采用地面光缆和卫星链路双备份。", "5406": "答“错误”：超级基站在配置时采用（多套硬件、多逻辑基站）配置（不是一套硬件单逻辑基站）。", "5407": "答“正确”：常开直流接触器在线包有正常电压时触点吸合。", "5408": "答“正确”：尝试某种具有潜在食物价值的新植物时应遵循一人一次只能尝试一种的原则。", "5409": "答“错误”：柴油机在工作时冷却水温度（应保持正常范围，不是尽可能低）。", "5410": "答“正确”：柴油机喷油泵如果不喷油可能是油箱内无燃油或喷油泵故障。", "5411": "答“正确”：柴油机点火靠压燃，汽油机点火靠点燃。", "5412": "答“正确”：柴油机的预热负荷与转速的提高均应逐渐上升，尽量避免突加或突卸负荷。", "5413": "答“正确”：柴油机的启动做功运行靠压燃，汽油机的做功靠点燃。", "5414": "答“错误”：柴油发电机组正常关机应先切断负荷，后停机（不是先停机后切负荷）。", "5415": "答“错误”：柴油发电机在市电恢复供电或带载供电完成后应切断负载，（空载运行几分钟后）再停车（不是立即停车）。", "5416": "答“正确”：柴油发电机一般由于零线与变压器零线相连，所以不需要将油机的零线再做一次接地。", "5417": "答“错误”：柴油发电机温度异常包括冷却水温度过高和机油温度过高（不只与冷却水有关）。", "5418": "答“正确”：柴油发电机温度异常指机油温度或冷却水温度过高、轴承过热等。", "5419": "答“正确”：柴油发电机使用柴油作动力，驱动发电机提供电能。", "5420": "答“正确”：柴油发电机排气冒蓝烟表示有机油窜入燃烧室参以燃烧。", "5421": "答“正确”：柴油发电机排气冒黑烟表示燃烧不完善。", "5422": "答“错误”：柴油发电机空气滤清器滤芯（不能用水冲洗后继续使用，应更换或吹扫）。", "5423": "答“正确”：柴油发电机加注的燃油需经过过滤及沉淀。", "5424": "答“正确”：柴油发电机点火靠压燃，汽油发电机靠点燃。", "5425": "答“正确”：柴油发电机车具有使用方便、适应能力强、灵活机动的特点。", "5426": "答“正确”：柴油发电机白烟表示柴油雾滴在燃烧室未燃烧。", "5427": "答“正确”：插拔光板不应该带纤插拔。", "5428": "答“正确”：层二针对不同的层三数据进行区分标示，并提供不同的服务。", "5429": "答“错误”：测量绝缘时不仅要确定被测设备各方面都断开，还（需放电并确认无电）后方可测量（本题判错误，按题库答案为准）。", "5430": "答“错误”：测量电路中的任一电阻时不能用万用表两极直接接触电阻两端读取数值（必须断开电路单独测量，否则并联电路影响读数）。", "5431": "答“正确”：参与人员：高峰时段活动地点聚集人员超过1万或单日参加人员累计达到3万人次可认为是重大活动。", "5432": "答“正确”：参加高处作业人员应按规定戴好安全帽并系紧帽绳，系好安全带。", "5433": "答“正确”：采用机械(电缆敷设机)敷设光(电)缆必须事先清除光(电)缆路由上的障碍物，主机和缆（盘就位稳固）。", "5434": "答“正确”：采用分散供电方式时交流供电系统仍采用集中供电方式。", "5435": "答“正确”：采用便携油机或外接电源供电时应先测试电压稳定性再行接入。", "5436": "答“正确”：部分普通智能手机也可以支持北斗短报文功能。", "5437": "答“错误”：布林结（用于绳端结圈），连接两条不一样粗细的绳索（应用其它绳结，本题判错误）。", "5438": "答“错误”：布放视音频传输线缆不能和电源线共槽路（会产生干扰）。", "5439": "答“正确”：布放光纤时拐弯处不应过紧或相互缠绕，成对光纤要理顺绑扎且绑扎力度适宜。", "5440": "答“正确”：不要佩戴金银首饰，防止首饰在抢修过程中掉入设备内部造成设备短路。", "5441": "答“正确”：不同预案要求发生冲突按照外地服从属地的原则进行处置。", "5442": "答“错误”：不同容量、不同批次的蓄电池（不能）一起充电。", "5443": "答“正确”：不同方式的卫星通信网不能互通，但可以使用同一颗通信卫星甚至共用一个转发器。", "5444": "答“正确”：不同方式的通信网一般不能互通但可以使用同一颗通信卫星甚至共用一个转发器。", "5445": "答“正确”：不同方式的通信网不能互通，但可以使用同一颗通信卫星甚至共用一个转发器。", "5446": "答“正确”：不熟悉的路况不了解积水深度，不要轻易让汽车涉水，涉水行驶时要将所有的车窗打开。", "5447": "答“正确”：不是所有Ka便携站都能工作在二层模式。", "5448": "答“错误”：不可预知事件包括自然灾害，包括台风、洪水、地震、干旱、雨雪冰冻、森林草原火灾等（上级下达的应急保障任务是可预知任务，不是不可预知事件）。", "5449": "答“错误”：不间断电源设备(UPS)对通信设备及其附属设备提供不间断交流电源（不是直流电源，直流是UPS内部）。", "5450": "答“错误”：波长越长波瓣越宽（对）；口径越大波瓣越（窄，不是越宽）。", "5451": "答“正确”：波长与频率成反比。", "5452": "答“正确”：波导是一种传输损耗很小的传输线，传输信号频率越高波导尺寸越小。", "5453": "答“正确”：冰川、雪地作业作业人员应成对联结，彼此间距应不小于15米。", "5454": "答“错误”：便携式发电机在运转供电时油料不足时（不能）及时添加（必须停机后加油）。", "5455": "答“正确”：变压器两侧开关的操作顺序：停电时先拉开负荷开关后拉开电源侧开关，送电时（顺序相反）。", "5456": "答“正确”：变电所内电气设备的保护接地主要是用来保护人身安全的。", "5457": "答“正确”：边缘计算将计算能力下沉到网络边缘靠近用户，以减小网络压力、服务时延，提高用户体验。", "5458": "答“正确”：避免在树林中设站，如要设站应保持天线高于树顶。", "5459": "答“正确”：避雷针引下线部分是整个塔体接地的关键部分，保护塔体及设备防止直击雷和二次感应雷破坏。", "5460": "答“错误”：避雷针的接地引线（不能）与天馈线的接地引线相连（应分开引接）。", "5461": "答“正确”：避雷针的保护区域为避雷针的顶点下倾45度范围内。", "5462": "答“正确”：避雷引下线和通信机房接地引下线距离应超过5m。", "5463": "答“正确”：闭环空间复用适用于SINR高且UE移动速率低。", "5464": "答“正确”：必要时设立现场通信保障应急指挥机构，具体负责事发现场通信保障的组织、协调工作。", "5465": "答“错误”：不必须使用静止卫星才能实现卫星通信（低轨、中轨卫星也可实现）。", "5466": "答“正确”：本地网路由的选择顺序为直达路由、迂回路由、最终路由。", "5467": "答“正确”：被洪水围困在建筑物上当发生饥饿口渴时要挑选水性好、身体健康的青壮年返回住所取回（食物饮水）。", "5468": "答“正确”：北斗一号卫星定位系统BD在ITU登记的无线电频段为发射L波段和接收S波段。", "5469": "答“正确”：北斗系统服务向亚太地区提供（定位、导航、授时、短报文）等四种区域服务。", "5470": "答“错误”：北斗系统服务向全球用户提供（定位、导航、授时）等三种全球服务——本题判错误，按题库答案为准（应为导航定位、授时、短报文等）。", "5471": "答“正确”：北斗卫星导航系统支持全球组网。", "5472": "答“正确”：暴雨中行车能见度下降地面湿滑，应打开汽车小灯。", "5473": "答“错误”：暴雨时应尽量（在马路中间行走）避免两侧（下水道井盖等危险），本题判错误——应远离马路两侧（防积水暗流），按题库答案为准。", "5474": "答“正确”：保证交换设备正常工作的直流电压一般为-48V。", "5475": "答“正确”：保护接地是为了防止电气设备金属外壳意外带电造成触电事故。", "5476": "答“正确”：保护接地的主要作用是防止人体触及绝缘损坏的电机外壳时遭受触电的危害。", "5477": "答“错误”：把骨折伤员抬上担架时要由（3名及以上）救生人员把手托放在伤员身下一起将伤员抬上担架（不是2名）。", "5478": "答“正确”：按照系统安全工程的观点，安全是指系统中人员免遭不可承受风险的伤害。", "5479": "答“错误”：按照事故应急预案编制的整体协调性和层次不同，可将其划分为（综合预案、专项预案和现场处置方案）几个层次（本题判错误，按题库答案为准）。", "5480": "答“正确”：按照工作方式柴油机可分为四冲程和两冲程两种类型。", "5481": "答“错误”：按信令的工作区域划分可分为（局内信令和局间信令，不是随路信令和公共信道信令——那是按传送方式划分）。", "5482": "答“正确”：按时检查血液循环是否通畅，手指或指尖变青及苍白是危险的警告。", "5483": "答“正确”：按轨道平面与赤道平面的夹角不同可分为赤道轨道卫星、极轨道卫星和倾斜轨道卫星。", "5484": "答“错误”：安装微波、移动通信天线应在铁塔避雷针的（45°，不是30°）保护范围内。", "5485": "答“正确”：安装了漏电保护装置的设备仍需作接地或接零保护。", "5486": "答“错误”：安装了触电保护器(漏电保安器)人（也不一定）不会触电（漏电保护器有局限）。", "5487": "答“正确”：安全用电对于人身安全而言最要紧的是防止触电事故的发生。", "5488": "答“错误”：安全生产责任制是企业最基本的一项安全制度，是（企业安全生产管理制度的组成部分——题干本身正确，但题库判错误，按题库答案为准）。", "5489": "答“正确”：安全第一是说明人与物、安全工作与生产任务的关系；预防为主是说明安全工作中防与救（的关系）。", "5490": "答“正确”：X2口切换只能发生在同一个MME下（按题库答案判正确）。", "5491": "答“正确”：WLAN中AP一直是工作在半双工的状态。", "5492": "答“错误”：VSAT（主站/中心站）称为中心站或枢纽站，VSAT小站（远端站）包括天馈线设备、发射设备、接收设备和信道终端设备（题干把小站与中心站混淆判错误）。", "5493": "答“正确”：VSAT小站既可以通电话还可以收发传真。", "5494": "答“错误”：VSAT小站发射功率（不能随意增大，受限制），不是发射功率越大工作质量越好。", "5495": "答“正确”：VSAT小站的主要特征是天线孔径小、设备结构紧凑、全固态化、功耗小、成本低。", "5496": "答“正确”：VSAT小站的天线可以根据用户需求安装在地面、墙上或屋顶上。", "5497": "答“错误”：VSAT小站（需）主控站（进行网络管理），不能（随意）互拨（需经主站）。", "5498": "答“正确”：VSAT系统中从传播条件看C波段受雨衰影响小，可靠性高。", "5499": "答“正确”：VSAT系统一般工作在Ku波段或C波段。", "5500": "答“错误”：VSAT卫星通信系统中联接室内和室外设备的电缆称为（IFL中频电缆，不是RFL电缆）。", "5501": "答“错误”：VSAT卫星通信系统（可以）进行双向的数据、语音、视频、传真等信息的传输（不是只单向）。", "5502": "答“错误”：VSAT卫星通信系统（支持点对多点、广播等），不仅支持点对点通信。", "5503": "答“正确”：VSAT卫星通信系统工作在Ku频段或C频段上。", "5504": "答“正确”：VSAT网可以工作在KU波段。", "5505": "答“正确”：VSAT通信频段有C、Ku波段。", "5506": "答“正确”：VSAT天线分为正馈和偏馈两种形式。", "5507": "答“正确”：VSAT室外单元是一个小型/防风雨的集成化射频单元，包括一个高功放、一个低噪放、上下（变频器）。", "5508": "答“正确”：VSAT是指天线小于2.4米、G/T值低于19.7db/K的卫星小站系统。", "5509": "答“错误”：VSAT开关电源（不可以）对视频会议系统供电（VSAT电源为设备自身供电，本题判错误，按题库答案为准）。", "5510": "答“正确”：VPN隧道协议有PPTP、L2TP、Ipsec、GRE。", "5511": "答“错误”：VOLTE寻呼周期改小会使终端待机时间（减少，不是增加，寻呼周期小监听频繁耗电）。", "5512": "答“正确”：VoIP系统拟定电话号码由8位数字组成，分别由3位(省份号码)+1位(站点类型码)+（4位站号）。", "5513": "答“正确”：UPS又称不间断电源，主要为使用交流电源而又不能停电的设备持续供电。", "5514": "答“正确”：UPS可以将输入电压、频率变换成需要的电压、频率。", "5515": "答“正确”：UPS可以并联使用。", "5516": "答“错误”：UPS（的逆变器）将直流电变换成交流电（题干只说UPS将直流变交流，未指明逆变环节，题库判错误，按题库答案为准）。", "5517": "答“正确”：UPS电源对应的工作状态有逆变工作、电池工作、旁路工作。", "5518": "答“错误”：UPS电源包括（整流器、逆变器、蓄电池、静态开关等，不是只有三部分）。", "5519": "答“正确”：UPS的主要作用是稳压、稳频、净化和不间断。", "5520": "答“错误”：UPS的电池（不能）使用不同品牌、不同容量、不同新旧的电池（必须同品牌同容量同批次）。", "5521": "答“正确”：UPS常用的电池类型有胶体电池、阀控铅酸蓄电池。", "5522": "答“正确”：UPS不仅仅是一个备用电源，它还具备电力净化的功能。", "5523": "答“正确”：SDH传输业务信号时各种业务信号要进入SDH的帧都要经过映射、定位和复用三个步骤。", "5524": "答“正确”：SCPC的含义是单路单载波。", "5525": "答“错误”：QoS中的arp参数优先级的取值范围（1~15，但15不是最高优先级——ARP中优先级值越大优先级越低，1为最高）。", "5526": "答“正确”：QCI1的时延和丢包要求分别是100ms和10(-2)。", "5527": "答“正确”：PON、OLT、ONU分别是无源光网络、光线路终端、光网络单元的简称。", "5528": "答“正确”：PHICH信道承载HARQ的ACK/NACK。", "5529": "答“正确”：PHICH符号个数是由PBCH获得。", "5530": "答“正确”：PDSCH、PMCH可支持BPSK、QPSK、16QAM和64QAM四种调制方式。", "5531": "答“错误”：PCFICH将PDCCH占用的OFDM符号数目通知给UE，且在每个（子帧，不是时隙）中都有发射。", "5532": "答“错误”：OTDR仪表给出的最大距离刻度（受动态范围和脉宽限制），不一定是可测光纤的最大距离。", "5533": "答“正确”：OTDR使用瑞利散射和菲涅尔反射来表征光纤的特性。", "5534": "答“错误”：OTDR的测试结果（可以）拷贝留存。", "5535": "答“正确”：OTDR测试脉宽(单模)10、30、80、160、320、640、1280、5120（ns等可选）。", "5536": "答“正确”：OTDR测试结果上出现的台阶表示该处存在损耗点。", "5537": "答“错误”：OTDR测量时（需根据光纤类型选择1310nm或1550nm等波长），只用1310nm波长测试（不准确）。", "5538": "答“错误”：OSI的七层模型从高到低为应用层、表示层、会话层、传输层、网络层、链路层、物理层（题干顺序错误）。", "5539": "答“正确”：OLT的作用是为接入网提供与本地交换机之间的接口，并通过光传输与用户端的光网络单元通信。", "5540": "答“正确”：OFDM可以在不同的频带采用不同的调制编码方式，更好地适应频率选择性衰落。", "5541": "答“正确”：OFDM符号中的CP可以克服符号间干扰。", "5542": "答“正确”：ODF架终端方式的优点主要是调纤十分方便，并可使机房布局更加合理。", "5543": "答“正确”：NSA组网下5G不能独立建网，必须依赖LTE网络。", "5544": "答“正确”：NGN网络是业务驱动型的网络。", "5545": "答“正确”：NEC IPASOLINK微波使用极化方式有垂直和水平。", "5546": "答“正确”：MEC主要场景是应用本地化、内容区域化、计算边缘化。", "5547": "答“正确”：MEC全称是Multi-access Edge Computing，即多接入边缘计算。", "5548": "答“正确”：L波段的大气衰耗相对最小。", "5549": "答“错误”：LTE下行（不仅有CRS，还有DMRS、CSI-RS等），不止CRS。", "5550": "答“正确”：LTE下行既可以有UE-specific reference signal，也可以有（公共参考信号）。", "5551": "答“错误”：LTE下行MIMO（有空间复用、发射分集、波束赋形等模式），不只空间复用模式。", "5552": "答“正确”：LTE系统中关于MIMO下行可以支持的天线端口数目为1、2、4。", "5553": "答“正确”：LTE系统中关于MIMO下行可以单天线发送，也可以多天线发送。", "5554": "答“错误”：LTE系统中（没有）采用软切换技术（LTE为硬切换）。", "5555": "答“错误”：LTE下行采用OFDMA，上行采用SC-FDMA（不是上下行均OFDMA）。", "5556": "答“错误”：LTE常见的掉话原因有切换失败、外部干扰、小区覆盖差、（弱覆盖）等——本题判错误，按题库答案为准。", "5557": "答“正确”：LNB的中文含义为低噪声放大器及下变频器。", "5558": "答“错误”：KU波段LNB本振频率为（9750MHz或10750MHz等，不是5150MHz）。", "5559": "答“错误”：Ka卫星一体机scorpio小站（不支持二层模式，本题判错误，按题库答案为准）。", "5560": "答“错误”：Ka卫星小站在Router模式下子网掩码的大小与可用IP数量（有关，掩码越小可用IP越多）。", "5561": "答“正确”：Ka卫星四端口黑猫Capricorn-4有SCPC工作模式。", "5562": "答“正确”：KA高通量卫星可以实现较窄的波束，从而获得更高的EIRP值，减小地面终端天线尺寸。", "5563": "答“正确”：IDR通信系统中一个2MB/s载波在卫星上占用带宽是2.0025MHZ。", "5564": "答“错误”：G/T值越高就意味着该卫星站（接收）能力越强（不是发射能力）。", "5565": "答“正确”：G/T是接收天线增益与噪声温度的比值。", "5566": "答“正确”：E-UTRAN用E-NodeB替代原有的RNC-NodeB结构。", "5567": "答“错误”：EPON/GPON采用单纤双向连接时，一端使用Tx1310/Rx1490nm光模块，另一端使用Tx1490/Rx1310nm光模块（本题判错误，按题库答案为准）。", "5568": "答“错误”：E-NodeB间的接口为X2接口（S1是eNB与核心网之间的接口）。", "5569": "答“正确”：E1类型的接口不能接入以太网信号。", "5570": "答“正确”：DWDM能够在同一根光纤中把不同的波长同时进行组合和传输。", "5571": "答“正确”：DVB-S中使用的差错控制方式是FEC。", "5572": "答“正确”：CDMA小型基站车可以利用卫星链路、通过中国电信上海地球卫星站接入大网。", "5573": "答“正确”：CDM600调制解调器中接收缓冲器的时钟一般采用卫星时钟。", "5574": "答“错误”：A接口是（BSS和MSC之间）的接口（不是MS和BSS之间，MS与BSS之间是Um接口）。", "5575": "答“正确”：5G无线网络CU/DU分离架构中一个CU可以连接多个DU。", "5576": "答“正确”：5G可以使用SUL或SDL配置。", "5577": "答“正确”：5G定制网不仅是通信网，更是一种融合网络、云计算、边缘计算、应用平台全面定制的综合解决方案。", "5578": "答“错误”：5G初期业务以（eMBB增强移动宽带+视频业务）为主要特征（不是mMTC）。", "5579": "答“正确”：4G基站叫eNB，5G的基站标准叫gNB。", "5580": "答“正确”：4G高清语音与其他没有开通4G高清语音的客户可以直接通话。", "5581": "答“错误”：24小时降雨强度达到110毫米时其降雨等级（特大暴雨，不是暴雨）——按国家标准24h≥100mm为暴雨，110mm仍属暴雨范围，但题库判错误，按题库答案为准。", "5582": "答“错误”：220V交流电压的最大值为（311V，不是350V）。", "5583": "答“正确”：2019年北京世博会属于一类重大活动。", "5584": "答“错误”：100G波分系统传输距离受限制的主要因素包括衰耗值、发送功率、OSNR、非线性（等，本题判错误，按题库答案为准——损耗可由放大补偿，限制距离的主因是OSNR和非线性）。", "5585": "答“错误”：《中华人民共和国突发事件应对法》颁布的时间是（2007年，不是2008年）。", "5586": "答“错误”：《生产安全事故报告和调查处理条例》规定，（军队）事故不适用于本条例（本题判错误，按题库答案为准）。", "5587": "答“正确”：《国家突发公共事件总体应急预案》将突发公共事件分为自然灾害、事故灾难、公共卫生事件和社会安全事件四类。", "5588": "答“正确”：《国家通信保障应急预案》预警分级按影响范围将通信预警划分为特别严重(Ⅰ级)、严重（Ⅱ级）等。", "5589": "答“错误”：“（客户）”是客户生存和发展的根基（题干用词错误，正确应为客户是企业生存发展的根基，本题判错误）。", "5590": "答“错误”：光缆接头盒中容纤盘最终余留光纤长度为（0.6m，不是0.8m）。", "5591": "答“正确”：驻波比是行波系数的倒数，驻波比为1表示完全匹配，驻波比为无穷大表示全反射、完全失配。", "5592": "答“错误”：应急通信方面使用的柴油发电机组的功率（有大有小），不是都比较大。", "5593": "答“正确”：严禁采用架空交、直流电力线进出通信局(站)是因为防雷的需要。", "5594": "答“正确”：危害通信电源的雷击大部分是雷电侵入波或感应雷，若通信电源遭直击雷或球雷，安装在附近的（设备将受损）。", "5595": "答“正确”：检查表笔的安装，红笔装‘+’字孔，黑笔装‘-’字孔。", "5596": "答“错误”：电流在单位时间内所作的功叫电功率，用符号“P”表示（不是W，W是电功单位焦耳或瓦特的符号）。", "5597": "答“正确”：常用交流供电系统分为TN-C系统(三相四线制)和TN-S(三相五线制)系统等。", "5598": "答“正确”：变压器高、低压侧均应各装一组氧化锌避雷器，氧化锌避雷器应尽量靠近变压器装设，变压器低压（侧也应装设）。", "5599": "答“正确”：SDWAN的中文全称是软件定义广域网。", "5600": "答“正确”：Ka卫星小站二层模式下没有IP分配功能。", "528": "B 正确：应急通信真正及时、准确、畅通地传递抢险救灾信息，才能帮助决策者正确指挥。A/C/D 错误：灾害现场/事故信息/指挥调度不符。", "529": "D 正确：应急通信战时为党政军机关通信提供有效补充（平时通信为主、应急为补充）。A/B/C 错误：支撑/独立/依赖不符。", "530": "C 正确：应急通信系统主要为党政军领导机关提供临时指挥调度通信保障。A/B 错误：企事业单位/新闻媒体不符。", "531": "A 正确：应急通信系统在维持网络安全稳定运营方面具有不可替代的作用。B/C/D 错误：可靠/长期/有效不符。", "532": "D 正确：应急通信在抢险救灾、处置突发事件中具有不可替代作用。A/B/C 错误：次要/主要/重要不符。", "533": "A 正确：应急通信系统可与专用网、公众网相连灵活组网。B/C/D 错误：互联网/传输网/卫星网不符。", "534": "C 正确：应急通信系统通常具有指挥调度功能。A/B/D 错误：语音/数据/图像通信是通信业务而非系统特有功能。", "535": "A 正确：应急通信系统维护管理原则是集中统一领导和分级管理。B/C/D 错误：分散领导/分散管理/各省独立不符。", "536": "B 正确：应急通信为公用通信网络正常运行提供有效的补充和保障服务。A/C/D 错误：便捷/全面/及时不符。", "537": "C 正确：应急通信与公用通信相比具有暂时性（应急临时组网）。A/B/D 错误：安全性/机动性/可靠性不符。", "538": "D 正确：应急通信所用柴油发电机组多采用后备式的发电机组。A/B/C 错误：主用式/热备用/1+1备用不符。", "539": "A 正确：应急通信任务分为平时服务、急时应急、战时应战。B/C 错误：战之必胜/招之即来不符。", "540": "B 正确：应急通信是政府与社会各界开展应急管理工作的前提和基础。A/C/D 错误：通信/风险/安全管理不符。", "541": "B 正确：应急通信是一种特殊的通信机制（保障机制）。A/C/D 错误：网络/设备/技术不符。", "542": "A 正确：应急通信是政府行使社会管理和公共服务责任的需求。B/C/D 错误：领导/国家/人民不符。", "543": "D 正确：应急通信设备至少每一年检修保养一次，便携油机每半年检修保养一次。A/B/C 错误：组合不符。", "544": "C 正确：应急通信日常工作还包括完善应急通信预案、体制、机制、法制（全组合）。A/B 错误：缺少要素。", "545": "A 正确：应急通信日常工作包括完善应急通信预案、体制、机制、法制。B/C 错误：防灾预案/工作目标不符。", "546": "B 正确：应急通信是国家公共安全应急体系重要组成部分，是开展防灾减灾工作的重要保障手段。A/C 错误：应急通信/应急救援不符。", "547": "B 正确：应急通信方针是平时服务、急时应急、战时应战。A/C 错误：重点保障/抢险救灾不符。", "548": "B 正确：应急通信从性质上可分为应急服务和应急保障。A/C/D 错误：抢险救灾/技术保障/电力保障不符。", "549": "C 正确：应急通信车载自适应电台天线基座和地线应与车体可靠导通（防静电/雷击）。A/B/D 错误：大地/信号线/射频电缆不符。", "550": "C 正确：应急通信柴油发电机组以车载为主（机动性强）。A/B/D 错误：便携/固定/联合式不符。", "551": "A 正确：应急通信保障I级响应由领导小组负责组织实施。B/C 错误：II级/IV级不符。", "552": "B 正确：应急抢险现场监测配置应急物资明细为望远镜、应急广播喇叭、卫星电话等。A/C/D 错误：手电筒/应急通信车/警戒带不符。", "553": "C 正确：应急救援队伍全体指战员要做到对党忠诚、纪律严明、赴汤蹈火、竭诚为民（训词）。A/B/D 错误：表述不符。", "554": "C 正确：应急光缆及其接插件性能测试每年至少进行1次。A/B 错误：3/2不符。", "555": "C 正确：应急管理部建立信息化能力评价指标体系和检查通报制度，对全系统单位信息化建设进行评估、督导、专项治理。A/B/D 错误：专项整顿/检查不符。", "556": "B 正确：应急管理部按国家网络安全等级保护2.0要求制定全国统一信息网络安全防护策略。A/C/D 错误：1.0/2.1/2.2不符。", "557": "C 正确：应急处置与救援坚持先避险、后抢险；先救人、再救物（“救物”之前先“救人”）原则。A/B/D 错误：原则组合不符。", "558": "D 正确：应急车停放宜选地面坡度约3°～5°、路面平整坚实处。A/B/C 错误：坡度范围不符。", "559": "A 正确：应每月对油机启动电瓶添加蒸馏水并进行充电。B/C/D 错误：季度/半年/每年不符。", "560": "A 正确：引起光纤损耗的散射主要有瑞利散射。B/C/D 错误：拉曼/布里渊/非线性散射不符。", "561": "A 正确：引发传染病的途径主要细菌（病原体经各种途径传播）。B/C/D 错误：病毒/立克次体/水不符。", "562": "B 正确：阴影衰落又称慢衰落（大尺度衰落）。A/C/D 错误：快/急/缓衰落不符。", "563": "A 正确：阴影衰落方差在城市大于郊区（建筑密集起伏大）。B/C/D 错误：等于/小于/不确定不符。", "564": "B 正确：事故导致严重外部出血应采用布料直接包裹制止出血（压迫止血）。A/C 错误：清洗/药棉吸附不符。", "565": "A 正确：以主基准时钟频率控制从时钟信号频率的方式称主从同步。B/C/D 错误：互同步/准同步/混合同步不符。", "566": "D 正确：“1850 TSS无法通过...”说法错误（1850 TSS支持相关能力），本题选错误说法。A/B/C 正确：其他说法均正确。", "567": "A 正确：IP组网方式可为系统内不同监控设备动态分配传输带宽。B/C/D 错误：2M抽时隙/辅助通道/短消息不符。", "568": "A 正确：雷雨天气要注意关好门窗（防球形雷/侧击雷入室）。B/C/D 错误：户外使用/预防暴雨及/用电热毯均危险。", "569": "B 正确：G.723.1理论编码码率最低（5.3/6.3kbps）。A/C/D 错误：G.711（64k）/G.728（16k）/G.729（8k）不符。", "570": "A 正确：亚太6D用户段为Ku频段，馈电段为Ka频段。B/C/D 错误：频段组合不符。", "571": "C 正确：“1850 TSS 无法通过...”说法错误（1850 TSS具备相关能力），本题选错误说法。A/B/D 正确：其他说法正确。", "572": "C 正确：能测量光功率的仪表是光功率计。A/B/D 错误：以太网测试仪/红光笔/光源不符。", "573": "A 正确：需要保障速率最大的是在线视频（高清视频流）。B/C/D 错误：即时聊天/VOLTE/浏览网页速率低。", "574": "A 正确：位置区域码是TAC（跟踪区码Tracking Area Code）。B/C/D 错误：PCI/LAC/CELL ID不符（LAC是2G位置区）。", "575": "B 正确：蓄电池长时间搁置后不能马上并机使用（需先补充充电活化）。A/C 错误：均充状态/容量预估不符。", "576": "B 正确：茶余饭后与家人聊起应急通信机密信息违反保密规定（泄密）。A/C/D 正确：加盖机密电报不带出/不监测用户/不公开用户数据均合规。", "577": "D 正确：SN添加流程中不会出现SgNB change complete信令（变更完成信令属SN修改流程）。A/B/C 错误：SgNB Addition/RRC connection/Random Access均出现在添加流程。", "578": "C 正确：IPX不属于TCP/IP协议（是Novell网络协议）。A/B/D 错误：FTP/ARP/TELNET均为TCP/IP协议。", "579": "A 正确：天馈线系统回波损耗15dB是合格的（回波损耗越大越好，≥14dB合格）。B/C/D 错误：10/7.7/4.3dB过小不符。", "580": "B 正确：集团LTE建设规范要求每个基站上的每个业务分配一个VLAN（业务隔离）。A/C/D 错误：不带VLAN/每基站一个/多基站同VLAN不符。", "581": "B 正确：单模光可在多模光纤中传输，但损耗较大且距离受限（多模纤芯粗吸收多）。A/C/D 错误：损耗小或不能传输不符。", "582": "A 正确：业务在切换源侧是AM模式则反传成功所需条件表述正确。B/C/D 错误：速率接纳/反传失败/反传路径不符。", "583": "C 正确：“小区下行峰值吞吐量反映该小区覆盖质量”说法错误（峰值吞吐量反映容量能力非覆盖），本题选错误项。A/B/D 正确：控制面时延/用户面时延/Attach时间描述均正确。", "584": "D 正确：162.111.111.1是正确主机IP（非组播/回环/网络地址）。A 错误：224开头是组播地址。B 错误：127是回环地址。C 错误：202.112.5.0末位0是网络地址。", "585": "B 正确：长距离低速物联网国际标准是NB-IoT（3GPP标准）。A/C/D 错误：Zigbee/LoRa/Sigfox为短距或私有/联盟标准。", "586": "B 正确：联合接地的优点是地电位均衡（各设备等电位防反击）。A/C 错误：防搭壳触电/供电损耗不符。", "587": "C 正确：后门攻击是特洛伊木马（植入后门程序）。A/B/D 错误：暴力/字典/拒绝服务攻击非后门攻击。", "588": "D 正确：Frame-relay（帧中继）属于分组交换。A/B/C 错误：PSTN/SDH/有线电视网为电路交换。", "589": "D 正确：NR业务信道是DTCH（专用业务信道）。A/B/C 错误：PCH/RACH/BCCH为控制/公共信道。", "590": "C 正确：影响光接收机灵敏度的主要因素是光接收机的噪声（噪声越大灵敏度越低）。A/B/D 错误：输入电压/光强/波长不符。", "591": "D 正确：椰子树及果实的功能有驱逐蚊虫（椰壳烧烟）、做绳子（椰纤维）、制作肥皂（椰油），以上均可。A/B/C 错误：仅一项不完整。", "592": "C 正确：共轴双旋翼直升机的优点是纵向尺寸小（两旋翼同轴取消尾桨）。A/B 错误：操作结构/自转下滑不符。", "593": "C 正确：鲜鸡蛋不适宜做储备食品（易变质，保质期短）。A/B/D 错误：蜂蜜/燕麦/小麦耐储存。", "594": "C 正确：支持EDMAC-EDMAC-2、AUPC功能的设备是CDM625。A/B/D 错误：CDM570/550/600不符。", "595": "C 正确：红外感应器不会对24GHz无线AP产生干扰（红外与微波频段无关）。A/B/D 错误：微波炉/蓝牙耳机/无绳电话均工作在2.4GHz附近。", "596": "A 正确：干线放大器是有源设备（需供电放大）。B/C/D 错误：合路器/板状天线/负载为无源设备。", "597": "B 正确：DDF架（数字配线架）不能进行光缆成端（是电接口配线）。A/C/D 错误：ODF/光交/综合架均可成端光缆。", "598": "A 正确：物流车辆编队属于行业领域类场景（垂直行业应用）。B/C/D 错误：灾害保障/VR娱乐/移动办公属其他类。", "599": "C 正确：风量四级天气可以登高作业（4级风以下可作业，5级及以上停止）。A/B/D 错误：大雪迷雾/生病/雷雨均禁止。", "600": "B 正确：Ku波段频率范围是12GHz-15GHz。A/C/D 错误：4-6GHz（C）/1-3GHz（L）/15-18GHz（Ku高段）不符。", "601": "D 正确：普瑞斯克结不属于鱼钩结。A/B/C 错误：特尔结/混杂结/詹姆结均为鱼钩结。", "602": "B 正确：SA（独立组网）特征为基站为5G基站，核心网为5G核心网（端到端5G）。A/C/D 错误：共用4G核心网/5G基站用4G核心网均属NSA。", "603": "B 正确：冰雹、暴雪、暴雨、台风均属于会发送预警短信的气象预警类别。A/C/D 错误：雷电高温大风寒潮等组合不符（部分不含预警短信类别）。", "604": "A 正确：Option2属于SA组网方式（5G NR+5GC独立）。B/C/D 错误：Option3/4/4A均为NSA。", "605": "D 正确：远程驾驶属于uRLLC场景应用（超高可靠低时延）。A/B/C 错误：物流跟踪（mMTC）/车载多媒体（eMBB）/3D全息（eMBB）不符。", "606": "A 正确：车联网属于uRLLC业务。B/C/D 错误：抄表（mMTC）/高速上网/高清视频（eMBB）不符。", "607": "B 正确：抗组胺剂可治疗过敏反应、蚊虫叮咬和毒虫蛰刺（抗过敏药）。A/C/D 错误：止痛药/肠内镇静剂/高锰酸钾不符。", "608": "A 正确：PTRS（相位跟踪参考信号）是仅用于高频的信号（补偿相位噪声）。B/C/D 错误：SRS/DMRS/CSI-RS非高频专属。", "609": "D 正确：吸顶天线增益最小（室内覆盖小增益天线）。A/B/C 错误：定向/全向/八木天线增益均更大。", "610": "D 正确：智能天线抗干扰能力最好（自适应波束成形）。A/B/C 错误：定向/全向/八木天线抗干扰较弱。", "611": "D 正确：不同频率之间切换肯定发生硬切换（异频必须硬切换）。A/B/C 错误：同频软切换场景不符。", "612": "A 正确：链路聚合（Link-aggregation）能提高网络可靠性（多链路冗余备份）。B/C/D 错误：RSTP/STP/VLAN非提高可靠性的技术。", "613": "C 正确：SCMA（稀疏码多址）是5G新提出的多址接入技术。A/B/D 错误：FDMA/CDMA/TDMA为旧有多址技术。", "614": "B 正确：镍镉电池在没有充分放电前提下不能以大电流充电（记忆效应）。A/C 错误：铅酸/锂聚合物电池不符。", "615": "C 正确：8000mAh、20C电池放电电流最大（8000×20=160A）。A/B 错误：2000×30=60A、20000×5=100A均小于160A。", "616": "D 正确：广覆盖场景无法使用毫米波（毫米波衰耗大覆盖近）。A/B/C 错误：容量提升/自回传/家庭宽带接入均可使用。", "617": "B 正确：广覆盖场景无法使用毫米波。A/C/D 错误：自回传/容量提升/家庭宽带接入均可。", "618": "C 正确：保持视距范围内对尾飞行是正确操作方法（安全规范）。A/B/D 错误：云台朝向自己启动/未记录返航点/车顶起飞均危险。", "619": "D 正确：目测跟踪不属于地球站天线跟踪卫星方法。A/B/C 错误：手动/自动/程序跟踪均为跟踪方法。", "620": "C 正确：多光谱卫星云图不是卫星云图种类（云图分红外、可见光等）。A/B 错误：红外/可见光云图均存在。", "621": "D 正确：CDMA不是IDR采用的传输方式（IDR用TDM/QPSK/FDMA）。A/B/C 错误：TDM/QPSK/FDMA均为IDR传输方式。", "622": "C 正确：UM（非确认模式）RLC实体最适合VoIP业务（时延敏感不需重传）。A/B 错误：AM（确认）/TM（透明）不符。", "623": "A 正确：DCI format 0-0必须与Format 1-0 size相等（0-0与1-0对齐）。B/C/D 错误：0-1/1-1/2-1不符。", "624": "D 正确：EPC+eNB(主)+gNB(辅)是5G网络演进部署成本相对最低的路径（复用4G核心网）。A/B/C 错误：NGC+gNB(主)/NGC+eNB(主)/NGC+gNB成本更高。", "625": "D 正确：64T64R天线配置波束赋形效果最好（通道数越多赋形越精细）。A/B/C 错误：4T4R/8T8R/16T16R效果次之。", "626": "D 正确：“下行频率1810MHZ、上行...”频段配置不正确（1810-1880为下行但上行频段表述不符），本题选不正确项。A/B/C 正确：上行892/下行950/上行1.78G等频段配置正确。", "627": "C 正确：NSA组网的主要优势是部署平稳、业务连续（依托4G网络平滑演进）。A/B/D 错误：与4G解耦/一步到位/全面支撑5G不符。", "628": "D 正确：组建无需移动终端不是无线自组网的优点（自组网由移动终端组网）。A/B/C 正确：动态拓扑/自动路由/无缝漫游均为优点。", "629": "C 正确：提高接收机等效噪声温度不能提高通信质量（噪声温度越高信噪比越差）。A/B/D 错误：改善信噪比/减少损耗噪声/提高天线增益均可提高通信质量。", "630": "D 正确：喷洒消毒液不属于计算机病毒木马防范措施。A/B/C 正确：安装防病毒软件/防火墙/定期杀毒均为防范措施。", "631": "B 正确：语音连续性不属于5G核心网络关键技术。A/C/D 正确：切片/CloudNative/MEC均为5G核心网关键技术。", "632": "C 正确：木工作业不属于特种作业范围（特种作业含电工/机动车辆驾驶等）。A/B 错误：电工作业/企业内机动车辆驾驶属特种作业。", "633": "B 正确：无线掉线率体现用户保持性能（保持连接能力）。A/C/D 错误：切换成功率/接通率/接入时延不符。", "634": "D 正确：重建失败为异常的无线掉线原因（异常掉线）。A/B/C 错误：用户不活动/重定向/过载控制为正常原因。", "635": "B 正确：CRS FREE不能降低5G空口时延（取消CRS是为了省开销非时延）。A/C/D 错误：时隙聚合调度/全双工/免授权调度均可降时延。", "636": "A 正确：损耗主要限制光信号传输距离（衰减决定中继距离）。B/C/D 错误：色散/温度/湿度次之。", "637": "D 正确：地理位置不是影响地球站通信指标的因素（EIRP/G-T/天线口径是）。A/B/C 错误：EIRP/G-T/天线口径均为通信指标。", "638": "D 正确：ARQ不是数字卫星通信基本调制方式（是差错控制协议）。A/B/C 错误：ASK/FSK/PSK均为基本调制方式。", "639": "C 正确：路由器不是构成局域网的必需设备（局域网内二层交换即可）。A/B/D 错误：集线器/交换机/计算机均必需。", "640": "C 正确：离设备远不是边缘计算的特点（边缘计算就近部署）。A/B/D 正确：低时延/高宽带/安全性均为边缘计算特点。", "641": "C 正确：信令简化不是NB-IoT的覆盖增强技术（覆盖增强靠功率谱密度/重复编码/单天线）。A/B/D 错误：功率谱密度增强/重复编码/单天线均为覆盖增强技术。", "642": "B 正确：OTDR可测量光纤长度、传输衰减、接头衰减和故障定位。A/C/D 错误：OLS/ORL/OPM不符。", "643": "C 正确：OPM（光功率计）经常用于PON网络光功率测试。A/B/D 错误：ORL/OTDR/OLS不符。", "644": "A 正确：VR业务对5G网络带宽要求最高（4K/8K VR高码流）。B/C/D 错误：车联网/直播/4K视频带宽要求次之。", "645": "A 正确：NSA特征为4G基站和5G基站共用4G核心网（双连接）。B/C/D 错误：5G基站+5G核心网/单独4G核心网均不符。", "646": "B 正确：调制不属于模拟信号数字化步骤（数字化步骤为抽样、量化、编码）。A/C/D 错误：量化/编码/抽样均为数字化步骤。", "647": "C 正确：SR（调度请求）不可以通过PUSCH信道发送（SR在PUCCH发送）。A/B/D 错误：HARQ反馈/PHR/BSR均经PUSCH发送。", "648": "B 正确：设备IP不包含在设备命名规范中（命名含类型/区域/网元序号）。A/C/D 错误：设备类型/区域/网元序号均含。", "649": "A 正确：NR中PT-RS主要用于相位跟踪和补偿。B/C/D 错误：CRS/DMRS/PDCCH不符。", "650": "D 正确：PCFICH信道用于承载下行控制信令所占用的OFDM符号数目。A/B/C 错误：PDSCH/PDCCH/PBCH不符。", "651": "D 正确：码间干扰只存在于数字无线网中（模拟网不存在）。A/B/C 错误：瑞利衰落/拥塞/快衰落两网均存在。", "652": "D 正确：PT-RS在NR中主要用于相位跟踪和补偿。A/B/C 错误：DM-RS/SRS/CSI-RS不符。", "653": "C 正确：AMF可以提供统一数据库存放用户签约数据等功能（AMF内嵌UDM功能）。A/B/D 错误：NRF/UDM/NSSF不符。", "654": "D 正确：NEF完成网络开放功能（网络暴露功能）。A/B/C 错误：AMF/SMF/NRF不符。", "655": "A 正确：其他选项说法均不正确（PTN/OTN各有定位，部署互补非二选一）。B/C/D 错误：PTN只适合城域/OTN适合骨干/非此即彼均错误。", "656": "B 正确：制定策略与计费地网元是PCF（策略控制功能）。A/C/D 错误：AMF/UPF/SMF不符。", "657": "C 正确：NGC用户面网元是UPF。A/B/D 错误：AMF/PCRF/SMF不符。", "658": "D 正确：典型的35GHz频谱人体损耗为3dB~5dB。A/B/C 错误：4-8/大于12/6-12不符。", "659": "A 正确：5G端到端QoS基本单位是QosFlow（QoS流）。B/C/D 错误：APN/EPS承载/PDN不符。", "660": "D 正确：LNA（低噪声放大器）属于卫星地面站下行射频设备（接收端）。A/B/C 错误：UPC/BUC/HPA为上行设备。", "661": "C 正确：音视频矩阵不属于视频会议系统设备（是切换设备非会议组件）。A/B/D 错误：遥控器/高清摄像机/麦克均为会议系统设备。", "662": "D 正确：CDM564室内单元不属于宽带VSAT网静中通卫星通信系统（静中通用CDM570）。A/B/C 错误：1.8米Ku天线/40W ODU/CDM570均属该系统。", "663": "C 正确：MME负责UE的移动性管理。A/B/D 错误：S-GW/P-GW/eNodeB不符。", "664": "A 正确：S档可开启飞行器运动模式（Sport档）。B/C/D 错误：A/P/T档不符。", "665": "D 正确：来自UE/MME侧的拒绝不属于RRC连接建立失败典型原因（是鉴权拒绝）。A/B/C 错误：TAU寻呼失败/RS功率问题/未在最好小区接入均为典型原因。", "666": "D 正确：CROM不是视频采集卡支持的视频源（是只读存储）。A/B/C 错误：放像机/摄像机/影碟机均为视频源。", "667": "B 正确：70MHz不是地球站接收机系统常用第一中频（70MHz是第二中频）。A/C/D 错误：1GHz/1.4GHz/1.7GHz均为常用第一中频。", "668": "B 正确：VR不是5G的三个主要商业场景（三大场景为eMBB/uRLLC/mMTC）。A/C/D 错误：uRLLC/eMBB/mMTC均为三大场景。", "669": "C 正确：上行数据分类路由转发不是5GC核心网AMF的功能（是UPF/SMF功能）。A/B/D 错误：接入认证/注册区管理/AS安全控制均为AMF功能。", "670": "A 正确：MPEG-1不能作为高清编码格式（分辨率低，标清标准）。B/C/D 错误：MPEG2/MPEG-4/MPEG7可支持高清（MPEG7是多媒体描述标准也非高清格式干扰项，题库答案为A）。", "671": "A 正确：8天线Beamforming方案仅支持单流（波束赋形单流）。B/C/D 错误：8天线2x2MIMO/4x2MIMO/AdaptiveMIMO均支持双流。", "672": "D 正确：DRAN/CRAN/Cloud RAN均可用于5G无线接入网部署（以上都可以）。A/B/C 错误：仅一种不完整。", "673": "B 正确：光纤连接器清洁可用擦纤盒（专用清洁工具）。A/C/D 错误：普通水/餐巾纸/手纸会损伤光纤端面。", "674": "C 正确：X2切换要求必须使用同一MME（站间X2切换同MME域）。A/B/D 错误：S1切换/LTE&UMTS/LTE&GERAN跨系统不符。", "675": "A 正确：色散不属于光纤非线性效应（是线性效应）。B/C/D 错误：自相位调制/拉曼散射/四波混频均为非线性效应。", "676": "C 正确：环型传输网物理拓扑安全性最高（自愈保护）。A/B/D 错误：线型/星型/树型无自愈能力。", "677": "C 正确：“为了缩短抢修时长可以考虑降低熔接质量标准”不符合规范（抢修同样要保证熔接质量）。A/B/D 正确：接头盒防水/大芯数双头抢修/监控熔接损耗均符合规范。", "678": "B 正确：值班人员在值班期间要对全部设备负责（全责值守）。A/C 错误：仅包维设备/包维人员在场可离岗均不符。", "679": "C 正确：“有两人值班时可以交代同事后离开”不正确（值班期间不得擅离岗位），本题选不正确项。A/B 正确：及时查询核对/填写值班日志均正确。", "680": "D 正确：直放站施主天线应尽量使用方向性好的天线（指向施主基站抑制干扰）。A/B/C 错误：越高越好/越低越好/全向天线不符。", "681": "B 正确：“无线自组网是需要基站的网络”错误（自组网无中心无基站），本题选错误项。A/C/D 正确：对等式/军事应用/WIFI组网均正确。", "682": "C 正确：“天线增益越高波束宽度也越宽”错误（增益高波束窄），本题选错误项。A/B/D 正确：辐射能力与振子长度相关/振子加倍增益增加/宽频段辐射均匀均正确。", "683": "A 正确：“自发辐射时会辐射出2个光子”错误（自发辐射辐射1个光子），本题选错误项。B/C/D 正确：光放大器应用受激辐射/受激辐射光放大称激光/激发态原子受外来光子激励受激辐射均正确。", "684": "D 正确：RRC重建立是UE发起的（UE检测RLF后发起重建）。A/B/C 错误：一定中断业务/只重建源小区/不增加数据量不符。", "685": "C 正确：“ONU根据上传的数据量来动态分配”错误（SR-DBA是ONU上报需求由OLT调度分配），本题选错误项。A/B/D 正确：GPON DBA技术/主动上报需求/按带宽分配地图发送均正确。", "686": "C 正确：破坏性和传染性是计算机病毒的最基本特征。A/B/D 错误：只破坏不传染/只传染不破坏均不符。", "687": "C 正确：二层以太网交换机对用户来说是透明的（二层转发不修改数据）。A/B/D 错误：按MAC转发是功能非描述/环路存在时泛洪/描述不符。", "688": "C 正确：“SDH设备只能用于点对点传输”错误（SDH支持组网/环网），本题选错误项。A/B/D 正确：SDH比PDH网管强/SDH规范光接口PDH无/更强大网络管理均正确。", "689": "A 正确：“5G作为主站LTE作为从站”错误（NSA中LTE为主站eNB、5G为从站gNB），本题选错误项。B/C/D 正确：用户面可选主/从站、依托LTE接入、信令面主站处理均正确。", "690": "C 正确：工作于OSI数据链路层的设备是交换机。A/B/D 错误：中继器（物理层）/路由器（网络层）/集线器（物理层）不符。", "691": "C 正确：分集接收增益对手机接收功率不产生影响（手机侧无分集）。A/B/D 错误：天馈线损耗/基站天线增益/路径损耗均影响手机接收功率。", "692": "B 正确：NR中PT-RS主要用于相位跟踪和补偿。A/C/D 错误：CRS-RS/DMRS/SRS不符。", "693": "C 正确：CDMA多址方式抗干扰能力较强（扩频抗干扰）。A/B/D 错误：FDMA/TDMA/SDMA不符。", "694": "C 正确：三相短路属于对称短路。A/B 错误：单相短路/两相短路为非对称短路。", "695": "B 正确：卫星相邻覆盖区用户存在严重同信道干扰（同频邻区）。A/C/D 错误：同一卫星用户（时分/频分隔离）/不相邻用户不符。", "696": "D 正确：手脚冰冷不属于中暑的症状（中暑发热汗出）。A/B/C 错误：头痛/脉
