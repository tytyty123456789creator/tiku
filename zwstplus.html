AH蓄电池并联以10小时率放电，总放电电流为3000×2/10=600A。A/B 错误：900/300不符。", "1790": "A 正确：单向通道保护环最大业务容量STM-N，两纤双向复用段环为STM-N/2（M为节点数时M/2错误表述，A选项表述符合题库）。B/C/D 错误：容量表述不符。", "1791": "C 正确：两根接闪器引下扁铁沿远离机房一侧引下，每隔5米固定一次。A/B/D 错误：3/4/6不符。", "1792": "C 正确：2F1-F2是3阶互调（|2×1-1|系数和=3）。A/B/D 错误：1/2/4不符。", "1793": "C 正确：非线性电路互调产生与有用信号相近的组合频率称互调干扰。A/B/D 错误：同频/邻频/多址干扰不符。", "1794": "D 正确：两个导频序列偏置的最小间隔是64Chips。A/B/C 错误：1seConD/1Hz/1Chip不符。", "1795": "C 正确：链路状态路由协议有OSPF（开放最短路径优先）。A/B/D 错误：IBGP/RSVP/LDP/EBGP不符。", "1796": "A 正确：链路预算中普通手持智能终端天线增益一般设置为0db。B/C/D 错误：1/2/3dbi不符。", "1797": "A 正确：链路净损耗指从发射机到接收机之间所有增益与损耗的差值（净损耗）。B/C/D 错误：天线之间/收发天线间定义不符。", "1798": "C 正确：链路误码性能测试属于卫星链路开通测试。A/B/D 错误：单机/联机/分系统不符。", "1799": "B 正确：联合接地基于均压理论（消除地电位差）。A/C/D 错误：分流/屏蔽/等电位不符。", "1800": "C 正确：卫星通信网开电视电话会议时信道分配采用按需分配频段。A/B/D 错误：动态自适应/按需分配时隙/预分配不符。", "1801": "C 正确：接收端需图像编辑的电视传送编码器采样方式选4：2：2（高质量分量）。A/B/D 错误：4：2：0/4：1：1/4：4：4不符。", "1802": "C 正确：环状绳索长度至少为河水宽度的三倍长。A/B/D 错误：一/二/四不符。", "1803": "C 正确：矩形基带脉冲改变高频正弦波幅度的数字键控调制为ASK（幅移键控）。A/B 错误：FSK/PSK不符。", "1804": "B 正确：交换机默认的VLAN是VLAN1。A/C/D 错误：VLAN0/10/1024不符。", "1805": "B 正确：石英光纤工作波长范围3个低损耗窗口为850nm、1310nm、1550nm。A/C/D 错误：1460/1610/1750不符。", "1806": "B 正确：利用风洞得到飞机气动参数基本依据是相对性原理。A/C 错误：连续性假设/牛顿定理不符。", "1807": "A 正确：利用大树年轮辨别方向，年轮疏的方向为南，密的方向为北（南侧向阳生长快）。B/C/D 错误：方向组合不符。", "1808": "A 正确：RAKE接收机实现带内分集，抗频率选择性快衰落。B/C/D 错误：时间/空间/都不是不符。", "1809": "D 正确：历史告警指已确认未清除告警。A/B/C 错误：未确认未清除/未确认已清除/已确认已清除不符。", "1810": "C 正确：锂电池失效标志位电池剩余容量低于0.8（80%）。A/B/D 错误：0.9/0.6/0.7不符。", "1811": "A 正确：理想宿营地应背风、向阳，且附近有可利用的水源。B/C 错误：顺风/避阳不符。", "1812": "D 正确：三阶互调产物公式为2*F1-F2。A/B/C 错误：2F1/2F2/F1+F2不符。", "1813": "B 正确：离地面2m以上高度作业人员应系上符合要求的安全带。A/C/D 错误：1/3/4不符。", "1814": "B 正确：离地面2米以上高度作业人员应系上符合要求的安全带。A/C/D 错误：1/3/4不符。", "1815": "B 正确：冷却系统水泵作用是使冷却液在发动机内流动（强制循环）。A/C/D 错误：防气蚀/控温/冷却机油不符。", "1816": "A 正确：冷却水循环冷却泵将升温后的水送入冷却水塔称为进水。B/C/D 错误：冷水/回水/热水不符。", "1817": "A 正确：冷锋是冷气团主动向暖气团移动形成的锋。B/C 错误：一侧温度低/两气团温度不同不符。", "1818": "C 正确：雷电放电时附近导体上产生静电感应和电磁感应，可能使金属部件间产生电火花。A/B/D 错误：静电屏蔽/带电粒子/电流不符。", "1819": "B 正确：形成强烈积雨云需三个条件：深厚而明显的不稳定气层、充足的水气、足够的冲击力。A/C/D 错误：条件组合不符。", "1820": "A 正确：雷暴发展阶段地面气压持续下降（上升气流低压）。B/C 错误：持续上升/保持不变不符。", "1821": "A 正确：劳动合同依法订立即具有法律约束力，当事人必须履行义务。B/C/D 错误：用人单位/劳动者/双方不符。", "1822": "B 正确：劳动合同是保障劳动者实现劳动权的重要法律形式。A/C/D 错误：生存权/知情权/肖像权不符。", "1823": "D 正确：试用期条款不属于劳动合同法定条款（是约定条款）。A/B/C 错误：劳动报酬/劳动保护/终止条件均属法定条款。", "1824": "B 正确：劳动合同各项条款包括专项协议协商确定的内容必须统一（一致）。A/C/D 错误：接近/相似/真实不符。", "1825": "C 正确：劳动关系中劳动者和用人单位之间兼有平等和隶属关系。A/B/D 错误：平等/隶属/以隶属为主不符。", "1826": "A 正确：劳动关系的内容是主体双方依法享有的权利和承担的义务。B/C/D 错误：权力/待遇/报酬不符。", "1827": "D 正确：劳动法律关系体现的是国家意志。A/B/C 错误：劳动者/企业/劳动行政部门意志不符。", "1828": "A 正确：劳动法规定女职工生育享受不少于90天的产假。B/C/D 错误：110/115/120不符。", "1829": "C 正确：缆线布放性能指标是光缆、尾纤不得与其他线缆交叉（缠绕）。A/B/D 错误：随意堆放/随意布放/尾纤不加保护不符。", "1830": "C 正确：拦截网或天钩回收中能量吸收装置与拦截网相连，缓冲无人机动能。A/B 错误：拦截网回收最普遍/拦截网组成不符。", "1831": "D 正确：拉线抱箍与吊线抱箍隔距10±2cm，第一道与第二道拉线隔距40cm。A/B/C 错误：隔距组合不符。", "1832": "A 正确：拉线对地夹角允许偏差1°，拉线水平投影间夹角误差60°、65°（60°对地夹角、65°投影）。B/C/D 错误：角度组合不符。", "1833": "B 正确：馈线长度45米要求有3点接地（10m以内1点，10-20m 2点，20-60m 3点）。A/C/D 错误：2/4/5不符。", "1834": "C 正确：馈线水平安装用馈线卡子每隔800～1000mm固定。A/B/D 错误：500-800/600-800/1000-1200不符。", "1835": "B 正确：馈线两固定点之间距离不应大于0.8m。A/C/D 错误：0.6/0.5/0.9不符。", "1836": "C 正确：普通馈线拐弯圆滑均匀，弯曲半径大于等于15倍（馈线直径）。A/B 错误：5/10不符。", "1837": "B 正确：馈线进入机房前必须至少有3处以上防雷接地点，进入机房后安装避雷器。A/C/D 错误：二/四/五不符。", "1838": "A 正确：馈线接地线馈线端要高于接地排端，走线要朝下。B/C 错误：低于/等高于不符。", "1839": "D 正确：馈线接地10m以内1点，10-20m为2点，20-60m为3点。A/B/C 错误：20-30/40/50不符。", "1840": "D 正确：馈线主要作用是把发射机输出的射频信号高效送至天线。A/B/C 错误：馈线/跳线/漏缆不符。", "1841": "A 正确：馈线弯曲半径是其直径的10倍。B/C/D 错误：15/20/25不符。", "1842": "C 正确：馈线特性阻抗与馈线的导体结构有关（尺寸和介质决定50Ω/75Ω）。A/B/D 错误：长短/负载/线径不符。", "1843": "A 正确：基站室内外所用馈线应是阻燃的。B/C/D 错误：密封/可靠/平整不符。", "1844": "A 正确：馈线分类及损耗中包含射频跳线。B/C/D 错误：DIN转换头/N型转换头/不需要转换不符。", "1845": "B 正确：宽带VSAT主控站Modem分系统与射频分系统通过L波段电缆相连接。A/C/D 错误：S/C/Ku不符。", "1846": "A 正确：宽带VSAT系统前向信令采用TDM广播方式。B/C/D 错误：FDM/SCPC/CDMA不符。", "1847": "D 正确：VoIP电话号码前3位代表城市区号码。A/B/C 错误：端口号码/站点序号/站点类型码不符。", "1848": "C 正确：宽带VSAT系统中VoIP电话号码由8位数字组成。A/B/D 错误：3/6/11不符。", "1849": "C 正确：宽带VSAT系统应急业务传输时采用TDM/SCPC方式。A/B/D 错误：FDMA/DAMA/CDMA/OFDM不符。", "1850": "C 正确：宽带VSAT系统两种工作方式为SCPC和STDMA。A/B/D 错误：FDMA/TDMA/CDMA不符。", "1851": "D 正确：固定站配置的CDM562调制解调器主要用于接收SCPC业务。A/B/C 错误：CDM600/625/570不符。", "1852": "A 正确：车载站配置的CDM570调制解调器既可发射STDMA载波又可接收SCPC载波。B/C/D 错误：CDM600/562/564不符。", "1853": "C 正确：570L设备进行SCPC业务应用时，Tx Traffic灯突发（SCPC突发发射）。A/B/D 错误：Tx常亮/Rx常亮/Remote常亮不符。", "1854": "D 正确：CDM-564L具备4路解调器。A/B/C 错误：1/2/3不符。", "1855": "C 正确：宽带VSAT网静中通系统卫星功放大小为40W。A/B/D 错误：16/20/100不符。", "1856": "A 正确：动中通车载站由载车平台、综合网管终端、IP电话系统、音视频系统、卫星通信系统、视频会议系统组成。B/C/D 错误：组成不符。", "1857": "C 正确：宽带VSAT网VMS为网管分系统。A/B/D 错误：射频/调制解调/业务不符。", "1858": "C 正确：CDM-570/570L为调制解调器设备。A/B/D 错误：路由器/功分器/高功放不符。", "1859": "D 正确：宽带VSAT网CDM-564L为4路解调器。A/B/C 错误：1/2/3不符。", "1860": "B 正确：快随路信令FACCH携带的是SDCCH上的信息（借用业务信道传送信令）。A/C/D 错误：MBCCH/测量/话务信息不符。", "1861": "C 正确：快衰落由多径引起，服从瑞利分布。A/B/D 错误：正态/对数正态/负数正态不符。", "1862": "A 正确：跨越通航河道架线应在上游大于100m和下游大于50m处张挂施工标志。B/C/D 错误：距离组合不符。", "1863": "A 正确：跨省调用队伍和装备超过该专业队伍同种装备数量50%以上的应履行报备程序。B/C/D 错误：70/30/100不符。", "1864": "D 正确：控制面user-inactivity定时器一般建议设置为10s。A/B/C 错误：1s/2s/1min不符。", "1865": "A 正确：空中交通管制单位为飞行中民用航空器提供空中交通服务，含有飞行情报服务。B/C 错误：机场保障/导航服务不符。", "1866": "C 正确：空域管理的具体办法由国务院和中央军事委员会制定。A/B 错误：民用航空局/中央军委不符。", "1867": "B 正确：空速减小时为保持高度应增大迎角以保持升力不变。A/C 错误：增大迎角升力大于重力/减小迎角不符。", "1868": "B 正确：空气流过粗细不等的管子，管道变粗处气流速度减小（连续性方程）。A/C 错误：增大/不变不符。", "1869": "D 正确：空气开关或熔丝的负载电流一般不得超过额定容量的80%。A/B/C 错误：90/95/85不符。", "1870": "A 正确：空气密度与压力成正比。B/C 错误：成反比/无关不符。", "1871": "B 正确：空分复用对应2个码字（SDMA两路空间流）。A/C/D 错误：1/3/4不符。", "144": "D 正确：专用模式下手机将测量服务小区RXLEV、quality，邻小区RXLEV，解BSIC码，以上都是。A/B/C 错误：仅一项不完整。", "145": "A 正确：专享模式局域场景在优享基础上叠加边缘计算无线增强，实现数据不出场（数据本地处理）。B/C/D 错误：本地保障/业务加速/业务隔离非核心卖点。", "146": "D 正确：注册规程处理中REGISTER通知ONU已识别注册请求的MPCP。A/B/C 错误：REGISTER_REQ/REPORT/GATE非该通知消息。", "147": "C 正确：终端attach流程中Attach complete通过上行直传消息发送。A/B/D 错误：Attach request/accept/PDN Connectivity非上行直传。", "148": "C 正确：境内飞行的航空器必须遵守统一的飞行规则，该规则由国务院和中央军委制定。A/B 错误：民航局+军委/军委单独不符。", "149": "B 正确：经过膨胀阀后制冷剂状态为低温低压的气液混合物。A/C/D 错误：高温高压气体/低温低压气体/低温高压液体不符。", "150": "B 正确：直流配电屏中分流器的作用是检测电流（大电流采样）。A/C/D 错误：检测电压/分配电流/分配电压不符。", "151": "C 正确：需考虑隔离度问题的是无线室外直放站（收发天线间需隔离防自激）。A/B/D 错误：光纤/移频/光纤室内直放站隔离由器件保证。", "152": "C 正确：“在必要的时候为了保护应急设备可以忽略安全”说法错误（安全优先不可忽略），本题选错误项。A/B 正确：做好安全检查、紧急情况可中断应急均正确。", "153": "D 正确：各省需配备能随身携带的物资，保障时长72小时（3天）。A/B/C 错误：8/12/24小时不符。", "154": "A 正确：沼泽地行走应随身携带探测棒（试探地面硬度防陷落）。B/C/D 错误：手电筒/手套/氧气袋非防陷工具。", "155": "B 正确：配线光缆损坏致EPON一半以上用户阻断的为严重障碍。A/C/D 错误：全阻/一般/中级障碍不符。", "156": "B 正确：云计算中PaaS是平台即服务。A/C/D 错误：IaaS基础设施即服务、SaaS软件即服务、QaaS非标准。", "157": "C 正确：距原子核远的轨道上电子比近的轨道电子具有更大的能量（能级更高）。A/B/D 错误：质量/能量大小关系不符。", "158": "C 正确：高处作业安全带按高挂低用方式挂在牢靠处（减小坠落距离）。A/B/D 错误：低挂高用/高挂高用/平挂平用不符。", "159": "A 正确：应急通信设备开通前最先确认设备停放稳定、开启支撑系统（基础安全）。B/C/D 错误：加电/启动油机/连接安装在确认稳定后进行。", "160": "C 正确：ping基站网关ping值高，原因不包括超时阈值设定过低（超时阈值不影响时延值）。A/B/D 错误：流量拥塞/带宽不足/卫星路由均会导致高时延。", "161": "B 正确：密集城区无线信号建筑物穿透损耗典型值25dB。A/C/D 错误：30/20/15dB不符。", "162": "A 正确：易燃易爆场所不得穿戴尼龙工作服（化纤易产生静电火花）。B/C/D 错误：棉布/防静电服/耐高温鞋安全。", "163": "B 正确：网孔形网络可靠性最高（多路由冗余）。A/C/D 错误：树形/环形/星形可靠性均低于网状。", "164": "B 正确：适用于高速移动高SINR的是开环空分复用。A/C/D 错误：发射分集/闭环空间复用/闭环Rank=1不符。", "165": "B 正确：L波段大气衰耗最小（频率低衰耗小）。A/C/D 错误：S/C/Ku波段频率更高衰耗更大。", "166": "B 正确：以太网帧长度下限主要出于冲突检测考虑（保证最短帧在发送期间可检测冲突）。A/C/D 错误：多点访问/带宽利用/载波监听非主因。", "167": "B 正确：以太网根据MAC地址区分不同设备。A/C/D 错误：LLC/IP/IPX地址非以太网层区分依据。", "168": "D 正确：以太网OAM监管域MD的维护边缘点是MEP。A/B/C 错误：MIP/MEG/MA非维护边缘点。", "169": "D 正确：以太网QoS为不同应用提供不同服务质量，如提供出口速率限制。A/B/C 错误：业务分类着色/拥塞控制/流量监管是QoS手段而非服务提供。", "170": "D 正确：以太网传输层OAM中点对点链路连接检测由802.1ah定义（IEEE 802.1ah OAM）。A/B/C 错误：G.8113.1/Y.1731/802.1ag不符。", "171": "C 正确：未配置邻区小区个体偏移时CellIndividualOffset默认为0。A/B/D 错误：-20/20/1不符。", "172": "C 正确：相同频点相邻基站的切换属于软切换（CDMA同频软切换）。A/B/D 错误：硬/更软/越区切换不符。", "173": "B 正确：移动通信中C/I指载干比（载波功率/干扰功率）。A/C/D 错误：信噪比/误码率/码间干扰不符。", "174": "A 正确：移动终端移向基站时接收频率变高，远离时变低（多普勒效应）。B/C/D 错误：高低组合不符。", "175": "B 正确：软切换时使用不同RAKE接收机接收不同基站信号（分集合并）。A/C/D 错误：硬/内/外切换不符。", "176": "B 正确：在已使用的L3VE下新增LTE基站业务，需要配置到该基站的静态ARP。A/C/D 错误：BFD/静态路由/网关IP不符。", "177": "A 正确：划定的管制空域内由军航或民航的一个空中交通管制单位负责管制。B/C 错误：各一个/军航单独不符。", "178": "A 正确：TDM/FDMA VSAT网络不能满足业务量时，应增加多个TDM出站载波。B/C/D 错误：时隙/信道/频率不符。", "179": "C 正确：“SCTP连接建立请求由MME发起”说法不正确（SCTP连接由eNB发起），本题选不正确项。A/B/D 正确：流标志对应对应、保留流标识符、单个UE信令发送均正确。", "180": "C 正确：C类地址划分15个子网适合用255.255.255.240（/28，支持16子网）。A/B/D 错误：掩码不符。", "181": "B 正确：业务一致路由下误码仪能形成通路的做法是两端支路通道对通环回（本端挂误码仪、对端环回）。A/C/D 错误：环回方式不符。", "182": "A 正确：野外夜间求救信号频率为三短、三长、三短（SOS摩斯码）。B/C 错误：三长三短/二长三短不符。", "183": "D 正确：野外突遇雷电应停止活动，寻找低凹的地势躲避（低处防雷击）。A/B/C 错误：继续活动/握金属/大树下避雨均危险。", "184": "C 正确：汽车落水在沉没一半以上前应保持冷静解开安全带（趁水压小时逃生）。A/B/D 错误：一少半/一半/充满不符。", "185": "C 正确：水资源紧缺时一次只喝一两口，慢慢地咽下，可维持身体所需。A/B/D 错误：一次喝完/大口多喝/快咽均浪费水。", "186": "D 正确：野外刀具选择不包括手术刀。A/B/C 错误：折叠刀/帕兰砍刀/磨刀器均为野外常用。", "187": "B 正确：野外穿越背负重量不超过本人体重的四分之一。A/C 错误：五分之一/三分之一不符。", "188": "C 正确：“赶紧跑到公路或村庄求救”不正确（毒蛇咬伤后剧烈运动加速毒液扩散），本题选不正确做法。A/B 正确：用嘴吸出毒血、按说明服用解毒药均正确。", "189": "B 正确：野外应避免夜间穿行（视野差易迷路遇险）。A/C 错误：白天/下雨天可注意安全穿行。", "190": "B 正确：同伴踝关节扭伤应抬高患部，局部用湿毛巾冷敷（止血消肿）。A/C/D 错误：酒推擦/热敷/不处理均加重损伤。", "191": "B 正确：压缩机中是高温高压气体（压缩升温升压）。A/C/D 错误：液体/低压不符。", "1872": "C 正确：建立www连接不能实现两地内部专网安全连接（公网网页连接无专网安全）。A/B/D 正确：OTN/STN/MSTP专线/VPN/5G切片均能实现专网连接。", "1873": "C 正确：克服慢衰落的主要方法是加大发射功率、提高接收灵敏度、宏观分集。A/B/D 错误：互调干扰/多径衰落/快衰落不符。", "1874": "C 正确：可以预警的突发事件预警级别最高级别为Ⅰ级用红色表示，Ⅳ级用蓝色表示（蓝色对应四级预警）。A/B/D 错误：颜色级别对应不符。", "1875": "D 正确：开通应急4G基站的传输电路不包括PTN承载的2M电路（2M带宽不足）。A/B/C 正确：卫星100M/PTN GE/微波GE均可承载。", "1876": "B 正确：可以修改关键字的模板为带int_id的修改模板。A/C 错误：修改模板/新增模板不符。", "1877": "C 正确：CE1B单板可以提供TDM业务（E1接口）。A/B/D 错误：EC4G/EPFC/EPFA不符。", "1878": "A 正确：可能需要处置的紧急情况不包括飞控系统故障（飞控故障为系统自身故障非紧急情况处置项）。B/C/D 错误：上行链路/控制站显示/系留地面子系统故障均为紧急情况。", "1879": "A 正确：可路由网络协议的网络地址由网段地址和主机地址两部分组成。B/C 错误：主机掩码/网段掩码不符。", "1880": "C 正确：开通4G基站只需无线网制作数据，不需要核心网制作数据（核心网侧独立）。A/B 错误：2G/3G需核心网数据。", "1881": "A 正确：开关电源蓄电池充电限流设置为0.10C10。B/C/D 错误：0.15C3/75A/45A不符。", "1882": "A 正确：并联工作的电源模块共同平均分担负载电流，使各模块均流。B/C/D 错误：模块/电池/交流不符。", "1883": "D 正确：开关电源系统继电器、断路器接触点温升应小于55℃。A/B/C 错误：50/64/60不符。", "1884": "C 正确：蓄电池在市电正常时处于浮充状态。A/B/D 错误：恒流均充/恒压均充/自然放电不符。", "1885": "C 正确：均充电压564V、放出30%电量后均充，只有在恒压均充阶段均充电（恒压阶段电压达到设定值）。A/B/D 错误：阶段判断不符。", "1886": "A 正确：开关电源检查直流输出保护功能就是测试LVDS（低压断路）是否正常。B/C/D 错误：熔断器/自动开关/电路不符。", "1887": "B 正确：开关电源监控和整流模块电压电流显示误差应分别小于0.2V和0.5A。A/C/D 错误：误差范围不符。", "1888": "C 正确：开关电源直流工作地应用不小于70mm²的多股铜导线单独从接地汇集线上引入。A/B/D 错误：30/50/95不符。", "1889": "C 正确：开关电器触头在闭合和分断过程中都会产生电弧。A/B 错误：仅闭合/仅分断不符。", "1890": "B 正确：开关（限流）型SPD应安装在LPZ0-LPZ1防雷保护区（交界处）。A/C/D 错误：防雷区不符。", "1891": "D 正确：开发环境及测试环境应与实际运行环境及办公环境安全隔离。A/B/C 错误：相似/仿真/一致不符。", "1892": "C 正确：均衡充电终期电压223～225V/单体，若连续3h电压不变则电量已充足。A/B/D 错误：1/2/4h不符。", "1893": "D 正确：决定天线抗干扰能力的指标是主瓣波束宽度（波瓣越窄抗干扰越强）。A/B/C 错误：极化方式/驻波比/输入阻抗不符。", "1894": "B 正确：决定光纤通信中继距离的主要因素是光纤的损耗和色散。A/C/D 错误：型号/发射功率/灵敏度不符。", "1895": "B 正确：决定OTDR纵轴事件损耗情况和可测最大距离的是动态范围。A/C/D 错误：盲区/折射率/脉宽不符。", "1896": "D 正确：聚合组成员失效在负载分担模式下可能造成带宽不够、持续丢包。A/B/C 错误：业务中断/无影响/链路倒换短暂丢包不符。", "1897": "A 正确：具有纵向安定性的飞机，飞机重心位于压力中心前。B/C 错误：压力中心后/重合不符。", "1898": "B 正确：局内单模光通信接口使用波长为1310nm。A/C/D 错误：850/1330/1550不符。", "1899": "B 正确：就信号交叉灵活性而言DXC4/0网元交叉灵活性较大（高阶交叉）。A/C/D 错误：DXC4/4/TM/DXC4/1不符。", "1900": "C 正确：救出中毒人员移离现场至空气新鲜处，松开衣领，气温低时保暖。A/B/D 错误：紧急抢救/人工呼吸/及时治疗不符。", "1901": "B 正确：酒精对睡眠的影响是对快波睡眠具有强烈抑制作用。A/C 错误：促进/延长加深不符。", "1902": "A 正确：静中通车载站主要由载车平台、综合网管终端、IP电话系统、音视频系统、无线背负系统、卫星通信系统、视频会议系统组成。B/C/D 错误：组成不符。", "1903": "A 正确：静中通车载站卫星通信系统主要由天线、ODU、LNB、调制解调器等组成。B/C/D 错误：VOIP/图传/车载油机不符。", "1904": "C 正确：静止卫星通信在地球两极存在盲区（静止卫星无法覆盖两极）。A/B/D 错误：多普勒频移/摄动/日凌不符。", "1905": "B 正确：静止卫星的正确描述是公转周期恰好是24小时（与地球自转同步）。A/C/D 错误：静止不动/36000km上空/不确定不符。", "1906": "D 正确：静止卫星不可能运行在极地轨道上（必须赤道同步）。A/B/C 错误：同步/中高度/赤道轨道不符。", "1907": "C 正确：静止同步卫星通信传输单跳时延约0.27秒。A/B/D 错误：0.13/0.2/0.54（双跳）不符。", "1908": "B 正确：静止同步卫星轨道属于赤道轨道。A/C/D 错误：极轨道/倾斜轨道/椭圆轨道不符。", "1909": "A 正确：静止轨道卫星距离地面高度36000公里。B/C/D 错误：40000/32000/42000不符。", "1910": "C 正确：静默期每间隔160ms发一个很短的SID（舒适噪声帧）。A/B/D 错误：100/120/200不符。", "1911": "A 正确：静电是物体表面过剩或不足的相对静止电荷。B/C/D 错误：负电/正电/都不正确不符。", "1912": "B 正确：精密空调与舒适性空调主要不同是精密空调显热比大（显冷量大）。A/C/D 错误：显热比小/双制冷/完全过滤不符。", "1913": "A 正确：经营基础电信业务须经国务院信息产业主管部门审查批准取得许可证。B/C/D 错误：工商局/地方机构/质监部门不符。", "1914": "D 正确：党找到自我革命这一跳出治乱兴衰历史周期率的第二个答案。A/B/C 错误：自我变革/社会革命/自我斗争不符。", "1915": "C 正确：持续输出电流5A，应选用30A电调（留足裕量，选额定大于工作电流）。A/B 错误：5A/10A不符。", "1916": "C 正确：禁止航空器着陆的辅助指挥符号是在着陆地带昼间铺设“十”字。A/B 错误：T字/一形不符。", "1917": "A 正确：禁止标志基本几何图形是带斜杠的圆环。B/C/D 错误：三角形/圆形/矩形不符。", "1918": "B 正确：居民人均可支配收入从一万六千五百元增加到三万五千一百元。A/C/D 错误：数字不符。", "1919": "B 正确：近程无人机活动半径在15~50km。A/C 错误：小于15km/200-800km不符。", "1920": "B 正确：QPSK、FEC=3/4、S/R=8448MB/s时调制载波占用带宽约10MHz（8448k×4/3/2符号率关系）。A/C/D 错误：5/20/50M不符。", "1921": "D 正确：进入移动通信基站的低压电力电缆应从地下引入机房，长度不宜小于50米。A/B/C 错误：15/25/30不符。", "1922": "D 正确：进入光纤中的光波通过全反射确保在光纤内部传播不外溢。A/B/C 错误：散射/透射/折射不符。", "1923": "A 正确：高温季节电解液比重比冬季时应小些（高温电化学反应快，比重可降低）。B/C 错误：大/不确定不符。", "1924": "D 正确：进入IDR MODEM的用户数据码型是十六进制。A/B/C 错误：AMI/HDB3/八进制不符。", "1925": "B 正确：进局电缆应埋地引入，缆线埋地深度不小于0.7m。A/C/D 错误：0.5/0.9/0.11不符。", "1926": "D 正确：紧套光纤缓冲层厚度为100µm，二次涂覆层外径60-900µm。A/B/C 错误：50/70/90不符。", "1927": "A 正确：金属梯子不适于有触电机会的工作场所（导电危险）。B/C 错误：坑穴密闭/高空不符。", "1928": "C 正确：截面在10mm²以上的电源线终端必须加装线鼻子。A/B/D 错误：5/8/12不符。", "1929": "D 正确：接收机灵敏度是在R参考点达到规定误比特率时所能接收到的最低平均光功率。A/B/C 错误：最高/偏高/偏低不符。", "1930": "D 正确：接收机底噪是在根据所分配的RB占用的带宽上积分。A/B/C 错误：10M/20M/频率规划带宽不符。", "1931": "B 正确：在一大片水体或者稠密植被的下风方向着陆时，接近地面的对流气流会影响操控（B表述正确）。A/C 错误：全无植被/描述不符。", "1932": "D 正确：接地系统电阻起决定性作用的是接地体附近的土壤电阻。A/B/C 错误：导线电阻/接触电阻/接地体电阻不符。", "1933": "B 正确：接地电流经接地体向大地作半球形散开，离接地体越远半球形球面越大、电阻越小。A/C/D 错误：越大/无关/一样不符。", "1934": "A 正确：接地扁铁与塔体焊接连接，焊接长度不少于10cm且必须满焊。B/C/D 错误：20/30/50不符。", "1935": "D 正确：交流停电再来电时接触器来回跳闸原因是电网带载差（来电时电压不稳）。A/B/C 错误：接触器坏/采样板坏/控制板坏不符。", "1936": "B 正确：交流市电电源供电频率变动范围±2Hz。A/C/D 错误：±1/±3/±5不符。", "1937": "D 正确：交流配电屏额定电流必须大于各分路额定电流之和。A/B/C 错误：最大分路/最小分路/平均值不符。", "1938": "A 正确：交流接触器工作特点是高压吸合、低压维持（启动冲击大）。B/C/D 错误：组合不符。", "1939": "A 正确：常闭触点指不加电时触点闭合。B/C/D 错误：加电/正常时/市电正常时闭合不符。", "1940": "C 正确：交流负载功率因数过低影响系统负载能力（容量得不到充分利用）。A/B/D 错误：频率标准/电压标准/电池放电不符。", "1941": "B 正确：交流电源开关引接处附近应设置明显警示标志并设专人监护。A/C/D 错误：闸刀/保安器/保安单元不符。", "1942": "B 正确：交流电流表或电压表指示的数值是有效值。A/C/D 错误：平均值/最大值/瞬时值不符。", "1943": "A 正确：交流低压配电设备中自动空开主要作为不频繁接通或分断电路用。B/C 错误：低压刀开关/熔断器不符。", "1944": "A 正确：交流测速发电机输出电压与转速成正比。B/C 错误：成反比/没关系不符。", "1945": "D 正确：交接箱（间）必须设置地线，接地电阻不得大于10Ω。A/B/C 错误：30/25/15不符。", "1946": "B 正确：交换系统服务质量指标可由呼损指标、接续时延衡量。A/C/D 错误：话务量话音响度/通话时长/清晰度杂音不符。", "1947": "D 正确：交换局、数据机房、基站空调温度设置值按顺序分别为23℃、21℃、25℃。A/B/C 错误：温度组合不符。", "1948": "B 正确：交换机配置线（console线）连接在PC的串口COM端口。A/C 错误：并口serial/以太网端口不符。", "1949": "B 正确：交换机、路由器分别是冲突域、广播域的边界（交换机隔离冲突域，路由器隔离广播域）。A/C/D 错误：域类型对应不符。", "1950": "C 正确：降落时间指航空器着陆滑跑终止的瞬间。A/B 错误：接地瞬间/前轮接地瞬间不符。", "1951": "C 正确：降低HPA交调干扰的措施是降低工作点功率（回退工作点）。A/B/D 错误：阻抗匹配/抑制谐波/降低带宽不符。", "1952": "C 正确：卫星通信作为C网中继传输手段主要存在延时问题。A/B/D 错误：误码/抖动/时钟不符。", "1953": "A 正确：所有网元节点两两相连形成网状网拓扑。B/C/D 错误：星形/链形/树形不符。", "1954": "A 正确：将连续变化的模拟信号变成时间离散的脉幅调制信号称抽样（采样）。B/C/D 错误：量化/编码/扰码不符。", "1955": "A 正确：将基础设施作为服务的云计算服务类型是IaaS。B/C 错误：PaaS/SaaS不符。", "1956": "B 正确：将光限制在有包层光纤纤芯中的作用原理是在包层折射边界上的全内反射。A/C/D 错误：折射/纤芯包层界面全内反射/涂覆层反射不符。", "1957": "D 正确：健康成年人一次失血超过30%就会危及生命。A/B/C 错误：5/10/20不符。", "1958": "A 正确：建设自然灾害综合风险监测预警系统，接入气象、水文、地震、地质、海洋等相关监测资源。B/C/D 错误：监测资源组合不符。", "1959": "B 正确：建设国家应急指挥平台，升级完善应急指挥“一张图”和应急资源管理平台，建设数字化应急预案库。A/C/D 错误：互联网关标准/资源共享平台/智能化应急系统不符。", "1960": "A 正确：建强基层应急和社会共治体系，普及应急知识技能做到人人讲安全、个个会应急。B/C/D 错误：口号不符。", "1961": "B 正确：建立职业健康安全管理体系是系统化规范化管理过程，也是企业以人为本的体现。A/C/D 错误：生产保安全/以安全促发展/以科技保安全不符。", "1962": "B 正确：建立除南北极地区以外全球通信至少需要3颗同步卫星。A/C/D 错误：1/5/9不符。", "1963": "B 正确：减小互调噪声使转发器工作点靠近线性区，用于频带受限系统。A/C/D 错误：非线性/饱和/非饱和不符。", "1964": "A 正确：蓄电池电液面应高出极板10-15mm，严禁金属器皿添加蒸馏水。B/C/D 错误：高度范围不符。", "1965": "B 正确：小油机燃油不足0.5时应添加。A/C/D 错误：0.3/0.7/0.6不符。", "1966": "A 正确：检测开关电源直流电压和电池电压，万用表精度显示位数必须为4位半。B/C/D 错误：3位半/5位/6位不符。", "1967": "C 正确：坚持走中国特色社会主义政治发展道路，全面发展全过程人民民主。A/B/D 错误：全要素/全方位/全周期不符。", "1968": "A 正确：坚持预防为主，聚焦极端事故场景、关键网络设备、高危操作岗位，全面实施风险清单管理。B/C/D 错误：设备/故障/安全清单不符。", "1969": "A 正确：坚持以预防为主，重点放在日常维护上，加强对维护作业计划执行情况的检查。B/C/D 错误：纸上谈兵/应急保障/设备维修不符。", "1970": "A 正确：坚持山水林田湖草沙一体化保护和系统治理。B/C 错误：草冰/草土不符。", "1971": "B 正确：召开古田全军政治工作会议，牢固确立战斗力这个唯一的根本的标准。A/C 错误：执行力/凝聚力不符。", "1972": "C 正确：坚持不敢腐、不能腐、不想腐一体推进，同时发力、同向发力、综合发力。A/B/D 错误：一同/同步/协调不符。", "1973": "B 正确：坚持党的全面领导是坚持和发展中国特色社会主义的必由之路。A/C/D 错误：党的领导/正确领导/自我革命不符。", "1974": "A 正确：数据速率2048kBps、QPSK/FEC(3/4)时占用带宽约1911.47kHz（符号率×1.2关系）。B/C/D 错误：2048/3822/2867不符。", "1975": "B 正确：总功率46dBm、2天线时单天线功率为43dBm（46-3）。A/C/D 错误：46/49/40不符。", "1976": "A 正确：城区站点单扇区覆盖半径1km，站间距应该是1.5km（C型布局）。B/C/D 错误：1/2/0.5不符。", "1977": "C 正确：加强应急管理体系和能力建设，既是一项紧迫任务，又是一项长期任务。A/B 错误：仅紧迫/仅长期不符。", "1978": "A 正确：加强海内外中华儿女大团结，形成同心共圆中国梦的强大合力。B/C 错误：齐心/全心不符。", "1979": "D 正确：加强理想信念教育，引导全党牢记党的宗旨，解决好世界观人生观价值观总开关问题。A/B/C 错误：共产主义/思想理论/初心使命不符。", "1980": "D 正确：加密技术不能实现基于IP头信息的包过滤（包过滤是防火墙功能）。A/B/C 正确：数据完整性/身份认证/机密文件加密均可由加密实现。", "1981": "A 正确：推进实践基础上的理论创新，首先要把握好新时代中国特色社会主义思想的世界观和方法论。B/C/D 错误：丰富内容/结构特征/时代意义不符。", "1982": "C 正确：自由空间损耗与频率平方成正比，频率增加一倍损耗增加6dB（20lg2）。A/B/D 错误：增加3/减小3/减小6不符。", "1983": "B 正确：计算机病毒是一段特制的程序。A/C/D 错误：芯片/生物病毒/命令不符。", "1984": "D 正确：计算供电系统全程压降以蓄电池组成输出端为起点至负载端整个配电回路压降。A/B/C 错误：开关电源输出端/配电回路输出端/列头柜不符。", "1985": "D 正确：集团配置大型CDMA通信车18米天线卫星传输系统天线发射增益大于46.5dBi。A/B/C 错误：49.5/23.5/54.5不符。", "1986": "A 正确：CDM-625L输出频率范围是950-1700MHz（L波段中频）。B/C/D 错误：50-180MHz/12-12.75GHz/14-14.5GHz不符。", "1987": "C 正确：集群通信是共享资源的无线电指挥调度通信系统。A/B/D 错误：独占频率/设施/覆盖不符。", "1988": "A 正确：激光的调制方式不包括调色（含调幅/调相/调频）。B/C/D 错误：调幅/调相/调频均为调制方式。", "1989": "A 正确：基站用空调节流装置一般是毛细管。B/C/D 错误：膨胀阀/节流管/四通阀不符。", "1990": "C 正确：基站小区内不同扇区之间的切换属于更软切换。A/B/D 错误：硬/软/内切换不符。", "1991": "C 正确：基站无线信号最远到达距离主要由天线高度决定。A/B/D 错误：频率/相位/倾角不符。", "1992": "C 正确：基站登高作业前根据塔形以塔基为圆心设定半径15-30米的范围。A/B/D 错误：10-20/10-30/15-40不符。", "1993": "A 正确：基站天线可分为定向天线和全向天线。B/C/D 错误：八木/螺旋/平板不符。", "1994": "B 正确：双极化天线多采用±45°双线极化。A/C/D 错误：±30/±90/±120不符。", "1995": "B 正确：基站天线按水平方向图特性分类可分为全向天线与定向天线。A/C/D 错误：下倾可调/65度90度/120度30度不符。", "1996": "A 正确：基站使用馈线的阻抗是50欧姆。B/C/D 错误：75/120/150不符。", "1997": "C 正确：基站设备直接受BSC控制，MSC负责交换。A/B/D 错误：MSC/HLR/自身控制不符。", "1998": "C 正确：基站设备GPS接收机中心频率是1577.42MHz（题库标准，1575.42为GPS L1常见值）。A/B/D 错误：1474.52/1575.42/1757.52不符。", "1999": "B 正确：基站交流引入侧应安装浪涌抑制器，雷击告警经转换接点纳入集中监控。A/C/D 错误：电流检测器/电压检测器/都不是不符。", "2000": "B 正确：基站内监控信号线可以不必经走线架。A/C/D 错误：传输线/电池线/馈线需走线架。", "2001": "C 正确：基站内日光灯不宜安装在设备正上方（易漏水/维修影响设备）。A/B 错误：天花板/墙角不符。", "2002": "A 正确：基站内部应至少提供1个二孔、1个三孔的电源插座，前端有漏电保护。B/C/D 错误：2/3/4不符。", "2003": "A 正确：基站监控告警输出线端子接至BTS。B/C/D 错误：电源开关/蓄电池/BSC不符。", "2004": "A 正确：基站与MS、BSC的接口按顺序是Um接口、ABIS接口。B/C/D 错误：接口顺序不符。", "2005": "A ）。A/C/D 错误：数字频分/空分/码分不符。", "2099": "C 正确：国际卫星通信地球站C类站工作频段为11/14GHz（Ku）。A/B/D 错误：4/6、7/9、16/19不符。", "2100": "B 正确：国际卫星通信网要求天线馈源的轴比小于等于1.06。A/C/D 错误：1/1.25/1.3不符。", "2101": "A 正确：烟雾的能见度定义为不足1km（A表述正确）。B/C 错误：薄雾1-3km/霾3-5km不符。", "2102": "A 正确：国际标准大气的定义是海平面附近常温常压下空气的特性（A表述符合题库）。B/C 错误：定义不符。", "2103": "C 正确：规定的安全网承重标准为160kg。A/B/D 错误：120/140/180不符。", "2104": "B 正确：广播风暴产生于存在环路的情况下端口反复转发广播帧形成环路风暴。A/C/D 错误：ARP报文/站点太多/交换机坏不符。", "2105": "B 正确：三层网络出现环路不会产生广播风暴（路由器隔离广播域）。A/C/D 错误：二层环路/卫星星上环路测试/网线连接同一交换机两口均会产生广播风暴。", "2106": "A 正确：广播报文目的MAC地址是FFFFFFFFFFFF。B/C/D 错误：0/255.255.255.2/0.0.0.0不符。", "2107": "C 正确：光信号在光纤中传播利用光的全反射原理。A/B/D 错误：折射/反射/透色不符。", "2108": "A 正确：光线路终端英文缩写为OLT。B/C/D 错误：ONU/OAN/OAS不符。", "2109": "B 正确：光纤通信中需从主传输信道取出一部分光作测试用时用光耦合器。A/C/D 错误：光衰减器/光隔离器/光纤连接器不符。", "2110": "A 正确：光纤通信以光波为载体、光纤为传输媒体的通信方式。B/C/D 错误：电信号/微波/卫星不符。", "2111": "D 正确：光纤通信系统常用光源主要有半导体激光器、半导体发光二极管。A/B/C 错误：光检测器光放大器/PIN APD/激光器光电检测器不符。", "2112": "A 正确：光纤数字通信系统不能传输HDB3码的原因是光源不能产生负信号光（光只有0/1无负电平）。B/C/D 错误：长连1/编码器复杂/码率冗余不符。", "2113": "B 正确：光纤色散会限制传输距离（脉冲展宽）。A/C/D 错误：带宽变宽/提高容量/提高质量不符。", "2114": "C 正确：光纤接入网英文缩写为OAN（Optical Access Network）。A/B/D 错误：OLT/ONU/OAS不符。", "2115": "A 正确：光纤纤芯折射率n1比包层折射率n2稍大（全反射条件）。B/C/D 错误：稍小/相等/不确定不符。", "2116": "C 正确：光纤的色散是引起带宽变窄的主要原因，限制传输容量。A/B/D 错误：损耗/自相位调制/交叉相位调制不符。", "2117": "B 正确：光网络单元英文缩写为ONU。A/C/D 错误：OLT/OAN/AON不符。", "2118": "A 正确：光缆型式分类代号GY表示通信用室（野）外光缆。B/C 错误：特殊光缆/海底光缆不符。", "2119": "C 正确：光缆弯曲半径应不小于外径的15倍，施工过程中应不小于20倍。A/B/D 错误：倍数组合不符。", "2120": "A 正确：光缆通信线路“三防”保护包括防强电、防雷、防电化学腐蚀。B/C 错误：防盗组合不符。", "2121": "A 正确：光缆熔接接头损耗为0.1dB/点。B/C/D 错误：0.2/0.3/0.4不符。", "2122": "B 正确：光缆临时放置路边或横跨水面，在50-100米范围内做好警示标志并派人值守。A/C/D 错误：范围不符。", "2123": "D 正确：光缆吊线跨越主要街道净高交越不低于5.5米。A/B/C 错误：4/4.5/5不符。", "2124": "B 正确：光缆静止状态弯曲半径不小于外径20倍，施工过程中不小于30倍。A/C 错误：倍数组合不符。", "2125": "D 正确：光缆弯曲半径应≥光缆外径的20倍。A/B/C 错误：30/40/10不符。", "2126": "C 正确：光交设备指光接头盒和光交接箱。A/B/D 错误：光交接箱/光接头盒/ONU不符。", "2127": "D 正确：光（电）缆盘短距离滚动时应按缆盘上的逆转方向滚动。A/B/C 错误：同方向/逆方向/顺转不符。", "2128": "D 正确：贯彻新发展理念是新时代我国发展壮大的必由之路。A/B/C 错误：理论/战略/思想不符。", "2129": "B 正确：贯彻总体国家安全观，国家安全领导体制和法治体系、战略体系、政策体系不断完善。A/C 错误：国家总体安全观/国家安全总体观不符。", "2130": "A 正确：60KHz子载波间隔比30KHz子载波间隔的符号时长更短（A表述正确）。B/C/D 错误：CP长度/每种对应普通CP/每种SCS不符。", "2131": "D 正确：虚拟软切换能提供与软/更软切换类似的分集增益（D表述错误），本题选错误项。A/B/C 正确：针对前向链路/每时隙只与当前服务扇区通信/降低切换信令开销均正确。", "2132": "D 正确：读取PCH用于获得其它小区信息描述错误（应读BCH/SIB），本题选错误项。A/B/C 正确：小区搜索取同步/检PSCH获5ms定时/检SSCH获帧定时无线帧号均正确。", "2133": "C 正确：PDSCH与PBCH不能在同一子帧的描述不正确（可共存），本题选不正确项。A/B/D 正确：PDSCH/PMCH/PDCCH等信道描述均正确。", "2134": "C 正确：空闲态可以通过切片和5QI映射驻留（C表述错误），本题选错误项。A/B/D 正确：指派目标业务驻留/切片间容量负荷均衡/业务态系统间不同5QI均可均正确。", "2135": "A 正确：RJ45水晶头1、3和2、6交换的说法错误（A表述为错误做法），本题选错误项。B/C 正确：标准网线RJ45水晶头管脚定义/直连网线1、3和2、6交换均正确。", "2136": "A 正确：铁塔安装螺丝穿向垂直方向由下向上、水平方向由内向外。B/C/D 错误：穿向不符。", "2137": "D 正确：驻波比过高不会损坏RRH的说法不正确（会损坏），本题选不正确项。A/B/C 正确：驻波比过大影响覆盖/不同时间测试不同/测试过高会在设备处体现均正确。", "2138": "B 正确：可以用dBi为单位表示，用dB为单位表示说法错误（增益单位不是dB），本题选错误项。A/C/D 正确：dBi单位/增益越高接收信号越强/表征信号放大能力均正确。", "2139": "A 正确：矢量距离算法不会产生路由环的说法错误（会产生计数到无穷问题），本题选错误项。B/C/D 正确：靠传递路由信息/矢量表示/只从邻居获得路由信息均正确。", "2140": "D 正确：OptiX设备与其他厂家的设备对接时需按标准接口协议进行配置对接（D表述正确）。A/B/C 错误：描述不符。", "2141": "B 正确：最大允许配置EUTRAN外部小区的说法错误（有上限限制），本题选错误项。A/C/D 正确：EUTRAN外部小区添加配置/外部小区频点/X2建链请求学习邻区均正确。", "2142": "C 正确：民用航空器使用禁区应按国家规定经批准后方可飞入。A/B 错误：绝对不得飞入/目视气象条件飞入不符。", "2143": "C 正确：民用航空器使用禁区按照国家规定经批准后方可飞入。A/B 错误：绝对不得飞入/目视条件飞入不符。", "2144": "A 正确：DUMETER使用场景是无线信号测试（A表述有误），本题选错误项。B/C/D 正确：Wireshark抓包/迅雷数据卡下载/FTP数据卡下载均正确。", "2145": "B 正确：理想的核心层传送网架构描述：PTN+WDM/NG OTN、网状网MESH化、加载控制平面G-MPLS实现均正确（其他选项说法均正确）。A/C/D 错误：单项不完整。", "2146": "D 正确：空间复用UE通过测量下行参考信号估计下行无线信道质量。A/B/C 错误：同步信号/探测参考信号/PDCCH不符。", "2147": "D 正确：电机、变压器、开关设备、照明…说法错误（均应接地），本题选错误项。A/B/C 正确：带电部分接地/不带电部分接地/经保护接地线与接地体连接均正确。", "2148": "C 正确：机翼上表面的弯度大于下表面（上凸下平产生升力）。A/B 错误：上下弯度相同/上小下大不符。", "2149": "C 正确：美国格鲁门公司设计的75…说法错误（格鲁门无75系列垂直起降），本题选错误项。A/B 正确：垂直姿态安装/配垂直起飞发动机均正确。", "2150": "A 正确：多普勒频偏与速度成正比（fd=v×cosθ×f/c）。B/C/D 错误：与频率成反比/与距离关系/以上都正确不符。", "2151": "B 正确：一级分光适用于密集型布局（用户集中）。A/C/D 错误：二级分光PON口利用率/一级分光分布灵活/二级分光易于维护不符。", "2152": "D 正确：非结构化仿真能够解决非帧模式的E1/T1业务仿真（D表述正确）。A/B/C 错误：E1业务流CAS/识别TDM帧结构/都不对不符。", "2153": "D 正确：二层转发通过自动学习和老化机制进行转发。A/B/C 错误：基于目的MAC学习/源MAC转发/表中不含地址不符。", "2154": "C 正确：NTP对时周期设置越短越好说法错误（过短增加负担），本题选不正确项。A/B/D 正确：NTP端口123/GPS作UTC时间源/多NTP服务器主备冗余均正确。", "2155": "D 正确：定义eCPRI接口的意义是降低前传数据带宽速率。A/B/C 错误：提升频谱效率/降低时延/提升空口速率不符。", "2156": "D 正确：现有室分DAS系统完全满足5G演进的说法错误（不满足），本题选错误项。A/B/C 正确：设备复杂线缆困难/居民警惕性强/DAS单路改双路成本均正确。", "2157": "D 正确：专有承载一定是GBR承载的说法错误（专有承载可以非GBR），本题选错误项。A/B/C 正确：默认承载类似一次PDN连接/专有承载类似二次PDN连接/默认承载一定Non-GBR均正确。", "2158": "B 正确：北向接口一定与CLI一样具有（同构）的说法错误，本题选错误项。A/C/D 正确：上北下南/使用约定协议对接/北向接口不是人机接口均正确。", "2159": "A 正确：UPS电池容量选择越大越好的说法错误（过度配置浪费），本题选不正确项。B/C/D 正确：额定输出容量选择/工程实施可行方便/整体配电设计均正确。", "2160": "A 正确：UPS中线电流通常较小、电缆线径可减半的说法错误（中线可能很大），本题选不正确项。B/C/D 正确：保护地线为相线0.5倍/交流输入旁路输出中线/直流电缆选型考虑压降均正确。", "2161": "C 正确：天线端口数必须等于层数的说法错误（端口数可大于层数），本题选错误项。A/B/D 正确：上行支持多层数据/最大8层2码字/端口数可大于层数均正确。", "2162": "D 正确：E-NodeB间的接口为S1的说法错误（E-NodeB间为X2接口），本题选不正确项。A/B/C 正确：E-UTRAN用E-NodeB/节点间接口用IP/IMS承载综合业务均正确。", "2163": "B 正确：GPS天线的正确说法是接收、放大GPS信号（不发射）。A/C/D 错误：发射GPS信号不符。", "2164": "D 正确：CWDM通道间隔小于DWDM的说法错误（CWDM间隔20nm远大于DWDM），本题选错误项。A/B/C 正确：CWDM平坦度要求低/无电中继距离短/单板速率低均正确。", "2165": "D 正确：SCS 30kHz对应每时隙符号数等的描述（D表述不准确），本题选不正确项。A/B/C 正确：30kHz对应的符号时长/每帧时隙数/每时隙符号数均正确。", "2166": "B 正确：民用航空器只能具有一国国籍。A/C 错误：可不登记/租赁不能登记不符。", "2167": "B 正确：当模块输出电流在半载或半载以上时均流（B表述正确）。A/C 错误：完全相等/仅浮充均流不符。", "2168": "B 正确：爱尔兰是衡量话务量的唯一单位的说法错误（还有其他单位），本题选错误项。A/C/D 正确：1爱尔兰=1小时资源被占用/无量纲/单资源话务量≤1均正确。", "2169": "B 正确：关键信息基础设施运营者应当每年对其网络安全和可能存在的风险进行检测评估。A/C/D 错误：两年/半年/季度不符。", "2170": "D 正确：挂接蓄电池组时将整流器输出电压调到与蓄电池电压一致后再接入。A/B/C 错误：正常电压/均充电压/停机不符。", "2171": "A 正确：只要能够排除故障可采取任何措施的说法错误（需按流程），本题选错误项。B/C/D 正确：多处故障按重要性/先外后内/经业务部门确认均正确。", "2172": "C 正确：网络接入设备共享、核心网独立是MOCN共享方式。A/B/D 错误：基础设备共享/漫游/GWCN不符。", "2173": "B 正确：功率因数是功功率与视在功率的比值。A/C/D 错误：视在无功/最大功率/无功功率不符。", "2174": "C 正确：10W等于40dBm（10lg10000=40）。A/B/D 错误：20/30/50不符。", "2175": "C 正确：功带平衡指使用转发器功率与总功率的比值等于租用带宽与转发器总带宽的比值。A/B/D 错误：大于/小于/无关联不符。", "2176": "C 正确：市（地）级网络中断、重要通信枢纽楼遭破坏造成本地网通信大面积中断属Ⅲ级预警。A/B/D 错误：Ⅰ/Ⅱ/Ⅳ不符。", "2177": "C 正确：公司和各基层单位的安全领导小组负责本单位的消防工作。A/B/D 错误：安全生产部门/分管领导/总经理不符。", "2178": "C 正确：公式L=Wg都不适用（升力公式为L=1/2ρV²SCL，非L=Wg）。A/B 错误：下滑/爬升不符。", "2179": "B 正确：工作地和防雷地在地网上的引接点相互距离不应小于5米。A/C/D 错误：4/6/8不符。", "2180": "B 正确：工信部批准中国电信5G试验频段为3400-3500MHz。A/C/D 错误：2515-2675/3500-3600/4800-4900不符。", "2181": "C 正确：工信部宽带VSAT网主控站设在上海和北京。A/B/D 错误：上海/北京/广州不符。", "2182": "A 正确：工会依法组织职工参加安全生产民主管理和民主监督，维护职工在安全生产方面的权益。B/C/D 错误：权利/义务/利益不符。", "2183": "B 正确：工单处理合格率主要考察工单回复规范性。A/C/D 错误：及时性/准确性/真实性不符。", "2184": "C 正确：跟踪接收机的主要特点是频带窄。A/B/D 错误：增益高/频带宽/精度高不符。", "2185": "B 正确：LTE从空闲态到激活态时延100ms，零负载用户面时延5ms。A/C/D 错误：时延组合不符。", "2186": "B 正确：高压输电线距35KV高压电力线设备应大于100米。A/C/D 错误：50/150/200不符。", "2187": "C 正确：我国最低就业年龄为16周岁（特种行业除外）。A/B/D 错误：14/15/18不符。", "2188": "D 正确：不定时工时制不实行加班加点工资制度。A/B/C 错误：标准/计件/综合工时制均实行。", "2189": "B 正确：各级各类学校应当把应急知识教育纳入教学内容。A/C/D 错误：互救/防控/自救知识教育不符。", "2190": "A 正确：按电场矢量取向天线极化分线极化、圆极化（椭圆极化含其中），A表述正确。B/C/D 错误：圆极化/椭圆极化/都不是不符。", "2191": "C 正确：旁瓣的存在是天线固有特性，不能完全消除。A/B/D 错误：极化隔离度/半功率波束/噪声温度不符。", "2192": "C 正确：机翼升力来自下表面的正压和上表面的负压。A/B 错误：上下正压/下负上正不符。", "2193": "A 正确：凡在坠落高度离基准面2m以上有可能坠落的高处进行的作业均称高处作业。B/C/D 错误：3/4/10不符。", "2194": "B 正确：云满天时云量为8。A/C 错误：12/10不符。", "2195": "B 正确：伯努利定律气流速度增大的地方压强减小。A/C 错误：增大/不变不符。", "2196": "D 正确：SPD冲击通流容量一般大于标称放电电流的2.5倍。A/B/C 错误：1.5/2/2.25不符。", "2197": "B 正确：OTU完成SDH业务侧光接口转换为符合ITU-T G.692建议的光接口。A/C/D 错误：G.691/G.693/G.694不符。", "2198": "D 正确：测试中继段光纤总衰耗的方法是切断法（后向法）。A/B/C 错误：两点法/插入法/OTDR法不符。", "2199": "A 正确：5G基站和UPF分别与STN A/B设备对接，用户数据流需绕经承载网。B/C/D 错误：传输网/接入网/核心网不符。", "2200": "A 正确：预警级别四级对应红、橙、黄、蓝。B/C/D 错误：颜色组合不符。", "2201": "B 正确：应对突发事件工作原则是预防为主、预防与应急相结合。A/C/D 错误：处置为主/预防为辅/处置并重不符。", "2202": "D 正确：工地堆放机具材料应选择不妨碍交通行人的地点，堆料高度不超过1.5m。A/B/C 错误：1/1.2/1.3不符。", "2203": "B 正确：根据“谁主管、谁负责”原则，车辆安全推行全面行车安全责任制。A/C/D 错误：管理/使用/购买不符。", "2204": "C 正确：根据突发事件影响范围、危害程度及通信保障任务重要性设定四个通信保障等级。A/B 错误：紧急事件/公共卫生事件不符。", "2205": "B 正确：各专业应急机构每年至少组织一次安全生产事故灾难应急救援演习。A/C/D 错误：月/半年/季度不符。", "2206": "D 正确：涉及密级图纸资料文件应严格管理，人员应熟悉并严格执行安全保密规定。A/B/C 错误：法律法规/管理制度/管理办法不符。", "2207": "B 正确：各种吊拉绳索和钢丝绳应在使用前进行检查。A/C/D 错误：使用中/使用后/购买时不符。", "2208": "A 正确：执行重大社会活动、突发事件应急通信保障任务需采用卫星上海落地方式开通应急通信指挥调度系统。B/C/D 错误：电话/邮件/以上都是不符。", "2209": "A 正确：各省公司参照集团飞行检查流程每年组织至少1次省内飞行检查。B/C/D 错误：2/3/4不符。", "2210": "A 正确：各类配套附属设备安装必须符合规范要求，连接安装时不得影响电路质量。B/C 错误：电路包装/电路数量不符。", "2211": "C 正确：各类电器设备和线路安装必须符合国家标准和规范。A/B/D 错误：行业/企业/自定不符。", "2212": "B 正确：各基础电信运营企业作为国家应急通信保障任务的主要承担单位。A/C/D 错误：次要/重要/必要不符。", "2213": "B 正确：各基础电信运营企业应不断加强通信保障应急队伍的建设。A/C/D 错误：光缆干线/应急设备/应急车辆不符。", "2214": "B 正确：针对可能发生的突发事件完善预测预警机制，开展风险分析，早发现早报告早处置。A/C/D 错误：信息报告/信息发布/评估不符。", "2215": "A 正确：各单位主要负责人每年安全生产检查不少于1次。B/C 错误：2/4不符。", "2216": "C 正确：各单位内部应急通信保障力量不足时由单位总部向工业和信息化部提出支援申请。A/B 错误：当地管局/当地保障队伍不符。", "2217": "C 正确：各单位根据“谁使用、谁管理、谁负责”原则负责管辖区域内安全生产等工作。A/B 错误：三同时/管生产必须管安全不符。", "2218": "A 正确：各单位部门安全员对职责范围内生产安全状况进行每周定期检查。B/C/D 错误：每月/每季/每年不符。", "2219": "A 正确：各大区范围的演练至少每年组织1次。B/C/D 错误：2/3/4不符。", "2220": "A 正确：VSAT小站仅与主站直接联系、小站间不能直接通信的网络结构是星形网。B/C/D 错误：网状/混合/链状不符。", "2221": "A 正确：个人发现网络运营者违法收集使用其个人信息的，有权要求删除。B/C/D 错误：更正/保护/撤销不符。", "2222": "C 正确：个别用户追求小口径天线也会造成邻星下行干扰（大波束干扰邻星）。A/B/D 错误：上行/上下行/不受干扰不符。", "2223": "A 正确：隔离开关用于隔离检修设备与高压电源。B/C/D 错误：低压/交流/直流不符。", "2224": "C 正确：格里高利天线旋转抛物面的焦点是实焦点（主反射面焦点）。A/B/D 错误：前/后/虚焦点不符。", "2225": "A 正确：高压线遭雷击落地时逃离正确方法是双脚并拢，跳着离开危险地带（避免跨步电压）。B/C/D 错误：跨开双脚/趴地/快跑不符。", "2226": "C 正确：高压发电机组通过装设接地保护实现单相接地保护。A/B/D 错误：电流速断/过负荷/纵联差动不符。", "2227": "B 正确：高压断路器具有开断正常负荷和过载、短路故障的能力。A/C 错误：仅过载/仅短路不符。", "2228": "B 正确：高压操作时应使用绝缘防护工具，注意人身安全和设备安全。A/C/D 错误：高压电笔/高压电棒/绝缘手套不符。", "2229": "B 正确：高校园区在室分规划中属于容量受限场景。A/C/D 错误：覆盖/干扰/终端受限不符。", "2230": "C 正确：高温场所防中暑应多饮含盐清凉饮料最好（补充盐分水分）。A/B/D 错误：纯净水/汽水/白开水不符。", "2231": "D 正确：高速公路同方向2条车道，左侧车道最低车速为每小时100公里。A/B/C 错误：60/80/90不符。", "2232": "A 正确：高清视频编码器DVB-S2调制编码方式包括8PSK和QPSK。B/C/D 错误：DBSK/OPSK/16APSK不符。", "2233": "D 正确：高清视频编码器DVB-DSNG调制编码方式包括8PSK和16QAM（16）。A/B/C 错误：4/8/12不符。", "2234": "B 正确：高清监控摄像头视频监控数据专线接入带宽需求范围是8M～12M。A/C/D 错误：1-2/2-6/6-8不符。", "2235": "D 正确：高清编码器音频源可选模拟、数字、嵌入信号（以上都可以）。A/B/C 错误：仅一项不完整。", "2236": "A 正确：高频开关电源二次下电功能的作用是避免蓄电池组过放电（两级下电保护电池）。B/C/D 错误：保护整流器/切断次要负载/电压告警不符。", "2237": "B 正确：高空作业现场安全标志必须醒目，并得到妥善保护。A/C/D 错误：必要/应当/应该不符。", "2238": "D 正确：高空作业必须严格按照高空作业操作规程执行，对作业人员进行安全技术教育及交底。A/B/C 错误：规程名称不符。", "2239": "C 正确：高空飞行按高度区分为6000米（含）至12000米（不含）。A/B 错误：4500-9000/8000-12000不符。", "2240": "A 正确：高阶调制对信号质量（信噪比）要求较高。B/C/D 错误：带宽/效率/载干比不符。", "2241": "A 正确：高度超过20米后没有地面效应的影响。B/C 错误：25/30不符。", "2242": "C 正确：高处作业应有专人在地面守护，守护人员在杆根半径3m以外。A/B/D 错误：1/2/4不符。", "2243": "C 正确：高处作业应使用绝缘梯或高凳，严禁脚踩铁架机架电缆走道。A/B/D 错误：木梯/人字梯/升降梯不符。", "2244": "B 正确：干粉灭火器喷射距离为4-5m。A/C/D 错误：2-4/4-6/5-6不符。", "2245": "B 正确：杆线与其它线路交越的地方应有三线保护装置。A/C 错误：避雷装置/夜光标志不符。", "2246": "C 正确：室外温度超过40度时原则上可要求不进行杆塔作业。A/B/D 错误：35/37/45不符。", "2247": "D 正确：杆上作业安全带后围杆绳放置位置应在距杆梢50厘米以下。A/B/C 错误：10/20/150不符。", "2248": "C 正确：杆上有人作业时距杆根半径3m内不得有人。A/B/D 错误：1/2/4不符。", "2249": "B 正确：保安带放置位置应在距杆梢下面50厘米处。A/C/D 错误：30/80/100不符。", "2250": "B 正确：杆距大于120米以上应做辅助吊线，辅助吊线应比主吊线大一程式。A/C/D 错误：150/100/80不符。", "2251": "D 正确：复用段保护倒换依靠APS协议完成保护倒换。A/B/C 错误：K1K2字节/ECC/TCP-IP不符。", "2252": "C 正确：障碍物反射造成某一点信号矢量和为零称瑞利衰落（快衰落）。A/B/D 错误：路径损耗/对数正态衰落/时间色散不符。", "2253": "C 正确：负载能量100%由逆变器提供的UPS是在线式UPS。A/B/D 错误：后备式/互动式/DELTA变换式不符。", "2254": "D 正确：腐败是危害党的生命力和战斗力的最大毒瘤，反腐败是最彻底的自我革命。A/B/C 错误：敌人/隐患/危险不符。", "2255": "A 正确：符号关断建议开启情形包括低负荷区域（节能）。B/C/D 错误：高负荷/分散/时延不敏感不符。", "2256": "C 正确：non-DRX模式下服务小区下行链路质量监控每个无线帧至少评估一次。A/B/D 错误：时隙/子帧/符号不符。", "2257": "A 正确：DRX模式下UE物理层在每个DRX期间至少评估一次。B/C/D 错误：二/三/四次不符。", "2258": "A 正确：局地风向不断改变、风速一阵大一阵小的现象称为风的阵性。B/C 错误：风切变/风向不定不符。", "2259": "A 正确：方波由无穷多个奇次谐波组成（奇谐函数）。B/C/D 错误：偶次/奇偶/高次不符。", "2260": "C 正确：分体空调连接管多余部分盘成环状目的是防止管子弯扁。A/B/D 错误：美观/增加强度/减小强度不符。", "2261": "B 正确：分散供电最大的优点是节能（缩短馈线减少损耗）。A/C/D 错误：环保/便于管理/电流小不符。", "2262": "A 正确：分配给中国电信的5G频段是3.4~3.5GHz。B/C/D 错误：3.5-3.6/4.8-4.9/2.515-2.675不符。", "2263": "B 正确：分集技术的含义是分散传输、集中处理。A/C/D 错误：组合不符。", "2264": "A 正确：分插复用器用ADM表示。B/C/D 错误：TMN/TM/DXC不符。", "2265": "D 正确：废气涡轮增压器实际上是一种空气压缩机。A/B/C 错误：空气过滤器/增温机/机油增压机不符。", "2266": "C 正确：非线性器件在过饱和区输出功率将大大降低（增益压缩）。A/B/D 错误：增大/保持不变/无规律不符。", "2267": "C 正确：非线性负载对柴油机输出功率的影响为降低输出功率。A/B/D 错误：无影响/增大/不确定不符。", "2268": "A 正确：非全日制用工双方当事人可以订立口头协议。B/C/D 错误：不得口头/必须书面/不得书面不符。", "2269": "B 正确：非倾斜轨道指轨道与赤道平面夹角为0度（赤道轨道）。A/C/D 错误：90/大于90/0-80不符。", "2270": "A 正确：非零色散位移单模光纤也称G.655光纤，为波分复用系统设计。B/C/D 错误：G.653/G.652/G.654不符。", "2271": "C 正确：飞行中的夜间盲点指视网膜的中央凹。A/B 错误：视神经出入处/晶状体功能障碍不符。", "2272": "B 正确：飞行中扰流板伸出阻挡气流流动增大阻力（也减小升力）。A/C 错误：增大面积/抬头力矩不符。", "2273": "B 正确：飞行速度增大一倍，阻力增大为原来的四倍（D∝V²）。A/C 错误：四分之一/二倍不符。", "2274": "D 正确：DJI GO中飞行器直播功能在通用设置按键打开。A/B/C 错误：相机参数/拍照录像/高级辅助不符。", "2275": "A 正确：飞行教员合格证申请人必须年满18周岁。B/C 错误：20/21不符。", "2276": "C 正确：飞行安全高度是避免航空器与地面障碍物相撞的最低飞行高度。A/B 错误：航图网格/最低飞行安全高度不符。", "2277": "A 正确：飞控子系统必须具备无人机姿态稳定与控制、无人机飞行管理等功能。B/C/D 错误：功能组合不符。", "2278": "A 正确：飞机转弯时增大迎角保持高度，原因是保持升力垂直分量不变。B/C 错误：机头转动/水平分量不变不符。", "2279": "B 正确：飞机转弯坡度有继续增大的倾向，原因是转弯外侧升力比内侧大。A/C 错误：阻力内外侧不符。", "2280": "C 正确：飞机转弯的向心力是飞机升力的水平分力。A/B 错误：拉力/方向舵气动力不符。", "2281": "C 正确：飞机着陆时使用后缘襟翼的作用是增加飞机的升力（增升）。A/B 错误：操纵灵敏性/稳定性不符。", "2282": "B 正确：飞机着陆进入地面效应区时经历诱导阻力减小的过程，需减小功率。A/C 错误：机头上仰/增大迎角不符。", "2283": "C 正确：着陆遇顺风切变，飞机空速突然减小、升力减小、下沉。A/B 错误：空速增大升力增加/高度下降空速增大不符。", "2284": "A 正确：着陆突遇逆风切变，飞机空速突然增大、升力增加、飘升。B/C 错误：高度下降空速减小/空速减小升力减小不符。", "2285": "A 正确：飞机在地面效应区时升力增大、阻力减小。B/C 错误：升力减小阻力增大/升力增大阻力增大不符。", "2286": "B 正确：飞机在比标准大气冷的空气中飞行，气压高度表所示高度比实际飞行高度低（冷空气密度大）。A/C 错误：相同/高不符。", "2287": "A 正确：飞机迎角增大，压力中心位置前移。B/C 错误：后移/不变不符。", "2288": "B 正确：飞机迎角减小，压力中心位置后移。A/C 错误：前移/不变不符。", "2289": "B 正确：飞机以一定速度逆风起飞时升力将增大（空速大）。A/C 错误：升力减小/阻力增大升力减小不符。", "2290": "C 正确：飞机水平转弯坡度增大，失速速度增大。A/B 错误：减小/不变不符。", "2291": "C 正确：飞机失速的原因是迎角超过临界迎角。A/B 错误：速度太小/太大不符。", "2292": "C 正确：飞机升力大小与空速的平方成正比（L∝V²）。A/B 错误：正比/无关不符。", "2293": "B 正确：飞机平飞遇垂直向上突风作用时升力将增大（相对迎角增大）。A/C 错误：阻力增大/升力减小不符。", "2294": "B 正确：飞机离地面高度低于一个翼展时地面效应影响开始体现。A/C 错误：半个翼展/两个翼展不符。", "2295": "A 正确：飞机积冰主要分为冰、雾凇、霜三种。B/C 错误：明冰毛冰白冰/坚冰松冰霜冰不符。", "2296": "A 正确：飞机接近失速会出现操纵迟钝和操纵效率降低。B/C 错误：机头上仰/机翼自转不符。", "2297": "A 正确：飞机过载和载荷因数是同一概念。B/C 错误：不是/不确定不符。", "2298": "C 正确：飞机螺旋的原因是飞机失速后机翼自转。A/B 错误：方向舵操纵不当/压盘过多不符。", "2299": "B 正确：飞机螺旋后最有效的制止方法是立即向螺旋反方向打舵到底制止偏转。A/C 错误：推杆改出失速/加大油门不符。", "2300": "C 正确：飞机的最大起飞重量指飞机开始起飞滑跑时的重量。A/B 错误：离地时/开始滑行时不符。", "2301": "C 正确：飞机纵向安定性有利于防止飞机抬头过高或低头过低。A/B 错误：立轴偏转/纵轴滚转不符。", "2302": "C 正确：飞机迎角是飞机翼弦与相对气流的夹角。A/B 错误：纵轴与水平面/翼弦与水平面不符。", "2303": "C 正确：飞机的压力中心是升力的着力点。A/B 错误：压力最低/最高点不符。", "2304": "B 正确：飞机下滑角是飞行轨迹与水平面的夹角。A/C 错误：升力阻力夹角/阻力重力夹角不符。", "2305": "B 正确：飞机理论升限大于实用升限（理论更高）。A/C 错误：等于/小于不符。", "2306": "C 正确：实际大气密度大于标准大气密度时，空气作用于飞机上的力要加大（升力增大）。A/B 错误：力减小/表述不符。", "2307": "C 正确：按气压式高度表飞行飞向低压区时实际高度逐渐降低（表指偏高）。A/B 错误：保持不变/升高不符。", "2308": "B 正确：放置较大工具和材料时应平放。A/C/D 错误：竖放/横放/侧放不符。", "2309": "A 正确：放全襟翼下降无人机能以较大的下降角、较小的速度下降。B/C 错误：小下降角/大速度不符。", "2310": "D 正确：放大器增益相对线性增益减少1dB所对应的点称1dB增益压缩点。A/B/C 错误：10/5/3dB不符。", "2311": "A 正确：防止用户被冒名欺骗的方法是对信息源发方进行身份验证。B/C/D 错误：数据加密/流量过滤/防火墙不符。", "2312": "A 正确：防止环网时钟对抽导致指针调整，同步时钟源配置必须选择S1字节。B/C/D 错误：K1/J1/B1不符。", "2313": "D 正确：防止合成纤维衣服静电损伤的最好方法是穿上防静电工衣并把纽扣扣好。A/B/C 错误：不洗/腕带/清洗不符。", "2314": "C 正确：防汛是在洪水预报、防洪调度、防洪工程运用等方面进行的有关工作。A/B 错误：预防汛情调度/预警汛情控制不符。", "2315": "A 正确：防雷空开的作用是防止线路着火。B/C/D 错误：保护防雷器/雷电断开防雷器/保护整流模块不符。", "2316": "B 正确：防火墙是在两个网络之间执行访问控制策略的一组硬件和软件系统。A/C/D 错误：单个网络内/VAN/网段不符。", "2317": "B 正确：防火墙过滤数据包的依据是安全策略。A/C/D 错误：数据包构成/状态监测规则/安全流程不符。", "2318": "A 正确：方位角的缩写是AZ（Azimuth）。B/C/D 错误：EL/POL/XOR不符。", "2319": "A 正确：方位角定义正北为零度，顺时针方向为正，不取负值，用指南针测量。B/C/D 错误：正东/正西/正南不符。", "2320": "C 正确：FTTH各种网络应用中按用户单元位置分为FTTC、FTTB、FTTH（FTTB为正确答案）。A/B/D 错误：FTTC/FTTO/FTTN不符。", "2321": "B 正确：影响系统运行的重要数据命令需修改操作时，需征得技术主管部门同意。A/C 错误：部门领导/分管技术领导不符。", "2322": "A 正确：法兰引入的插损0.5dB/个。B/C/D 错误：2/1/0.25不符。", "2323": "B 正确：阀控式密封蓄电池组浮充电压（单体）应为2.23-2.28V/只。A/C/D 错误：电压范围不符。", "2324": "B 正确：阀控式密封蓄电池适宜放在有空调设备的机房。A/C/D 错误：任何房间/通风房间/避阴房间不符。", "2325": "C 正确：阀控式密封蓄电池机房温度不宜超过30℃。A/B/D 错误：20/25/35不符。", "2326": "B 正确：阀控式密封铅酸电池节流阀用来排气（控压排气阀）。A/C/D 错误：排水/加水/检测不符。", "2327": "B 正确：阀控铅酸蓄电池一般采用恒压限流方式充电。A/C/D 错误：限压恒流/恒压恒流/限压限流不符。", "2328": "B 正确：阀控密封式铅酸蓄电池充电状态下壳内压力与外界压力相比要高（内压略高控压）。A/C/D 错误：一致/低/不确定不符。", "2329": "A 正确：发信功率自适应控制的缩写是ATPC（Automatic Transmit Power Control）。B/C/D 错误：AGC/HDLC/ECC不符。", "2330": "A 正确：发现危及职工生命安全情况时工会有权建议企业组织职工撤离危险现场。B/C/D 错误：停止生产/保护现场/减少工作时间不符。", "2331": "B 正确：发现人员触电应用绝缘物体拨开电源或触电者使之脱离电源。A/C 错误：手拉/铁棍拨不符。", "2332": "A 正确：发现人员触电应用绝缘物体拉开电源或触电者。B/C 错误：手拉/找电工不符。", "2333": "A 正确：发现全“1”信号设备会上报AIS告警（告警指示信号）。B/C/D 错误：LOS/OOF/LOF不符。", "2334": "C 正确：缆中若干根光纤衰减变动量都大于0.1dB/km时应迅速处理。A/B/D 错误：0.01/0.2/0.05不符。", "2335": "B 正确：高低压线断裂或跌落时必须远离10米开外，确认停电验电后才能靠近处理。A/C/D 错误：15/5/20不符。", "2336": "C 正确：电源设备起火首先要设法切断电源。A/B/D 错误：逃离/报警/呼救不符。", "2337": "B 正确：发生重大障碍若是人为偷盗、蓄意破坏或施工车辆肇事应立即报警。A/C/D 错误：鼠咬/失火/自然灾害不符。", "2338": "A 正确：发生重大生产安全事故时生产经营单位主要负责人应当立即组织抢救。B/C 错误：事故调查/追究责任不符。", "2339": "B 正确：发生泄密事件的机关单位应在发现后24小时内书面向有关保密行政管理部门报告。A/C/D 错误：12/48/72不符。", "2340": "B 正确：发生人员触电首先应采取的措施是切断电源或使伤者脱离电源。A/C 错误：呼叫救护/人工呼吸不符。", "2341": "B 正确：发生切换时PDCP会发生数据反传，保证数据不丢包。A/C/D 错误：RLC/GTPU/DMAC不符。", "2342": "B 正确：省（区、市）内范围提供通信保障但超出市（地）级能力属Ⅱ级预警。A/C/D 错误：Ⅰ/Ⅲ/Ⅳ不符。", "2343": "A 正确：发生干旱时动物尸体的最佳处理方法应是掩埋。B/C/D 错误：抛尸/分解/火化不符。", "2344": "D 正确：发生特大事故或群伤事故，事故单位主要领导、安保部门和综合部主要领导、公司有关领导应赶赴现场。A/B/C 错误：轻微/一般/重大不符。", "2345": "B 正确：发生一般事故，事故单位车辆安全管理员应迅速赶赴现场协助调查组织善后。A/C/D 错误：轻微/重大/特大不符。", "2346": "B 正确：某方向单位立体角发射功率与全向天线单位立体角发射功率的比值是天线的增益。A/C/D 错误：衰减/能力/功率不符。", "2347": "C 正确：发射天线必须与发射机功放输出阻抗相匹配。A/B/D 错误：功率/方式/电压不符。", "2348": "D 正确：TM4是Rank1传输的说法错误（TM4是闭环空间复用Rank2+），本题选错误项。A/B/C 正确：TM1单天线端口/TM2小区边缘/TM3大延迟分集均正确。", "2349": "D 正确：发射机互调产物属于杂散发射。A/B/C 错误：谐波/带外发射/非无线电设备辐射不符。", "2350": "A 正确：发射机主要作用是将所要传送信号用载波信号进行调制形成已调信号。B/C/D 错误：解调/交织/加密不符。", "2351": "D 正确：发射机谐波或杂散辐射在接收有用信号通带内造成的干扰称带外干扰。A/B/C 错误：同频/邻道/杂散辐射不符。", "192": "B 正确：修建道路、停电停水截断通信线路影响消防灭火救援时，有关单位必须事先通知。A/C 错误：事后/可以通知不符。", "193": "C 正确：星型组网满配置eBBU最多可接9个eRRU。A/B/D 错误：4/6/12不符。", "194": "C 正确：小区搜索中通过PSS（主同步信号）获得小区ID（组内ID）。A/B/D 错误：PCFICH/PHICH/SSS不符（SSS获小区组）。", "195": "B 正确：相同情况下CDMA系统容量最大（软容量、频率复用因子1）。A/C/D 错误：FDMA/TDMA容量及一样大不符。", "196": "A 正确：在线式UPS双变换指电能经过AC/DC和DC/AC两次变换。B/C/D 错误：组合不符。", "197": "A 正确：在线式UPS通常工作在市电逆变供电模式。B/C/D 错误：电池逆变/静态旁路/维修旁路为特殊模式。", "198": "D 正确：在线式UPS静态开关使用可控硅（晶闸管）器件。A/B/C 错误：IGBT/接触器/电磁开关非静态开关器件。", "199": "A 正确：在线安装蓄电池组输出电缆，测量总电压与开关电源输出电压差值，电压差小于0.5V方可连接。B/C/D 错误：1.5/2/2.5V不符。", "200": "C 正确：E-TREE业务数据透传，TREE内部通过水平分割实现（防环路广播）。A/B/D 错误：PW标签/Label标签/VLAN不符。", "201": "A 正确：干扰类型确认顺序为阻塞→互调→杂散。B/C/D 错误：顺序不符。", "202": "A 正确：下行链路中SDCCH和FACCH逻辑信道会发送切换命令。B/C/D 错误：SACCH/BCCH组合不符。", "203": "A 正确：逆温层附近或靠近雷暴时容易碰到风切变。B/C 错误：大风速/高气压不符。", "204": "C 正确：毛冰和霜对飞行影响最大（附着牢固且增重明显）。A/B 错误：雾凇毛冰/明冰毛冰影响次之。", "205": "A 正确：SGE2B单板不支持9K字节Jumbo帧。B/C/D 错误：TGE2E/TFE/SEC均支持。", "206": "A 正确：指定航路必需飞越城市上空时民用航空器可以飞越。B/C 错误：目视/夜间不符。", "207": "A 正确：光发射机调制器前附加扰码器的作用是保证传输的透明度（信号透明传输）。B/C/D 错误：控长串/在线监测/基线漂移不符。", "208": "A 正确：采用两个接收天线达到空间分集效果。B/C/D 错误：频率/时间/极化分集不符。", "209": "B 正确：RFI通常指射频干扰（Radio Frequency Interference）。A/C/D 错误：无线电发信/杂散/互调不符。", "210": "B 正确：我国原四级长途电话网中省级交换中心为C2。A/C/D 错误：C1/C3/C4不符。", "211": "C 正确：局部地区严重自然灾害或重大突发事件时，卫星通信能及时快速建立通信链路。A/B/D 错误：微波/有线/移动通信受线路破坏限制。", "212": "D 正确：我国工伤保险制度是一种社会保障制度。A/B/C 错误：责任险/商业保险/金融风险不符。", "213": "A 正确：涡阻力等于其他阻力之和的地方（诱导阻力最小点），阻力达到最小值。B/C 错误：极小值/极大值不符。", "214": "B 正确：稳定直线飞行中，空速大时必须减小迎角以产生相同升力。A/C 错误：空速小减迎角/空速大增迎角不符。", "215": "A 正确：温暖天气低空湍流很可能在路面和荒地上空发生（地表受热不均产生对流）。B/C 错误：植被区/水体区不符。", "216": "D 正确：温带热带常见疾病中，钩虫病是昆虫（钩虫幼虫经皮肤）传播的疾病。A/B/C 错误：黄热病/热肠病/坏血病不符。", "217": "B 正确：野外作业超过两天应优先准备水和粮食（生存第一需求）。A/C/D 错误：帐篷睡袋/指南针通信/背包衣服次之。", "218": "A 正确：卫星可见光云图色调取决于目标反射太阳辐射的大小。B/C 错误：温度/高低不符（红外云图看温度）。", "219": "B 正确：卫星红外云图色调取决于目标的温度。A/C 错误：反射辐射/高低不符。", "220": "A 正确：水平极化指电场矢量与赤道平面平行。B/C/D 错误：与极轴平行/垂直/磁场矢量不符。", "221": "B 正确：E1电路下行信号流程为卫星→天线→LNB→调制解调器→E1。A/C/D 错误：环节顺序不符。", "222": "A 正确：E1电路上行信号流程为E1信号→调制解调器→SSPB（上变频功放）→天线。B/C/D 错误：环节不符。", "223": "B 正确：BUC、ODU、高功放等器件都属于非线性器件（功率放大工作于非线性区）。A/C/D 错误：线性/频率变换/中频不符。", "224": "A 正确：卫星通信正常传输电话时除大传输时延外，还有回波干扰。B/C/D 错误：同频/极化/无干扰不符。", "225": "C 正确：卫星通信线路传输质量主要技术指标是载噪比（C/N）。A/B/D 错误：EIRP/G/T/天线尺寸频率不符。", "226": "C 正确：通信卫星的作用是中继转发信号。A/B/D 错误：发射/接收/广播信号不符。", "227": "A 正确：用基带信号对正弦波频率实行控制并随之变化的是频率调制（FM）。B/C/D 错误：脉码/增量/相位调制不符。", "228": "A 正确：卫星通信双程传输时延约为0.5秒（静止轨道约270ms单程）。B/C/D 错误：0.2/0.3/0.8秒不符。", "229": "A 正确：VSAT地球站室外设备是LNB（低噪声下变频器）。B/C/D 错误：调制解调器/编解码器/会议电视单元是室内设备。", "230": "D 正确：卫星俯仰计算中水平为0度。A/B/C 错误：180/90/360不符。", "231": "D 正确：IDR帧结构主要用于速率大于1.544Mb/s的基群以上传输。A/B/C 错误：2.048/1.544Mb/s阈值不符。", "232": "B 正确：外电路空载时电路中无电流流通的状态是开路状态。A/C/D 错误：通路/短路/旁路不符。", "233": "D 正确：外场飞行GPS定位需星数最少14颗（外场作业要求高精度多星冗余定位）。A/B/C 错误：4/8/12颗不足以满足外场定位要求。", "234": "C 正确：通信线路附近其他线条未辩清性质时一律按电力线缆处理。A/B/D 错误：通信/无主/其他线缆均危险。", "235": "C 正确：通信卫星用双工器实现收发共用一付天线的信号分离。A/B/D 错误：天线/极化器/滤波器不符。", "236": "A 正确：220/380V中性点直接接地系统，电力设备外壳一般接零（TN系统保护接零）。B/C/D 错误：接地/短接/复用不符。", "237": "A 正确：天线系统中完成收发信号分离的器件是双工器。B/C/D 错误：馈源/波导/极化变换器不符。", "238": "D 正确：数字微波为满足高传输质量和大容量多进制调制低干扰容限，须采用前向纠错技术。A/B/C 错误：同步/频谱/均衡不符。", "239": "A 正确：信源编码进行压缩编码，以降低传输速率。B/C/D 错误：减少误码/提高质量/提高效率不符（效率是目的，速率是手段）。", "2352": "D 正确：发挥政治巡视利剑作用，加强巡视整改和成果运用。A/B/C 错误：政治监督/党内监督/政治巡察不符。", "2353": "A 正确：发光功率测试的仪表是光功率计。B/C/D 错误：万用表/2M分析仪/光时域反射计不符。", "2354": "B 正确：发动机增压系统中冷器的作用是提高空气密度（冷却增压空气）。A/C/D 错误：提高水温/空气压力/空气温度不符。", "2355": "D 正确：发动机在风沙地区使用要特别注意燃油、空气和机油滤清器的清洁。A/B/C 错误：热带/高海拔/寒冷地区不符。", "2356": "B 正确：发动机四冲程中把热能转换成机械能的是做功冲程。A/C 错误：排气/压缩冲程不符。", "2357": "D 正确：发电至负载电缆容量不够可能造成电缆发热。A/B/C 错误：发电机停机/转速下降/断路器跳闸不符。", "2358": "D 正确：发电机组空载额定电压运行时线电压波形正弦畸变率≤5%。A/B/C 错误：1/1.5/2不符。", "2359": "B 正确：发电机组绝缘电阻值应≥2MΩ。A/C/D 错误：1/5/10不符。", "2360": "B 正确：发电机与建筑物或其它装置间必须保持1米以上间距。A/C/D 错误：2/4/3不符。", "2361": "A 正确：发电机工作频率为50Hz。B/C/D 错误：100/120/140不符。", "2362": "B 正确：发电安全作业正确操作是发电机废气排放应向顺风方向。A/C/D 错误：防盗固定/运行时油管加油/运行时加注燃油不符。", "2363": "B 正确：二十大报告提出坚定支持和帮助广大发展中国家加快发展。A/C/D 错误：不发达国家/落后地区/贫穷地区不符。", "2364": "B 正确：多轴旋翼飞行器通过改变转速控制飞行轨迹。A/C 错误：总距杆/尾桨不符。", "2365": "C 正确：电调上较细的白红黑3色排线（杜邦线）用来连接飞控。A/B 错误：电机/机载遥控接收机不符。", "2366": "C 正确：多轴的“轴”指旋翼轴。A/B 错误：舵机轴/运动坐标轴不符。", "2367": "A 正确：多旋翼飞行器GPS天线应尽量安装在飞行器顶部。B/C 错误：中心/尾部不符。", "2368": "C 正确：锂聚合物动力电池单体标称电压为3.7V。A/B 错误：1.2/11.1不符。", "2369": "A 正确：多旋翼飞行器动力电池一般为聚合物锂电池。B/C 错误：铅酸/银锌不符。", "2370": "C 正确：多旋翼飞行器使用的电调一般为无刷电调。A/B 错误：双向/有刷不符。", "2371": "A 正确：多旋翼飞行器链路天线应尽量贴合飞控和GPS天线安装（共地减少干扰，题库标准）。B/C 错误：靠近/远离不符。", "2372": "A 正确：多旋翼飞行器每个“轴”上一般连接1个电调、1个电机。B/C 错误：组合不符。", "2373": "B 正确：多旋翼飞行器控制电机转速的直接设备是电调。A/C 错误：电源/飞控不符。", "2374": "C 正确：多旋翼飞行器动力电池充电尽量选用平衡充电器。A/B 错误：便携/快速不符。", "2375": "C 正确：多旋翼飞行器遥控器一般有4个及以上通道。A/B 错误：2/3个不符。", "2376": "B 正确：多旋翼飞行器常用螺旋桨剖面形状是凹凸型。A/C 错误：对称型/S型不符。", "2377": "B 正确：多旋翼GPS定位最少达到4-5颗星才能够在飞行中保证基本安全。A/C 错误：2-3/6-7不符。", "2378": "C 正确：任意调换其中2根与电机的连接顺序，该电机反向运转。A/B 错误：停转/过热烧毁不符。", "2379": "B 正确：移动台远离基站方向移动，多普勒频移偏小（接收频率降低）。A/C/D 错误：偏大/不变/都有可能不符。", "2380": "A 正确：移动台远离基站方向移动，多普勒频移偏小（接收频率降低）。B/C/D 错误：偏大/不变/都有可能不符。", "2381": "C 正确：多模渐变折射率光纤纤芯中折射率是连续变化的。A/B/D 错误：恒定/间断/基本不变不符。", "2382": "A 正确：多路径传播的微波信号到达接收端后信号强度会波动变化（衰落）。B/C/D 错误：增强/衰减/不变不符。", "2383": "C 正确：多径效应快衰落服从瑞利分布，大气折射慢衰落服从对数正态分布。A/B/D 错误：分布对应不符。", "2384": "B 正确：多接入边缘计算英文简称为MEC。A/C/D 错误：slice/SDN/NFV不符。", "2385": "B 正确：多单元振子天线作馈源应将馈源的相位中心调试到抛物面焦点上。A/C/D 错误：反射盘/有源振子/无源振子不符。", "2386": "B 正确：定距螺旋桨活塞发动机通常用转速表反映功率。A/C 错误：进气压力表/燃油流量表不符。", "2387": "C 正确：对中频信号进行解调和解码设备是MODEM。A/B/D 错误：BUC/LNB/U-C不符。", "2388": "B 正确：同样长度同样大小馈线损耗，频率越高损耗越大：1.9G＞800M＞450M。A/C/D 错误：损耗顺序不符。", "2389": "A 正确：自发辐射是粒子从高能级跃迁到低能级自发发光。B/C/D 错误：稳定状态跃迁/低到高/吸收光子不符。", "2390": "C 正确：NSA锚点只用来进行控制面（锚点还承载数据）说法错误，本题选错误项。A/B/D 正确：簇优化前确认站点/弱覆盖天馈调整/NSA关注NR覆盖均正确。", "2391": "B 正确：系统带宽20MHz一共包括100个RB。A/C/D 错误：20/200/1200不符。", "2392": "D 正确：天线支撑体设于屋顶，专用避雷针雷电引下线和天线支撑体应在不同方向与避雷带连接。A/B/C 错误：汇流排/断接卡/地网不符。", "2393": "A 正确：数字电路通常用Eb/No表示能噪比。B/C/D 错误：G/T/C/No/C/N不符。", "2394": "A 正确：室分综合维护一级基站每月巡检两次，二级基站每季度2次。B/C/D 错误：周期不符。", "2395": "B 正确：上行失步同时有下行数据到达的随机接入场景由eNodeB触发随机接入流程。A/C/D 错误：UE/MME/S-GW不符。", "2396": "A 正确：三相五线制严禁在公共零线中安装开关或熔断器（断零危险）。B/C/D 错误：零线装开关/零线作保护地线/零线汇接排不符。", "2397": "A 正确：三相四线制保护地母线应采用黄绿色铜导线。B/C/D 错误：绿色/黑色/黄色不符。", "2398": "D 正确：全向站小区半径R，站点覆盖面积为2.6*R*R。A/B/C 错误：1.5/1.73/1.95不符。", "2399": "A 正确：全向型天线要求垂直安装；方向型天线其指向、俯仰角要符合设计文件规定。B/C/D 错误：顺序组合不符。", "2400": "D 正确：年度或多次举行的活动按下顺延一级原则处理，如两年一度的北京国际汽车展览属四类。A/B/C 错误：一/二/三类不符。", "2401": "B 正确：内部系统干扰解决措施不包括安排路测队伍排查干扰（路测针对外部干扰）。A/C/D 正确：检查天馈器件/修改频点/检查基站设备均为内部干扰措施。", "2402": "C 正确：交流供电原则尽量采用三相四线并有保护地线（错误描述为三相四线无保护），本题选错误项。A/B 正确：动力电与照明电分开/市电为主能源均正确。", "2403": "C 正确：脊柱受伤伤员应多人搬运，保持伤员身体平直。A/B 错误：一人背负/二人抱头抱脚不符。", "2404": "C 正确：管线系统内纤芯利用率过高的光缆应建立预警机制便于后期优化扩容。A/B/D 错误：为零/过低/超标不符。", "2405": "B 正确：工作岗位中可能存在的危险因素生产单位应如实告知作业人员。A/C 错误：不告诉/有选择告知不符。", "2406": "B 正确：符合节能级别标准和节能承诺的产品，网络维护部门要根据能耗标准进行测试。A/C/D 错误：有线/无线/传输标准不符。", "2407": "A 正确：聚合物锂电池单体充至4.6V是错误充电方法（应4.2V）。B/C 正确：聚合物4.2V/磷酸铁锂3.6V均正确。", "2408": "C 正确：低电压大电流直流电力线设计时线路压降是主要考虑因素。A/B 错误：发热条件/经济性不符。", "2409": "B 正确：手脚灵活可以不用带安全帽的说法不对（登高必须戴安全帽），本题选不对项。A/C 正确：穿登高鞋/定期检查身体均正确。", "2410": "B 正确：地球站圆极化极化隔离度要优于30dB。A/C/D 错误：25/35/40不符。", "2411": "D 正确：地球站发射系统发射频带宽度一般要求在500MHz以上。A/B/C 错误：800/700/600不符。", "2412": "B 正确：放下襟翼飞机升力将增大，阻力将增大。A/C 错误：增大减小/减小减小不符。", "2413": "D 正确：10km 10GE光模块收光功率-15dBm不符合要求（低于灵敏度）。A/B/C 错误：-12/-3/-9均符合。", "2414": "A 正确：常规CP单天线端口一个时隙2列RS，第一列参考信号位于第1符号。B/C/D 错误：3/5/7不符。", "2415": "D 正确：VoLTE默认承载包括qci6（或8或9）和QCI5。A/B/C 错误：组合不符。", "2416": "C 正确：VOIP信令出现pending错误是由于SS所发的信息无法识别或错误。A/B/D 错误：系统停止/端口挂起/系统繁忙不符。", "2417": "D 正确：TWTA多载波工作时总输出功率比单载波小、非线性更严重（回退）。A/B/C 错误：大非线性/小线性/大线性不符。", "2418": "B 正确：Sub6G频段5G AAU设备通常采用192个天线振子（64T64R×3）。A/C/D 错误：128/256/384不符。", "2419": "A 正确：RRU与智能天线之间跳线长度一般宜小于5米。B/C/D 错误：3/4/2不符。", "2420": "C 正确：Ku频段地球站线极化极化隔离度要优于35dB。A/B/D 错误：25/30/40不符。", "2421": "C 正确：尽可能在同一个PON口上同时（不同类型ONU）的说法错误，本题选错误项。A/B/D 正确：FTTB可汇聚/FTTH尽量独立PON口/不规划多种业务同口均正确。", "2422": "B 正确：FDD每个10ms中有10个子帧用于下行，并且有10个子帧用于上行。A/C/D 错误：5/15/20不符。", "2423": "D 正确：EVDO存在接收分集增益是因为终端可以选择双接收天线。A/B/C 错误：多接收/智能/单接收天线不符。", "2424": "C 正确：eMBB场景协议要求时延小于4ms。A/B/D 错误：1/3/10不符。", "2425": "D 正确：CDMA多址技术具有较好的（抗远近效应）说法错误（远近效应是CDMA固有缺点），本题选错误项。A/B/C 正确：抗干扰强/软容量灵活/软切换均正确。", "2426": "B 正确：90度方向性天线含义是天线的半功率角是90度。A/C/D 错误：覆盖90度/安装方向90度/都不正确不符。", "2427": "D 正确：5G NR一个无线帧占用10ms。A/B/C 错误：5/不固定/1不符。", "2428": "D 正确：48芯及以上光缆成带时，成带长度控制在30cm-40cm比较适合重复多次接续。A/B/C 错误：5-10/10-20/20-30不符。", "2429": "B 正确：40G系统G.652光纤发端不预补每级过补20km的说法错误（过补会过冲），本题选错误项。A/C/D 正确：发端预补20km/线路尽量过补偿/末端残余色散±50ps均正确。", "2430": "C 正确：24GHz信道中心频率间隔不低于25MHz。A/B/D 错误：5/20/83.5不符。", "2431": "B 正确：1个服务小区基站可通过专用RRC信令给UE配置4个DL BWP和4个UL BWP。A/C/D 错误：2/8/12不符。", "2432": "A 正确：1个服务小区基站可通过专用RRC信令给UE配置4个DL BWP和4个UL BWP。B/C/D 错误：12/2/8不符。", "2433": "D 正确：10G速率DWDM传输系统光纤理想选择是G.655（非零色散位移）。A/B/C 错误：G.651/G.652/G.654不符。", "2434": "D 正确：1+1保护的CSA和时钟板工作板软件/逻辑升级时会造成板级保护倒换（upgrade时倒换）。A/B/C 错误：倒换时机不符。", "2435": "C 正确：对有源设备技术指标调整时使用site master仪表。A/B/D 错误：频谱仪/信号源频谱仪site/信号源不符。", "2436": "A 正确：已到达使用年限且提足折旧，资产不具有或达不到实际使用效果，基于报废处理。B/C/D 错误：减值/变卖/盘亏不符。", "2437": "B 正确：BIP-8码校验奇偶性，01101101中“1”个数为5（奇校验），BIP校验码为1。A/C/D 错误：11/0/10不符。", "2438": "D 正确：微波设备环路测试本地射频环路时需关闭远端发信机。A/B/C 错误：本地基带/本地中频/远端基带环路不符。", "2439": "C 正确：天线增益dBd是一个与集中辐射有关的相对增益值（相对半波振子）。A/B/D 错误：绝对增益/无源器件无增益/全向无增益不符。", "2440": "C 正确：天线增益dBd是与集中辐射有关的相对增益值（相对半波振子）。A/B/D 错误：绝对增益/无源无增益/全向无增益不符。", "2441": "A 正确：四冲程内燃机完成一个循环冲程顺序是进气-压缩-做功-排气。B/C/D 错误：顺序不符。", "2442": "A 正确：水冷式柴油机冷却水要求是干净的软水（防结垢）。B/C 错误：硬水/两者均可不符。", "2443": "B 正确：对数据进行安全处理的协议为PDCP（加密完整性保护）。A/C/D 错误：RLC/GTPU/DMAC不符。", "2444": "A 正确：对受伤人员进行急救第一步应该是观察伤者有无意识。B/C 错误：包扎/心脏按摩不符。", "2445": "D 正确：对时延抖动最为敏感的是CES（电路仿真业务）。A/B/C 错误：LTE/WLAN/3G PS不符。", "2446": "C 正确：设备公共部分的备份方式主要是1+1。A/B/D 错误：1+0/1：N/1：24不符。", "2447": "A 正确：对三度以上冻伤者一般为30-40度的温水浸泡患处。B/C/D 错误：40-50/50-60/0-20不符。", "2448": "B 正确：对企业发生的事故坚持四不放过原则处理。A/C 错误：预防为主/三同时不符。", "2449": "A 正确：对某一个特定UE来说同时只能有1个切换准备流程进行。B/C/D 错误：2/3/4不符。", "2450": "A 正确：对流层平均气温垂直递减率为0.65℃/100m。B/C 错误：6.5/0.5不符。", "2451": "B 正确：对流层分下中上三层，中层气流相对平稳。A/C 错误：下层气流混乱/上层水汽少不符。", "2452": "C 正确：对流层下层空气运动受地形扰动和地表摩擦作用最大，气流混乱。A/B 错误：上层/中层不符。", "2453": "D 正确：对抗雨衰的设备是UPC（上行功率控制）。A/B/C 错误：LNA/AGC/MPA不符。", "2454": "D 正确：对进线柜的遥测不包括开关状态（开关状态是遥信）。A/B/C 错误：三相电压/电流/有功电度均为遥测。", "2455": "C 正确：对基带信号编码调制、对中频信号解调解码的设备是MODEM。A/B/D 错误：BUC/LNB/U-C不符。", "2456": "C 正确：对发电、高空作业等必须规范施工现场安全管理，建立警示标牌。A/B/D 错误：作业/生产/操作管理不符。", "2457": "D 正确：打开或关闭手机“5G”开关会触发跟踪区更新信令流程。A/B/C 错误：附着/上下文激活/去附着不符。", "2458": "B 正确：对柴油发电机组的遥信不包括水温（水温是遥测量）。A/C/D 错误：工作状态/市电故障/过流均为遥信。", "2459": "B 正确：上下行都是基于CSI-RS的说法错误（下行CSI-RS上行SRS），本题选错误项。A/C/D 正确：波束捕获恢复开机扫描/波束管理核心找最优波束/相控阵调移相器均正确。", "2460": "D 正确：X2切换支持系统间切换的说法错误（X2是eNB间接口不跨系统），本题选错误项。A/B/C 正确：eNB间X2接口/切换信令用X2口/源目的eNB同一MME均正确。", "2461": "C 正确：MCG Split Bearer/SCG Split Bearer设置分流模式，SCG_AND_MCG配置支持同时分流。A/B/D 错误：SCG/MCG/都不对不符。", "2462": "B 正确：对Ku波段卫星通信可靠性影响最大的气候现象是夏季长时间的瓢泼大雨（雨衰）。A/C/D 错误：干旱/沙尘暴/浓雾不符。", "2463": "A 正确：FR1频段支持的信道带宽最小5MHz、最大100MHz。B/C/D 错误：带宽范围不符。", "2464": "B 正确：DWDM系统基本结构是单纤双向传输和双纤单向传输。A/C/D 错误：组合不符。", "2465": "D 正确：25Gbit/s信道PMD不能超过40ps，10Gbit/s不能超过10ps。A/B/C 错误：数值组合不符。", "2466": "A 正确：2048Kbit/s比特率长期平均误码率不应大于4.5×10⁻⁶（45574对应表述）。B/C/D 错误：数值不符。", "2467": "B 正确：短路是由于绝缘损坏等原因造成线路相碰引起电流突然增大的现象。A/C/D 错误：短路/燃烧/开路不符。", "2468": "A 正确：短波通信的天线阻抗为50欧姆。B/C/D 错误：60/80/100不符。", "2469": "A 正确：端到端逻辑网络提供网络级SLA保障及E2E安全隔离的是网络切片。B/C/D 错误：QoS/DNN/APN不符。", "2470": "D 正确：渡河前选择平稳的水域渡河。A/B/C 错误：陡峭河岸/水中障碍物/外湾急流不符。", "2471": "B 正确：独立组网是独立于基础通信网形成专网专线的方式实现应急通信能力。A/C 错误：骨干网/本地网不符。", "2472": "D 正确：毒蛇咬伤一般发生在清晨和傍晚。A/B/C 错误：中午/清晨/傍晚不符。", "2473": "A 正确：抖动的单位是UI（单位间隔）。B/C/D 错误：Hz/ppm/秒不符。", "2474": "C 正确：冻伤按其严重程度分为四度。A/B/D 错误：二/三/五不符。", "2475": "A 正确：动中通车载站卫星系统现使用的卫星频段是Ku频段。B/C/D 错误：C/KA/L不符。", "2476": "B 正确：动态SCPC采用载荷压缩技术可使业务带宽减少40%。A/C/D 错误：30/50/60不符。", "2477": "B 正确：动力环境集中监控系统不对频率异常告警进行直接监控。A/C/D 错误：市电告警/市电失相/市电过低均监控。", "2478": "A 正确：动火作业、登高作业、窨井作业和涉电作业等场所设置安全警告标志。B/C 错误：安全提示/危险提示不符。", "2479": "B 正确：定向小区一般使用正负45°双极化天线。A/C/D 错误：垂直水平双极化/垂直单极化/水平单极化不符。", "2480": "A 正确：定向天线与全向天线驻波比应分别小于1.3和1.4。B/C/D 错误：数值不符。", "2481": "A 正确：定向天线下倾角安装精确度为±1°。B/C/D 错误：±2/+2/±3不符。", "2482": "A 正确：定向天线方向角安装精确度为±5°。B/C/D 错误：±10/+10/+15不符。", "2483": "C 正确：θ1/2是天线波束半功率点宽度，指方向图中比最大辐射方向功率下降3dB的两点夹角。A/B/D 错误：1/2/6dB不符。", "2484": "D 正确：定时不良对SDH传输系统的影响是指针调整。A/B/C 错误：滑动/漂动/抖动不符。", "2485": "D 正确：订立和变更劳动合同应遵循平等自愿、协商一致的原则。A/B/C 错误：公平公正/相互约束/效率一致不符。", "2486": "A 正确：调节发电机励磁电流的目的是改变输出电压。B/C/D 错误：输出电流/频率/都不对不符。", "2487": "D 正确：调幅、单边带、调频无线电话通信带宽比较：调频>调幅>单边带。A/B/C 错误：带宽顺序不符。", "2488": "A 正确：调度时网元选择不到，不可能是网元脱管（脱管仍可选，原因排查项）。B/C/D 错误：EMS断连/数据未入库/网元名称错误均可能。", "2489": "A 正确：吊背档落差超过20%的杆距应做仰俯角辅助装置并设立人字拉线。B/C/D 错误：顺风拉/四方拉/撑杆不符。", "2490": "D 正确：电子罗盘感应磁北与地图真北之差称磁偏角。A/B/C 错误：方位角/仰角/极化角不符。", "2491": "B 正确：电子调速器英文缩写是ESC。A/C 错误：BEC/MCS不符。", "2492": "B 正确：电源工作地线和保护地线与交流中性线应分开敷设，不能相碰更不能合用。A/C/D 错误：平行/交叉/远离不符。", "2493": "C 正确：电压质量分为电压允许偏差、三相电压允许不平衡度、公网谐波、电压允许波动与闪变。A/B/D 错误：频率偏差/供电可靠性不符。", "2494": "C 正确：电信业务经营者停止经营某种业务时应提前三十日通知所涉及用户。A/B 错误：十日/二十日不符。", "2495": "C 正确：电信大型应急基站车通常采用气动类型桅杆作为主桅杆。A/B/D 错误：液压/电动/混合型不符。", "2496": "C 正确：电网谐波的产生主要在于电力系统中存在非线性元件。A/B 错误：电感电容元件/三相参数不对称不符。", "2497": "C 正确：电气线路往往由于短路、过载运行、接触电阻过大等原因产生电火花、电弧或过热造成火灾。A/B/D 错误：原因组合不符。", "2498": "B 正确：电气事故按照电路状况分为短路事故、断路事故、漏电事故等。A/C/D 错误：电气/线路/通道不符。", "2499": "C 正确：电气设备正常情况下不带电的金属部分与电网保护零线连接称作保护接零。A/B/D 错误：保护接地/工作接地/都不对不符。", "2500": "B 正确：电气设备着火切断电源后必须使用干粉灭火器，严禁使用水和泡沫灭火器。A/C/D 错误：允许/准允/可以不符。", "2501": "A 正确：电气设备着火应用二氧化碳灭火器扑救。B/C/D 错误：泡沫/水/都可以不符。", "2502": "B 正确：电气安全主要包括人身安全、设备安全。A/C/D 错误：照明/电气/空调不符。", "2503": "A 正确：电路中负荷为电阻性时恢复电压等于电源电压，有利于灭弧。B/C 错误：电感性/电容性不符。", "2504": "B 正确：电路中发生短路可能引起的危害是回路电流增大。A/C 错误：母线电压升高/导体温度下降不符。", "2505": "A 正确：电路在线测试指不中断业务进行测试。B/C/D 错误：串接测试/中断业务/环路测试不符。", "2506": "C 正确：电路发生障碍时值班维护人员应本着先本站、后外站的原则判断障碍段落。A/B/D 错误：顺序不符。", "2507": "D 正确：电路串联特点中“各电阻的电流之和为总电流”错误（串联电流相同），本题选错误项。A/B/C 正确：电流相同/电压之和/电阻之和均正确。", "2508": "B 正确：电力系统一点直接接地，设备外露可导电部分经保护地线接至与接地点无关的接地装置是TT系统。A/C 错误：IT/TN不符。", "2509": "B 正确：电力系统是由发电、输电、变电、配电和用电组成的整体。A/C 错误：组合不符。", "2510": "C 正确：中性点绝缘系统相线碰壳或接地时其他两相对地电压升高为相电压的1.732倍（√3）。A/B/D 错误：1.414/1.5/1.25不符。", "2511": "A 正确：电力生产的特点是同时性、集中性、适用性、先行性。B/C 错误：广泛性/统一性不符。", "2512": "C 正确：电离层只对短波波段的电磁波产生反射作用，天波传播用于短波远距离通信。A/B/D 错误：直射/折射/衍射不符。", "2513": "C 正确：电离层指距地面大约60公里到2000公里处于电离状态的高空大气层。A/B/D 错误：20/40/80不符。", "2514": "B 正确：电离层闪烁多发于赤道附近和高纬度地区，1GHz以下低频段较容易受影响。A/C/D 错误：0.5/1.5/2不符。", "2515": "B 正确：电离层浓度高时反射的频率高，浓度低时反射的频率低。A/C 错误：低高/高不影响不符。", "2516": "A 正确：电离层暴变是短波通信最主要的干扰，与太阳活动性的周期变化有很大关系。B/C/D 错误：地球自转/月球圆缺/星蚀不符。", "2517": "A 正确：电缆和架空线引入车间或大型建筑物处零线应重复接地。B/C/D 错误：火/地/明线不符。", "2518": "C 正确：电绝缘鞋安全性能应符合GB12011-2000国家标准，能耐不低于5KV电压。A/B/D 错误：380V/1KV/10KV不符。", "2519": "C 正确：电弧电流的本质是离子导电。A/B 错误：原子导电/分子导电不符。", "2520": "A 正确：电杆竖立垂直，直线线路个别电杆杆根偏差左右不得超过5cm。B/C/D 错误：8/10/12不符。", "2521": "B 正确：吊线在终端杆及角深大于15米的角杆上需加装角杆吊线辅助装置。A/C/D 错误：10/20/25不符。", "2522": "B 正确：直线杆横向偏差及纵向偏差不超过杆稍的三分之一即5cm。A/C/D 错误：三分之二/四分之二/四分之一不符。", "2523": "A 正确：电调上最粗的红线和黑线用来连接动力电池。B/C 错误：电动机/机载遥控接收机不符。", "2524": "A 正确：传播媒介及途径随时间变化引起接收信号强弱变化的现象称衰落。B/C/D 错误：震荡/散射/多普勒频偏不符。", "2525": "B 正确：能量随传输距离增加而扩散引起的传播损耗称自由空间传播损耗。A/C/D 错误：大气吸收/天线指向误差/极化损耗不符。", "2526": "D 正确：电磁波绕射对信号质量的影响程度与建筑物高度、宽度和频率都有关。A/B/C 错误：单一因素不符。", "2527": "B 正确：电磁波的传播速度是30万公里/秒。A/C/D 错误：20/40/50不符。", "2528": "B 正确：电磁波的波长与频率是反比关系。A/C/D 错误：正比/同等/无关系不符。", "2529": "B 正确：电池组连接完成后不马上加电，应使电源与蓄电池处于断开状态，防止蓄电池严重过放电。A 错误：连接状态不符。", "2530": "B 正确：电池在低温状态下放电，负极活性物质利用率极低。A/C/D 错误：正极/板栅/极板不符。", "2531": "B 正确：电池应避免过大或极小电流放电，放电电压不得低于蓄电池终止电压。A/C/D 错误：端电压/单个端电压/浮充电压不符。", "2532": "B 正确：电池使用环境温度高低应适当调整浮充电压，调整系数-3mV/℃。A/C 错误：-2/-1不符。", "2533": "B 正确：电池过放电指超过蓄电池规定的放电终止保护（深度放电）。A/C/D 错误：过大电流/过充电相反/完全充电后不符。", "2534": "B 正确：电池放电告警可能是电池放电设置点过高（设置过高易提前告警）。A/C/D 错误：过低/正常/都不是不符。", "2535": "B 正确：电池低温起动性能以负极板质量为控制因素。A/C/D 错误：正极板/板栅/接线端子不符。", "2536": "A 正确：电波在空中传播过程中会产生衰落现象。B/C/D 错误：增压/减压/不变不符。", "2537": "C 正确：电波在各种媒介质及其分界面传播中由于反射、折射、散射及绕射，传播方向会改变。A/B 错误：组合不符。", "2538": "B 正确：电波传播的衰落与异常与物理层没有影响。A/C/D 错误：电离层/大气闪烁/降雨均有影响。", "2539": "C 正确：典型的低噪声放大器放大倍数为60dB。A/B/D 错误：30/40/100不符。", "2540": "A 正确：第一次对路由器进行配置时采用通过console口方式。B/C/D 错误：拨号远程/FTP上传/TELNET不符。", "2541": "C 正确：第三代移动系统主要解决业务的多媒化，向个人通信目标过渡。A/B/D 错误：智能化/有效通话/认证保密不符。", "2542": "C 正确：底层居民家中的电源插座、开关等应装在离地1米以上安全地方。A/B/D 错误：0.5/0.8/1.2不符。", "2543": "A 正确：低噪声放大器一般安装在靠近天线输出处（前置低噪）。B/C/D 错误：高功放/调制解调器/信标接收机处不符。", "2544": "C 正确：低时延高可靠通信对应的是5G uRLLC应用场景。A/B/D 错误：eMBB/mMTC/mRLLC不符。", "2545": "C 正确：低频信道传播损耗组成不包括雨衰和大气影响（低频穿透强雨衰小）。A/B/D 正确：自由空间损耗/穿透损耗/衍射绕射损耗均为低频传播损耗组成。", "2546": "B 正确：低空无人机任务高度一般在100~1000m之间。A/C 错误：0-100/1000-7000不符。", "2547": "B 正确：低轨卫星绕地球一周的时间约为2小时左右。A/C/D 错误：24/12/8不符。", "2548": "C 正确：低轨道LEO卫星一般指轨道高度小于2000公里。A/B/D 错误：500/1000/5000不符。", "2549": "B 正确：低轨LEO卫星高度范围为300km到1500km，绕地球一周2~4小时。A/C/D 错误：高度范围不符。", "2550": "C 正确：登高作业严禁接近电线，特别是高压线路应保持间距2.5米以上。A/B/D 错误：2/3/5不符。", "2551": "A 正确：登高作业时将安全带挂在上方牢固可靠处，高度不低于腰部。B/C/D 错误：肩部/颈部/头部不符。", "2552": "A 正确：登高作业时必须有二人以上在场。B/C/D 错误：三/四/五人不符。", "2553": "C 正确：登高作业前先检查稳定性，距地面2米以上登高作业必须系好安全带。A/B/D 错误：1/1.5/3不符。", "2554": "B 正确：高空作业携带材料应放置稳定的说法错误（材料要稳妥固定防坠落），本题选错误项。A/C/D 正确：系好安全带再工作/检查脚扣保安带/杆下禁人均正确。", "2555": "D 正确：地震灾区县级以上政府组织卫生、医药部门做好伤员医疗救护和卫生防疫等工作。A/B/C 错误：卫生救援/救护/监督不符。", "2556": "D 正确：地震抢险时主要风险有6种：余震、海啸、水灾、灾区疫情、危化品泄漏、次生灾害等。A/B/C 错误：风险组合不符。", "2557": "A 正确：地线对短波通信非常重要，基地台接地端阻抗应小于4欧姆。B/C/D 错误：6/8/10不符。", "2558": "A 正确：地线的引线一般采用16mm²塑料护套多股铜线。B/C/D 错误：25/50/16cm²不符。", "2559": "D 正确：地网宜在不同方向上至少设2个测试点，便于测量。A/B/C 错误：1/3/4不符。", "2560": "D 正确：地毯、人体和墙壁对无线传输主要构成吸收影响。A/B/C 错误：散射/折射/反射不符。", "2561": "B 正确：北纬30度到赤道之间，地球自转偏向力使气流向右偏转，产生东北信风。A/C 错误：东南/西南不符。", "2562": "A 正确：北半球地球自转偏向力使得气流向右偏转。B/C 错误：左偏/其他不符。", "2563": "D 正确：地球站系统联测不包括卫星转发器入网测试（转发器入网测试是卫星操作方的）。A/B/C 正确：上行/下行/基带射频基带环路联测均属系统联测。", "2564": "B 正确：地球站天线种类主要有抛物面天线和卡赛格伦天线。A/C/D 错误：球面/板状/八木不符。", "2565": "A 正确：双工器的作用是将收、发信号分开。B/C/D 错误：放大接收信号/去噪/放大上行不符。", "2566": "A 正确：地球站天线限位种类不包括人工限位。B/C/D 正确：机械/电/软件限位均属限位种类。", "2567": "A 正确：地球站天线系统由天线、馈源和跟踪伺服系统三部分组成。B/C/D 错误：发射/接收/电源不符。", "2568": "A 正确：地球站天线跟踪卫星时要进行方位俯仰指向调节。B/C/D 错误：功率极化/电压电流/信标频率不符。", "2569": "A 正确：天线波束轴线不能正确对准卫星波束轴线带来的损耗称天线跟踪误差损耗。B/C/D 错误：自由空间/大气/极化损耗不符。", "2570": "C 正确：地球站品质因数（G/T）决定了卫星接收系统的性能。A/B/D 错误：天线/发射/跟踪不符。", "2571": "B 正确：地球站发信波导尺寸比收信波导尺寸小（高频段波导小）。A/C/D 错误：大/一样/都可能不符。", "2572": "A 正确：地球站常用的天线类型是抛物面天线。B/C/D 错误：八木/对数周期/平板不符。", "2573": "D 正确：地球站按站址可分为固定站、移动站、便携站。A/B/C 错误：机载/船载/车载不符。", "2574": "D 正确：地球站G/T值是地球站的接收品质因数。A/B/C 错误：天线增益/噪声系数/噪声温度不符。", "2575": "C 正确：电子罗盘感应指示值与真北比较，其差值为该点的磁偏角。A/B/D 错误：磁北/磁南/真南不符。", "2576": "B 正确：地球表面传播的无线电波称为地波。A/C/D 错误：天波/空间波/散射波不符。", "2577": "A 正确：地面站性能参数G/T反映了地面站接收系统的一项重要指标。B/C/D 错误：功放大小/下变频器/功分器指标不符。", "2578": "B 正确：地面站地图航迹显示系统可为无人机驾驶员提供飞机位置等信息。A/C 错误：飞行姿态/飞控状态不符。", "2579": "B 正确：地面天气图上填写的气压是海平面气压。A/C 错误：本站气压/场面气压不符。", "2580": "D 正确：地面接收信号因日凌干扰而产生的载噪比恶化量在10dB以上。A/B/C 错误：3/5/6不符。", "2581": "A 正确：地面风具有明显日变化的主要原因是气压的变化（热力环流）。B/C 错误：摩擦力/乱流强度变化不符。", "2582": "C 正确：地锚拉线应使用7/2.6钢线制作。A/B/D 错误：3.0铁丝/7/2.2钢线/4.0铁丝不符。", "2583": "A 正确：地方政府有关部门有调度专业队伍需求的应向当地通信管理局提出。B/C 错误：当地保障队伍/单位总部不符。", "2584": "A 正确：地波传播过程中波长越短减弱越快，因而传播距离不远。B/C 错误：波长越长减弱越快/越短减弱越慢不符。", "2585": "D 正确：地波的传输距离大致是100公里。A/B/C 错误：300/200/400不符。", "2586": "C 正确：地表和潮湿物体表面水分蒸发进入大气形成水汽，大气中水汽含量平均约占整个大气的（比例随高度增加而减少），本题选减少。A/B 错误：增加/不变不符。", "2587": "C 正确：导频PN序列的偏置值有512个。A/B/D 错误：32768/64/4不符。", "2588": "C 正确：党的十八大以来，我国人均国内生产总值从三万九千八百元增加到八万一千元。A/B/D 错误：六万一千/七万一千/九万一千不符。", "2589": "B 正确：党的十八大以来我国经济总量占世界经济的比重达18.5%，稳居世界第二位。A/C 错误：第一/第三不符。", "2590": "B 正确：党的十八大以来国内生产总值从54万亿增长到114万亿，经济总量占世界比重达18.5%。A/C/D 错误：15.8/20.5/28.5不符。", "2591": "B 正确：党的十八大以来国内生产总值从五十四万亿元增长到一百一十四万亿元。A/C 错误：一百三十一/一百四十一不符。", "2592": "A 正确：党的二十大报告指出坚持德才兼备、以德为先、五湖四海、任人唯贤的选人用人导向。B/C/D 错误：四面八方/清正廉洁/选贤任能不符。", "2593": "B 正确：党的二十大是在迈上全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军的时刻召开。A/C/D 错误：奋斗目标不符。", "2594": "C 正确：党的十八大以来，我们党勇于进行理论探索和创新，取得重大理论创新成果。A/B 错误：十六大/十七大不符。", "2595": "B 正确：FR1频段UEPowerClass为3的终端最大发射功率是23dBm。A/C/D 错误：20/26/29不符。", "2596": "C 正确：整流模块电池测试功能开启时，系统整流模块自动停机，蓄电池带载放电测试。A/B/D 错误：自动开机/组合不符。", "2597": "C 正确：障碍发生后维护人员遵循先抢通后修复、先干线后支线的原则抢修。A/B/D 错误：顺序不符。", "2598": "C 正确：遭遇特大冰冻雨雪天气时省级传输拓扑图不是必须的（需省级/县级行政区划图和县级传输基站拓扑图）。A/B/D 正确：省级/县级行政区划图、县级传输基站拓扑图均必须。", "2599": "A 正确：山谷山脊山区低空飞行时，在山的背风面顺风飞行最容易碰到乱流危险（背风波乱流）。B/C 错误：背风逆风/迎风逆风不符。", "2600": "A 正确：预期网络拥塞时最优先保障VoLTE通话（语音高优先级）。B/C/D 错误：在线视频/即时聊天/浏览网页不符。", "2601": "A 正确：油机出现故障时应按紧急制动按钮。B/C/D 错误：油机空开/启动钥匙Off档/减压阀不符。", "2602": "C 正确：失温状态给其饮烧酒驱寒的做法不对（酒精加速散热）。A/B/D 正确：移至温暖处/清醒饮热饮/热水袋保暖均正确。", "2603": "D 正确：用户在不同小区移动通话时基站系统通过切换方式保证通话不中断。A/B/C 错误：功率控制/位置更新/小区选择不符。", "2604": "B 正确：用150W以上（含）灯泡时不得使用胶木灯具。A/C/D 错误：100/200/250不符。", "2605": "C 正确：移动基站土壤电阻率大于700Ω·m时可不限制工频接地电阻。A/B/D 错误：600/500/800不符。", "2606": "C 正确：增强型基站具备2个收发信机时正常可提供7个话音通道。A/B/D 错误：4/6/8不符。", "2607": "A 正确：频带一定时增加系统容量可采用小区分裂及频率复用并降低干扰。B/C/D 错误：加功率/减功率/大量加基站不符。", "2608": "B 正确：GPON口下带用户100M宽带业务，并发比50%时带宽需求为100M。A/C/D 错误：150/200/10不符。", "2609": "B 正确：蓄电池放电用大于10小时放电电流时，电池剩余的容量变小（大电流放电）。A/C 错误：小于/等于不符。", "2610": "C 正确：需要使用弯曲不敏感光纤时宜选用G.657单模光纤。A/B 错误：G.652/G.652D不符。", "2611": "B 正确：信标接收机屏幕显示PHASELOCK标识时可认为已经完成锁星。A/C/D 错误：LOCK/READY/UNLOCKED不符。", "2612": "D 正确：下行调制码率如果高于0.93，UE将忽略解码。A/B/C 错误：0.88/0.89/0.91不符。", "2613": "C 正确：无线电波遇到尖角或薄边的阻挡物时产生绕射现象。A/B/D 错误：直射/反射/散射不符。", "2614": "D 正确：无线电波遇到大量尺寸远小于波长的颗粒时产生散射现象。A/B/C 错误：直射/反射/绕射不符。", "2615": "A 正确：LED做光源时采用直接调制方式。B/C/D 错误：外调制/相位调制/频率调制不符。", "2616": "C 正确：网元之间通过DCC相连时IP地址必须属于不同子网（DCC网段隔离）。A/B/D 错误：相同子网/可以在不同子网/可以在相同子网不符。", "2617": "C 正确：网络出现连接故障一般应首先检查物理连通性。A/B/D 错误：主机故障/路由配置/系统病毒不符。", "2618": "C 正确：网管上出现大面积告警可能原因是光缆中断。A/B/D 错误：单块OTU损坏/网元监控盘损坏/内部跳纤损坏均局部。", "2619": "A 正确：外界气温高于43℃时大多数空调器不能工作，压缩机热保护器自动切断电源。B/C/D 错误：10/21/34不符。", "2620": "D 正确：外部电源切换时利用UPS蓄电池给设备供电。A/B/C 错误：柴油发电机/汽车电瓶/外接市电不符。", "2621": "B 正确：通信铁塔在机房旁边时铁塔地网应延伸到塔基四脚外1.5m远的范围，网格尺寸不大于3m。A/C/D 错误：距离/网格尺寸组合不符。", "2622": "A 正确：天线端口数2、normalCP时，一个slot内编号为0的符号属于包含RS的OFDM符号。B/C/D 错误：1/2/3不符。", "2623": "C 正确：速度增加诱导阻力减少时蒙皮摩阻增加了（高速摩擦阻力上升）。A/B 错误：形阻减少/蒙皮摩阻减少不符。", "2624": "C 正确：数据库完整性遭到破坏时必须采取使用数据库备份的措施恢复。A/B/D 错误：重装/换库/工具导出不符。", "2625": "B 正确：收到手机拆线信号时系统首先启动T3109定时器。A/C/D 错误：T3101/T3110/T3111不符。", "2626": "A 正确：对国家无线电管理机构处罚不服的可依法申请行政复议或提起行政诉讼。B/C/D 错误：刑事/民事/治安不符。", "2627": "B 正确：市电正常时整流器向负荷供电并给蓄电池补充电流，补充自放电损耗的电压是浮充电压。A/C/D 错误：均充/强充/终止电压不符。", "2628": "B 正确：市电正常时整流器输出电压值是浮充电压。A/C/D 错误：均衡/强充/终止电压不符。", "2629": "A 正确：市电恢复供电时正确的停机步骤为先将油机电开关分闸。B/C 错误：调怠速/直接停机不符。", "2630": "A 正确：食物中水分仅为5%或更少时几乎不会生霉，也很少生蛆。B/C/D 错误：6/7/8不符。", "2631": "A 正确：上行采用DFT-S-OFDM波形时支持的流数为1（单流）。B/C/D 错误：2/3/4不符。", "2632": "C 正确：现网5G 25ms双周期帧结构支持的最大广播波束为7个。A/B/D 错误：2/4/8不符。", "2633": "B 正确：eNB同时配置S1口和X2口时优先执行X2口切换。A/C/D 错误：优先S1/随机/同时不符。", "2634": "B 正确：气温高于标准大气温度时空气密度小，飞机的载重量要减小。A/C 错误：增加/保持不变不符。", "2635": "A 正确：配置多种保护叠加时，为避免LSP1:1和PW冗余等保护间冲突，应支持拖延时间。B/C/D 错误：抢占/倒换/等待时间不符。", "2636": "C 正确：处在滑坡体上感到地面变动时，要尽快向两侧稳定地区逃离。A/B/D 错误：向上/向下/蹲下不符。", "2637": "A 正确：陷入火海脱险最佳方法是穿越火场快速奔跑（低压伏地冲出）。B/C/D 错误：等待/跳楼/自己灭火不符。", "2638": "A 正确：身处绝境或遇险时首要的事情是建立信标，引起救援人员注意。B/C/D 错误：水和食物/安全地带/庇护所不符。", "2639": "D 正确：某组电池容量小于额定容量的80%时该组电池可申请报废处理。A/B/C 错误：20/40/60不符。", "2640": "A 正确：发送端OTU盘输入光功率不足(IOP)告警可能是网管上门限设置不当造成（误告警）。B/C/D 错误：线路中断/线路光功率下降/对接SDH设备问题均会引起真实低光。", "2641": "B 正确：电源线不够长时不可以有中间接头（接头易发热隐患）。A/C 错误：可以/无所谓不符。", "2642": "C 正确：连续5帧以上收不到正确A1、A2字节无法判别帧头时称OOF（帧失步）。A/B/D 错误：X/Y组合不符。", "2643": "A 正确：冷暖气团势均力敌交锋区很少移动形成静止锋。B/C 错误：交错锋/融合锋不符。", "2644": "C 正确：伯努利定理表明凡是流速大的地方压强就小。A/B 错误：流速大压强就大/流速小压强就小不符。", "2645": "A 正确：开关电源LVDS跳脱后蓄电池的端电压会增高（负载减轻）。B/C 错误：不变/降低不符。", "2646": "B 正确：仅采用机械下倾角时下倾角加大，主瓣方向覆盖距离减小、旁瓣方向增加。A/C/D 错误：组合不符。", "2647": "D 正确：架设高压线路避雷线时，避雷线长度不宜小于500米。A/B/C 错误：100/200/300不符。", "2648": "A 正确：环境温度降至0℃以下，温度每降低1度内阻约增大15%。B/C/D 错误：-5/-10/-15不符。", "2649": "B 正确：环境温度高于25±5℃时浮充电压应低于标准值（温度补偿）。A/C 错误：高于/等于不符。", "2650": "B 正确：呼叫过程中有切换发生时原来的话路并不释放直到MS在新小区成功建立连接。A/C/D 错误：总在新小区分配/总是需要HON/以上皆是不符。", "2651": "C 正确：后缘襟翼放下时既增大升力又增大阻力。A/B 错误：只增大升力/只增大阻力不符。", "2652": "C 正确：功率因数接近1说明模块交流电流输入波形接近正弦波。A/B/D 错误：无损耗/效率为1/波形描述不符。", "2653": "C 正确：负载短路时UPS应能立即自动关闭输出，同时发出声光告警。A/B/D 错误：输入/电压/电流不符。", "2654": "C 正确：阀控式密封蓄电池容量低于额定量80%时应予以更换。A/B/D 错误：60/70/90不符。", "2655": "C 正确：发现有蚂蝗叮咬时不能用手将其扯掉（易断头感染）。A/B 正确：用唾液拍下/用烟头烫均为正确处置。", "2656": "B 正确：发现接头盒质量问题后可留存相关证据上报采购部门。A/C/D 错误：联系厂家换新/上报质监局/无须理会不符。", "2657": "B 正确：光纤通道损耗增大或后向散射曲线有大台阶0.2dB/个时应增加检查次数。A/C/D 错误：0.1/0.5/0.05不符。", "2658": "D 正确：多个载波共用行波管高功放为减小互调噪声，工作点从饱和点回退6～7dB。A/B/C 错误：1-2/3-4/5-6不符。", "2659": "C 正确：非线性器件互调干扰中以三阶互调影响最大。A/B/D 错误：1/2/9kHz不符。", "2660": "C 正确：电池浮充电压偏低或放电后需再充电或容量不足时需进行均衡充电。A/B/D 错误：限流限压/恒压限流/浮充不符。", "2661": "C 正确：电池放电后需要再充电或容量不足时需要对电池进行均衡充电。A/B/D 错误：限流限压/恒压限流/浮充不符。", "2662": "C 正确：电波电场强度方向垂直于地面时称垂直极化波。A/B/D 错误：圆极化/椭圆极化/水平极化不符。", "2663": "B 正确：电波路径上体积远大于波长的物体不能绕射时发生反射。A/C/D 错误：直射/绕射/散射不符。", "2664": "B 正确：出现线路故障需要使用OTDR进行故障点判断。A/C/D 错误：误码仪/可变光衰减器/频谱分析仪不符。", "2665": "C 正确：线路故障需要用OTDR仪表进行故障点判断。A/B/D 错误：可变光衰减器/误码仪/频谱分析仪不符。", "2666": "A 正确：柴油机运行中机油压力逐渐降低时应立即停机检查。B/C/D 错误：加注机油/调调压阀/都不做不符。", "2667": "D 正确：Option3X架构对应的是SCG Split Bearer承载类型。A/B/C 错误：MCG Bearer/MCG Split/SCG Bearer不符。", "2668": "C 正确：不慎落水时喊叫或拍打水面求救最有效。A/B/D 错误：向水边游/双手挥动/找漂浮物不符。", "2669": "C 正确：不能确保消防安全随时可能引发火灾或严重危及人身安全的应将危险部位停产停业。A/B 错误：彻底整改/封闭使用不符。", "2670": "C 正确：不对天馈线保养维护时天馈线灵敏度年平均降低0.15。A/B/D 错误：0.05/0.1/0.2不符。", "2671": "D 正确：波束个数为8时SSB索引通过PBCH DMRS获取。A/B/C 错误：PSS/SSS/PBCH Payload不符。", "2672": "A 正确：变压器外部故障有较大穿越性短路电流流过时差动保护不应动作（区外故障）。B/C/D 错误：延时/立即/看时间不符。", "2673": "A 正确：VSWR等于1.5时ReturnLoss约等于-14dB。B/C/D 错误：-15/-16/-17不符。", "2674": "C 正确：SDH丢失外部同步输入且无备用时钟时设备进入保持模式。A/B/D 错误：锁定/自由振荡/异步模式不符。", "2675": "A 正确：RRU与智能天线同抱杆安装时中间应保持不小于300mm间距。B/C/D 错误：250/200/150不符。", "2676": "D 正确：FEC=3/4、Co/No=9.54dB时Eb/No为7.79dB。A/B/C 错误：6.54/10.00/9.54不符。", "2677": "D 正确：单注册模式5G核心网与EPC互操作保持会话连续性需要在MME与AMF之间的N26接口。A/B/C 错误：S10/N2/N15不符。", "2678": "A 正确：单站点验证的目标是确保站点安装和参数配置正确。B/C/D 错误：UE正常/人流量/环境影响不符。", "2679": "D 正确：单向通道保护环适用于集中型业务。A/B/C 错误：接入网/选项均正确/分散型不符。", "2680": "C 正确：单位导线截面积所通过电流值称为电流密度。A/B/D 错误：额定电流/负荷电流/短路电流不符。", "2681": "C 正确：单模光纤最明显的优势是色散小。A/B/D 错误：损耗小/抗干扰/制作简单不符。", "2682": "A 正确：单模光纤1550nm窗口衰耗可低达0.2dB/km。B/C/D 错误：0.25/0.3/0.35不符。", "2683": "C 正确：单模光纤以材料色散为主。A/B/D 错误：模式/波导/损耗不符。", "2684": "B 正确：单模光纤色散主要是由材料色散引起的。A/C/D 错误：结构色散/模式畸变/波导色散不符。", "2685": "B 正确：单模光纤熔接时是光纤内径（纤芯）对准实现连接。A/C/D 错误：外径/缓冲层/轴心不符。", "2686": "A 正确：单管塔依据连接技术不同分为法兰连接单管塔和插接连接单管塔。B/C/D 错误：垂直/水平/交叉连接不符。", "2687": "B 正确：单管塔爬梯每相邻爬钉间距为300mm。A/C/D 错误：250/350/400不符。", "2688": "B 正确：单管塔馈线进线如采用地埋PVC管方式进入机房，宜在塔体中部新增一点接地。A/C/D 错误：顶部/下部/任意位置不符。", "2689": "A 正确：单管塔/景观塔中心整体垂直偏差应不大于全塔高度的1/750。B/C/D 错误：1/800/1/850/1/900不符。", "2690": "D 正确：单个UE同时接入的切换最大是8个。A/B/C 错误：2/4/6不符。", "2691": "C 正确：单兵图传背负机发射系统一般包括发射机、信号源、天馈部分、供电部分。A/B/D 错误：电池/发射天线/耳麦不符。", "2692": "B 正确：防静电手腕带串接了一个兆欧电阻，通过它泄放静电。A/C/D 错误：与大地短接导体/保护人身安全/保护设备电源不符。", "2693": "C 正确：802.1Q标记以太网帧中VLAN ID占12位bit。A/B/D 错误：16/20/8不符。", "2694": "D 正确：带宽100M、30kHz子载波间隔最大支持RB个数为273。A/B/C 错误：270/271/272不符。", "2695": "A 正确：大型无人机指空机质量大于5700千克。B/C 错误：质量大于5700/空机质量大于等于5700不符。", "2696": "A 正确：较高高度大气压力降低，起飞和着陆距离会增加、爬升率减小。B/C 错误：距离组合不符。", "2697": "C 正确：太阳辐射通过大气层时有部分被大气吸收和散射，到达地面是主要热量来源。A/B 错误：全部透过/全部吸收不符。", "2698": "D 正确：大气吸收损耗随着频率的变化而变化。A/B/C 错误：时间/距离/功率不符。", "2699": "A 正确：大气湍流引起的微波衰落是闪烁衰落。B/C/D 错误：K型/波导型/多径衰落不符。", "2700": "B 正确：大气环境对无线信号衰减影响较大的频段主要集中在28GHz附近（毫米波吸收峰）。A/C/D 错误：70/3.5/60不符。", "2701": "B 正确：大气对流运动在赤道地区最强烈（受热不均产生强烈对流）。A/C 错误：北半球/南半球不符。", "2702": "A 正确：大气组成是78%的氮气、21%的氧气。B/C 错误：比例不符。", "2703": "D 正确：大疆消费级无人机从小到大排序是晓-御air-御2-精灵。A/B/C 错误：排序不符。", "2704": "A 正确：大疆无人机的图传信道频率为2.4GHz或5.8GHz。B/C/D 错误：4.2/5.6/6.3不符。", "2705": "D 正确：大风天气行车感到转向盘突然“被夺”时一定要双手稳握转向盘。A/B/C 错误：逆风/顺风转盘/紧急制动不符。", "2706": "A 正确：大多数多旋翼飞行器自主飞行过程利用GPS实现速度感知。B/C 错误：空速管/惯导不符。", "2707": "B 正确：大多数多旋翼飞行器自主飞行过程利用GPS实现高度感知。A/C 错误：气压高度计/超声波高度计不符。", "2708": "A 正确：大尺度传播机制中值信号功率与距离长度增加成反比关系（幂定律衰减）。B/C/D 错误：正比/没关系/幂次关系不符。", "2709": "C 正确：既能增大机翼切面弯曲度又能增加机翼面积、提高升力系数的是后退式襟翼。A/B 错误：分裂式/简单式不符。", "2710": "A 正确：存储国家秘密信息的U盘只能在本单位同一密级或更高密级的计算机上使用。B/C 错误：同一密级涉密/办公用内部不符。", "2711": "C 正确：粗约9-10毫米的绳子常常作为绑绳使用。A/B/D 错误：7-8/8-9/10-11不符。", "2712": "B 正确：丛林跋涉行进中两人间保持2-3米的距离为佳。A/C/D 错误：1/4-5/7-8不符。", "2713": "B 正确：从整个Internet观点出发，路由聚合方法可以有效减少路由表的规模。A/C/D 错误：增加动态路由更新/划分VLAN/划分路由域不符。", "2714": "C 正确：经安全教育培训了解岗位规程但未遵守造成事故的，行为人应负直接责任。A/B/D 错误：领导/管理/间接不符。", "2715": "C 正确：从信道中测量干扰条件确定初始发射功率属于开环功控。A/B/D 错误：外环/内环/快速功控不符。", "2716": "B 正确：从事一般性高处作业脚上应穿软底防滑鞋。A/C 错误：硬底鞋/普通胶鞋不符。", "2717": "A 正确：从事特种作业的劳动者必须经过专门培训并取得特种作业资格。B/C/D 错误：从业/技术/上岗资格不符。", "2718": "C 正确：从航路天气预告图上可以预先了解航线高度的风云气温及颠簸积冰等情况。A/B 错误：等压面/重要天气预告图不符。", "2719": "D 正确：理论上VLAN ID的取值范围是0~4095。A/B/C 错误：1-32/1-512/1-4094不符。", "2720": "C 正确：交换机过来的未知以太网业务连MSTP二层交换板，建议以太网端口TAG属性配置Hybrid。A/B 错误：Access/TAG不符。", "2721": "A 正确：从广义来讲产生莫尔斯码的调制方法是ASK（振幅键控）。B/C/D 错误：FSK/PSK/DAM不符。", "2722": "D 正确：从封装效率来看GPON比EPON要高。A/B/C 错误：一样/不确定/低不符。", "2723": "A 正确：大气层从地球表面到外层空间依次是对流层、平流层、中间层、电离层（热层）等。B/C 错误：顺序不符。", "2724": "A 正确：从垂直方向对ASON分层，其总体结构中不涉及业务平面（ASON分传送/控制/管理平面）。B/C/D 正确：传送/控制/管理平面均涉及。", "2725": "B 正确：从LNA输出的信号转为L频段信号需要经过BDC（下变频器）。A/C/D 错误：BUC/U-C/D-C不符。", "2726": "C 正确：垂直接地体及其连接材料应采用热镀锌钢材，不得采用铝质材料。A/B/D 错误：铜质/铁质/合金不符。", "2727": "B 正确：垂直极化电场矢量与地面垂直。A/C/D 错误：平行/45度/相交不符。", "2728": "D 正确：创建了工单但没有提交可以在草稿中找到。A/B/C 错误：待办任务/我建工单/抄送任务不符。", "2729": "A 正确：传统RRU和天线设备在CloudRAN架构中演变成AAU设备。B/C/D 错误：CU/DU/RRU不符。", "2730": "B 正确：传输线的反射波属于行波性质的波。A/C/D 错误：行驻波/驻波/不一定不符。", "2731": "C 正确：传输故障处理原则是先抢通再抢修。A/B/D 错误：抢修为主/抢通为主/先抢修再抢通不符。", "2732": "A 正确：传输2M电路故障判断时常用的测试方法是环回测试。B/C/D 错误：电压测量/电阻测试/保护测试不符。", "2733": "B 正确：传播模型的作用是用于计算小区半径。A/C 错误：计算小区容量/单载波发射功率不符。", "2734": "C 正确：触电事故是由电流的能量造成的，电流对人体的伤害。A/B/D 错误：电压/电路/电气不符。", "2735": "D 正确：触电急救步骤不包括通知家属带人去医院就医（应现场急救与送医结合）。A/B/C 正确：摆脱电源/简单诊断/现场急救均为急救步骤。", "2736": "C 正确：处理故障中所介入或更换的光缆长度一般应不小于200m，且尽可能同一厂家同一型号。A/B/D 错误：100/150/250不符。", "2737": "D 正确：蓄电池过温告警原因可能是环境温度过高、蓄电池不良、充电电流太大（以上都可能）。A/B/C 错误：单一原因不符。", "2738": "A 正确：出TUNNEL转发表处理由SYS口到LINE口的转发包。B/C/D 错误：方向组合不符。", "2739": "B 正确：充分利用公众通信网，确保防汛通信专网、蓄滞洪区预警反馈系统完好和畅通。A/C/D 错误：专用通信网/公用专用/应急通信网不符。", "2740": "B 正确：持续深化纠治“四风”，重点纠治形式主义、官僚主义。A/C/D 错误：享乐主义/本位主义/奢靡之风不符。", "2741": "B 正确：城镇化率提高11.6个百分点，达到64.7%。A/C/D 错误：54.7/67.4/70.4不符。", "2742": "A 正确：承载网中SDN技术实现控制面和转发面解耦，使物理网络开放可编程。B/C/D 错误：FlexE/OTN/VPN不符。", "2743": "B 正确：成人口对口人工呼吸每分钟应为16-18次。A/C 错误：10-12/18-24不符。", "2744": "B 正确：运动中接收卫星信号的车载天线称动中通，静止状态接收称静中通。A/C/D 错误：名称顺序不符。", "2745": "D 正确：车载卫星天线一般使用的是Ku频段。A/B/C 错误：L/C/K不符。", "2746": "B 正确：车载电台作为固定台使用时最好使用独立的交流电源。A/C/D 错误：共用/混用/多用不符。", "2747": "A 正确：车载VSAT卫星系统现使用的卫星频段是Ku频段。B/C 错误：C/KA不符。", "2748": "D 正确：车载UPF可根据客户应用通过N6接口与客户园区网络、云资源池、MEP平台等连接。A/B/C 错误：N4/N9/N3不符。", "2749": "B 正确：车载4G应急基站通过卫星电路从上海刘行卫星地面站落地，通过MSTP电路回传至某省需95（毫秒级）时延。A/C/D 错误：32/96/97不符。", "2750": "D 正确：车辆雪天临时停车时应开启危险报警闪光灯。A/B/C 错误：防雾灯/倒车灯/前大灯不符。", "2751": "A 正确：车辆在下陡坡时不得超车。B/C/D 错误：伺机超车/可以超车/不可以刹车不符。", "2752": "B 正确：车辆在山区道路跟车行驶时应适当加大安全距离。A/C/D 错误：紧随前车/减小距离/找超车机会不符。", "2753": "D 正确：车辆驶入双向行驶隧道前应开启示宽灯或近光灯。A/B/C 错误：危险报警闪光灯/远光灯/防雾灯不符。", "2754": "D 正确：车辆驶出高速公路隧道口受横风袭击会明显出现方向偏移。A/B/C 错误：减速感/加速感/压力感不符。", "2755": "C 正确：车辆联合电源系统是一种由车辆发动机带动的电力供应系统。A/B/D 错误：柴油发电机/逆变器/蓄电池不符。", "2756": "D 正确：车辆联合电源系统工作时间相对较短是因为供油由车辆提供而没有专门的油箱。A/B/C 错误：耗油量大/功率大/油箱小不符。", "2757": "A 正确：车辆控制、工业控制等应用场景对时延提出了更高的要求。B/C/D 错误：带宽/吞吐量/可用度不符。", "2758": "B 正确：车辆进入高速公路加速道后应打开左转向灯，尽快将车速提高到每小时60公里以上。A/C/D 错误：40/80/100不符。", "2759": "A 正确：车联网服务器适合部署在Edge DC（边缘数据中心）。B/C/D 错误：Regional/Core/省会机房不符。", "2760": "A 正确：车联网V2X中V2V是车与车之间的通信。B/C/D 错误：车与基础设施/车与人/车域网络设备不符。", "2761": "C 正确：超长波长光纤通信系统工作波长大于2µm时，衰减为0.01-0.001dB/km。A/B/D 错误：1.55/1.8/2.2不符。", "2762": "C 正确：超温告警值35℃，环境从35℃到34℃告警消除需要30秒（防抖延时）。A/B/D 错误：马上/10秒/40秒不符。", "2763": "A 正确：超近程无人机活动半径在15km以内。B/C 错误：15-50/50-200不符。", "2764": "A 正确：超短波通信只能靠直线方式传输，传输距离大约为50km。B/C/D 错误：100/150/200不符。", "2765": "B 正确：超短波和微波指波长在10米以下的。A/C/D 错误：1/100/150不符。", "2766": "A 正确：超低空无人机任务高度一般在0~100m之间。B/C 错误：100-1000/0-50不符。", "2767": "B 正确：超低空飞行按飞行高度区分为距地面或水面100米以下。A/C 错误：50米以下/5-100米不符。", "2768": "D 正确：常用于ONU测量光功率的工具是PON光功率计。A/B/C 错误：万用表/光纤抓包仪/PAD不符。", "2769": "D 正确：常用的卫星调制解调器输入频段是L频段。A/B/C 错误：IF/C/Ku不符。", "2770": "B 正确：常用交流电压表和万用表测量的交流电压值是指有效值。A/C/D 错误：最大值/平均值/绝对值不符。", "2771": "A 正确：常用的C频段固定卫星通信系统上行6GHz、下行4GHz。B/C/D 错误：6/8/10不符。", "2772": "B 正确：常开直流接触器加电时触点闭合。A/C/D 错误：不加电闭合/正常时闭合/异常时闭合不符。", "2773": "D 正确：常见传感硬件不含有光电隔离器（隔离器不是传感硬件）。A/B/C 正确：红外传感器/门磁/无线发射器均属传感硬件。", "2774": "B 正确：常规单模光纤的零色散波长窗口在1.31µm。A/C 错误：0.85/1.55不符。", "2775": "A 正确：尝试新植物时，唇舔、舌尝、口嚼之间至少要间隔5分钟。B/C/D 错误：10/15/20不符。", "2776": "C 正确：柴油喷入燃烧室的状态为雾状液体。A/B/D 错误：液体/雾状气体/气体不符。", "2777": "C 正确：柴油机排烟呈黑烟表示燃烧不完善。A/B 错误：雾滴未燃烧/机油串入燃烧室不符。", "2778": "B 正确：柴油机活塞环漏光法检查时漏光点不应多于2处。A/C/D 错误：1/3/4不符。", "2779": "B 正确：柴油机过热主要表现为冷却水温度过高。A/C/D 错误：机油/进气/排气管不符。", "2780": "D 正确：柴油机带负载运转时排烟为淡灰色，负载加大时可能变成深灰色。A/B/C 错误：黑色/淡黑色/白色不符。", "2781": "B 正确：柴油发电机组要求空载停机的目的是避免影响受电设备。A/C 错误：保护油机/保护发电机不符。", "2782": "B 正确：柴油发电机涡轮增压系统的主要作用是提高压缩比，提高其效率。A/C/D 错误：增加燃烧比/提高机油压力/增加燃油压力不符。", "2783": "C 正确：柴油发电机启动后无交流电源输出可能的原因是交流输出空开故障。A/B 错误：启动电池容量不够/油压不够不符。", "2784": "A 正确：柴油发电机的活塞环有气环和油环两种。B/C/D 错误：铁环/橡胶环不符。", "2785": "A 正确：柴油发电机供电线路连接应先供电端再负载端。B/C 错误：先负载端/直接停机不符。", "2786": "D 正确：柴油发电机带负载运转时排气颜色应为浅灰色。A/B/C 错误：黑色/白色/蓝色不符。", "2787": "D 正确：查找直埋光缆路由的仪器是路由探测仪。A/B/C 错误：OTDR/万用表/光功率计不符。", "2788": "A 正确：插拔光纤前应双方确认无误后再行操作。B/C/D 错误：同意/签字/准确无误不符。", "2789": "B 正确：测量天线驻波比可选用sitemaster（Site Master驻波测试仪）。A/C/D 错误：泰克频谱仪/功率计/鼎立路测不符。", "2790": "A 正确：测量机翼翼展是从左翼尖到右翼尖。B/C 错误：机身中心线到翼尖/前缘到后缘不符。", "2791": "C 正确：测量机翼翼弦是从机翼前缘到后缘。A/B 错误：翼尖间/中心线到翼尖不符。", "2792": "B 正确：餐具物理消毒煮沸、蒸汽消毒保持100度10分钟以上。A/C/D 错误：110度5分/90度15分/85度20分不符。", "2793": "B 正确：参数调整为QPSK。A/C/D 错误：BPSK/16QAM/64QAM不符。", "2794": "D 正确：采用天线共塔时为减少天线相互影响，常要求隔离度大于30dB。A/B/C 错误：10/15/20不符。", "2795": "D 正确：采用水平空间分集接收时两个接收天线间距最好保持4到6米。A/B/C 错误：0.2/1/2不符。", "2796": "C 正确：采用菊花链形式的基站连接方案优点是不会对Abis接口产生不利影响。A/B/D 错误：串行增时延/时隙提取/避免PCM编码不符。", "2797": "B 正确：采用电缆传输视频信号时VDU应安装于电缆的收端。A/C/D 错误：发端/两端都可以/中间不符。", "2798": "D 正确：采用插入法测量光纤损耗时主要对光功率计进行校准。A/B/C 错误：可见光光源/光源/OTDR不符。", "2799": "A 正确：QPSK传输信道利用率是2PSK的2倍。B/C/D 错误：4/8/45293不符。", "2800": "D 正确：采用HDB3码的主要原因是便于收端提取时钟信号。A/B/C 错误：减少直流/高频/低频分量不符。", "2801": "B 正确：CDMA方式卫星通信的优点是抗多径干扰性能强、频带利用率高。A/C/D 错误：保密隐蔽/传输速率高/抗邻近通道干扰不符。", "2802": "C 正确：部署QoS需要部署Tunnel的LSP属性为Uniform。A/B 错误：都可以/Pipe不符。", "2803": "C 正确：螺旋桨根部标有“CCW”字样意义为此螺旋桨为顶视逆时针旋转（Counter ClockWise）。A/B 错误：公司生产/顺时针不符。", "2804": "A 正确：布线时不能采用信号线和电源线并排放置在一起的方式（互扰），本题选不能采用的方式。B/C/D 正确：线料统一规格/统一编号/整齐美观均要求。", "2805": "C 正确：不影响光缆接续指标的因素是受电磁场和电磁辐射的影响（对光信号无影响）。A/B/D 错误：纤带损伤/固定压伤/熔接衰耗大均影响接续指标。", "2806": "A 正确：不属于无人机飞控计算机任务的是数据中继。B/C/D 正确：姿态稳定与控制/自主飞行控制均为飞控任务。", "2807": "B 正确：不要在水深超过0.7米的河流中徒步涉水工作。A/C/D 错误：0.5/1/2不符。", "2808": "C 正确：不要再水深超过0.7米、流速3米/秒以上的河流中徒步涉水工作。A/B/D 错误：数值组合不符。", "2809": "B 正确：不稳定运动状态与稳定运动或静止状态不同之处就是多了加速度。A/C 错误：速度/重力加速度不符。", "2810": "B 正确：不同网络之间的通信需要IP地址。A/C/D 错误：广播地址/物理地址/MAC地址不符。", "2811": "A 正确：不属于无人机机型的是塞纳斯（塞纳斯是有人驾驶飞机）。B/C 正确：侦察兵/捕食者均为无人机机型。", "2812": "A 正确：不属于无人机飞控子系统所需信息的是经/纬度（GPS定位信息不是飞控所需）。B/C 正确：姿态角/空速均为飞控所需信息。", "2813": "B 正确：不属于流媒体传输的网络协议的是HTTP。A/C/D 正确：SRT/RTMP/RTSP均为流媒体协议。", "2814": "B 正确：不属于流媒体传输的网络协议的是HTTP。A/C/D 正确：RTMP/RTSP/SRT均为流媒体协议。", "2815": "C 正确：不属于抵消旋翼机反转力矩的方法有增大旋翼半径。A/B 正确：尾桨/共轴旋翼均为抵消反转力矩方法。", "2816": "D 正确：不属于柴油机增压的方式是离心增压。A/B/C 正确：机械增压/废气涡轮增压/复合增压均为增压方式。", "2817": "D 正确：不属于5G网络的信道或信号是PCFICH（4G控制信道）。A/B/C 正确：PDSCH/PUSCH/PDCCH均为5G信道。", "2818": "D 正确：不属于5G网络部署方式的是Option 8。A/B/C 正确：Option 2/3/7均为5G部署方式。", "2819": "D 正确：不适合用于光纤通信传输的波长范围是1650nm（损耗高）。A/B/C 正确：850/1310/1550均适合。", "2820": "C 正确：不是光缆缆芯结构的是单位式。A/B/D 正确：层绞式/中心束管式/带状式均为缆芯结构。", "2821": "B 正确：不上下话路，对信号有再生和转发作用的站是中继站。A/C 错误：终端站/枢纽站不符。", "2822": "C 正确：用户峰值体验最大流数和收发天线的关系是min(发射天线数,接收天线数)。A/B/D 错误：单发/单收/max不符。", "2823": "B 正确：不断谱写马克思主义中国化时代化新篇章，是当代中国共产党人的庄严历史责任。A/C 错误：大众化/通俗化不符。", "2824": "C 正确：不带除霜装置的空调器使用的最低环境温度为5℃。A/B/D 错误：3/2/9不符。", "2825": "A 正确：波长的单位是米。B/C/D 错误：赫兹/焦耳/安培不符。", "2826": "B 正确：表示光纤端面接收光能力的性能参数为数值孔径。A/C/D 错误：模场直径/截止波长/带宽不符。", "2827": "A 正确：表示光放大器放大能力的特性指标是功率增益。B/C/D 错误：带宽/输出饱和功率/噪声系数不符。", "2828": "B 正确：标清监控摄像头视频监控数据专线接入带宽需求范围是2M～6M。A/C/D 错误：6-12/1-2/6-8不符。", "2829": "B 正确：标签分发方式DOD是下游按需标记分发（Downstream On Demand）。A/C/D 错误：自主/上游不符。", "2830": "D 正确：标称电压380V交流市电电源受电端子上电压变动范围323～418V。A/B/C 错误：范围不符。", "2831": "A 正确：变压器的负荷损耗也称为铜损。B/C/D 错误：铁损/磁滞损耗/涡流损耗不符。", "240": "A 正确：数字集群系统中组呼占用1个时隙。B/C/D 错误：2/3/4不符。", "241": "A 正确：“网管应该使用QinQ VLAN”说法错误（网管不使用QinQ，业务才用QinQ），本题选错误项。B/C/D 正确：PON口外层标签规划原则均正确。", "242": "A 正确：WFQ（加权公平排队）不属于拥塞避免的丢包策略（是调度算法）。B/C/D 错误：RED/尾丢弃/WRED均为拥塞避免丢包策略。", "243": "C 正确：特殊地段、大雨之后、重要通信期间及动土较多季节应增加巡查次数。A/B/D 错误：按计划/每月/每周不符。", "244": "B 正确：同步通信卫星地面站抛物面天线水平方向角度是方位角（Azimuth）。A/C/D 错误：极化角/俯仰角/倾角不符。", "245": "C 正确：抛物面天线垂直方向上的角度是俯仰角（Elevation）。A/B/D 错误：极化角/方位角/倾角不符。", "246": "B 正确：LSP中间断掉后在宿节点会上报MPLS_TUNNEL_LOS（隧道丢失）告警。A/C/D 错误：其他告警名不符。", "247": "C 正确：气温垂直递减率单位为℃/100m（每升高100米气温下降度数）。A/B 错误：1000m/500m不符。", "248": "D 正确：实际移动通信中未采用的多址技术是空分多址（SDMA未商用）。A/B/C 错误：码分/时分/频分均已采用。", "249": "D 正确：树叶是引起散射的障碍物（边缘粗糙不规则散射）。A/B/C 错误：直射/反射/绕射不符。", "250": "A 正确：涉密岗位人员按涉密程度分核心/重要/一般三类，实行分类管理。B/C/D 错误：统一管理/指导/负责不符。", "251": "C 正确：上行0.5ms时隙正常CP下第4个块用于传送上行DMRS。A/B/D 错误：1/2/6不符。", "252": "C 正确：山区飞行最强的乱流出现在山的背风坡（下沉气流与涡流）。A/B/D 错误：山谷中间/迎风坡/山脊不符。", "253": "B 正确：山谷飞行应靠近迎风坡飞行（上升气流支撑）。A/C 错误：背风坡/出山口转弯易遇下沉气流。", "254": "A 正确：“不是高山就沿着山脊潜行”错误（山脊暴露易遭雷击且危险），本题选错误做法。B/C/D 正确：沿河边走/安排下山补水/河变宽地势平缓均正确。", "255": "C 正确：沙漠中应穿轻便宽松的衣服（透气防晒）。A/B/D 错误：厚重保暖/凉快紧实/裸露皮肤均不适。", "256": "C 正确：森林野营缺水可用胶布（塑料布）收集露水。A/B/D 错误：衣服/鞋子/袜子不符。", "257": "A 正确：融合空域大型无人机驾驶员应至少持有商照和仪表等级。B/C 错误：私照/商照不符。", "258": "A 正确：融合空域大型无人机机长应至少持有航线运输执照。B/C 错误：商照/商照+仪表不符。", "259": "B 正确：融合空域4600立方米以上遥控飞艇驾驶员应至少持有飞艇商照。A/C 错误：飞艇私照/热气球商照不符。", "260": "C 正确：融合空域3000米以上小型无人机驾驶员应至少持有飞机或直升机商照。A/B 错误：航线运输/私照不符。", "261": "C 正确：融合空域3000米以上Ⅺ级别无人机驾驶员应至少持有飞机或直升机商照。A/B 错误：航线运输/私照不符。", "262": "D 正确：热带地区庇护所需要两层是为了隔热（双层间空气隔热）。A/B/C 错误：防野兽/防火/防雷电不符。", "263": "C 正确：缺水时不能食用蛋白质类食物，因为消化蛋白质会消耗大量水分。A/B/D 错误：腹泻/便秘/不利消化不符。", "264": "A 正确：全国公用应急宽带VSAT网中每个STDMA载波可支持最多30个远端站共享。B/C/D 错误：100/无数/50不符。", "265": "C 正确：A3事件指邻区质量比服务小区质量高于一个偏移量（触发切换）。A/B/D 错误：绝对门限类事件不符。", "266": "B 正确：墙上及室内钻孔布放光缆遇电力线平行或穿越，必须先停电后作业。A/C/D 错误：保护/无所谓/小心不符。", "267": "A 正确：气温35℃以上野外勘查应防暑降温，最高气温达40℃以上停止室外露天作业。B/C/D 错误：36/37/38不符。", "268": "D 正确：频谱仪中VBW指视频带宽（视频滤波器带宽）。A/B/C 错误：带宽/扫描带宽/分辨率带宽不符。", "269": "C 正确：频谱仪中RBW指分辨率带宽。A/B/D 错误：带宽/扫描带宽/视频带宽不符。", "270": "B 正确：RES BW（分辨率带宽）用来调整分辨滤波器带宽。A/C/D 错误：SPAN/VIDEO BW/MARKER不符。", "271": "D 正确：配置业务使能QOS时注意链路上所有业务的CIR之和不能超过链路容量。A/B/C 错误：PIR之和/监管关闭/分组特性不符。", "272": "C 正确：配置以太网接口时端口使能状态是必需的（接口需UP才能连通）。A/B/D 错误：自协商/流控/LPT非必需。", "273": "C 正确：PON保护6种切换模式优先级中，强制工作到保护模式→强制保护到工作模式的优先级排序正确。A/B/D 错误：排序不符。", "274": "D 正确：泥泞路段行车应选用适当挡位，稳住加速踏板匀速一次性通过。A/B/C 错误：驻车制动/离合/踏制动不符。", "275": "A 正确：既有semi-static（半静态）调度又有动态调度场景都要进行PDCCH监测。B/C/D 错误：只有半静态不符。", "276": "B 正确：RRC Connected状态下eNB会一直保存UERadioCapability信息。A/C/D 错误：Idle/Release/detach不符。", "277": "D 正确：国际卫星系统A类站天线口径为15-18米。A/B/C 错误：3-5/11-13/12-15不符。", "278": "B 正确：负载均衡控制算法采用比较每个用户下所有业务的平均优先级策略。A/C/D 错误：最高/全部优先级/都不对不符。", "279": "B 正确：DWDM长距离大容量传输系统光源主要为半导体LD（激光器）。A/C/D 错误：LED/光纤激光器/Raman不符。", "280": "A 正确：数字微波通信常用多相数字调相方式。B/C/D 错误：多进制/组合/分组调制不符。", "281": "D 正确：每次使用SITEMASTER前必须进行校准，确保测试结果准确。A/B/C 错误：调试/重启/设置参数不符。", "282": "D 正确：两个长途交换中心间选择路由时最后才选基干路由（默认路由最后）。A/B/C 错误：迂回/高效直达/多次转接不符。", "283": "B 正确：连接OTDR、光话机等仪表时需将对端机房的该尾纤断开（防止激光损伤）。A/C/D 错误：连接/加保护/固定不符。", "284": "C 正确：两跳图像编辑电视传送编码器采样方式应选4:2:2（对应数字0.16807870370，即4:2:2采样率表示）。A/B/D 错误：数值不符。", "285": "C 正确：SPAN=0时频谱仪屏幕X轴代表时间（零扫宽时域模式）。A/B/D 错误：频率/幅度/相位不符。", "286": "B 正确：雷雨天气不要走进高压电杆、铁塔、避雷针接地导线周围20米。A/C/D 错误：10/25/30不符。", "287": "C 正确：雷暴生命周期中消散阶段云中充满下降气流。A/B 错误：积云阶段上升气流/成熟阶段混合不符。", "2832": "D 正确：变频器的主要性能不包括饱和功率（变频器无饱和功率概念）。A/B/C 正确：相位噪声/频偏/增益均为变频器性能参数。", "2833": "A 正确：变配电设备熔断器温升应低于80度。B/C/D 错误：60/30/40不符。", "2834": "A 正确：变更劳动合同应当采用书面形式。B/C/D 错误：口头/书面或口头/书面和口头不符。", "2835": "A 正确：变更后的劳动合同文本由用人单位和劳动者各执一份。B/C/D 错误：单位留存/劳动者保存/劳动行政部门保存不符。", "2836": "D 正确：避身所的类型取决于出事条件、原材料难易程度、何时使用材料等，不包括食物的来源。A/B/C 正确：均为决定因素。", "2837": "A 正确：避免爆胎的错误做法是降低轮胎气压（低气压更易爆胎）。B/C/D 正确：定期检查轮胎/清理沟槽异物/更换损伤轮胎均为正确做法。", "2838": "D 正确：避雷针与避雷接地引线的接触长度不应小于其直径的10倍。A/B/C 错误：4/6/8不符。", "2839": "B 正确：避雷线禁止与车体地线相接，避雷地线与设备地线接地钎之间距离不得小于2米。A/C/D 错误：1/3/4不符。", "2840": "A 正确：必须保证天线安装垂直方向。B/C/D 错误：水平/倾斜/南北向不符。", "2841": "B 正确：比邻模式定制网主要用于时延敏感型客户（网元下沉降低时延）。A/C/D 错误：广域优先/高隔离高保障/要求不高不符。", "2842": "C 正确：比邻模式定制网主要是UPF核心网网元下沉。A/B/D 错误：AMF/SMF/MEC不符。", "2843": "B 正确：被困洪水侵袭的建筑物中最好的逃生办法是去更高处或屋顶呆着。A/C/D 错误：逃出屋子/跳水游出/呼救不符。", "2844": "C 正确：被电击的人能否获救关键在于救援人员先切断电源或挑开电力线后施行紧急救护。A/B 错误：触电方式/人体电阻不符。", "2845": "B 正确：被称为中国版海事卫星的是天通卫星。A/C/D 错误：北斗/量子/铱星不符。", "2846": "D 正确：北斗卫星导航系统授时精度为10纳秒。A/B/C 错误：3/5/7不符。", "2847": "C 正确：北斗卫星导航系统相比GPS/GLONASS增加通讯功能，一次可传送120个汉字。A/B/D 错误：80/100/140不符。", "2848": "B 正确：北斗二号导航定位原理是通过测量卫星至用户的信号传播延迟，利用测距原理实现导航定位。A/C/D 错误：距离/速度/地理位置不符。", "2849": "B 正确：爆破作业有碍接触网及行车安全时应先停电后作业。A/C 错误：防护/封锁线路不符。", "2850": "D 正确：暴雨预警信号划分为4个等级（蓝黄橙红）。A/B/C 错误：7/6/5不符。", "2851": "A 正确：汛期保证备品备件、应急通信设备等物资充足，重点是应急油机。B/C/D 错误：卫星电话/应急通信车/无人机不符。", "2852": "A 正确：保持匀速上升时升力与重力相等（垂直方向平衡）。B/C 错误：升力大于/小于重力不符。", "2853": "A 正确：保持匀速飞行时阻力与推力相等（水平方向平衡）。B/C 错误：阻力大于/小于推力不符。", "2854": "C 正确：半功率波束角指有效辐射功率较峰值功率下降3dB的两个点之间的夹角。A/B/D 错误：0.5/2/6不符。", "2855": "B 正确：APD管灵敏度高，最低可接收光功率可达-28dBm左右。A/C/D 错误：-20/-14/-45不符。", "2856": "C 正确：山岩地沙地升温快其上空气受热后温度高产生热力对流冲击力。A/B 错误：压差作用力/温差作用力不符。", "2857": "A 正确：把模拟信号变换成数字信号过程是取样-量化-编码。B/C/D 错误：顺序不符。", "2858": "C 正确：氯酸钾和蔗糖按照3:1的比例混合可剧烈燃烧。A/B/D 错误：1:1/2:1/4:1不符。", "2859": "B 正确：把接收到的PCM信号还原成与发送端相同的PAM信号称为解码。A/C/D 错误：编码/扰码/量化不符。", "2860": "A 正确：八轴飞行器某个电机发生故障时，对应做出类似停止工作的电机应是对角电机。B/C 错误：顺时针对角不符。", "2861": "D 正确：非同步卫星按排列方式不同分为随机卫星和相位卫星。A/B/C 错误：固定/综合/赤道卫星不符。", "2862": "C 正确：自然灾害、事故灾难、公共卫生事件按社会危害程度、影响范围分为特别重大、重大、较大、一般四级。A/B/D 错误：分级不符。", "2863": "A 正确：劳动者对用人单位管理人员违章指挥、强令冒险作业有权拒绝执行。B/C/D 错误：批评/检举/控告不符。", "2864": "D 正确：突发公共事件按性质、严重程度、可控性和影响范围分为4级。A/B/C 错误：1/2/3不符。", "2865": "C 正确：按照各类突发公共事件的性质、严重程度、可控性和影响范围等因素，将突发公共事件分为四级。A/B 错误：扰乱社会事件/公共卫生事件不符。", "2866": "A 正确：按照业务主导、技术支撑的定位推进信息化建设。B/C/D 错误：谁使用谁负责/应急数字化网络安全/系统谋划分类有序不符。", "2867": "A 正确：按运行方式分类，目前国际和国内卫星通信大都是同步卫星通信系统。B/C/D 错误：非同步/中继/移动卫星不符。", "2868": "A 正确：Ⅰ级(红色)通信预警为电信网络故障经研判可能引发2个以上省（区、市）范围影响。B/C/D 错误：影响范围不符。", "2869": "D 正确：按卫星的服务区域划分有区域卫星通信网、国际卫星通信网和国内卫星通信网等。A/B/C 错误：模拟/数字/高通量不符。", "2870": "D 正确：常用馈线规格不包括5/4″。A/B/C 正确：1/2″/7/8″/1″均为常用馈线规格。", "2871": "B 正确：按计量工作要求在仪表的醒目位置应贴有检定部门的检验标签。A/C/D 错误：背面/正面/左侧不符。", "2872": "A 正确：安装气缸盖时为保证密封性，气缸盖垫片应光面朝缸体。B/C 错误：光面朝气缸盖/所有孔对准不符。", "2873": "A 正确：安装光衰减器的目的是解决收光功率在过载点附近导致接收饱和的问题。B/C/D 错误：比过载点/减少发光功率/降低接收灵敏度不符。", "2874": "C 正确：安全责任制原则是“谁使用、谁管理、谁负责”。A/B 错误：安全第一预防为主/管生产必须管安全不符。", "2875": "C 正确：安全投入是安全生产的基本保障。A/B/D 错误：基础/根本/手段不符。", "2876": "C 正确：安全生产中第一重要的是人。A/B 错误：财产/设备不符。", "2877": "C 正确：安全生产责任主体是企业。A/B/D 错误：国家/政府/员工不符。", "2878": "B 正确：安全生产是安全与生产的统一，其宗旨是安全促进生产，生产必须安全。A/C/D 错误：管理/指导/指挥不符。", "2879": "B 正确：安全生产监管主体是政府。A/C/D 错误：国家/企业/员工不符。", "2880": "D 正确：安全监督检查中发现安全生产责任制不完善等问题应责令限期改正。A/B/C 错误：违章指挥/违章作业/违反劳动纪律属当场制止类。", "2881": "B 正确：安全生产管理机构指生产经营单位专门负责安全生产监督管理的内设机构。A/C/D 错误：运营/企事业/施工单位不符。", "2882": "A 正确：安全生产管理坚持安全第一、预防为主的方针。B/C/D 错误：完善制度/基础设施/安全检查为主不符。", "2883": "C 正确：安全生产工作的主体是生产经营单位，其主要负责人是安全生产第一责任人。A/B/D 错误：监督管理部门/执法部门/业主单位不符。", "2884": "C 正确：安全色中的红色表示禁止、危险。A/B/D 错误：提醒注意/通行/重点关注不符。", "2885": "C 正确：安全色中的绿色表示提示、安全状态及通行的规定。A/B/D 错误：黄色/蓝色/红色不符。", "2886": "B 正确：安全色包括红、黄、蓝、绿四种。A/C/D 错误：黑/白不符。", "2887": "B 正确：安全监督检查按规定报告生产安全事故和事故“四不放过”的落实情况。A/C/D 错误：三同时/五同时/三个同步不符。", "2888": "B 正确：安全管理活动的中心是人员安全。A/C/D 错误：安全学习/设备安全/资产安全不符。", "2889": "B 正确：安全带购入2年后应按批量抽检，抽检合格后方可继续使用。A/C/D 错误：1/3/4不符。", "2890": "C 正确：安全带的正确挂扣应该是高挂低用。A/B/D 错误：低挂低用/低挂高用/高挂高用不符。", "2891": "C 正确：安全标志分为禁止标志、警告标志、命令标志、提示标志四类。A/B 错误：组合不符。", "2892": "D 正确：爱立信RX8200接收机有4个L-Band输入接口。A/B/C 错误：1/2/3不符。", "2893": "A 正确：艾默生开关电源DC/AC变换器中SCR可控硅不作为功率开关使用。B/C 正确：IGBT/MOSFET均为功率开关。", "2894": "D 正确：WLAN业务属于L2VPN中的E-Tree模型。A/B/C 错误：E-LAN/E-CES/E-Line不符。", "2895": "D 正确：WLAN独立热点接入现网一般单个热点带宽15M～50Mbps。A/B/C 错误：5-14/1-5/50-100不符。", "2896": "A 正确：强认证手段不包括静态密码（静态密码是弱认证）。B/C/D 正确：短信认证/指纹认证/图片认证均为强认证手段。", "2897": "A 正确：WDM系统最关键复用方式为不同频率携带不同信号。B/C/D 错误：时隙/码型/偏振不符。", "2898": "A 正确：WDM系统最核心部件是合波器/分波器。B/C/D 错误：光放大器/波长转换器/光环形器不符。", "2899": "B 正确：VSAT终端室内单元和室外单元之间通常使用同轴电缆连接。A/C/D 错误：波导/光纤/双绞线不符。", "2900": "B 正确：VSAT是甚小口径天线地球站，G/T值最接近的数值是19.0dB/K。A/C/D 错误：46.8/56.8/72.6不符。", "2901": "B 正确：VSAT指的是甚小口径卫星地球站。A/C/D 错误：超短波小口径/超短波终端/极化选择器不符。", "2902": "B 正确：VSAT小站最常用采用的接入方式是DAMA（按需分配）。A/C/D 错误：RA/CDMA/SDMA不符。", "2903": "B 正确：VSAT系统主要用于2Mb/s以下低速率数据的双向通信。A/C/D 错误：1/3/4不符。", "2904": "A 正确：VSAT系统中不属于主站构成设备的是工作站。B/C/D 正确：TDMA终端/接口单元/射频设备均为主站设备。", "2905": "D 正确：VSAT卫星通信网由若干端站与主控站协同工作构成广域稀路由的卫星通信网。A/B/C 错误：干线/多路由/少路由不符。", "2906": "C 正确：VSAT卫星便携站常用小功率固态功率放大器。A/B/D 错误：行波管/速调管/电子管不符。", "2907": "A 正确：VSAT网采用的卫星是同步静止卫星。B/C/D 错误：中轨/倾斜同步/低轨不符。", "2908": "A 正确：VSAT通信网由若干端站、固定站、主控站和卫星转发器等部分组成。B/C/D 错误：卫星控制器/遥测器/核心交换中心不符。", "2909": "A 正确：VSAT通信网络的拓扑结构没有链形结构。B/C/D 正确：星形/网状/混合形均为VSAT拓扑。", "2910": "C 正确：VSAT数据卫星通信网实际既是通信子网又是资源子网。A/B/D 错误：单一/都不是不符。", "2911": "B 正确：VSAT是Very Small Aperture Terminal的缩写，其意为甚小天线口径终端。A/C/D 错误：翻译不符。", "2912": "A 正确：VSAT端站通常采用下偏馈抛物面天线。B/C/D 错误：上偏馈/正馈/卡塞格伦不符。", "2913": "B 正确：VSAT端站通常采用SSPA（固态功放）类型功放。A/C/D 错误：速调管/TWTA/KA功放不符。", "2914": "C 正确：VSAT常用通信频段有C波段和Ku波段。A/B/D 错误：波段组合不符。", "2915": "D 正确：VSAT指具有甚小口径天线的地球站，天线口径一般为3米以内（小于3米）。A/B/C 错误：0.8/1/2不符。", "2916": "A 正确：VoLTE语音数据包间隔20ms一个。B/C/D 错误：40/80/160不符。", "2917": "C 正确：VOLTE呼叫时延0.5～2秒。A/B 错误：2-3/3-5不符。", "2918": "D 正确：VOLTE功能需要支持情况不包括CDMA网络支持。A/B/C 正确：SIM卡/终端/LTE网络支持均为必要条件。", "2919": "B 正确：VOLTE采用的传输协议是无连接的UDP协议（RTP over UDP）。A/C/D 错误：64bits/s/有连接TCP/无协议不符。", "2920": "A 正确：VoIP语音丢包率高将导致质量下降，预警值为0.002。B/C/D 错误：0.004/0.003/0.005不符。", "2921": "B 正确：VLAN即虚拟局域网，该技术部署在网络层（三层），用于隔绝三层流量。A/C/D 错误：层位不符。", "2922": "C 正确：VLAN划分方法不包括基于物理位置。A/B/D 正确：基于IP地址/基于端口/基于MAC均为划分方法。", "2923": "D 正确：VLAN的划分不包括基于物理位置。A/B/C 正确：基于协议/MAC地址/端口均为划分方法。", "2924": "A 正确：VHF鞭状天线的极化方式常为垂直极化。B/C/D 错误：圆极化/椭圆极化/水平极化不符。", "2925": "A 正确：Uu口指的是eNodeB与UE之间的接口。B/C/D 错误：eNodeB/SGW/HSS不符。", "2926": "A 正确：UPS主路输入市电断电时由电池逆变供电。B/C/D 错误：切换到旁路/电池旁路一起/UPS停机不符。", "2927": "B 正确：UPS蓄电池组中标称电压12V的单体电池端电压压差应小于120mV。A/C/D 错误：100/150/200不符。", "2928": "D 正确：UPS静态开关在逆变器输出故障时起作用，动作后负载直接由（旁路市电）供电。A/B/C 错误：动作条件/供电来源不符。", "2929": "A 正确：UPF与基站之间的接口为N3。B/C/D 错误：N4/N6/N9不符。", "2930": "D 正确：UPF与UPF之间的接口为
