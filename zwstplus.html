 正确：冷型空调器具有可靠性好、价格便宜、使用环境温度为18℃-43℃的优点。A 错误：结构复杂不符（结构简单）。", "4008": "ACD 正确：冷却液具有冷却、防腐、防冻等作用。B 错误：净化不符。", "4009": "ACD 正确：冷却液具有冷却、防腐、防冻等作用。B 错误：净化不符。", "4010": "AC 正确：冷却系统中节温器的作用是调节水温、调节水循环。B/D 错误：控制水量/防止水溢出不符。", "4011": "ABCD 正确：雷击通信电源的主要途径有变压器高压侧输电线路遭直击雷、220/380V供电线路遭感应雷、雷电流通过其它交直流负载线路、地电位升高反击通信电源。", "4012": "AB 正确：劳动合同期考核主要分为劳动合同履行期考核和劳动合同到期考核。C/D 错误：试用期/延长期不符。", "4013": "ABC 正确：拉线上把的制作方法有夹板法、另缠法、卡固法。D 错误：自缠法不符。", "4014": "AC 正确：馈线走线不正确的情况是可和避雷线一起捆扎走线、可和强电线一起捆扎走线（本题选不正确项）。B/D 正确：不可和避雷线/强电线一起捆扎走线。", "4015": "ABCD 正确：馈线安装中7/8〞馈线一次弯曲的半径、1/4〞普通馈线一次弯曲的半径、1/2〞普通馈线二次弯曲的半径、1/2〞普通馈线一次弯曲的半径均有规定要求。", "4016": "ABC 正确：馈线接头公母头区别是公连接器采用针式、一般器件上的是母头、公头中间有根针外围是活动螺母。D 错误：一般器件上的是公头不符。", "4017": "ABCD 正确：矿山、建筑施工单位和易燃易爆品、危险化学品、放射性物品等危险物品的生产、经营、储运、使用单位应当制定应急预案。", "4018": "BCD 正确：宽带V网系统由主控站、固定站、动中通、静中通及便携站等站型组成。A 错误：交换站不符。", "4019": "ABD 正确：宽带V网静中通自动对星需要获取的信息有GPS、电子罗盘、AGC(信标机电压)。C 错误：MODEM基带信息不符。", "4020": "AB 正确：宽带VSAT中固定站有大区中心固定站和省固定站两种站型。C/D 错误：市固定站/全国固定站不符。", "4021": "CD 正确：宽带VSAT系统业务模式可分为值守模式、演练模式、局部应急模式和重大应急模式。A/B 错误：商用模式/测试模式不符。", "4022": "ABCD 正确：宽带VSAT系统采用的自动切换技术包括应用切换、TOS切换、QOS切换、P2P切换。", "4023": "ABCD 正确：宽带VSAT系统采用的自动切换技术包括应用切换、TOS切换、QOS切换、P2P切换。", "4024": "ABCD 正确：宽带VSAT网中各端站间可以通过AL手动调度、基于TOS值触发、基于协议类型、负载切换方式来建立SCPC卫星链路。", "4025": "ABD 正确：宽带VSAT网中端站加电正常入网进行SCPC业务应用时570L设备面板TxTraffic灯常亮、RxTraffic灯常亮、Remote灯常亮。C 错误：TxTraffic灯突发不符。", "4026": "BC 正确：造成端站564L与570L设备间失去通信联系的情形有564L的路由指向没有指向570L、564L设备故障。A/D 错误：570L没有锁定主控站TDM/564L没有锁定SCPC载波不符。", "4027": "AC 正确：宽带VSAT网中网管轮询一组端站时间长短主要和站点数、STDMA入境载频速率因素有关。B/D 错误：TDM出境载频速率/所用卫星不符。", "4028": "AD 正确：两个端站通过主控站人工调度建立一对2048Kbps卫星通道时，端站间可以实现视频业务、同时既能实现视频业务也能实现话音业务。B/C 错误：不可以实现/只能视频不符。", "4029": "AD 正确：端站视频会议应用终端设置网关项时不可以将564L/562L IP地址、本地网管终端地址作为网关地址。B/C 正确：570L IP地址/本地交换机IP地址可作为网关地址。", "4030": "AC 正确：宽带VSAT网中端站modem可以通过重新加电modem、重新Vload配置参数方式回到入境控制信道。B/D 错误：做测试环/BUC重启不符。", "4031": "ABCD 正确：宽带VSAT网运行维护中VLOAD工具软件功能有参数备份和恢复、软件的升级、设备列表和版本信息、备份参数编辑修改。", "4032": "CD 正确：宽带VSAT网系统中属于电信的组号是101和102。A/B 错误：1/2不符。", "4033": "BD 正确：宽带VSAT网系统各端站LNB涉及到的接收本振有11300MHz和11250MHz。A/C 错误：13050MHz/12800MHz不符。", "4034": "BCD 正确：宽带VSAT网系统由主控站、固定站、动中通、静中通及便携站等站型组成。A 错误：交换站不符。", "4035": "ACD 正确：宽带VSAT网系统使用的频段有L、Ku、C。B 错误：KA不符。", "4036": "ABD 正确：宽带VSAT网系统三级平台分为现场级应急网平台、国务院级应急网平台、省级应急网平台三级。C 错误：地区级应急网平台不符。", "4037": "ABD 正确：宽带VSAT网的主要技术特点有全IP化、TDM/STDMA技术、按需分配。C 错误：动态分配不符（按需分配与动态分配二选一，答案为ABD）。", "4038": "ACD 正确：宽带VSAT网的信道分配方式可分为固定分配、动态分配、按需分配。B 错误：静态分配不符。", "4039": "ABD 正确：宽带VSAT网的网络组织结构采用树型网、网状网、混合网网络结构。C 错误：星状网不符。", "4040": "ABC 正确：宽带VSAT网网管系统采用分级管理，分别是主站级网管、省区级网管、站点级网管。D 错误：现场级网管不符。", "4041": "ABCD 正确：宽带VSAT网的工作状态定义为值守模式、演练模式、局部应急模式、重大应急模式典型模式。", "4042": "AB 正确：宽带VSAT的DAMA方式有根据业务流通(IP流量)触发和根据业务流通(IP流量)的（动态增减）两种。C/D 错误：根据业务类型触发/根据终端需求触发不符。", "4043": "ABC 正确：宽带VSAT车载站视频会议系统可在诊断状态菜单下看到日志、呼叫统计、输入口状态系统信息。D 错误：线路状态不符。", "4044": "AC 正确：跨行业联动型预案由党政军、省通管局组织实施，资源调度涉及政府、军队和电信、电力、交通、能源、消防等部门。B/D 错误：运营商/集团公司不符。", "4045": "ABC 正确：空气中水蒸气的含量通常用含湿量、相对湿度、绝对湿度来表示。D 错误：相对温度不符。", "4046": "BCD 正确：空气开关起短路保护、过流保护、开关作用。A 错误：过压保护不符。", "4047": "AB 正确：可用来测试三相交流电零线电流的是万用表和钳形表。C/D 错误：电流计/电压表不符。", "4048": "ACD 正确：流媒体协议有SRT、RTSP、RTMP。B 错误：RSTP不符。", "4049": "ABCD 正确：开挖作业时应将区域内的电力电缆、下水管下水道、煤气管、其它通信线缆等其它地下设备的具体埋设位置调查清楚。", "4050": "ABD 正确：开通静中通车载站时需打开开关电源上的电池开关、负载直流输出开关、交流输入断路器开关。C 错误：强制吸合开关不符。", "4051": "ABCD 正确：开机后断路保护动作可能原因有断路起容量不足、电源接线错误、绝缘不良、压缩机堵转或启动不良。", "4052": "ABC 正确：开关整流器的特点有重量轻体积小、功率因数高、可闻噪音低。D 错误：效率低不符（效率高）。", "4053": "ABC 正确：开关电源主要特点是安全可靠、体积小重量轻、稳压范围宽。D 错误：功耗大不符（功耗小）。", "4054": "ABC 正确：开关电源控制电路正向高频化、小型化、智能化发展。D 错误：大型化不符。", "4055": "BC 正确：开关电源参数设置中充电周期为1-3个月、充电时长为10-12小时（注意顺序）。A/D 错误：顺序不符。", "4056": "BD 正确：卡塞格伦天线的特点是噪声温度低、减小馈线损耗带来的不利影响。A/C 错误：天线效率低/易于安装不符。", "4057": "BC 正确：决定使用中蓄电池容量的因素是放电率和电解液温度。A/D 错误：极板结构/极板数量不符（那是设计决定因素）。", "4058": "ACD 正确：决定光接收机灵敏度的因素有传输速率、光检测器性能、前置放大器噪声特性。B 错误：传输波长不符。", "4059": "BD 正确：聚焦5G网络运行安全短板弱项，开展专项行动，提高云网融合、算网一体水平。A/C 错误：云网协同/云网一体不符。", "4060": "CD 正确：电离层闪烁多发于赤道附近和高纬度地区，1GHz以下低频段较容易受影响，夏季子夜的衰减较强。A/B 错误：亚热带地区/低纬度地区不符。", "4061": "ABD 正确：静中通自动对星需要获取的信息有GPS、电子罗盘、AGC(信标机电压)。C 错误：MODEM基带信息不符。", "4062": "ABC 正确：静中通自动对星系统GPS手动输入菜单中有经度、纬度、朝向选项。D 错误：极化角不符。", "4063": "ACD 正确：静中通车载站卫星天线控制器的键盘上可直接进行对星、收藏、调整方位操作。B 错误：复位不符。", "4064": "ABC 正确：静止卫星运行在同步轨道、中高度轨道、赤道轨道上。D 错误：极地轨道不符。", "4065": "ABC 正确：静电的特点一是电压高，二是静电感应突出，三是尖端放电现象严重。D 错误：电量不符。", "4066": "BC 正确：禁止通过贿赂、回扣等非法方式或对公司不利的方式与客户建立商业关系。A/D 错误：补贴/佣金不符。", "4067": "ABCD 正确：进一步健全战略执行体系，统筹协调转型战略、滚动规划、年度预算及重点任务、考核评价等关键环节。", "4068": "ABC 正确：进行室内分布设计时应该确定的区域基本信息包括位置信息、区域性质、覆盖区域的面积。D 错误：气候状况不符。", "4069": "ABCD 正确：进行超大环、超长链优化需要完成修改拓扑、布放优化光缆、制定方案、现场跳纤步骤。", "4070": "ABCD 正确：解码器输出信号一般有模拟视音频信号、SD信号、HD信号、ASI信号。", "4071": "BCD 正确：接收系统的内部噪声主要包括放大器噪声、下变频器噪声、馈线损耗噪声。A 错误：天线罩噪声不符（属外部噪声）。", "4072": "ABC 正确：接地线与防雷接地铜排连接处应采用铜鼻子、用螺栓固定连接、做防氧化处理。D 错误：用锌板不符。", "4073": "ABCD 正确：接地系统通常由接地体、接地引入线、接地汇集线、接地线部分组成。", "4074": "CD 正确：接地系统包括交流接地和直流接地。A/B 错误：工作接地/保护接地不符。", "4075": "ABD 正确：交流输入过欠电压保护测试用仪表主要包括交流电压表、调压器、秒表。C 错误：钳形电流表不符。", "4076": "ABD 正确：交流供电系统可以是变电站供给的市电、油机发电机供给的自备交流电源、UPS供给的后备交流电。C 错误：蓄电池放电不符（直流）。", "4077": "AB 正确：交流工作接地的作用是降低触电电压、迅速切断故障设备。C/D 错误：保证电力系统运行/防止设备漏电不符。", "4078": "ABD 正确：建设高度可靠融合互通的国家通信网应急通信指挥调度系统和网络，加强预防预警、决策分析、应急处置等能力。C 错误：指挥调度不符（题干已含指挥调度）。", "4079": "BC 正确：建设多维一体应急通信保障网络，加快卫星移动通信网络建设，推广5G和无人机在应急通信应用，形成多路由、多节点（的网络架构）。A/D 错误：多备份/多手段不符。", "4080": "ABCD 正确：建立全灾种应急通信手段，实现手机、卫星电话、固话、移动指挥车、视频会议系统、手持单兵等多种通信终端融合。", "4081": "BD 正确：建立合理的应急通信体系是关系国家安全、国计民生的大事。A/C 错误：国家发展/公共安全不符。", "4082": "ABD 正确：减小互调干扰的方法有载波等间隔排列、采用话音激活技术、使用固态功放及先进的线性化技术。C 错误：对下行载波功率进行控制不符。", "4083": "ABCDE 正确：检查光纤线路用光功率计或OTDR测量，用以确认发送端和接收端两端纤序是否正确、光纤是否严重弯曲、光纤是否插好、平均发送光功率是否正常、光纤是否有断纤。", "4084": "ACD 正确：驾驶员在出车前、交接时、隔夜停放应对车辆进行例行保养维护，确保车辆安全状态。B 错误：出车后不符。", "4085": "BCD 正确：驾车时系好安全带自觉做到礼让三先，包括先慢、先让、先停。A 错误：先靠不符。", "4086": "BCD 正确：驾车时系好安全带自觉做到礼让三先，包括先慢、先让、先停。A 错误：先靠不符。", "4087": "AC 正确：大型CDMA应急车使用亚太6号卫星，应急车天线朝向南偏东或东偏南有可能对到星（亚太6号轨位在东经134°E附近）。B/D 错误：北偏西/西偏北不符。", "4088": "ACD 正确：计算呼损率的因素有总呼叫次数、因设备全忙遭受损失的呼叫次数、完成通话的呼叫次数。B 错误：久叫不应用户数不符。", "4089": "ABC 正确：极化可以分为线极化、圆极化、椭圆极化。D 错误：以上都不是不符。", "4090": "ABCD 正确：基站维护的主要内容包括基站环境巡检、基站安全巡检、主设备周期检查和维护、外部警告处理。", "4091": "ACD 正确：基础电信运营企业在通信网络规划和建设中要健全网络安全防护、监测预警、应急通信保障体系。B 错误：灾害预警信息共享机制不符。", "4092": "AD 正确：基础电信运营企业要加强小型、便携等适应性强的应急通信装备配备。B/C 错误：大型/多功能不符。", "4093": "AC 正确：基础电信运营企业按照工信部统一部署，不断完善专业应急机动通信保障队伍和公用通信网运行维护应急梯队。B/D 错误：预备应急机动通信保障队伍/专用通信网运行维护应急梯队不符。", "4094": "ABC 正确：火的三角结构图三条边分别代表空气、热量、燃料，其中任意一项缺失三角关系就不成立。D 错误：干燥不符。", "4095": "ABC 正确：汇聚各相关部门自然灾害致灾因子、承灾体、历史灾害、减灾能力等灾害风险要素调查成果。D 错误：灾害链综合风险监测不符（那是成果应用）。", "4096": "ABCD 正确：灰尘多的空气流经板件易积灰散热不良过热，所以需要室内空气的温度、湿度、清洁度、气流速度适宜。", "4097": "ABCD 正确：环网柜主要由高压负荷开关、接地开关、互感器、熔断器等电气元件组成。", "4098": "ACD 正确：环回操作错误的是硬件环回可人工直接用尾纤法兰环回（需配合软件）、执行外环回后的信号流向（流向本端说法错误）、执行内环回后的信号流向（流向对端说法错误）。B 正确：对光口进行硬件环回操作时需要（注意事项正确）。", "4099": "ABC 正确：户外施工过程中产生的木屑、泡沫、油漆等易燃物品应及时清除。D 错误：钢管不符。", "4100": "AB 正确：呼救电话应简单明了语言精炼准确、讲清重要的无关的话不要说。C/D 错误：描述背景过程/详细描述到达时间不符。", "4101": "ABCD 正确：洪水来临时危险地带包括河床水库及渠道涵洞、行洪区围垦区、危房中危房上危墙下、电线杆高压线塔下。", "4102": "ABC 正确：衡量设备维修质量要素的主要三个方面有标准性、可靠性、安全性。D 错误：经济性不符。", "4103": "ABCD 正确：海事卫星通信系统主要由同步通信卫星、移动终端、海岸地球站、网络协调控制站构成。", "4104": "ABCD 正确：海事卫星通信系统中基本信道类型可分为电话、电报、呼叫申请、呼叫分配。", "4105": "BCD 正确：海事卫星通信系统由岸站、船站、通信卫星几个部分组成。A 错误：地面中继站不符。", "4106": "ABC 正确：国务院有关部门、县级以上地方各级人民政府及其有关部门、有关单位应当为专业应急救援人员减少应急救援人员的人身风险、购买人身意外伤害保险、配备必要的防护装备和器材。", "4107": "ABCD 正确：国务院印发《“十四五”国家应急体系规划》提出按照综合协调、分类管理、分级负责、属地为主的原则健全中央与地方分级响应机制。", "4108": "ABCD 正确：国家应急通信面向国家应急监测预警、分析研判、处置应对、信息传递、指挥调度等提供应急通信保障。", "4109": "ABC 正确：国家应急通信是以互联网、公众通信网、公用应急通信网等为基础，以各行业应急通信专网和多种机动通信方式为重要补充。D 错误：应急专网不符（专网是补充）。", "4110": "BD 正确：国家通信保障应急预案中专家组主要职责是承担决策咨询任务、提出处置措施建议及对有关处置方案进行综合评估等。A/C 错误：应急装备建设规划/编制应急保障预案不符。", "4111": "AD 正确：国家通信保障应急预案适用于需要国务院或国务院授权有关部门协调的突发事件、通信中断通信保障应急工作。B/C 错误：重大活动/自然灾害不符。", "4112": "ABCD 正确：国家通信保障应急预案按照影响范围将通信预警划分为特别严重、严重、较严重、一般四个等级。E 错误：其他不符。", "4113": "AD 正确：国家通信保障应急预案按照统一领导、协调联动、分级负责、属地为主原则。B/C 错误：生命至上/政务为主不符。", "4114": "ABCD 正确：国家建立健全应急物资储备保障制度，完善重要应急物资的生产、监管、储备、调拨和紧急配送体系。", "4115": "ABCD 正确：国家建立统一领导、综合协调、分类管理、分级负责、属地管理为主的应急管理体制。", "4116": "ABC 正确：国际上已采用的彩色电视制式有NTSC制、PAL制、SECAM制。", "4117": "AC 正确：国防动员需要的战略物资实行储备和调用制度。B/D 错误：备用/借用不符。", "4118": "CD 正确：光源包括半导体激光器和发光二极管。A/B 错误：发光三极管/导体激光器不符。", "4119": "AB 正确：光信号在光纤中的传输距离受到色散和衰耗的双重影响。C/D 错误：热噪声/干涉不符。", "4120": "ABC 正确：光纤线路损耗测量采取的方法是光功率计、光时域反射仪(OTDR)、光源（仪器仪表）相结合的测量方法。", "4121": "ABD 正确：光纤涂敷层的作用是保护光纤不受水汽侵蚀、防止光纤受到机械擦伤、增加光纤的柔韧性。C 错误：防止纤芯传输的光信号泄露不符（那是包层作用）。", "4122": "BCD 正确：光纤通信中适合传输的波长范围为850nm、1310nm、1550nm。A 错误：650nm不符。", "4123": "AB 正确：光纤通信的特点有传输距离远、通信容量大。C/D 错误：保密性差/存在电磁干扰不符（光纤保密性好、无电磁干扰）。", "4124": "BD 正确：光纤通信的光源通常用半导体发光二极管和半导体激光器。A/C 错误：半导体发光单极管/三极管不符。", "4125": "BC 正确：光纤通信产生误码的主要原因是噪声和脉冲抖动。A/D 错误：偏振/信息源不符。", "4126": "ABCDE 正确：光纤熔接质量的好坏直接与放电前两光纤的间隙、电极预放电强度、电极放电强度、电极放电时间、光纤推进量有关。", "4127": "ABC 正确：光纤配线架(ODF)通常由光纤终端盒、光纤连接器、光纤缓冲器组成。", "4128": "BCD 正确：光纤连接方式有固定连接、活动连接、临时连接。A 错误：保护连接不符。", "4129": "CD 正确：光纤快速连接头分为预埋型和直插型两种类型。A/B 错误：卡槽型/对接型不符。", "4130": "ACD 正确：光纤接头按形状分为LC、SC、FC。B 错误：PC不符（PC是研磨端面形状）。", "4131": "ACD 正确：光纤接入网物理拓扑结构包括星形、环形、总线形。B 错误：网形不符。", "4132": "ABC 正确：光纤端面处理包括去除光纤涂覆层、酒精清洗端面、切割刀制备端面。D 错误：盘好光纤不符（那是收容工序）。", "4133": "ABCD 正确：光纤端面的处理包括切割制备端面、去除套塑层、去除一次涂层、清洗光纤过程。", "4134": "ACD 正确：光纤端面处理要使用的工具是光纤护套剥除器、清洗工具、光纤切割刀。B 错误：PE护层开剥刀不符。", "4135": "ABCD 正确：光纤的色散类型有模式色散、材料色散、波导色散、偏振模色散。", "4136": "ABCD 正确：光纤的机械性能测试包括拉断力、筛选、剥离力、动态疲劳。", "4137": "AB 正确：光纤传输特性主要有色散和损耗。C/D 错误：模场直径/截止波长不符（属几何光学特性）。", "4138": "ABC 正确：光纤包含纤芯、包层、涂覆层部分。D 错误：套塑层不符。", "4139": "AD 正确：光网络节点可以分为光分插复用器(OADM)和光交叉连接器(OXC)两大类。B/C 错误：光中继器/光终端复用器不符。", "4140": "AD 正确：光谱分析仪可以测试中心波长和最小边模抑制比指标。B/C 错误：倒换时长/吞吐量不符。", "4141": "AB 正确：光连接器件清洁常用工具有无水乙醇和无尘棉棒。C/D 错误：矿泉水/医用酒精不符。", "4142": "ABCDE 正确：光缆线路验收的主要内容有安装工艺、光缆主要传输特性、铜导线电特性、护层对地绝缘、接地电阻。", "4143": "ABC 正确：光缆线路维护工作的基本任务是保持设备传输质量良好、保持设备完整良好、预防障碍并尽快排除障碍。", "4144": "ABCD 正确：光缆线路迁改应遵循路由稳定可靠、走向合理、便于施工维护、便于抢修原则。", "4145": "CD 正确：光缆线路维护性修理一般包括光缆塑料外护层的修复、接头盒的防水修复等。A/B 错误：人井清理/光纤熔接不符。", "4146": "AB 正确：光缆线路的实际维护工作一般可分为日常维护和技术维护。C/D 错误：抢修维护/杆路维护不符。", "4147": "ABC 正确：光缆时域反射仪OTDR事件表中可以分析光纤长度、损耗大小、损耗点距离数据。D 错误：光缆长度不符（是光纤长度）。", "4148": "ABCD 正确：光缆设施资源数据管理要求光设施端子采集完整、光缆段路由完整准确、光缆段长度芯数等关键属性准确、光纤与端子成端关系正确。", "4149": "ABD 正确：光缆结构由缆芯、护套、加强元件组成。C 错误：束管不符（束管属缆芯内部件）。", "4150": "ABCD 正确：光缆接续的一般步骤有接续前的准备及光缆开剥、光缆接头盒的组装、光缆金属构件的接续、光纤的接续及接头盒的封装。", "4151": "AB 正确：光缆接头盒按密闭操作工艺不同可分为热工式和机械式。C/D 错误：直埋式/架空式不符（那是按安装方式）。", "4152": "ABCD 正确：光缆交接箱由箱体和配线单元、熔接单元、存储单元、固缆及保护单元组成。", "4153": "ABCD 正确：光缆交接箱由箱体、配线单元、熔接单元、保护单元组成。", "4154": "BC 正确：光缆或光纤的固定连接技术分为熔接和冷接。A/D 错误：焊接/对接不符。", "4155": "ABCD 正确：光缆的成端方法有直接终端、ODF架终端、终端盒终端、室外光缆交接箱。", "4156": "ABCD 正确：光缆按照纤芯数量可以为96芯、48芯、144芯、24芯等。", "4157": "ABC 正确：光的传输主要受衰减、色散、非线效应影响。D 错误：光缆芯数不符。", "4158": "ABCD 正确：光、电调准确有助于智能信息发布、快速故障定位、集客故障电路派单、传输环网同路由分析高级应用。", "4159": "ABCD 正确：重大活动保障级别划分Ⅰ级级别高党和国家主要领导人出席、Ⅱ级级别较高党和国家领导人出席、Ⅲ级级别中包含省部级政务活动、Ⅳ级级别低包含人员规模（较小）。E 错误：周期性活动划分不符。", "4160": "AC 正确：终端选型原则是根据建网模式选择终端类型、满足特殊需求。B/D 错误：主要考虑成本/无需遵从项目需求不符。", "4161": "AC 正确：蓄电池平时都处于均充状态（错误）、基站蓄电池容量预估计测试需要（说法与题意不符）——本题选错误叙述，A错误（平时浮充）、C叙述与题意相反。B 正确：蓄电池长时间搁置后不能马上充电。D 正确：蓄电池平时都处于浮充状态。", "4162": "ACD 正确：县级传输基站拓扑图要求精确到乡镇、可用于详细掌握灾区网络受损情况、适用地震汛情台风冰冻等灾害场景。B 错误：包含二干传输/本地传输/传输（层级不符）。", "4163": "BCD 正确：双极化天线是指两个天线为一组正交极化、当接收天线极化方向与来波不匹配会产生损耗、常用单极化和双极化天线的描述正确。A 错误：天线辐射的电磁场方向就是极化方向（不完整，实际为电场方向）。", "4164": "BD 正确：双工方式用来区分上下行、5G可以使用SUL或SDL。A/C 错误：双工方式主要用来区分用户/5G不能使用FDD不符。", "4165": "BD 正确：室外馈线接头、天馈线接头都要做好防水、天线TX馈线RX馈线应在（机房端有明显区分标识）。A/C 错误：天线可以与7/8”、5/4”馈线混用/使用天线吊装馈线不符。", "4166": "AB 正确：空气断路器功能有过载保护功能、短路保护功能。C 错误：故障恢复自动合闸功能不符。", "4167": "AC 正确：静中通车载站ODU本振为13050MHz、LNB本振为11250MHz的描述正确。B/D 错误：ODU本振12800MHz/LNB本振11300MHz不符。", "4168": "CD 正确：高铁小区隧道覆盖中选择低损耗指标天线、33度天线适用在地形狭窄区域的描述正确。A/B 错误：33度天线为主/65度高增益天线为辅不符。", "4169": "AD 正确：登高作业前带安全帽安全带等个人防护用品、登塔时一边攀登一边检查（脚钉爬梯）的描述正确。B/C 错误：安全带每次使用时直接使用（应先检查）/从护笼外面攀爬上塔不符。", "4170": "BC 正确：频段越高穿透损耗不一定越高、频段越高室内阴影衰落标准（相应变化的描述正确）。A/D 错误：频段越高穿透损耗越高/室内阴影衰落标准（相反）不符。", "4171": "AC 正确：柴油电动机停机要先卸负载再停机、停机后启动开关要打到“0”位。B/D 错误：先停机再卸负载/启动开关打到“油（泵）”不符。", "4172": "ACD 正确：安全带使用维护准则有水平悬挂、用后注意维护和保管、要确保安全带经常处于完好状态。B 错误：低挂高用不符（应高挂低用）。", "4173": "ABC 正确：NB-IoT描述正确的是成本低、覆盖增强、电池寿命强。D 错误：更少的链接数不符（支持海量连接）。", "4174": "CD 正确：LTE下行既可以有UE-specific导频（DMRS）、LTE下行支持MBSFN专用（导频）的说法正确。A/B 错误：LTE下行只有CRS/只有UE-specific不符。", "4175": "ABC 正确：E-UTRAN用E-NodeB（组成）、各网络节点之间的接口使用IP（传输）、通过IMS承载综合业务的说法正确。D 错误：E-NodeB间的接口为S（X2）不符（接口名错误）。", "4176": "AC 正确：固定C频段卫星业务常用工作频段为上行5850-6425MHz、下行3725-4200MHz，上下行频率之差通常为2225MHz。B/D 错误：上行6425-6725/下行3400-3700不符。", "4177": "BD 正确：固定C扩展频段卫星业务常用工作频段为上行6425-6725MHz、下行3400-3700MHz，上下行频率之差通常为3025MHz。A/C 错误：上行5850-6425/下行3725-4200不符。", "4178": "ABCD 正确：功率控制的类型包括开环功控、闭环功控、内环功控、外环功控。", "4179": "ABCD 正确：功分器的技术指标包括分配损耗、插入损耗、隔离度、功率容限。", "4180": "AD 正确：工作接地按照电源性质分为交流接地和直流接地。B/C 错误：保护接地/防雷接地不符。", "4181": "AD 正确：工作接地按照电源性质分为交流接地和直流接地。B/C 错误：保护接地/防雷接地不符。", "4182": "ABD 正确：工业和信息化部认定的国家级专业队伍主要负责人可由本单位分管领导、本单位二级部门领导、省公司分管领导担任或兼任。C 错误：专业技术领导不符。", "4183": "ABCD 正确：国家级专业队伍人员配置应包括卫星、微波、短波、集群、无线、传输等专业。E 错误：光缆不符（本题答案为ABCD）。", "4184": "ABD 正确：工业和信息化部等部门应加强应急通信专业保障队伍建设，针对灾害分布进行合理配置，并展开培训、演练、考核。C 错误：检查不符。", "4185": "ABC 正确：根据突发事件影响范围、危害程度、通信保障任务重要性等因素设定多级通信保障应急响应等级。D 错误：社会重视程度不符。", "4186": "ABC 正确：根据所控制的信号参量的不同，调制方法可分为调幅、调频、调相。D 错误：调波不符。", "4187": "ABC 正确：根据事故的具体情况事故调查组由安全生产监督管理部门、公安机关、人民检察院组成。D 错误：事故发生单位领导不符。", "4188": "ABCDE 正确：根据光纤损耗的来源可将损耗分为吸收损耗、散射损耗、弯曲损耗、接续损耗、耦合损耗。", "4189": "CD 正确：根据光纤内传播模式数量的不同，常用光纤可以分成多模光纤和单模光纤。A/B 错误：渐变光纤/阶跃光纤不符。", "4190": "CD 正确：根据光纤横截面折射率分布的不同，常用光纤可以分成渐变光纤和阶跃光纤。A/B 错误：单模光纤/多模光纤不符。", "4191": "ABCD 正确：根据传送信号的方式分类直放站可以分为光纤直放站、微波直放站、激光直放站、无线射频直放站。", "4192": "ABCD 正确：根据《突发事件应对法》属于突发事件的有火灾、火车站恐怖袭击、不知名传染病、蝗灾。", "4193": "ABD 正确：各专业队伍参照配置标准定期更新应急通信装备，建立物资储备、维护、调度等动态管理工作机制。C 错误：更新不符（题干已含定期更新）。", "4194": "BCD 正确：各通信运营商既要保证日常通信联络正常，更要为包括自然灾害、事故灾难、公共卫生、社会安全等突发事件提供及时可靠的通信保障。A 错误：市场拓展不符。", "4195": "ABD 正确：各省应急办和机动通信局要根据本地区和大区实际持续做好自身预案的评估和修订、总结经验教训、不断完善工作。C 错误：推广不符。", "4196": "BCD 正确：各省配置的宽带VSAT网移动站设备包括静中通、动中通、便携站。A 错误：省固定站不符（固定站非移动站）。", "4197": "AC 正确：各级应急管理部门、矿山安全监察机构、地震部门和消防救援队伍要充分依托应急管理云或本地政务云部署信息系统。B/D 错误：应急指挥平台/应急大数据平台不符。", "4198": "AC 正确：个人防护用具包括安全帽和安全带。B/D 错误：安全网/叉梯不符（安全网是集体防护）。", "4199": "ABC 正确：割接失败应急预案中应该包含割接失败判定条件、割接失败后如何退回、割接失败后退回后业务检查内容。", "4200": "ABCD 正确：割接结束后要按照时限及时上报光缆线路设备变更表、光缆路由图、维护图、线路图割接完成资料。", "4201": "ABCDE 正确：割接方案上报具体要求及内容有光缆网络现状、割接后网络状况、具体割接步骤、割接具体时间安排、紧急恢复方案。", "4202": "ABCD 正确：高原救援人员应首先确保带有手持GPS、防寒套装、高原药品、氧气瓶才能更好完成任务。", "4203": "ABCD 正确：高原地区作业中正确的是初入高原者应逐级登高减少高原反应、艰险地区野外作业配备氧气、人均每日饮用水量不少于规定量、高原作业严禁饮酒。", "4204": "BC 正确：高压熔断器用于对输电线路和变压器进行短路保护和过流保护。A/D 错误：过压保护/欠压保护不符。", "4205": "ABD 正确：高温下车况特点是润滑油容易变质和烧损、零件磨损加剧、制动性能变差。C 错误：发动机充气系数上升不符（高温充气系数下降）。", "4206": "ABCD 正确：高温下安全行车要求掌握高温行车规律、防止疲劳驾驶、充分休息确保旺盛精力、对车辆认真检查和维护确保状态良好。", "4207": "ABCD 正确：高频开关电源系统由交流配电、整流模块、直流配电、监控单元组成。", "4208": "ABC 正确：高频开关电源的主要优点有效率、扩容方便、体积小。D 错误：价格低廉不符。", "4209": "ABCD 正确：高空作业人员必须定期体检，患有精神病、癫痫病、高血压、视力听力严重障碍等疾病不能进行高空作业。", "4210": "ABCD 正确：高空作业场地要求包括确保足够场地和空间、操作平台应显著标明容许荷载、操作平台有开口的要安装扶手、确保作业区域有充足的光亮度。", "4211": "ABCD 正确：高空作业场地要求包括确保足够场地和空间、操作平台应显著标明容许荷载、操作平台有开口的要安装扶手、确保作业区域有充足的光亮度。", "4212": "AC 正确：高功放放大两临近载波f1及f2，三阶互调产物为2f1-f2和2f2-f1。B/D 错误：2f1+f2/2f2+f1不符。", "4213": "ABCDE 正确：感染性休克的抢救原则有补充有效循环血量、适当使用血管活性药物、积极控制感染、早期应用糖皮质激素、纠正水电解质和酸碱紊乱。", "4214": "ABCD 正确：杆路设备包括电杆、吊线、挂钩、电杆的支撑加固装置和保护装置。", "4215": "AB 正确：杆路段以起止站点命名时，建议杆号编排的方向为从北向南、从东向西。C/D 错误：从西向东/从南向北不符。", "4216": "ABCDE 正确：覆盖区有很强信号但拨打和通话困难可能原因有上行链路增益不够、上行链路处于自激状态、直放站滤波器原因、直放站滤波器原因（两处重复选项）、半干电缆损坏。", "4217": "AC 正确：覆盖区大小与天线的高度、增益有关。B/D 错误：位置/以上都不是不符。", "4218": "AC 正确：覆盖区大小与天线的高度、增益成比例。B/D 错误：位置/以上都不是不符。", "4219": "ABCD 正确：覆盖测试站点选择需要满足优选开阔区无遮挡的郊区、能满足纵向横向拉远需求、有共站4G站点方便对比、有合适建筑物方便室内覆盖对比要求。", "4220": "ABC 正确：负荷功率因数低造成的影响是有功损耗增大、发电设备未能充分发挥作用、线路电压损失增大。", "4221": "BD 正确：非线性器件最主要特点是当输入功率小于饱和点时设备工作在线性区，而当输入功率进一步增大进入饱和区。A/C 错误：额定功率一半/线性区不符。", "4222": "ABCD 正确：非线性放大器对信号的影响有交调干扰、信号频率扩展、信号抑制现象、调制变化。", "4223": "ABCD 正确：非线性放大器对信号的影响有交调干扰、信号频率扩展、信号抑制现象、调制变化。", "4224": "ABCDE 正确：防止直接触电的安全技术措施有绝缘、屏护、间距、安全电压、漏电保护装置等。", "4225": "ABCD 正确：防止水淹通信设施安全防护措施有防汛准备期间将通信设施垫高、低洼地势通信设施做好防水、车辆停放在地势较高处、暴雨期间加强值守对机房内通信设备进行检查。E 错误：光缆临时放置在路边或横跨水面不符（应避免）。", "4226": "ABCD 正确：防止路由环路的方法有水平分割、抑制时间、毒性逆转、触发更新。", "4227": "ABCD 正确：防止间接接触电击的方法包括保护接地、工作接地、重复接地、保护接零。", "4228": "ABCD 正确：防止间接接触电击的方法包括保护接地、工作接地、重复接地、保护接零。", "4229": "ABCDEF 正确：防汛抗洪保障中的涉电作业人员必须配置一顶安全帽、一条安全带、一双绝缘鞋、一双绝缘手套、一支试电笔、一架绝缘梯安全防范设施。", "4230": "ABCD 正确：防雷装置包括接闪器、地下引线、过压保护器、接地装置。", "4231": "AB 正确：防雷接地系统包括设备防雷和建筑防雷。C/D 错误：地线防雷/电缆防雷不符。", "4232": "AC 正确：防雷保护器的作用有泄流和防雷。B/D 错误：反馈信号/传输信号不符。", "4233": "ABC 正确：反射面型天线的特点是方向性好、增益高、便于电波的远距离传输。D 错误：功率大不符。", "4234": "ABCD 正确：阀控式铅酸蓄电池由正负极板、隔板、极柱、安全阀及外壳等部分组成。", "4235": "AB 正确：阀控式密封铅酸蓄电池安全阀的作用是将过压的氢气氧气释放出蓄电池、防止空气进入蓄电池内部。C/D 错误：防酸隔爆作用/过滤作用不符。", "4236": "ACD 正确：发生特大事故或群伤事故，事故单位主要领导、安保部门主要领导、综合部主要领导、公司有关领导应赶赴现场。B 错误：分管领导不符。", "4237": "ABCD 正确：发电机组在供电电压频率不正常不稳定、水温过高、发电机组有异响冒烟等现象、过载情况下应立刻停机检查。", "4238": "AC 正确：发电机组根据柴油机的冷却方式分为水冷和风冷。B/D 错误：自然冷却/空调冷却不符。", "4239": "BCD 正确：发电机组的空载试机可以是15min、20min、25min。A 错误：10min不符。", "4240": "ABC 正确：发电机在闲置不用时应放置在干燥、通风、避光环境下。D 错误：低温不符。", "4241": "ABC 正确：发电机三相输出电压不平衡的原因主要是定子的三相绕组某一相或两相（短路/断路）、定子的三相绕组某一相或两相（匝间短路）、外电路三相负载不平衡。D 错误：发电机组接地不良不符。", "4242": "ABD 正确：发电过程中不得将排气口对准车辆、机房室内、易燃物品。C 正确：机房室外可以。", "4243": "ABCD 正确：发电操作安全规范中严禁油机运行时添加燃油或机油、把油机输出电缆直接搭接在闸刀上、加油时抽烟、把移动油机放在基站机房内发电。", "4244": "ABC 正确：多天线技术中主要的增益包括分集增益、赋形增益、空间复用增益。D 错误：编码增益不符。", "4245": "ABC 正确：对远端站的电磁干扰主要由地面微波站、雷达系统、高压电气线路及设备等几个方面造成。D 错误：轮船不符。", "4246": "ABD 正确：对于中暑患者正确的应对方法有尽快抬至阴凉通风处、抬高头肩部半躺下、不停扇风。C 错误：用热毛巾擦拭不符（应冷敷）。", "4247": "ABD 正确：载波叠加技术需要把合成信号（叠加）、本端MODEM需要把自己的（信号特征告知对方）、载波对MODEM的Eb/N0（有影响）的描述正确。C 错误：时延搜索范围越大搜索信号越（好）不符。", "4248": "ABCD 正确：光纤布放正确的是布放后不应有其它电缆或物品（压住）、尾纤在线扣环中可自由抽动（便于维护）、布放尾纤时拐弯处不应过紧或（受力）、尾纤保护套管切口应光滑。", "4249": "AC 正确：对于缆芯扎纱，说法错误的是扎纱起到装饰的作用、没有作用（本题选错误说法）。B 正确：扎纱能够固定缆芯。", "4250": "ABC 正确：对蓄电池热失控主要的外部因素有环境温度、浮充电压、通风条件。D 错误：日常维护不符。", "4251": "AB 正确：对纤芯进行衰耗值评估常用的仪表有光源和光功率计。C/D 错误：OTDR/可见光笔不符。", "4252": "AB 正确：对接收系统的基本要求是极高的灵敏度和足够的通频带。C 错误：极大的内部噪声不符（应噪声小）。", "4253": "ABCD 正确：对患有听力严重障碍、精神病、癫痫、高血压等疾病的人员一律不准从事高处作业。", "4254": "AD 正确：对光源进行调制目前有直接调制和间接调制方法。B/C 错误：CAP/DMT不符（那是调制格式）。", "4255": "ABC 正确：对发生的火灾处理原则“三不放过”是原因不明不放过、肇事者和职工没有受到教育不放过、没有采取有效的预防措施不放过。D 错误：肇事者和责任人没有受到处理不放过不符（应为查清原因/教育/措施）。", "4256": "ABC 正确：对动力设备的监控有模拟量、数字量、开关量。D 错误：信息数据不符。", "4257": "ABD 正确：断路器按灭弧介质可分为油断路器、六氟化硫(SF6)断路器、真空断路器。C 错误：空气断路器不符。", "4258": "ABD 正确：短波(单边带机或者HF)主要利用散射波、天波和地波传播。C 错误：绕射波不符。", "4259": "BD 正确：端站正常对星加电开启后小站能收到主站控制信号但VMS网管捕获不到小站状态，原因是主站发射信号电平过低、小站发射频偏过大。A/C 错误：小站发射电平过低/主站发射频偏过大不符。", "4260": "ABD 正确：端站开启570L状态正常接收EbN0约14dB但主控站网管（捕获不到），原因是端站BUC未打开、端站modem发射功率不够、发射电缆故障。C 错误：端站天线未对准卫星不符（对星正常）。", "4261": "ABC 正确：570L在VMS网管中正常显示绿色但562L/564L显示灰色，原因是562L/564L的IP地址（设置错误）、562L/564L与570L（之间连接故障）、562L/570L的路由表（配置错误）。D 错误：570L的路由表设置不正确不符。", "4262": "ABD 正确：CDM570L正常接收主站TDM载波后面板状态灯UNITSTATUS常绿、ONLINE常绿、RxTRAFFIC常绿显示正确。C 错误：TxTRAFFIC常绿不符（此时未发SCPC业务，应为闪烁或灭）。", "4263": "ABC 正确：CDM570L正常接收主站TDM载波后发起SCPC应用，面板状态灯UNITSTATUS常绿、ONLINE常绿、TxTRAFFIC常绿显示正确。D 错误：TxTRAFFIC闪绿不符。", "4264": "ABD 正确：渡河前选择正确渡河地点应避开难以攀爬的陡峭河岸、避开水中的障碍物、寻找水流相对平缓的水域。C 错误：内湾处水流最急而且此处陡（不对，外湾缓）不符。", "4265": "AD 正确：毒物泄露伤害严重程度与毒物泄露量、环境大气参数都有密切关系。B/C 错误：人的误操作/工艺危险性不符。", "4266": "ABCD 正确：动中通卫星通信车在车静止、车行进中、车进隧道、地下车库状态下都可以换星（对星系统支持多种状态换星）。", "4267": "AB 正确：动中通对星菜单中有静态对准和动态对准选项。C 错误：收藏不符。", "4268": "ABC 正确：动中通车载站卫星天线系统由天线单元、惯性导航系统、天线伺服系统等组成。D 错误：会议电视系统不符。", "4269": "ABC 正确：动中通车载站上的逆变器对音视频系统、摄像机、吸顶式空调等设备供电。D 错误：卫星功放不符（功放由直流或专用电源供电）。", "4270": "ABD 正确：动中通车载站的24v电池组对场地照明灯、支撑腿驱动、应急照明灯设备进行供电。C 错误：发电机启动不符（发电机由启动电池供电）。", "4271": "ABC 正确：动力设备监控量包括数字量、模拟量、开关量。D 错误：数据不符。", "384": "C 正确：SSB块中PBCH占用了3个符号（符号2-4）。A/B/D 错误：1/2/4不符。", "385": "C 正确：SDH中STM-4速率为622MBit/s（155.52×4）。A/B/D 错误：100/155/2.5G不符。", "386": "B 正确：SDH自动线路保护（APS）为复用段传输提供保护。A/C/D 错误：中继段/通道/光路不符。", "387": "A 正确：VC4可解复用成63个VC12（63×2M）。B/C/D 错误：62/64/61不符。", "388": "C 正确：SDH帧结构中通道开销用POH表示。A/B/D 错误：RSOH/MSOH/PAYLOAD不符。", "389": "A 正确：SDH基本复用结构一个155M最多可映射63个2M信号。B/C/D 错误：21/64/32不符。", "390": "B 正确：SDH告警中远端误码指示英文缩写为REI。A/C/D 错误：PLM/RDI/TIM不符。", "391": "C 正确：根据衰耗预算公式计算最大中继距离为74.4km（(Ps-PR-PP-Mc-Ac)/α）。A/B/D 错误：62.4/67.4/79.4不符。", "392": "D 正确：OTN中BDI（后向缺陷指示）维护信号从下游站点传往上游站点。A/B/C 错误：AIS/LCK/IAE是前向信号。", "393": "C 正确：OTDR中光检测器将光纤反射回来的光信号转换为电信号。A/B/D 错误：脉冲发生器/放大器/定向耦合器不符。", "394": "D 正确：OSI七层模型中工作在第三层以上的网间连接设备是网关。A/B/C 错误：网桥（二层）/集线器（一层）/中继器（一层）不符。", "395": "C 正确：ONU收光测试需将光功率仪表波长设置为1490nm（下行波长）。A/B/D 错误：850/1550/1310不符。", "396": "C 正确：OLT上删除ONT的命令是ont delete。A/B/D 错误：undo ont/no ont/ont cancel不符。", "397": "B 正确：NSA组网SN添加基于B1事件，SN释放基于A2事件。A/C/D 错误：事件组合不符。", "398": "D 正确：锚点加腿B1门限-105dBm，NR删腿A2门限设为-115dBm（留滞回差）。A/B/C 错误：-85/-95/-105不符。", "399": "C 正确：NR接近上行最高速率要求MCS值最低为25。A/B/D 错误：20/32/16不符。", "400": "D 正确：UE空闲态主要参考SS RSRP（同步信号参考信号接收功率）判断小区信号强度。A/B/C 错误：RSRQ/Serving RSRP/CSI RSRP不符。", "401": "B 正确：MPLS VPN组网中LDP协议能够为“私网”信息分配标签。A/C/D 错误：ISIS/BGP+/BGPv4/OSPF不符。", "402": "A 正确：192.168.1.0/24网段给MCC监控地址分配，可用主机地址为254个（256-2）。B/C/D 错误：257/255/256不符。", "403": "C 正确：LTE网管修改登陆密码属于安全管理模块。A/B/D 错误：配置/性能/动态管理不符。", "404": "A 正确：LTE基站后台修改站点位置区域码后应执行整表同步。B/C/D 错误：增量同步/配置上载/都不对不符。", "405": "B 正确：159.226.181.1是B类地址（128-191段）。A/C/D 错误：A/C/D类不符。", "406": "A 正确：IPRAN网络中基站接入设备简称为A设备（接入层）。B/C/D 错误：B设备（汇聚）/U设备/ER设备不符。", "407": "C 正确：星型互连不是IPRAN A设备的互联方式（A设备间环形/树形双归/链式互连）。A/B/D 错误：环形/树形双归/链式均为互联方式。", "408": "B 正确：“设备全部升级完成后才可以进行网管升级”错误（网管与设备升级有独立流程），本题选错误项。A/C/D 正确：主用网管升级流程均正确。", "409": "C 正确：IPRAN升级中对现网业务造成影响的是设备复位重启阶段。A/B/D 错误：准备/软件拷贝/解压阶段不影响业务。", "410": "B 正确：“检查是否存在动态路由协议”错误（IPRAN采用静态路由+BGP，动态路由检查非重点），本题选错误项。A/C/D 正确：BFD/静态ARP/配置正确性检查均正确。", "411": "B 正确：HPA开机延时3-5分钟，待“STANDBY”灯黄灯亮方可加高压。A/C/D 错误：熄灭/绿灯亮/黄灯闪烁不符。", "412": "D 正确：HPA增益测试一般在小信号下选高、中、低三个频点进行。A/B/C 错误：饱和点/大信号/回退3db不符。", "413": "A 正确：GPON FTTH场景一级分光推荐使用1:8分光（0.08611111111为1:8对应值）。B/C/D 错误：分光比不符。", "414": "C 正确：FTTH自动开通卡单到EMS，登陆网管在安全-日志管理中查看操作日志。A/B/D 错误：光猫/OLT日志不符。", "415": "A 正确：E-UTRAN中MAC使用的重传方式是HARQ（混合自动重传）。B/C/D 错误：FEC/ARQ/FEC+ARQ不符。", "416": "B 正确：eNodeB物理层与MAC子层间的SAP是传输信道。A/C/D 错误：逻辑/物理信道/无线承载不符。", "417": "A 正确：DWDM光源除标准稳定波长外，还要具有比较大的色散容纳值（容许色散积累）。B/C/D 错误：较大功率/较大谱宽/较小线宽不符。", "418": "A 正确：C频段卫星通信天线仰角≥5°才能有效减少大气吸收和雨雾衰减。B/C/D 错误：7/10/12不符。", "419": "A 正确：CDMA反向功控作用对象是手机，前向功控作用对象是基站。B/C/D 错误：作用对象组合不符。", "420": "C 正确：CDMA系统中被加密的信道是信令信道和业务信道（都加密）。A/B/D 错误：只有信令/只有业务/都不对不符。", "421": "B 正确：A5事件加快切换应增加A5门限1，同时减少A5门限2（缩小触发区间）。A/C/D 错误：增减组合不符。", "422": "C 正确：5G中PDSCH最大调制为256QAM。A/B/D 错误：64/128/512不符。", "423": "C 正确：5G无线接入网的设备是gNodeB。A/B/D 错误：BTS/BSC/eNodeB是2G/4G设备。", "424": "A 正确：5G网络中承担本地业务分流功能的网元是UPF（用户面功能）。B/C/D 错误：SMF/MEC/5GC不符。", "425": "B 正确：5G中AAU是有源天线单元（射频+天线一体化）。A/C/D 错误：分布式皮基站/处理单元/无源天线不符。", "426": "A 正确：5G技术中Massive MIMO用于提升接入用户数（多用户空分复用）。B/C/D 错误：SOMA/Massive CA/1mcTTI不符。", "427": "C 正确：5G QoS中UE聚合最大比特率由UE-AMBR确定。A/B/D 错误：MFBR/GFBR/Session AMBR不符。", "428": "B 正确：35千伏以上电力线下方或附近作业，架线紧线打拉线时必须严防接触，保持最小距离4米。A/C/D 错误：2.5/4.5/6不符。", "429": "B 正确：2.4GHz频段WLAN同一覆盖区域内仅有3个无重叠信道（1/6/11）。A/C/D 错误：9/17/13不符。", "430": "D 正确：CDMA2000中wAlsh码长度可变，最短1位，最长256位。A/B/C 错误：32/64/128不符。", "431": "B 正确：1530-1565nm窗口四波混频效应最严重的光纤是G.653（色散位移光纤零色散点）。A/C/D 错误：G.652/G.654/G.655不符。", "4272": "ABC 正确：动力环境设备可以分为电源设备、空调设备、环境三类。D 错误：监控设备不符。", "4273": "ABC 正确：定向站相对于全向站的优点有定向天线减少干扰、提高频率复用、增加系统容量。", "4274": "ABC 正确：调制是通过改变高频载波的幅度、相位、频率使其随着基带信号幅度的变化而变化来实现的。D 错误：角度不符。", "4275": "BCD 正确：电源线与传输线走线应当走线顺直、两线分开并保持150mm以上距离、避免穿越。A 错误：合并走线不符。", "4276": "ABCD 正确：电源设备包括高压配电设备、UPS、逆变器、整流配电设备。", "4277": "ABCD 正确：电源变换设备包括相控整流器、开关整流器、逆变器、蓄电池。", "4278": "ABCD 正确：电信网之间应当按照技术可行、经济合理、公平公正、相互配合的原则实现互联。", "4279": "BCD 正确：电信生产其机房作业由专门的值机员机务员完成，作业内容是值守、维护、检修固定电话、无线电话等设备。A 错误：安装不符。", "4280": "ACD 正确：电信机房是指包含在站点(机站)内的安装有通信设备、其他辅助设施附属、光缆成端的房间。B 错误：电源设备不符。", "4281": "ACE 正确：电网电压太低将造成空调压缩机运转电流过高、易造成压缩机烧毁、易造成驱动继电器损坏。B/D 错误：制冷量减少/风扇转速低不符。", "4282": "ABD 正确：电视矩阵中1个源可以切换到1个、2个、按矩阵容量个目的地。C 错误：无数个不符（受矩阵容量限制）。", "4283": "AB 正确：电视矩阵所切换的信号是指视频和音频。C/D 错误：中频信号/射频信号不符。", "4284": "AB 正确：电视矩阵所切换的信号是指视频和音频。C/D 错误：中频信号/射频信号不符。", "4285": "ABC 正确：电热型空调器冬季使用时降冷热转换开关置于热风位置，此时电风扇工作、电热器工作、压缩机不工作。D 错误：以上都不工作不符。", "4286": "AB 正确：电热器安装在电热型空调器的室内蒸发器和离心风扇之间。C/D 错误：冷凝器/膨胀阀不符。", "4287": "ABC 正确：电气设备一般采用熔断器、自动空气开关、过电流继电器等作为短路保护措施。D 错误：一般保险丝不符（与熔断器重复）。", "4288": "ABCD 正确：电喷式柴油机的优点有改进了柴油机的调速控制、改善了燃油经济性、降低柴油机的排气烟度、减少柴油机的维护工作量。", "4289": "ABC 正确：电能的质量指标包括电压、频率、波形。D 错误：振幅不符。", "4290": "BCD 正确：电流的三大效应有磁效应、热效应、化学效应。A 错误：电效应不符。", "4291": "ABCD 正确：电力机房应建立的技术资料有机房设备平面布置图、交直流供电系统图、供电系统布线图和配线表、设备说明书。", "4292": "BD 正确：电力电缆是由导体和绝缘层及外层护套组成。A/C 错误：金属/非导体不符。", "4293": "ABC 正确：电击的特征有人体的外表留下显著的痕迹、伤害人体内部、致命电流较大。D 错误：致命电流小不符（电击致命电流小是误区，电击特征是致命电流较大）。", "4294": "ABD 正确：电话通信网的质量要求在稳定质量、传输质量、接续质量三个方面提出要求。C 错误：外观质量不符。", "4295": "AB 正确：电磁噪声通常是脉冲的、随机的，但也可以是周期的。C/D 错误：骚扰的/无用的不符。", "4296": "ACD 正确：电磁波的特性可用传播速度、频率、波长表示。B 错误：中波不符（那是波段）。", "4297": "ABCD 正确：电池月度维护必须要做的工作有清洁电池检查电池漏液、浮充电压测量、检查电池膨胀变形、检查连接条是否松动或腐蚀。E 错误：核对行放电测试不符（那是年度/季度工作）。", "4298": "ABCD 正确：电池漏液可能由于使用时间过长密封材料老化、壳盖密封不严、极柱密封不严、注液量过多从安全阀溢出原因造成。", "4299": "ABCD 正确：电池的分类有原电池、蓄电池、贮备电池、燃料电池。", "4300": "ABC 正确：电波在各种媒介质及其分界面上传播过程中，由于反射、折射、散射，其传播方向经历各种变化。D 错误：回射不符。", "4301": "ABCD 正确：电波传播过程中按电场强度定点轨迹可将电波划分为椭圆极化波、圆极化波、线极化波、垂直极化波。", "4302": "ACD 正确：电波传播的衰落与异常主要为电离层、大气闪烁、降雨影响。B 错误：物理层不符。", "4303": "ABC 正确：低压交流供电系统自动切换包括两路市电电源在低压供电系统切换、市电与备用发电机组的切换、通信楼电力机房交流引入电源（切换）。D 错误：多路油机的切换不符。", "4304": "BCD 正确：地球站天线跟踪卫星的方法有程序跟踪、自动跟踪、手动跟踪。A 错误：自适应跟踪不符。", "4305": "ABC 正确：地球站接收分系统的主要要求噪声温度低、工作频带宽、增益稳定。D 错误：射频频率稳定度高不符。", "4306": "ABC 正确：地球站的系统联测项目主要包括上行系统联测、下行系统联测、基带-射频-基带环路测试三个方面。D 错误：监测系统测试不符。", "4307": "BC 正确：地球站的接收品质因数G/T值定义为接收天线的增益与接收系统噪声温度之比。A/D 错误：接收天线的频率/电平值不符。", "4308": "BD 正确：地球磁场北方的某点电子罗盘感应指示值与地图标示北、真北比较，其差值为该点的磁偏角。A/C 错误：电子感应北/磁北不符。", "4309": "ABC 正确：地面站一般采用的低噪放有LNA、LNB、LNC。D 错误：LND不符。", "4310": "AC 正确：地方各级应急管理部门要加强应急通信保障力量建设，充分利用各类应急通信保障资源，以消防救援队伍为主提高（保障能力）。B/D 错误：应急救援保障/国家应急通信队伍不符。", "4311": "ABCD 正确：地方各级应急管理部门要充分利用共享平台生产发布具有地方特色的应急管理科普宣教内容，包括安全知识、应急意识、防灾避险、自救互救。", "4312": "ABCDE 正确：导致手机信号波动的主要原因有发射信号功率波动、小区重选或切换、功控或DTX、多径效应、天线安装不稳而摇动。", "4313": "ACD 正确：导致电池浮充电压相对低的原因可能有隔板渗透短路、电解液中混入杂质(Fe、S等)、电压设置过低。B 错误：内部电阻增加不符（内阻增加浮充电压会偏高）。", "4314": "ABCD 正确：一台OLT上行带宽2G、用户带宽10M、下带1000个用户时，会出现下载速率不达标、玩游戏不流畅、无法观看高清电信节目、观看直播电视出现马赛克现象。", "4315": "BD 正确：当行波管高功放开始老化时表现出的故障现象为螺旋线电流值变大、输出功率自动变大。A/C 错误：螺旋线电流值变小/输出功率自动变小不符。", "4316": "AC 正确：当邻星的某个上行站大幅增加上行功率、上行天线偏向时，会对我星产生突发的上行邻星干扰。B/D 错误：增加下行功率/下行天线偏向不符。", "4317": "AC 正确：当邻星的某个上行站大幅增加上行功率、上行天线偏向时，会对我星产生突发的上行邻星干扰。B/D 错误：增加下行功率/下行天线偏向不符。", "4318": "ABCD 正确：当空调出现过滤网脏堵、膨胀阀冻结、压缩机或风机故障、制冷剂过少故障现象时会导致基站室温过高。", "4319": "ABCDE 正确：发生大面积光缆中断基站停电退服形成孤岛时，需备有省级行政区划图、县级行政区划图、省级传输拓扑图、县级传输基站拓扑图、交换拓扑图辅助指挥。F 错误：本地无线拓扑图不符。", "4320": "ABC 正确：多个载波共用一部行波管高功放放大时，由于管子非线性导致载波间互调，需将功放输出功率回退1～2dB、3～4dB、5～6dB。D 错误：6～7dB不符。", "4321": "ABCD 正确：OLT下带全部用户都不能上网时可能的原因有OLT上行口故障、上行光路故障、上行链路故障、上联设备问题。", "4322": "ABCE 正确：单模光纤连接损耗产生因素主要有本征因素、轴心错位因素、轴向倾斜因素、纤芯变形因素。D 错误：静态疲劳因素不符。", 
"4323": "ABCD 正确：单模光纤的优势是损耗小、抗干扰、色散小、制作简单。", "4324": "AB 正确：单管塔高度测量使用红外线测距仪和测绳进行测量。C/D 错误：根据经验估计/测量杆不符。", "4325": "ABCD 正确：单兵图传接收系统一般包括接收机、天馈部分、信道滤波及变频部分、供电部分。", "4326": "BD 正确：大气吸收损耗存在两个吸收峰值点：第一个峰值点在22.3GHz频率处（水蒸气谐振吸收），第二个在60GHz处。A/C 错误：10.5/50.5不符。", "4327": "ABC 正确：大气对电磁波传输的影响有大气的吸收作用、雨雾的散射影响、大气引起的折射。", "4328": "ABC 正确：大气层对卫星通信信号的不利影响有附加大气损耗、附加雨衰、大气对流引起传输时延的不稳定。D 错误：多径干扰严重不符（卫星链路视距无多径）。", "4329": "ABC 正确：大气层对卫星通信微波信号的主要不利影响有附加大气衰耗、附加雨衰、大气对流引起线路时延的不稳定。D 错误：多径干扰严重不符。", "4330": "ABC 正确：大规模天线带来的增益有赋形增益、阵列增益、空分复用增益。D 错误：发射功率增益不符。", "4331": "ACD 正确：从业务针对性的实现方式预案可分为专项预案、应急联动预案、通用预案。B 错误：党政军预案不符。", "4332": "ABD 正确：从物理层次划分5G承载网被分为前传网、中传网、回传网部分。C 错误：后传网不符。", "4333": "AD 正确：从伤亡事故性质方面认定，生产安全事故可分为自然事故和责任事故。B/C 错误：技术事故/管理事故不符。", "4334": "ABD 正确：从结构上可以将城域网分为核心层、汇聚层、接入层。C 错误：物理层不符。", "4335": "AC 正确：从结构上可将耦合器分为微带和腔体。B/D 错误：柱状/球型不符。", "4336": "ABD 正确：大气层可分为对流层、平流层、电离层。C 错误：平衡层不符。", "4337": "AC 正确：纯ALOHA(P-ALOHA)工作特点是完全随机接入、分组不会堆积在个别站。B/D 错误：要考虑信道噪声/负载G是正（比）不符。", "4338": "ABCD 正确：触电急救法有迅速切断电源、一时找不到闸门可用绝缘物挑开电源、立即将触电者抬到通风处解开衣服、可用盐水或凡士林纱布包扎局部（烧伤）创面。", "4339": "ABC 正确：触电急救步骤有摆脱电源（断开电源等方法）、简单诊断（查看意识呼吸心跳）、现场急救（根据伤者情况采取心肺复苏等措施）。D 错误：通知家属带人去医院就医不符。", "4340": "ABCD 正确：处理锈迹时要用到钢刷、去锈剂、汽油、干净棉布。", "4341": "ABCD 正确：出队前准备工作有通过各种途径了解工作区自然情况、出队前进行安全生产教育学习、每个普查组必须配备保健箱及药品、野外作业人员不得少于2人（并携带通信工具）。", "4342": "AC 正确：车载卫星设备场地选择基本原则有车辆应停在相对平整且坚实地面、车辆对星方向应尽可能空旷无障碍。B/D 错误：车辆停放使天线朝向正北方/车辆不需要打支撑不符。", "4343": "ACD 正确：车载式地球站测试一般可分为单机测试、卫星链路开通测试、分系统测试。B 错误：联机测试不符。", "4344": "ABC 正确：车载柴油机发电机组由柴油发电机组、发电控制检测系统、电源电缆收放系统、电源输出部分、油机市电转换部分和车辆等部分组成。", "4345": "BCD 正确：常用的卫星应急通信装备有卫星应急通信车、卫星机动便携站、卫星移动电话。A 错误：卫星测控站不符。", "4346": "BC 正确：常用的天线增益单位有dBd和dBi。A/D 错误：dBm/dB不符。", "4347": "ABD 正确：常用的馈线种类为1/2〞、7/8〞、15/8〞。C 错误：10/9〞不符。", "4348": "BC 正确：常用的7/8\"馈线卡有双联和三联两种。A/D 错误：单卡/多联不符。", "4349": "ABD 正确：常见的接地包括保护接地、工作接地、防雷接地。C 错误：联合接地不符（联合是组合形式）。", "4350": "ABCD 正确：常规柴油机燃油供给系统由油箱、输油泵、输油管、柴油滤清器、高压油泵、喷油器等部分组成。E 错误：机油滤清器不符（属润滑系统）。", "4351": "ABC 正确：柴油机过热的原因主要有冷却系统故障、柴油机长时间超负荷运转、供油提前角过小。D 错误：各缸喷油不均匀不符。", "4352": "AB 正确：柴油机发不出规定功率的问题主要原因有配气机构及进排气系统故障、压缩压力不足。C/D 错误：气门弹簧损坏/汽缸盖喷油器孔漏气不符。", "4353": "ABCD 正确：柴油机的进排气系统包括进排气歧管、空气滤清器、汽缸盖或汽缸体中的进排气道、排气消声器。", "4354": "ACD 正确：柴油发动机组运行时通过冷却水温是否过高、油压是否过低、转动声音是否正常指标判断是否正常。B 错误：是否有震动不符（轻微震动属正常）。", "4355": "ACD 正确：柴油发动机组运行时通常通过冷却水温是否过高、油压是否过低、转动声音是否正常指标判断是否正常。B 错误：是否有震动不符。", "4356": "BCDE 正确：柴油发电机组应保持机油燃油及其容器清洁，按说明书要求定期清洗和更换机油滤清器、燃油滤清器、空气滤清器、冷却液。A 错误：气缸垫不符。", "4357": "BCD 正确：柴油发电机组需要经常更换或清洗的零部件有柴油滤清器、空气滤清器、机油滤清器。A 错误：油底壳不符。", "4358": "ABCD 正确：柴油发电机组运行过程中若出现过载、短路、飞车、过频、水温过高、机油压力过低等异常情况均能进行自动保护。", "4359": "ABC 正确：柴油发电机组工作时润滑系统工作状况分别用油温表、压力表、机油标尺等进行监视。D 错误：水表不符。", "4360": "ABCD 正确：柴油发电机运行启动困难的原因可能是喷油雾化不良、蓄电池电力不足、油路中有空气或水分、燃油管堵塞。", "4361": "ABC 正确：柴油发电机和汽油发电机相比特点有单机功率等级多可选择的功率范围大、压缩比大热效率较高燃油经济性好、无点火系统。D 错误：使用地点灵活不符。", "4362": "BCD 正确：柴油发电机工作时排气管出现冒白烟、冒黑烟、冒蓝烟现象可能是异常。A 正确：不冒烟（正常运转排烟少）——本题选异常现象BCD。", "4363": "ACD 正确：彩色图像信号是由红、绿、蓝基色组成。B 错误：黄不符。", "4364": "ABC 正确：彩色全电视信号包括同步信号、亮度信号、色度信号。D 错误：广播信号不符。", "4365": "ABCD 正确：不适宜扎营的地方有有风的山顶上、谷底和深不可测的山洞、山腰的平地上、通向水源的山嘴处。", "4366": "ABCD 正确：不慎中毒时急救办法包括催吐(抠喉咙)、导泻、洗胃、解毒（生牛奶、生鸡蛋清、大量）等。", "4367": "BC 正确：不能用于测量纹波电压的仪器是数字电流表和数字万用表。A/D 正确：示波器/电能质量分析仪可测纹波电压。", "4368": "ABCD 正确：不间断电源UPS的分类有在线式、后备式、在线互动式、△变换式。", "4369": "ABCD 正确：波长路由规划需考虑的因素有跳数、负载均衡、传送距离、客户侧业务的备用路径应与主（用路径分离）。", "4370": "ABCD 正确：波束用方位角、倾角、水平波束宽度、垂直波束宽度信息来刻画。", "4371": "ACD 正确：波分系统中影响系统传输距离的因素有光功率、信噪比、色散容限。B 错误：监控信道不符。", "4372": "ABC 正确：波分设备组网中为减少传输距离受限的影响可以选择合适的光源、选择合适的光纤、优化网络结构。D 错误：增加中继节点不符。", "4373": "ABCD 正确：波分复用系统传输受限因素包括衰减、光源的色散特性、非线性效应、信噪比的大小。", "4374": "AB 正确：表征天线增益的参数有dBd和dBi。C/D 错误：dBc/dBm不符。", "4375": "ABC 正确：标准地球站分类是按工作频段、天线直径、G/T值类别来进行划分。D 错误：EIRP不符。", "4376": "ACD 正确：便携站系统能实现双向视频传输、实现数据传输、单兵图传进行深入的实时采集功能。B 错误：单向语音传输不符（双向语音）。", "4377": "ACD 正确：边缘计算中的计算卸载主要受资源存储、延时、计算性能因素影响。B 错误：续航能力不符。", "4378": "BC 正确：边缘计算将计算能力下沉到网络边缘靠近用户，以减小网络压力、服务时延，提高用户体验。A/D 错误：服务成本/网络带宽不符。", "4379": "CD 正确：北斗一号卫星定位系统BD在ITU登记的无线电频段为发射L波段和接收S波段。A/B 错误：Ku/Ka不符。", "4380": "ACD 正确：北斗一号空间卫星登记位置为两颗地球静止卫星东经80°和140°，一颗在轨备份卫星东经110.5°。B 错误：122不符。", "4381": "ABCD 正确：北斗系统服务向亚太地区提供区域短报文通信、星基增强、精密单点定位、地基增强等四种区域服务。", "4382": "ABD 正确：北斗系统服务向全球用户提供定位导航授时、国际搜救、全球短报文通信等三种全球服务。C 错误：区域短报文通信不符（属区域服务）。", "4383": "ACD 正确：保守国家秘密的工作实行积极防范、突出重点、依法管理的方针。B 错误：积极防止不符。", "4384": "AB 正确：保护生命安全和职业健康是安全生产最根本最深刻的内涵，是安全生产本质的核心。C/D 错误：设备安全/环境安全不符。", "4385": "ACD 正确：按照事故应急预案编制的整体协调性和层次不同，可将其划分为专项预案、现场处置预案、综合预案几个层次。B 错误：部门预案不符。", "4386": "ACD 正确：按照人体触及带电体的形式和电流流过人体的途径，触电可以分为两相触电、跨步电压触电、单相触电。B 错误：三相触电不符。", "4387": "AB 正确：按照光纤传输的模式数量可将光纤分为多模光纤和单模光纤。C/D 错误：多纵模/单纵模不符。", "4388": "CD 正确：按照电波传播机理划分，传播现象分为自由空间传播、折射、绕射、反射。A/B 错误：直射/对射不符。", "4389": "AC 正确：按业务划分的通信网有ISDN和电话网。B/D 错误：专用网/长途网不符。", "4390": "ABC 正确：按蓄电池组运行制式划分，直流供电方式包括充电工作方式、半浮充工作方式、全浮充工作方式。D 错误：直通工作方式不符。", "4391": "AB 正确：按卫星的服务区域划分有国际卫星通信网和区域卫星通信网及国内卫星通信网等。C/D 错误：模拟通信网/数字通信网不符。", "4392": "ABC 正确：按网络功能层次分电信网由业务网、承载网、支撑网组成。D 错误：交换网不符。", "4393": "AB 正确：按交换网络接续方式来分程控交换机可分为空分和时分等方式。C/D 错误：码分/频分不符。", "4394": "BC 正确：按电解液数量可将铅酸蓄电池分为贫液式蓄电池和富液式蓄电池。A/D 错误：酸性蓄电池/碱性蓄电池不符。", "4395": "ABCD 正确：按底层技术划分微波有IP/SDH/PDH微波、无线网桥、CPRI微波、视频微波几种。", "4396": "AC 正确：按传输总模数分光纤有单模和多模两种。B/D 错误：充油/充气不符。", "4397": "BCD 正确：安全生产监督管理的基本原则坚持有法必依、执法必严、违法必究的原则。A 错误：以法管理不符。", "4398": "ABD 正确：安全生产管理的目标是减少和控制危害、减少和控制事故、尽量避免财产损失。C 错误：减少和控制后果不符。", "4399": "ACD 正确：安全带错误的使用方法是低挂高用、水平挂用、灵活使用（本题选错误方法）。B 正确：高挂低用是正确使用方法。", "4400": "ACD 正确：VSAT小站又称远端小站，其设备主要包括天馈线、室内单元、室外单元。B 错误：馈线不符（馈线属天馈系统部分）。", "4401": "ABCD 正确：VSAT网络通常使用的技术体制有DAMA/SCPC、TDM/SCPC、TDMA、CDMA。", "4402": "ACD 正确：VSAT网络的主要结构有星形结构、网状结构、混合结构几种拓扑结构。B 错误：环路网络不符。", "4403": "ABC 正确：VSAT特点是覆盖范围大、可对所有地点提供相同的业务、点对多点通信能力。D 错误：传播时延小不符（卫星时延大）。", "4404": "AB 正确：VSAT室内单元基本部分是MODEM和BBP。C/D 错误：UPS/LNB不符。", "4405": "ABC 正确：UPS电源对应的工作状态有逆变工作、电池工作、旁路工作。D 错误：浮充工作不符。", "4406": "ABCD 正确：UPS电源的保护功能包括输出短路保护、输出过载保护、过温保护、电池欠压保护。", "4407": "AB 正确：UPS电源按工作原理不同主要分为后备式UPS和在线式UPS。C/D 错误：后备互动式/在线互动式不符（那是细分类型）。", "4408": "CD 正确：UPS的控制电路应具有分别执行同步切换和非同步切换的能力，以保证UPS在不同供电质量的交流旁路间切换。A/B 错误：延时切换/断开切换不符。", "4409": "ABC 正确：UPS的工作方式有单机、主备、负荷均分等形式。D 错误：混合不符。", "4410": "BD 正确：UPS常用的电池类型有胶体电池和阀控铅酸蓄电池。A/C 错误：碱性电池/镍氢电池不符。", "4411": "AD 正确：UPS按工作的原理可分为动态式和静态式。B/C 错误：单相式/三相式不符。", "4412": "ABC 正确：QPSK系统的误码是由热噪声、码间干扰以及载波恢复、位定时电路产生的相位抖动等因素引起。D 错误：冷噪声不符。", "4413": "BCD 正确：QoS具有的功能是优先级设置、分类、标注。A 错误：过滤不符。", "4414": "BCD 正确：PON的分光器型号包括1:8、1:16、2:16（对应01:08:00、01:16:00、02:16:00）。A 错误：1:2（0.21944444444为错误格式）不符。", "4415": "BCD 正确：NB-IoT频谱部署方法包括Standalone（独立部署）、Guardband（保护带）、In-band（带内）。A 错误：EGSM不符。", "4416": "AB 正确：NB-IOT是通过子载波的带宽降低增加功率谱密度、时间上的重复发送获得时间分集增益技术来增加覆盖。C/D 错误：提高终端发射功率/加大基站发射功率不符。", "4417": "ABC 正确：MSTP的技术包括虚级联、LCAS、GFP。D 错误：低阶交叉连接不符。", "4418": "BD 正确：Modem在状态灯亮的时候不能通过前面板参数进行RemotE和Test操作。A/C 错误：EventStoreD/TxTraffiC不符。", "4419": "ABD 正确：Modem分系统主要完成业务数据、网管数据的调制、解调、卫星接口适配等功能。C 错误：变频不符。", "4420": "AC 正确：mMTC典型应用包括智慧城市和智能家居。B/D 错误：超高清视频/工业控制不符。", "4421": "ABC 正确：MEC主要场景是应用本地化、内容区域化、计算边缘化。D 错误：架构云化不符。", "4422": "ABC 正确：MEC的优势包括改善链路容量、提高能量效率实现绿色通信、低时延。D 错误：提高理论下行带宽不符。", "4423": "ABC 正确：MassiveMIMO上行关键技术有上行多天线接收、上行用户多流传输、上行PUSCH空分复用。D 错误：下行SRS权与PMI权自适应不符（那是下行）。", "4424": "CD 正确：LTE主要采用的多址方式包括OFDMA和SFDMA(单载波)。A/B 错误：TDMA/CDMA不符。", "4425": "ABC 正确：LTE中主要考虑的降低干扰影响办法包括干扰随机化、干扰协调、干扰消除。D 错误：干扰过滤不符。", "4426": "ABCD 正确：LTE中遇见的常见干扰有GSM900M互调干扰、GSM180M阻塞干扰、杂散干扰、PHS干扰。", "4427": "ACD 正确：LTE下行物理信道主要有PDSCH、PDCCH、PBCH几种方式。B 错误：PRACH不符（那是上行信道）。", "4428": "ABC 正确：LTE系统核心网包括MME、SGW、PGW网元。D 错误：Enb不符（那是无线接入网）。", "4429": "BD 正确：KA信关站采用13米天线，终端固定站天线最小尺寸为45公分，系统网管支持百万量级终端。A/C 错误：11米/35公分不符。", "4430": "ABCD 正确：KA宽带卫星网络系统由天线射频系统、基带系统、路由系统、信息安全系统等组成。", "4431": "ABD 正确：IEEE802.3-2012定义了多模光纤MMF、单模光纤SMF、铜缆传输介质。C 错误：网线不符。", "4432": "BCD 正确：GPS天线不要安装到微波天线、高压线、电视发射塔的下方。A 错误：避雷针不符。", "4433": "ABCD 正确：DVBS2模式下FEC可取的值有45295、45294、45327、45513。", "4434": "ACD 正确：C网应急车卫星中继充分发挥了卫星通信快速响应、不受地理位置限制、组网灵活特点。B 错误：通信成本较低不符。", "4435": "AD 正确：C波段地球站天线口径15m，发射(6GHz)时3dB波束宽度约0.23度，接收(4GHz)时约0.35度。B/C 错误：0.24/0.34不符。", "4436": "AC 正确：CDMA应急车卫星通信系统中射频接收的信号经功分器后主要提供给Modem和信标机。B/D 错误：天控器/交换机不符。", "4437": "ABCD 正确：CDM-625支持的数据接口有EI422/530、V.35、G.703T1/T2、G.703E1/E2。", "4438": "ABCD 正确：CDM-625支持的调制方式有BPSK、8PSK、OQPSK、16QAM。", "4439": "BC 正确：CDM-625在一个机箱中可以支持70/140MHz和L波段频段。A/D 错误：C波段/S波段不符。", "4440": "ABD 正确：CDM-625可以支持70MHz、140MHz、L-Band工作频段。C 错误：14GHz不符。", "4441": "BD 正确：CDM-625 Modem在使用L波段时能为LNB提供直流供电和10MHz参考。A/C 错误：交流供电/5MHz参考不符。", "4442": "ABC 正确：CDM-625 Modem在使用L波段时能为BUC提供10MHz参考、BUC直流供电、FSK监控。D 错误：5MHz参考不符。", "4443": "BC 正确：CDM570内置IP模块版本有两种数据封装方式，分别是HDLC和SLE。A/D 错误：ATM/FrameRelay不符。", "4444": "BC 正确：A接口是BSS和MSC两个网元之间的接口。A/D 错误：MS/HLR不符。", "4445": "BC 正确：8QAM调制解调技术与8PSK相比能够在更低的Eb/No条件下保持捕获、载波跟踪特性。A/D 错误：功率稳定/误码特性不符。", "4446": "ABC 正确：《“十四五”国家应急体系规划》指出到2035年建立依法应急、科学应急、智慧应急的（现代化应急管理体系）。D 错误：创新应急不符。", "4447": "ACD 正确：100G波分系统传输距离受限制的主要因素包括衰耗值/衰减值、OSNR、非线性效应。B 错误：发送功率不符。", "4448": "ABCD 正确：《中华人民共和国突发事件应对法》规定突发事件包括自然灾害、事故灾难、公共卫生事件、社会安全事件。", "4449": "ABCD 正确：《中华人民共和国突发事件应对法》立法目的是预防和减少突发事件的发生、规范突发事件应对活动、保护人民生命财产安全维护（社会秩序）、控制减轻和消除突发事件引起的（危害）。", "4450": "ACE 正确：《生产安全事故报告和调查处理条例》规定环境污染、核设施、国防科研生产事故不适用于本条例。B/D 错误：道路交通/铁路交通适用。", "4451": "ABCE 正确：《国家突发公共事件总体应急预案》将突发公共事故分为自然灾害、事故灾难、公共卫生事件、社会安全事件四类。D 错误：环境污染事件不符。", "4452": "BCD 正确：《安全生产法》中的安全生产监督体制包括负有安全生产监督管理职责的部门、基层群众性自治组织、新闻媒体监督管理。A 错误：政府公安机关不符。", "4453": "ABC 正确：《“十四五”国家应急体系规划》指出全面推进行政执法公示、执法全过程记录、重大执法决定法制审核三项制度。", "4454": "ABCDEF 正确：《“十四五”国家应急体系规划》指出我国应急体系建设应坚持党的领导、以人为本、预防为主、依法治理、精准治理、社会共治的基本原则。", "4455": "ABCD 正确：“四不伤害”具体含义是我不伤害他人、我不被他人伤害、我保护他人不被伤害、我不伤害自己。", "4456": "ABCD 正确：高处、室内、室外、阳台作业严禁上下投掷工具、材料和杂物等。", "4457": "BCD 正确：中国人民解放军、民兵组织、中国人民武装警察部队依照《中华人民共和国突发事件应对法》和其他有关法律行政法规和军事法规的规定以及（国务院中央军委的命令）参加突发事件应对。A 错误：群众自治组织不符。", "4458": "BD 正确：中星16号和亚太6D卫星属于HTS高通量通信卫星。A/C 错误：亚洲九号/中星6A不符。", "4459": "CD 正确：E1和STM-N类型的接口不能接入以太网信号。A/B 正确：FE/GE可以接入。", "4460": "ABCD 正确：可能给网络和信息系统带来风险导致安全事件的有计算机病毒、网络入侵、软硬件故障、人员误操作。", "4461": "ACD 正确：可以实现对卫星链路在转发器上占用带宽进行压缩的技术有高阶调制、载波叠加、时隙插入取出。B 错误：前向纠错不符。", "4462": "AD 正确：频率复用和点波束技术的综合应用使KA宽带卫星通信系统容量得到数十倍甚至百倍以上提高。B/C 错误：空间分集/时间分集不符。", "4463": "AC 正确：描述下行接收系统主要性能指标参数是系统增益和噪声系数。B/D 错误：饱和输出功率/三阶交调截止点不符。", "4464": "答“正确”：作为传输媒质或信号载体的通信线路就是传输信道。", "4465": "答“错误”：最大发射功率40W的基站相对于20W基站，前向语音用户容量并不会显著提高（语音容量受码道/资源限制，发射功率提高主要改善覆盖）。", "4466": "答“正确”：走线架、接地汇集线和接地汇流排固定在墙体或柱子上时必须与建筑物内钢筋绝缘。", "4467": "答“正确”：自觉服从公司的统一管理，积极参加单位组织的安全教育及有关活动，牢固树立安全第一意识。", "4468": "答“错误”：自建基站屋顶塔/塔中基站的铁塔四个脚（垂直接地体）和避雷引下线应与塔中基站机房的接地系统（连通并良好接地，本题说法与此相反）。", "4469": "答“正确”：自动断开电源是当发生故障时能在规定的时间内自动地断开电源，防止接触电压的危险。", "4470": "答“错误”：子载波间隔越大，对应的CP长度越小，支持的小区半径也越小（不是越大）。", "4471": "答“正确”：装卸光(电)缆时必须有专人指挥，全体人员应行动一致。", "4472": "答“正确”：专业队伍的装备物资应保持功能完好，处于随时可用的状态。", "4473": "答“错误”：重大危险源和重大隐患不是相似的（危险源是可能导致事故的根源，隐患是可能导致事故的状态，概念不同）。", "4474": "答“正确”：重大危险源分为生产场所重大危险源和贮存区重大危险源两种。", "4475": "答“正确”：中星16号属于HTS高通量通信卫星。", "4476": "答“正确”：中星16号高通量卫星设计有26个用户点波束和3个馈电波束。", "4477": "答“正确”：中继电缆接头连接必须牢固可靠，中继电缆插头必须完好无损；电源线、地线、中继线、射频线等走线应规范。", "4478": "答“正确”：中国首颗高通量卫星是中星16号卫星。", "4479": "答“正确”：中国国内卫星通信网的主要传输制式：电视采用传统调频方式，通信以频分多址和时分多址为主。", "4480": "答“错误”：中国电信企业战略转型的关键是业务与服务转型、网络与平台转型等，不只是业务与技术转型。", "4481": "答“正确”：中国电信企业形象口号是世界触手可及。", "4482": "答“错误”：全面创新、求真务实、以人为本、共创价值是中国电信的核心价值观，不是经营理念。", "4483": "答“正确”：中国电信经营理念是追求企业价值与客户价值共同成长。", "4484": "答“正确”：中国电信核心价值观中“以人为本”是以客户为中心、以员工为根本。", "4485": "答“正确”：中国电信的企业文化纲要包括企业使命、战略目标、核心价值观、服务理念、企业行为准则和员工行为准则等。", "4486": "答“正确”：中国电信5G定制网是以5G云网为基石、以业务场景为核心，为行业客户提供“网边云用”一体化服务。", "4487": "答“正确”：制冷剂过少将导致蒸发压力过低，严重时蒸发器结霜。", "4488": "答“错误”：只有在600欧姆（不是150欧姆）阻抗上的功率电平才等于电压电平。", "4489": "答“错误”：直流工作接地分为正极接地和负极接地，并非只有将直流正极接地才称为直流工作接地。", "4490": "答“正确”：只有单一模式传输的光纤称做单模光纤。", "4491": "答“正确”：只要用3颗等间隔配置的静止卫星就可以实现全球除了两极区的通信。", "4492": "答“错误”：即使基站蓄电池可以坚持至市电来电，也应根据供电保障要求使用油机供电（长时间放电会损害电池，且不确定市电恢复时间）。", "4493": "答“错误”：地阻值测试达标了也不能完全避免基站设备被雷击（还需防雷器件、屏蔽等多重防护）。", "4494": "答“正确”：职业病鉴定实行两级鉴定制，省级职业病鉴定结论为最终鉴定。", "4495": "答“正确”：直埋光缆与埋式电力电缆交越时最小净距为0.5米。", "4496": "答“错误”：直埋光缆埋深全石质应为0.8米（本题“从沟底算起”表述有误，规范埋深自缆顶或沟底起算均有规定，本题判错误）。", "4497": "答“正确”：直埋光缆穿越高差在0.8米以上（含0.8米）的沟坎、梯田时应作护坎。", "4498": "答“正确”：直流配电屏是直流供电系统的枢纽，作用是将整流器、变换器、蓄电池组通过各种自动或人工控制方式合理分配。", "4499": "答“正确”：直流工作接地采用正极接地的原因是防电蚀和通信设备元器件的需求。", "4500": "答“错误”：直流电压不能用变压器来改变（变压器只能改变交流电压）。", "4501": "答“错误”：直流电是指大小和方向不随时间变化的电流（大小方向随时间变化的是交流电）。", "4502": "答“错误”：直流地、交流地和保护地虽然最后都接在同一地线总汇流排上，但各种地之间不可以任意连接（需按规定分别接地）。", "4503": "答“正确”：直流变换器的作用是为了将高压直流变换成所需要的低压直流。", "4504": "答“错误”：执行野外通信救援保障任务的人员，都必须具备在恶劣环境下完成任务所需要的体能及野外生存技能。", "4505": "答“错误”：执行清洁空调作业时，为保证安全必须关闭空调的电源（不能为保证机房温度不关闭电源）。", "4506": "答“正确”：正极接地也可以使外线电缆的芯线在绝缘不良时免受腐蚀。", "4507": "答“错误”：正常情况下GPS天线电压约为5V（不是4V左右）。", "4508": "答“正确”：正常情况下天馈系统驻波比应该在1＜VSWR＜1.5范围内。", "4509": "答“正确”：正常的野外活动中，人体缺水的真正指标是嘴感觉很淡。", "4510": "答“错误”：整流电路的输出滤波与逆变电路的输出滤波作用不一样（整流滤波抑制纹波，逆变滤波平滑正弦波）。", "4511": "答“正确”：整流、逆变、直流变换设备统称为换流设备。", "4512": "答“正确”：整个VSAT系统拥有的远端小站数目越多，网络的利用率就越高。", "4513": "答“正确”：帧中继采用面向连接的交换技术。", "4514": "答“错误”：位同步（不是帧同步）保持收发信机工作于同一比特率，帧同步等二级同步保证对收信端输出的数字序列进行正确的（分帧）。", "4515": "答“错误”：长期困在黑暗中的人员救出重见光明后，应避免强光直射双目（应先遮眼适应），不能用灯光照射检查双目以免损伤视力。", "4516": "答“正确”：战略目标是把中国电信建设成为世界级现代电信企业集团。", "4517": "答“错误”：增压柴油机的压缩比（通常较小或与自然吸气相当，本题判错误，增压机型压缩比较低以控制爆压）。", "4518": "答“正确”：噪声按其产生来源分类为自然噪声、人为噪声、内部噪声等。", "4519": "答“正确”：凿掏孔壁、石质地面或水泥地面时必须佩戴防护眼镜。", "4520": "答“正确”：载波叠加技术可以使双向卫星链路在转发器带宽的同一频段内同时发射业务载波，从而占用带宽更小。", "4521": "答“错误”：自然灾害综合风险监测预警系统应以乡镇（不是区、县）为监测预警网格单元，探索提供气象灾害等短临预警服务。", "4522": "答“正确”：重大的应急通信任务中一般对重要通讯设备采用市电、油机发电机车和UPS电源的多重电源保障。", "4523": "答“错误”：针对干扰源位置定位时应用定向天线（不是全向天线）进行查找。", "4524": "答“正确”：和煦的阳光照在雪崖上可能引发雪崩，所以要赶在午时前到达背阴地区（避开危险时段）。", "4525": "答“正确”：在有坠落危险的高处作业处应系好安全带，安全带应高挂低用挂在牢靠处。", "4526": "答“正确”：用OTDR进行线路衰耗测试时应确定测试纤芯的对端未连接设备，以免对设备光口造成损坏。", "4527": "答“错误”：应急救援过程中事故现场的抢修及毒害物质扩散区域内的清理工作由（企业专职救援队伍/消防救援部门）负责，不是环保部门。", "4528": "答“错误”：在移动通信系统中用户位置随移动随时变化（不是不随时间变化）。", "4529": "答“正确”：移动通信网络中天线下倾的主要作用是减少干扰和增强信号强度（控制覆盖）。", "4530": "答“错误”：在一个地方扎营一般不超过3天（本题判错误，常规建议一般不超过2-3天，教材口径为不超过2天或3天，按题库答案判错误）。", "4531": "答“错误”：野外活动遇雷雨不能到附近较高的大树下避雨（大树易遭雷击）。", "4532": "答“错误”：野外穿行时如山上有碎石，队伍中人的间距要适当增大（不是减小）距离，防止滚石伤人。", "4533": "答“正确”：野外保障作业时避免行走在湿滑石面、泥路或布满沙粒的劣地上，以免滑倒造成人身伤害。", "4534": "答“错误”：谐振回路中谐振频率与回路中电感和电容的容量有关（f=1/(2π√LC)）。", "4535": "答“正确”：在线安装蓄电池组输出电缆时，应测量蓄电池组总电压和开关电源输出电压的差值，在电压（差接近时再进行连接）。", "4536": "答“正确”：在无线电通信中RFI通常指的是射频干扰。", "4537": "答“正确”：无线传输中载噪比越低，误码率越高，信道的传输质量也就越差。", "4538": "答“错误”：在未明确（UPS型号参数及并机条件）之前，UPS不能直接并联使用。", "4539": "答“正确”：卫星通信中应用码分多址的联接方式具有很强的抗干扰能力。", "4540": "答“错误”：卫星通信中电磁波不需要通过空气作为媒介进行传输（真空中即可传播）。", "4541": "答“错误”：卫星通信系统中各地球站的发射和接收设备可以共用（同一副）天线。", "4542": "答“错误”：卫星通信网各种多址联接方式中“信道”的含义是不相同的（FDMA按频分、TDMA按时隙、CDMA按码型）。", "4543": "答“正确”：危险化学品安全生产风险监测预警系统中新增接入储存硝酸铵、氯酸钾、氯酸钠、硝化棉等（企业数据）。", "4544": "答“正确”：在突发话务剧增场景下仅需要交换拓扑图即可。", "4545": "答“正确”：通信线路附近有其他线缆时，在没有辩明清楚该线缆使用性质前，一律按电力线处理。", "4546": "答“正确”：通信机房作业时应遵守通信机房管理制度，严禁在机房内饮水、吸烟。", "4547": "答“错误”：室外遇雷电若找不到避雷场所，可以蹲下两脚并拢双手抱膝尽量降低身体重心（本题判错误，因该做法虽常见但题库答案为错误，正确做法是尽快进入室内或低洼处，题干描述并非最稳妥做法）。", "4548": "答“正确”：使用组合标识时国家应急通信标识应放置在左侧且主图形不得小于单位（标识）。", "4549": "答“错误”：氧化锌压敏电阻的标称导通电压是（通过规定测试电流测得，不是施加恒定10mA直流电流时的启动电压）。", "4550": "答“错误”：施工过程中通信电缆不能利用电力杆任意架挂（需经电力部门同意并满足安全距离）。", "4551": "答“正确”：在生产过程中事故是指造成人员伤害、死亡、职业病、财产损失或其它损失的意外事故。", "4552": "答“错误”：日常巡检中清洁开关电源不可以用湿布进行清洁（应用干布或防静电清洁工具）。", "4553": "答“正确”：人(手)孔内工作时必须事先在井口处设置井围、红旗，夜间设红灯，上面设人看守。", "4554": "答“错误”：在墙壁上安装分线盒一般距地面的高度不得小于2.5m（不是1.5m）。", "4555": "答“正确”：其它条件不变的情况下，馈线长度越长，应用塔放带来的上行增益越大。", "4556": "答“正确”：模拟微波通信系统中切换依据是信号(导频)丧失或噪音升高，数字微波通信系统中切换依据是误码率恶化。", "4557": "答“正确”：每年春分和秋分前后数日太阳、卫星和地球在同一直线上，因太阳干扰太强每天会造成几分钟的日凌中断。", "4558": "答“正确”：楼顶站上保护地、天线安架体和馈线接地都应接到大厦的避雷带上。", "4559": "答“正确”：零下气温中汽油洒在皮肤上比水更有危害性（汽油挥发吸热快易冻伤且有毒）。", "4560": "答“错误”：林区、草原或荒山等地区作业时严禁烟火，需动用明火时必须（办理相关手续并采取严密防范措施），不是无须（批准）。", "4561": "答“错误”：链路预算中需要考虑软切换增益（CDMA系统软切换有增益）。", "4562": "答“正确”：利用PON光功率计测试时需要将光功率计串接在ODN光链路中，才能读取下行1490nm波长光功率。", "4563": "答“正确”：静止卫星通信系统中地球站发射信号经卫星转发到另一地球站时，单程传播时延约为270ms。", "4564": "答“正确”：进行站点上传下载业务测试时尽量选择多径的位置，容易实现UE峰值流量的测试。", "4565": "答“正确”：应急通信工作前对工作地点和环境的勘察有很重要的实际意义，是必须进行的工作。", "4566": "答“正确”：接地电流回路上一人同时触及的两点间所呈现的电位差称为接触电压。", "4567": "答“正确”：交流电路中实际测量和使用的都是有效值。", "4568": "答“错误”：极地地区指南针不能引导航向（地磁极与地理极差异大且磁偏角极端，指南针失效）。", "4569": "答“错误”：基带传输系统中一般不采用载噪比技术指标（基带用信噪比，载噪比用于频带传输）。", "4570": "答“错误”：机内、机顶和走线架上不得放置物品（不是放置牢固即可，禁止摆放杂物）。", "4571": "答“错误”：户外积水中行走时要注意观察，特别远离落水电线，并贴近建筑物行走，尽可能手持一根竹竿（本题判错误，手持竹竿探路可行但题干描述不够准确/应为远离电线杆，按题库答案判错误）。", "4572": "答“正确”：后备式UPS中只有当市电出现故障时逆变器才启动进行工作。", "4573": "答“正确”：寒冷季节预防冻疮要将身上衣服紧紧裹住，防止身体热量流失。", "4574": "答“错误”：国际单位制(SI)中热量单位是焦耳（大卡是常用非法定计量单位）。", "4575": "答“正确”：光纤槽道上布放尾纤时严禁踩踏原有尾纤，机房原有ODF架上布放尾纤时严禁将在用（尾纤拔出或影响在用业务）。", "4576": "答“正确”：公路、高速公路、铁路、桥梁、通航河道、市区等特殊地段施工时应使用有关部门规定的（警示标志并办理手续）。", "4577": "答“错误”：各种形式的短路和带负载断开电路等情况下，人体都可能由于发生电弧而被烧伤。", "4578": "答“错误”：高速公路上施工作业时安全警示标志应根据施工作业点“滚动前移”，收工后安全警示标志应（全部撤除），不是（留在原地）。", "4579": "答“错误”：杆上作业必须使用安全带，安全带围杆绳放置位置应在距杆梢30厘米以下，杆上作业时（应把安全带固定在牢固位置），本题描述（距杆梢30厘米以下）有误。", "4580": "答“正确”：发生个别光纤断裂或衰耗显著增大且可由备用光纤调通时，应积极采用不中断电路的修复方式。", "4581": "答“正确”：发电过程中发现排气管冒黑烟，可能的问题是活塞环磨损。", "4582": "答“正确”：对网元数据进行预配置操作时不会对业务造成影响。", "4583": "答“正确”：短波自适应通信系统中最常用的测量参数是信噪比、多径时延、误码率。", "4584": "答“正确”：短波通信中用户数据率越低，用户信道探测的数据越长，通信也将越可靠。", "4585": "答“错误”：短波电台通信中各电台必须使用法定频率段，并按规定使用（核准）频率，不得随意调整收发频率（本题判错误，因电台实际可按频率表操作，题意为禁止私设频率，但题库答案判错误，按答案为准）。", "4586": "答“错误”：电源线及地线两头制做铜鼻子时应焊接或压接牢固，不应将裸线及线鼻柄露出（应包覆绝缘）。", "4587": "答“正确”：电路中电位随参考点不同而改变。", "4588": "答“错误”：电磁场理论中人们利用无线电波的电场方向（不是传播方向）来定义电波的极化方向。", "4589": "答“错误”：低压带电设备上辅助安全工具（只作辅助），本题判错误——辅助安全工具不可作为基本安全用具使用（正确表述应为“辅助安全工具必须与基本安全用具配合使用，不能单独使用”，题干“不可作为基本安全用具使用”表述正确但题库判错误，按答案为准）。", "4590": "答“正确”：登高作业过程中安全带所系位置必须高于人体自身，以防滑落时造成冲击伤害。", "4591": "答“错误”：承载相同速率时给边缘用户配置更多的RB，覆盖（不变或更好，本题判错误——给边缘用户更多RB可提高边缘速率，覆盖不会变差）。", "4592": "答“错误”：尝试新植物时吞咽一小口后应耐心等待（5-6小时或更长时间，不是1个小时）。", "4593": "答“错误”：测试过程中车速的快慢会影响测试结果（车速影响采样与覆盖评估）。", "4594": "答“正确”：OTDR盲区越小越好；对OTDR附件的光纤和相邻事件点的测量要（准确分辨）。", "4595": "答“错误”：不超过卫星公司标定功率的基础上通常接收信噪比建议保持在（15dB以上，不是10dB）。", "4596": "答“错误”：波导中不是任何波长的波都能传输，波导结构尺寸一定时只有波长（小于）一定波长的波才能传输。", "4597": "答“错误”：变压器功率一定时工作频率越高铁芯截面积可以做得越小，开关电源体积（越小），本题判错误——题干描述正确但题库答案判错误，按答案为准。", "4598": "答“正确”：避免泄露或干扰的室内场景定向天线会得到更多应用。", "4599": "答“正确”：北极地区搭建避身所可利用天然凹坑或洞穴作为简易避身所。", "4600": "答“正确”：半山坡上睡觉时头枕着上坡，凹凸不平的石地上趴着睡会更舒服一些。", "4601": "答“错误”：VSAT系统中通常小站与主站之间通信使用单跳方式（不是双跳）。", "4602": "答“正确”：VSAT系统中通常小站和主站之间通信使用单跳方式。", "4603": "答“错误”：VSAT数据通信网中采取前向纠错（FEC）技术，不是反馈重发纠错技术。", "4604": "答“错误”：UPS逆变器故障向旁路切换时，所用的切换时间（并不是越短越好，需保证切换可靠，本题判错误）。", "4605": "答“正确”：H.323中G.729是音频编解码协议。", "4606": "答“错误”：运转供电中的小型汽油机若燃油不足应停机后添加（不能运转中随时添加）。", "4607": "答“错误”：圆极化包含相互正交的左旋和右旋（不是水平和竖直）两种极化方式。", "4608": "答“错误”：遇特大暴雨时千万不要冒险行驶，应选择较高的（不是较低的）安全地带停车。", "4609": "答“正确”：预警分析系统的实现包括监测、识别、诊断、评价等环节。", "4610": "答“正确”：预防静电的措施有接地、不使用或安装产生静电的设备、作业人员穿防静电鞋。", "4611": "答“错误”：雨天穿用的胶鞋在进行电工作业时不能暂作绝缘鞋使用（胶鞋无绝缘耐压保证）。", "4612": "答“错误”：雨衰影响与微波信号经过的雨区有效长度有关，降雨区域大小一定时地球站仰角越高雨衰（越小，不是越大）。", "4613": "答“正确”：有效的应急演练管理一方面可以检查预案的科学性和有效性，同时对应急预案存在的问题提出（改进意见）。", "4614": "答“错误”：有国家领导人或他国元首参与的活动定义为（特级或更高等级）重大活动，不是一类重大活动。", "4615": "答“错误”：有毒真菌剥皮后仍有毒，有毒的煮沸时也不一定变色（本题说法错误）。", "4616": "答“错误”：地球站发射给通信卫星的信号称为上行信号（不是下行）。", "4617": "答“错误”：油机实际工作中水温不是越低越好（应保持正常水温范围）。", "4618": "答“错误”：油机在机房、基站发电使用过程中必须接地（接不接地不一样，不接地有触电风险）。", "4619": "答“正确”：油机在户外运行时严禁阳光直接暴晒。", "4620": "答“正确”：油机使用完毕应先关闭负荷，再关闭油机。", "4621": "答“错误”：油机启动后机油压力、机油温度、水温符合规定要求（且电压频率转速稳定）方可供电，本题表述不完整判错误。", "4622": "答“正确”：油机启动后电压、频率和转速达到规定要求并稳定运行后，方可供电。", "4623": "答“错误”：油机不可以带负载关机（应先卸负载再关机）。", "4624": "答“正确”：油机发电机组应保持清洁，无漏油、漏水、漏气、漏电（简称四漏）现象。", "4625": "答“正确”：油机发电机进行技术保养可以及时消除机器故障，保证机组经常处于良好状态并可延长使用寿命。", "4626": "答“正确”：油机的压缩比是指气缸工作容积与燃烧室容积之比。", "4627": "答“错误”：卫星离地面很高但卫星通信一次中继即可实现长距离通信（不需多次中继转接）。", "4628": "答“正确”：水平极化波的衰减比垂直极化波大得多，所以地面波主要为垂直极化波。", "4629": "答“错误”：流过零线的电流不一定为零（三相不平衡时零线有电流），零线的线径（按规范选择，本题判错误）。", "4630": "答“错误”：由信号源向终端负载方向传播的行波称为入射波（反射波是从负载返回的行波）。", "4631": "答“错误”：通信卫星转发给地球站的信号称为下行信号（不是上行）。", "4632": "答“错误”：由送电、变电、配电和用电组成的整体称为电力系统（缺少发电环节，正确应为由发电、送电、变电、配电和用电组成）。", "4633": "答“错误”：用尾纤对设备光口进行环回时必须考虑光功率指标（防止光功率过高损坏光口）。", "4634": "答“错误”：万用表测量电阻时改变分流电阻阻值改变的是电流量程（本题说法错误）。", "4635": "答“正确”：用同轴电缆传输多路复用通信的主要原因是同轴电缆的传输频带宽。", "4636": "答“错误”：用户双方通话时话务员若进行监听，用户会听到告警音（监听有提示音）。", "4637": "答“错误”：用户记发器中的脉冲接收电路的作用是（接收用户拨号脉冲），不是控制示闲信号保持呼出接续。", "4638": "答“正确”：用电负荷是指用户在某一时刻对电力系统所需求的功率。", "4639": "答“错误”：硬切换不一定是异频切换（同频也可以硬切换）。", "4640": "答“错误”：营地的厕所要设在营地边缘下风向位置且撤营时掩埋，本题说法（尽量远离）判错误。", "4641": "答“正确”：应急预案要随着内部条件和外部环境的变化进行定期的或以事件触发的修改更新。", "4642": "答“错误”：应急预案体系建设的基本原则是统一领导、分级指挥（不是统一指挥分级领导）。", "4643": "答“正确”：应急预案的更新工作要统一组织，相关领导、相关专业人员参加，必要时可聘请有关专家参加。", "4644": "答“正确”：应急物资的归还应遵循“谁使用、谁补充”的原则。", "4645": "答“正确”：应急卫星通信车在俯仰方向上的基本要求是对星俯仰与遮挡物之间夹角≥20°。", "4646": "答“正确”：应急卫星通信车的停车地点在对星俯仰方向和方位方向应该没有遮挡物（如建筑物、高压线、铁塔等）。", "4647": "答“错误”：应急通信中对车载式柴油发电机组的车厢要求较高（需隔音、通风、防雨等）。",
 "4648": "答“正确”：应急通信所使用的柴油发电机组多采用后备型的发电机组。", "4649": "答“错误”：应急通信设备至少应每年（不是每两年）检修和保养一次。", "4650": "答“错误”：应急通信设备的完好要以日常维修保养为主、大修更新为辅（不是大修更新为主）。", "4651": "答“错误”：应急通信后备型发电机组满负荷工作时间（可持续供电较长时间，本题说法判错误）。", "4652": "答“正确”：应急通信常用的三相交流柴油发电机独立工作时，需要将油机的零线接地。", "4653": "答“正确”：应急通信柴油发电机组以车载为主。", "4654": "答“错误”：应急通信可以单独组网为党政军领导机关实施指挥提供通信保障。", "4655": "答“正确”：应急抢修临时发电设备应放置在干燥、避雨措施较为严密的场所，不得站在潮湿地方或雨水里操作。", "4656": "答“错误”：应急救援预案分为综合预案、专项预案和现场处置方案（不是分公司预案和区域预案）。", "4657": "答“错误”：应急救援预案应传达贯彻到全体人员（不只是班组长以上管理人员）。", "4658": "答“错误”：应急服务包括商业社会活动、内部的业务支撑等（本题说法错误）。", "4659": "答“正确”：应急处置工作要求“横向到边，纵向到底、重在基层”、“条块结合，属地为主”。", "4660": "答“正确”：应急保障主要体现社会性的责任。", "4661": "答“错误”：引起电气设备过热的主要原因是过载、短路、接触不良等（不是超电压工作）。", "4662": "答“错误”：音视频矩阵可以视频切换、音频切换和同时切换（本题说法正确，但题库答案判错误，按答案为准——矩阵通常指视频矩阵或音视频矩阵，此处以题库为准）。", "4663": "答“错误”：阴影衰落是慢衰落，多径引起的衰落是快衰落（本题说反了）。", "4664": "答“正确”：易发生故障或危险性较大的地方配备识别标志，必要时采用声、光或声光组合的报警装置。", "4665": "答“错误”：以一个恒星日为圆形轨道周期的卫星称为同步卫星（静止卫星轨道周期为恒星日且轨道在赤道平面）。", "4666": "答“错误”：电离层对电波吸收作用的大小主要决定于电子密度和工作频率，从作用来说白天比夜间（吸收强，本题判错误——电离层白天电子密度大吸收强，说法正确但题库判错误，按答案为准）。", "4667": "答“正确”：移频键控是一种数字调制方式，载波频率变化，振幅保持恒定。", "4668": "答“错误”：移动小油机应按说明书要求加注对应标号汽油（不是只能加93#汽油）。", "4669": "答“正确”：移动通信系统一般由发信机、收信机、铁塔构成。", "4670": "答“错误”：移动通信铁塔的避雷针引下线（应单独敷设专用引下线），不能利用铁塔自身金属构件作为接地连接体。", "4671": "答“正确”：移动通信接地系统一般均采用联合接地方式。", "4672": "答“错误”：移动通信基站应按均压、等电位的原理将工作地、保护地和防雷地组成一个联合接地网（本题说法正确但题库判错误，按答案为准）。", "4673": "答“错误”：移动通信基站铁塔应有完善的防直击雷装置，二次感应雷的防雷装置也不可缺少。", "4674": "答“正确”：移动通信基站交流电力变压器的机壳、低压侧交流零线以及与变压器相连的电缆金属铠装层（均应接地）。", "4675": "答“正确”：移动通信基站的交流供电系统采用三相五线制。", "4676": "答“正确”：移动通信基站的共用地网应由机房地网、铁塔地网和变压器地网组成，当电力变压器设置（在基站院内时三网合一）。", "4677": "答“错误”：移动基站的交流供电系统应采用三相五线制（不是三相四线制）供电方式。", "4678": "答“正确”：依季节变化要及时更换夏季或冬季机油，不同标号的机油不得混用，经常检查机油（油位和质量）。", "4679": "答“错误”：充足的水汽供应和强盛持续的上升气流是形成暴雨（强对流）的必要条件但不是充分条件（还需其它条件，本题判错误）。", "4680": "答“正确”：一个物理控制信道可以在一个或多个控制信道粒子CCE上传输。", "4681": "答“错误”：易受暴雨灾害影响的底层居民家中，插座开关等应安装在距离地面（0.5米以上或1米以上，不是0.8米，本题判错误，按题库答案为准）。", "4682": "答“正确”：一般情况下一般土壤的电阻都比金属大几百万倍。", "4683": "答“正确”：一般来说纬度在70°以下的地面、80°以下的飞机均可经同步卫星建立通信。", "4684": "答“正确”：增益的提高主要依靠减小垂直面向辐射的波瓣宽度，而在水平面上保持全向的辐射性能。", "4685": "答“错误”：馈线弯曲半径越小（越容易损伤馈线），应满足最小弯曲半径要求，不是越小越好。", "4686": "答“正确”：当人体电阻一定时，触电电压越高危险性越大。", "4687": "答“正确”：一般建筑负荷包括非通信用空调设备、一般照明灯具和备用发电机组等不保证供电的其他负荷。", "4688": "答“正确”：一般基站使用的自动空开都具有过载和过流保护功能。", "4689": "答“错误”：业务与服务转型是深化企业战略转型的核心（不是保障），网络与平台转型、财务与人力资源转型是保障。", "4690": "答“错误”：野外扎营时营地不能建在河边（应离河有一定距离），更不能建在河滩上面（易遭洪水）。", "4691": "答“正确”：野外用灯光发出求救信号时要三短、三长、再三短（SOS）。", "4692": "答“正确”：野外生存中在尚未找到水源的情况下尽量不要吃东西。", "4693": "答“正确”：野外急救的原则是遇到事故时沉着大胆、细心负责、分清轻重缓急、果断实施急救方法。", "4694": "答“错误”：野外地质勘探电器设备熔断丝熔断且没有可替用熔断丝时，严禁使用铁丝等导体代替熔断丝。", "4695": "答“正确”：要加快应急管理的法制建设，形成有中国特色的管理法制体系，把应急管理工作纳入规范化、制度化轨道。", "4696": "答“正确”：严禁在设备和机架正上方安装探测器及其他设备。", "4697": "答“正确”：严禁在接地线、交流中性线中加装开关或熔断器。", "4698": "答“错误”：压缩机工作电压过高容易烧毁，电压过低也容易烧毁（电压过低电流增大同样烧毁）。", "4699": "答“错误”：压缩机的功能是将蒸发器中吸收热量而汽化的制冷剂（低压气体）压缩成高温高压气体。", "4700": "答“正确”：压敏电阻的好坏可以通过其指示窗判断，若为红色说明坏。", "4701": "答“正确”：循环前缀CP的选择原则是Normal CP适用于1.5Km以内的覆盖范围，Extended CP适用于更大覆盖。", "4702": "答“正确”：选用的熔断器其额定电压应与线电压相符。", "4703": "答“正确”：蓄电池组也是一种很好的滤波器。", "4704": "答“错误”：蓄电池组滤波的性能电池容量越大滤波效果越好（不是越差）。", "4705": "答“正确”：蓄电池组的正极或负极（不接地系统除外）和通信电缆的金属隔离层接到直流接地系统上。", "4706": "答“正确”：蓄电池容量指蓄电池的蓄电能力。", "4707": "答“错误”：蓄电池容量随放电率大小而变，一小时率较二小时率放出容量较小（不是较大）。", "4708": "答“错误”：蓄电池串联只能增加电池组的电压，不能增加容量（并联才能增加容量）。", "4709": "答“正确”：蓄电池进行容量测试时，放电电流应不超过10小时率的电流。", "4710": "答“错误”：蓄电池浮充电压不是固定值，受环境温度影响（需温度补偿）。", "4711": "答“错误”：蓄电池放完后应及时充电，不宜长时间静置后再充电（静置会加剧硫酸盐化缩短寿命）。", "4712": "答“错误”：蓄电池电解液比重越低，蓄电池的容量越小（不是越大）。", "4713": "答“正确”：蓄电池的循环寿命与放电深度成反比。", "4714": "答“错误”：蓄电池的使用寿命是指蓄电池（能放出额定容量的使用时间），不是投入运行的时间。", "4715": "答“错误”：蓄电池的两个主要指标是容量和端电压（不是端电压和温度）。", "4716": "答“正确”：蓄电池充电是电能变成化学能，蓄电池放电时化学能变成为电能。", "4717": "答“正确”：信源输出的RS功率与信源带宽、信源总功率、RS功率设置等因素有关，计算公式为RS（功率=总功率-10log带宽+10log子载波数等）。", "4718": "答“正确”：信源编码的目的是提高信源效率，去除冗余度。", "4719": "答“正确”：信号接入微波设备前必须用光功率计对信号源进行测量，确保无误后方可接入。", "4720": "答“错误”：信道编码是（增加冗余进行差错控制），不是补偿时分信道中多径效应产生的码间干扰（那是均衡器的作用）。", "4721": "答“正确”：新闻媒体应当无偿开展突发事件预防与应急、自救与互救知识的公益宣传。", "4722": "答“正确”：卸载后空载运行3分钟以上方可停机。", "4723": "答“错误”：泄漏电缆分布系统最适合用于（隧道、地铁等受限空间覆盖），不是长距离信号传输。", "4724": "答“错误”：小型应急通信车基站桅杆是（手动或液压升降，不一定是自动升降，本题判错误，按题库答案为准）。", "4725": "答“错误”：相对于SA方案，NSA方案对现网改造量（更大，需要改造4G现网配合），不是小。", "4726": "答“正确”：相对光通信，卫星通信存在传输时延较长的弊端。", "4727": "答“正确”：线性稳压电源的优点是线路简单、干扰小，对输入电压和负载变化的响应非常快，稳压性能（好）。", "4728": "答“正确”：线缆在走线架上应均匀绑扎。", "4729": "答“正确”：线缆在走线架上应均匀绑扎，绑扎线扣松紧适度，绑口一致。", "4730": "答“错误”：以太网MAC地址是48位，IP地址是32位（IPv4）（本题说反了）。", "4731": "答“正确”：现在较常用的频谱仪两种制式是超外差式和数字信号处理技术式。", "4732": "答“正确”：现在的应急通信领域所使用的柴油发电机组大多是车载式的。", "4733": "答“错误”：现场接地线缆较短，设备接地和防雷接地也（不应共地接入，需分开或按规范联合接地）。", "4734": "答“正确”：县级以上人民政府应当整合应急资源，建立或者确定综合性应急救援队伍。", "4735": "答“错误”：下行接收频率=下行频率-本振频率（LNB变频是相减）。", "4736": "答“正确”：系统流程中干线割接比一般割接多（省、市公司专家组审核）流程。", "4737": "答“错误”：误码率等于错误的码数比上传输的总码数（不是正确的码数）。", "4738": "答“错误”：误码率的缩写是BER（不是EBC）。", "4739": "答“错误”：物体带电后具有一定的电势，在电路中任意两点之间的电势差称为该两点的电压（本题说法正确但题库判错误，按答案为准——电压定义正确，题干本身无误，以题库为准）。", "4740": "答“错误”：无线自组网并不全面优于传统网络，不会完全取代传统网络。", "4741": "答“正确”：无线自组网的技术特征包括无中心和动态拓扑。", "4742": "答“错误”：无线直放站的信号引入采用空间耦合（不是直接耦合）方式。", "4743": "答“错误”：无线电波频率相差大，传播方式不同，绕射能力也不同（频率越低绕射能力越强）。", "4744": "答“正确”：无线电波和光波一样，传播速度和传播媒介有关。", "4745": "答“正确”：无线电波的极化方向是电场矢量的方向。", "4746": "答“正确”：无线电波传播距离越远，路径损耗越大。", "4747": "答“错误”：调制以前的信号称为基带信号，调制后送入信道的已调信号称为频带信号（本题说反了）。", "4748": "答“正确”：常用的单极化和双极化天线都属于线极化天线。", "4749": "答“错误”：我们把通信设备的工作接地、保护接地（包括接地和建筑防雷接地）共同合用（一个）接地体的方式称为联合接地（不是多组接地体）。", "4750": "答“错误”：我国是世界上自然灾害最严重的国家之一（不是不很严重）。", "4751": "答“错误”：我国处于北半球（不是南半球），GPS天线应安装在南面比较空旷的位置。"}};

function aiConfig(){ var c=store.get(AI_CFG_KEY,{}); return (c&&typeof c==='object')?c:{}; }
function aiSaveConfig(c){ store.set(AI_CFG_KEY, c||{}); }

function aiExplain(q, qi){
  var cfg=aiConfig();

  }
  var picked = state.selected && state.selected.length ? state.selected.join('、') : '未作答';
  var userPrompt='题目（'+q.type+'）：'+q.q+'\n\n选项：\n'+optsText+'\n\n正确答案：'+q.ans+'\n我的选择：'+picked+'\n\n请用中文逐项解析：\n1. 先点明这道题的考点是什么；\n2. 对每个选项分别说明【为什么正确 / 为什么错误】，说清依据，别只说"不符合题意"；\n3. 判断题说明为什么该判正确/错误；\n4. 最后给一句记忆口诀或易错提醒。\n控制在350字以内，用"正确/错误"明确标注每个选项。';
  fetch(cfg.endpoint, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body:JSON.stringify({model:cfg.model, messages:[{role:'system',content:'你是通信行业技能鉴定培训讲师，讲解精炼准确，面向一线装维/综维人员。'},{role:'user',content:userPrompt}]})
  }).then(function(r){
    if(!r.ok) throw new Error('请求失败(HTTP '+r.status+')');
    return r.json();
  }).then(function(d){
    var text=(d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content)||'';
    if(!text) throw new Error('返回内容为空，请检查接口配置');
    var cc=store.get(AI_EXP_KEY,{});
    cc[ck]=text; store.set(AI_EXP_KEY, cc);
    state.aiResult=text; state.aiLoading=false; state.aiError=''; render();
  }).catch(function(e){
    state.aiLoading=false; state.aiResult=''; state.aiError=String(e&&e.message?e.message:e);
    render();
  });
}
/* 轻量渲染：**加粗**、换行、选项行前缀高亮 */
function renderAiText(t){
  if(!t) return '';
  var s=esc(t);
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/^([A-F])([\.、．]\s*)/gm,'<b style="color:var(--brand)">$1$2</b>');
  s=s.replace(/(正确|错误)([:：]|$)/gm,'<b style="color:var(--green)">$1</b>$2');
  s=s.replace(/考点/,'<b style="color:var(--brand)">考点</b>');
  s=s.replace(/(记忆口诀|易错提醒|一句|注意)([:：])/g,'<b>$1$2</b>');
  return s.replace(/\n/g,'<br>');
}

}

/* ================= 工具 ================= */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function normAns(q){
  if(q.type==='判断') return q.ans==='正确'?'正确':'错误';
  return (q.ans||'').replace(/[^A-F]/g,'');
}
function isRight(q, picked){
  const a=normAns(q);
  if(q.type==='判断') return picked.join('')===a || (picked.length===1 && picked[0]===a);
  return [...a].sort().join('')===[...picked].sort().join('');
}
function getProg(bank){
  const p=store.get(PROG_KEY,{});
  return p[bank]||{best:0, tried:0, right:0};
}
function setProg(bank, fn){
  const p=store.get(PROG_KEY,{});
  const d=p[bank]||{best:0,tried:0,right:0};
  p[bank]=fn(d);
  store.set(PROG_KEY,p);
}
/* 建立练习题序 */
function buildOrder(mode){
  const list=BANKS[state.bank];
  if(mode==='wrong'){
    const ws=wrongStore();
    const arr=ws[state.bank]||[];
    state.order=arr.map(w=>w.i);
    state.orderSeed=0;
  } else if(mode==='rand'){
    const seed=(Math.floor(Math.random()*0xffffffff))>>>0;
    state.order=seededShuffle(seed, list.length);
    state.orderSeed=seed;
  } else {
    state.order=[...list.keys()];
    state.orderSeed=0;
  }
  state.mode=mode; state.pos=0; state.selected=[]; state.answered=false; state.results={};
  state.sess={done:0,right:0,wrong:0};
  state.aiResult=''; state.aiError=''; state.aiLoading=false;
}

/* ================= 交互 ================= */
function go(v){ state.view=v; if(v==='home'){state.bank=null;} render(); window.scrollTo(0,0); }
function start(mode){
  buildOrder(mode);
  state.view = (mode==='mem')?'memorize':'quiz';
  render(); window.scrollTo(0,0);
}
function startWrong(b){ state.bank=b; buildOrder('wrong'); state.view='quiz'; render(); window.scrollTo(0,0); }
function pick(L){
  const list=BANKS[state.bank]; const qi=state.order[state.pos]; const q=list[qi];
  if(state.answered) return;
  if(q.type==='单选'){ state.selected=[L]; judge(); }
  else {
    if(state.selected.includes(L)) state.selected=state.selected.filter(x=>x!==L);
    else state.selected.push(L);
    render();
  }
}
function pickJudge(v){ if(state.answered) return; state.selected=[v]; judge(); }
function submitMulti(){ if(!state.selected.length){toast('请先选择选项');return;} judge(); }
function judge(){
  const list=BANKS[state.bank]; const qi=state.order[state.pos]; const q=list[qi];
  const ok=isRight(q, state.selected);
  state.answered=true;
  state.results[qi]= ok?'right':'wrong';
  state.sess.done++; ok?state.sess.right++:state.sess.wrong++;
  setProg(state.bank, d=>({tried:d.tried+1, right:d.right+(ok?1:0), best:d.best}));
  if(!ok){ addWrong(qi, q); }
  else { removeWrong(state.bank, qi); }
  render(); window.scrollTo(0,0);
}
function nextQ(){
  if(state.pos+1>=state.order.length){ finish(); return; }
  state.pos++; state.selected=[]; state.answered=false;
  state.aiResult=''; state.aiError=''; state.aiLoading=false;
  render(); window.scrollTo(0,0);
}
function finish(){
  const r=state.sess;
  clearSession(state.bank, state.mode);
  state.aiResult=''; state.aiError=''; state.aiLoading=false;
  toast(`本次完成 ${r.done} 题，答对 ${r.right}`);
  go('home');
}
function exitQuiz(){ saveSession(); state.aiResult=''; state.aiError=''; state.aiLoading=false; toast('进度已保存，可随时继续'); go('home'); }
function markWrong(qi){
  const list=BANKS[state.bank]; addWrong(qi,list[qi]); toast('已加入错题本');
  nextQ();
}
function addWrong(qi,q){
  const ws=wrongStore(); const arr=ws[state.bank]=ws[state.bank]||[];
  if(!arr.some(w=>w.i===qi)){ arr.push({i:qi}); store.set(WRONG_KEY,ws); }
}
function removeWrong(bank,qi){
  const ws=wrongStore(); if(ws[bank]){ ws[bank]=ws[bank].filter(w=>w.i!==qi); if(!ws[bank].length) delete ws[bank]; store.set(WRONG_KEY,ws); }
}
function clearWrong(){ store.set(WRONG_KEY,{}); toast('错题已清空'); render(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* 底部导航 */
function bottomNav(){
  return `<div class="bottom-nav">
    <div class="nav-item ${state.view==='home'?'on':''}" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>首页</div>
    <div class="nav-item ${state.view==='wrong'?'on':''}" onclick="go('wrong')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a7 7 0 107 7M12 4v8l-5 2"/></svg>错题</div>
    <div class="nav-item ${state.view==='stats'?'on':''}" onclick="go('stats')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>统计</div>
  </div>`;
}

/* 事件委托：点击库卡片 / 选项 / 判断 / 提交 */
app.addEventListener('click', e=>{
  const bc=e.target.closest('.bank-card');
  if(bc){ state.bank=bc.dataset.bank; state.view='bank'; render(); window.scrollTo(0,0); return; }
  const opt=e.target.closest('[data-opt]');
  if(opt && !opt.hasAttribute('data-lock')){ pick(opt.dataset.opt); return; }
  const jb=e.target.closest('[data-judge]');
  if(jb && !jb.hasAttribute('data-lock')){ pickJudge(jb.dataset.judge); return; }
  const sm=e.target.closest('[data-submit]');
  if(sm){ submitMulti(); return; }
  const nq=e.target.closest('[data-next]');
  if(nq){ nextQ(); return; }
  /* 跳题面板（仅点击遮罩本身或 × 才关闭，面板内点击不关闭） */
  const jc=e.target.closest('[data-jump-close]');
  if(jc && jc===e.target){ state.jumpOpen=false; render(); return; }
  const jg=e.target.closest('[data-jump-go]');
  if(jg){
    const inp=document.getElementById('jp-input');
    const n=parseInt((inp&&inp.value)||'',10);
    if(!inp||isNaN(n)||n<1||n>state.order.length){ toast('请输入 1-'+state.order.length+' 之间的序号'); return; }
    jumpTo(n-1); return;
  }
  const jn=e.target.closest('[data-jump-n]');
  if(jn){ jumpTo(parseInt(jn.getAttribute('data-jump-n'),10)); return; }
  /* 继续上次练习（每张卡片对应一个独立存档） */
  const rg=e.target.closest('[data-resume-go]');
  if(rg){ resumeSession(parseInt(rg.getAttribute('data-resume-go'),10)); return; }
  const rcl=e.target.closest('[data-resume-clear]');
  if(rcl){
    if(window.confirm('确定放弃该练习进度吗？')){
      const li=sessionList();
      const it=li[parseInt(rcl.getAttribute('data-resume-clear'),10)];
      if(it) clearSession(it.bank, it.mode);
      toast('已放弃，进度已清空'); render();
    }
    return;
  }
  /* 存档面板（仅点击遮罩本身或 × 才关闭） */
  const ac=e.target.closest('[data-arc-close]');
  if(ac && ac===e.target){ state.arcOpen=false; render(); return; }
  const acp=e.target.closest('[data-arc-copy]');
  if(acp){
    const ta=document.getElementById('arc-text');
    copyText(ta?ta.value:'', '已复制存档内容'); return;
  }
  const adl=e.target.closest('[data-arc-dl]');
  if(adl){ downloadArchive(); return; }
  const aimp=e.target.closest('[data-arc-import]');
  if(aimp){
    const ta=document.getElementById('arc-in');
    if(ta&&ta.value&&ta.value.trim()){ importArchive(ta.value.trim()); }
    else toast('请先粘贴存档内容');
    return;
  }
  /* AI 解析：请求 / 关闭面板 / 预设 / 保存 / 清缓存 */
  const ax=e.target.closest('[data-ai-explain]');
  if(ax){
    const qi=state.order[state.pos];
    aiExplain(BANKS[state.bank][qi], qi); return;
  }
  const acl=e.target.closest('[data-ai-close]');
  if(acl && acl===e.target){ state.aiOpen=false; render(); return; }
  const apr=e.target.closest('[data-ai-preset]');
  if(apr){
    const p=AI_PRESETS[parseInt(apr.getAttribute('data-ai-preset'),10)];
    if(p){ aiSaveConfig(Object.assign({}, aiConfig(), {endpoint:p.endpoint, model:p.model})); render(); toast('已填入：'+p.name+'，请补填 API Key'); }
    return;
  }
  const asv=e.target.closest('[data-ai-save]');
  if(asv){
    const ep=document.getElementById('ai-endpoint');
    const mo=document.getElementById('ai-model');
    const ke=document.getElementById('ai-key');
    const c=aiConfig();
    if(ep) c.endpoint=ep.value.trim();
    if(mo) c.model=mo.value.trim();
    if(ke) c.key=ke.value.trim();
    if(!c.endpoint||!c.model||!c.key){ toast('请完整填写接口地址、模型和 API Key'); return; }
    aiSaveConfig(c); state.aiOpen=false; render();
    toast('AI 解析配置已保存');
    return;
  }
  const acc=e.target.closest('[data-ai-cache-clear]');
  if(acc){
    store.set(AI_EXP_KEY,{});
    state.aiResult=''; state.aiError='';
    toast('已清空 AI 解析缓存'); render();
    return;
  }
});

/* 题库文件选择（change 事件委托，兼容安卓浏览器） */
document.addEventListener('change', function(e){
  var t=e.target;
  if(t && t.id==='bank-file' && t.files && t.files[0]){
    loadBankFromFile(t.files[0]);
    try{ t.value=''; }catch(e2){}
  }
});
tryLoadCachedBank();
render();
