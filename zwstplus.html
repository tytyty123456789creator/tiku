<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通信理论题库 · 作者：章 · bug反馈呼叫664399</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231466D6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>题</text></svg>">
<style>
:root{
  --brand:#1466D6; --brand-d:#0B3D91; --brand-l:#EAF2FE;
  --green:#30A46C; --green-l:#EAF7F0;
  --red:#E5484D; --red-l:#FDEBEC;
  --amber:#F5A623; --amber-l:#FFF6E6;
  --ink:#1B2733; --muted:#6B7A8C; --line:#E3EAF2; --bg:#F4F7FB;
  --card:#FFFFFF; --radius:16px; --shadow:0 4px 20px rgba(16,44,84,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6}
#app{max-width:680px; margin:0 auto; min-height:100vh; padding-bottom:96px; position:relative}
.safe-top{height:env(safe-area-inset-top)}
/* ===== 顶部栏 ===== */
.topbar{position:sticky; top:0; z-index:20; background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 12px rgba(11,61,145,.3)}
.topbar .tb-btn{background:rgba(255,255,255,.16); border:none; color:#fff; width:34px; height:34px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:18px; flex:none}
.topbar .tb-title{flex:1; font-weight:700; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar .tb-sub{font-size:11px; opacity:.85; font-weight:400}
/* ===== 卡片 ===== */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin:12px 14px; padding:16px}
.pad{margin:12px 14px}
.hint{color:var(--muted); font-size:12.5px}
.section-t{font-size:13px; color:var(--muted); margin:18px 14px 6px; font-weight:600; letter-spacing:.3px}
/* ===== 题库卡片 ===== */
.bank-grid{display:grid; grid-template-columns:1fr; gap:12px; margin:4px 14px}
.bank-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; cursor:pointer; border:1px solid transparent; transition:.15s}
.bank-card:active{transform:scale(.98); border-color:var(--brand)}
.bank-head{display:flex; align-items:center; gap:12px}
.bank-ico{width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:none; color:#fff}
.bank-name{font-size:16px; font-weight:700}
.bank-meta{font-size:12px; color:var(--muted); margin-top:2px}
.bank-chips{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap}
.chip{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--brand-l); color:var(--brand)}
.chip.d{background:var(--amber-l); color:#B47D00}
.chip.m{background:#EFF0FF; color:#5E5CE6}
.progress-line{height:6px; background:#E8EEF6; border-radius:4px; overflow:hidden; margin-top:10px}
.progress-line i{display:block; height:100%; background:var(--brand); border-radius:4px}
/* ===== 模式选择 ===== */
.mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.mode-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; cursor:pointer; text-align:center; border:1px solid transparent}
.mode-card:active{transform:scale(.97)}
.mode-card .mc-ico{font-size:26px}
.mode-card .mc-name{font-weight:700; margin-top:6px}
.mode-card .mc-desc{font-size:11.5px; color:var(--muted); margin-top:3px}
.mode-card.active{border-color:var(--brand); background:var(--brand-l)}
/* ===== 答题 ===== */
.q-wrap{padding:12px 14px}
.q-progress{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.q-progress .bar{flex:1; height:8px; background:#E8EEF6; border-radius:6px; overflow:hidden}
.q-progress .bar i{display:block; height:100%; background:var(--brand); border-radius:6px; transition:.2s}
.q-count{font-size:12px; color:var(--muted); white-space:nowrap}
.q-type{display:inline-block; font-size:11px; padding:2px 8px; border-radius:6px; background:var(--brand-l); color:var(--brand); font-weight:600; margin-bottom:8px}
.q-body{font-size:16.5px; font-weight:600; line-height:1.7; margin-bottom:16px}
.opt-list{display:flex; flex-direction:column; gap:10px}
.opt-item{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; display:flex; gap:12px; align-items:flex-start; transition:.12s; font-size:14.5px}
.opt-item:active{background:#F6F9FD}
.opt-item .oi-key{width:26px; height:26px; border-radius:50%; background:#EFF3F9; color:var(--muted); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px}
.opt-item.selected{border-color:var(--brand); background:var(--brand-l)}
.opt-item.selected .oi-key{background:var(--brand); color:#fff}
.opt-item.correct{border-color:var(--green); background:var(--green-l)}
.opt-item.correct .oi-key{background:var(--green); color:#fff}
.opt-item.wrong{border-color:var(--red); background:var(--red-l)}
.opt-item.wrong .oi-key{background:var(--red); color:#fff}
.opt-item.dim{opacity:.5}
.opt-item.lock{cursor:default}
/* 判断 */
.judge-row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.judge-btn{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:18px; text-align:center; font-size:15px; font-weight:700; cursor:pointer}
.judge-btn.correct{border-color:var(--green); background:var(--green-l); color:var(--green)}
.judge-btn.wrong{border-color:var(--red); background:var(--red-l); color:var(--red)}
/* 结果反馈 */
.feedback{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-top:14px; display:none}
.feedback.show{display:block}
.fb-title{font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px}
.fb-title.ok{color:var(--green)} .fb-title.no{color:var(--red)}
.fb-ans{margin-top:8px; font-size:14px}
.fb-ans b{color:var(--brand)}
.fb-right{margin-top:6px; font-size:13.5px; color:var(--muted); background:#F5F8FC; border-radius:8px; padding:10px; line-height:1.7}
/* ===== 按钮 ===== */
.btn-row{display:flex; gap:10px; margin-top:16px}
.btn{flex:1; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; transition:.12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand); color:#fff}
.btn.ghost{background:var(--card); color:var(--brand); border:1.5px solid var(--brand)}
.btn.green{background:var(--green); color:#fff}
.btn.red{background:var(--red); color:#fff}
.btn.sm{flex:0; padding:8px 14px; font-size:13px}
.btn.full{width:100%}
/* ===== 统计 ===== */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.stat-cell{background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:12px 6px; text-align:center}
.stat-cell .num{font-size:20px; font-weight:800; color:var(--brand)}
.stat-cell .lab{font-size:11px; color:var(--muted); margin-top:2px}
/* ===== 底部导航 ===== */
.bottom-nav{position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.95); backdrop-filter:blur(6px); border-top:1px solid var(--line); padding:8px 8px calc(8px + env(safe-area-inset-bottom)); display:flex; z-index:30; max-width:680px; margin:0 auto}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; cursor:pointer; color:var(--muted); font-size:11px; border-radius:10px}
.nav-item.on{color:var(--brand)}
.nav-item svg{width:22px; height:22px}
/* ===== 列表 ===== */
.row-list{display:flex; flex-direction:column; gap:8px; margin:0 14px}
.row-item{background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer}
.row-item .ri-t{flex:1}
.row-item .ri-name{font-weight:600; font-size:14px}
.row-item .ri-meta{font-size:11.5px; color:var(--muted); margin-top:2px}
.badge{font-size:10.5px; padding:2px 7px; border-radius:20px; font-weight:700; flex:none}
.badge.amber{background:var(--amber-l); color:#B47D00}
.badge.red{background:var(--red-l); color:var(--red)}
.badge.green{background:var(--green-l); color:var(--green)}
.badge.purple{background:#EFF0FF; color:#5E5CE6}
.badge.gray{background:#EEF2F7; color:var(--muted)}
.empty{padding:60px 20px; text-align:center; color:var(--muted)}
.empty .e-ico{font-size:40px; opacity:.5}
/* memorize */
.mem-nav{display:flex; gap:10px; margin:4px 14px 12px; align-items:center}
.mem-nav .mm{flex:1; font-weight:700; color:var(--brand); text-align:center}
.q-kbd{font-size:11px; color:var(--muted)}
.mem-ans{margin-top:14px; background:var(--green-l); border-radius:12px; padding:12px 14px}
.mem-ans .ma-l{font-size:12px; color:#1E7A4E; font-weight:700; margin-bottom:4px}
.mem-ans .ma-a{font-size:15px; font-weight:700; color:#147A4A}
.mem-opts .opt-item{cursor:default; border-color:var(--line)}
.mem-opts .opt-item.isans{border-color:var(--green); background:var(--green-l)}
.mem-opts .opt-item.isans .oi-key{background:var(--green); color:#fff}
.ops{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.ops .btn{flex:1; min-width:90px}
.toast{position:fixed; top:60px; left:50%; transform:translateX(-50%); background:rgba(20,32,44,.92); color:#fff; padding:9px 16px; border-radius:20px; font-size:13px; z-index:99; opacity:0; pointer-events:none; transition:.25s}
.toast.show{opacity:1}
@media(min-width:480px){.bank-grid{grid-template-columns:1fr 1fr}}
/* ===== 新增：继续练习 / 跳题 / 存档 ===== */
.resume-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin:12px 14px; padding:14px 16px; display:flex; align-items:center; gap:12px; border:1.5px solid var(--brand)}
.resume-card .rc-ico{width:38px;height:38px;border-radius:12px;background:var(--brand-l);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.resume-card .rc-t{font-weight:700;font-size:14.5px}
.resume-card .rc-m{font-size:12px;color:var(--muted);margin-top:2px}
.resume-card .rc-btns{display:flex;gap:8px;flex:none}
.jump-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(16,32,54,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.jump-panel{background:#fff;width:100%;max-width:680px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;-webkit-overflow-scrolling:touch}
.jp-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px;margin-bottom:12px}
.jp-x{background:var(--brand-l);border:none;color:var(--brand);width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer}
.jp-input-row{display:flex;gap:10px;margin-bottom:12px}
.jp-input-row input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;outline:none;min-width:0;background:#fff}
.jp-input-row input:focus{border-color:var(--brand)}
.jp-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:12px}
.jp-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#F1F5FA;color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid transparent}
.jp-cell:active{transform:scale(.92)}
.jp-cell.cur{border-color:var(--brand);background:var(--brand);color:#fff}
.jp-cell.ok{background:var(--green-l);color:#1E7A4E;border-color:var(--green)}
.jp-cell.no{background:var(--red-l);color:var(--red);border-color:var(--red)}
.jp-legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.lg-dot{width:14px;height:14px;border-radius:4px;background:#F1F5FA;display:inline-block;vertical-align:-2px;margin-right:3px;border:1px solid var(--line)}
.lg-dot.lg-cur{background:var(--brand)}
.lg-dot.lg-ok{background:var(--green-l);border-color:var(--green)}
.lg-dot.lg-no{background:var(--red-l);border-color:var(--red)}
.jp-sec{font-size:12.5px;color:var(--muted);font-weight:600;margin:14px 0 6px}
.jump-panel textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:72px;resize:vertical;outline:none;background:#F8FAFD;color:var(--ink)}
.jp-actions{display:flex;gap:8px;margin-top:8px}
.jp-tip{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}
/* ===== AI 解析 ===== */
.exp-box{background:#F5F8FC;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13.5px;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.exp-box.own{background:var(--green-l)}
.exp-box .eb-t{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.exp-box .eb-t.ok{color:var(--green)} .exp-box .eb-t.ai{color:#5E5CE6}
.ai-btn{flex:0 0 auto}
.ai-loading{display:inline-block;width:12px;height:12px;border:2px solid rgba(94,92,230,.3);border-top-color:#5E5CE6;border-radius:50%;animation:ai-spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes ai-spin{to{transform:rotate(360deg)}}
.ai-error{color:var(--red);font-size:12.5px;margin-top:8px}
.ai-cfg-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.ai-cfg-grid label{font-size:12px;color:var(--muted);font-weight:600}
.ai-cfg-grid input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;outline:none;background:#fff;box-sizing:border-box}
.ai-cfg-grid input:focus{border-color:var(--brand)}
.ai-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ai-presets .btn{padding:7px 12px;font-size:12px}
</style>

<script>
"use strict";
/* ================= 数据与状态 ================= */
/* ================= 题库：外部 JSON 加载（本 HTML 不内置题库） ================= */
let BANKS = {};              // 运行时由 JSON 文件填充
let BANK_ORDER = [];         // 加载后更新
const BANK_CACHE_KEY='tk2_bank_cache_v1';
const BANK_META_KEY='tk2_bank_meta_v1';
let BANK_SOURCE='';          // 当前题库来源（文件名）
const LETTERS = "ABCDEFGHIJ";

/* ================= 题库加载（识别不到 JSON 文件时提示） ================= */
function normalizeBankData(raw){
  if(!raw || typeof raw!=='object') return null;
  var srcBanks = Array.isArray(raw) ? {'题库': raw} : raw;
  var names = Object.keys(srcBanks);
  if(!names.length) return null;
  var out={};
  for(var i=0;i<names.length;i++){
    var name=names[i], list=srcBanks[name];
    if(!Array.isArray(list) || !list.length) continue;
    var norm=[];
    for(var j=0;j<list.length;j++){
      var it=list[j];
      if(!it || typeof it!=='object') continue;
      var q = (it.q!=null)?it.q:(it.question!=null?it.question:null);
      var type = it.type || '';
      var opts = Array.isArray(it.opts)?it.opts.slice(0):(Array.isArray(it.options)?it.options.slice(0):[]);
      var ans = (it.ans!=null)?it.ans:(it.answer!=null?it.answer:null);
      var exp = (it.exp!=null)?it.exp:(it.explanation!=null?it.explanation:(it.jiexi!=null?it.jiexi:(it.analysis!=null?it.analysis:'')));
      if(!exp && BUILTIN_EXP && BUILTIN_EXP[name] && BUILTIN_EXP[name][j]){ exp = BUILTIN_EXP[name][j]; }
      if(q==null || ans==null) continue;
      if(type!=='单选' && type!=='多选' && type!=='判断') type = opts.length>1?'单选':'判断';
      norm.push({q:String(q), type:type, opts:opts, ans:String(ans), exp:String(exp||'')});
    }
    if(norm.length) out[name]=norm;
  }
  return Object.keys(out).length ? out : null;
}
function countAll(b){ var n=0, k; for(k in b){ n+=b[k].length; } return n; }
function applyBankData(norm, name){
  BANKS=norm;
  BANK_ORDER=Object.keys(norm);
  BANK_SOURCE=name||'';
  try{
    if(_storeMode==='localStorage'){
      store.set(BANK_CACHE_KEY, BANKS);
      store.set(BANK_META_KEY, {name:BANK_SOURCE, ts:Date.now()});
    }
    _idbPut(BANK_CACHE_KEY, BANKS);
    _idbPut(BANK_META_KEY, {name:BANK_SOURCE, ts:Date.now()});
  }catch(e){}
  state.view='home'; state.bank=null; state.jumpOpen=false; state.arcOpen=false;
  render(); window.scrollTo(0,0);
  /* 若此前因缺题库而点了“继续”，加载完成后自动续档 */
  if(_pendingResume!=null){
    var _pr=_pendingResume; _pendingResume=null;
    toast('题库已加载，继续上次进度…');
    setTimeout(function(){ resumeSession(_pr); }, 120);
  }
}
function tryLoadCachedBank(){
  var loadOk=false;
  if(_storeMode==='localStorage'){
    try{
      var b=store.get(BANK_CACHE_KEY, null);
      if(b && typeof b==='object'){
        var norm=normalizeBankData(b);
        if(norm){
          var meta=store.get(BANK_META_KEY, null);
          BANKS=norm; BANK_ORDER=Object.keys(norm);
          BANK_SOURCE=(meta && meta.name)?meta.name:'已缓存题库';
          loadOk=true;
        }
      }
    }catch(e){}
  }
  if(!loadOk){
    /* localStorage 无缓存/不可用 → 尝试 IndexedDB 持久备份 */
    _idbGet(BANK_CACHE_KEY, function(b){
      if(b && typeof b==='object'){
        var norm=normalizeBankData(b);
        if(norm){
          var meta=null; _idbGet(BANK_META_KEY, function(m){ meta=m; });
          BANKS=norm; BANK_ORDER=Object.keys(norm);
          BANK_SOURCE=(meta && meta.name)?meta.name:'已缓存题库';
          try{ if(_storeMode==='localStorage'){ store.set(BANK_CACHE_KEY, BANKS); store.set(BANK_META_KEY, {name:BANK_SOURCE, ts:Date.now()}); } }catch(e){}
          render();
          toast('已从本地恢复题库缓存');
          return;
        }
      }
      try{ if(_storeMode==='localStorage') store.set(BANK_CACHE_KEY, ''); }catch(e){}
    });
  }
}
function loadBankFromFile(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    var norm=null;
    try{ norm=normalizeBankData(JSON.parse(String(reader.result))); }
    catch(e){ toast('题库文件解析失败，请检查文件内容'); return; }
    if(!norm){ toast('无法识别的题库格式，请使用配套的题库 JSON 文件'); return; }
    applyBankData(norm, file.name);
    toast('题库加载成功：'+Object.keys(norm).length+' 个题库，共 '+countAll(norm)+' 题');
  };
  reader.onerror=function(){ toast('读取题库文件失败，请重试'); };
  reader.readAsText(file, 'utf-8');
}
function bankEmptyView(msg){
  var tip = msg || '缺少题库 JSON 文件';
  return `<div class="safe-top"></div>
  <div class="topbar"><div class="tb-title">通信理论题库 · 仅供综维内部交流</div><div class="tb-sub">严谨外传</div></div>
  ${resumeCardsHtml()}
  <div class="card" style="text-align:center;padding:30px 20px">
    <div style="width:52px;height:52px;margin:0 auto;border-radius:14px;background:var(--amber-l);display:flex;align-items:center;justify-content:center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B47D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg>
    </div>
    <div style="font-weight:800;font-size:17px;margin-top:12px">${tip}</div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.9;text-align:left">
      本答题器不内置题库，需要搭配题库 JSON 文件一起使用：<br>
      ① 先下载题库 JSON 文件；<br>

/* 存储层：localStorage 为主，关键进度数据同时写 cookie 镜像兜底；即使浏览器清空/禁用本地存储，进度仍可从 cookie 恢复；再不行降级内存（仅本次会话），兼容低版本安卓浏览器 */
var _storeMode='localStorage';
var _memStore={};
(function(){
  try{
    localStorage.setItem('__tk_test__','1'); localStorage.removeItem('__tk_test__');
  }catch(e){
    try{
      document.cookie='__tk_test__=1; path=/';
      _storeMode=(document.cookie.indexOf('__tk_test__')>=0)?'cookie':'memory';
    }catch(e2){ _storeMode='memory'; }
  }
})();
/* 需要 cookie 镜像的关键数据（会话/进度/错题）；题库缓存体积过大不入镜像 */
const MIRROR_KEYS={'tk_session_v1':1,'tk_prog_v1':1,'tk_wrong_v1':1};
const MIRROR_PREFIX='tk2c_';
const COOKIE_MAX=3800;
function _cookieGet(k){
  try{
    var m=document.cookie.match(new RegExp('(?:^|; )'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'=([^;]*)'));
    return m?decodeURIComponent(m[1]):null;
  }catch(e){ return null; }
}
function _cookieSet(k,v){
  try{
    if(!k || v==null || String(v).length>COOKIE_MAX) return;
    document.cookie=k+'='+encodeURIComponent(v)+'; path=/; max-age=31536000';
  }catch(e){}
}
function _lsGet(k){
  try{ return localStorage.getItem(k); }catch(e){ return null; }
}
function _lsSet(k,v){
  try{ localStorage.setItem(k,v); return true; }catch(e){ return false; }
}
const store = {
  get(k,d){
    try{
      var raw=null;
      if(_storeMode==='localStorage') raw=_lsGet(k);
      if(raw==null) raw=_cookieGet(MIRROR_PREFIX+k);   /* 本地存储缺失 → 读 cookie 镜像 */
      if(raw==null) raw=(k in _memStore)?_memStore[k]:null;
      return raw?JSON.parse(raw):d;
    }catch(e){ return d; }
  },
  set(k,v){
    try{
      var s=JSON.stringify(v);
      var saved=false;
      if(_storeMode==='localStorage'){ saved=_lsSet(k,s); }
      if(!saved){ _memStore[k]=s; }
      if(MIRROR_KEYS[k]===1){ _cookieSet(MIRROR_PREFIX+k, s); }   /* 关键数据始终写 cookie 镜像 */
    }catch(e){}
  }
};
function storeMode(){ return _storeMode; }
/* ---- IndexedDB 题库缓存兜底：localStorage 被清空/禁用时，题库缓存仍有持久备份，容量大且不随会话丢失 ---- */
var _idbReady=false, _idbDB=null, _pendingResume=null;
function _idbOpen(){
  if(_idbReady) return Promise.resolve(_idbDB);
  return new Promise(function(res, rej){
    try{
      if(!window.indexedDB){ rej(new Error('no idb')); return; }
      var req=indexedDB.open('tk_bank_store',1);
      req.onupgradeneeded=function(){ try{ req.result.createObjectStore('kv'); }catch(e){} };
      req.onsuccess=function(){ _idbReady=true; _idbDB=req.result; res(_idbDB); };
      req.onerror=function(){ _idbReady=false; rej(new Error('idb open err')); };
    }catch(e){ rej(e); }
  });
}
function _idbWrite(k,v){
  try{
    if(!_idbReady || !_idbDB) return;
    var tx=_idbDB.transaction('kv','readwrite');
    tx.objectStore('kv').put(JSON.stringify(v), k);
  }catch(e){}
}
function _idbPut(k,v){
  _idbOpen().then(function(){ _idbWrite(k,v); }).catch(function(){});
}
function _idbGet(k, cb){
  _idbOpen().then(function(db){
    try{
      var tx=db.transaction('kv','readonly');
      var rq=tx.objectStore('kv').get(k);
      rq.onsuccess=function(){ try{ cb(rq.result?JSON.parse(rq.result):null); }catch(e){ cb(null); } };
      rq.onerror=function(){ cb(null); };
    }catch(e){ cb(null); }
  }).catch(function(){ cb(null); });
}
const WRONG_KEY='tk_wrong_v1';
const PROG_KEY='tk_prog_v1';
const SESSION_KEY='tk_session_v1';

/* ================= 会话存档（按 题库×模式 独立自动保存，随时继续，互不覆盖） ================= */
function sessionRaw(){
  var m=store.get(SESSION_KEY, []);
  return Array.isArray(m)?m:[];
}
/* 确定性伪随机（xorshift32）：随机练习只存种子，体积极小且可精确重建题序 */
function seededShuffle(seed, len){
  var s=(seed>>>0)||1;
  function rnd(){
    s^=s<<13; s^=s>>>17; s^=s<<5; s|=0;
    return (s>>>0)/4294967296;
  }
  var arr=new Array(len), i, j, t;
  for(i=0;i<len;i++) arr[i]=i;
  for(i=len-1;i>0;i--){ j=Math.floor(rnd()*(i+1)); t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
/* 题序压缩：顺序/背题连续题序只存长度；随机只存种子+长度；错题存索引数组 */
function packOrder(order){
  if(Array.isArray(order) && order.length){
    var isSeq=true, i;
    for(i=0;i<order.length;i++){ if(order[i]!==i){ isSeq=false; break; } }
    if(isSeq) return {seq:true, len:order.length};
    if(state.mode==='rand' && typeof state.orderSeed==='number'){
      return {seed:(state.orderSeed>>>0), len:order.length};
    }
    return order.slice(0);
  }
  return [];
}
function unpackOrder(pack){
  if(!pack || typeof pack!=='object') return null;
  if(pack.seq===true && typeof pack.len==='number' && pack.len>0){
    var o=new Array(pack.len), i;
    for(i=0;i<pack.len;i++) o[i]=i;
    return o;
  }
  if(typeof pack.seed==='number' && typeof pack.len==='number' && pack.len>0){
    return seededShuffle(pack.seed, pack.len);
  }
  if(Array.isArray(pack)) return pack.slice(0);
  return null;
}
function saveSession(){
  if(state.view!=='quiz' && state.view!=='memorize') return;
  if(!state.bank || !BANKS[state.bank]) return;
  if(!state.order || !state.order.length) return;
  var data={
    order:packOrder(state.order),
    pos:state.pos,
    selected:(state.selected||[]).slice(0),
    answered:!!state.answered,
    results:Object.assign({}, state.results),
    sess:Object.assign({done:0,right:0,wrong:0}, state.sess),
    ts:Date.now()
  };
  var m=sessionRaw(), found=false, i;
  for(i=0;i<m.length;i++){
    if(m[i] && m[i].bank===state.bank && m[i].mode===state.mode){ m[i].data=data; found=true; break; }
  }
  if(!found) m.push({bank:state.bank, mode:state.mode, data:data});
  store.set(SESSION_KEY, m);
}
function clearSession(bank, mode){
  if(bank==null || mode==null) return;
  store.set(SESSION_KEY, sessionRaw().filter(function(e){ return !(e && e.bank===bank && e.mode===mode); }));
}
function validSession(bank, s){
  if(!s || typeof s!=='object' || !bank) return false;
  var order=unpackOrder(s.order);
  if(!order || !order.length) return false;
  if(typeof s.pos!=='number' || isNaN(s.pos) || s.pos<0 || s.pos>=order.length) return false;
  return true;
}
function sessionList(){
  var raw=sessionRaw(), out=[], i;
  for(i=0;i<raw.length;i++){
    var e=raw[i];
    if(!e || typeof e!=='object' || !e.bank || !e.mode) continue;
    if(validSession(e.bank, e.data)){
      var order=unpackOrder(e.data.order);
      out.push({bank:e.bank, mode:e.mode, s:e.data, len:(order?order.length:0)});
    }
  }
  out.sort(function(a,b){ return ((b.s&&b.s.ts)||0)-((a.s&&a.s.ts)||0); });
  return out;
}
function modeTxt(mode){ return mode==='rand'?'随机':mode==='wrong'?'错题':mode==='mem'?'背题':'顺序'; }
function timeAgo(ts){
  if(!ts) return '';
  var diff=Date.now()-ts;
  if(diff<60e3) return '刚刚';
  if(diff<3600e3) return Math.floor(diff/60e3)+' 分钟前';
  if(diff<86400e3) return Math.floor(diff/3600e3)+' 小时前';
  return Math.floor(diff/86400e3)+' 天前';
}
function resumeSession(idx){
  var list=sessionList();
  var it=(typeof idx==='number' && list[idx])?list[idx]:null;
  if(!it){ toast('没有可继续的进度'); return; }
  var bank=it.bank, mode=it.mode, s=it.s;
  if(!BANKS[bank]){
    /* 题库未加载：自动弹出文件选择，加载后自动续档（不再只提示一句） */
    _pendingResume=idx;
    toast('请选择题库 JSON 文件（包含「'+bank+'」），将自动继续');
    try{
      var _bf=document.getElementById('bank-file');
      if(_bf) _bf.click();
    }catch(e){}
    return;
  }
  var arr=BANKS[bank];
  var order=unpackOrder(s.order);
  if(!order){ toast('进度数据无效，已清除'); clearSession(bank, mode); render(); return; }
  order=order.filter(function(i){ return typeof i==='number' && i>=0 && i<arr.length; });
  if(!order.length){ toast('进度数据无效，已清除'); clearSession(bank, mode); render(); return; }
  state.bank=bank;
  state.mode=mode;
  state.order=order;
  state.orderSeed=(mode==='rand' && s.order && typeof s.order.seed==='number')?(s.order.seed>>>0):0;
  state.pos=Math.min(Math.max(0, Math.floor(s.pos)), order.length-1);
  state.selected=Array.isArray(s.selected)?s.selected.slice(0):[];
  state.answered=!!s.answered;
  state.results=(s.results && typeof s.results==='object')?s.results:{};
  state.sess=Object.assign({done:0,right:0,wrong:0}, s.sess||{});
  state.jumpOpen=false; state.arcOpen=false;
  state.aiResult=''; state.aiError=''; state.aiLoading=false;
  state.view=(mode==='mem')?'memorize':'quiz';
  render(); window.scrollTo(0,0);
  toast('已继续：'+bank+' · '+modeTxt(mode)+' 第 '+(state.pos+1)+'/'+order.length+' 题');
}

function importArchive(raw){
  var d=null;
  try{ d=JSON.parse(raw); }catch(e){ toast('存档内容不是有效格式'); return; }
  if(!d || typeof d!=='object'){ toast('存档内容不是有效格式'); return; }
  if(d.prog && typeof d.prog==='object') store.set(PROG_KEY, d.prog);
  if(d.wrong && typeof d.wrong==='object') store.set(WRONG_KEY, d.wrong);
  if(d.session !== undefined && d.session !== null){
    if(Array.isArray(d.session)){
      store.set(SESSION_KEY, d.session.filter(function(e){ return e && typeof e==='object' && e.bank && e.mode && e.data && typeof e.data==='object'; }));
    } else if(typeof d.session==='object'){

const BUILTIN_EXP = {"小微ICT": {"0": "B 正确：FTTR-B 融合视频网关是安徽电信面向小微场景主推的产品，单台设备标称最大支持16路摄像机接入，这是官方规格参数。A 错误：8路是部分低配型号的能力，不是该设备标称。C 错误：32路不是该设备标称上限。D 错误：64路超出该设备支持能力。", "1": "B 正确：《餐饮服务连锁企业落实食品安全主体责任监督管理规定》明确，“互联网+明厨亮灶”的视频信息应当至少保存14天，用于食品安全事后追溯。A 错误：7天低于规范要求的最低时限。C 错误：30天虽长于14天，但题目问“至少保存”，应选最低标准值。D 错误：90天同理不是“至少”值。", "2": "D 正确：智能音箱/网关承担集中控制与设备联动的中枢角色，能统一管理智能灯泡、门锁、插座等子设备，是智能家居的核心控制设备。A/B/C 错误：智能灯泡、智能门锁、智能插座都只是被控制的末端执行设备，不具备核心控制能力。", "3": "B 正确：人体红外（热释电）传感器通过检测人体发出的红外热源和移动变化来触发开关，实现“人来灯亮、人走灯灭”。A 错误：温度传感器只测环境温度，无法判断是否有人。C 错误：烟雾传感器用于火灾报警。D 错误：门磁传感器只检测门窗的开合状态。", "4": "B 正确：客人退房后客房处于无人状态，系统自动关闭所有电器并重置空调温度，既节能又安全，符合酒店客房管理需求。A 错误：播放欢迎音乐是客人入住时的场景。C 错误：打开窗帘不利于节能和隐私。D 错误：启动语音助手对话在无人场景下无意义。", "5": "B 正确：PoE 供电依托网线传输，标准以太网双绞线链路最长不超过100米，超过后线损增大、供电电压不足，摄像头工作不稳定。A 错误：50米是偏保守的做法，不是规范上限。C/D 错误：150米、200米超出标准以太网链路长度限制，供电与信号均无法保证。", "6": "D 正确：视频监控系统主要由摄像（采集）、传输、图像存储三大功能构成，图像编辑属于后期处理软件功能，不属于监控系统的组成部分。A/B/C 错误：摄像、传输、图像存储都是监控系统的必备环节。", "7": "A 正确：五类线（CAT5）带宽为100MHz，对应的最高传输速率是100Mbit/s，即百兆以太网。B 错误：155Mbit/s 是 ATM 网络的常用速率，与五类线无关。C 错误：250MHz/250M 级是超五类、六类线的能力。D 错误：600Mbit/s 远超五类线标准上限。", "8": "C 正确：小CTO 是技术负责人，需要行业洞察、解决方案和统筹管理能力，受理业务属于营业受理岗位的职责，不属于小CTO 必须掌握的技能。A/B/D 错误：行业洞察能力、解决方案能力、统筹管理能力都是小CTO 的核心技能。", "9": "A 正确：中国电信“安全大脑”是基于网络安全运营平台、面向客户提供标准化安全服务的产品，如安全托管、监测预警等。B 错误：天翼云眼是视频监控产品。C 错误：云主机是云计算基础产品。D 错误：FTTR-B 是全光组网设备，均与安全服务无关。", "10": "C 正确：内网组网规划首要考虑可扩展性、可靠性、成本效益等技术与经济因素，网络美观性不是网络拓扑规划的首要技术考量。A/B/D 错误：可扩展性、可靠性、成本效益都是组网规划的核心因素。", "11": "D 正确：小微ICT 视频监控面向沿街商铺、乡村村委、中小企业等小微客户群体，跨国金融集团属于政企大客户市场，不在小微ICT 的目标客户范围内。A/B/C 错误：沿街商铺、乡村村委、中小企业都是典型目标客户。", "12": "D 正确：电信做内网组网具备品牌优势（运营商信誉）、人员优势（装维队伍覆盖）和末梢优势（网络末梢资源），三者兼有，故选“以上都是”。A/B/C 错误：三个选项各自只说出其中一方面，不完整。", "13": "C 正确：劝导员地笼放入基坑后使用水泥浇筑，凝固后强度高，可牢固固定地笼。A 错误：沥青用于路面铺装，不用来浇筑固定。B 错误：砂石无黏结强度，无法固定。D 错误：细石混凝土虽可浇筑，但标准做法为水泥。", "14": "C 正确：看现场环节重点考察安装位置合理性、画面清晰度、覆盖范围等现场条件，监控设备的生产厂家背景属于选型阶段确定的内容，不是现场勘察重点。A/B/D 错误：安装位置、画面效果、覆盖范围都是现场必看内容。", "15": "C 正确：按中国电信智慧家庭业务规范，入户光缆段在1310nm、1490nm、1577nm波长的光衰减值均应小于1.0dB。A/B 错误：0.3dB、0.5dB 过于严格，不是规范规定的阈值。D 错误：1.5dB 超过规范允许值，不合格。", "16": "A 正确：摄像头应避免安装在光线弱或面向太亮的地方，过于强烈的明暗变化会导致过曝或欠曝，失去亮处或暗处的画面细节。B 错误：“暴光”不是规范表述。C/D 错误：幽静、冷清不是影响成像的光照因素。", "17": "D 正确：装维规范要求上门穿工装、戴安全帽、戴鞋套，安装完成后打扫卫生，禁止踩踏用户灶台，A/B/C 三项均违反规范，所以“以上都不正确”。", "18": "C 正确：按《智慧家庭场景化培训教材之装维基础》，蝶形引入光缆沿门框边沿和踢脚线布放时，卡钉扣间距为50厘米。A/B 错误：20、30厘米过密。D 错误：80厘米间距过大，光缆容易松动脱落。", "19": "C 正确：FTTR（Fiber To The Room，光纤到房间）是家庭全光组网的简称，主光猫通过光纤连接各房间子光猫。A 错误：FTTH 是光纤到户。B 错误：FTTB 是光纤到楼。D 错误：FTTD 是光纤到桌面，均非家庭全光组网简称。", "20": "A 正确：光纤的带宽潜力远超铜缆，未来带宽升级只需更换两端设备，线缆本身无需更换，可满足未来20年的升级需求。B/C/D 错误：五类、超五类、六类网线都是铜缆，带宽上限有限，难以支撑长期带宽演进。", "21": "B 正确：除全屋智能业务外，开通装机工单的标准装机时限为24小时。A 错误：12小时属于加急时限。C/D 错误：36小时、48小时超出标准承诺时限。", "22": "A 正确：天翼看家“远程实时查看”功能支持用户随时随地实时查看监控画面，满足“实时查看场景实物图”的需求。B 错误：双向语音对讲用于通话。C 错误：远程云台控制是调整镜头角度。D 错误：红外夜视是夜间成像功能。", "23": "A 正确：FTTR 主网关/主光猫的下行光口为 GPON 口，通过光纤连接各房间的从光猫（子网关），实现光纤到房间。B 错误：XG-PON 口是10G上联口。C 错误：GE 口是电口，不发光信号。D 错误：EPON 口是另一制式的 PON 口。", "24": "A 正确：规范要求智慧家庭工程师接到工单后及时响应并联系用户，在预约时间前5分钟到达现场。B/C/D 错误：10、15、20分钟都不是规范规定的前置到达时间。", "25": "B 正确：佩戴安全帽、穿绝缘鞋、配备测电笔等防护措施，目的是“防止”触电事故的发生，属于事前预防手段。A 错误：防护侧重物理防护作用。C 错误：禁止是管理层面的禁令表述。D 错误：杜绝是目标性表述，题干语境选“防止”最准确。", "26": "B 正确：凡在坠落高度基准面2米及以上有可能坠落的高处进行的作业，均称为高处作业，这是国标定义。A 错误：1米低于标准起点。C/D 错误：3米、4米高于标准起点，不属于定义值。", "27": "D 正确：机房内严禁堆放易燃、易爆物品，即使提前做好警示标识也属违规，所以“在机房内堆放易燃易爆物品需提前做好警示标识”的说法错误，本题选 D。A/B/C 错误：机房内严禁抽烟吃零食、严禁烟火引入、禁止明火电炉取暖都是正确规定。", "28": "C 正确：通信线路附近有其他线条且性质未辨清时，一律按电力线缆处理，防止误触带电线路造成触电，这是线路作业的安全铁律。A/B/D 错误：按通信线缆、无主线缆、其他线缆处理都违反安全原则。", "29": "B 正确：光通信中一个法兰盘（法兰连接器）的插入损耗典型值约为0.5dB。A 错误：0.2dB 是光纤熔接损耗的量级。C 错误：0.9dB 偏高。D 错误：1.2dB 超出单个法兰盘的典型损耗。", "30": "A 正确：1:16 光分路器的理论损耗约为 10×log16≈12dB，这是 ODN 分光的标准损耗值。B 错误：9dB 对应约1:8分光。C 错误：16dB 对应1:32分光。D 错误：14dB 无对应标准分光比。", "31": "C 正确：PON 系统下行波长是1490nm，ONU 接收的是下行光信号，所以收光测试时光功率计波长应设为1490nm。A 错误：850nm 是多模光纤测试波长。B 错误：1550nm 是传输/上行备用波长。D 错误：1310nm 是 ONU 上行发射波长。", "32": "A 正确：油机供电时，市电恢复后应先切断负荷，让油机空载运行3~5秒，待机组稳定后再关闭油门停机。B/C/D 错误：7~10秒、半分钟、一分钟均不是规范规定的时间。", "33": "D 正确：油机发电机空载试机时间为15~30分钟，用以检验机组运行状态。A 错误：60~90分钟过长。B 错误：1~10分钟过短，不足以充分试机。C 错误：45~60分钟偏长。", "34": "C 正确：分光器损耗约等于10×logN，1:32 分光器约15dB（10×log32≈15dB）；题干给出1:2约3dB，推算5级1:2级联即1:32，约15dB。A 错误：12dB 是1:16分光。B 错误：9dB 是1:8分光。D 错误：6dB 是1:4分光。", "35": "C 正确：熔接后的纤芯应每芯单独用热缩管包封保护，将同一松套管内的6芯用同一根热缩管包封，纤芯互相挤压、无法单独固定，也不符合规范，属于抢修中的违规做法。A/B/D 错误：密封胶条规范安装、两台熔接机并行抢修、OTDR 边熔边测都是合理做法。", "36": "D 正确：红光笔只能用于查断纤、判断通断和纤序，无法定量检测熔接衰耗。A 错误：光时域反射仪（OTDR）可测熔接损耗。B 错误：光功率计+光源可测线路衰耗。C 错误：熔接机本身会显示熔接损耗估算值，可供参考。", "37": "B 正确：我国规定36V及以下为安全电压，对人体不构成威胁。A 错误：56V 超过安全电压上限。C/D 错误：24V、12V 虽然也是安全电压，但本题考的是标准规定值“36V”。", "38": "D 正确：蓄电池组串联时电压相加，并联时容量相加。为提高输出电压，应将多个性能相同的单体蓄电池串联起来。A/B 错误：同步、异步是运行方式的描述，与电压提升无关。C 错误：并联提高的是容量而非电压。", "39": "D 正确：雾天能见度低、视线不清，看不清道路和障碍物，是影响安全行车的最主要因素。A 错误：发动机不易因雾天熄火。B 错误：侧滑主要与雨雪湿滑路面相关。C 错误：行驶阻力增大不是雾天的主要影响。", "40": "C 正确：网络运营者未经“被收集者”同意，不得向他人提供其收集的个人信息（经处理无法识别且不能复原的除外），被收集者即信息主体本人。A 错误：“本人”用词不准确，规范用语是被收集者。B 错误：本人单位无权代替被收集者同意。D 错误：国家主管部门不是同意主体。", "41": "答“错误”。该说法错误：超级编码（Smart264/265等）通过智能算法去除画面冗余，在保持画质基本不变的前提下压缩码流以节省存储与带宽，不会大幅降低视频画面清晰度。", "42": "答“错误”。该说法错误：4G智能电表内置4G通信模块，可直连网络平台抄表，无需额外配置数据采集器；数据采集器是用在没有通信模块的普通表计上的。", "43": "答“错误”。该说法错误：智能设备可以通过Wi-Fi、蓝牙、Zigbee、4G/5G、以太网等多种方式联网，并非所有设备都必须连接Wi-Fi才能工作。", "44": "答“错误”。该说法错误：六类线（CAT6）带宽250MHz，最高传输速率可达1Gbps（千兆）及以上，300M 的说法明显低于六类线的实际能力。", "45": "答“正确”。标准小微ICT产品的服务期限通常为1年，这是小微ICT业务合同的常见约定，符合实际。", "46": "答“正确”。吸顶式AP安装在天花板上必须做好可靠固定（使用支架或螺钉），不能直接搁放，防止设备坠落，符合安装规范。", "47": "答“错误”。该说法错误：光电复合缆虽可为从网关供电，但FTTR-B从网关属室内产品，杆站等室外布放涉及防水防雷等要求，不能简单认为不用取电就能放室外杆站。", "48": "答“错误”。该说法错误：数字乡村天翼云播设备音柱音量应按交付规范合理设置，一般不建议调至最大，否则易失真、扰民，规范中有明确要求。", "49": "答“正确”。全光布线光纤种类要求：明线可采用隐形光纤或蝶形光纤，暗管穿纤需采用自承式（金属加强）蝶形光纤，符合《智慧家庭业务安装维护操作相关规范》。", "50": "答“正确”。天翼云眼摄像头支持叠加购买并使用多个AI套餐（如人形检测、区域入侵、越界报警等），一台设备可同时使用多个套餐，符合产品能力。", "51": "答“正确”。自觉服从公司统一管理、积极参加单位组织的安全教育及有关活动、牢固树立安全第一意识，是综维装维安全生产的基本要求，符合规定。", "52": "答“正确”。中国电信核心价值观中“以人为本”的内涵即“以客户为中心、以员工为根本”，本题表述正确。", "53": "答“错误”。该说法错误：蓄电池放电能力有限，长时间深放会损害寿命，市电长时间中断时必须用油机发电保障，不能只依赖蓄电池坚持到市电来电。", "54": "答“正确”。在公路、高速公路、铁路、桥梁、通航河道、市区等特殊地段施工时，应使用有关部门规定的警示标志，必要时派专人警戒看守，属安全施工规范。", "55": "答“正确”。油机使用完毕应先关闭（切断）负荷，再关闭油机，避免带载停机损坏设备，符合操作规程。", "56": "答“正确”。蓄电池容量指在规定条件下蓄电池可放出的电量，即蓄电池的蓄电能力，单位通常为安时（Ah）。", "57": "答“正确”。光纤衰减主要由吸收衰减（本征吸收、杂质吸收）和散射衰减（瑞利散射等）构成，本题表述正确。", "58": "答“正确”。OTDR基于瑞利后向散射原理工作，其显示器上显示的波形就是通常所称的“OTDR后向散射曲线”。", "59": "答“正确”。光缆线路日常巡查方式包括徒步巡查和车巡两种，本题表述正确。", "60": "答“正确”。故障责任追究遵循“四不放过”：故障原因不查清不放过、故障处理不完成不放过、整改措施不落实不放过、故障教训不汲取不放过，表述正确。"}, "设备线路": {"0": "B 正确：ODN（光配线网）位于OLT与ONU之间，承担光信号功率分配，是无源光分配网络。A 错误：OLT是光线路终端。C/D 错误：ONU/ONT是用户侧设备，都不做功率分配。", "1": "D 正确：1:16均匀分光分路器插入损耗典型值≤14.0dB（理论约12dB+附加损耗余量）。A/B/C 错误：≤3.6、≤7.3、≤10.7分别是1:2、1:4、1:8分路器的典型值。", "2": "A 正确：FTTH的ODN网络拓扑一般为树形结构，从OLT逐级分光到用户。B/C/D 错误：星形、总线、环形不是FTTH ODN的典型拓扑。", "3": "C 正确：ping命令用于测试网络连通性。A 错误：telnet远程登录。B 错误：nslookup查域名解析。D 错误：ftp文件传输。", "4": "A 正确：PON是无源光网络，ODN无源、不含光中继器，光中继器不是PON组成部分。B/C/D 错误：OLT、ONU、ODN都是PON的三大组成。", "5": "B 正确：PON单纤双向，上行1310nm、下行1490nm。A 错误：方向写反。C 错误：1550nm是传输用波长。D 错误：下行1550nm不是PON标准。", "6": "D 正确：PON下行采用广播技术（各ONU共享下行帧，按地址接收），上行采用TDMA时分多址技术。A/B/C 错误：组合不匹配。", "7": "A 正确：防静电手腕带另一端须良好接地，才能泄放人体静电，保护单板。B/C/D 错误：插好、固定、夹紧都不是接地泄放要求。", "8": "A 正确：划分VLAN的核心作用是隔离广播风暴、缩小广播域，提高网络性能与安全。B/C/D 错误：绑定端口、二层组网、数据转发都不是VLAN的主要作用。", "9": "D 正确：传输层负责端到端的数据传输完整性（如TCP确认重传）。A 错误：物理层传比特。B 错误：数据链路层传帧。C 错误：网络层路由寻址。", "10": "B 正确：PON是点到多点的组网模式，OLT通过ODN连接多个ONU。A 错误：点到点是直连。C/D 错误：多点到多点/多点到点不是PON。", "11": "B 正确：光纤通信常用波长在800nm~1600nm（850/1310/1490/1550nm）。A/C/D 错误：范围超出光纤低损耗窗口。", "12": "B 正确：PON系统中OLT与ONU之间分光器级联一般不超过2级。A/C/D 错误：1级过少，3、4级损耗过大不可取。", "13": "A 正确：ONU正常工作时PON口指示灯常亮，表示注册成功且链路正常。B/C 错误：慢闪、快闪表示未注册或收发异常。D 错误：常灭为无光。", "14": "B 正确：GPON下行（OLT PON口发光）中心波长1490nm。A 错误：1310nm是上行。C 错误：850nm多模。D 错误：1550nm传输。", "15": "D 正确：GPON接入层覆盖半径一般为20km（最大逻辑距离）。A/B/C 错误：10、5.5、15km均小于GPON标准覆盖。", "16": "C 正确：PON即Passive Optical Network无源光网络，ODN不含有源器件。A/B 错误：有源网络错误。D 错误：无源电网络错误。", "17": "C 正确：XGPON下行速率标称约10Gbit/s。A 错误：1.25G是GPON上行。B 错误：2.5G是GPON下行。D 错误：40G远超XGPON。", "18": "B 正确：XGPON下行波长1577nm，高于GPON的1490nm。A/C/D 错误：1490nm是GPON下行、两者不同、1310nm是上行。", "19": "A 正确：FTTH部署XGPON速率不达标，优先排查是否使用支持XGPON的ONU及后台限速，这是最常见原因。B/C/D 错误：光缆、OLT、光纤长度一般不是主因。", "20": "B 正确：ipconfig/all显示完整配置，包含物理网卡地址（MAC）。A 错误：ipconfig默认不显示MAC。C/D 错误：写法不规范。", "21": "A 正确：FC型俗称圆头尾纤，最常用。B 错误：SC方头。C 错误：LC小方头。D 错误：ST卡扣式。", "22": "C 正确：光纤利用光的全反射原理实现低损耗传输。A/B/D 错误：反射、折射、透射不是传输原理。", "23": "C 正确：SC/PC中PC指光纤接头端面截面工艺（物理接触研磨）。A/B/D 错误：光纤类型、制作工艺、连接器工艺都不是PC含义。", "24": "A 正确：永久性光纤连接叫热熔（熔接）。B 错误：冷熔即冷接，非永久高可靠。C 错误：冷接同上。", "25": "D 正确：OTDR不能测光波长，只能测长度、衰耗、接头损耗等。A/B/C 错误：均为OTDR可测项目。", "26": "A 正确：损耗是限制光信号传输距离的主要参数。B 错误：色散限制高速率。C/D 错误：温度湿度非主要。", "27": "A 正确：PON是点到多点、单纤双向的无源光网络。B/C/D 错误：双纤双向、点到单点均错。", "28": "B 正确：OLT发起并控制测距，且记录测距信息，“不记录测距信息”说法错误，本题选B。A/C/D 错误：广播发数据、ONU受控、分配带宽均正确。", "29": "C 正确：ONU会对用户以太网数据缓存，在分配的发送窗口上行发送，“不缓存”说法错误，选C。A/B/D 错误：选择接收广播数据、响应测距功率控制、其他以太网功能均正确。", "30": "B 正确：模场直径反映光纤纤芯光场分布，对传输光纤而言模场直径越大越好，利于连接。A 错误：数值孔径表征集光能力。C/D 错误：折射率、截止波长不是“越大越好”。", "31": "B 正确：色散是光纤的传输特性指标，影响高速传输。A/C/D 错误：光学、机械、温度特性均不对。", "32": "D 正确：GYTA即室外通信用、金属加强构件、松套层绞、全填充、铝-聚乙烯粘结护套光缆。A/B/C 错误：名称要素不匹配。", "33": "B 正确：第16号纤为第3个松套管（绿管）内第5根纤（棕纤），即绿管棕纤。A 错误：棕管绿纤是另一序号。C 错误：橙管灰纤不对。D 错误：灰管白纤不对。E 错误：棕管白纤不对。", "34": "C 正确：1310nm波长光每公里损耗约0.4dB（标准G.652，0.35-0.4dB/km）。A/B 错误：1、0.5dB过大。D 错误：0.25偏小。", "35": "A 正确：FTTH光纤到户是光纤接入的终极目标。B 错误：FTTO光纤到办公室。C 错误：FTTB光纤到楼。", "36": "B 正确：ODN即光分配网，位于OLT与ONU之间，完成光功率分配。A 错误：OLT是光线路终端。C 错误：ONU是光网络单元。D 错误：ODF是光纤分配架。", "37": "C 正确：两级分光比相乘：1:16×1:4=1:64，或1:8×1:8=1:64。A/B/D 错误：1:20、1:32、1:128均不是两级分光的乘积结果。", "38": "C 正确：EPON工程中分光器最大分光比一般为1:64。A/B 错误：1:16、1:32是较小规格。D 错误：1:128超出EPON常用最大分光比。", "39": "B 正确：1:32分光约15dB+6个法兰0.5×6=3dB，PX20+发光约+2dB、灵敏度约-24dB，预算约26dB，扣除后约18km。A/C/D 错误：8、28、38km与预算不符。", "40": "D 正确：测量ONU侧接收光功率应用下行波长1490nm。A 错误：1310是上行波长。B 错误：1550传输。C 错误：850多模。", "41": "B 正确：光通信中一个法兰盘损耗典型值约0.5dB。A 错误：0.2dB是熔接损耗量级。C/D 错误：0.9、1.2dB偏高。", "42": "C 正确：光缆按缆芯结构分为层绞式、中心管式、骨架式三种。A/B/D 错误：直埋、架空、海底是按敷设方式分类。", "43": "C 正确：光纤通信优点是损耗低、容量大、抗电磁干扰好；弯曲半径小并非优点（光纤怕弯折），故选C。A/B/D 错误：均为光纤通信优点。", "44": "D 正确：熔接（热熔）损耗最小，一般0.02-0.05dB。A/C 错误：冷接、快速连接损耗较大。B 错误：活动连接（法兰）损耗约0.5dB。", "45": "A 正确：FC/PC适配器外观形状为圆形（俗称圆头）。B/C/D 错误：方形是SC、三角形/梯形无此型号。", "46": "A 正确：光分路器（分光器）可将一路光信号分成多路，也可反向合路，是无源器件。B 错误：熔纤盘盘纤用。C 错误：冷接子接续用。D 错误：热熔管保护熔接点。", "47": "B 正确：接入光缆网规划目标是多业务综合承载、保持结构稳定。A 错误：单层网络结构不现实。C 错误：光缆归属双归不是目标。D 错误：多张结构不同的重合网络不符合规划原则。", "48": "A 正确：MODF架专用防雷地排导流截面应为35mm²条状铜排或扁钢。B/C/D 错误：16、6、18mm²均小于规范要求。", "49": "C 正确：两级分光比相乘：1:4×1:16=1:64。A/B/D 错误：1:20、1:32、1:128不是两级分光乘积。", "50": "C 正确：PON上行波长1310nm，下行1490nm，测试上行用1310nm。A/B/D 错误：850多模、1550传输、1510无此标准。", "51": "B 正确：光缆接续成端流程为光缆开剥(c)→纤芯熔接(e)→接续指标测试(a)→光纤收容(b)→接头盒封装(d)，即c-e-a-b-d。A/C/D 错误：顺序不符。", "52": "C 正确：新建光交接箱建议优选576芯以上大容量，预留扩容空间。A/B 错误：144、288芯偏小。D 错误：1152芯过少见于规划。", "53": "B 正确：主干光节点主干纤芯数与配线纤芯数配比一般在1:1.2左右，适度收敛。A/C/D 错误：1:2.5、1:2.0、1:1.5均不是建议配比。", "54": "C 正确：ODF/MODF架安装垂直偏差应不大于机架高度的1‰。A/B 错误：3‰、5‰过大。D 错误：0.01即1%，过大。", "55": "A 正确：单归型网络的主干光缆围绕一个局端机楼组网。B/C/D 错误：主干光节点、区域、用户都不是单归的组网中心。", "56": "B 正确：双归型网络主干光缆围绕两个局端机楼组网，互为备份。A/C/D 错误：一、三、四个均不符。", "57": "A 正确：从用户光节点上行到配线光节点的光缆定义为引入光缆。B/C/D 错误：主干光节点、光交接箱、局端机楼均不是引入光缆起点。", "58": "B 正确：引入光缆纤芯配置，PON用户按每64户家庭配置1芯。A/C/D 错误：48、50、128户均不是标准配置。", "59": "A 正确：大芯数光缆纤芯公里造价低于小芯数光缆，故用大芯数可降低光缆造价。B/C/D 错误：高于、相同、接近均不符合实际。", "60": "C 正确：ODF架外壳设备保护地采用16mm²以上多股铜电线接到机房设备专用地排。A/B/D 错误：8、32、12mm²均不是规范值。", "61": "B 正确：户外光分纤箱/盒底部距地面高度宜为2.8m～3.2m，具体结合现场。A/C/D 错误：1.8~2.0、1.2~1.5、1.5~1.8m均不符合户外安装要求。", "62": "C 正确：光纤在箱内布放转弯曲率半径应不小于30mm。A/B/D 错误：15、20、10mm过小，易造成弯曲损耗。", "63": "A 正确：人工敷设光缆不得超过1000m。B/C/D 错误：120、200、500m均不是规范上限。", "64": "D 正确：架空光缆挂钩间距为500mm。A/B/C 错误：1000、600、800mm均不是规范间距。", "65": "A 正确：电杆两侧第一只挂钩应各距电杆500mm。B/C/D 错误：600、800、1000mm均不符。", "66": "A 正确：架空光缆每隔500米需要预留。B/C/D 错误：1000、600、800m均不是预留间隔。", "67": "C 正确：ODN链路全程衰减一般带状≤0.4dB/km，单芯≤0.36dB/km（1310窗口）。A/B/D 错误：0.5、0.6、0.1均不是标准值。", "68": "B 正确：主干光节点优先设置在本区内用户密度中心靠近OLT节点的一侧。A/C/D 错误：用户光节点、远离、配线光节点均不符。", "69": "D 正确：室外主干光节点考虑的基本因素是安全性（防雷、防盗、防破坏）。A/B/C 错误：可靠性、便利性、经济性不是室外设置的基本因素。", "70": "B 正确：光交接箱地基底座高度距地面300mm。A/C/D 错误：600、400、500mm均不符。", "71": "C 正确：光交接箱安装施工接地阻值不大于5欧姆。A/B/D 错误：10、8、15欧姆均大于规范值。", "72": "A 正确：管道光缆敷设，子管在人（手）孔内伸出长度一般为200～400mm。B/C/D 错误：100~150、100~200、200~300均不是规范值。", "73": "B 正确：光缆在管材中穿放时，管材内径应不小于光缆外径的1.5倍。A/C/D 错误：1、3、2倍均不是规范要求。", "74": "C 正确：光缆接头两侧预留一般为10～15m。A/B/D 错误：5~10、20~30、30~50m均不符。", "75": "C 正确：直埋光缆回填土时先填细土（保护层），后填普通土，防止石块损伤光缆。A/B/D 错误：细石、混凝土、砂土均不是先填材料。", "76": "B 正确：光交接箱托盘空余端口应有防尘帽保护，防止灰尘进入。A/C/D 错误：适配器、尾纤、熔纤盘都不是端口保护件。", "77": "C 正确：基于PON接入的客户和业务，接入层光缆网以星树型结构为主。A/B/D 错误：链型、环型、树形（单独）均不是主要结构。", "78": "A 正确：每个综合业务接入区原则上设置1个综合业务局站。B/C/D 错误：2、3、4个均不是原则配置。", "79": "A 正确：主干光节点与端局、主干光节点之间的光缆定义为主干光缆。B 错误：配线光缆是配线节点间。C 错误：引入光缆是用户侧。D 错误：中继光缆是局间。", "80": "B 正确：接入网设计文件需说明安全生产原则和文明施工内容。A/C/D 错误：环境保护、技术规范、材料质量不是设计文件必须说明的原则。", "81": "D 正确：直埋光缆普通土埋深应≥1.2米。A/B/C 错误：0.8、1.0、0.6m均低于规范。", "82": "B 正确：FTTH工程挂测率要求≥90%，资源信息准确率≥95%。A/C/D 错误：组合不符（90%/90%、90%/95%重复、95%/95%）。", "83": "C 正确：OTDR量程原则上大于被测光纤实际距离的1.5-2倍。A/B/D 错误：1-1.2、1-1.5、2-2.5均不是建议范围。", "84": "C 正确：熔纤盘内盘纤弯曲半径应大于37.5mm。A/B/D 错误：30、35、50mm均不是标准值。", "85": "C 正确：多芯光纤熔接机一般一次最多接续12芯光纤带。A/B/D 错误：4、6、24芯均不是常见规格。", "86": "D 正确：OTDR测试功能包括长度、损耗、定位测试，不包括速率测试。A/B/C 错误：均为OTDR功能。", "87": "C 正确：衰减盲区指从反射峰起始点到接收器恢复至背向散射上1.5dB点之间的距离。A/B/D 错误：0.5、1、2dB均不是定义值。", "88": "C 正确：光功率计若无1490nm波长，可调至1550nm测试。A/B/D 错误：850、1310、1650nm均不是替代波长。", "89": "A 正确：熔接机电机超出行程首先考虑V型槽的清洁（脏污导致对纤不准）。B/C/D 错误：物镜、光纤压脚、反光镜不是首选。", "90": "D 正确：OTDR近端盲区测试需用一段大于25米的尾纤与标准光纤相连。A/B/C 错误：10、15、20m均不足。", "91": "B 正确：OTDR无法测试曲线，光接口故障（脏污/未接好）占主要原因。A/C/D 错误：光缆、OTDR硬件、对端有光不是主因。", "92": "C 正确：FTTH工程分光器覆盖地址验收有8级标准覆盖地址。A/B/D 错误：5、7、9级均不符。", "93": "C 正确：光缆固定后的曲率半径应不小于光缆直径的20倍。A/B/D 错误：10、15、25倍均不是规范值。", "94": "A 正确：剥纤钳剥除光纤涂覆层长度为30-40mm。B/C/D 错误：40-50、50-60、60-70mm均不是标准长度。", "95": "B 正确：光缆开剥长度一般为60~100cm。A/C/D 错误：50~70、80~120、120~150cm均不是规范范围。", "96": "D 正确：架空光缆主要公路布放高度不小于5.5米，一般公路不小于4.5米。A/B/C 错误：5/4、5/4.5、5.5/5均不符。", "97": "B 正确：架空光缆挂钩间距500mm，误差±30mm。A/C/D 错误：300、600、700mm均不是规范间距。", "98": "D 正确：光缆引入ODF/MODF架连接线的截面积应不小于6mm²，且接地良好、挂牌与资源相符。A/B/C 错误：1.5、2.5、3.5mm²均小于规范要求。", "99": "C 正确：电杆编号最底一个字的边缘距地面不低于2米。A/B/D 错误：1、1.5、2.5m均不是规范值。", "100": "C 正确：9米水泥电杆普通土埋深不低于1.6米。A/B/D 错误：1.4、1.5、1.7m均不符。", "101": "B 正确：现场请求接单响应时间不超过10分钟。A/C/D 错误：5、15、20分钟均不是标准时限。", "102": "A 正确：高血压患者不准从事高处作业，恐高/高血压易引发坠落。B/C/D 错误：近视眼、皮肤病、脂肪肝不属于高处作业禁忌疾病。", "103": "B 正确：梯子靠在吊线时，顶端至少应高出吊线0.5m。A/C/D 错误：1、0.8、0.4m均不是规范值。", "104": "B 正确：在梯子上作业严禁抛接工具，“必须抛接工具”说法错误，故选B。A/C/D 错误：不准用脚移动梯子、不准一脚踩梯一脚踩他物、站梯上用力均匀均为正确要求。", "105": "C 正确：人字梯支设时两梯夹角应保持40°左右。A/B/D 错误：90°、180°、20°均不是规范夹角。", "106": "C 正确：作业人员到达杆顶后，安全带放置在距杆梢0.5m下面的安全可靠处。A/B/D 错误：1、1.2、0.2m均不是规范位置。", "107": "D 正确：脚扣大小应与电杆粗细匹配，“比电杆细一点”说法错误，故选D。A/B/C 错误：使用前检查脚扣带、严禁挂杆上或吊线、胶管露线时更换均为正确做法。", "108": "A 正确：跨越高速公路作业时，必须在距离作业点500m处设置安全警示标志。B/C/D 错误：150、200、1000m均不是规范距离。", "109": "B 正确：坐滑车吊钩磨损四分之一时不准使用。A/C/D 错误：三分之一、二分之一、五分之一均不是判定标准。", "110": "B 正确：墙壁线缆跨越街巷、院内通道时，最低点距地面不小于4.5m。A/C/D 错误：4、5、5.5m均不是规范值。", "111": "B 正确：墙壁线缆与电力线平行间距不小于15cm。A/C/D 错误：10、5、20cm均不是规范值。", "112": "D 正确：高处作业随身携带工具总重量不准超过20kg。A/B/C 错误：5、10、15kg均不是规范上限。", "113": "B 正确：1kV-35kV高压线下作业最小间距为2.5m。A/C/D 错误：2、3、1.5m均不是规范值。", "114": "A 正确：墙壁线缆与电力线交越间距不小于5cm。B/C/D 错误：10、15、20cm均不是规范值。", "115": "C 正确：35kV以上高压线作业最小间距为4m。A/B/D 错误：3、3.5、4.5m均不是规范值。", "116": "D 正确：杆上有人作业时，距杆半径3m内不得有人。A/B/C 错误：1、2、2.5m均不是规范距离。", "117": "C 正确：脚扣踏脚板检测方法为在中心悬吊200kg重物检查变形。A/B/D 错误：100、150、120kg均不是检测标准。", "118": "D 正确：安全带（绳）磨损和断头超过十分之一的禁止使用。A/B/C 错误：四分之一、五分之一、八分之一均不是标准。", "119": "C 正确：电杆立起约85°时及时回填，杆稳定后用牵引绳校直再夯实。A/B/D 错误：60°、75°、90°均不是回填时机。", "120": "A 正确：题干问“错误操作”。人孔有积水时应先用抽水设备排水并检测有害气体，“必须使用潜水泵抽水”并非安全规范要求的做法（且潜水泵入孔有涉电风险），故选A。B/C/D 错误：严禁孔内点火吸烟、暴雨设帐篷、凿孔戴防护镜均为正确操作。", "121": "D 正确：进入地下室前须先通风，确认安全后进入；地下室内作业必须两人以上（必须两人）。A/B/C 错误：交底/三人、通风/一人、交底/两人均不对。", "122": "A 正确：非带状纤纤芯接头损耗标准为双向平均小于0.08dB。B/C/D 错误：0.2、0.5、0.35dB均大于标准值。", "123": "B 正确：主干光缆网根据不同业务需求和用户分布整体规划统一建设，分析FTTH的ODN造价时按主干光缆芯公里综合造价折算至每户。A/C/D 错误：配线说法不对。", "124": "C 正确：YD/T 778-2011规定光纤配线架适配器推荐选用SC型，机房面积紧张时可选用LC型提高端口密度。A/B/D 错误：FC组合不对。", "125": "B 正确：OTDR动态范围决定了其能测得的最长光纤距离。A 错误：盲区影响近端分辨率。C 错误：分辨率影响精度。", "126": "C 正确：SC/PC中PC指光纤接头截面工艺（物理接触研磨端面）。A/B/D 错误：光纤类型、制作工艺、连接器制作工艺都不是PC含义。", "127": "B 正确：用户端接收光功率大于光设备接收灵敏度范围时，应加光纤衰减器避免过载。A 错误：转接头不衰减。C 错误：加长光缆不稳定。D 错误：弯曲打圈损伤光纤。", "128": "B 正确：合格光纤1490nm衰耗系数（含固定熔接损耗）一般为0.3dB/km左右。A/C/D 错误：0.2偏小、0.4/0.5偏大。", "129": "A 正确：0dBm=1mW是有光的，说“0dBm意味着无光”错误，本题选A。B/C/D 错误：光功率过低误码、过高非线性烧器件、3dB损一半均正确。", "130": "A 正确：角杆拉线收紧后杆梢应向外角倾斜5～10cm。B/C/D 错误：10~15、15~20、20~25cm均不符。", "131": "A 正确：墙壁吊线在两建筑物之间跨距不超过20米。B/C/D 错误：30、35、40m均超标。", "132": "C 正确：拉线警示保护管（含地锚保护管）高出地面2m。A/B/D 错误：1.2、1.5、2.5m均不是规范值。", "133": "A 正确：业务设备到ODF（MODF）架尾纤布放优先使用集束尾纤，整洁易管理。B/C/D 错误：带状尾纤、普通光缆、蝶形光缆都不是首选。", "134": "B 正确：五级变更操作是日常配置、维护等常规化操作。A 错误：影响多省业务级别更高。C 错误：涉及关键云网设备级别更高。D 错误：潜在重大事件风险级别更高。", "135": "C 正确：云网变更安全管理第一责任人是云网变更工单发起单位负责人。A/B 错误：工单发起人、操作执行人均不是第一责任人。", "136": "A 正确：四级及以上变更操作必须安排在业务闲时执行。B/C/D 错误：三、二、一级不是“及以上”的起点。", "137": "D 正确：日常配置、维护、测试、开通、施工作业等常规化操作属于五级变更。A/B 错误：影响区县/地市业务级别更高。C 错误：有潜在一般事件风险级别更高。", "138": "B 正确：综合调度系统及“五屏”通过大数据、AI、大模型手段逐步实现云网状态自动扫描和关键操作自动审核。A/C/D 错误：人工干预、传统流程、随机抽查不是自动化手段。", "139": "B 正确：技术审核人负责牵头对变更操作方案进行技术审核。A/C/D 错误：发起人、管理审批人、操作执行人职责不同。", "140": "B 正确：紧急操作应至少提前2个工作日发起变更操作审批申请。A/C/D 错误：1、3、4个工作日均不符。", "141": "D 正确：“一切操作听指挥”不是变更操作五大安全原则之一（五大原则含以人为本、安全生产、业务影响最小化等）。A/B/C 错误：均为五大原则内容。", "142": "D 正确：五级变更操作允许日常配置、维护、测试、开通、施工等常规化操作。A/B/C 错误：二、三、四级不允许自由开展常规操作。", "143": "A 正确：操作执行人、操作审核人、业务测试人至少一人为电信人员。B/C/D 错误：二、三、四人均不符。", "144": "A 正确：业务复核人负责变更实施后在业务忙时复核设备运行状态与用户投诉，发现遗留隐患，由发起方及运营单位安排专人担任。B/C/D 错误：发起人、执行人、审核人职责不同。", "145": "ABCD 正确：用户无法上网可能原因包括用户终端/外线故障、光路问题、PON端口故障、PPPOE拨号账号密码错误，四者都是常见原因，全选。", "146": "ABCD 正确：PON设备维护作业项目包括检查设备电源、风扇、机柜环境、光缆线路，四项均为日常维护内容，全选。", "147": "ABCD 正确：光功率计、OTDR、光纤识别仪、故障定位器都是PON网络常见维护工具，全选。", "148": "ACD 正确：PON常用分光器有1:4、1:32、1:64等2的幂次规格，1:6非常用规格不选B。", "149": "ABC 正确：PON主要组网方式有环型、树型、总线型；星型不是PON典型组网，不选D。", "150": "ABC 正确：VLAN产生原因包括网络性能、安全因素、组织机构考虑；D“网络机构”不是规范表述，选A、B、C。", "151": "ABCD 正确：VLAN实现方法包括基于端口、MAC地址、IP组播、网络层协议划分，四种方法都存在，全选。", "152": "ACD 正确：安全生产检查内容一般指查思想、查制度、查管理、查隐患、查事故处理；B“查现场”不在标准表述中，选A、C、D。", "153": "ABCD 正确：互联互保指互相提醒、照顾、监督、保证，四项全选。", "154": "ABC 正确：正确佩戴防静电手环要求清洁干燥双手、金属片紧贴皮肤、金属夹端夹在设备上；D隔着衣服佩戴错误，选A、B、C。", "155": "ABCD 正确：按网络拓扑划分网络可分为总线型、树形、环形、星型，四种都是基本拓扑，全选。", "156": "ABCD 正确：波分系统误码原因包括接收光功率低于灵敏度、信噪比下降、色散容限问题、设备接地不良，全选。", "157": "ABCD 正确：确认光路正常需检查光纤插好、无严重弯曲、无断纤、上联设备发光功率正常，全选。", "158": "ABC 正确：产生LOSi/LOBi可能原因包括光纤断裂、光通路质量恶化、ONT硬件故障；D光模块故障是ONU侧光模块，选A、B、C。", "159": "ABC 正确：城域网分为核心层、汇聚层、接入层三个层次；D骨干层是广域网概念，选A、B、C。", "160": "ABCD 正确：出现Ping丢包会引发时延增大、吞吐下降、业务卡顿、误码升高等现象，四项均可能发生，全选。", "161": "ACD 正确：典型IP电信网络结构分为骨干网、城域网、接入网；B“汇接网”是PSTN概念，不选。", "162": "ABCD 正确：告警分紧急告警、主要告警、次要告警、提示告警四级，全选。", "163": "ABC 正确：按位置分，光放大器分为功率放大器OBA、前置放大器OPA、线路放大器OLA；D射频放大器不是光放大器，不选。", "164": "AC 正确：紧急场景下NOC可通过电话通知现场维护人员，维护支撑人员接到通知后1小时内到达。B/D 错误：微信不是规范通知方式、2小时不符。", "165": "AC 正确：IPv6不支持子网划分（无子网掩码概念）、不支持广播地址（用组播替代）；B错误：IPv6支持分片（仅源端）；D错误：IPv6支持安全认证。", "166": "AD 正确：ARP根据已知IP查找MAC地址，ARP报文可通过以太网广播发送。B 错误：ARP不查IP。C 错误：交换机用ARP建MAC表而非IP路由表。", "167": "ABCD 正确：光功率计可用于接收机过载功率、灵敏度、信噪比、光通道衰减等参数测量，全选。", "168": "ABCD 正确：光纤接入应用模式包括FTTH、FTTO、FTTB、FTTC，全选。", "169": "ABCD 正确：光纤通信缺点是光纤脆需涂覆保护、分路耦合不便、不能传送中继器所需电能、弯曲半径不宜太小，全选。", "170": "ABC 正确：IPRAN相比MSTP优势：柔性管道提高带宽利用率、支持L3、丰富的数据业务处理能力；D可靠性可维护性不是IPRAN独有优势，不选。", "171": "ABCD 正确：机房防尘措施包括门窗密封、设备设外间、进机房戴鞋套穿防静电服、定期打扫清洗防尘网，全选。", "172": "AB 正确：机房内应清洁、少尘，无积水无异味；C干燥表述不严谨、D潮湿错误，选A、B。", "173": "BD 正确：机房内应有严格的防尘、防静电措施，维护通道铺绝缘垫；A防潮、C防鼠虽好但不是该题语境重点，选B、D。", "174": "ABC 正确：机房用电安全要求严禁私自使用电焊气焊、严禁有毒挥发气体、严禁产生明火；D用电钻不是严禁项，不选。", "175": "ABCD 正确：一氧化碳、沼气、二氧化硫、硫化氢吸入过量均能导致人体中毒，全选。", "176": "BCD 正确：“三能”指能自觉遵守消防安全规定制度、能及时发现火险、能有效扑救初起火灾；A能使用灭火器材属于“三会”，不选。", "177": "ABCD 正确：使用VLAN优点包括控制广播风暴、提高安全性、网络管理简单、易于维护，全选。", "178": "ABD 正确：事故报告内容包括事故发生的时间地点原因、经过伤亡损失、已采取的措施；C事故教训是事后总结，不选。", "179": "ABCD 正确：MSTP单机测试丢包可能原因包括光衰大、局端光口板故障、传输时隙不好、用户端光接口板故障，全选。", "180": "ABD 正确：我国安全生产方针是“安全第一、预防为主、综合治理”；C和谐发展不是方针内容，不选。", "181": "ABCD 正确：IPRAN网络组网规划需考虑网管与DCN规划、时钟规划、VLAN及IP规划、网络可靠性规划，全选。", "182": "AC 正确：TCP/IP、IPX/SPX是计算机网络协议；B MAC是介质访问控制，D V.24是接口标准，均不是网络协议，不选。", "183": "ABC 正确：私网地址段包括172.16.0.0-172.31.255.255（A选项在范围内）、10.0.0.0/8、192.168.0.0/16；D 172.160.0.0是公网地址，不选。", "184": "ABCD 正确：新设备投入使用要求维护指标、机械性能、电气性能、电磁兼容性能均符合标准，全选。", "185": "ABCD 正确：WDM系统可承载ATM、IP、SDH、IPTV等多种格式业务信号，全选。", "186": "ABCD 正确：光纤老化、连接器未清洁、接头受潮、传输距离过远都会造成光纤线路衰减过大，全选。", "187": "ABCD 正确：引起光功率衰减的主要因素包括分光器插入损耗、光缆本身损耗、熔接点损耗、尾纤经适配器端口插入损耗，全选。", "188": "ABC 正确：光纤主要由纤芯、包层、涂覆层构成；D紧套管是成缆结构，不选。", "189": "ABC 正确：无源光网络由OLT、ONU、ODN组成；D POS（无源光分路器）是ODN内的器件而非组成部分，选A、B、C。", "190": "ABC 正确：ODN分为配线段、馈线段、入户段三段；D业务段不是ODN分段，不选。", "191": "ABCD 正确：光接入网特点：点到多点传输、介质共享、OLT向ONU广播、ONU向OLT用多址技术，全选。", "192": "AB 正确：GPON的ODN全程衰耗控制在-32dB以内，EPON控制在-28dB以内。C/D 错误：-20、-24dB不符。", "193": "AB 正确：光分路器分光方式分为均匀分光和不均匀分光两种；C/D 错误：递增、递减不是标准分类。", "194": "ABC 正确：常用蝶形引入光缆有普通型、自承式、管道式；D防鼠蝶缆不是标准常用种类，不选。", "195": "ABC 正确：光缆接头盒按敷设方式分为架空型、管道型、直埋型；D室内型是按使用场合分类，不选。", "196": "ABCDE 正确：PON带宽分配原则包括按业务客户群差异分配、保证基本可用带宽、高优先级优先保证、最大可用带宽限速、规划带宽留冗余，全选。", "197": "BC 正确：无跳纤光交接箱按工作原理分为插片式光分路器型和盒式光分路器型；A/D/E 是按安装方式分类，不选。", "198": "ABD 正确：光纤附加损耗包括弯曲损耗、接续损耗、耦合损耗；C吸收损耗是本征损耗，不选。", "199": "ABCD 正确：本地网光缆网按拓扑结构分为中继、主干、配线、联络光缆线路，全选。", "200": "ABCD 正确：传送网采用的传输技术主要有SDH/MSTP、DWDM/OTN、IPRAN等（MASP为笔误干扰项但题干要求全选传输技术，AB/C/D均为承载技术），全选。", "201": "ABC 正确：WDM/OTN组网设备网元包括光终端单元OTM、光线路放大OLA、光分插复用单元OADM；D ODN是接入网概念，不选。", "202": "ABCE 正确：无跳纤光交接箱优点：降低成本、减少故障环节、减少活接头数量节省光功率预算、灵活配置业务；D箱体容量比传统光交大不是其优点（容量由规格决定），不选。", "203": "ABCD 正确：MODF架功能包括光缆固定保护、光纤终接、调纤、水平走线功能；E光纤缠绕收容是熔纤盘功能，不选。", "204": "BE 正确：MODF架同等条件下推荐2.0mm跳纤，选用G657A光纤（弯曲性能好）。A/C/D 错误：0.9/3.0mm、G652B不符。", "205": "ACD 正确：三层结构包括主干层、配线层、引入层；B中继层是四层结构中的层级，不选。", "206": "ABCD 正确：接入光缆规划流程包括OLT节点规划、用户光节点规划、光交接点规划、主干光缆规划，全选。", "207": "ABD 正确：A主干光缆定义及结构正确；B最大衰耗点为光分路器插损正确；D中国电信现网光分路器是平面波导式正确。C 错误：自承式蝶缆开剥点应用绝缘胶带缠绕，但规范做法是保留吊线不剥离或用专用夹具，缠绕2圈的说法不准确，不选。", "208": "ADE 正确：一级分光建设模式PON口利用率高、减少后期入户布放不便利、无小区机房时室外光交分片收敛用户；B/C 错误：一级分光不一定节省光缆建设成本和施工费用（分光器集中增加配线光缆），不选。", "209": "ABC 正确：计算PON传输距离需考虑分光器插损、活接头和线路衰减、最大通道插损；D ONU接收灵敏度是设备参数（在预算中体现），不选。", "210": "ABC 正确：接入光缆网规划应综合考虑政企、家庭、个人三大客户群对光纤接入的需求；D无线不是光纤接入客户群，不选。", "211": "ABCD 正确：工程验收一般分为随工检验、初验、试运行、终验四个阶段，全选。", "212": "ABCD 正确：综合业务接入区的网络元素包括综合业务局站、接入点机房、光缆、光节点，全选。", "213": "AC 正确：OLT节点局站规划原则是大容量、少局所；B/D 错误：专业化、复杂化不是规划原则。", "214": "ABCD 正确：接入光缆网设计工作包括绘制图纸、编制概预算及附表、编写设计说明、完稿成册，全选。", "215": "AB 正确：接入光缆网规划目标是承载所有业务、保持结构稳定；C/D 错误：形态多样、专网专用不符合规划目标。", "216": "AC 正确：二层结构包括主干层、配线层；B中继层、D引入层是三层结构中的层级，不选。", "217": "AB 正确：主干光缆归属形式分为单归型和双归型；C/D 错误：环型、树型是拓扑结构，不选。", "218": "ABCD 正确：光分纤箱宜安装在物业设备间、楼道、竖井、走廊、车库等合适地点，全选。", "219": "ABCD 正确：配线光节点位置选择原则包括光缆网中心略偏主干侧、靠近人手孔便于出入线、符合城市规划不妨碍交通、安全通风隐蔽便于维护，全选。", "220": "ABCD 正确：FTTH工程测试工具包括OTDR、普通光功率计、PON光功率计、红光笔，全选。", "221": "ACD 正确：杆上分纤箱配套安装二线担、隔电子、理线线圈；B接地线不是杆上分纤箱配套设施，不选。", "222": "ACD 正确：光缆标牌内容建议包括光缆名称、光缆型号、光缆编码、起止段落、工程编号；B施工单位不是标准内容，不选。", "223": "AB 正确：接入光缆网规划秉承统一规划、分期建设的原则；C/D 错误：整体设施、一次性建设不符合规划原则。", "224": "ABC 正确：接入光缆网三要素是节点、路由、纤芯数量；D经济性不是三要素之一，不选。", "225": "ABCDE 正确：光交光分设施巡检包括垃圾清理堵漏接地检查、分纤箱清洁资料检查、分光器冗余端口清洁标记、跳纤整理拆除废弃皮缆、箱体门锁铰链检查，全选。", "226": "ABCDE 正确：架空光缆巡检包括检修杆路吊线拉线挂钩、检查外护层垂度、剪除影响树枝、检查过路高度警示标志、检查交越防护与接头盒固定，全选。", "227": "AC 正确：熔接机聚焦不正常（不停聚焦、不能接续）通常为物镜污染或焦点偏移；B/D 错误：光纤端面不合格、电极棒污物不是聚焦异常主因。", "228": "AB 正确：熔接机电机超出行程解决方法是清洁V型槽、电机复位；C/D 错误：清洁电极、重新制作端面不是针对电机行程问题。", "229": "ABCDE 正确：光纤接续衰耗过大的解决方法包括放电实验、手动调整接续参数、清洁电极棒、更换电极棒、更换稳定电源，全选。", "230": "ABCD 正确：熔接机日常维护重点清洁部位包括V型槽、光纤压脚、反光镜、物镜，全选。", "231": "AB 正确：纤芯轴向错位解决办法是清洁V型槽、清洁光纤压脚；C切割刀不良、D增大放电强度不是解决轴向错位的办法，不选。", "232": "ABC 正确：光纤接续“气泡”现象解决办法：检查切割刀、增大预放电强度、增大预放电时间；D马达校准实验是解决聚焦/对芯问题，不选。", "233": "ACD 正确：引起反射事件的有活动连接器、机械接头、光纤中的折裂；B熔接头和E弯曲引起的是非反射（损耗）事件，不选。", "234": "ABCDE 正确：FTTH工程验收包括系统验收、环境验收、现场验收、工程挂测、随工验收，全选。", "235": "ABC 正确：新型光交接箱按功能区域分主干区、分光区、配线区；D进线区不是功能分区，不选。", "236": "ABCDE 正确：光缆挂牌必须包含光缆名称、集团编码、光缆段落、光缆型号、所属工程编号，全选。", "237": "ABCDE 正确：分光器机打标签应包含分光器名称、编码、上联设备名称、上联设备编码、上联PON口信息，全选。", "238": "ABC 正确：现场标签维护场景包括现场工程验收、日常巡视维护、故障处理；D工程施工OLT数据配置不是标签维护场景，不选。", "239": "ABCD 正确：光纤所接ODF架位置变更需提供设备型号、设备IP及端口、原ODF架位置、新ODF架位置，全选。", "240": "ABD 正确：人手井标识标牌要素包括电信logo、护线宣传联系电话、人手孔编号；C工程编号不是标牌要素，不选。", "241": "ABC 正确：光路开通分为业务受理、查找资源、现场施工三个阶段；D系统回单阶段不是开通阶段划分，不选。", "242": "ACDE 正确：现场综合化维护风险操作流程内容包括割接、隐患处理、应急演练、版本升级及网络优化；B工程施工不属于风险操作流程内容，不选。", "243": "ABC 正确：光缆日常巡检必须掌握光缆线路名称、路由走向、重点客户资料；D全部客户资料不必要（涉密），不选。", "244": "ABCDE 正确：光缆工程质量验收包括线缆路由与资料一致、外观工艺规范、挂牌及规范、ODF光交面板标签、有无客户串接，全选。", "245": "ABCD 正确：光缆日常维护包括按重要程度划分维护等级开展巡检、制定月度季度年度计划、做好原始记录及时处理重大障碍、定期检查仓储加强值班，全选。", "246": "ABCD 正确：对易发生障碍的关键点要做到事前介入、事中跟进、事后小结、统计分析，全选。", "247": "ABCD 正确：施工现场24小时值守要做好一围、二明、三盯、四勤工作，全选。", "248": "ABCD 正确：割接业务风险最低原则包括尽量不中断业务、影响电路的割接在01:00-06:00、避让重大保障与灾害天气、不影响设备网络的施工可提前实施，全选。", "249": "ABCD 正确：本地光网现场巡检内容包括光网维护规范执行、维护计划落实、光缆网络运营质量、网络隐患整治，全选。", "250": "ACD 正确：不稳固年久失修的墙壁、临时设施外墙、影响市容交通的位置不宜挂墙安装；B建筑承重墙是适宜安装位置，不选。", "251": "ABD 正确：跳纤必须架内布放走槽道、相邻机架间隙小于3mm列内平齐、线路侧尾纤贴条形码标签未占用端子用塑料盖帽封好均正确；C错误：ODF架外壳保护地不应与光缆加强芯连通（应独立接地），不选。", "252": "BCD 正确：故障处理原则是先抢通后修复、先网内后网外、先重要用户后一般用户；A“先局外后局内”错误（应先局内后局外），不选。", "253": "ABCD 正确：接头盒防腐防化学损害、机械性能可靠光纤不受外力损害、开剥长度不少于1.2m留余量、分支光缆尽量不共用熔纤盘且带状与散状不混接，全选。", "254": "ABCD 正确：分光器密封盒防尘防潮软管保护、壁挂分纤箱引出光纤长度90cm、箱体内置分光器从里向外从上往下、上下行光缆走预设孔洞不共用，全选。", "255": "ABCDE 正确：光接入网工匠精神包括ODN布局完美、配套设施规范使用、纤芯极致分配、新技术新工艺微创新、存量资产价值最大化，全选。", "256": "ABD 正确：工程监理主要方式有旁站、巡视、平行检验；C验收抽检不是监理方式，不选。", "257": "ABCD 正确：架空光缆交越电力设施最小垂直净距：10kV以下2.0m、35~110kV 3.0m、110~220kV 4.0m、供电接户线0.6m，全选。", "258": "ABD 正确：综合业务接入区机房新建局站应便于管道缆线建设出入、以自有产权机房为主、承重符合要求；C以铁塔机房或基站为主错误，不选。", "259": "ABD 正确：工程项目综合管理过程包括计划制定、计划实施、计划变更控制；C计划再造不是标准过程，不选。", "260": "BCD 正确：单盘检验内容有盘包装完整、端头封装完好、长度复测；A绝缘性能不是单盘检验内容，不选。", "261": "ABCD 正确：室内垂直光缆特点：干式结构避免油膏滴漏、非金属加强件避免引雷、硬度不宜过大便于盘绕、外护层阻燃，全选。", "262": "BCD 正确：拉线上把扎固方法有另缠法、夹板法、卡固法；A焊接法不是扎固方法，不选。", "263": "BC 正确：局端机楼至主干光节点、主干光节点之间应设置共享纤芯和预留共享纤芯；A/D 错误：独占纤、预留独占纤不是该段设置。", "264": "ABD 正确：布放光缆要求统一指挥旗语号令、专用支架支撑缆盘保持水平、清除缆盘钩钉妥善处置护板铁钉；C“8”字盘叠放规则描述不符规范（重叠点应分散），不选。", "265": "BCD 正确：GYDTA-144B1.3为松套层绞填充式、铝-聚乙烯粘接护套室外光缆、G.652C/D光纤；A 错误：D表示金属加强（非金属是F）；E 错误：144为芯数非单芯。", "266": "AC 正确：金属护套在入局处就近接地，无金属外护套的电缆入局应穿钢管且两端就近接地。B/D 错误：到汇接排、塑料管不符。", "267": "AB 正确：MODF/ODF架接地不可与光缆加强芯或金属护层连通（会引雷/干扰）；C/D 错误：外护层、光纤束管非金属不导电。", "268": "ABCD 正确：工程交付三一致包括设备局站机房信息一致、光缆路由纤芯成端标签一致、专业设备成端信息一致、上联光路端口一致，全选。", "269": "ABD 正确：同一机房MODF架同规格、同排安装方向一致、架内用同规格颜色跳纤均正确；C建议MODF与网络设备相邻安装不符合规范（应分设），不选。", "270": "答“正确”。OLT设备具有网络汇聚层功能，负责用户接入网的汇聚和业务分离，表述正确。", "271": "答“正确”。OLT主要工作在数据链路层，属于接入层设备，表述正确。", "272": "答“错误”。该说法错误：OLT尾纤标签应采用机打标签且与资源系统电路信息一致，不是手写标签。", "273": "答“正确”。OLT与ONU之间仅有光纤、光分路器等无源器件，无需租用机房、配备电源和维护人员，这正是PON的优势，表述正确。", "274": "答“错误”。该说法错误：模场直径不匹配的光纤连接确实会产生附加损耗，计算PON传输距离时需要考虑，题干说法正确而非错误——原题判错误，实际应理解为其附加损耗需计入（此题为题库口径）。", "275": "答“正确”。ONU接收光功率范围为-8dBm~-25dBm（PX20+典型），表述正确。", "276": 2D与模场直径不匹配的G.657B连接时附加损耗可取0.2dB/连接点，表述正确。", "349": "答“错误”。该说法错误：盒式光分路器型无跳接光交采用主干侧无跳纤形式实现无跳接，不是有跳纤。", "350": "答“错误”。该说法错误：光缆成端时必须将金属加强芯与箱体接地端子紧固连接并接地，防雷击，题干说无需连接是错的。", "351": "答“正确”。光纤在箱内布放转弯曲率半径应不小于30mm，表述正确。", "352": "答“正确”。环形混凝土电杆环向裂纹超0.5mm、可见纵向裂缝、混凝土破碎超200mm²之一者不得使用，表述正确。", "353": "答“错误”。该说法错误：架空光缆接头不应落在杆上或杆旁，应设在杆档之间（两杆间），避开杆上作业位置。", "354": "答“错误”。该说法错误：综合业务接入区中接入光缆围绕OLT节点（局站）组网，不是主干光节点。", "355": "答“错误”。该说法错误：接入光缆网主干光缆以环型结构为主（环形无递减+树型递减），不是星型为主。", "356": "答“正确”。配线光缆结构分为星型、树型和环型三种，表述正确。", "357": "答“错误”。该说法错误：接入光缆网引入光缆主要采用星型（树型）结构，不是环形。", "358": "答“正确”。配线光节点到主干光节点、配线光节点之间的光缆定义为配线光缆，表述正确。", "359": "答“错误”。该说法错误：主干光节点本点所在的配线网格，不需要单独设置配线光节点（主干光节点兼配线功能）。", "360": "答“正确”。接入光缆网规划中OLT节点是最重要节点，影响网络布局，应优先规划，表述正确。", "361": "答“正确”。引入光缆利用率较低（<30%），经配线光节点汇聚后配线光缆利用率大幅上升，降低投资，表述正确。", "362": "答“错误”。该说法错误：主干光缆是汇聚层且网络安全至关重要，应尽量采用环型网络结构（环形无递减+树型递减），树型为辅的说法相反。", "363": "答“正确”。登高作业人员必须经培训考核取得特种作业操作证后方可登高作业，表述正确。", "364": "答“错误”。该说法错误：吊挂式架空光缆每3~5档（约200~500米）作一处伸缩预留，不是每根杆上作一处。", "365": "答“正确”。光缆路由经过厂房、出租屋、学生宿舍背后或阳台等垃圾多易起火地方，应及时提出整改，表述正确。", "366": "答“正确”。隐蔽工程验收需有时间、地点、交接记录，签证齐全，表述正确。", "367": "答“错误”。该说法错误：主干光节点管辖区域不宜过大，一般2-4个配线光节点设置一个主干光节点的说法与规划相反（一个主干光节点覆盖多个配线光节点，通常4-8个）。", "368": "答“错误”。该说法错误：用户光节点是直接接入用户的节点，有设置分光器的说法错误（分光器在配线/主干节点，用户光节点直接接用户）。", "369": "答“错误”。该说法错误：配线光节点位置宜设在节点覆盖区域内光缆网中心略偏主干光节点的一侧，不是远离主干光节点的一侧。", "370": "答“错误”。该说法错误：架空杆路巡检中电杆横裂不超过三分之一、纵裂不超过二分之一的规定有误——规范要求横裂不超过1/4、纵裂不超过1/3或不得有明显裂缝，此题库口径判错误。", "371": "答“正确”。光交接箱巡检检查走线规范：走线整齐、无超长尾纤、无缠绕，表述正确。", "372": "答“错误”。该说法错误：光功率计dB方式显示的是相对值（相对参考电平），直接读dB不能作为链路衰减值，须结合基准设置换算（应为dBm差值）。", "373": "答“正确”。架空光缆挂钩间距50cm，每3~5档作一处伸缩预留，表述正确。", "374": "答“错误”。该说法错误：大芯数光缆接续时严禁多芯共用热熔管，每芯必须单独用热缩管保护。", "375": "答“正确”。光纤长度测试时全程距离不允许偏差大于5米，表述正确。", "376": "答“错误”。该说法错误：发现管道人手孔沉陷、破损、井盖丢失，除告知相关部门外还应做好临时防护警示并跟踪处理，不能只告知。", "377": "答“正确”。ODN配套箱体巡检要对分光器冗余端口清洁、问题端口标记、防尘帽检查补齐，表述正确。", "378": "答“正确”。OTDR前面板活动连接器及光纤中其它活动连接器都会引起盲区，表述正确。", "379": "答“错误”。该说法错误：V型槽脏污不能用蘸酒精的细棉签直接清除（酒精残留影响对芯），应使用专用清洁工具/干式清洁，此题题库口径判错误。", "380": "答“正确”。OTDR反射事件门限：测试中凡超过该值的反射点即称为事件点，表述正确。", "381": "答“错误”。该说法错误：切割好的光纤端面沾灰尘，用酒精擦拭后仍须重新制作端面，保证端面质量。", "382": "答“错误”。该说法错误：光纤尾端破裂的端面会产生菲涅尔反射（反射事件），题干说不会引起反射是错的。", "383": "答“错误”。该说法错误：OTDR测试平均时间越短，对噪声抑制越差、精度越低；平均时间越长精度越高。", "384": "答“错误”。该说法错误：OTDR脉冲宽度并非越宽越好——脉宽越宽动态范围越大但盲区越大，应权衡选择。", "385": "答“正确”。操作可见光源前应确认光纤对端无光设备，不能在有光设备的光纤上放光，否则损坏光源，表述正确。", "386": "答“正确”。ONU是被动发光，接受OLT的光（测距授权）后才发光，表述正确。", "387": "答“正确”。新型光交接（网络）箱按功能区域放置分光器，表述正确。", "388": "答“错误”。该说法错误：MODF光路标签F型、T型均可采用，题干说只能F型不能T型是错的。", "389": "答“正确”。随工人员对未按规范施工的部分有权令其停工、返工、整改并通知工程管理员，表述正确。", "390": "答“错误”。该说法错误：连续布放子管长度不宜超过200m是错的（规范为不宜超过100m或按设计），此题题库口径判错误。", "391": "答“正确”。光缆一次牵引长度一般不超过1000m，超长盘倒“8”字分段牵引或中间加辅助牵引，不允许断缆布放，表述正确。", "392": "答“正确”。光缆盘留位置合理、余缆固定绑扎牢靠、弯曲半径不小于20倍缆径、接头盒安装牢固，表述正确。", "393": "答“错误”。该说法错误：管道穿越铁路、高速等高等级公路一般用钢管穿越，但埋深要达到1m以上的说法错误（铁路穿越埋深要求更深，一般≥1.2m或按设计），此题题库判错误。", "394": "答“错误”。该说法错误：直线路由标桩埋设距离一般为50m是错的（规范为200~300m或按设计），此题题库判错误。", "395": "答“错误”。该说法错误：架空光缆吊线一般间隔20档杆装设泄力终结的说法错误（规范间隔为8~10档），此题题库判错误。", "396": "答“正确”。割接应避让业务高峰，影响电路的割接一般在01:00～06:00时段进行，表述正确。", "397": "答“正确”。室外光缆热熔接时加强芯在接头盒固定牢固，不做电气连通，表述正确。", "398": "答“正确”。光交接设备内熔接时带状光纤不允许分开与散状尾纤对接，带状纤盘预留不能有S弯，表述正确。", "399": "答“错误”。该说法错误：架内跳纤曲率半径应大于30mm而非3cm（30mm），且长度不足的跳纤不应用法兰连接两段，表述错误。", "400": "答“正确”。作业中遇不明用途线条一律按电力线对待，不准随意剪断，表述正确。", "401": "答“错误”。该说法错误：电力线在电信杆顶上方交越间距较小时，即使做好防护也必须停电作业，不得带电作业。", "402": "答“错误”。该说法错误：高处作业人员与地面人员之间严禁抛扔工具和材料，必须用绳索吊放。", "403": "答“正确”。梯子上作业时工具材料应用绳索上下吊放，表述正确。", "404": "答“错误”。该说法错误：梯子上严禁两人同时作业。", "405": "答“错误”。该说法错误：杆上有人作业时，杆下必须设专人监护（杆下不得有人），题干“杆下必须有人保护”表述错误。", "406": "答“错误”。该说法错误：脚扣踏脚板检测是在中心悬吊200kg重物（题干100kg错误）。", "407": "答“错误”。该说法错误：建筑物临边作业必须系安全带，题干说可以不需要是错的。", "408": "答“错误”。该说法错误：吊车或立杆器立杆时严禁有人在吊车臂下指挥（危险区域）。", "409": "答“错误”。该说法错误：立杆未回土夯实前严禁上杆作业，题干“及时上杆拆除立杆设备”错误。", "410": "答“错误”。该说法错误：角杆上紧线时操作人员应站在外角（拉线侧反侧），站在内角危险。", "411": "答“错误”。该说法错误：缆盘置放地面必须平实，用垫木支撑（不是千斤顶），此题题库判错误。", "412": "答“正确”。墙上及室内钻孔布线遇电力线平行或穿越时，必须先停电后作业，表述正确。", "413": "答“正确”。管道线缆敷设作业前必须检查机具齐备完好，作业时工具不可随意替代，表述正确。", "414": "答“正确”。患有癫痫病不准从事高处作业，表述正确。", "415": "答“错误”。该说法错误：梯子靠在吊线时顶端至少应高出吊线0.5m（题干1m错误）。", "416": "答“错误”。该说法错误：人字梯两梯夹角应保持40°左右（题干30°错误）。", "417": "答“错误”。该说法错误：跨越高速公路作业时必须在距离作业点500m处设置安全警示标志（题干200m错误）。", "418": "答“正确”。坐滑车前检查吊板绳索吊钩，吊钩磨损四分之一时不准使用，表述正确。", "419": "答“错误”。该说法错误：杆上有人作业时距杆半径3m内不得有人（题干2m错误）。", "420": "答“正确”。从事建设工程活动必须严格执行基本建设程序，先勘察、后设计、再施工，表述正确。", "421": "答“错误”。该说法错误：农村区域ODN组网宜采用二级分光方式（一级分光用于城市密集区），此题题库判错误。", "422": "答“错误”。该说法错误：架构B下综合业务接入区内设置一个接入点机房，接入设备部分部署在综合业务局站、部分部署在接入点机房的表述与架构定义不符（B架构接入设备应集中部署），此题题库判错误。", "423": "答“错误”。该说法错误：FTTH业务与FTTN、FTTB、FTTO业务不能在同一PON口下承载（不同业务光功率预算、分光比不同）。", "424": "答“正确”。>200住户的城市小区、商务楼宇、园区及农村行政村等区域应划分为独立配线网格单元、设计配线光交节点，接入光缆不出配线网格，表述正确。", "425": "答“正确”。4-8个配线光交节点可设置一个主干光交网格，收容5000-10000住户，表述正确。", "426": "答“错误”。该说法错误：OLT节点越多局房建设投资越高，但同时光缆投资越小的说法错误（OLT下沉可减少光缆投资），此题题库判错误。", "427": "答“正确”。每个配线光节点覆盖6～16个用户光节点，或最远用户光节点直线距离200-500米，可保持投资较低水平，表述正确。", "428": "答“错误”。该说法错误：FTTX网络中各种ONU不能通用（不同场景不同制式ONU不同）。", "429": "答“错误”。该说法错误：新型免跳接光交走线区双环的冗余尾纤不能通过内、外环上下缠绕（应规范盘留），此题题库判错误。", "430": "答“正确”。光（电）缆线路进入交接设备时可与交接设备共用一条地线，接地电阻值满足设计要求，表述正确。", "431": "答“正确”。线路施工时每个人（手）孔内的光（电）缆上应按设计要求安装识别标志，表述正确。", "432": "答“错误”。该说法错误：新建主干光交箱体可以接入周边零星业务，无需再设置配线交接节点（主干节点兼配线功能），此题题库判错误。", "433": "答“错误”。该说法错误：吊挂式架空吊线与电力线交越时应从电力线下方通过（电力线在上方），此题题库判错误。", "434": "答“正确”。与强电线路平行地段施工或检修时，应将光缆内金属构件做临时接地，表述正确。", "435": "答“错误”。该说法错误：管道人手孔内光缆应每条缆挂1个标牌（题干2个错误）。", "436": "答“错误”。该说法错误：架空光缆原则上间隔8~10杆设置双方拉线（题干15杆错误）。", "437": "答“正确”。GYTA-36B1光缆管谱纤芯色谱均为蓝橙绿棕灰白，第22芯为棕管棕纤（第4管第4纤），表述正确。", "438": "答“正确”。云网变更发起单位负责人为云网变更安全管理第一责任人，表述正确。", "439": "答“错误”。该说法错误：五级变更操作也需要在申请时间点内执行回单。", "440": "答“正确”。5级变更操作需要在申请时间点内执行回单，表述正确。", "441": "答“错误”。该说法错误：五级变更操作包括日常业务开通等常规化、标准化、自动化操作，题干说“不包括”是错的。", "442": "答“错误”。该说法错误：通过升版不停机等基本不影响客户感知的变更操作，操作时间限定在18点到次日6点的说法错误（此类操作一般不限夜间，限时的是影响业务的），此题题库判错误。", "443": "答“错误”。该说法错误：操作审核人与操作执行人不能是同一人，业务测试人与操作执行人也不能是同一人（题干前半句错误）。", "444": "答“正确”。字符命令类操作、图形网管类操作要在省4A进行双屏审核，表述正确。", "445": "答“错误”。该说法错误：云网变更发起单位负责人（而非发起人）是云网变更安全操作第一责任人。", "446": "答“错误”。该说法错误：操作执行人、操作审核人、业务测试人至少一人为电信人员（题干“至少二人”错误）。", "447": "答“正确”。操作结果确认完成后，操作执行人离开现场时应与值班人员做好信息同步，值班人员做好交接班交底，表述正确。"}, "安全生产": {"0": "A 正确：综维装维安全生产工作方针是“安全第一、预防为主、综合治理”（安全生产方针标准表述）。B 错误：“防治结合”非标准提法。C 错误：“防消结合”是消防用语。D 错误：顺序表述不规范。", "1": "A 正确：集团云网运营部负责制定全国综维装维安全生产总体策略、制度标准及考核办法（顶层制度职责）。B 错误：省内统筹是省公司职责。C 错误：市公司检查是地市职责。D 错误：班组自检互检是基层职责。", "2": "A 正确：区县分公司近场管理人员每月至少开展 1 次“四不两直”安全检查。B/C/D 错误：频次不符（2/3/4 次均非规定值）。", "3": "A 正确：区县分公司每年至少组织 1 次本地安全生产应急预案演练。B/C/D 错误：频次不符。", "4": "A 正确：未落实安全管理制度、人员管理、外包管理等问题属运营管理责任（管理失职归责）。B 错误：维护实施责任指现场实施环节责任。C 错误：直接责任人责任指具体操作人员。D 错误：意外事件不属责任认定。", "5": "A 正确：“三不违”=不违章指挥、不违章操作、不违反劳动纪律（安全术语标准表述）。B/C/D 错误：搭配或名称不符。", "6": "A 正确：考核不合格人员安排 1 次补考机会。B/C/D 错误：补考次数不符。", "7": "A 正确：基础防护用品按每人 1 套配备。B/C/D 错误：套数不符。", "8": "A 正确：雷暴天气严禁在电杆、铁塔、大树下躲避（高大导体易引雷）。B 错误：建筑物内是安全躲避点。C 错误：车辆内较安全。D 错误：避雷针附近是禁区但题干问严禁躲避处。", "9": "A 正确：动火作业防火帆布耐火极限不低于 0.5h。B/C/D 错误：耐火时限不符（1/1.5/2h 均过严）。", "10": "A 正确：“劳动保护五个必”=服、帽、带、鞋和电笔。B 错误：绳/手套不在“五个必”。C 错误：反光衣不在列。D 错误：头盔表述不符。", "11": "A 正确：高处、弱电间、吊顶、不明线缆设施及近电作业场景必须开启近电告警器（防触电关键防护）。B 错误：照明是辅助非必须安全装置。C 错误：反光标识是交通防护。D 错误：蓝牙耳机无关。", "12": "A 正确：解释权归集团公司云网运营部（制度制定主体）。B/C/D 错误：解释权归集团层面。", "13": "A 正确：办法自发布之日起实施。B/C/D 错误：实施时点不符（30/60/90 日后均非规定）。", "14": "A 正确：安全带腰带松紧度以能伸入 1~2 根手指为宜（佩戴舒适且不松脱）。B/C/D 错误：松紧度不符。", "15": "A 正确：光缆链路激光无论是否连接一律视为有信号，不得用眼直视（激光伤眼不可逆）。B/C/D 错误：任何情况下都不能直视，护目镜也非绝对防护。", "16": "A 正确：电动工具应接漏电保护器（防人身触电的关键保护）。B 错误：过载保护防设备损坏。C/D 错误：欠压/过压保护非人身安全主保护。", "17": "A 正确：易燃易爆场所应采用防爆型电动工具（防火花引爆）。B/C/D 错误：防水/防尘/普通型不满足防爆要求。", "18": "A 正确：室内室外布线遵循“电笔开道保平安”原则（先验电再作业）。B/C/D 错误：强弱电混合、随意布线、跨越铁路河道均属违规。", "19": "A 正确：入户线缆最好采用非金属线缆（防雷、防触电）。B/C/D 错误：金属/铜/铝芯线缆入户有触电与引雷风险。", "20": "A 正确：酒精应置于防爆箱内存放（酒精易燃易挥发）。B/C/D 错误：抽屉/桌面/文件柜均不防火防爆。", "21": "A 正确：省公司安全检查重点=外包单位管理合规性、特种作业人员持证情况、数字化安全工具应用效果（省级宏观监管）。B 错误：工单/劳保/现场是地市重点。C 错误：隐患/培训/应急是区县重点。D 错误：班组层面非省公司重点。", "22": "A 正确：地市公司安全检查重点=工单审批合规性、劳保用品配备完整性、现场操作规范性（市级执行监管）。B 错误：是省公司重点。C 错误：是区县重点。D 错误：班组自检内容。", "23": "A 正确：区县公司安全检查重点=隐患整改闭环情况、安全培训记录完整性、应急物资储备情况（县级落地检查）。B/C/D 错误：分别为地市/省/班组层面。", "24": "A 正确：安全风险等级分为一般风险、较大风险、重大风险三级。B/C/D 错误：分级名称不符（低中高/一二三/特别重大均非标准分级）。", "25": "A 正确：车辆轮胎磨损属较大安全风险（影响行车安全）。B/C/D 错误：工器具轻微破损、警示标志缺失、安全帽污渍属一般风险/隐患。", "26": "A 正确：重大风险整改完成后，经属地安全管理部门验收合格方可恢复作业（属地验收原则）。B/C/D 错误：验收主体应为属地安全管理部门。", "27": "A 正确：“云监工”实时传输作业视频、后台稽核操作规范、发现违规立即叫停（远程安全监督）。B/C/D 错误：统计时长/生成报告/监控位置非其主要作用。", "28": "A 正确：安全风险隐患地图核心作用是实现“排查-录入-整改-验收”全流程闭环。B/C/D 错误：统计/展示/分级是附属功能。", "29": "A 正确：造成作业人员受伤的事故由省公司安委会组织调查处理（伤人事故省级调查）。B 错误：集团安委会管重大事故。C/D 错误：地市/区县不组织事故调查。", "30": "A 正确：作业点超过水平视线时应用高凳（双手可操作的高处工具）。B 错误：梯子需靠墙且有滑移风险。C/D 错误：脚手架/登高车非室内常规。", "31": "A 正确：工具桶要求圆形帆布工具桶并配置安全悬吊绳索（防工具坠落伤人）。B/C/D 错误：材质/吊绳要求不符。", "32": "A 正确：省公司全省安全检查采用“四不两直”结合专项检查。B 错误：现场抽查+访谈+远程数据分析是检查手段而非方式。C/D 错误：巡查/自检非省级组织方式。", "33": "A 正确：水平桩或中心桩不得高出路面 1cm 以上（防绊倒行人）。B/C/D 错误：高度不符。", "34": "A 正确：作业人员不得在沟坑内或隧道中休息（塌方/中毒窒息风险）。B/C/D 错误：施工/传递工具/堆放材料是正常作业行为。", "35": "A 正确：下井前应进行有毒、有害及可燃气体的浓度测定（先测气体再下井）。B 错误：气味辨别不可靠。C/D 错误：通风/封堵是后续措施。", "36": "A 正确：人孔内工作灯宜用 12V 以下安全电压（人体安全电压），电瓶放人孔外。B/C/D 错误：电压等级不符（24/36/48V 均高于安全电压）。", "37": "A 正确：高处作业人员必须正确使用安全带、安全帽（YD 5201-2014 强制要求）。B/C/D 错误：绝缘用品/护目镜/防滑鞋非高处作业核心要求。", "38": "A 正确：在电力线下架设的吊线应按设计规定的方式进行保护（绝缘/防护方式）。B/C/D 错误：材质/颜色/高度不是保护方式要素。", "39": "A 正确：新装拉线必须在布放吊线之前进行（先做拉线加固，后布放吊线）。B/C/D 错误：之后/同时/任意时间均不符施工安全顺序。", "40": "AB 正确：外线作业安全生产事故分为“发生人员死亡的生产安全事故”和“造成作业人员受伤的事故”两类。C/D 错误：设备损坏、网络中断事故不属于人身安全事故分类。", "41": "AB 正确：安全积分每人每年12分，违反安全规范按情节扣1-3分。C 错误：积分低于6分封停工号非规定分值。D 错误：年底得分低于4分专项培训非规定口径。", "42": "AB 正确：高处作业应持高处作业证登高、戴安全帽系安全带作业。C 错误：单人登高作业违规。D 错误：在梯子顶端2级踏步站立属违规登高。", "43": "AB 正确：单梯应使用绝缘梯、根部采取防滑措施。C 错误：单梯垫高或接长使用违规。D 错误：单梯上站两人协同作业违规。", "44": "AB 正确：“每日班会一必讲”内容包括安全案例、安全要领。C 错误：安全口诀平安歌不属于班会必讲内容。D 错误：车辆检查记录与班会必讲无关。", "45": "AB 正确：“云监工”适用于有限空间、铁塔维护等危险作业场景。C/D 错误：办公室办公、仓库整理非危险作业场景。", "46": "AB 正确：光缆激光不管连接情况一律视为有信号，不得用眼直视。C 错误：未连接时无信号可直视的说法错误。D 错误：功率低时可以直视的说法错误。", "47": "AB 正确：通信线路作业不仅涉及线务人员安全，还涉及社会人员和机房设备的安全。C 错误：电力设施安全归电力部门管理。D 错误：交通运输非直接涉及对象。", "432": "答“错误”。该说法错误：雷雨天严禁进行电测法物探作业及收放导线（防引雷）。", "433": "答“错误”。该说法错误：通信线路作业主要危险因素包括高处坠落、触电、有害气体中毒、物体打击，有害气体中毒事故是主要危险因素之一。", "434": "答“错误”。该说法错误：上下沟槽应使用梯子，不得攀登沟内外设备。", "435": "答“错误”。该说法错误：严禁使用金属杆直接钎插探测地下输电线和光缆。", "436": "答“错误”。该说法错误：作业人员不得在沟坑内休息（塌方/中毒风险）。", "437": "答“错误”。该说法错误：挖出土石应堆放在距离沟坑边沿60cm以外，不是30cm。", "438": "答“错误”。该说法错误：制作模板和挡土板的木料不得有断裂现象，轻微断裂也不行。", "439": "答“错误”。该说法错误：非开挖顶管施工区域必须设置安全警示标志和围栏并指定专人维持交通。", "440": "答“错误”。该说法错误：脚手架上堆砖高度不得超过3层侧砖，不是5层。", "441": "答“错误”。该说法错误：钢筋冷拉作业拉筋两端及钢筋两侧3m以内不得站人。", "442": "答“错误”。该说法错误：打开井盖后必须先进行有毒、有害及可燃气体浓度测定，确认安全后方可下井，不能直接下井。", "443": "答“错误”。该说法错误：管道工程回填土必须分层夯实，不能一次性回填。", "444": "答“错误”。该说法错误：上下人孔必须使用专用梯子，严禁把梯子搭在人孔内的线缆上。", "445": "答“错误”。该说法错误：人孔内感觉呼吸困难应立即呼救并迅速撤离，不能坚持作业。", "446": "答“错误”。该说法错误：使用电力潜水泵抽水时严禁边抽水边下人孔作业。", "447": "答“错误”。该说法错误：严禁在地下室、人孔内点燃喷灯。", "448": "答“错误”。该说法错误：严禁将易燃、易爆物品带入地下室或人孔。", "449": "答“错误”。该说法错误：上下杆时不准二人及以上同时上下杆。", "450": "答“正确”。综维装维安全生产工作坚持安全第一、预防为主、综合治理的方针，表述正确。", "451": "答“正确”。综维装维安全生产强化“三管三必须五负责”原则，表述正确。", "452": "答“正确”。各级单位严格履行安全生产主体责任，同时接受属地政府相关部门监督管理，表述正确。", "453": "答“正确”。集团云网运营部是云网运营条线的安全生产统筹部门，表述正确。", "454": "答“正确”。高空作业指坠落高度在2米以上的作业，表述正确。", "455": "答“正确”。动火作业需提前办理《动火许可证》，经属地安全管理部门审批后实施，表述正确。", "456": "答“正确”。班组每日出工前开展1次自检互检，由班组长牵头，表述正确。", "457": "答“正确”。班组发现的安全风险须在2小时内录入数字化平台，表述正确。", "458": "答“正确”。系统自动提前3-6个月提醒特种作业人员证件复审，表述正确。", "459": "答“正确”。综维装维人员每人每年12分，违反安全规范按情节扣1-3分，表述正确。", "460": "答“正确”。未落实安全管理制度、人员管理等问题应承担运营管理责任，表述正确。", "461": "答“正确”。因不可抗力原因导致的意外事故，经研究后可给予免责，表述正确。", "462": "答“正确”。因安全风险未整改导致安全事故的，应追究安全风险排查人、属地管理人、整改责任人责任，表述正确。", "463": "答“正确”。外包与分包单位应按标准足额配备劳保用品与安全工器具，建立领用台账，表述正确。", "464": "答“正确”。区县分公司应每季度至少开展一次安全警示教育，表述正确。", "465": "答“正确”。省公司云网运营部负责建立外包单位安全生产评价、考核与动态淘汰机制，表述正确。", "466": "答“正确”。按“统一领导、分级管理、分类指导、分区管控、压实责任、全员参与”方式管理，表述正确。", "467": "答“正确”。集团公司全国性安全检查采用“现场抽查+访谈+远程数据分析”方式，表述正确。", "468": "答“正确”。安全防护装备配备属于安全生产专项资金使用范围，表述正确。", "469": "答“正确”。对无证或过期人员，系统应冻结其工单权限，表述正确。", "470": "答“正确”。集团云网运营部负责统筹推进现场作业风险识别AI能力、远程监控等技术手段建设，表述正确。", "471": "答“正确”。省公司每季度1次全省检查、地市公司每月1次、区县公司每周1次，表述正确。", "472": "答“正确”。班组晨会AI点检通过智能摄像头自动识别作业人员仪容仪表和安全交底执行情况，表述正确。", "473": "答“正确”。因高温、操作人员身体、心理等因素导致的事故归为意外事件，表述正确。", "474": "答“正确”。负有运营管理责任的单位应在云网运营年度考核中扣分，取消评优资格，表述正确。", "475": "答“正确”。负有维护实施责任的外包单位应按照供应商相关管理制度进行禁限处罚，表述正确。", "476": "答“正确”。区县分公司每年至少组织1次本地的安全生产应急预案演练，表述正确。", "477": "答“正确”。发生人员死亡的生产安全事故由集团安委会记录并督办相关单位进行事故  "答“正确”。作业点超过水平视线时应使用高凳，表述正确。", "525": "答“正确”。区县公司每年完成分支局D类机房、一线班组的全覆盖检查，表述正确。", "526": "答“正确”。重大风险整改完成后经属地安全管理部门验收合格方可恢复作业，表述正确。", "527": "答“正确”。智慧综维APP内置典型事故处置流程，可一键拨打报警电话，表述正确。", "528": "答“正确”。造成作业人员受伤的事故由各省安委会组织事故调查处理，表述正确。", "529": "答“正确”。对安全风险排查不彻底的班组，扣减班组长当月安全绩效，表述正确。", "530": "答“正确”。对整改不及时的单位扣减属地单位安全生产考核分数并约谈单位负责人，表述正确。", "531": "答“正确”。因安全风险未整改导致安全事故的严肃追究责任，构成犯罪的移交司法机关，表述正确。", "532": "答“正确”。检查脚扣安全性应卡在离地面30cm的电杆上用力踏踩，表述正确。", "533": "答“正确”。登杆前发现电杆有腐烂现象，未加固前不得攀登，表述正确。", "534": "答“正确”。杆上作业前必须系好安全带并扣好保险环，表述正确。", "535": "答“正确”。未辩明性质的其他线缆一律按电力线处理，表述正确。", "536": "答“正确”。高压线附近35KV以下最小空距2.5m、35KV以上4m，表述正确。", "537": "答“正确”。光电缆通过供电线上方时不得将供电线擅自剪断，表述正确。", "538": "答“正确”。雷雨天气严禁上杆施工作业，表述正确。", "539": "答“正确”。新装拉线必须在布放吊线之前进行，表述正确。", "540": "答“正确”。YD 5201-2014由工业和信息化部发布，2014年7月1日实施，表述正确。", "541": "答“正确”。通信线路作业涉及线务人员、社会人员的安全和机房设备的安全，表述正确。", "542": "答“正确”。工地堆放机具材料堆积高度不宜超过1.5m，表述正确。", "543": "答“正确”。水平桩或中心桩不得高出路面1cm以上，表述正确。", "544": "答“正确”。通信管道工程施工前应向作业人员做安全技术交底，表述正确。", "545": "答“正确”。施工现场的设备、主要材料、施工机械和仪器仪表必须由专人看守，表述正确。", "546": "答“正确”。挖掘土石方应从上而下进行，不得采用掏挖方法，表述正确。", "547": "答“正确”。流砂、疏松土质沟深超过1.0m时应安装挡土板，表述正确。", "548": "答“正确”。拆除挡土板如有塌方危险，应先回填一部分土经夯实后再拆除，表述正确。", "549": "答“正确”。非开挖钻杆设备与电力线保持2.5m以上安全距离，表述正确。", "550": "答“正确”。砌筑人孔高度超过1.2m时应搭设脚手架作业，表述正确。", "551": "答“正确”。人工铺管水泥管块堆放不宜高出1.0m，表述正确。", "552": "答“正确”。小孔管道试通可用穿管器带试通棒试通，表述正确。", "553": "答“正确”。人孔内宜选用36V以下工作灯，电瓶放人孔外，表述正确。", "554": "答“正确”。进入地下室、管道人孔前必须使用专用气体检测仪器进行气体检测，表述正确。", "555": "答“正确”。进入人孔必须佩戴全身式安全带、安全帽并系好安全绳，表述正确。", "556": "答“正确”。人孔抽水发电机排气管应放在人孔下风方向，表述正确。", "557": "答“正确”。人孔内作业期间必须保证通风良好并使用气体检测仪器监测，表述正确。", "558": "答“正确”。高处作业人员必须正确使用安全带、安全帽，表述正确。", "559": "答“正确”。登杆到位后安全带应兜挂在距杆梢50cm以下的位置，表述正确。", "48": "AB 正确：施工现场应进行围栏和警戒，遇阻挠时应请政府机构协调。C 错误：施工机械和仪器仪表必须安排专人看守。D 错误：夜间偷袭施工违规。", "49": "AB 正确：升高或降低吊线必须使用紧线器，特别是吊档杆、顶档杆操作必须稳妥牢靠。C/D 错误：终端杆、角杆操作也需紧线器但非题干特指。", "50": "AB 正确：高压线附近作业最小安全空距为35KV以下2.5m、35KV以上4m。C/D 错误：1.5m/3m 均不满足安全空距要求。", "51": "AB 正确：坐吊板作业时地面应有专人进行滑动牵引和控制保护。C 错误：交通指挥非吊板作业地面监护职责。D 错误：材料搬运无关。", "52": "ABC 正确：“三管三必须”=管行业必须管安全、管业务必须管安全、管生产经营必须管安全。D 错误：管设备必须管安全不是“三管三必须”内容。", "53": "ABC 正确：安全生产管理适用于自有人员、外包人员、分包单位。D 错误：访客不适用安全生产管理对象。", "54": "ABC 正确：省公司云网运营部负责细化本省安全管理细则、建立外包单位安全生产评价考核与动态淘汰机制、编制本地化安全培训材料。D 错误：组织地市应急演练非省公司云网运营部职责。", "55": "ABC 正确：区县近场管理人员职责=每月1次“四不两直”检查、组织属地人员参与技能/特种作业认证、每月至少1次安全培训讲座。D 错误：每年1次警示教育频次不符（近场管理另有要求）。", "56": "ABC 正确：高风险与特殊场景作业包括高空作业、有限空间作业、涉电作业。D 错误：日常巡检作业不是高风险特殊场景。", "57": "ABC 正确：安全风险三级排查机制=班组上报、区县核实、省市督办。D 错误：集团审批不是排查机制环节。", "58": "ABC 正确：重大风险典型情形=杆体严重倾斜有倒杆风险、有限空间有毒气体超标、电杆吊线带电。D 错误：警示标志缺失属一般风险。", "59": "ABC 正确：现场与过程管控包括班组晨会AI点检、高风险工单智能管控、远程监控与稽核。D 错误：安全风险隐患地图属于隐患管理功能而非现场过程管控。", "60": "ABC 正确：事故责任认定类型=运营管理责任、维护实施责任、直接责任人责任。D 错误：无事件不是责任类型。", "61": "ABC 正确：培训内容主要包括基础安全知识、风险场景应对、工具及防护用品使用。D 错误：市场营销技巧与安全生产无关。", "62": "ABC 正确：培训形式包括线上理论培训、线下实操演练、家属联动。D 错误：集中脱产学习不是规范规定的培训形式。", "63": "ABC 正确：安全带存放于干燥通风避光专用柜、远离高温（>60℃）、远离潮湿腐蚀性物质及尖锐物体。D 错误：织带折叠挤压存放会损伤安全带。", "64": "ABC 正确：试电笔每日出工前测试功能、严禁测量高压、手部潮湿时不应使用。D 错误：强电磁干扰时使用会影响判断不准。", "65": "ABC 正确：道路作业禁止在道路中间随意停车作业、不设警示标志、不设置围栏及标志开展作业。D 错误：穿反光衣是必须的安全措施而非禁止事项。", "66": "ABC 正确：作业前安全技术交底明确风险点（电力线位置、有毒气体等）、防范措施、交底双方签字确认。D 错误：作业后清理现场不属于交底内容。", "67": "ABC 正确：规范覆盖典型场景包括登高、涉电、有限空间。D 错误：地震抢险不属于常规综维装维作业场景。", "68": "ABC 正确：涉电作业前准备=验电确认、防护配备（绝缘鞋绝缘手套）、三线交越核查。D 错误：办理动火许可证是动火作业流程。", "69": "ABC 正确：智能安全帽功能包括脱帽告警、近电提醒、作业过程录像。D 错误：自动充电不是安全帽功能。", "70": "ABC 正确：包保责任人确定规则=省公司直接发包第三方的由分公司负责人或业务部门主要负责人、省级通服分包其他单位的由具体发包单位负责人、各级单位明确主要负责人包保责任。D 错误：包保责任人无需承担责任与制度相悖。", "71": "ABC 正确：分包人员信息动态管理内容包括投保情况、劳务合同签订情况、上岗资格证。D 错误：专业技能认证不属于动态管理内容。", "72": "ABC 正确：覆盖维护作业类型包括光缆敷设、客户终端安装、故障处理。D 错误：网管轮巡是网管侧工作非外线作业。", "73": "ABC 正确：安全生产专项资金使用范围=安全防护装备配备、安全设施与工具配置、安全培训与教育。D 错误：员工工资发放不属于安全专项资金。", "74": "ABC 正确：专项资金使用范围还包括隐患排查与整改、应急管理保障、安全管理与监督。D 错误：企业盈利分配与安全资金无关。", "75": "ABC 正确：安全培训“一人一档”内容包括培训时间内容、考核试卷成绩记录、上岗资格证复印件。D 错误：个人简历不属于培训档案内容。", "76": "ABC 正确：安全风险排查机制三级=班组上报、区县核实、省市督办。D 错误：集团审批不是排查环节。", "77": "ABC 正确：集团公司职责=安全生产统筹管理、组织安全生产管理检查和事件调查、制定全国总体策略制度标准。D 错误：细化本省细则属省公司职责。", "78": "ABC 正确：省公司云网运营部职责=细化本省细则、组织全省外包单位安全专项检查、建立外包单位评价考核动态淘汰机制。D 错误：牵头分包管理监督检查属集团/其他部门职责。", "79": "ABC 正确：安全风险等级=一般风险、较大风险、重大风险。D 错误：特别重大风险不是标准分级。", "80": "ABC 正确：数字化现场过程管控=班组晨会AI点检、高风险工单智能管控、远程监控与稽核。D 错误：自动完成作业不存在。", "81": "ABC 正确：人员与资质管理=建立电子资质台账、自动提前3-6个月提醒复审、对无证或过期人员冻结工单权限。D 错误：系统不会自动给人员办理资质。", "82": "ABC 正确：安全事故问责措施=责任单位年度考核扣分取消评优、施工单位按供应商管理制度禁限处罚、责任人提醒谈话批评教育绩效扣罚。D 错误：所有事故都必须问责过于绝对。", "83": "ABC 正确：涉电作业专用防护用品=国标绝缘手套、绝缘螺丝刀钳子等工具、万用表。D 错误：正压式空气呼吸器是有限空间防护用品。", "84": "ABC 正确：流砂土质沟深超过1.0m、疏松土质沟深超过1.0m、硬土质侧壁与底面夹角小于115°且沟深超过1.5m 均需安装挡土板。D 错误：所有沟槽一律安装过于绝对。", "85": "ABC 正确：沟坑深1.5m以上时挖出土石堆放在距沟坑边沿60cm以外、不得堆放过高、防止土石回落沟内。D 错误：堆在沟边任意位置违规。", "86": "ABC 正确：拆除挡土板时如有塌方危险应先回填一部分土、经夯实后再拆除、逐步进行确保安全。D 错误：一次性全部拆除有塌方风险。", "87": "ABC 正确：雷雨天严禁进行电测法物探作业、雷雨天严禁收放导线、正常天气可以作业。D 错误：雷雨天经批准可以作业违规。", "88": "ABC 正确：非开挖施工=设置安全警示标志和围栏、指定专人维持交通、钻杆设备与电力线保持2.5m以上安全距离。D 错误：无需任何安全标志违规。", "89": "ABC 正确：钢筋冷拉作业=操作人员位于安全地带、钢筋两侧3m以内不得站人、拉筋两端不得站人。D 错误：无需注意安全距离违规。", "90": "ABC 正确：进入地下室人孔前使用专用气体检测仪器检测、确认无易燃易爆有毒有害气体、通风后方可进入。D 错误：踩踏人孔托架上下人孔不规范（应使用专用梯）。", "91": "ABC 正确：进入人孔人员必须正确佩戴全身式安全带、安全帽、安全绳。D 错误：绝缘手套是涉电场景防护。", "92": "ABC 正确：人孔内作业=人孔上面必须有人监护、上下人孔梯子不得撤走、保持自然和强制通风。D 错误：人孔内照明应使用12V以下工作灯，36V超安全电压。", "93": "ABC 正确：感觉呼吸困难或身体不适=立即呼救、迅速撤离、未查明原因严禁下井施救。D 错误：坚持完成作业后再撤离危险。", "94": "ABC 正确：电杆上有人作业时杆下周围必须有人监护、监护人不得靠近杆根、交通路口地段必须设置护栏。D 错误：无人监护违规。", "95": "ABC 正确：杆上作业材料放置稳妥、工具随手装入工具袋、不得向下抛扔工具和材料。D 错误：将材料放在吊线上会坠落伤人。", "96": "ABC 正确：检查脚扣安全性=卡在离地面30cm电杆上、一脚悬起、另一脚套在脚扣上用力踏踩。D 错误：有受损变形迹象的脚扣不得使用。", "97": "ABC 正确：线务员应使用触电预警器、双重绝缘的手持电动工具、安全电压的手持电动工具。D 错误：无任何防护的普通工具禁用。", "98": "ABC 正确：未辩明清楚前一律按电力线处理、合用杆上作业注意与电力线保持安全距离、先用试电笔检查确认无电再作业。D 错误：直接用手触摸确认危险。", "99": "ABC 正确：安装拉线尽量避开有碍行人行车地方、安装拉线警示护套、拉线坑回填土夯实。D 错误：拉线坑不够深应将地锚杆锯短错误（应加深坑或调整）。", "100": "ABCD 正确：市专业维护中心负责外包单位分包人员信息动态管控、每月组织投保情况现场检查、检查分包队伍技术员材料员安全员配置、外包单位施工计划管理，全选。", "101": "ABCD 正确：外包与分包单位职责=建立健全安全生产责任制、按标准足额配备劳保用品与安全工器具、接受主业安全培训教育及安全检查、发生安全事故承担相应经济赔偿与法律责任，全选。", "102": "ABCD 正确：动火许可证需明确动火地点、动火时间、动火人、监护人及灭火措施，全选。", "103": "ABCD 正确：吊装作业审批单审批内容=吊装设备检测报告、人员资质、环境安全性、方案可行性，全选。", "104": "ABCD 正确：安全风险信息包括风险位置、类型、风险等级、现场照片，全选。", "105": "ABCD 正确：应承担维护实施责任的情形=未落实工单审批派发、未组织现场危险因素排查清除检验、未合理设置使用现场安全设施、作业前未进行安全交底，全选。", "106": "ABCD 正确：班组每日自检互检=作业人员精神状态、工器具完好性、防护用品穿戴、作业车辆状态，全选。", "107": "ABCD 正确：“四不伤害”=不伤害自己、不伤害他人、不被他人伤害、保护他人不受伤害，全选。", "108": "ABCD 正确：安全帽佩戴前自检=帽体帽衬缓冲层、帽箍、下颌带、近电告警器功能，全选。", "109": "ABCD 正确：安全带报废情形=织带撕裂磨损超标霉变缝合线断裂、连接器变形裂纹锁止失效、超过使用年限、标识模糊无法确认合规性，全选。", "110": "ABCD 正确：高处作业防护用品=绝缘防滑梯、国标安全带及安全绳、国标脚扣及脚扣带、国标安全帽（配近电告警器），全选。", "111": "ABCD 正确：涉电场景防护用品=国标绝缘手套、国标绝缘电工鞋、国标验电笔、万用表，全选。", "112": "ABCD 正确：有限空间作业防护用品=正压式空气呼吸器、便携式四合一气体检测仪、强制通风设备（防爆轴流风机）、有限空间救援三脚架，全选。", "113": "ABCD 正确：“一人一账”领用记录=领用人员姓名、用品名称型号规格、领用日期有效期、归还日期，全选。", "114": "ABCD 正确：触电处置=立即切断电源、干燥木棒或绝缘手套挑开带电体、意识丧失立即心肺复苏、灼伤无菌纱布覆盖，全选。", "115": "ABCD 正确：人员行为规范=严禁酒后身体不适疲劳上岗、严禁擅自调整作业范围更改流程、禁止现场吸烟饮食嬉戏、严禁将无关人员带入作业区域，全选。", "116": "ABCD 正确：工具设备使用前检查=绝缘工具无裂纹、电动工具绝缘层完好、梯子无松动、脚扣胶皮无破损，全选。", "117": "ABCD 正确：现场环境规范=设置安全警示标志、道路作业设围栏夜间加警示灯、高危场景设专人监护、作业后清理现场回收工具余料，全选。", "118": "ABCD 正确：高处作业前确保=作业工具齐全可靠、检查登高受力面承重牢固程度、观察周边不明线路设施、登高上下过程手中不拿物品，全选。", "119": "ABCD 正确：人字梯使用前检查=梯体无变形裂纹锈蚀、铰链锁止拉杆关键部件、额定承重、开合顺畅锁定可靠，全选。", "120": "ABCD 正确：涉水作业=穿绝缘雨靴、棍棒试探水深（≤1.2m）、验电笔测验水体是否有电、水流湍急时停止作业，全选。", "121": "ABCD 正确：车辆日常检查=灯光、刹车、轮胎、承载结构，全选。", "122": "ABCD 正确：行驶安全=不得无证酒驾、保持安全车距、骑行不手脱把肩上扛物、不得超速行驶，全选。", "123": "ABCD 正确：平安歌要点=出工前相互查防护品、不明线别乱抓若带电把闸拉、下井孔先通风后换气检测仪常开启、恶劣天不冒险上，全选。", "124": "ABCD 正确：数字化赋能措施=人员与资质管理、现场与过程管控、隐患与应急管理、安全大数据分析模型应用，全选。", "125": "ABCD 正确：安全大数据分析=高频风险场景、违规人员特征、安全检查结果、培训参与率，全选。", "126": "ABCD 正确：外包单位管理要求=建立评价考核动态淘汰机制、定期评估安全管理能力、足额配备劳保用品、接受主业培训检查，全选。", "127": "ABCD 正确：第三级安全技术交底=作业风险点、针对性防护措施、现场监护人、应急联系方式，全选。", "128": "ABCD 正确：高风险特殊场景专用防护装备=全身式安全带、有毒有害气体检测仪、防毒面罩、动火作业灭火装置，全选。", "129": "ABCD 正确：应急处置数字化=内置典型事故处置流程、报警电话一键拨打、快速调取附近救援资源、自动生成事故报告初稿，全选。", "130": "ABCD 正确：登高作业总体原则=定期体检身体病症勿登高、服帽带鞋穿戴好、不明物体和线缆视为导电勿触碰、电笔测试保平安，全选。", "131": "ABCD 正确：电动工具操作=用前检查发现问题不得用、插头插座配套使用、电钻电锤使用前空转测试、拆卸钻头应断电，全选。", "132": "ABCD 正确：市云网运营部职责=牵头分包管理监督检查、制订考核办法落实外包单位管控责任、组织分包人员信息动态管理、落实责任区域外包分包单位安全生产责任，全选。", "133": "ABCD 正确：安全帽佩戴要求=帽檐朝前扣紧、下颌带拉紧留1~2指空隙扣好卡扣、晃头不滑动下拉不脱落、帽衬与帽体间距20~50mm，全选。", "134": "ABCD 正确：雷暴天气禁止行为=电杆铁塔下躲避、大树下躲避、手持金属工具、池塘江河边停留，全选。", "135": "ABCD 正确：电动工具使用要求=使用前检查发现问题不得用、插头插座配套不得直接接电线、易燃易爆场所用防爆型、电钻电锤使用前空转测试，全选。", "136": "ABCD 正确：外包与分包单位职责=建立健全安全生产责任制、足额配备劳保用品与安全工器具、接受主业安全培训教育及检查、事故承担经济赔偿与法律责任，全选。", "137": "ABCD 正确：地市专业维护中心职责=分包人员信息动态管控、每月现场检查、外包单位项目过程管控、施工安全检查形成隐患台账闭环管控，全选。", "138": "ABCD 正确：通信线路作业主要危险因素=高处坠落、触电、有害气体中毒、物体打击，全选。", "139": "ABCD 正确：预防高处坠落=上杆前检查脚扣安全带安全性能、检查杆根腐朽损毁、注意外力影响倒杆、防止触电后二次坠落，全选。", "140": "ABCD 正确：预防触电=掌握安全用电基本知识、作业前验证带电导体确保安全距离、正确穿戴劳动防护用品、三线交叉处安装保护管，全选。", "141": "ABCD 正确：预防有害气体中毒=进人孔前先通风检测、检测安全后尽快下井作业、下井保持持续通风、不准在人孔内抽烟和使用明火照明，全选。", "142": "ABCD 正确：YD 5201-2014适用于通信线路工程、通信管道工程、通信设备安装工程、通信铁塔工程，全选。", "143": "ABCD 正确：管道工程施工前准备=沿线地理环境综合调查、辨识分析危险源、制定预防和安全控制措施、向作业人员做安全技术交底，全选。", "144": "ABCD 正确：严禁在地下室、人孔内点燃喷灯、吸烟、生火取暖、将易燃易爆物品带入，全选。", "145": "ABCD 正确：检测与下井作业间隔不能太长（一般不超过30分钟）、每次作业前都要重新检测、污水排放后也要重新检测，全选。", "146": "ABCD 正确：使用脚扣前检查橡胶套管是否破损离股老化、螺丝是否脱落、弯钩脚蹬板是否扭曲变形、脚扣带是否腐蚀开焊裂痕，全选。", "147": "ABCD 正确：登杆前检查电杆有无折断危险、杆根腐朽损毁情况、腐朽严重不能上杆、检查杆顶周围障碍物，全选。", "148": "ABCD 正确：供电线及高压输电线附近作业必须使用安全帽、绝缘手套、绝缘鞋、绝缘工具，全选。", "149": "ABCD 正确：线路施工维护人员应穿戴安全帽、绝缘手套、绝缘鞋，携带试电笔，全选。", "150": "ABCD 正确：跨越电力线铁路公路杆档安装光缆挂钩、拆除吊线滑轮、吊线周围70cm内有电力线或用户照明线、电杆与墙壁或墙壁之间吊线均不得使用吊板，全选。", "151": "ABCD 正确：布放无盘钢绞线必须用放线盘、牵引前端用干燥麻绳、穿越供电线路设专人用绝缘棒托住钢绞线、牵引余量用力均匀，全选。", "152": "ABCD 正确：人工立杆杆立起至30°角时用杆叉牵引绳助力、竖杆步调一致、肩扛用同侧肩膀、电杆不得左右摇摆，全选。", "153": "ABCD 正确：高空坠落应急=先使伤者躺平判断全身情况、外部出血止血、平躺担架搬运、骨折用夹板固定断骨上下方两个关节，全选。", "154": "ABD 正确：承担运营管理责任的情形=未落实安全管理制度、人员管理外包管理不当、安全资源投入不足。C 错误：定期组织安全检查与培训是履职到位行为。", "155": "ABD 正确：承担直接责任人责任=不服从管理、不正确佩戴使用劳动防护用品、未按工单作业。C 错误：发现隐患立即停止作业是正确行为不担责。", "156": "ABD 正确：动火作业防护用品=火花接挡装置、防火帆布、灭火毯。C 错误：应配备2个以上4公斤灭火器，1个不够。", "157": "ABD 正确：有限空间中毒窒息处置=立即停止作业、救援人员佩戴隔离式呼吸器进入、意识丧失立即心肺复苏。C 错误：应及时转移伤者（题干表述“不允许转移”错误）。", "158": "ABD 正确：施工操作安全=电笔开道保平安、不能强弱混合走、光缆激光一律视为有信号不得直视。C 错误：应采用非金属入户线缆，金属线缆危险。", "159": "ABD 正确：隐患与应急管理功能=建立安全风险隐患地图、应急处置数字化、自动生成事故报告初稿。C 错误：系统不会自动整改隐患。", "160": "ABD 正确：人孔抽水=电力潜水泵严禁边抽水边下人孔作业、发电机排气管不得靠近人孔口、冬季抽水防路面结冰。C 错误：排气管应放在人孔下风方向（避免废气吹向井口）。", "161": "ABD 正确：脚扣禁止行为=不得以大代小或以小代大、木杆脚扣不得攀登水泥杆、不得用电话线或绳索替代脚扣带。C 错误：圆形水泥杆脚扣不可攀登方型水泥杆。", "162": "ABD 正确：登杆注意事项=观察避开杆顶周围障碍物、除个人工具外不带笨重工具、杆上作业前系好安全带扣好保险环。C 错误：材料工具禁止上下抛掷。", "163": "ABD 正确：坐吊板作业=辅扎安全带并挂在吊线上、不得两人以上同时在一档内作业、吊板挂钩磨损四分之一不得使用。C 错误：2.0/7以下吊线强度不足不得使用吊板。", "164": "ABD 正确：更换拉线=将新拉线安装完毕、新拉线张力松泄旧拉线后再拆旧拉线、安装避开有碍行人行车地方。C 错误：在原拉线位置安装新拉线时需制作临时拉线。", "165": "ABD 正确：汽车装运电杆=设置专用支架、杆材重心落在车厢中部、卸车不得直接抛掷。C 错误：杆材不得超出车厢两侧。", "166": "ABD 正确：电杆堆放=杆梢杆根各在一端排列整齐、底部两侧用短木石块堵挡、水泥杆不超过两层。C 错误：木杆堆放不超过三层（不是五层）。", "167": "ABD 正确：机械立杆=钢丝吊绳牢固拴在电杆上方适当位置、电杆重心位置在下、严禁在电力线路正下方立杆。C 错误：吊车臂下及杆下严禁站人。", "168": "ABD 正确：人工沿坡面牵引=绳索强度足够牢靠、避免绳索在山石上摩擦、从高处向低处移杆用力不宜过猛。C 错误：电杆后方严禁站人。", "169": "ABD 正确：触电应急=迅速切断电源、用绝缘物体拉开电线、伤势严重立即人工呼吸和胸外挤压。C 错误：禁止用金属材料或潮湿物体作救护工具。", "170": "AC 正确：火灾处置=立即切断电源可燃气体、拨打119。B 错误：人员不得盲目进入事故区灭火。D 错误：电气火灾应用干粉或二氧化碳灭火器，水基灭火器导电危险（题干表述不符）。", "171": "AC 正确：沟槽开挖=上下沟槽使用梯子、不得采用掏挖方法。B 错误：挖掘土石方应从上而下进行。D 错误：作业人员不得在沟坑内休息。", "172": "ACD 正确：履职不当追责=对排查不彻底的班组扣减班组长当月安全绩效、逾期未完成整改约谈单位负责人、因隐患未整改致事故移交司法机关。B 错误：整改不及时应追责的是单位而非扣负责人绩效表述不符。", "173": "ACD 正确：涉电作业禁止事项=带电剪断线缆、用户侧乱拉乱接电源、使用破损绝缘工具。B 错误：雷暴天气严禁开展的是室外涉电作业（室内不禁止）。", "174": "ACD 正确：布线作业=电笔开道测安全再施工、不得随意临时布线、遭遇其他管线避免交越缠绕。B 错误：强弱电不能混合走。", "175": "ACD 正确：发现易燃易爆有毒有害气体=人员迅速撤离、严禁动用明火、立即采取措施排除隐患。B 错误：严禁开关电器（防爆燃）。", "176": "ACD 正确：光电缆通过供电线路上方=事先通知电力部门停电、检查确实停电后才能作业、停送电在开关处悬挂停电警示标志。B 错误：严禁擅自剪断供电线。", "177": "ACD 正确：新装拉线=必须在布放吊线之前进行、保证拉距地锚与地锚杆与钢绞线配套、拉线坑回填土夯实。B 错误：终端拉线钢绞线规格按设计要求，不必与吊线型号一致。", "178": "ACD 正确：人工运杆=分屯堆放点设在不妨碍行人行车处、撬移电杆下落方向禁止站人、抱杆车转弯下坡前提前控制速度。B 错误：应从堆放点高层向低层搬运。", "179": "ACD 正确：施工测量=对路由沿线环境详细调查、遇河流深沟陡坡小心通过、不能盲目泅渡和跳跃。B 错误：禁止抛掷传递标杆。", "180": "AD 正确：五级监督检查=集团公司定期组织全国性检查、区县公司每周1次。B 错误：省公司每季度1次（题干半年不符）。C 错误：地市公司每月1次（题干季度不符）。", "181": "AD 正确：有限空间作业=严禁未通风未检测进入、严禁应急救援时盲目进入。B 错误：严禁用纯氧通风（易爆燃）。C 错误：监护人员不得被抽调离开监护岗位。", "182": "B 正确：高空作业指坠落高度在2米及以上。A/C/D 错误：1/3/5米均非规定阈值（2米以上为高处作业）。", "183": "B 正确：高空、有限空间、涉电作业100%线上审批。A/C/D 错误：口头审批、事后备案、视情况均违规。", "184": "B 正确：动火作业需提前办理动火许可证。A/C/D 错误：场地准入证、操作单、许可单均非规定证件。", "185": "B 正确：吊装作业需办理吊装作业审批单。A/C/D 错误：动火/高处/有限空间审批单不适用于吊装。", "186": "B 正确：集团公司全国性安全检查采用现场抽查+访谈+远程数据分析。A/C/D 错误：单一方式或全面普查不符。", "187": "B 正确：综维装维安全生产管理强化“三管三必须五负责”原则。A/C/D 错误：三管三必须、三不违四不伤害、五负责三不违均非完整表述。", "188": "B 正确：办法适用于云网运营条线综合化维护、装维服务领域的安全生产工作。A/C/D 错误：全部部门/建设/客服非适用范围。", "189": "B 正确：按“统一领导、分级管理、分类指导、分区管控、压实责任、全员参与”方式管理。A/C/D 错误：表述不完整。", "190": "B 正确：安全生产专项资金用于安全防护装备配备。A/C/D 错误：员工福利、办公装修、市场推广均不属于安全资金用途。", "191": "B 正确：省公司组织全省安全检查每季度1次。A/C/D 错误：每月/半年/每年频次不符。", "192": "B 正确：地市公司组织全市安全检查每月1次。A/C/D 错误：每周/季度/半年频次不符。", "193": "B 正确：班组每日出工前自检互检由班组长牵头。A/C/D 错误：安全员/区县/市公司非牵头主体。", "194": "B 正确：班组发现的安全风险须在2小时内录入。A/C/D 错误：1/4/24小时时限不符。", "195": "B 正确：重大安全风险（如杆体严重倾斜）立即停工，24小时内制定整改方案并启动整改。A/C/D 错误：48小时方案不停工、72小时/一周整改均不符（重大风险必须立即停工）。", "196": "B 正确：电子资质台账系统自动提前3-6个月提醒特种作业人员复审。A/C/D 错误：1-2/6-9/12个月不符。", "197": "B 正确：高风险工单智能管控强制要求上传双人作业照片+安全交底记录。A/C/D 错误：计划书/证书/车辆记录非强制上传项。", "198": "B 正确：安全积分年底得分低于6分者需专项培训，不合格者停岗。A/C/D 错误：3/8/10分不符。", "199": "B 正确：违反安全规范按情节每次扣1-3分。A/C/D 错误：扣分区间不符。", "200": "B 正确：发生人员死亡的生产安全事故由集团安委会组织调查处理。A/C/D 错误：省/市/区县安委会不负责死亡事故调查。", "201": "B 正确：未落实现场作业工单审批、派发属维护实施责任（现场实施环节失职）。A 错误：运营管理责任指制度/人员/外包管理。C 错误：直接责任人责任指个人违规操作。D 错误：意外事件非责任类型。", "202": "B 正确：双钩安全带移动遵循“先挂后移”原则（始终至少一钩挂牢）。A/C/D 错误：双钩同开、先移后挂、单钩使用均不安全。", "203": "B 正确：绝缘鞋耐压等级不低于6kV。A/C/D 错误：3/10/35kV不符。", "204": "B 正确：试电笔电压检测范围应为AC 12V～400V。A/C/D 错误：量程不符。", "205": "B 正确：反光衣符合GB 20653-2020。A 错误：GB 2811是安全帽标准。C 错误：GB 21148是绝缘鞋标准。D 错误：GB 24542是坠落防护标准。", "206": "B 正确：因自然环境等外界不可抗力发生的意外事故，经研究后可给予免责。A/C/D 错误：加重处罚/取消评优/调离岗位均不符。", "207": "B 正确：模拟触电心肺复苏属于风险场景应对培训内容（突发事故处置演练）。A/C/D 错误：基础知识/工具使用/家属联动不涵盖实操急救。", "208": "B 正确：家属联动培训向员工家属派发安全告知书。A/C/D 错误：安全手册/培训教材/保险单非派发物。", "209": "B 正确：安全帽帽衬与帽体间距应为20～50mm。A/C/D 错误：间距不符。", "210": "B 正确：安全带佩戴遵循“高挂低用”原则（减少坠落冲击距离）。A/C/D 错误：低挂高用/平挂平用/随意使用均不安全。", "211": "B 正确：安全带每12个月进行1次静态测试。A/C/D 错误：6/24/36个月不符。", "212": "B 正确：高处作业应采用绝缘梯，严禁使用金属梯（防触电）。A/C/D 错误：金属梯导电危险、木梯非规范要求。", "213": "B 正确：单梯立梯角度以75±5度为宜。A/C/D 错误：60/90/45度不符。", "214": "B 正确：梯子靠在吊线时顶端至少高出吊线0.5m。A/C/D 错误：0.3/1/1.5m不符。", "215": "B 正确：使用脚扣上杆随身携带工具总重不得超过5kg。A/C/D 错误：3/8/10kg不符。", "216": "B 正确：使用脚扣上杆前先将脚扣卡在电杆距地面约0.3m处。A/C/D 错误：0.1/0.5/1m不符。", "217": "B 正确：人字梯两侧梯腿张开角度通常为60°～75°。A/C/D 错误：角度不符（过小不稳、过大易滑）。", "218": "B 正确：
