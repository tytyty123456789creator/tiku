搏快有力/脸色燥红均为中暑症状。", "697": "A 正确：周期不属于携带调制信号的参数（调制信号参数为幅度/频率/相位）。B/C/D 错误：幅度/频率/相位均为调制参数。", "698": "C 正确：运动劳累不属于呼吸停止的原因。A/B/D 错误：淹溺电击/闷塞窒息/缺氧均导致呼吸停止。", "699": "B 正确：备制光纤端面用剥纤钳剥除光纤涂覆层不属于熔接机操作步骤（是熔接前准备）。A/C/D 正确：熔接后套热缩管/穿热缩管/剥除涂覆层准备工作均属操作流程。", "700": "C 正确：耐电性不属于光缆机械性能测试参数（机械性能含拉力/弯曲等）。A/B 错误：拉力/弯曲均为机械性能参数。", "701": "A 正确：UDP不属于OSI应用层协议（是传输层协议）。B/C/D 错误：FTP/HTTP/RTMP均为应用层协议。", "702": "A 正确：Zigbee不属于LPWA物联网技术（是短距无线技术）。B/C/D 错误：LoRa/Sigfox/NB-IoT均为LPWA技术。", "703": "D 正确：定位精度10m不是5G室分对业务的要求（5G室分要求高精度定位亚米级）。A/B/C 正确：高清语音/急速上网100mbps/时延1ms-10ms均为室分业务要求。", "704": "A 正确：科学发展统筹兼顾不是安全生产应急救援体系建设的指导思想和原则。B/C 正确：统一领导分级管理/统筹规划合理布局均属指导原则。", "705": "D 正确：频谱检测不是卫星系统对抗多普勒频移的措施。A/B/C 正确：卫星闭环频率控制/星上多普勒校正/接收机预校正均为抗多普勒措施。", "706": "C 正确：气动效率高不是多旋翼飞行器的优点（多旋翼气动效率低）。A/B 错误：结构简单/成本低廉均为优点。", "707": "D 正确：红光笔不可以检测光缆纤芯熔接衰耗（只能查断点）。A/B/C 正确：OTDR/光功率计+光源/熔接机显示损耗均可测熔接衰耗。", "708": "B 正确：电缆介质渗水不会造成天线故障（渗水是馈线问题，天线故障源于结构破坏）。A/C/D 错误：紫外线辐射破坏/防护罩介质变化/结冰温度循环腐蚀均为天线故障原因。", "709": "A 正确：PCM编码率最高（64kbps）。B/C/D 错误：ADPCM（32k）/CELP（4.8-16k）/AMBE（2.4-9.6k）不符。", "710": "C 正确：“保证200kmph条件下...”错误（LTE设计最大500km/h，高速场景主要保证120km/h），本题选错误项。A/B/D 正确：最大500kmph/低速覆盖/120kmph保障均正确。", "711": "D 正确：153.6KBps数据业务覆盖半径最小（速率越高覆盖越小）。A/B/C 错误：9.6K/19.2K/38.4K速率低覆盖大。", "712": "D 正确：3D全息与其他三种不属于同一类（全息属eMBB，远程驾驶/智能电网/远程医疗属uRLLC）。A/B/C 错误：均属uRLLC类。", "713": "C 正确：AR/VR业务属于eMBB场景应用范围。A/B/D 错误：远程医疗/车联网/无人驾驶属uRLLC。", "714": "C 正确：铁丝不能作为止血带（细硬会切断组织）。A/B/D 错误：皮带/领带/毛巾可作止血带。", "715": "A 正确：整流器故障、负载高压、交流输入故障（主要告警）属于紧急告警组合。B/C/D 错误：告警组合不符（缺关键告警）。", "716": "D 正确：温度告警采集的是数字量。A/B/C 错误：整流告警/门禁告警/水浸告警为开关量。", "717": "A 正确：温度传感器不需电源（热电偶/双金属自发电）。B/C/D 错误：直流传感器/烟雾传感器/水浸传感器需供电。", "718": "D 正确：小区最大发射功率可在小区激活状态下直接修改并生效。A/B/C 错误：中心频点/子帧信息/下行带宽需小区去激活后修改。", "719": "D 正确：RRC不属于用户面协议模块（是控制面协议）。A/B/C 错误：MAC/RLC UM/PDCP均为用户面协议。", "720": "B 正确：塞班不是亚太6D境外关口站（亚太6D境外关口站为吉隆坡/香港/珀斯等）。A/C/D 错误：吉隆坡/香港/珀斯均为境外关口站。", "721": "B 正确：喝醉酒操作导致机床伤手不属于工伤事故（醉酒属不认定工伤情形）。A/C 错误：上下班途中机动车伤害/工作中违规受伤均属工伤。", "722": "D 正确：机油滤清器过脏不是柴油机机油压力故障的原因（滤清器脏不影响压力读数异常）。A/B/C 错误：油封泄漏/调节器失调/传感器故障均为机油压力故障原因。", "723": "C 正确：以太网帧最小不能少于64字节。A/B/D 错误：32/96/48不符。", "724": "D 正确：以太网前导码的用途是比特同步（接收端同步时钟）。A/B/C 错误：MAC帧校验/辅助信息/MAC帧同步不符。", "725": "C 正确：EPON采用点到多点（P2MP）树型拓扑结构。A/B/D 错误：总线型/线型/环型不符。", "726": "A 正确：以太网内网元数据包通过MAC地址寻址。B/C/D 错误：IP/SCTP端口/路由表不符。", "727": "D 正确：支持802.1p协议时最多支持8个优先级队列。A/B/C 错误：4/2/16不符。", "728": "B 正确：以太网端口聚合成聚合端口以软跳关联。A/C/D 错误：硬跳/链路/隧道不符。", "729": "A 正确：以波分复用（WDM）为基础的光网络发展迅速，用于海底、陆地长途干线、本地网及接入网。B/C/D 错误：OTDM/OFDM/光孤子不符。", "730": "B 正确：根据开普勒第三定律估算地球同步卫星轨道半径约为地球半径的60倍（66倍半径对应的估算值60）。A/C/D 错误：40/80/100不符。", "731": "C 正确：7/8\"馈线每百米损耗4dB，馈线长度应小于75米才能保证损耗不大于3dB。A/B/D 错误：65/70/80不符。", "732": "B 正确：移动卫星业务简称MSS（Mobile Satellite Service）。A/C/D 错误：BSS/DAB/GEO不符。", "733": "D 正确：移动通信超短波波长范围是10m～1m（30-300MHz）。A/B/C 错误：波长范围不符。", "734": "A 正确：移动台运动中通信接收信号频率变化称为多普勒效应。B/C/D 错误：阴影/大尺度/小尺度衰落不符。", "735": "A 正确：移动式油机和基站固定式油机不用时每月空载试机至少15分钟。B/C/D 错误：10/9/5不符。", "736": "B 正确：移动式油机启动电池应每半个月充电一次。A/C/D 错误：周/月/季度不符。", "737": "C 正确：移动式发电机组不用时应每月做一次试机或试车。A/B/D 错误：周/半月/季度不符。", "738": "A 正确：铱星系统卫星轨道使用LEO（低地球轨道）。B/C/D 错误：MEO/GEO/EEO不符。", "739": "B 正确：依据运维规程，技术支撑岗负责牵头处理网络共性问题、重大疑难故障。A/C/D 错误：专业管理岗/监控维护岗/运行分析岗不符。", "740": "B 正确：依法取得中国国籍的民用航空器应标明国籍标志和登记标志。A/C 错误：公司标志/机型标志不符。", "741": "B 正确：一条电路通路两个方向能同时传输的工作方式称为双工操作。A/C/D 错误：单工/半双工/人工不符。", "742": "B 正确：北纬地区D、E、F1电离层电子密度夏季比冬季大。A/C/D 错误：一样大/冬季大/一样不符。", "743": "B 正确：一路光载波同时传送多路模拟或数字信号的方法是FDM（频分复用）、TDM（时分复用）。A/C 错误：WDM/CDM组合不符（WDM是波长维度）。", "744": "C 正确：一类事件标准中人口较密集地区发生7.0级以上地震（对网络有特大影响）。A/B/D 错误：5.0/6.0/8.0不符。", "745": "A 正确：上行6GHz下行4GHz地球站与卫星距离约200.05万公里（非精确值，题库取200.05）。B/C/D 错误：数值不符。", "746": "A 正确：“升力变大”说法不正确（换大桨升力增大但题中强调‘不正确’，实际转速变慢、桨盘载荷变小为正确描述，选A为错误说法）。B/C 正确：转速变慢/桨盘载荷变小均正确。", "747": "D 正确：标准基站DCPD10输入电源需要100A空开。A/B/C 错误：16/32/63A不符。", "748": "B 正确：以太网帧最小64字节最大1518字节。A/C/D 错误：尺寸不符。", "749": "A 正确：平滑流线型流动中空气微团接近低压区时会加速（压差加速）。B/C 错误：减速/不变不符。", "750": "B 正确：高清9M视频信号符号率一般是7.2Ms/S。A/C/D 错误：6.1/8.3/9.4不符。", "751": "C 正确：决定卫星通信线路传输质量的主要技术指标是载噪比。A/B/D 错误：EIRP/G-T/天线尺寸频率不符。", "752": "B 正确：典型VSAT系统由若干VSAT小站、一个（或两个以上）大的主站组成。A/C/D 错误：一个/众多/两个不符。", "753": "D 正确：一个VLAN可以看作是一个广播域。A/B/C 错误：管理域/冲突域/自治域不符。", "754": "B 正确：一个REG由频域1个RB、时域1个符号组成。A/C/D 错误：频域4RE/1时隙等不符。", "755": "D 正确：II型机网元最多可同时配到2个复用段环中。A/B/C 错误：4/3/1不符。", "756": "B 正确：IDR新载频开通前必须进行SSOG的FLU（频带功率校准）测试。A/C/D 错误：ELU/ALU/BER不符。", "757": "C 正确：GE接入环全部620A设备、每设备接入1个LTE基站，一个环最多5个节点（环容量限制）。A/B/D 错误：8/10/6不符。", "758": "A 正确：C类地址62台主机最合适子网掩码255.255.255.192（/26支持62主机）。B/C/D 错误：掩码不符。", "759": "D 正确：B类网络5位掩码划分子网，每个子网最多2046台主机（2^11-2）。A/B/C 错误：510/512/1022不符。", "760": "C 正确：一个BWP最少占用24个RB。A/B/D 错误：16/22/32不符。", "761": "B 正确：一个2M通道能传输30个64kBit/s话路。A/C/D 错误：24/31/32不符（31含信令时隙，题库取30）。", "762": "A 正确：一干二干光缆断或全部光纤断造成系统全阻30分钟以上为重大阻断。B/C/D 错误：一小时/二小时/三小时不符。", "763": "D 正确：一般在重大事故应急预案的现场恢复中可同步进行事故调查。A/B/C 错误：筹划/准备/响应不符。", "764": "A 正确：一般卫星系统由控制段、地面段和空间段组成。B/C/D 错误：传播段/传输段/大气层段不符。", "765": "B 正确：一般情况下长途架空杆路杆距为50米±15米。A/C/D 错误：50米/50±10/60±10不符。", "766": "A 正确：用于切换的测量上报IntraFReportCriteria采用事件触发（Event triggered）方式。B/C/D 错误：周期上报/RSRP/A3不符。", "767": "A 正确：架空通信线路跨越铁路时与铁路最小垂直净距是7.5米。B/C/D 错误：8/6.5/7不符。", "768": "B 正确：36V及以下电源对人体安全不构成威胁，通常称为安全电压。A/C/D 错误：56/24/12不符（安全电压上限36V）。", "769": "B 正确：6S锂聚合物电池有7根引出线（6节单芯引出线+1组输出线=7根）。A/C 错误：5根/6根不符。", "770": "A 正确：雷暴单体生命史分积云阶段、成熟阶段、消散阶段。B/C 错误：成风雷雨/温升降雨不符。", "771": "B 正确：天线口径越大其半功率点宽度越小（波束越窄）。A/C/D 错误：大/不变/都可能不符。", "772": "B 正确：天线口径越大半功率点宽度越小。A/C/D 错误：越大/不变/两种可能不符。", "773": "A 正确：射频同轴电缆线径越细，单位长度最大损耗越大（细缆衰减大）。B/C/D 错误：小/不变/都可能不符。", "774": "A 正确：射频同轴电缆线径越细单位长度损耗越大。B/C/D 错误：越小/基本不变/不确定不符。", "775": "B 正确：多旋翼飞行器地面风速大于4级时作业影响安全与拍摄稳定。A/C 错误：2级/6级不符。", "776": "A 正确：LTE系统覆盖受限主要在上行（手机发射功率受限）。B/C 错误：下行/上下行不符。", "777": "D 正确：一般电池放出容量的0.8（80%）就认为电池放尽了。A/B/C 错误：0.5/0.6/0.7不符。", "778": "C 正确：体温降至35℃以下时进入失温状态。A/B 错误：30/33不符。", "779": "D 正确：一般UHD视频源可由4个3G-SDI组成（4×3G=12G）。A/B/C 错误：1/2/3不符。", "780": "B 正确：夜间作业必须有2人以上方可作业。A/C/D 错误：1/3/4不符。", "781": "D 正确：夜间行车前方弯道时灯光照射由路中移到路侧（弯道偏移）。A/B/C 错误：距离不变/由高变低/离开路面不符。", "782": "B 正确：夜间低层逆温会使得早晨有雾和烟幕（逆温层抑制扩散）。A/C 错误：晴朗/大风不符。", "783": "C 正确：业务定级表与分工精简表在CMDB系统的综合管理模块。A/B/D 错误：配置项/维保/资产管理不符。", "784": "A 正确：野外作业人员不得少于2人，并配好通讯工具。B/C/D 错误：5/3/4不符。", "785": "C 正确：野外活动超72小时滴水未进，人在48小时会休克。A/B/D 错误：24/36/72不符。", "786": "D 正确：野外工作车辆驾驶员应具有10万公里以上安全行车经历。A/B/C 错误：4/6/8不符。", "787": "A 正确：野外背囊容量一般不超过50升。B/C/D 错误：30/150/60不符。", "788": "A 正确：用光源、光功率计来进行尾纤的核对。B/C 错误：OTDR/传输分析仪不符。", "789": "C 正确：突发事件保障“一目标”是先中央后地方、先党政军指挥通信后公网通信。A/B 错误：先重要后一般/只党政军不符。", "790": "B 正确：要使光纤导光必须使纤芯折射率大于包层折射率（全反射条件）。A/C/D 错误：小于/渐变/均匀不符。", "791": "B 正确：健全全面从严治党体系，全面推进党的自我净化、自我完善、自我革新、自我提高。A/C/D 错误：自我革命/锤炼/提升不符。", "792": "C 正确：频谱仪测试非常小信号应减小RBW，减小衰减（提高灵敏度）。A/B/D 错误：加大衰减/加大RBW不符。", "793": "C 正确：尽量避免直接睡在地上以免失温（地面散热快）。A/B 错误：避免昆虫/消除感染疾病不符。", "794": "A 正确：220V转-48V直流一般经过变压、整流、滤波、稳压四个步骤。B/C/D 错误：降压/直通/开源不符。", "795": "B 正确：建立除南北极以外全球通信至少需要3颗地球同步卫星。A/C/D 错误：1/5/9不符。", "796": "D 正确：保持基础代谢平均每人每小时需要消耗70卡路里。A/B/C 错误：80/90/60不符。", "797": "A 正确：氧气瓶不可以接触油脂（油脂遇高压氧自燃爆炸）。B/C/D 错误：水/氢气/氮气不符。", "798": "A 正确：正常饮食条件下每天每人需要摄入10克盐。B/C/D 错误：20/30/40不符。", "799": "A 正确：沿大地与空气分界面传播的电波简称地波。B/C/D 错误：天波/直射波/反射波不符。", "800": "D 正确：严重误码秒门限值为1×10-3。A/B/C 错误：1e-6/1e-10/1e-8不符。", "801": "D 正确：严肃稳妥处置不合格党员，保持党员队伍先进性和纯洁性。A/B/C 错误：共产党员/党员干部/干部队伍不符。", "802": "D 正确：严禁在接地线中加装熔断器（接地回路不得断开）。A/B/C 错误：电阻/电容/电感不符。", "803": "C 正确：严禁带电插拔AIFJ1/AIFJ2盘，插拔时必须关闭外接供电设备电源输出开关。A/B/D 错误：XGJ1/S1J1/ESE1不符。", "804": "A 正确：严禁架空交直流电力线进出通信局（站）是防雷的需要（架空线引雷）。B/C/D 错误：接地/防窃听/防盗用不符。", "805": "B 正确：亚洲五号卫星定点东经100.5度。A/C/D 错误：87.5/105.5/110.5不符。", "806": "C 正确：亚音速气流流过收缩管道流速增加、压强下降（连续方程）。A/B 错误：压强增大/速度降低不符。", "807": "C 正确：亚太6D用户波束有90个。A/B/D 错误：70/80/100不符。", "808": "B 正确：亚太6D卫星拥有90个用户波束。A/C/D 错误：26/109/128不符。", "809": "D 正确：亚太6D卫星定点东经134.5度。A/B/C 错误：105.5/110.5/122.5不符。", "810": "C 正确：亚太6D单波束容量达到1Gbps。A/B/D 错误：600M/900M/2G不符。", "811": "D 正确：亚太2R卫星即76.5度星。A/B/C 错误：138/100.5/87.5不符。", "812": "D 正确：压缩式制冷循环四个过程依次为压缩、冷凝、节流、蒸发。A/B/C 错误：顺序不符。", "813": "C 正确：压缩机运转电流过高是由于毛细管堵塞（节流受阻高压偏高）。A/B/D 错误：电源太低/制冷剂太少/风扇转速低不符。", "814": "C 正确：压缩机吸入的制冷剂蒸气为过热蒸气（保证不液击）。A/B/D 错误：饱和/干饱和/过冷蒸气不符。", "815": "D 正确：压缩机低压端吸入的气体应是有一定过热度的过热气体（防液击）。A/B/C 错误：沸腾液/温蒸气/饱和蒸气不符。", "816": "A 正确：压敏电阻是限压型防雷器件（钳位电压）。B/C 错误：限流型/限功率型不符。", "817": "C 正确：压敏电阻具有非线性特性好、泄漏电流小、响应快、无续流和残压水平低等优点。A/B/D 错误：通流容量小/线性/残压高不符。", "818": "B 正确：寻找水源的首选之地是山谷底部（低处汇水）。A/C/D 错误：山区/丛林/平原不符。", "819": "D 正确：失血超过2.24升会引起死亡（人体血量约5L，失血45%致死）。A/B/C 错误：0.5/1/1.5不符。", "820": "C 正确：呼吸暂停伴出血时应同时救护（止血与呼吸恢复并重）。A/B/D 错误：先止血/先呼吸/都不对不符。", "821": "A 正确：学生驾驶员单飞前授权教员签字证明单飞日期之前90天内通过相应飞行考试。B/C 错误：60/30不符。", "822": "A 正确：旋翼机停机坪起降时距其他航空器或障碍物水平距离不少于10米。B/C 错误：20/25不符。", "823": "C 正确：旋翼机下降正确方法是先快后慢（近地减速）。A/B 错误：一直快速/先慢后快不符。", "824": "C 正确：悬停时的平衡不包括前飞废阻力平衡（悬停无前飞阻力）。A/B 错误：俯仰平衡/方向平衡均属悬停平衡。", "825": "D 正确：蓄电池组将多个单体蓄电池串联起来以提高电压。A/B/C 错误：同步/异步/并联不符。", "826": "A 正确：蓄电池通常一般处于浮充状态（恒压浮充电）。B/C/D 错误：均充/恒充/并充不符。", "827": "B 正确：蓄电池深度放电或2只以上浮充电压低于2.18V时应对电池组进行均充。A/C/D 错误：浮充/充电/检测不符。", "828": "A 正确：蓄电池放电终止电压一般为1.8V（单体）。B/C/D 错误：2.4/3.5/5.7不符。", "829": "B 正确：提高前向导频信道增益不能降低前向业务信道平均发射功率（导频功率加大需相应调整）。A/C/D 错误：降低最大发射功率/提高目标FER/降低FCH增益均可降低平均功率。", "830": "A 正确：修改C220的MAC地址老化时间的命令是mac aging-time。B/C/D 错误：其他命令不符。", "831": "C 正确：型号30dB的耦合器耦合损耗为30dB。A/B/D 错误：10/20/40不符。", "832": "B 正确：形成雷暴的基本条件是充足的水汽、不稳定的大气和上升运动。A/C 错误：只水汽上升/浓积云锋区不符。", "833": "B 正确：海陆风对流环流原因是陆地吸收和散发热量比水面快（海陆热力差异）。A/C 错误：水面暖风/水面冷风不符。", "834": "A 正确：行政主要负责人为本单位车辆安全的第一责任人。B/C/D 错误：主要/直接/次要不符。", "835": "A 正确：行波管功放（TWT）功率一般为100-2500W。B/C/D 错误：500-5000/5-50/1-6不符。", "836": "C 正确：行波管高功放工作带宽可达500～600MHz。A/B/D 错误：100-200/300-400/1000-1200不符。", "837": "A 正确：行波管放大器中VSWR告警用于检测反向功率和负载驻波比。B/C/D 错误：正向/双向/饱和功率不符。", "838": "B 正确：星型VSAT网络中两个小站之间通过双跳通信（经主站转发两次）。A/C/D 错误：地面直连/卫星转发器/单跳不符。", "839": "A 正确：星蚀是卫星、地球和太阳共处一条直线上。B/C/D 错误：月亮/火星/彗星不符。", "840": "C 正确：星间链路指从一颗卫星到另外一颗卫星之间的链路。A/B 错误：地球站-卫星/卫星-地球站不符。", "841": "D 正确：信息安全领域最关键最薄弱环节是人。A/B/C 错误：技术/策略/管理制度不符。", "842": "B 正确：信号衰减的单位是dB。A/C/D 错误：MHz/N/km不符。", "843": "B 正确：信号传输速率的单位是Bit/s。A/C/D 错误：BD/s/khit/s/Mit/s不符。", "844": "D 正确：信号传播依赖传播媒质、波长、地形和使用模式（以上都是）。A/B/C 错误：仅一项不完整。", "845": "B 正确：16QAM每个符号携带4bit，传输效率4bits/Hz。A/C/D 错误：2/8/16不符。", "846": "A 正确：信道编码与译码的目的是增强抗干扰能力（纠错）。B/C/D 错误：信息保密/时间同步/带通传输不符。", "847": "C 正确：信标通常用于传送遥测信号，为天线跟踪和传输条件检测提供参考。A/B/D 错误：监视/控制/DVB不符。", "848": "A 正确：新型电信设备采用NFV（网络功能虚拟化）实现软硬件分离。B/C/D 错误：SDN/CDN/OpenStack不符。", "849": "B 正确：新时代十年伟大变革在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有里程碑意义。A/C/D 错误：复兴史/共产主义/革命史不符。", "850": "A 正确：新接入SDH网元采集顺序为网元、盘、端口、交叉、拓扑。B/C/D 错误：顺序不符。", "851": "D 正确：新建避雷带专用引下线固定点间距不大于2m，引下线离墙距离保持10cm。A/B/C 错误：2/6/8不符。", "852": "C 正确：心脏起搏术用手掌猛烈撞击胸骨下部（心前区叩击）。A/B/D 错误：上部/中部/左侧不符。", "853": "A 正确：携号转网查询电信用户编辑短信CXXZ#姓名#身份证号码发送至10001。B/C/D 错误：短信格式不符。", "854": "B 正确：5G基站CU和DU分离架构在PDCP和RLC之间分离（Option 2）。A/C/D 错误：RRC-PDCP/RLC-MAC/MAC-PHY不符。", "855": "A 正确：协议规定载波关断提供补偿的小区可以是1个。B/C/D 错误：2/3/都对不符。", "856": "B 正确：NSA组网方式为Option 3&Option 3A&Option 3X（依托LTE核心网）。A/C/D 错误：Option1&2/Option2&3/Option5&7不符。", "857": "C 正确：小站能收到主站控制信号但VMS网管捕获不到小站状态，是小站发信故障（上报不上来）。A/B/D 错误：频谱仪/主站发信/小站接收故障不符。", "858": "B 正确：小型应急通信车车载卫星天线一般采用Ku频段。A/C/D 错误：C/Ka/L不符。", "859": "B 正确：小型无人机指空机质量小于等于5700千克的无人机（微型轻型除外）。A/C 错误：116/1260不符。", "860": "B 正确：告警“CU未激活DU小区”可能原因是CU小区参数配置错误（如gNodeB配置）。A/C/D 错误：RRU链路/光口/GNSS不符。", "861": "D 正确：小区覆盖过大可能是导频功率过大、天线下倾角过小、天线挂高过高（以上全部都有可能）。A/B/C 错误：仅一项不完整。", "862": "A 正确：消防器材和设备周围（灭火机1米、消火栓3米）不得堆放物品。B/C/D 错误：2/3/4不符。", "863": "C 正确：消防工作贯彻预防为主、防消结合的方针。A/B 错误：谁主管谁负责/以防为主以消为辅不符。", "864": "B 正确：消防工作方针是预防为主，防消结合。A/C 错误：安全第一预防为主/防火第一不符。", "865": "B 正确：向右压盘时无人机左翼升力大于右翼升力（左翼下沉产生右滚）。A/C 错误：右翼大/相等不符。", "866": "A 正确：向后拉杆飞机迎角增大（抬机头）。B/C 错误：减小/先增后减不符。", "867": "D 正确：向OLT报告ONU状态（同步时间戳、是否有数据发送）的MPCP消息是REPORT。A/B/C 错误：REGISTER/GATE/REGISTER_REQ不符。", "868": "C 正确：相同迎角飞行速度增大一倍，阻力增加为原来的四倍（阻力∝速度平方）。A/B 错误：一倍/二倍不符。", "869": "C 正确：相同纬度地球站经度差越大，极化角绝对值越大。A/B/D 错误：为0/越小/不变不符。", "870": "D 正确：相同条件下圆极化波的极化隔离度小于线极化波。A/B/C 错误：大于/等于/基本相等不符。", "871": "C 正确：相同频段3米天线比15米天线增益高6dB（直径差5倍约20log5≈14dB实际取6）。A/B/D 错误：2/4/8不符。", "872": "C 正确：相同频段20米天线比10米天线增益高6dB（面积4倍→20log2≈6dB）。A/B/D 错误：2/4/8不符。", "873": "C 正确：相同耐压两电容并联总电容耐压不变（耐压取决于单电容）。A/B/D 错误：增大/减小/无法确定不符。", "874": "A 正确：相邻频段帧结构配置一致为了规避交叉时隙干扰。B/C/D 错误：阻塞/谐波/二次谐波不符。", "875": "C 正确：相控阵天线采用GPS信号自动捕获并跟踪卫星。A/B/D 错误：广播/LTE/5G不符。", "876": "C 正确：相干检测相同误码率下2PSK信噪比要求最小（PSK抗噪最好）。A/B/D 错误：2ASK/2FSK/2DPSK不符。", "877": "B 正确：LTE取消了RNC网元（扁平化架构）。A/C/D 错误：NodeB保留演进/HSS保留/DRA不符。", "878": "C 正确：限压型SPD之间的线路长度不宜小于5米。A/B/D 错误：3/4/6不符。", "879": "B 正确：卫星解码器常用输入频段是L波段（950-2150MHz中频）。A/C/D 错误：IF/C/Ku不符。", "880": "B 正确：C段IP分8区域每区32个IP，子网掩码为/26（64地址块每区32可用）。A/C/D 错误：25/27/24不符。", "881": "C 正确：接入换双跨汇聚点成环、核心汇聚组环，配置LTE数据时接入层采用LSP1:1+LSP1:1保护。A/B/D 错误：保护组合不符。", "882": "A 正确：现网Ka-VSAT便携站最大传输带宽60Mbps。B/C/D 错误：80/90/100不符。", "883": "A 正确：现网佰才邦Ka-VSAT使用的卫星是中星16号。B/C/D 错误：中卫一号/亚洲五号/中星6B不符。", "884": "D 正确：QCELL部署中如有异厂家射频信源馈入需增加MAU硬件（多运营商接入单元）。A/B/C 错误：BBU/pBridge/pRRU不符。", "885": "D 正确：现阶段NB-IOT不支持切换（静止/低速场景）。A/B/C 错误：硬切换/软切换组合均不符。", "886": "D 正确：现代通信设备常用供电电压为+24V、-24V、-48V（以上皆是）。A/B/C 错误：仅一种不完整。", "887": "A 正确：工作接地、保护接地及防雷接地共用一组接地的接地方式称为联合接地。B/C/D 错误：分散/共同/安全不符。", "888": "C 正确：现场升级CDM625功能可通过FAST码直接实现。A/B/D 错误：FSAT/FTAS/FAS不符。", "889": "A 正确：现场监控单元英文缩写是FSU（Field Supervision Unit）。B/C/D 错误：LSC/CSC/EU不符。", "890": "B 正确：1920×1080p中p表示逐行扫描。A/C/D 错误：隔行/隔帧/逐帧不符。", "891": "D 正确：下雨路面湿滑制动时容易发生横滑或侧滑。A/B/C 错误：熄火/不被发现/视线模糊不符。", "892": "A 正确：下行信道采用半静态的功率分配。B/C/D 错误：动态/静态/半动态不符。", "893": "A 正确：下行功率分配采用静态功率分配的方式。B/C/D 错误：动态/半静态/都不是不符。", "894": "A 正确：下行参考信号是以RE（资源单元）为单位的。B/C/D 错误：RB/REG/CCE不符。", "895": "A 正确：下行SRS权与PMI权自适应中判断切换阈值的SRSSNR来自上行。B/C/D 错误：下行/都可以/都不对不符。", "896": "D 正确：下行DMRS最大支持12个天线端口配置。A/B/C 错误：4/6/8不符。", "897": "A 正确：能见度极好是稳定大气的特征。B/C 错误：能见度较差/阵性降水为不稳定特征。", "898": "C 正确：“杂散干扰是指加于接收机的干扰”说法不正确（杂散干扰是发射机带外发射），本题选不正确项。A/B/D 正确：干扰本质/技术特性分类/互调干扰定义均正确。", "899": "B 正确：4发是指eNodeB端4个发射天线，2收指UE端2个接收天线（4×2MIMO）。A/C/D 错误：收发端对应不符。", "900": "C 正确：光纤损耗决定光纤通信系统的中继距离（选项C表述完整正确）。A/B/D 错误：表述不完整。", "901": "C 正确：PSK抗干扰能力最好（恒定包络相位调制）。A/B/D 错误：FSK/ASK/DPCM不符。", "902": "C 正确：Volcano模型是确定模型（射线跟踪确定性模型）。A/B/D 错误：Uma/Cost231/SPM为统计模型。", "903": "D 正确：智能家居属于mMTC典型应用（海量连接）。A/B/C 错误：远程医疗/VR-AR/自动驾驶属uRLLC/eMBB。", "904": "B 正确：TSS320子架的供电需要SET-UP升压模块电路。A/C/D 错误：TSS320H/TSS5R/TSS5C不符。", "905": "C 正确：CApesso不能进行传播模型校正（是路测分析软件）。A/B/D 错误：AirCom/Atoll/CNP均可校正。", "906": "A 正确：面朝下式人工呼吸救援法是霍格·尼尔森式人工呼吸（俯卧压背法）。B/C/D 错误：Silvester/口对口/Heimlich不符。", "907": "A 正确：“更高的网络流量因为传输的数据变多”不是边缘计算优点（边缘计算减少回传流量），本题选错误项。B/C/D 正确：本地实时处理/低运维成本/低延迟均为优点。", "908": "D 正确：干扰分集不是小区干扰控制的方法（干扰控制有随机化/对消/抑制）。A/B/C 错误：随机化/对消/抑制均为干扰控制方法。", "909": "A 正确：BCCH属于逻辑信道。B/C/D 错误：PDCCH/PUCCH/PUSCH为物理信道。", "910": "B 正确：基于覆盖的切换不属于组网拓扑切换（拓扑切换分频内/频间/基站内）。A/C/D 错误：频内/频间/基站内切换均属组网拓扑切换。", "911": "D 正确：频率规划不合理不属于覆盖问题（是频率干扰问题）。A/B/C 错误：弱覆盖/越区覆盖/无主导小区均属覆盖问题。", "48": "B 正确：中星16号2017年4月发射成功，轨道位置东经110.5度。A/C/D 错误：100.5/122/134度不符。", "49": "C 正确：中星16号一个用户波束直径约500公里。A/B/D 错误：300/400/600公里不符。", "50": "C 正确：中星16号通信系统总容量达到20Gbps。A/B/D 错误：10/15/30Gbps不符。", "51": "C 正确：中星16号业务通信频段为Ka频段。A/B/D 错误：C/Ku/L频段不符。", "52": "C 正确：中星16号是使用Ka频段的通信卫星（高通量）。A/B/D 错误：C/Ku/L不符。", "53": "B 正确：中星16号高通量卫星具有26个用户波束。A/C/D 错误：25/28/30不符。", "54": "C 正确：中星16号具有3个馈电波束。A/B/D 错误：1/2/4不符。", "55": "B 正确：中星16号网络拓扑结构为星状网。A/C/D 错误：网状/总线/混合网不符。", "56": "C 正确：中星16号便携站天线极化方式是圆极化。A/B/D 错误：水平/垂直/椭圆极化不符。", "57": "C 正确：中星16点波束未实现覆盖的领土是新疆。A/B/D 错误：西藏/内蒙古/台湾已覆盖。", "58": "A 正确：中星16Ka频段用户波束有26个。B/C/D 错误：36/60/70不符。", "59": "A 正确：中小型应急通信车车载卫星天线一般采用Ku频段。B/C/D 错误：C/L/Ka频段不符（车载以Ku为主）。", "60": "A 正确：中卫1号卫星经度为87.5°E。B/C/D 错误：100.5/105.5/110.5不符。", "61": "C 正确：中空无人机任务高度一般在1000~7000m之间。A/B 错误：0-100m/100-1000m为低空。", "62": "C 正确：中空飞行按高度分为1000米（含）至6000米。A/B 错误：4500/5400不符。", "63": "A 正确：中继段G652光纤衰减指标合格为0.22dB/km。B/C/D 错误：0.31/0.36/0.4dB超标。", "64": "C 正确：中国提出全球发展倡议、全球安全倡议，愿同国际社会一起落实。A/B/D 错误：和平/治理/合作非标准表述。", "65": "B 正确：中国特色社会主义最本质的特征是中国共产党的领导。A/C 错误：共同富裕、人民当家作主是重要特征而非最本质特征。", "66": "B 正确：中国人民焕发出更为强烈的历史自觉和主动精神。A/C 错误：首创/担当精神非对应表述。", "67": "A 正确：亚太6D通信卫星成功定点于静止轨道东经134.5度。B/C/D 错误：中/低/长椭圆轨道不符。", "68": "D 正确：中国电信现网配置SSB波束数量不能是64（现网SSB波束1-8个，64远超现网配置）。A/B/C 错误：5/6/7个均可配置。", "69": "A 正确：中国电信使用Standalone（独立组网）部署模式。B/C/D 错误：Guarband/In-band/带内部署不符。", "70": "D 正确：中国秉持真实亲诚理念和正确义利观加强同发展中国家团结合作。A/B/C 错误：秩序观/发展观/利益观不符。", "71": "B 正确：中程无人机活动半径为200~800km。A/C 错误：50-200km为近程、>800km为远程。", "72": "A 正确：智能天线每隔5ms进行一次波束赋形。B/C/D 错误：10/15/20ms不符。", "73": "A 正确：致远模式定制网主要用于广域优先性客户（需要广覆盖优先保障）。B/C/D 错误：时延敏感/高隔离高保障/要求不高客户非定制网目标。", "74": "D 正确：脚手板厚度不得小于50mm。A/B/C 错误：10/20/30mm过薄不承重。", "75": "A 正确：指示UE发送RRC连接请求最大次数的计数器是N300。B/C/D 错误：N301/N310/N311不符。", "76": "B 正确：指配频率指指配给电台的频带的中心频率。A/C/D 错误：上限/下限/上下限不符。", "77": "C 正确：指令标志基本型式为圆形边框，图象为白色（如圆形安全指令标志）。A/B 错误：正三角/正方边框不符。", "78": "B 正确：指挥控制与任务规划是无人机地面站的主要功能。A/C 错误：飞行状态监控/飞行视角显示是辅助功能。", "79": "C 正确：只要存在腐败问题产生的土壤和条件，反腐败斗争就一刻不能停。A/B/D 错误：表述不符（标准提法为“土壤和条件”）。", "80": "B 正确：坠落高度离基准面2m以上或有坠落可能的工作均称高空作业。A/C/D 错误：1/3/4m不符。", "81": "A 正确：只能实现透明以太网业务传输、不能实现多端口汇聚的以太网业务类型是EPL（以太网专线点对点）。B/C/D 错误：EPLAN/EVPL/EVPLAN均支持汇聚。", "82": "B 正确：只对源IP地址进行匹配的ACL类型是基本ACL。A/C/D 错误：扩展ACL匹配源目的IP/端口，二层/混合ACL非此匹配。", "83": "D 正确：止血带决不能捆扎在头部、颈部、躯干部（易致窒息坏死），不包括四肢（四肢可捆扎）。A/B/C 错误：头颈躯干均禁扎。", "84": "B 正确：职能部门和单位、部门组织的安全检查每月至少一次。A/C 错误：每半月/每季度不符。", "85": "A 正确：直升机实施悬停回转的高度一般不低于3米。B/C 错误：4/5米不符。", "86": "B 正确：直埋光缆标石出土40±5cm，周围50cm内无杂物。A/C/D 错误：60/50/30±5不符。", "87": "D 正确：直流回路压降指蓄电池放电时，蓄电池输出端的电压与直流设备输入电压之间的电压差。A/B/C 错误：表述不完整。", "88": "B 正确：直流供电回路接头压降1000A以上每百安培≤3mV。A/C/D 错误：2/4/5mV不符。", "89": "A 正确：直流屏内浮充用整流器至尾电池导线按容许电流选择，并按机械强度校核。B/C/D 错误：组合不符。", "90": "A 正确：直流配电设备至高压控制及信号设备的电力线按容许电流选择并校验电压降。B/C/D 错误：组合不符。", "91": "A 正确：直流供电回路电力线按允许电压降计算选择直流电力线时，也要根据导线可能承担的最大电流校核。B/C/D 错误：组合不符。", "92": "D 正确：直流工作接地利用大地作参考零电位，保证各通信设备间参考电位无差异。A/B/C 错误：电池正极/负极/开关电源非参考零电位。", "93": "C 正确：直流负荷800A时供电回路接头压降应≤40mV（每百安培≤5mV×8）。A/B/D 错误：5/24/50不符。", "94": "B 正确：直流电压信号取样线必须加采样熔丝或线保险，取样线短路时不影响整个直流系统。A/C/D 错误：铜耳/空开/单向闸刀不符。", "95": "B 正确：直击雷波形指的是10/350μs波形（雷电直接击中）。A/C/D 错误：8/20μs是感应雷波形，2/50、8/80不符。", "912": "A 正确：ANR（自动邻区关系）功能用于邻区自动规划。B/C/D 错误：ICIC/BF/AMR不符。", "913": "D 正确：用户定位不是MIMO天线可以起到的作用。A/B/C 正确：收发分集/空间复用/赋形抗干扰均为MIMO作用。", "914": "C 正确：国务院、中央军委空中交通管制委员会领导全国飞行管制工作。A/B 错误：国务院/民航局不符。", "915": "B 正确：可用于扑救带电设备电气火灾的灭火剂是干粉灭火剂。A/C/D 错误：泡沫/水/毛巾不符（水导电）。", "916": "A 正确：0.5ms TTI用于提升空口调度时延性能。B/C/D 错误：Massive MIMO/高频谱/OFDMA不符。", "917": "A 正确：白天风由山谷吹向山坡（谷风）。B/C 错误：海陆差异/气流越山不符。", "918": "B 正确：“高峰均比”是OFDM的缺点而非优点描述错误项，本题选描述错误的（高峰均比确实是OFDM缺点但题意为找不是优点的）。A/C/D 正确：频率选择性信道转变/频带利用率高/IFFT-FFT实现均为优点。", "919": "C 正确：mesh网络节点间路由通常由多跳组成。A/B/D 错误：终端主机路由器/需要基础设施/控制中心影响全网均不符（mesh无中心）。", "920": "C 正确：“高频资源丰富将作为主覆盖”描述错误（高频覆盖弱只能热点补充），本题选错误项。A/B/D 正确：高频覆盖弱/低频基础覆盖/高频热点高速均正确。", "921": "B 正确：使用Cab包进行软件升级一般只对主控板有效。A/C/D 错误：F口hub/680网管/初始化680修改mac不符。", "922": "C 正确：应急通信对通信能力的需求是不确定的（应急场景不可预测）。A/B/D 错误：时间地点确定/容量可预测/不分场地实现均不符。", "923": "A 正确：慢衰落场强中值服从对数正态分布。B/C/D 错误：瑞利分布（快衰落）/与位置相关（阴影）/速度取决于移动台不符。", "924": "B 正确：大气分层主要依据是气层气温的垂直分布特点。A/C 错误：气压垂直分布/风垂直变化不符。", "925": "C 正确：RRC不属于用户面协议（是控制面协议）。A/B/D 错误：RLC/GTPU/UDP均为用户面协议。", "926": "D 正确：AS-Path不属于IP报文头内容（是BGP属性）。A/B/C 错误：TTL/DF/TOS均为IP头字段。", "927": "C 正确：CS（载波感应）不是光纤中主要非线性效应（SRS/FWM/SBS是）。A/B/D 错误：SRS/FWM/SBS均为非线性效应。", "928": "D 正确：“边缘计算比云计算更好应该用边缘计算替代”说法错误（两者互补），本题选错误项。A/B/C 正确：设备端到边缘端距离近/云计算受停电影响/边缘端处理均正确。", "929": "B 正确：NAS协议用于UE和MME之间（非接入层）。A/C/D 错误：UE-Eno/EnodeB-EPC等不符。", "930": "C 正确：Ad Hoc网络的路由选择由节点自己完成（无中心多跳路由）。A/B/D 错误：有中心/安全性服务/研究重点不符。", "931": "A 正确：泡沫灭火器应颠倒过来使用（混合药液）。B/C 错误：干粉/二氧化碳不符。", "932": "A 正确：全反射条件为折射率n1必须大于折射率n2且入射角大于临界角（A项表述满足n1>n2）。B/C/D 错误：条件不符。", "933": "D 正确：干线放大器属于室内分布系统所采用器件。A/B/C 错误：无线/光纤直放站/功率直放机属室外或独立系统。", "934": "D 正确：G.655（非零色散位移）光纤可应用10Gb/s以上DWDM大容量传输。A/B/C 错误：G651/G652/G654不符。", "935": "A 正确：GSM不属于第三代移动通信（是2G）。B/C/D 错误：TD-SCDMA/WCDMA/CDMA2000均为3G标准。", "936": "B 正确：卡-50（K-50）直升机采用共轴双旋翼布局。A/C 错误：阿帕奇/海豚不符。", "937": "C 正确：耦合器没有信号放大功能（无源器件）。A/B/D 错误：直放机/有源天线/干线放大器均有放大功能。", "938": "D 正确：浮充电压过低不能造成电池鼓包（鼓包因过充/安全阀故障）。A/B/C 错误：安全阀压力过高/安全阀阻塞/浮充电压过高均可致鼓包。", "939": "B 正确：“只需要熟悉和掌握本专业的应急”说法不对（应急人员需全面掌握），本题选不正确项。A/C 正确：认真记录测试数据/执行维护作业计划均正确。", "940": "A 正确：漏电保护器既可保护人身安全也可保护设备。B/C 错误：安装点后线路/日常不可测试不符。", "941": "D 正确：无线局域网WLAN标准是802.11。A/B/C 错误：802.3（以太网）/802.4/802.5（令牌环）不符。", "942": "C 正确：PUCCH Format 3可以配置多个RB传输。A/B/D 错误：Format 1/2等不符。", "943": "D 正确：5G NR下PUCCH配置特点是灵活长度。A/B/C 错误：系统带宽两端/固定14符号/跳频不符。", "944": "B 正确：DM-RS不是在UCI上传递的信息（是参考信号）。A/C/D 错误：CSI/SR/HARQ均在UCI传递。", "945": "C 正确：“非屏蔽双绞线铜线外都会包裹金属屏蔽层”描述错误（非屏蔽无屏蔽层），本题选错误项。A/B/D 正确：单模高速远距离/100Base-T和10Base-T/集线器中继器物理层均正确。", "946": "D 正确：突发事件的种类不属于预警级别划分依据（依据危害程度/紧急程度/发展态势）。A/B/C 错误：危害程度/紧急程度/发展态势均为划分依据。", "947": "D 正确：带宽管理不是OAM主要功能（OAM含告警抑制/性能管理/保护倒换）。A/B/C 错误：告警抑制/性能管理/保护倒换均为OAM功能。", "948": "D 正确：“PBX可承载数据业务”描述错误（PBX是语音交换），本题选错误项。A/B/C 正确：IMS融合固移网络/分部IAD与总部IP PBX互通/IAD接入量32线以内均正确。", "949": "B 正确：平流层特点是空气没有上下对流（层流稳定）。A/C 错误：几乎无水蒸气（对流层上部）/高度升高气温下降（对流层）不符。", "950": "C 正确：“空气上下对流激烈”不属于平流层特点（对流层特点），本题选不属于项。A/B 正确：风向风速不变/温度大体不变平均-56℃均为平流层特点。", "951": "C 正确：RSL信令链路采用LAPD协议。A/B/D 错误：MTL/XBL/OML不符。", "952": "D 正确：消光比不是时钟的参数（是光模块参数）。A/B/C 错误：频偏/失步范围/MTIE均为时钟参数。", "953": "A 正确：eMTC是支持语音的物联网无线技术。B/C/D 错误：SigFox/LoRa/NB-IOT（早期不支持语音）不符。", "954": "B 正确：PUSCH是上行信道。A/C/D 错误：PHICH（下行）/PBCH（下行）/PMCH（下行）不符。", "955": "A 正确：环形网络结构网络生存性最好（自愈）。B/C/D 错误：线形/星形/树形不符。", "956": "B 正确：无人机教员等级申请人要求是在所申请的无人机上担任机长经历等条件。A/C 错误：应急程序/飞行经历时数非必要条件。", "957": "A 正确：因为空气总是寻找低压区域，风从高压吹向低压（气压梯度力）。B/C 错误：寻找高压/风产生压力不符。", "958": "D 正确：“一个端口不属于一个VLAN”说法错误（端口必须属于VLAN），本题选错误项。A/B/C 正确：VLAN建立出口/UNTAG区别/VLAN三个操作均正确。", "959": "B 正确：“PHB指的是用户给业务指定...”说法错误（PHB是每跳行为由DSCP映射），本题选错误项。A/C/D 正确：620A业务中/660设备08槽位/DSCP指定后行为均正确。", "960": "B 正确：旋翼直径越大则悬停诱导速度说法错误（直径大诱导速度反而小），本题选错误说法。A/C 正确：直径大拉力大/桨盘载荷小均正确。", "961": "D 正确：“OLT上不能添加未上电的ONU”说法不正确（OLT可预配置未上电ONU），本题选不正确项。A/B/C 正确：GEMPORT是GPON复用/ODN在OLT和ONU间提供传输/EPON帧相比均正确。", "962": "C 正确：320×240分辨率、32位色质量最好（同分辨率位色深越高质量越好）。A/B/D 错误：24位色/16位色或低分辨率不符。", "963": "B 正确：骨架式结构光缆属于光缆的结构方式。A/C/D 错误：低密度/复合式/无金属光缆不符。", "964": "C 正确：eNB（演进型基站）属于4G基站。A/B/D 错误：BTS（2G）/NodeB（3G）/NR（5G）不符。", "965": "A 正确：QCIF分辨率最低（176×144）。B/C/D 错误：CIF/4CIF/16CIF分辨率更高。", "966": "A 正确：G.811时钟信号精度最高（基准主时钟PRC）。B/C/D 错误：G.812转接/本地/SETS精度次之。", "967": "D 正确：GSM手机不会对WLAN产生电磁干扰（蜂窝频段远离2.4GHz）。A/B/C 错误：微波炉/蓝牙设备/无线接入点均工作在2.4GHz产生干扰。", "968": "B 正确：分光器造成光损耗最大（插入损耗大）。A/C/D 错误：熔接点/适配器/光功率计损耗小。", "969": "D 正确：测试光纤损耗的仪表是光功率计和OTDR。A/B/C 错误：熔接机/万用表不符。", "970": "C 正确：自转旋翼式不属于直升机（是旋翼机，无动力驱动旋翼）。A/B 错误：单旋翼带尾桨/共轴双旋翼均属直升机。", "971": "A 正确：山坡迎风面对空气的抬升属于动力对流冲击力（地形抬升）。B/C 错误：辐合辐散/气温变化不符。", "972": "C 正确：发射机与接收机之间有边缘阻挡时电波将发生绕射（衍射）。A/B/D 错误：自由空间/体积大的障碍/粗糙表面不符。", "973": "B 正确：DTX（不连续发射）不能改善多径衰落现象。A/C/D 正确：信道编码/跳频/交织均可抗多径衰落。", "974": "A 正确：BPSK抗干扰能力最强（频带利用率最低但最鲁棒）。B/C/D 错误：QPSK/16QAM/64QAM调制阶数越高抗噪越差。", "975": "C 正确：减小放电电流可较大地放出电池容量（小电流放电容量大）。A/B 错误：过放电/增大放电电流不符。", "976": "B 正确：doc不是性能管理输出报告的格式。A/C/D 错误：txt/pdf/xml均为输出报告格式。", "977": "C 正确：洲际通信不属于无线自组网应用场景（自组网局域/军事/办公）。A/B/D 错误：军事应用/移动办公/家庭局域网均为自组网场景。", "978": "B 正确：H.323不属于ITU语音标准化方案（是多媒体通信协议）。A/C/D 错误：G.728/G.721/G.722均为语音编码标准。", "979": "A 正确：1秒不是LTE OMC性能管理支持的时间颗粒（支持5/15/60分钟）。B/C/D 错误：5分钟/15分钟/60分钟均为支持颗粒。", "980": "C 正确：低速飞行和高速飞行都会超过临界迎角（都会，选C）。A/B 错误：仅低速/仅高速不符。", "981": "B 正确：IP协议连通测试工具是ping。A/C/D 错误：Ipconfig/tcp/route不符。", "982": "D 正确：“指针调整技术降低了设备复杂度”不是SDH网特点（指针调整增加复杂度），本题选不是项。A/B/C 正确：统一接口标准/软件配置/复用映射灵活均为SDH特点。", "983": "B 正确：“基站和UE之间仍处于上下行数据传输”不属于RRC Inactive特征（Inactive无数据传输），本题选不属于项。A/C/D 正确：基站核心网保持UE连接/避免频繁信令/避免频繁耗电均为Inactive特征。", "984": "B 正确：L2VPN业务需要配置VC（虚电路）。A/C/D 错误：都需要/L3VPN/都不需要不符。", "985": "C 正确：光纤通信优点包括不受电磁干扰。A/B/D 错误：传输功率宽（不符）/传输损耗大（是缺点）/质量轻（非主要优点）不符。", "986": "C 正确：如果一个物体处于平衡状态则其受力平衡（C表述正确）。A/B 错误：牛顿第三定律表述/第二定律作用力表述不符。", "987": "B 正确：太阳不能帮助我们寻找水源（动物/植物/河流可指引水源）。A/C/D 错误：动物/植物/河流均能帮助寻水。", "988": "D 正确：所属机房不存在不可能在传输电路核查中出现（核查Z端/路由/A端端口）。A/B/C 错误：Z端设备不存在/调度路由不存在/A端端口不存在均为核查错误类型。", "989": "A 正确：Iu不是LTE无线侧接口（是3G接口）。B/C/D 错误：X2/S1/Uu均为LTE无线侧接口。", "990": "A 正确：光缆接头处属于必须设置标石的部位。B/C/D 错误：外露地段/农田/直线经过（有埋深变化才设）不符。", "991": "C 正确：前传网组网范围是RRU-DU之间。A/B/D 错误：DU-CU（中传）/CU-UP（回传）/DU-DU不符。", "992": "D 正确：小区掉话率与容量估算无关（是质量指标）。A/B/C 错误：小区吞吐量/单用户速率/用户数量均为容量估算要素。", "993": "B 正确：SDCCH、SACCH、FACCH均为专用信道。A/C/D 错误：AGCH/RACH/BCCH为公共信道。", "994": "D 正确：电气接头表面污损接触电阻增大不是造成过负荷的主要原因（是过热原因）。A/B/C 错误：设计安装选型不正确/随意装接增负荷/检修不及时均为过负荷主要原因。", "995": "B 正确：下行失步时上行数据到达不是随机接入的场景（下行失步应下行数据到达触发）。A/C/D 错误：RLF重建立/切换后接入/上行失步下行数据到达均为随机接入场景。", "996": "A 正确：30N0003为2M速率电路的电路编号。B/C/D 错误：GE0007（GE）/1S0004/FE0001（FE）不符。", "997": "C 正确：60ms不是RACH周期（RACH周期为10/40/80/160ms等）。A/B/D 错误：10/40/160ms均为正确周期。", "998": "D 正确：Telnet是应用层协议。A/B/C 错误：IP/UDP/TCP为网络层/传输层协议。", "999": "D 正确：LDP不是路由协议（是标签分发协议）。A/B/C 错误：BGP/ISIS/OSPF均为路由协议。", "1000": "C 正确：ZEBOS.CFG为680设备交叉配置文件。A/B/D 错误：maconf/SCUR1.tar/netConfig.sh不符。", "1001": "A 正确：1.6MHz不是LTE采用的带宽（LTE带宽1.4/3/5/10/15/20MHz）。B/C/D 错误：3/5/15MHz均为LTE带宽。", "1002": "A 正确：低频段波长范围大于1千米（VLF/LF波长千米级）。B/C/D 错误：中频/高频/甚高频波长更短。", "1003": "C 正确：响应不是切换的步骤（切换步骤为测量、判决、执行）。A/B/D 错误：测量/判决/执行均为切换步骤。", "1004": "A 正确：logicalChannelSR-Mask使得BSR和SR的timer所有的逻辑信道只有一个（掩码限制）。B/C/D 错误：参数不符。", "1005": "C 正确：1X EV-DO前向信道以时分方式（时分复用）。A/B/D 错误：CDMA2000 1X EV-DO描述/1X前向/IS-95前向时分不符。", "1006": "D 正确：10位的综合型密码最安全（长度+复杂度）。A/B/C 错误：用户名相同/身份证后6位/重复8位数均不安全。", "1007": "D 正确：双渔人结可以连接两条直径不同的绳索。A/B/C 错误：水结/平结/交织结不符。", "1008": "B 正确：《中华人民共和国民用航空法》级别最高（法律）。A/C 错误：飞行基本规则/搜寻援救规定为行政法规或规章。", "1009": "C 正确：“分级领导，统一指挥”错误（应急预案体系应统一领导、分级管理），本题选错误项。A/B/D 正确：遵守法规/保障人员安全优先/充分利用现有资源突出保障均为原则。", "1010": "B 正确：无线自组网又称移动Ad hoc网络。A/C/D 错误：非对称/需要基站/固定路由器均不符（自组网无中心）。", "1011": "D 正确：“天线发射端的信号功率比天线输入端的信号功率大”不正确（天线是无源器件功率守恒），本题选不正确项。A/B/C 正确：电信号转电磁波/电磁波转电信号/双向器件均正确。", "1012": "A 正确：交叉连接设备与交换机两者都能提供动态的通道连接。B/C/D 错误：输入输出单用户/变动时间相同/网管配置不符。", "1013": "D 正确：“火灾时通过阳台窗户跳楼逃生”方法错误（高处跳楼危险），本题选错误项。A/B/C 正确：逃生通道/低头弯腰爬行/就地打滚均正确。", "1014": "C 正确：共轴双旋翼直升机旋翼既是升力面又是纵横向和航向操纵面（两旋翼差动）。A/B 错误：只升力/只操纵不符。", "1015": "C 正确：OTDR可测量光缆长度、损耗及故障点位置。A/B/D 错误：绝缘电阻/接续/误码率不符。", "1016": "C 正确：OTDR可测量光缆长度、损耗及故障点位置。A/B/D 错误：绝缘/接续/误码不符。", "1017": "D 正确：“A类地址拥有最多的网络数”错误（A类网络数126最少，主机数最多），本题选错误项。A/B/C 正确：32位/网络+主机/ C类8位主机地址均正确。", "1018": "C 正确：Option3a/7a都是基于LTE核心网的NSA组网（5G侧无控制面）。A/B/D 错误：Option3/7/4组合/Option4适用场景/Option3/3a/3x描述不符。", "1019": "D 正确：Cell-specific（小区级）DL/UL分配是R15 NR的slot format特征。A/B/C 错误：60KHz支持/UE-specific/slot修改不符。", "1020": "C 正确：Cell-specific的DL/UL slot分配方式说法正确。A/B/D 错误：修改以slot/60KHz支持/UE-specific不符。", "1021": "D 正确：插入损耗不是OTU盘测试指标（-20dB谱宽/边模抑制比/消光比是）。A/B/C 错误：谱宽/边模抑制比/消光比均为OTU盘测试指标。", "1022": "C 正确：对称电缆的线路衰耗频率特性呈现弯曲线（衰耗随频率非线性变化）。A/B/D 错误：电缆射线/明线斜直线/同轴斜直线不符。", "1023": "B 正确：“形状阻力是由于空气和飞行器之间摩擦产生”错误（形状阻力由压差产生，摩擦阻力是蒙皮摩擦），本题选错误项。A/C 正确：黏性阻力/蒙皮摩擦阻力描述均正确。", "1024": "C 正确：打开空调设备周围门窗对空调维护有不利影响（破坏环境温湿度控制）。A/B/D 正确：温度调节适当/定期清洁过滤器冷凝器/室内机避阳光直射均有利。", "1025": "B 正确：尺寸不是用来描述天线性能的参数（增益/半功率角/前后比是）。A/C/D 错误：增益/半功率角/前后比均为天线性能参数。", "1026": "D 正确：双声道、8位量化、44.1kHz采样波形声音最好（采样率最高）。A/B/C 错误：22.05/24.1kHz采样率低不符。", "1027": "D 正确：结电容和负载电感的LC时间常数不是影响雪崩二极管响应速度的因素（是RC）。A/B/C 错误：倍增时间/渡越时间/RC时间常数均为影响因素。", "1028": "D 正确：无规律性不属于电磁波特性（电磁波具有复用性/非耗竭性/有限性）。A/B/C 错误：复用性/非耗竭性/有限性均为电磁波特性。", "1029": "D 正确：由洋流方向形成的积雨云不是暴雨产生的物理条件（暴雨条件为水汽/上升气流/不稳定层结）。A/B/C 错误：水汽供应/上升气流/大气不稳定均为暴雨物理条件。", "1030": "C 正确：快速反应争分夺秒不是应急预案体系建设的基本原则。A/B/D 正确：遵守法规/充分利用资源突出保障/统一领导分级指挥均为原则。", "1031": "D 正确：横版图形与英文字体组合不是国家应急通信标识标准组合（标准组合含竖版/横版/横版图形+中英文字体）。A/B/C 错误：竖版/横版/横版图形中英文组合均为标准组合。", "1032": "D 正确：采用数字同步技术不必进行码变换不是WDM主要优点（WDM优点为充分利用光纤资源/同时传输多类型信号/组网灵活）。A/B/C 错误：均为WDM优点。", "1033": "D 正确：L波段大气衰耗最小（频率低）。A/B/C 错误：X/C/Ku波段频率高衰耗大。", "1034": "A 正确：两纤复用段保护是SDH保护方式，WDM系统不能采用（WDM用光线路/光通道保护）。B/C/D 错误：光线路1+1/1:1/SDH 2纤环/光通道保护WDM均可用。", "1035": "C 正确：OTDR不可以测量光缆重量。A/B/D 错误：光纤距离/光纤损耗/断点位置均可测。", "1036": "D 正确：光功率计和OTDR可以测试光纤损耗。A/B/C 错误：熔接机/万用表不符。", "1037": "B 正确：E-NodeB（eNB）属于E-UTRAN网元。A/C/D 错误：S-GW/MME/EPC为核心网网元。", "1038": "A 正确：G.652光纤在1310nm窗口色散系数为0（零色散点1310nm）。B/C/D 错误：G.653零色散1550/G.654/G.655不符。", "1039": "A 正确：个体防护是保护人身安全的最后一道防线。B/C/D 错误：隔离/避难/救援不符。", "1040": "B 正确：“飞行员应把垂直下降作为主要下降方式”错误（垂直下降非正常方式），本题选错误项。A/C 正确：防止下降率过大/海上低能见度垂直下降注意均正确。", "1041": "A 正确：下滑有利速度使飞机下滑阻力最小（最佳滑翔）。B/C 错误：下滑角最大/升力最大不符。", "1042": "B 正确：下变频器英文缩写为D/C（Down Converter）。A/C/D 错误：U/C（上变频）/DA/CP不符。", "1043": "D 正确：OTN设备区别于以往波分设备的是光交叉部分（OTN引入电交叉/光交叉）。A/B/C 错误：光监控信道/光传输放大/收发有源部分为共有部分。", "1044": "A 正确：非线性器件产生组合频率成分落入通带造成干扰称互调干扰。B/C/D 错误：邻道/多址/同频干扰不符。", "1045": "B 正确：系统内异频邻区上限为128个。A/C/D 错误：64/32/256不符。", "1046": "A 正确：GPS测试不属于系统内干扰测试（系统内干扰测试含功放杂散/双工器隔离/天馈系统）。B/C/D 错误：功放杂散/双工器隔离度/天馈系统测试均为干扰测试类型。", "1047": "D 正确：系统分配时隙补偿各个ONU距离的差距，避免ONU之间碰撞（测距）。A/B/C 错误：运行时间/注册时间/类型不符。", "1048": "A 正确：系留系统地面供电电压是交流220V或交流380V。B/C/D 错误：直流供电不符。", "1049": "B 正确：系留无人机主要使用重于空气的动力驱动的航空器。A/C/D 错误：轻于/等于/不确定不符。", "1050": "B 正确：系留无人机执行任务中地面护栏安全半径为100米。A/C/D 错误：50/150/200不符。", "1051": "C 正确：系留无人机系统允许起飞的天气条件是6级风。A/B/D 错误：10级风/暴雨/大雾均不允许。", "1052": "D 正确：系留无人机系统由系留空中子系统、地面子系统、控制子系统组成（以上均是）。A/B/C 错误：仅一项不完整。", "1053": "B 正确：系留无人机主要特点是单次飞行时间长、机动飞行能力差（系留供电长时间滞空）。A/C/D 错误：机动能力强/时间短均不符。", "1054": "D 正确：系留无人机应用领域包括应急通信、消防监控、夜间照明（以上均是）。A/B/C 错误：仅一项不完整。", "1055": "A 正确：系留无人机系统地面供电电压是交流220V或交流380V。B/C/D 错误：直流供电不符。", "1056": "B 正确：系留无人机通过转速控制飞行高度与角度（旋翼转速调节）。A/C/D 错误：总距杆/尾桨/遥控器不符。", "1057": "A 正确：系留无人机每飞行20小时做预防性维护，每50小时做一般性维护。B/C/D 错误：小时数不符。", "1058": "D 正确：系留无人机螺旋桨材质是碳纤维（轻且强度高）。A/B/C 错误：轻质木材/塑料/铝不符。", "1059": "C 正确：系留无人机飞行时间指自旋翼开始转动至旋翼停止转动的全部时间。A/B/D 错误：离地接地/滑跑时间不符。", "1060": "D 正确：系留无人机地面站显示信息不包括基站状态数据。A/B/C 正确：地面系留电源/机载系留电源/飞行状态数据均为显示信息。", "1061": "B 正确：系留无人机搭任务设备重量受飞机载重能力限制。A/C/D 错误：飞机自重/最大起飞能力/最大高度不符。", "1062": "A 正确：系留备降电池作用是在地面供电异常时为系留无人机提供应急供电。B/C/D 错误：调整重心/长时间飞行/均是均不符。", "1063": "C 正确：系留备降电池单片电芯标准存放电压3.8V。A/B/D 错误：3.6/3.7/4.2不符。", "1064": "A 正确：依靠科技提高应急管理的科学化、专业化、智能化、精细化水平。B/C/D 错误：自动化/精准化组合不符。", "1065": "A 正确：习近平新时代中国特色社会主义思想实现了马克思主义中国化、时代化新的飞跃。B/C 错误：大众化组合不符。", "1066": "D 正确：实施国家大数据战略要加快构建高速、移动、安全、泛在的新一代信息基础设施。A/B/C 错误：机动/全面/可靠组合不符。", "1067": "D 正确：雾天视线不良应随时注意行人车辆动态并低速行驶。A/B/C 错误：连续鸣喇叭/正常速度/开远光灯均危险。", "1068": "D 正确：雾天对安全行车的主要影响是能见度低、视线不清。A/B/C 错误：熄火/侧滑/阻力增大不符。", "1069": "C 正确：物联网卡在自动驾驶领域主要利用5G低时延特性。A/B/D 错误：高带宽/广连接/基站密不符。", "1070": "C 正确：物理层小区ID分为168组（每组3个ID共504个）。A/B/D 错误：3/32/504不符。", "1071": "A 正确：无源接收天线目的为提取有用信号输入接收机，同时使噪声信号变为最小。B/C/D 错误：增益/干扰/调制不符。", "1072": "A 正确：无效劳动合同自订立之日起无效。B/C/D 错误：发现日/法院判决/仲裁裁决不符。", "1073": "B 正确：无线信号自由空间传播距离每增大一倍信号强度减小6dB（平方反比）。A/C/D 错误：3/9/12不符。", "1074": "C 正确：无线网络规划流程为需求分析→拓扑设计→传播模型校正→仿真验证→输出报告（acdbe）。A/B/D 错误：顺序不符。", "1075": "B 正确：无线通信中无线电波传播主要依靠空间波。A/C/D 错误：地面波/衍射波/散射波不符。", "1076": "B 正确：自由空间传播损耗与频率的2次方成正比（∝f²）。A/C/D 错误：1/3/4不符。", "1077": "D 正确：自由空间传播损耗距离增加一倍损耗增加6dB。A/B/C 错误：2/3/4不符。", "1078": "C 正确：无线局域网MAC协议是CSMA/CA（载波监听多址/冲突避免）。A/B/D 错误：CSMA/CD/TDMA/CSMA/CS不符。", "1079": "A 正确：无线局域网WLAN传输介质是无线电波。B/C/D 错误：红外线/载波电流/卫星通信不符。", "1080": "A 正确：无线电噪声是在射频频段内的噪声。B/C/D 错误：长波/超短波/载频不符。", "1081": "D 正确：无线电频率上限一般为3000GHz（3THz）。A/B/C 错误：3/30/300GHz不符。", "1082": "C 正确：dBm是功率单位（功率分贝毫瓦）。A/B/D 错误：电压/带宽/增益不符。", "1083": "D 正确：无线电管理实行统一领导、统一规划、分工管理、分级负责的原则。A/B/C 错误：分工执行/负责/安排不符。", "1084": "C 正确：无线电波真空中传播速度是3×10⁸m/s。A/B/D 错误：1/2/4×10⁸不符。", "1085": "A 正确：无线电波一般指波长由100000米到0.75毫米的电磁波。B/C/D 错误：波长范围不符。", "1086": "B 正确：无线电波波长和频率成反比（λ=c/f）。A/C/D 错误：正比/等比/都不是不符。", "1087": "D 正确：无线电波电场关于地面的方向称为电波极化方向。A/B/C 错误：传播方向/磁场方向/磁场关于地面不符。", "1088": "A 正确：无线电波传输中电场和磁场在空间相互垂直。B/C/D 错误：平行/锐角/无关系不符。", "1089": "A 正确：无线传输快衰落服从瑞利分布。B/C/D 错误：正态/高斯/阴影不符。", "1090": "A 正确：无刷电机与有刷电机区别是无刷电机效率较高（无换向损耗）。B/C 错误：有刷高/差不多不符。", "1091": "A 正确：无人机注册证书颁发给飞机所有者作为注册证明，应随时随机携带（飞行时随身携带备查）。B/C 错误：存放备查/售出证明不符。", "1092": "C 正确：无人机系统机长指负责整个无人机系统运行和安全的驾驶员。A/B 错误：操控人/协助操控人不符。", "1093": "B 正确：无人机燃油箱通气目的之一是保证向发动机正常供油（平衡气压）。A/C 错误：增大/减小供油流量不符。", "1094": "C 正确：无人机配平主要考虑沿纵轴前后位置的重心。A/B 错误：气动焦点/发动机不符。", "1095": "A 正确：无人机年度检查要求至少一年一次。B/C 错误：两年一次/视状态不符。", "1096": "B 正确：无人机计算装载重量和重心方法有计算法、图表法和查表法。A/C 错误：试凑法/约取法不符。", "1097": "B 正确：无人机飞行员向前推杆飞机迎角减小（低头）。A/C 错误：增大/先减后增不符。", "1098": "A 正确：操纵升降舵时飞机绕横轴做俯仰运动。B/C 错误：纵轴滚转/立轴偏转不符。", "1099": "B 正确：操纵副翼时飞机绕纵轴做滚转运动。A/C 错误：横轴俯仰/立轴偏转不符。", "1100": "C 正确：操纵方向舵时飞机绕立轴做偏转运动（偏航）。A/B 错误：横轴俯仰/纵轴滚转不符。", "1101": "B 正确：无人机电气系统中电源和配电系统两者组合统称为供电系统。A/C 错误：用电设备/供电线路不符。", "1102": "B 正确：无人机电气系统一般包括电源、配电系统、用电设备3个部分。A/C 错误：电缆接插件/供电系统组合不符。", "1103": "B 正确：起落架轮式着陆是有些无人机采用的回收方式（B表述正确）。A/C 错误：中空回收需大飞机/拦截网是主要方式不符。", "1104": "C 正确：容器式发射装置是一种封闭式发射装置（无人机封装发射）。A/B 错误：地面发射使用较短/轨道式发射装置不符。", "1105": "B 正确：无人机地面站显示系统应能显示飞机状态及链路、载荷状态信息。A/C 错误：飞行员状态/飞行空域信息不符。", "1106": "A 正确：无人机地面站系统不包括机载电台（机载电台属机载设备）。B/C 错误：无人机控制站/载荷控制站均属地面站系统。", "1107": "C 正确：重力供油系统装增压泵主要保证爬升、下降及其它特殊情况供油。A/B 错误：减少剩余燃油/大速度巡航不符。", "1108": "C 正确：无码告警红灯亮表示无接收信号。A/B/D 错误：信号全1/全零/失步不符。", "1109": "A 正确：单独接地保护或与零线重复接地保护，接地电阻应不大于10欧。B/C/D 错误：2/5/7欧不符。", "1110": "B 正确：雪屋室温不低于零下10度，点一支蜡烛可使室温提高4度。A/C/D 错误：3/5/6不符。", "1111": "C 正确：Web服务器受HTTP协议本身安全问题困扰属设计型漏洞（协议设计缺陷）。A/B/D 错误：开发型/运行型/验证型不符。", "1112": "D 正确：无法切断电源时应用不导电灭火剂灭火，不要用水及泡沫（导电）。A/B/C 错误：电能/电路/电流不符。", "1113": "A 正确：终端设备搜索到的WIFI名称在WIFI术语里叫SSID。B/C/D 错误：无线桥接/分布式系统/中继不符。", "1114": "C 正确：我们拥有九千六百多万名党员的马克思主义政党更加团结统一。A/B/D 错误：党员数不符。", "1115": "A 正确：全面深化改革许多领域实现历史性变革、系统性重塑、整体性重构。B/C/D 错误：结构性/全面性/战略性不符。", "1116": "D 正确：落实新时代党的建设总要求，健全全面从严治党体系。A/B/C 错误：总目标/总任务/总方针不符。", "1117": "A 正确：短波自适应通信通常指频率自适应。B/C/D 错误：功率/速率/分集自适应不符。", "1118": "C 正确：隆重庆祝建党百年、建国七十周年，制定第三个历史决议。A/B/D 错误：第一/二/四个不符。", "1119": "D 正确：脱贫攻坚战全国八百三十二个贫困县全部摘帽，近一亿农村贫困人口实现脱贫。A/B/C 错误：七千万/八千万/九千万不符。", "1120": "B 正确：全社会研发经费支出从一万亿元增加到二万八千亿元，居世界第二。A/C 错误：第一/第三不符。", "1121": "C 正确：我们党坚守初心使命，始终成为中国特色社会主义事业的坚强领导核心。A/B/D 错误：后盾/支撑/力量不符。", "1122": "D 正确：持之以恒正风肃纪，以钉钉子精神纠治“四风”。A/B/C 错误：斗争/法治/战斗精神不符。", "1123": "B 正确：23dBm约等于0.2W（10^(2.3)mW≈200mW）。A/C/D 错误：0.15/0.25/0.3不符。", "1124": "D 正确：我国自主研发的3G标准是TD-SCDMA。A/B/C 错误：WCDMA/CDMA2000/GPRS不符。", "1125": "A 正确：我国制造业规模、外汇储备稳居世界第一。B/C 错误：第二/第三不符。", "1126": "C 正确：我国将事故应急预案分为5级。A/B/D 错误：3/4/6级不符。", "1127": "B 正确：我国数字同步网采用主从同步方式。A/C/D 错误：相互同步/准同步/其他不符。", "1128": "C 正确：我国数字集群上行链路频段范围是806～821MHz。A/B/D 错误：410-420/450-460/870-888不符。", "1129": "B 正确：我国首颗Ku高通量卫星是亚太6D。A/C/D 错误：中星16（Ka首颗）/天通/亚洲9号不符。", "1130": "A 正确：我国首颗Ka高通量卫星是中星16。B/C/D 错误：亚太6D/亚洲九号/天通一号不符。", "1131": "A 正确：我国首个Ku频段高通量宽带卫星是亚太6D。B/C/D 错误：中星16号（Ka）/中星6A/天通一号不符。", "1132": "D 正确：我国能收到信号的静止卫星范围从东经50度到东经180度。A/B/C 错误：120/150/160不符。", "1133": "C 正确：我国民航飞行使用的时间为世界协调时（UTC）。A/B 错误：地方时/北京时不符。", "1134": "C 正确：我国集群下行链路频段范围是851～866MHz。A/B/D 错误：420-430/460-470/915-933不符。", "1135": "B 正确：基础研究和原始创新不断加强，进入创新型国家行列。A/C 错误：研究型/科技型不符。", "1136": "C 正确：我国国内信令网中信令点编码位长为24位。A/B/D 错误：12/2/32不符。", "1137": "A 正确：我国国内信令网采用24位全国统一编码，国际间采用14位编码。B/C/D 错误：位长组合不符。", "1138": "A 正确：我国对电信终端设备、无线电通信设备实行进网许可制度。B/C/D 错误：设备范围不符。", "1139": "B 正确：我国电视标准规定采用PAL制式。A/C 错误：NTSC/SECAM不符。", "1140": "A 正确：我国第一部关于电信业的综合性行政法规是《电信条例》。B/C/D 错误：电信法/管理办法/运行条例不符。", "1141": "A 正确：货物贸易总额居世界第一，吸引外资和对外投资居世界前列。B/C/D 错误：第二/第三/第四不符。", "1142": "B 正确：我国安全生产方针是安全第一、预防为主、综合治理。A/C/D 错误：组合不符。", "1143": "C 正确：我国2M复用成AUG步骤为C12→VC12→TU-12→TUG-2→TUG-3→AU-4→AUG（C表述正确）。A/B/D 错误：复用步骤不符。", "1144": "C 正确：同属水平极化其他方向信号正常，故障点不可能在卫星上对应转发器故障（转发器故障影响全部水平极化）。A/B/D 错误：天线跑偏/水平LNA故障/水平线路故障均只影响本方向。", "1145": "B 正确：温湿度传感器固定在靠近主设备和电源设备背后墙面上，距地面高度1.6-1.8米。A/C/D 错误：1/2/3米不符。", "1146": "D 正确：温湿度传感器固定在靠近主设备和电源设备背后的墙面上。A/B/C 错误：仅主设备/仅电源/柜机不符。", "1147": "D 正确：静止轨道通信卫星相对地球并不静止，会在轨道上漂移（相对地球近乎静止但有漂移）。A/B/C 错误：绝对静止/相对地心/重心静止不符。", "1148": "A 正确：海上碧空中的积云通常表明下面有一片陆地（岛屿热力抬升成云）。B/C/D 错误：雨层云/卷云/高积云不符。", "1149": "A 正确：未经安全生产教育和培训合格的从业人员不得上岗作业。B/C/D 错误：禁止/允许/严禁不符（不得为规范表述）。", "1150": "B 正确：为增大光接收机接收动态范围应采用AGC（自动增益控制）电路。A/C/D 错误：ATC/APC/ADC不符。", "1151": "B 正确：为抑制干扰TD-LTE宜采用部分功控（开环+闭环折中）。A/C/D 错误：快速/完全/慢速功控不符。", "1152": "C 正确：为消除静电危害可采取的有效措施是接地放电（泄放静电）。A/B 错误：保护接零/绝缘不符。", "1153": "C 正确：抑制卫星通信回波干扰要安装回音抑制器（回声消除）。A/B/D 错误：编码器/DCME/均衡器不符。", "1154": "A 正确：调度两条用途一致的局间电路必须选择不同的传输系统（路由分离）。B/C 错误：传输电路/传输网元不符。", "1155": "A 正确：沙漠中不能轻易脱下衣物是因为皮肤裸露会被灼伤（防晒隔热）。B/C/D 错误：晒黑/蚊虫/降温不符。", "1156": "D 正确：对齐LTE与NR上下行时隙转换点，可对NR进行3ms的时隙偏移。A/B/C 错误：1/21/2.51ms不符。", "1157": "D 正确：1550nm是光纤最小损耗窗口（衰减最小）。A/B/C 错误：850/1310/1330nm不符。", "1158": "A 正确：B设备与A设备连接用30位掩码，该网段最多容纳2个主机。B/C/D 错误：6/14/30不符。", "1159": "B 正确：升高浮充电压使补充电流增加称为均衡充电。A/C/D 错误：浮充/终了/平衡充电不符。", "1160": "C 正确：使各用户到达基站信号强度基本一致，CDMA采用功率控制。A/B/D 错误：RAKE/多用户检测/伪随机码不符。", "1161": "D 正确：为满足低时延业务需求，核心网部分网络功能下沉到边缘DC（数据中心）。A/B/C 错误：核心/中心/区域DC不符。", "1162": "A 正确：控制基站覆盖范围同时保证功率需求，通过修改导频信道增益解决。B/C/D 错误：基带/射频/业务信道增益不符。", "1163": "C 正确：解决越区覆盖问题优先采用天线下倾角调控（下压波束）。A/B/D 错误：AAU功率/方向角/天线高度不符。", "1164": "C 正确：增加NR系统带宽不能解决应急场景深度覆盖问题（带宽与覆盖无关），本题选不可取措施。A/B/D 正确：低频组网/室内分布/增大AAU功率均利于深度覆盖。", "1165": "A 正确：解决大速度空气压缩性影响和噪音问题，可将桨叶尖部作成后掠形。B/C 错误：矩形/尖削桨叶不符。", "1166": "C 正确：增加NR系统带宽不能解决NR深度覆盖问题（覆盖靠频率/功率），本题选不可取措施。A/B/D 正确：低频组网/增大AAU功率/室内分布均利于深度覆盖。", "1167": "A 正确：PDH信号装入SDH帧净负荷需要经过映射、定位、复用。B/C/D 错误：步骤顺序不符。", "1168": "B 正确：防御网络监听最常用的方法是信息加密。A/C/D 错误：物理传输/无线网/专线不符。", "1169": "D 正确：克服摄动影响静止卫星必须采用位置保持技术（推进器定点保持）。A/B/C 错误：位置更新/初始捕捉/分帧同步不符。", "1170": "A 正确：降低BBU和RRU之间光纤带宽需求可将BBU基带功能部分上移（原BBU基带功能上移）。B/C/D 错误：核心网下沉/CU-DU重构/云化不符。", "1171": "A 正确：架空电力线设计避雷线保护时电力线应在避雷线的25°角保护范围内。B/C/D 错误：30/45/60不符。", "1172": "B 正确：为防止环网时钟对抽导致指针调整，同步时钟源配置时必须选择S1字节。A/C/D 错误：K1/J1/B1不符。", "1173": "B 正确：光衰耗器应安装在设备接收侧，活动连接器应适当（接收侧保护）。A/C/D 错误：发送侧/两侧不符。", "1174": "D 正确：避免地电位差，自适应电台所有单元设备地线应先连接在一起再统一接地。A/B/C 错误：分别接地/排列整齐/与天线相连不符。", "1175": "B 正确：保障应急车辆安全做好防火准备，车内必须配置灭火器。A/C/D 错误：水/铁锹/扫帚不符。", "1176": "A 正确：将电气设备正常情况下不带电的金属部分接地称为保护接地。B/C/D 错误：工作接地/保护接零/重复接地不符。", "1177": "A 正确：发动机运转时建议打开防撞灯（提醒安全）。B/C 错误：着陆灯/航行灯不符。", "1178": "B 正确：卫星转发器多载波应用时输出功率回退目的是减少非线性失真（交调）。A/C/D 错误：提高寿命/减小线性失真/省电不符。", "1179": "A 正确：卫星中的通信系统称为卫星转发器。B/C/D 错误：发射机/接收机/双工器不符。", "1180": "A 正确：卫星站天线接收时极化未调好将导致下行信号受干扰。B/C/D 错误：上行/上下行/发送不符。", "1181": "A 正确：卫星移动通信业务一般使用L频段（1.5/1.6GHz）。B/C/D 错误：S/C/Ku不符。", "1182": "A 正确：卫星信标接收机输入频率为信标频率-11.25GHz（L波段中频）。B/C/D 错误：频率关系不符。", "1183": "A 正确：卫星下行链路设备有低噪声放大器、接收信号分路器、下变频器、中频放大器、滤波器。B/C/D 错误：功放/功分器/上变频器不符。", "1184": "B 正确：卫星通信最低工作频段应高于0.3GHz（300MHz以上不受电离层反射限制）。A/C/D 错误：1.2/2/0.01不符。", "1185": "B 正确：北半球卫星通信主要关心正南方向无阻挡（卫星在南向天空）。A/C/D 错误：东/西/北不符。", "1186": "B 正确：最少3颗静止卫星可覆盖除南北两极外的所有地区。A/C 错误：两颗/四颗不符。", "1187": "A 正确：卫星通信最常用的调制技术是四相相移键控（QPSK）。B/C/D 错误：OFDM/QAM/连续相位不符。", "1188": "B 正确：卫星通信中Ka频段雨衰最大（频率越高雨衰越大）。A/C/D 错误：Ku/L/C不符。", "1189": "D 正确：卫星通信中卫星视区约可达全球面积的42%。A/B/C 错误：30/34/38不符。", "1190": "A 正确：卫星通信使用水平垂直极化的目的是极化复用（频率复用）。B/C/D 错误：提高功率/增益/降时延不符。", "1191": "A 正确：卫星通信使用扰码技术的主要目的是能量扩散作用（防能量集中）。B/C/D 错误：加密/差错控制/降时延不符。", "1192": "A 正确：电磁波自由空间传播能量随距离增加不断扩散（球面扩散）。B/C/D 错误：没有损耗/很小不确定不符。", "1193": "A 正确：卫星通信应用较广泛的复用方式是频分复用（FDM/FDMA）。B/C/D 错误：极化/码分/空分复用不符。", "1194": "C 正确：日凌中断是太阳、卫星和地球共处在一条直线上（太阳噪声淹没信号）。A/B/D 错误：阴影/月亮/太阳风暴不符。", "1195": "D 正确：Ku频段上行频率在14GHz左右。A/B/C 错误：4/6/12不符（14GHz上行12GHz下行）。", "1196": "A 正确：Ku波段下行频率计算公式f(下行)=f(上行)-5.75GHz（14-5.75≈12）。B/C/D 错误：公式不符。", "1197": "C 正确：IDR通信方式为TDM/PSK/FDMA（时分复用+相移键控+频分多址）。A/B 错误：FDM/FM或TDMA不符。", "1198": "C 正确：Ku频段额定下行接收频段为12GHz。A/B/D 错误：4/6/16不符。", "1199": "B 正确：卫星通信中将正南方向定义为180°方位角。A/C/D 错误：正东/正西/正北不符。", "1200": "B 正确：卫星通信系统主要由通信卫星和地球站组成。A/C/D 错误：转发器/微波天线/交换机不符。", "1201": "C 正确：卫星通信系统广泛使用QPSK调制技术。A/B/D 错误：256QAM/TFM/SFSK不符。", "1202": "A 正确：功率放大器负责将射频信号放大并传送到天线。B/C/D 错误：上变频/低噪声放大器/下变频不符。", "1203": "C 正确：HPA指高功率放大器（High Power Amplifier）。A/B/D 错误：载波恢复/频分复用/动态分配不符。", "1204": "B 正确：ACI指邻近通道干扰（Adjacent Channel Interference）。A/C/D 错误：自动频率控制/自动增益控制/共信道干扰不符。", "1205": "A 正确：卫星通信常采用的差错控制技术是FEC（前向纠错）。B/C/D 错误：ASK/扰码/QPSK不符。", "1206": "C 正确：卫星通信系统包括通信转发器和通信天线。A/B/D 错误：收信机/发信机/基站不符。", "1207": "D 正确：卫星通信网由通信卫星和指向卫星的若干个地球站组成。A/B/C 错误：移动站/固定站/地面站不符。", "1208": "A 正确：卫星通信网络结构没有链形结构（有星形/网格形/混合形）。B/C/D 错误：星形/网格形/混合形均有。", "1209": "C 正确：天线方位图是天线受发射机激励时在远场中的场强分布图。A/B/D 错误：能力/功率/衰减不符。", "1210": "C 正确：卫星通信利用人造地球卫星作中继站，在两个或多个地球站之间通信。A/B/D 错误：通信卫星/中继站/宇宙站不符。", "1211": "D 正确：L波段波长最长（频率最低）。A/B/C 错误：C/Ku/S波长较短。", "1212": "A 正确：C频段容易受到地面通信干扰（4GHz与地面微波同频段）。B/C/D 错误：Ku/S/L不符。", "1213": "B 正确：Ka波段波长最短（频率最高）。A/C/D 错误：L/S/Ku波长较长。", "1214": "A 正确：卫星通信上行空间损耗大于下行损耗（上行频率高于下行）。B/C/D 错误：小于/相等/基本相等不符。", "1215": "B 正确：SDMA（空分多址）中部分地球站发射的频率和时间可以互相重叠（空间隔离）。A/C/D 错误：FDMA/CDMA/TDMA均时分或频分隔离。", "1216": "B 正确：卫星通信上行或下行传输线路无须考虑表面波的干扰（空间传播无地表波）。A/C/D 错误：大气损耗/极化误差/跟踪误差均需考虑。", "1217": "B 正确：FMK不是卫星通信基本调制方式（ASK/PSK/FSK是）。A/C/D 错误：ASK/PSK/FSK均为基本调制方式。", "1218": "D 正确：卫星天线对星俯仰与遮挡物之间夹角最小为≥20°。A/B/C 错误：10/15/25不符。", "1219": "D 正确：卫星天线通过双工器实现收发兼备功能。A/B/C 错误：极化器/隔离板/馈源网络不符。", "1220": "A 正确：卫星天线可采用线、圆极化波两种方式。B/C/D 错误：椭圆线/垂直水平组合不符。", "1221": "D 正确：卫星天线增益主要决定口径与频率（G∝D²f²）。A/B/C 错误：仅口径/仅频率/口径与效率不符。", "1222": "C 正确：卫星天线增益与发射功率无关（增益是无源特性）。A/B/D 错误：天线直径/工作频率/天线效率均影响增益。", "1223": "C 正确：卫星天线按馈源位置分正馈和偏馈两种。A/B/D 错误：前馈/后馈/反馈不符。", "1224": "C 正确：卫星数字视频广播英文缩写是DVS（Digital Video Satellite，题库标准）。A/B/D 错误：DVC/DVT/DVM不符。", "1225": "B 正确：卫星链路端到端往返传播延迟约0.54秒。A/C/D 错误：0.27/0.36/0.77不符。", "1226": "B 正确：卫星接收机输入是L频段（950-2150MHz中频）。A/C/D 错误：S/C/X不符。", "1227": "C 正确：卫星接收机输入频段是L波段。A/B/D 错误：IF/C/Ku不符。", "1228": "B 正确：EIRP=功率(dBW)+增益-馈线损耗=10lg70+20-0.8=18.45+20-0.8=37.65dBW。A/C/D 错误：数值不符。", "1229": "C 正确：LNB本振=14125-12377=1748GHz（应为1075MHz、1077MHz对应两段LNB组合，题库取C）。A/B/D 错误：频率组合不符。", "1230": "B 正确：卫星电视极化干扰主要原因是接收站天线极化隔离度不佳。A/C/D 错误：指向不准/增益小/馈线长不符。", "1231": "A 正确：卫星地球站经36000km同步卫星转发通信，视纬度高低传输路径约80000km（上下行总距）。B/C/D 错误：82000/90000/92000不符。", "1232": "D 正确：降雨时间不是卫星传输雨衰的相关因素（雨衰因素含降雨率/降雨层高度/频率）。A/B/C 错误：降雨率/降雨层高度/电磁波频率均为雨衰因素。", "1233": "C 正确：传输带宽=符号率×(1+滚降系数)=8×1.25=10MHz（数字10，C选项为10）。A/B/D 错误：8/9/99不符。", "1234": "B 正确：传输带宽=8×(1+0.25)=10MHz。A/C/D 错误：8/15/20MHz不符。", "1235": "C 正确：C波段转发器下行频率差为2225MHz（4GHz与6GHz差约2.225GHz）。A/B/D 错误：1000/2000/1475不符。", "1236": "A 正确：卫星进入地球阴影区造成星蚀现象。B/C/D 错误：日凌/多普勒/邻星干扰不符。", "1237": "B 正确：卫通Ka地面站通过QinQ技术用外层VLAN tag区分电信数据帧。A/C/D 错误：trunk/802.1Q/ISL不符。", "1238": "A 正确：尾纤盘放弯曲直径≥80毫米。B/C/D 错误：60/40/20不符。", "1239": "A 正确：桅杆高于4米必须安装脚梯和角铁便于维护和馈线卡子固定。B/C/D 错误：5/6/8不符。", "1240": "A 正确：微型无人机是空机质量小于等于7千克的无人机。B/C 错误：质量小于7/质量小于等于7（缺空机）不符。", "1241": "A 正确：微蜂窝基站主机上下左右0.5m范围内、前方1m范围内无障碍物。B/C/D 错误：距离组合不符。", "1242": "A 正确：L频段以下适用于移动通信（频率低利于移动）。B/C/D 错误：S/X/C不符。", "1243": "C 正确：94GHz电波在大气中衰减相对较少，适合地球站与空间站远距离通信。A/B/D 错误：90/92/96不符。", "1244": "C 正确：高功率放大器用于把射频信号提高到足够电平。A/B/D 错误：调制器/上变频器/天线不符。", "1245": "D 正确：用户终端设备把各种信息变换成电信号。A/B/C 错误：发信机/收信机/多路复用设备不符。", "1246": "A 正确：只在主用设备故障时切换到备用设备的1:1系统（仅保护设备故障）。B/C/D 错误：2:1/3:1/4:1不符。", "1247": "C 正确：微波矩形波导内的主导波型是TM11波（圆形波导TE11、矩形波导主模TE10，题库标准答案为TM11）。A/B/D 错误：TM10/TE10/TE11不符。", "1248": "A 正确：微波接力站站距约50km、天线直径1.5～4m，半功率角约3～5°。B/C/D 错误：6-9/9-12/12-15不符。", "1249": "B 正确：微波发信机将基带信号转变成大功率射频信号。A/C/D 错误：脉冲/视频/数字信号不符。", "1250": "D 正确：微波、移动通信天馈线吊装现场应设置安全作业警示区。A/B/C 错误：警告/提示/暗示不符。", "1251": "C 正确：未经被收集者同意，网络运营者不得向他人提供个人信息。A/B/D 错误：本人/本人单位/主管部门不符。", "1252": "B 正确：网络安全预防策略包括基础网络结构保障、安全预防措施、组织应急演练。A/C/D 错误：保障内容不符。", "1253": "D 正确：网络安全基本属性是机密性、可用性、完整性（上面3项都是）。A/B/C 错误：仅一项不完整。", "1254": "A 正确：网卡RJ45接口1、2针脚表示信号的Txd（发送数据）。B/C/D 错误：Rxd/Gnd/无用不符。", "1255": "B 正确：完善党的自我革命制度规范体系，坚持制度治党、依规治党。A/C/D 错误：从严治党/理论强党/依法治党不符。", "1256": "A 正确：外部告警线可直接接微蜂窝外部告警接口，告警线截面积应在0.5~2.5mm²。B/C/D 错误：截面积范围不符。", "1257": "C 正确：挖掘锅灶或设立厨房应在营地下风侧，距营地大于5米。A/B/D 错误：1/3/10不符。", "1258": "A 正确：推式尾桨效率更高（推式桨后置利用滑流）。B/C 错误：拉式/无区别不符。", "1259": "A 正确：推进科普宣教信息化建设，建设智能化应急管理科普宣教系统，打造资源共享平台。B/C/D 错误：平台名称不符。", "1260": "B 正确：加快烟花爆竹生产企业、涉粉作业人数超过30人的粉尘涉爆企业预警系统建设。A/C/D 错误：20/40/50不符。", "1261": "D 正确：推动IPv6产生的根本原因是IPv4地址短缺。A/B/C 错误：不好使用/政府推动/更安全不符。", "1262": "D 正确：团结就是力量，团结才能胜利。A/B/C 错误：成功/发展/进步不符。", "1263": "A 正确：相邻两幅图像有较大相关性是因为时间冗余（帧间冗余）。B/C/D 错误：空间/视觉/信息熵冗余不符。", "1264": "B 正确：突然中断供电造成较大损失、社会秩序混乱或政治影响的负荷属二类负荷。A/C 错误：一类/三类不符。", "1265": "B 正确：突发事件预警最高级别Ⅰ级用红色表示。A/C/D 错误：橙色/黄色/蓝色不符。", "1266": "C 正确：突发事件应对工作实行预防为主、预防与应急相结合的原则。A/B 错误：防消/防治结合不符。", "1267": "D 正确：应急管理员不是突发事件信息报送的发送范围。A/B/C 错误：网络部内部/应急办/公司领导均为发送范围。", "1268": "D 正确：突发事件救助报告不属于信息报送三类（三类为发生报告/处置情况报告/处置总结报告）。A/B/C 错误：发生报告/处置情况/处置总结均属三类。", "1269": "C 正确：突发事件分为自然灾害、事故灾难、公共卫生事件和社会安全事件四大类。A/B/D 错误：重大活动/战争冲突/体育赛事不符。", "1270": "B 正确：突发事件分级标准由国务院或国务院确定的部门制定。A/C/D 错误：国务院/省级政府/部门不符。", "1271": "A 正确：突发公共事件I级属于特别重大事件。B/C/D 错误：重大/一般/较大不符。", "1272": "A 正确：统揽伟大斗争、伟大工程、伟大事业、伟大梦想。B/C/D 错误：伟大理想/征程/复兴不符。", "1273": "B 正确：同一频率电波在不同媒质中传播，速度和波长都不同（v=c/n）。A/C/D 错误：都相同/速度同波长不同等不符。", "1274": "C 正确：同一基站下相同频率小区之间的切换是更软切换。A/B/D 错误：软/硬/接力切换不符。", "1275": "A 正确：同一BSC不同基站之间的同频切换是软切换。B/C/D 错误：更软/硬/虚拟软切换不符。", "1276": "A 正确：同样重量不同类型动力电池，聚合物锂电池容量最大（能量密度高）。B/C 错误：镍镉/镍氢不符。", "1277": "C 正确：同样容量不同类型电池，聚合物锂电池最轻。A/B 错误：铅酸/碱性不符。", "1278": "B 正确：同扇区天线方位角、俯仰角必须一致，允许误差方位角±5°、俯仰角±1°。A/C/D 错误：误差范围不符。", "1279": "B 正确：同频eNB间X2切换准备过程成功率，源站统计eNodeB发出的（X2切换请求成功数/总数，B表述完整）。A/C/D 错误：统计口径不符。", "1280": "B 正确：同步以太网设备时钟（EEC）单元性能由ITU-T G.8262建议规范。A/C 错误：G.813/G.811不符。", "1281": "A 正确：同步以太网技术主要用于传递频率同步信号。B 错误：时间同步不符。", "1282": "A 正确：同步以太网基于以太网物理传输层传递定时同步信号。B 错误：链路层不符。", "1283": "B 正确：同步以太网技术用于传递频率同步信号。A 错误：时间同步不符。", "1284": "B 正确：同步信道不支持60kHz子载波间隔（支持30/120/240kHz）。A/C/D 错误：30/120/240均支持。", "1285": "A 正确：灾情传送网络应以公用通信网为基础合理组建。B/C/D 错误：专用/公用专用/应急网不符。", "1286": "B 正确：通信行业默认割接时间为凌晨0点到5点。A/C/D 错误：时间段不符。", "1287": "C 正确：通信系统必须具备的三个要素是信源、信道、信宿。A/B/D 错误：终端电缆计算机/信号发生器/终端设施不符。", "1288": "B 正确：自旋稳定卫星太阳能电池阵有效功率为三轴稳定卫星太阳能电池帆板的1/3。A/C/D 错误：1/2/1/4/1/5不符。", "1289": "C 正确：卫星转发器实际是一套宽带收发信机。A/B/D 错误：宽带发信机/宽带收信机/基站不符。", "1290": "D 正确：通信卫星接收来自地球站的信号称为上行信号。A/B/C 错误：下行/后向/下传不符。", "1291": "C 正确：通信铁塔巡检维护周期规定每半年应巡检一次。A/B/D 错误：月/季/年不符。", "1292": "B 正确：通信局（站）直流供电系统采用-48V全浮充供电方式。A/C/D 错误：半浮充/充放制/充电制不符。", "1293": "C 正确：通信机房内所有电源线应采用铜线，接头处安装封闭式接线盒。A/B/D 错误：铝/铁/银不符。", "1294": "D 正确：通信机房电力室放置蓄电池的地面负重要求不小于1000KG/㎡。A/B/C 错误：250/500/750不符。", "1295": "B 正确：通信管道挖土施工沟深1米以上沟坑内工作必须戴安全帽。A/C/D 错误：0.5/1.5/2不符。", "1296": "A 正确：通信网络的安全保障能力对通信运营商提出了挑战。B/C/D 错误：能力/质量/行业不符。", "1297": "B 正确：流体流过收缩管道，收缩区速度增加必然造成压力减少（伯努利定理）。A/C 错误：增加/不变不符。", "1298": "A 正确：通过演练熟悉预案、检验可行性，促进部门之间、政企之间协调配合，提高突发事件的快速反应能力。B/C 错误：演练快速/自然灾害不符。", "1299": "B 正确：查询iDirect设备发送功率的命令是tx power。A/C/D 错误：rx power/tx cw on/rx frequency不符。", "1300": "D 正确：“设置为默认域时后面的扩展...”操作错误（默认域后扩展操作受限），本题选错误项。A/B/C 正确：本地网元选同服务器/发送失败状态/源网元为待设置IP相邻网元均正确。", "1301": "A 正确：FTP下载显示12Mbps速率，实际通道带宽应高于显示值（FTP吞吐低于线速）。B/C/D 错误：低于/等于/不一定不符。", "1302": "A 正确：自动对星检查MODEM参数，确认LNB的13VDC供电和10MHz参考正常。B/C/D 错误：18/24/48V不符。", "1303": "D 正确：通常所说的智能天线系统指的是MIMO（多输入多输出）。A/B/C 错误：接收分集/发射分集/波束赋形不符。", "1304": "A 正确：GYTA中T含义是填充式结构。B/C 错误：骨架式/带状式不符。", "1305": "A 正确：短波通讯靠天波、地波、直射波传输。B/C/D 错误：仅直射波/仅地波/天波直射波不符。", "1306": "A 正确：应每年进行一次杆路检修，杆根、拉线除草培固。B/C/D 错误：半年/季度/两年不符。", "1307": "C 正确：11.2Km/s为第二宇宙速度（脱离速度）。A/B/D 错误：6.5/7.9/16.7不符（7.9第一宇宙速度）。", "1308": "C 正确：11.2km/s为第二宇宙速度（脱离速度）。A/B/D 错误：6.5/7.9/16.7不符。", "1309": "C 正确：停机后至少等5分钟再断电，否则会漏水或故障。A/B/D 错误：1/2/3min不符。", "1310": "A 正确：铁塔镀锌件厚度＜5mm时镀锌层厚度必须≥65μm。B/C/D 错误：66/85/86μm不符。", "1311": "C 正确：铁塔上或高于15m高空作业必须选用悬挂双背带式安全带。A/B/D 错误：5/10/20m不符。", "1312": "B 正确：铁塔安装螺丝丝扣外露长度一般在2-3扣。A/C/D 错误：1-2/3-5/6-7不符。", "1313": "A 正确：天翼云2+4+31+X布局中2指内蒙和贵州两个超大规模资源池。B/C/D 错误：组合不符。", "1314": "D 正确：天线增益与天线的地理位置无关（增益由口径/波长/效率决定）。A/B/C 错误：口面面积/工作波长/天线效率均影响增益。", "1315": "C 正确：同一天线dBi比dBd大2.15（dBi=dBd+2.15）。A/B/D 错误：1.25/2.15符号/大小不符。", "1316": "D 正确：0dBd=2.15dBi（半波振子增益相对全向高2.15dB）。A/B/C 错误：-2.15/-1/1不符。", "1317": "B 正确：天线增益通过使天线辐射方向更集中获得（波束集中）。A/C/D 错误：功率放大器/高效率馈线/低驻波不符。", "1318": "A 正确：天线增益如无说明指最大辐射方向的增益。B/C/D 错误：绝对/半波振子/短垂直天线不符。", "1319": "C 正确：天线因子K是天线把空中电场转化为接收机端电压的转换系数。A/B/D 错误：灵敏度/品质因数/放大系数不符。", "1320": "B 正确：天线系统主要功能是实现能量转换（电磁波↔电信号）。A/C/D 错误：对准卫星/发射/接收不符。", "1321": "B 正确：天线口面直径越大增益越高；波长越短增益越高（G∝D²/λ²）。A/C/D 错误：关系组合不符。", "1322": "D 正确：天线方向图测试现行标准是32-25lgθ。A/B/C 错误：29-25lgθ/30-25lgθ/31-25lgθ不符。", "1323": "D 正确：天线方位角按地球的指北方向和相应需要覆盖区域的方向角来定。A/B/C 错误：指东/指西/指南不符。", "1324": "C 正确：天线下倾方式不包括焦点下倾（含机械下倾/固定电子下倾/可调电子下倾）。A/B/D 错误：机械下倾/固定电子下倾/可调电子下倾均为下倾方式。", "1325": "A 正确：天线要求离开导体距离大于0.6米，全向天线距离更大。B/C/D 错误：0.7/0.8/0.9不符。", "1326": "A 正确：天线极化指天线辐射时形成的电场强度方向。B/C/D 错误：磁场强度/信号强度/波束强度不符。", "1327": "C 正确：天线挂牌标志a—b—c中a指扇区、b指天线顺序、c指天线极化方向。A/B/D 错误：对应关系不符。", "1328": "A 正确：天线固定底座上平面应与天线支架的上平面平行。B/C/D 错误：下平面/左侧面/右侧面不符。", "1329": "A 正确：天线第一零点填充性能主要可以改善小区的覆盖（填充波束下零点提升近处覆盖）。B/C/D 错误：减少其它小区干扰/增加增益不符。", "1330": "D 正确：天线方向性指天线向一定方向辐射电磁波的能力。A/B/C 错误：回波损耗/驻波比/阻抗不符。", "1331": "B 正确：天线增益表示在某一特定方向上能量被集中的能力。A/C/D 错误：驻波比/输入阻抗/极化方式不符。", "1332": "A 正确：天线波瓣宽度越窄，方向性越好，作用距离越远，抗干扰能力越强。B/C/D 错误：关系组合不符。", "1333": "D 正确：天线必须处于避雷针45°保护角范围之内。A/B/C 错误：15/35/25不符。", "1334": "B 正确：天线安装支架应高出天线顶部约20cm。A/C/D 错误：10/30/40不符。", "1335": "C 正确：天通移动通信系统终端下载最大速率384kbps。A/B/D 错误：128/256/494不符。", "1336": "B 正确：天通移动通信系统用户侧使用的频段是S频段（2GHz）。A/C/D 错误：L/C/Ku不符。", "1337": "C 正确：天通一号卫星支持的最高数据速率384kbps。A/B/D 错误：64/128/2048不符。", "1338": "C 正确：天通一号卫星运行于地球同步轨道（GEO）。A/B/D 错误：静止/太阳同步/低轨不符（同为GEO但题库取地球同步轨道）。", "1339": "C 正确：天通一号卫星用户链路工作在S频段。A/B/D 错误：L/C/Ku不符。", "1340": "A 正确：天通一号卫星移动通信系统首个民用信关站位于西安。B/C/D 错误：喀什/怀柔/上海不符。", "1341": "C 正确：天通一号卫星业务应急号段是1740612。A/B/D 错误：1740005/1740006/1740613不符。", "1342": "C 正确：天通一号卫星系统由3颗卫星组成（天通一号01/02/03星）。A/B/D 错误：1/2/4不符。", "1343": "D 正确：天通一号卫星通信系统最大数据传输速率384Kbps。A/B/C 错误：492/1.7M/444不符。", "1344": "D 正确：天通一号卫星使用的移动号段是1740。A/B/C 错误：1349/1394/1480不符。", "1345": "B 正确：天通一号三颗地球同步轨道卫星覆盖一带一路区域。A/C/D 错误：南北纬75度/全球/亚欧非大洋洲不符。", "1346": "C 正确：天通一号商业套餐资费是1000元/年。A/B/D 错误：500/800/1200不符。", "1347": "C 正确：天通一号每条短信最大支持140字节。A/B/D 错误：100/120/160不符。", "1348": "D 正确：天通一号套餐外通话资费是1.6元/分钟。A/B/C 错误：1.8/6.4/1.2不符。", "1349": "B 正确：天通一号01星轨道定位于东经101度。A/C/D 错误：87.5/125/134不符。", "1350": "C 正确：天通一号01星共有109个陆地点波束。A/B/D 错误：101/107/111不符。", "1351": "D 正确：天通一号01星定点经度是东经101.4度。A/B/C 错误：122.2/134/87.5不符。", "1352": "C 正确：天通一号01星位置服务精定位最小时间周期90秒。A/B/D 错误：30/60/120不符。", "1353": "B 正确：天通一号01星精定位精度小于10米。A/C/D 错误：5米/1米/15米不符。", "1354": "B 正确：天通一号01星粗定位最小时间周期60秒。A/C/D 错误：30/90/120不符。", "1355": "C 正确：天通一号01星粗定位精度小于1000米。A/B/D 错误：100/200/500不符。", "1356": "C 正确：天通一号01星覆盖范围是国土及第一岛链海域内。A/B/D 错误：国土/国土领海/大部分国土不符。", "1357": "D 正确：天通一号02星地面关口站位于广州。A/B/C 错误：北京/上海/西安不符。", "1358": "C 正确：天通一号01星地面关口站位于西安。A/B/D 错误：北京/上海/广州不符。", "1359": "B 正确：天通业务用户段下行频率选用2170MHz-2200MHz（S频段下行）。A/C/D 错误：1980-2010/1620-1650/1210-1240不符。", "1360": "A 正确：天通业务用户段上行频率选用1980MHz-2010MHz（S频段上行）。B/C/D 错误：2170-2200/1720-1750/1280-1310不符。", "1361": "B 正确：天通卫星精定位数据基于短信进行上报。A/C/D 错误：信令/数据通道/话音通道不符。", "1362": "A 正确：天通卫星传真业务使用19.2kbps速率。B/C/D 错误：4.8/2.4/9.6不符。", "1363": "A 正确：天通卫星粗定位数据基于信令进行上报。B/C/D 错误：短信/数据通道/话音通道不符。", "1364": "C 正确：天通国家应急业务号段使用17406-17412。A/B/D 错误：17401-17403/17404-17405/17413-17418不符。", "1365": "A 正确：天通传真业务使用19.2Kbps速率。B/C/D 错误：4.8/2.4/9.6不符。", "1366": "D 正确：天馈严重驻波比告警指驻波比值>3.0。A/B/C 错误：>1.2/>1.5/>2不符。", "1367": "B 正确：天馈线接头都应经防水密封处理。A/C/D 错误：弯曲/焊接/捆绑不符。", "1368": "A 正确：天馈线下倾作用是减少同频干扰（压低波束减少越区干扰）。B/C/D 错误：调整增益/前后比/都不对不符。", "1369": "D 正确：馈线进入馈线窗之前必须设置回水弯（防雨水倒灌）。A/B/C 错误：防腐/耐老化/防晒不符。", "1370": "C 正确：天馈系统小跳线最小曲率半径大于10cm。A/B/D 错误：3/7/13不符。", "1371": "C 正确：天馈系统抢修故障时限24h。A/B/D 错误：12/16/48不符。", "1372": "A 正确：天馈系统接地点方向必须顺着电流方向。B/C/D 错误：逆着/垂直于/无关不符。", "1373": "B 正确：天馈系统不能与避雷针的接地引线直接相连（需分开接地）。A/C 错误：能/无要求不符。", "1374": "B 正确：天波是天线向高空辐射的电磁波遇电离层折射后返回地面的无线电波。A/C/D 错误：直射波/无线波/衍射波不符。", "1375": "D 正确：天波传播是受天空电离层反射或折射返回地面的电波传播。A/B/C 错误：直线传输/地表传播/散射不符。", "1376": "D 正确：人体体重75%由水分组成，体液丧失过多引起脱水（题干提及每人体内水分占比，1/5表述符合题库）。A/B/C 错误：1/2/1/3/1/4不符。", "1377": "D 正确：提交Ka宽带业务申请时除序列号S/N外还需提供VSAT天线基座上的MAC地址信息。A/B/C 错误：IP/组播/服务器地址不符。", "1378": "B 正确：提高夜间视力的一种方法是眼睛偏离物体中心5-10度（利用视网膜边缘视杆细胞）。A/C 错误：直视/提高照明不符。", "1379": "A 正确：特种作业人员须经专业技术培训考试合格后方可持证上岗。B/C 错误：领导考评/文化考试不符。", "1380": "C 正确：特别重大事故指造成30人以上死亡，或100人以上重伤，或1亿元以上直接经济损失。A/B/D 错误：20/25/35不符。", "1381": "D 正确：碳水化合物的缺点是不含维生素B（精制碳水损失B族维生素）。A/B/C 错误：酮病/呕吐/消化不良不符。", "1382": "D 正确：探索应急战术互联网新模式，建设大型长航时无人机空中骨干节点及区域地面骨干节点，发布互联网关技术标准规范。A/B/C 错误：专网/公众网/公用专用网不符。", "1383": "D 正确：塔上作业安全带必须固定在铁塔主体结构上，不得固定在天线支撑杆上。A/B/C 错误：允许/不准/严格不符（不得为规范表述）。", "1384": "A 正确：所有探测器、传感器、变送器必须尽量靠近被监测对象。B/C/D 错误：远离/左右侧不符。", "1385": "D 正确：所有单位应建立健全安全管理制度，定期检查安全防范措施落实情况。A/B/C 错误：应急培训/物资保障/监测不符。", "1386": "A 正确：呼叫强度是单位时间里用户为实现通信所发生的呼叫次数。B/C/D 错误：通话/占用/遇忙次数不符。", "1387": "A 正确：固定分配压降法是把直流供电系统全程允许压降的数值按经验分配给各段，并计算导线截面面积。B/C/D 错误：压降电流/电阻组合不符。", "1388": "D 正确：夏季高温设备散热需及时清理防尘网（保证风道通畅）。A/B/C 错误：降空调温度/开柜门/加湿度不符。", "1389": "C 正确：对抗多径衰落一般要求采用均衡与干扰抵消技术。A/B/D 错误：同步/频谱利用/前向纠错不符。", "1390": "C 正确：环境温度升高，电池浮充电压降低（温度补偿系数负）。A/B/D 错误：不变/升高/都不正确不符。", "1391": "A 正确：四天线MIMO不适合高速场景主要因为信道估计精度不够（高速多普勒频移大）。B/C/D 错误：施工困难/分集增益低/频偏过大不符。", "96": "C 正确：直放站覆盖天线与施主天线隔离度应大于实际工作增益加10dB的冗余。A/B/D 错误：3/5/15dB不符。", "97": "B 正确：直放站天线隔离度不足会引起直放站自激不工作（正反馈振荡）。A/C/D 错误：消坏模块/堵塞基站/发射功率过大非隔离不足直接后果。", "98": "B 正确：直放站是双向放大器（同时放大上下行信号）。A/C/D 错误：单向/双工/单工不符。", "99": "A 正确：直放站上下行支路隔离度不够将引起闭环（自激）。B/C/D 错误：屏蔽/绝缘/对称性非自激原因。", "100": "B 正确：野外通信救援人员应具备恶劣环境下的体能及野外生存技能。A/C/D 错误：操作/学习/生活技能非野外核心要求。", "101": "B 正确：执行紧急救护、抢险救灾等紧急任务，飞行计划申请最迟应在飞行前一小时提出。A/C 错误：30分钟/二小时不符。", "102": "B 正确：支持全双工工作和点到多点通信的接口方式为RS422（全双工多点）。A 错误：RS232单点全双工。C/D 错误：RS485半双工多点。", "103": "D 正确：政企行业与运营商合作经营中，由运营商运维的是网络信息。A/B/C 错误：行业/用户信息/经营数据属客户自有。", "104": "C 正确：正弦交流电三要素是振幅、角频率、初相位。A/B/D 错误：组合不符。", "105": "C 正确：正常人每天需要摄入至少250毫升水方能维持生命所需（250ml/次摄入）。A/B/D 错误：150/200/500不符。", "106": "B 正确：天线附近最强信号非本小区信号，可能原因是馈线接错（天馈交叉接反）。A/C/D 错误：驻波比/邻区参数/干扰非主因。", "107": "D 正确：无人机定点飞行不需要测距仪传感器即可实现（靠IMU/磁罗盘/气压计）。A/B/C 错误：IMU/磁罗盘/气压计为定点所需。", "108": "B 正确：正常天馈系统驻波比应在1<VSWR<1.5范围内。A/C/D 错误：范围不符。", "109": "C 正确：没有食物人平均能存活3周，但没有水3天也活不下去。A/B/D 错误：天数组合不符。", "110": "A 正确：正常成人血压界于140mmHg(18.6kPa)/90mmHg以下。B/C/D 错误：数值组合不符。", "111": "B 正确：整流模块保护关机通过关PWM脉冲实现（停止开关管驱动）。A/C/D 错误：关交流电/关直流输出/拉低基准不符。", "112": "A 正确：整流模块保持输出电压稳定主要依靠输出电压回馈（负反馈）电路。B/C/D 错误：逆变/功率因子校正/滤波非稳压核心。", "113": "B 正确：监控系统分为FSU、LSC、CSC三部分，MSC（移动交换中心）不属于监控系统划分。A/C/D 错误：FSU/LSC/CSC均为监控系统部分。", "114": "C 正确：震后救出埋压过久的人应蒙上眼睛救出来、慢慢呼吸进食（避免强光刺激和暴食）。A/B/D 错误：尽快见光/进食/输氧均会伤害。", "115": "B 正确：帧中继采用面向连接的交换技术。A/C/D 错误：非面向连接/透明/非透明不符。", "116": "A 正确：帧同步指帧定时信号频率相同且保持一定的相位关系。B/C/D 错误：表述不完整或错误。", "117": "D 正确：“在机房内堆放易燃、易爆物品”说法错误（机房严禁堆放易燃易爆物品），本题选错误说法。A/B/C 正确：禁烟/禁烟火/禁明火取暖均为正确规定。", "118": "C 正确：SA站点可通过部署VoNR功能使SA终端直接通过SA网络进行语音通话。A/B/D 错误：CSFB/SRVCC/EPS Fallback均非SA原生语音方案。", "119": "A 正确：NSA双连接MN根据DRB业务QCI关联的双连接承载类型建立MCG Bearer。B/C/D 错误：SCG/SCG Split/其他不符。", "120": "B 正确：GPON/EPON组网中Type B类型是针对主干光纤的保护（PON口到分光器间）。A/C/D 错误：Type A/C/D不符。", "121": "B 正确：1588与GPS双时钟的相位差要小于1500ns（1.5μs）。A/C/D 错误：1.5ns/500ns/1500us不符。", "122": "C 正确：折射角变成90度时的入射角叫临界角（全反射临界）。A/B/D 错误：反射角/平面角/散射角不符。", "123": "C 正确：障碍处理中介入或更换光缆长度一般不小于200米，尽量同厂家同型号。A/B/D 错误：50/100/500不符。", "124": "A 正确：障碍处理后和迁改后光缆弯曲半径不小于15倍缆径。B/C/D 错误：5/20/10不符。", "125": "C 正确：障碍处理后增加新的线路设备点处应增加新标石（路由标识）。A/B/D 错误：节点/路标/设备不符。", "126": "C 正确：战略物资储备由国务院有关主管部门组织实施。A/B/D 错误：人大常委会/国家主席/军委不符。", "127": "A 正确：窄带应急VSAT系统采用FDMA多址方式。B/C/D 错误：CDMA/TDMA/SDMA不符。", "128": "A 正确：窄带IP接入利用PSTN建设internet公共拨号接入平台。B/C/D 错误：FR/PSPDN/ATM不符。", "129": "A 正确：扎营时厕所应安排在整个营地的下风处（异味不吹向营地）。B/C/D 错误：上风/前方/后方不符。", "130": "B 正确：增益和损耗的单位均可用dB表示。A/C/D 错误：Hz/W/G均非增益损耗单位。", "131": "A 正确：增强型移动宽带对应5G的eMBB应用场景。B/C/D 错误：mMTC/uRLLC/SDN不符。", "132": "C 正确：增大翼型最大升力系数的两个因数是厚度和弯度。A/B 错误：机翼面积/翼展非翼型参数。", "133": "C 正确：增大接地网的面积是减小接地电阻的主要因素（接地电阻与面积成反比）。A/B/D 错误：深度/截面积/体积非主要因素。", "134": "A 正确：网络侧统计终端成功响应Paging的次数=寻呼发出后收到的UE RRC连接请求次数。B/C/D 错误：Service Req/Scheduling/测量报告不符。", "135": "C 正确：光纤中0.95μm/1.24μm/1.39μm处损耗高峰由氢氧根离子（OH-）吸收造成。A/B/D 错误：铒/硅/锗不符。", "136": "A 正确：早晨山谷中升起薄雾，天空通常会晴朗（辐射雾预示晴天）。B/C/D 错误：下雨/大风/大雾不符。", "137": "C 正确：载荷因数是飞机承受的载荷（除重力外）与重力的比值。A/B 错误：拉力阻力比/升力阻力比不符。", "138": "B 正确：载波叠加技术可使双向卫星链路在转发器同一频段同时发射业务载波，节省带宽约50%。A/C/D 错误：30/100/200不符。", "139": "B 正确：PCI规划中按环境分为农村、郊区、城区、密集城区等，主要考虑层数（分层规划）。A/C/D 错误：高度/隔离度/覆盖范围不符。", "140": "D 正确：“测试时要求在STM-N的2M电接口进行”说法不正确（结合抖动测试在光接口与仪表配合下测试），本题选不正确项。A/B/C 正确：光接口收发接仪表、指针序列测试均正确。", "141": "A 正确：现场通信保障应急指挥机构应及时上报任务执行情况（过程信息）。B/C 错误：执行结果/现场情况为具体内容非上报对象。", "142": "C 正确：通话电路建立后主被叫任何一方先挂机即复原，挂机方式为主被叫互不控制（任一挂机即释放）。A/B/D 错误：主叫/被叫/互控不符。", "143": "C 正确：资管系统申请OLT上行电路应在业务电路开通模块下申请。A/B/D 错误：LTE/集团客户/基站电路模块不符。", "1392": "B 正确：应急加油车不属于四类应急通信车（四类含应急通信车/应急指挥车/应急保障车/后勤保障车）。A/C/D 错误：应急通信车/应急指挥车/后勤保障车均属。", "1393": "B 正确：四冲程柴油机一个工作循环曲轴转动二周（四个冲程两圈）。A/C 错误：一周/三周不符。", "1394": "C 正确：四冲程柴油机输出机械功的是膨胀（做功）冲程。A/B/D 错误：进气/压缩/排气不符。", "1395": "A 正确：四冲程柴油机冲程顺序为进气、压缩、做功、排气。B/C/D 错误：顺序不符。", "1396": "C 正确：飞轮刻度0度时第一缸为上死点。A/B 错误：作功上死点/换气上死点不符。", "1397": "C 正确：四冲程柴油机4个过程顺序为进气-压缩-做功-排气。A/B/D 错误：顺序不符。", "1398": "C 正确：热力参数中的压力指绝对压力。A/B/D 错误：表压力/真空度/大气压力不符。", "1399": "A 正确：瞬断的时间规定是5分钟内。B/C/D 错误：5-6/6/10分钟不符。", "1400": "B 正确：选睡袋主要以舒适温标为主。A/C/D 错误：极限温标/最高温标/主要温标不符。", "1401": "A 正确：水中有三种病原需注意：病毒、细菌、寄生虫（123）。B/C/D 错误：组合不符。", "1402": "A 正确：水平波瓣角指天线辐射功率分布在主瓣最大辐射方向两侧电平下降至一半（-3dB）两点间的夹角。B/C/D 错误：定义不符。", "1403": "B 正确：双绞线局域网中双绞线长度不能超过100米。A/C/D 错误：15/500/1200不符。", "1404": "D 正确：双工制通信指移动通信双方可同时进行发信和收信。A/B/C 错误：轮流/交替/顺序不符。", "1405": "A 正确：双工器水平极化用符号H表示。B/C/D 错误：I/V/E不符。", "1406": "C 正确：双工器垂直极化用符号V表示。A/B/D 错误：H/I/E不符。", "1407": "C 正确：衰落是接收电平随时间变化的现象。A/B/D 错误：气候/温度/季节不符。", "1408": "A 正确：衰减的单位是dB（分贝）。B/C/D 错误：MHz/GHz/Hz不符。", "1409": "D 正确：衰耗器主要用途之一是匹配电平。A/B/C 错误：阻抗/电阻/电抗不符。", "1410": "A 正确：基带传输指数字信号的电脉冲不对载波进行调制而直接送往信道。B/C/D 错误：激光/70MHz调制/均不正确不符。", "1411": "A 正确：数字信道通常采用64kBit/s速率（PCM基群话路）。B/C/D 错误：24/24/96不符。", "1412": "D 正确：数字卫星通信方式含数字话音插空时分多址、星上交换时分多址、卫星数字通道方式、不加话音插空的时分多址。A/B/C 错误：码分/空分/频分多址不符。", "1413": "D 正确：TDM/PSK/FDMA方式使用数字话音插空和低速率编码可提高传输容量4～5倍。A/B/C 错误：1-2/2-3/3-4不符。", "1414": "B 正确：数字通信抽样、量化、编解码按时间关系进行必须有同步系统。A/C/D 错误：定时/再生/交换系统不符。", "1415": "B 正确：SDI接口含义是数字串行接口（Serial Digital Interface）。A/C/D 错误：模拟串行/模拟并行/数字并行不符。", "1416": "A 正确：数据最小基本单位是bit（比特）。B/C/D 错误：Byte/KB/MB不符。", "1417": "A 正确：数据报文网络层选路基于最长匹配原则。B/C/D 错误：最短/模糊/序列匹配不符。", "1418": "B 正确：属于干扰随机化的方法是扰码（加扰使干扰随机化）。A/C/D 错误：ICIC/BF/功率控制不符。", "1419": "C 正确：属于增升装置的辅助操纵面是前缘襟翼。A/B 错误：扰流板（减升）/副翼（横滚）不符。", "1420": "A 正确：属于无人机飞控子系统的是无人机姿态稳定与控制。B/C 错误：任务设备管理/信息收集传递不符。", "1421": "A 正确：属于减升装置的辅助操纵面是扰流板。B/C 错误：副翼/前缘缝翼不符。", "1422": "C 正确：Ku波段频率范围是12.5-15GHz（常用12-14GHz）。A/B/D 错误：1-2/4-6/28-30不符。", "1423": "A 正确：输出滤波电路接在整流器与负载之间起平滑滤波作用。B/C/D 错误：直流屏/交流屏/蓄电池不符。", "1424": "B 正确：首届世界互联网大会在乌镇举行，主题互联互通、共享共治。A/C/D 错误：地点/主题组合不符。", "1425": "A 正确：手机最先通过基站设备接入移动通信网络。B/C/D 错误：基站控制器/交换机/位置寄存器不符。", "1426": "D 正确：手机启动同优先级异频测量由Snonintrach参数决定。A/B/C 错误：ThreshServing/SintraSearch/Threshx,low不符。", "1427": "D 正确：手机开机依次同步的信道是RACH、SCH、BCCH。A/B/C 错误：信道顺序不符。", "1428": "C 正确：室外馈线头子防水包扎为7层，最外层必须使用宽胶带，由下向上包扎。A/B/D 错误：3/5/10层不符。", "1429": "C 正确：室外馈线接头、天馈线接头都必须经防水密封处理。A/B/D 错误：防锈/防尘/防沙不符。", "1430": "D 正确：室外宏站解决室内覆盖的主要技术是3D-MIMO（三维波束赋形）。A/B/C 错误：上下行解耦/CRAN/大功率覆盖不符。", "1431": "D 正确：适宜搭建帐篷的地方是防风防雨的较高处。A/B/C 错误：有风山顶/谷底山洞/山腰平地不符。", "1432": "A 正确：适当提高环境温度可缩短蓄电池充电时间（化学反应加速）。B/C 错误：延长/不变不符。", "1433": "B 正确：视频会议系统MCU指多点控制器（Multipoint Control Unit）。A/C/D 错误：终端/信道网络/管理软件不符。", "1434": "C 正确：视频编码器BISS-1加扰方式由16进制组成。A/B/D 错误：8/12/20不符。", "1435": "C 正确：事故隐患指生产系统中可导致事故发生的人的不安全行为、物不安全状态和管理缺陷。A/B/D 错误：经过评估/存在/不容忽视不符。", "1436": "B 正确：事故调查处理应当按照实事求是、尊重科学的原则。A/C 错误：安全第一/公开公正不符。", "1437": "A 正确：市电正常且逆变器无故障时在线式UPS应工作在逆变器状态。B/C/D 错误：静态旁路/维护旁路/动态旁路不符。", "1438": "C 正确：移动通信第一阶段系统主要用于底特律警察局的车载无线电。A/B/D 错误：公交/个人/出租车不符。", "1439": "A 正确：使原来静止的空气产生垂直运动的作用力称为对流冲击力。B/C 错误：气动作用力/热力作用力不符。", "1440": "C 正确：使用转发器功率与总功率的比值要等于租用带宽与转发器总带宽的比值（功率按带宽比例分配）。A/B/D 错误：大于/小于/无关联不符。", "1441": "A 正确：使用应急通信是为了尽快向政府相关部门通报情况，便于由相关部门评估损失。B/C/D 错误：指挥调度/决策依据/追究问责不符。", "1442": "C 正确：使用亚太V卫星传输时，卫星通信车信标接收机频率需设定为1000.5MHz。A/B/D 错误：10.5/100.5/10000.5不符。", "1443": "B 正确：室外接地导线用40×4mm²镀锌扁钢，缠麻布条后浸沥青。A/C/D 错误：润滑油/机油/水不符。", "1444": "C 正确：使用网络方式安装U2000客户端软件的端口号是8080。A/B/D 错误：21/53/80不符。", "1445": "C 正确：升级cisco交换机IOS软件可用TFTP方法。A/B/D 错误：CDP/HSRP/TELNET不符。", "1446": "A 正确：使用灭火器灭火时人应站在侧风方向。B/C/D 错误：逆风/背风/任何方向不符。", "1447": "D 正确：连接器接头不连续会造成光功率的一部分散射损耗或以反射形式损耗。A/B/C 错误：无法传输/菲涅耳反射/散射损耗不符。", "1448": "A 正确：使用返航锁定时遥控器俯仰杆向后拉，飞行器沿返航点方向直线回来。B/C/D 错误：机尾后退/直线远离/机头反向前进不符。", "1449": "C 正确：使用电气工具前应检查，尽量选用双重绝缘的工具。A/B/D 错误：导电/不导电/不漏电不符。", "1450": "D 正确：电流矩法常用到电流与流经导体长度的乘积。A/B/C 错误：电压电流/横截面组合不符。", "1451": "B 正确：微波工作频率越高，电波自由空间损耗越大（L=92.45+20lgf+20lgd）。A/C/D 错误：越小/不一定/不变不符。", "1452": "D 正确：使用单位每年至少一次组织特种设备意外事件和事故紧急救援演习。A/B/C 错误：月/季/半年不符。", "1453": "B 正确：使用大功率电动机具设备施工，工作电压超过36V应戴绝缘手套、穿绝缘鞋。A/C/D 错误：24/48/60V不符。", "1454": "A 正确：LTE分组域支持话音业务的技术方案是VoLTE、SRVCC。B/C 错误：CSFB/双待机不符。", "1455": "D 正确：使用梯子登高作业时闭锁部件应完好，底部坚实防滑。A/B/C 错误：铁架/桌子/凳子不符。", "1456": "C 正确：使飞机获得最大下滑距离的速度是下滑有利速度。A/B 错误：最大下滑速度/失速速度不符。", "1457": "C 正确：实现DC/AC变换的电路称逆变电路。A/B/D 错误：整流（AC/DC）/变频/稳压不符。", "1458": "C 正确：时分多路复用是多个话音PCM信道在时间域内顺序排列合并成一个单一数据流的过程。A/B/D 错误：载频/带宽/码流不符。", "1459": "C 正确：十年来我们经历了对党和人民事业具有重大意义的三件大事。A/B/D 错误：一/二/四不符。", "1460": "A 正确：施工现场必须设置消防车道，宽度不少于3.5米。B/C/D 错误：4/3.0/5不符。", "1461": "A 正确：失速时机翼升力的向上力和尾部向下的力失去平衡（升力不足）。B/C 错误：力平衡关系不符。", "1462": "A 正确：省级应急管理部门建设应急管理综合应用平台，汇聚本地区应急管理信息。B/C/D 错误：指挥调度平台/系统/大数据平台不符。", "1463": "D 正确：省级通信保障应急指挥机构负责确认、通报Ⅱ、Ⅲ、Ⅳ级预警。A/B/C 错误：Ⅰ级/Ⅱ级/Ⅲ、Ⅳ级不符。", "1464": "A 正确：省级传输拓扑图要求包含一干、二干。B/C/D 错误：超级基站/节点站/传输出口不符。", "1465": "B 正确：生产经营单位与从业人员订立协议不可以免除或减轻对从业人员因生产安全事故伤亡依法应承担的责任。A/C 错误：可以/双方自愿不符。", "1466": "A 正确：生产经营单位应该免费为从业人员提供符合国家标准或行业标准的劳动保护用品。B/C 错误：成本价/有偿不符。", "1467": "C 正确：单位负责人接到事故报告后应迅速组织抢救，防止事故扩大，减少人员伤亡和财产损失。A/B 错误：消息扩散/走漏不符。", "1468": "B 正确：发生生产安全事故时单位主要负责人应当立即组织抢救。A/C 错误：冲进现场/组织调查不符。", "1469": "A 正确：事故现场有关人员应当立即报告本单位负责人。B/C 错误：安全干部/保卫干部不符。", "1470": "C 正确：生产经营单位对重大危险源应当登记建档、定期检测评估监控、制定应急预案。A/B 错误：事故频发现场/重大事故隐患不符。", "1471": "C 正确：主要负责人未依法履职导致事故构成犯罪的依法追究刑事责任。A/B 错误：行政/民事责任不符。", "1472": "C 正确：生产经营单位的主要负责人对本单位安全生产工作全面负责。A/B 错误：主要/全部不符。", "1473": "B 正确：生产经营单位的从业人员有依法获得安全生产保障的权利。A/C 错误：工人/管理人员不符。", "1474": "C 正确：必须为从业人员提供符合国家标准或行业标准的劳动防护用品。A/B 错误：当地/本单位不符。", "1475": "A 正确：生产过程的密闭化、自动化是解决毒物危害的根本途径。B/C/D 错误：湿式作业/干式捕尘/加强通风不符。", "1476": "C 正确：升级单盘拖入主控盘时传输方式应设置为二进制。A/B/D 错误：十进制/八进制/十六进制不符。", "1477": "A 正确：甚高频信号也叫甚短波信号。B/C/D 错误：超短波/极短波/微短波不符。", "1478": "A 正确：椰子油可以用来止痛。B/C/D 错误：棕榈树油/矮灌木/海藻不符。", "1479": "A 正确：真菌类是蛋白质的重要来源（菌菇蛋白）。B/C/D 错误：植物叶子/根茎/蔬菜不符。", "1480": "B 正确：VoLTE是4G+高清语音（Voice over LTE）。A/C 错误：4G+网络加速/视频通话不符。", "1481": "D 正确：使一个应用获得更多带宽的方法可用QoS机制、载荷压缩、包头压缩（以上全部）。A/B/C 错误：仅一项不完整。", "1482": "A 正确：以党的自我革命引领社会革命。B/C/D 错误：政治/经济/文化革命不符。", "1483": "A 正确：深度休眠节能在话务闲时时段配置关闭尽量多的AAU/RRU硬件。B/C/D 错误：任意/平稳/忙时不符。", "1484": "A 正确：申请飞行计划通常应当于飞行前一日15时前向空中交通管制部门提出申请。B/C 错误：16/17时前不符。", "1485": "B 正确：机长对机组成员遵守飞行基本规则负责。A/C 错误：航空单位负责人/民航局不符。", "1486": "B 正确：涉密信息处理场所应当定期或根据需要作保密技术检查。A/C/D 错误：安全性能防护/不定期/保密管理不符。", "1487": "C 正确：涉密人员离岗、离职前应将涉密载体全部清退并办理移交手续。A/B/D 错误：登记/订卷归档/销毁不符。", "1488": "D 正确：涉密计算机使用无线外网设备，涉密信息会随无线信号在空中传递极易被截获，安装有无线网卡的涉密计算机应自动关闭其联网程序。A/B/C 错误：线路上/自动关机/被动关机不符。", "1489": "A 正确：涉密计算机放置应与非涉密计算机或设备保持1米以上隔离距离。B/C/D 错误：2/3/5不符。", "1490": "C 正确：涉密场所中连接互联网的计算机不得配备、安装、使用视频和输入设备。A/B/D 错误：所有的/涉密的/便携式不符。", "1491": "D 正确：涉电作业必须使用绝缘良好的工具，并由专业人员操作。A/B/C 错误：作业/从业/施工人员不符。", "1492": "A 正确：射频单元以及部分基带物理层底功能与天线构成AAU（有源天线单元）。B/C/D 错误：CU/DU/RU不符。", "1493": "A 正确：社会安全事件发生后由公安机关针对事件的性质和特点处置。B/C/D 错误：司法机关/村委会/居委会不符。", "1494": "B 正确：设置PDCCH信道是否使用发射分集的参数是Transmit Diversity。A/C/D 错误：Cell Open-loop/Cell transmit/Cell Closeloop不符。", "1495": "B 正确：设置IP地址MAC绑定的目的是防止非法接入。A/C/D 错误：泄露拓扑/加强认证/防DOS不符。", "1496": "A 正确：支路板通道T-ALOS告警可能原因是本端没有电信号进来（本端接收告警）。B/C/D 错误：对端/业务配置/光纤中断不符。", "1497": "B 正确：设备或线路确认无电应以验电器指示作为根据。A/C 错误：电压表/断开信号不符。", "1498": "D 正确：设备故障处理：处理不了的上报、现场原则上只更换故障件、结束后经技术验收（以上均要做到）。A/B/C 错误：仅一项不完整。", "1499": "A 正确：设备联合接地接地电阻应小于1欧姆。B/C/D 错误：2/3/4不符。", "1500": "D 正确：烧伤后至少应该立即用凉水处理10分钟。A/B/C 错误：5/6/8不符。", "1501": "A 正确：上行链路指从地球站到卫星之间的链路。B/C/D 错误：卫星到地球站（下行）/主站到远端站/远端站到主站不符。", "1502": "D 正确：上行链路发送的第一个突发是FB（Frame Burst，帧突发）。A/B/C 错误：NB/SB/RB不符。", "1503": "C 正确：上行链路的测量报告在SACCH上传送（慢速随路控制信道）。A/B/D 错误：SDCCH/RACH/FACCH不符。", "1504": "B 正确：上行调度请求（SR）在PUCCH信道发送。A/C/D 错误：PRACH/PUSCH/SRS不符。", "1505": "A 正确：网络侧为UE选择NR上行或SUL作为上行链路时通过RRC重配置消息指示。B/C/D 错误：RAR响应/连接建立/SIP不符。", "1506": "A 正确：上下行解耦场景RRU用于服务于上行小区。B/C 错误：下行/上下行小区不符。", "1507": "A 正确：下杆时允许滑下是上杆操作错误选项（必须一步一步下杆）。B/C/D 错误：劳保穿戴整齐/戴安全帽穿绝缘鞋/上杆2米系安全带均正确。", "1508": "C 正确：上变频器第二中频通常选在700-1120MHz避免镜像和杂散干扰。A/B/D 错误：70-140/140-700/140-1120不符。", "1509": "C 正确：色散位移光纤将零色散点移到1550nm处。A/B 错误：850/1310不符。", "1510": "B 正确：伞降回收是当无人机完成任务后地面站发出指令开伞回收。A/C 错误：主伞减速伞阻力伞/悬挂主伞慢慢着陆不符。", "1511": "A 正确：三相四线制A、B、C、N颜色顺序为黄、绿、红、蓝。B/C/D 错误：顺序不符。", "1512": "D 正确：三相交流电压传感器可测试过压、欠压、停电及缺相告警（缺相及上述三个）。A/B/C 错误：仅一项不完整。", "1513": "D 正确：三相交流电压传感器可测试过压、缺相、停电告警功能（上面描述的所有功能）。A/B/C 错误：仅一项不完整。", "1514": "A 正确：三大气象要素为气温、气压和空气湿度。B/C 错误：气温风和云/风云降水不符。", "1515": "A 正确：三层交换的概念是路由一次，交换多次。B/C/D 错误：交换一次路由多次等不符。", "1516": "C 正确：三不放过原则指事故原因没有查清、事故责任者和职工没受教育、没有防范措施不放过。A/B 错误：组合不符。", "1517": "C 正确：驻波比1.2对应回波损耗约21dB。A/B/D 错误：19/20/22不符。", "1518": "D 正确：G652光缆高速率波分系统应注意到两条缆上纤芯色散指标的差异，防止出现色散受限。A/B/C 错误：衰耗/中心波长/信噪比不符。", "1519": "C 正确：0dBm对应1mW（0dBm=1mW）。A/B/D 错误：0.1/0.01/10mW不符。", "1520": "A 正确：连续625us收不到正确A1、A2字节为OOF；连续3ms收不到为LOF。B/C/D 错误：顺序组合不符。", "1521": "C 正确：-23dBm对应约0.005mW（10^(-2.3)≈0.005）。A/B/D 错误：0.05/0.01/0.1不符。", "1522": "C 正确：L3VE接口IP采用27位掩码，L2VE最多可配置29个VLAN子接口。A/B/D 错误：28/30/31不符。", "1523": "C 正确：软切换是由BSC（基站控制器）完成的。A/B/D 错误：MS/BTS/MSC不符。", "1524": "C 正确：软切换是先建立连接再断开（先连后断）。A/B/D 错误：直接断开/先断后连/都可以不符。", "1525": "C 正确：如翼模式定制网主要用于业务高隔离高保障客户。A/B/D 错误：广域优先/时延敏感/要求不高不符。", "1526": "C 正确：车联网业务需要考虑用户面下沉的设计（低时延）。A/B/D 错误：抄表/视频监控/移动互联网不符。", "1527": "A 正确：ETFC单板可被OptiX PTN1900使用。B/C/D 错误：EG16/MQ1/MP1不符。", "1528": "D 正确：上下行解耦对具体站型有要求（描述错误项）。A/B/C 正确：C波段上下行不平衡/LTE上行PRB利用率高/LTE-NR上行1.8G均正确。", "1529": "B 正确：LOS告警是主干光纤断或OLT检测不到预期的光信号。A/C/D 错误：LOF/down/LOSi不符。", "1530": "C 正确：驻波比不是天线辐射参数（是电气参数）。A/B/D 错误：垂直波瓣/水平波瓣/增益均为辐射参数。", "1531": "C 正确：EN-DC可判断SCTP偶联承载为X2类型（EN-DC接口）。A/B/D 错误：S1AP/NGAP/NBAP不符。", "1532": "C 正确：灵活子载波带宽不可以提升网络频谱效率（新信道编码/256QAM/MassiveMIMO均可提升）。A/B/D 错误：均能提升频谱效率。", "1533": "D 正确：TT供电方式单相供电选择1+1型SPD，三相供电选择3+1型SPD。A/B/C 错误：组合不符。", "1534": "A 正确：利用植物辨别方向，南面植物枝叶茂密（向阳）。B/C/D 错误：北/东/西面不符。", "1535": "B 正确：可通过查看源小区下发的切换命令中是否包含随机接入专用前导（RACH）确定基于竞争或非竞争。A/C/D 错误：查看方式不符。", "1536": "A 正确：防止落石危险应戴好安全头盔。B/C/D 错误：高绕下切/小分队/间隔上攀不符。", "1537": "B 正确：查询OLT单板状态用display board命令。A/C/D 错误：display patch/alarm/frame不符。", "1538": "B 正确：只有一条跑道时使用方向应保证航空器逆风起降（减小离地速度）。A/C 错误：顺风/侧风不符。", "1539": "B 正确：查询OLT侧MAC学习发现上联口MAC过多，通常来自上行网络侧（广播风暴等）。A/C/D 错误：设备内部/没有一侧/用户侧不符。", "1540": "B 正确：月亮在太阳之前升起，被照亮的一面处于西方。A/C/D 错误：东/南/北不符。", "1541": "C 正确：SOS已发出或断定在常规航道附近，应至少坚持72小时。A/B/D 错误：24/48/96不符。", "1542": "B 正确：小区只用一面天线实现，该天线一般是双极化天线。A/C/D 错误：单极化/水平/垂直极化不符。", "1543": "C 正确：天气特别热或冷、剧烈运动时人体需水量5-7升。A/B/D 错误：1-3/2-4/7-9不符。", "1544": "A 正确：遇湿易燃物品火灾禁止用水、泡沫灭火器（遇湿加剧燃烧）。B/C 错误：干粉/沙土可用。", "1545": "B 正确：内部网络192.168.1.0/24需用地址转换（NAT）才能访问互联网。A/C/D 错误：地址学习/绑定/URL过滤不符。", "1546": "D 正确：主机能与部分主机通信而不能同另一部分通信，发生部分是部分网络失效。A/B/C 错误：掩码/ARP表/路由器配置不符。", "1547": "B 正确：怀疑脊椎骨折损伤必须用硬质担架或木板搬运。A/C 错误：软担架被子/直接手抬不符。", "1548": "A 正确：光接口L-12表示155M长距光板，1550nm波长。B/C/D 错误：1310nm/622M不符。", "1549": "A 正确：抄表物联网做切片设计，移动性管理功能可以考虑做剪裁（固定位置抄表终端移动性需求低）。B/C/D 错误：设备管理/话单/会话管理不符。", "1550": "B 正确：对称机翼仰头旋转迎角，驻点稍稍向前缘的下表面移动。A/C 错误：上表面/不移动不符。", "1551": "B 正确：传输网元已做归属并开通电路，修改所属机房需走机房搬迁流程。A/C/D 错误：直接修改/EMS采集/删除重采不符。", "1552": "A 正确：并列双驾驶座舱左座为机长位置，旋翼采用俯视顺时针旋转好一些。B/C 错误：逆时针/无区别不符。", "1553": "B 正确：不急于用5G切片仅用于eMBB业务，Option3（NSA组网）是好的选择。A/C/D 错误：Option4/5/2不符。", "1554": "A 正确：Tunnel一端MEP收不到服务层MEP的CV连接检测信息给出L（错误：题干表述确实会产生告警，A为正确判断）。B 错误：正确不符。", "1555": "A 正确：LTE小区带宽20M，上下行UE最大分配RB数量100个。B/C/D 错误：75/50/25不符。", "1556": "B 正确：飞机失速时飞行员应立即推杆到底（减小迎角改出失速）。A/C 错误：蹬舵/拉杆不符。", "1557": "D 正确：LNB未工作时信标接收机电平值通常为-105dBm。A/B/C 错误：-70/-80/-90不符。", "1558": "D 正确：HD4580-2模块不均流无告警时，先检查监控与模块状态正常，确认后再处理。A/B/C 错误：均流线/PSM-A调节/浮充电位器不符。", "1559": "D 正确：熔丝作用是过流和短路保护。A/B/C 错误：过压/过流/短路（单项）不符。", "1560": "C 正确：任意两个同一波束覆盖区地球站经静止卫星转接双程传输时间约500ms。A/B/D 错误：200/800/1000以上不符。", "1561": "A 正确：任务高度0~100m之间的无人机为超低空无人机。B/C 错误：低空/中空不符。", "1562": "C 正确：发现火灾应立即打119电话报警。A/B/D 错误：110/120/911不符。", "1563": "B 正确：未取得生产许可证均不得生产民用航空器。A/C 错误：适航证/型号合格证不符。", "1564": "B 正确：任何单位和个人不得阻挠和干涉对案件的依法调查处理。A/C 错误：参与和阻挠/参与和干涉不符。", "1565": "A 正确：严格遵守交通法规，自觉谨慎驾驶，做到依法行驶、文明行驶。B/C/D 错误：依次/依据/依规不符。", "1566": "C 正确：飞行人员执行飞行任务时应随身携带驾驶员执照或合格证。A/B 错误：飞行记录本/适航证书不符。", "1567": "B 正确：人工挖沟时相邻作业人员必须保持2m以上距离。A/C/D 错误：1/3/4不符。", "1568": "C 正确：人工呼吸救援法中开始5分钟最为关键。A/B/D 错误：3/4/10不符。", "1569": "D 正确：人触电摆脱电流直流为50mA。A/B/C 错误：5/10/20不符。", "1570": "B 正确：人触电摆脱电流交流为10mA。A/C/D 错误：5/20/50不符。", "1571": "A 正确：热带雨林潮气重，应选择直立的死树干生火（干燥易燃）。B/C/D 错误：倒下的树干/沼泽树木/硅化木不符。", "1572": "C 正确：稻子豆树不属于热带地区生长植物。A/B/D 错误：番木瓜/木薯/野稻谷均属热带植物。", "1573": "B 正确：燃放篝火求救信号将火堆摆成三角形，每堆间距相等最为理想。A/C/D 错误：一字/四边/六边不符。", "1574": "C 正确：确立和坚持马克思主义在意识形态领域指导地位的根本制度。A/B 错误：传统文化/核心价值观不符。", "1575": "A 正确：全向天线做发射天线时排水口向上，应封住（防雨水进入）。B/C/D 错误：向下/不应不符。", "1576": "D 正确：全向天线实现360度内均匀辐射。A/B/C 错误：60/120/240不符。", "1577": "A 正确：全向天线特性是其水平面方向图是一个圆。B/C/D 错误：垂直面圆/所有方向相同/以上正确不符。", "1578": "B 正确：全向天线的极化方式为垂直线极化。A/C/D 错误：水平线极化/垂直圆极化/水平圆极化不符。", "1579": "A 正确：全向天线覆盖方向是在水平面内全向辐射（360°）。B/C/D 错误：垂直面/120不符。", "1580": "D 正确：全向天线TX与RX之间最小水平距离6M。A/B/C 错误：3/1/2不符。", "1581": "C 正确：全向收发天线空间分集距离一般要求大于4m。A/B/D 错误：2/3/5不符。", "1582": "D 正确：全球星系统多址方式采用FDMA+CDMA方式。A/B/C 错误：FDMA/CDMA/TDMA+CDMA不符。", "1583": "B 正确：全球星卫星通信系统属于低轨道移动卫星通信系统（LEO）。A/C/D 错误：静止/区域/同步轨道不符。", "1584": "B 正确：坚持“一国两制”、“港人治港”、“澳人治澳”、高度自治的方针。A/C 错误：自主自治/全面自治不符。", "1585": "C 正确：全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在党。A/B 错误：关键在人/民不符。", "1586": "C 正确：全面建设社会主义现代化国家必须充分发挥亿万人民的创造伟力。A/B/D 错误：创新动力/创新伟力/创造动力不符。", "1587": "C 正确：全集团成本最低的高通量卫星设备配置方案，应急车改造成本小于1万元。A/B/D 错误：2/5/0.5不符。", "1588": "D 正确：动中通车载站在车速120KM/小时条件下可实现车载站卫星通信。A/B/C 错误：80/100/不限不符。", "1589": "C 正确：全国公用应急宽带VSAT网工程由主控站、省固定站和远端移动站手持站构成。A/B 错误：市固定站/车载站不符。", "1590": "C 正确：全国公用应急宽带VSAT网网管系统分专用网管、综合网管、网管终端三部分。A/B/D 错误：服务器/计费系统/卫星调制解调器不符。", "1591": "C 正确：全电视信号主要由图像信号、复合同步信号、复合消隐信号组成。A/B/D 错误：组成不符。", "1592": "B 正确：贯彻群众路线，尊重人民首创精神。A/C 错误：创新/创造精神不符。", "1593": "C 正确：全党要把青年工作作为战略性工作来抓。A/B 错误：基础性/根本性不符。", "1594": "A 正确：务必敢于斗争、善于斗争，坚定历史主动。B/C/D 错误：历史自觉/担当不符。", "1595": "B 正确：“务必敢于斗争、善于斗争”对应①敢于③善于组合（①③）。A/C/D 错误：组合不符。", "1596": "A 正确：活塞由上止点移向下止点、进气门开排气门关、气缸负压是进气过程。B/C/D 错误：压缩/做功/排气不符。", "1597": "B 正确：曲轴连杆机构将活塞直线运动转变为曲轴的圆周运动输出动能。A/C/D 错误：往复/直线/上下运动不符。", "1598": "A 正确：区内应急通信保障力量不足时由当地通信管理局向工业和信息化部提出支援申请。B/C 错误：当地保障队伍/单位总部不符。", "1599": "C 正确：PCFICH不是5G NR的物理信道（NR无PCFICH，LTE才有）。A/B/D 错误：PDCCH/PUCCH/PDSCH均为NR物理信道。", "1600": "A 正确：天线的机械下倾角度过大会导致波束变形（描述正确）。B/C 错误：电子下倾改变振子/垂直安装描述不符。", "1601": "C 正确：话音信号处理顺序为语音→话音编码→信道编码→交织→调制（顺序C）。A/B/D 错误：顺序不符。", "1602": "D 正确：清洗空气过滤器不能用50℃以上的热水清洗。A/B/C 错误：30/40/20℃可用。", "1603": "C 正确：墙壁线缆跨越街巷、院内通道等处，最低点距地面不小于4.5m。A/B/D 错误：2.5/3.5/5.5不符。", "1604": "D 正确：强雷区为一年平均雷暴日超过90天的地区。A/B/C 错误：25/26-40/41-90不符。", "1605": "A 正确：前缘缝翼主要作用是放出前缘缝翼可增大飞机的临界迎角（延缓失速）。B/C 错误：增大升力/减小阻力不符。", "1606": "D 正确：前向信令和后向信令按信令传送方向划分。A/B/C 错误：区域/信道/功能划分不符。", "1607": "D 正确：前向快速功率控制信号在R-PICH（导频信道）中传送。A/B/C 错误：F-FCH/F-PCH/R-ACH不符。", "1608": "C 正确：前轮胎爆裂出现转向时控制住方向，轻踏制动踏板使车辆缓慢减速。A/B/D 错误：紧急制动/驻车制动/迅速踏下不符。", "1609": "C 正确：铅酸蓄电池正极板活性物质为PbO2（二氧化铅）。A/B/D 错误：Pb/PbSO4/Cu不符。", "1610": "B 正确：铅酸蓄电池充电时负极板析出氢气。A/C/D 错误：氧气/氮气/二氧化碳不符。", "1611": "A 正确：铅酸蓄电池正极物质为PbO2、负极物质为Pb。B/C/D 错误：组合不符。", "1612": "A 正确：铅酸蓄电池电解液是硫酸。B/C/D 错误：盐酸/二氧化铅/硫酸铅不符。", "1613": "A 正确：充电过程中水分子不断消耗，硫酸分子不断生成，电解液密度不断升高。B/C/D 错误：过程关系不符。", "1614": "C 正确：汽油机启动后应空载运行3-5分钟，机组预热后合上输出开关供电。A/B/D 错误：10/15/1-2分钟不符。", "1615": "B 正确：气象上的风向指风的来向。A/C 错误：风的去向/气压梯度力方向不符。", "1616": "B 正确：气温垂直递减率等于零的气层称为等温层。A/C 错误：逆温层（负值）/不稳定气层不符。", "1617": "C 正确：气温0℃以下时无防冻液应将冷却水放净。A/B/D 错误：10/5/-5不符。", "1618": "B 正确：空气密度与气压成正比，与气温成反比（空气密度=气压/温度关系）。A/C 错误：关系不符。", "1619": "A 正确：气温高时空气密度小，飞机滑跑距离变长（升力减小）。B/C 错误：气温低/密度大关系不符。", "1620": "D 正确：气缸作用是使燃料燃烧和气体膨胀。A/B/C 错误：气体压缩/能量增加/能量减少不符。", "1621": "B 正确：气垫着陆优点是着陆不受无人机大小、重量限制。A/C 错误：最大缺点/空中回收不符。", "1622": "A 正确：起飞时间（陆上）指航空器开始起飞滑跑轮子转动的瞬间。B/C 错误：抬前轮/进入跑道不符。", "1623": "C 正确：起飞时可操纵变距螺旋桨桨叶角调到小桨叶角及高转速状态（最大拉力）。A/B 错误：低转速/大桨叶角不符。", "1624": "C 正确：企业特种作业人员持证上岗率应达到1（100%）。A/B 错误：0.85/0.95不符。", "1625": "D 正确：普通用户手机接听天通号码呼入时，显示对方号码归属地是西安。A/B/C 错误：北京/上海/武汉不符。", "1626": "C 正确：扑救火灾要争取灭早、灭小、灭了，将火灾控制在初起阶段。A/B/D 错误：组合不符。", "1627": "B 正确：破坏性地震指5级以上的地震。A/C/D 错误：4/6/7不符。", "1628": "A 正确：平流层飞行按高度区分为12000米（不含）以上。B/C 错误：9000/12000含以上不符。", "1629": "A 正确：平流层气温随高度增高而升高（臭氧吸收太阳紫外辐射）。B/C 错误：不随高度变化/不含水汽不符。", "1630": "C 正确：平流层对航空有利方面是气流平稳、能见度好、空气阻力小。A/B 错误：无恶劣天气/气温低载重不符。", "1631": "C 正确：平均发送光功率是发送机耦合到光纤的伪随机数据系列的平均功率在S参考点的测试值。A/B/D 错误：最高/最低/参考不符。", "1632": "B 正确：每次飞行所装总燃油量并不完全一样，也不可能完全消耗掉，一般留有10%-15%裕量。A/C 错误：5-10/5-15不符。", "1633": "B 正确：频谱分析仪中RBW称为分辨率带宽。A/C 错误：射频带宽/视频带宽不符。", "1634": "A 正确：频率在3000GHz以下在空中传播（不用人工导播）的电磁波叫无线波。B/C/D 错误：3000MHz/300MHz/300GHz不符。", "1635": "A 正确：频率容限是发射的特征频率偏离参考频率的最大容许偏差。B/C/D 错误：占用频带中心/本振/指配频率不符。", "1636": "B 正确：频分多路复用是多个话音通道在基带频率上按频率顺序排列合并成一个宽带信号的过程。A/C/D 错误：窄带/模拟/数字不符。", "1637": "B 正确：偏转副翼使飞机转弯时外侧机翼阻力大（外侧副翼上偏阻力大）。A/C 错误：内侧/相等不符。", "1638": "B 正确：偏转副翼转弯时机翼阻力使飞机向转弯外侧偏转（阻力偏航）。A/C 错误：内侧偏转/无影响不符。", "1639": "B 正确：偏振模色散英文缩写是PMD。A/C/D 错误：PCM/ADM/OADM不符。", "1640": "A 正确：偏馈卫星天线的优点是天线增益略比正馈高（无馈源遮挡）。B/C/D 错误：工艺简单/抗干扰/不积雪不符。", "1641": "B 正确：一匹（马力）=735W。A/C/D 错误：789/967/658不符。", "1642": "B 正确：批量修改中间件数据需要用带int_id为索引的更新模板维护。A/C/D 错误：删除/修改/新增模板不符。", "1643": "B 正确：喷油太迟部分燃油在排气管中燃烧，柴油机冒黑烟。A/C/D 错误：黄/蓝/白不符。", "1644": "A 正确：当使用单层标签时业务VLAN必须（选项A称无需）为全局统一（A叙述错误）。B/C/D 正确：同一PON口宽带VLAN规划/ONU按VLAN/宽带用QinQ双层标签均正确。", "1645": "D 正确：配线负荷端电压变动幅度小，配线中的电力损失减小。A/B/C 错误：大增大/小增大/大减小不符。", "1646": "C 正确：配电室的门必须向外开，便于事故时疏散。A/B 错误：内外两面/向内不符。", "1647": "B 正确：抛物面天线口径越大，半功率点宽度越小（波束越窄）。A/C/D 错误：越大/不变/相同不符。", "1648": "C 正确：判断微波传输系统故障最常用方法是闭环测试（环回测试）。A/B/D 错误：开环/电平/稳定度不符。", "1649": "B 正确：判定光纤内有无传输光的仪表是光纤识别仪。A/C 错误：色散测试仪/光源不符。", "1650": "C 正确：判定电流所产生磁场的方向用右手螺旋定则（安培定则）。A/B/D 错误：左手/右手/无法确定不符。", "1651": "B 正确：排气门间隔越大，排气不充分。A/C 错误：充分/不影响不符。", "1652": "D 正确：排查光模块和光纤故障可尝试更换光模块判断光模块是否故障。A/B/C 错误：光口异常换光纤/单模多模混用/收光-40dBm可用均不符。", "1653": "A 正确：爬升注意事项是飞行员不应以垂直上升作为主要爬升方式（耗油大风险高）。B/C 错误：垂直上升保持/回避区不符。", "1654": "A 正确：暖锋是锋面移动过程中暖空气推动冷空气移动的锋。B/C 错误：一侧气团温度明显高/两气团温度不同不符。", "1655": "C 正确：暖锋产生差的能见度和下雨，移动较慢（冷锋移动快）。A/B 错误：冷锋10-25/暖锋20-35不符。", "1656": "B 正确：能接收的最大光功率减去灵敏度为动态范围（单位dB）。A/C/D 错误：收光绝对值/光功率最小值/灵敏度不符。", "1657": "A 正确：用望远镜目测是测量能见度的错误方法（应用透射仪/激光能见度仪）。B/C 错误：大气透射仪/激光自动测量仪均正确。", "1658": "A 正确：内燃机是将液体或固态燃料化学能转化为机械能的装置。B/C/D 错误：机械能转化/热能电能/机械电能不符。", "1659": "C 正确：内燃机通过活塞在气缸内连续进行进气、压缩、作功、排气往复循环完成能量转换。A/B/D 错误：循环过程不全。", "1660": "A 正确：1/2″馈线衰减最大（馈线越细衰减越大）。B/C/D 错误：7/8″/13/8″衰减较小。", "1661": "D 正确：H808EPSD单板支持将同一芯片上的PON口加入同一个保护组。A/B/C 错误：H802EPBD/H802EPBC/H802EPFD不符。", "1662": "B 正确：TM2传输模式有助于提高信噪比较差小区边缘的覆盖性能（发射分集）。A/C/D 错误：TM1/TM3/TM4不符。", "1663": "C 正确：Gs接口能够实现组合RA和LA更新。A/B/D 错误：Gn/Gi/Gb不符。", "1664": "C 正确：VoLTE默认承载是QCI5（IMS信令默认承载）。A/B/D 错误：QCI1（语音）/QCI3/QCI7不符。", "1665": "D 正确：ONU管理路由与H248语音业务无关。A/B/C 错误：语音VLAN/MGC的IP/MG的IP均相关。", "1666": "C 正确：天线分集增益不属于下行影响覆盖的因素（分集增益是接收端特性）。A/B/D 错误：频段/合路损耗/天线下倾角均影响下行覆盖。", "1667": "D 正确：手机通过结束后不属于系统信息获取流程的时机。A/B/C 错误：重新进入覆盖区域/切换完成后/手机开机后均为获取时机。", "1668": "D 正确：更换可能有问题设备不属于网络优化基本方法（是维护手段）。A/B/C 错误：调整方向角/下倾角/天线高度均为优化方法。", "1669": "D 正确：安全激活不属于手机开机第一步流程（开机第一步为PLMN选择/小区驻留/位置登记）。A/B/C 错误：PLMN选择/小区驻留/位置登记均属开机流程。", "1670": "A 正确：总发射功率不属于上行影响覆盖的因素（上行看终端/基站/分集）。B/C/D 错误：基站接收灵敏度/终端发射功率/天线分集增益均影响上行。", "1671": "C 正确：功率控制切换不属于切换控制方式（切换控制含网络控制/终端控制/网络辅助）。A/B/D 错误：网络控制/终端控制/网络辅助均为切换控制方式。", "1672": "C 正确：MEC技术实现业务平台下沉至网络边缘。A/B/D 错误：SDN/NFV/NS不符。", "1673": "C 正确：RRCConnectionRequest信令中有详细EstablishmentCause表明RRC连接建立原因。A/B/D 错误：RA preamble/RA Response/RRCConnectionSetup不符。", "1674": "A 正确：CCCH信道上的RRC消息使用SRB0。B/C/D 错误：PDSCH/DCCH/PCH不符。", "1675": "C 正确：SMF网元负责PDU Session的控制和管理。A/B/D 错误：AMF/UPF/PCF不符。", "1676": "D 正确：PUSCH上行物理信道可以使用16QAM编码。A/B/C 错误：PUCCH/PRACH/SRS不符。", "1677": "C 正确：紧急级别告警优先级最高。A/B/D 错误：重要/次要/提示不符。", "1678": "B 正确：地球的磁场不是引起摄动的原因（摄动由地球圆度/大气/外引力等引起）。A/C/D 错误：地球圆度/大气/外引力均为摄动原因。", "1679": "A 正确：FTTH是光纤到用户（户）的概念。B/C/D 错误：光纤到路边/楼道的概念不符。", "1680": "C 正确：目前主流民用无人机动力系统通常为活塞式发动机和电动机两种。A/B 错误：涡喷/涡扇发动机不符。", "1681": "B 正确：目前中国最大面积铺设的光纤是G.652（常规单模光纤）。A/C/D 错误：G.653/654/655不符。", "1682": "D 正确：VSAT网状网系统中不经常使用SDMA（空分多址需天线指向控制）。A/B/C 错误：DAMA/SCPC、TDM/SCPC、TDMA均常用。", "1683": "A 正确：ITU-T G.7041标准中MSTP将以太网数据封装协议是通用成帧规程（GFP）。B/C/D 错误：HDLC/LAPS/PPP不符。", "1684": "C 正确：我国通信机房主要分为有人值守机房和无人值守机房两种。A/B/D 错误：分类不符。", "1685": "A 正确：天线下倾角调整方式有机械调整和电气调整两种。B/C/D 错误：组合不符。", "1686": "C 正确：目前天通业务服务热线是8008710000。A/B/D 错误：10000/4008710000/4008510000不符。", "1687": "A 正确：目前数字电视传输标准主要有DVB。B/C/D 错误：PAL/NTSC/IPTV不符。", "1688": "A 正确：利用卫星传输采用频分多址的是FDMA。B/C/D 错误：TDMA/SDMA/CDMA不符。", "1689": "A 正确：LTE系统内切换基于RSRP（参考信号接收功率）。B/C/D 错误：CQI/RSRQ/RSSI不符。", "1690": "C 正确：集团统配C网小车卫星功放大小为40W。A/B/D 错误：20/30/70不符。", "1691": "B 正确：目前短波通信主要方式是单边带通信（SSB）。A/C/D 错误：调频/扩频/双边带不符。", "1692": "B 正确：电信联通5G共建共享采用接入网共享、核心网独立方案。A/C/D 错误：核心网均共享/仅核心网/仅传输不符。", "1693": "B 正确：低频（FR1）使用的子载波带宽30kHz。A/C/D 错误：15/60/120不符。", "1694": "A 正确：目前低频5G带宽是100MHz。B/C/D 错误：20/50/200不符。", "1695": "B 正确：基站开关电源对蓄电池浮充电流采用负温度系数调节（温度升高浮充电压降低）。A/C/D 错误：正温度系数/无所谓/均可不符。", "1696": "D 正确：波分复用系统在1550nm波长附近开发。A/B/C 错误：1310/1510/670不符。", "1697": "A 正确：超级基站常采用的卫星是同步静止轨道卫星。B/C 错误：中轨/倾斜同步不符。", "1698": "B 正确：石英光纤3个低损耗窗口是850nm、1310nm、1550nm。A/C/D 错误：1460/1610/1750不符。", "1699": "B 正确：OLT建设指导方案中多采取二级分光。A/C/D 错误：一级/三级/四级不符。", "1700": "C 正确：家客场景二级分光点的位置处于小区内。A/B/D 错误：路边/小区外/楼道内不符。", "1701": "D 正确：NFV基于的云计算属于私有IaaS类型。A/B/C 错误：私有PaaS/公有IaaS/混合IaaS不符。", "1702": "C 正确：EDFA采用的泵浦波长是0.98um和1.48um。A/B/D 错误：泵浦波长组合不符。", "1703": "A 正确：5G上行支持最高调制阶数为256QAM。B/C/D 错误：64QAM/QPSK/16QAM不符。", "1704": "D 正确：NR FR1和LTE共同确定的Gap pattern有4种。A/B/C 错误：1/2/3不符。", "1705": "A 正确：光纤+卫星异质双路由保障，将客户网络出口通过非网管交换机直连两路传输（物理分离）。B/C/D 错误：LACP/动态路由/手工跳线不符。", "1706": "B 正确：正弦交流电振幅A的有效值为0.707A（A/√2）。A/C/D 错误：1A/0.866/0.577不符。", "1707": "D 正确：波长3cm对应频率10GHz（f=c/λ=3×10^10/3cm=10GHz）。A/B/C 错误：300M/1G/3G不符。", "1708": "D 正确：里氏3.9级地震未对网络造成影响，属于四类突发事件（无影响）。A/B/C 错误：一/二/三类不符。", "1709": "C 正确：正桨指从多旋翼飞行器上方观察该螺旋桨逆时针旋转（C表述符合题库）。A/B 错误：下方观察/上方顺时针不符。", "1710": "C 正确：涉密文件完整无缺但钱物丢失，在不能证明文件未被不应知悉者知悉时属于涉密事件（C判断符合题库）。A/B 错误：属于涉密事件/证明未泄密不符。", "1711": "B 正确：载波频率2900MHz称为S波段雷达。A/C/D 错误：L/X/Ku不符。", "1712": "C 正确：C类地址分给8个子公司，需借用3位子网位，掩码255.255.255.224（C选项表述）。A/B/D 错误：掩码不符。", "1713": "C 正确：500mW约合27dBm（10lg500≈27）。A/B/D 错误：10/20/30不符。", "1714": "B 正确：螺旋桨长381mm≈15英寸、螺距127mm≈5英寸，型号15×5。A/C 错误：3812/38×12不符。", "1715": "B 正确：螺旋桨长254mm≈10英寸、螺距114mm≈4.5英寸，型号10×4.5（1045）。A/C 错误：2511/254114不符。", "1716": "A 正确：6000mAh表示理论上以6A电流放电可放电1小时。B/C 错误：60A/6000A不符。", "1717": "B 正确：10Ah表示理论上以10000mA（10A）电流放电可放电1小时。A/C 错误：10mA/10A不符（B表述完整）。", "1718": "C 正确：3S2P表示电池组先由3个单体串联，再由2组并联。A/B 错误：生产公司/2串3并不符。", "1719": "A 正确：电机转速3000转指每分钟3000转。B/C 错误：每秒/每小时不符。", "1720": "C 正确：500KV字样表示对应每V电压电机提供500转/分的转速（KV为转速常数）。A/B 错误：500转速/耐压500KV不符。", "1721": "C 正确：2208表示电机转子直径为22毫米、定子高度8毫米。A/B 错误：耐压22V/转子高度22毫米不符。", "1722": "C 正确：BEC5V表示电调能从较细的红线与黑线向接收机等输出5V电源。A/B 错误：输入/粗线输出不符。", "1723": "A 正确：30A表示电调所能承受的最大瞬间电流。B/C 错误：稳定工作电流/最小工作电流不符。", "1724": "A 正确：22.2V动力电池是6S锂电池（6×3.7V=22.2V）。B/C 错误：22.2S/3S不符。", "1725": "C 正确：11.1V动力电池是3S锂电池（3×3.7V=11.1V）。A/B 错误：6S/11.1S不符。", "1726": "B 正确：G/T=增益-噪声温度：5M天线12GHz增益约46dBi-10lg100K≈32.5dB/K。A/C/D 错误：30/34/35.5不符。", "1727": "E 正确：24小时降雨100毫米为大暴雨（50-100mm暴雨，100-250mm大暴雨）。A/B/C/D/F 错误：小雨/中雨/大雨/暴雨/特大暴雨不符。", "1728": "B 正确：500mW换算为27dBm（10lg500≈27）。A/C/D 错误：20/30/10不符。", "1729": "C 正确：默认的WAN帧中继链路属于非广播多路访问（NBMA）。A/B/D 错误：点到点/广播多路访问/非广播多点不符。", "1730": "D 正确：SCPC/FM/FDMA采用语音激活技术可提高转发器功率利用率约2.5倍。A/B/C 错误：1/1.5/2不符。", "1731": "D 正确：采用门限扩展技术可降低门限（C/N值）4～5dB。A/B/C 错误：1-2/2-3/3-4不符。", "1732": "A 正确：模拟量监控系统利用SDH来构建总线环传输系统。B/C/D 错误：PON/AON/NGN不符。", "1733": "C 正确：模拟量监控系统不需要提取时隙来传输状态信息（独占通道）。A/B/D 错误：需要/按实际/不确定不符。", "1734": "B 正确：模拟集群和数字集群对讲系统之间需经无线网关设备通信。A/C/D 错误：3G网关/HUB/防火墙不符。", "1735": "B 正确：模块中DC/DC变换电路是变换电路的电压值（电压转换）。A/C/D 错误：电流值/功率值/波形不符。", "1736": "C 正确：单模光纤截止波长一定要小于光通信系统的工作波长。A/B/D 错误：小于等于/大于等于/大于不符。", "1737": "C 正确：明火作业对喷灯、燃料储存使用情况进行登记。A/B 错误：记载/记录不符（题库标准为登记）。", "1738": "B 正确：视距内运行指航空器处于驾驶员或观测员目视视距内半径500米、相对高度120米以下。A/C 错误：120500/100，50不符。", "1739": "A 正确：民用无人驾驶航空器系统驾驶员执照由民航局下属司（局）颁发。B/C 错误：AOPA/地区管理局不符。", "1740": "A 正确：机长合格证申请人必须在民用无人驾驶航空器系统上训练不少于56小时。B/C 错误：44/100不符。", "1741": "B 正确：民用无人驾驶航空器系统驾驶员合格证由中国航空器拥有者及驾驶员协会（AOPA）颁发。A/C 错误：民航局司（局）/地区管理局不符。", "1742": "B 正确：民用无人机系统要求至少一年检查一次。A/C 错误：半年/两年不符。", "1743": "A 正确：民用航空适航管理对发动机、螺旋桨和航空器上的设备三个方面管理。B/C 错误：仅航空器发动机螺旋桨/仅航空器发动机不符。", "1744": "C 正确：民用航空器在管制空域内飞行必须取得空中交通管制单位的许可。A/B 错误：自由飞行/按VFR自由飞行不符。", "1745": "C 正确：民用航空器偏离指定航路或改变高度飞行应首先取得空中交通管制单位的许可。A/B 错误：机长允许/机组同意不符。", "1746": "A 正确：民用航空器适航管理由民航局负责。B/C 错误：国务院/中央军委不符。", "1747": "A 正确：民用航空器必须具有民航局颁发的适航证方可飞行。B/C 错误：经营许可证/机场使用许可证不符。", "1748": "C 正确：民航旅客行李携带锂电池额定能量超过160Wh严禁携带。A/B 错误：100/120Wh不符。", "1749": "A 正确：坚持人民至上、生命至上，坚持动态清零不动摇。B/C 错误：发展至上/群众至上不符。", "1750": "C 正确：加密数据与解密数据使用相同密钥的是对称密钥算法。A/B/D 错误：对称公钥/非对称私钥/非对称密钥不符。", "1751": "A 正确：密封蓄电池组搁置不用时间超过三个月时应进行补充电。B/C/D 错误：半年/浮充电压偏低不符。", "1752": "B 正确：门禁属于遥信（开关量状态信号）。A/C/D 错误：遥测/遥感/遥控不符。", "1753": "A 正确：每失水2升至少应补充1.5升。B/C/D 错误：1.6/1.8/2不符。", "1754": "B 正确：春分秋分前后卫星处于太阳和地球之间，地球站天线对准卫星时可能对准太阳造成日凌。A/C/D 错误：日蚀/摄动/星蚀不符。", "1755": "B 正确：每克蛋白质含有4卡路里热量。A/C/D 错误：3/5/9不符。", "1756": "A 正确：存在不安全行为或发生安全事故时追究责任的是安全责任制。B/C/D 错误：安全管理员/公司领导/主要责任人不符。", "1757": "C 正确：每个维护人员应学会触电急救，掌握灭火常识和消防器材的使用。A/B/D 错误：仪器仪表/维护工具/车辆不符。", "1758": "D 正确：每个扇区PRACH需要64个接入前导。A/B/C 错误：84/32/128不符。", "1759": "C 正确：每个RO上可用的Preamble个数是64。A/B/D 错误：16/32/128不符。", "1760": "A 正确：每个PON口下最多只能注册64个ONU。B/C/D 错误：32/无限/128不符。", "1761": "D 正确：GPON上行保证带宽100M时，一个PON口（2.5G）最多配置10个ONU。A/B/C 错误：64/32/16不符。", "1762": "B 正确：每个CDMA载频最少可以有55个业务信道。A/C/D 错误：64/57/60不符。", "1763": "B 正确：OTDR盲区随脉冲展宽增大而增大，测近处用窄脉冲、测远距离用宽脉冲。A/C 错误：宽窄组合不符。", "1764": "B 正确：盲切换相对于普通切换可以不做测量环节（不测直接切）。A/C/D 错误：触发/判决/切换不符。", "1765": "D 正确：慢衰落速率主要决定于传播环境（地形地物）。A/B/C 错误：频率/相位/幅度不符。", "1766": "C 正确：吗啡止痛药使用过量可致死，至少3个小时之内不可再次注射吗啡。A/B/D 错误：1/2/4不符。", "1767": "C 正确：落实全面从严治党政治责任，用好问责利器。A/B/D 错误：巡视/巡察/监督不符。", "1768": "C 正确：逻辑接口配置中UNI接口需要把MPLS使能打开。A/B/D 错误：都需要/NNI/都不需要不符。", "1769": "B 正确：路由探测仪可以直接测量光缆埋式深度。A/C/D 错误：光缆长度/纤芯衰耗/路面长度不符。", "1770": "B 正确：路由器主要工作在网络层，在不同网络之间存储转发分组。A/C/D 错误：传输层/链路层/物理层不符。", "1771": "B 正确：路由器网络层基本功能是寻找路由和转发报文。A/C 错误：配置IP地址/MAC解释不符。", "1772": "D 正确：路由器工作在ISO-OSI参考模型的网络层。A/B/C 错误：传输层/数据链路层/物理层不符。", "1773": "A 正确：陆地电台和固定电台呼号由3个英文字母组成。B/C/D 错误：4/5/6不符。", "1774": "B 正确：漏配邻区可能造成的后果是手机移动中接入失败（无法切换至目标）。A/C/D 错误：切换较慢/无法通话/都不正确不符。", "1775": "A 正确：楼顶桅杆安装天线时每根桅杆应就近接至楼顶避雷带。B/C/D 错误：施工方便/就远/规定范围不符。", "1776": "D 正确：流星飞过引起电离层变化，使E层临界频率升高。A/B/C 错误：信号阻挡/干扰/散射不符。", "1777": "A 正确：流体稳定低速流动管道由粗变细，流速增大（连续性方程）。B/C 错误：减小/保持不变不符。", "1778": "A 正确：伯努利定理适用于不可压缩的理想流体（无粘性）。B/C 错误：粘性理想/不可压缩粘性不符。", "1779": "D 正确：流量描述（TD）最小颗粒是1KB。A/B/C 错误：1bit/1byte/1MB不符。", "1780": "B 正确：磷酸铁锂电池负极材料一般为碳材料（石墨）。A/C/D 错误：硫酸铅/二氧化铅/纯铅不符。", "1781": "C 正确：磷酸铁锂电池电解液采用有机电解液。A/B/D 错误：稀硫酸/浓硫酸/水不符。", "1782": "A 正确：临时接地线正确步骤为先接接地端后接设备端。B/C 错误：随意接/先设备端不符。", "1783": "C 正确：林区发生火灾时作业人员应迅速撤离到安全地带或开辟不小于5米的防火隔离带。A/B/D 错误：10/20/3不符。", "1784": "B 正确：被干扰卫星地球站接收正常信号的同时，其旁瓣接收到邻星干扰信号。A/C/D 错误：主瓣/垂直/水平方向不符。", "1785": "C 正确：邻星下行干扰随被干扰站天线尺寸增加而减少（大天线旁瓣低）。A/B/D 错误：增加/不变/无规律不符。", "1786": "A 正确：邻区规划原则是地理位置相邻的配置为邻区。B/C/D 错误：越多越好/越少越好/郊县不符。", "1787": "B 正确：邻波道寄生辐射落入本频道接收机带内造成干扰称邻道干扰。A/C/D 错误：互调/多址/同频干扰不符。", "1788": "B 正确：量子卫星主要用途是保密通信（量子密钥分发）。A/C/D 错误：增加带宽/降低时延/提高增益不符。", "1789": "C 正确：两组3000
