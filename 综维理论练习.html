<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通信理论题库 · 刷题背题</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231466D6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>题</text></svg>">
<style>
:root{
  --brand:#1466D6; --brand-d:#0B3D91; --brand-l:#EAF2FE;
  --green:#30A46C; --green-l:#EAF7F0;
  --red:#E5484D; --red-l:#FDEBEC;
  --amber:#F5A623; --amber-l:#FFF6E6;
  --ink:#1B2733; --muted:#6B7A8C; --line:#E3EAF2; --bg:#F4F7FB;
  --card:#FFFFFF; --radius:16px; --shadow:0 4px 20px rgba(16,44,84,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6}
#app{max-width:680px; margin:0 auto; min-height:100vh; padding-bottom:96px; position:relative}
.safe-top{height:env(safe-area-inset-top)}
/* ===== 顶部栏 ===== */
.topbar{position:sticky; top:0; z-index:20; background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 12px rgba(11,61,145,.3)}
.topbar .tb-btn{background:rgba(255,255,255,.16); border:none; color:#fff; width:34px; height:34px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:18px; flex:none}
.topbar .tb-title{flex:1; font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar .tb-sub{font-size:11px; opacity:.85; font-weight:400}
/* ===== 卡片 ===== */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin:12px 14px; padding:16px}
.pad{margin:12px 14px}
.hint{color:var(--muted); font-size:12.5px}
.section-t{font-size:13px; color:var(--muted); margin:18px 14px 6px; font-weight:600; letter-spacing:.3px}
/* ===== 题库卡片 ===== */
.bank-grid{display:grid; grid-template-columns:1fr; gap:12px; margin:4px 14px}
.bank-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; cursor:pointer; border:1px solid transparent; transition:.15s}
.bank-card:active{transform:scale(.98); border-color:var(--brand)}
.bank-head{display:flex; align-items:center; gap:12px}
.bank-ico{width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:none; color:#fff}
.bank-name{font-size:16px; font-weight:700}
.bank-meta{font-size:12px; color:var(--muted); margin-top:2px}
.bank-chips{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap}
.chip{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--brand-l); color:var(--brand)}
.chip.d{background:var(--amber-l); color:#B47D00}
.chip.m{background:#EFF0FF; color:#5E5CE6}
.progress-line{height:6px; background:#E8EEF6; border-radius:4px; overflow:hidden; margin-top:10px}
.progress-line i{display:block; height:100%; background:var(--brand); border-radius:4px}
/* ===== 模式选择 ===== */
.mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.mode-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; cursor:pointer; text-align:center; border:1px solid transparent}
.mode-card:active{transform:scale(.97)}
.mode-card .mc-ico{font-size:26px}
.mode-card .mc-name{font-weight:700; margin-top:6px}
.mode-card .mc-desc{font-size:11.5px; color:var(--muted); margin-top:3px}
.mode-card.active{border-color:var(--brand); background:var(--brand-l)}
/* ===== 答题 ===== */
.q-wrap{padding:12px 14px}
.q-progress{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.q-progress .bar{flex:1; height:8px; background:#E8EEF6; border-radius:6px; overflow:hidden}
.q-progress .bar i{display:block; height:100%; background:var(--brand); border-radius:6px; transition:.2s}
.q-count{font-size:12px; color:var(--muted); white-space:nowrap}
.q-type{display:inline-block; font-size:11px; padding:2px 8px; border-radius:6px; background:var(--brand-l); color:var(--brand); font-weight:600; margin-bottom:8px}
.q-body{font-size:16.5px; font-weight:600; line-height:1.7; margin-bottom:16px}
.opt-list{display:flex; flex-direction:column; gap:10px}
.opt-item{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; display:flex; gap:12px; align-items:flex-start; transition:.12s; font-size:14.5px}
.opt-item:active{background:#F6F9FD}
.opt-item .oi-key{width:26px; height:26px; border-radius:50%; background:#EFF3F9; color:var(--muted); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px}
.opt-item.selected{border-color:var(--brand); background:var(--brand-l)}
.opt-item.selected .oi-key{background:var(--brand); color:#fff}
.opt-item.correct{border-color:var(--green); background:var(--green-l)}
.opt-item.correct .oi-key{background:var(--green); color:#fff}
.opt-item.wrong{border-color:var(--red); background:var(--red-l)}
.opt-item.wrong .oi-key{background:var(--red); color:#fff}
.opt-item.dim{opacity:.5}
.opt-item.lock{cursor:default}
/* 判断 */
.judge-row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.judge-btn{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:18px; text-align:center; font-size:15px; font-weight:700; cursor:pointer}
.judge-btn.correct{border-color:var(--green); background:var(--green-l); color:var(--green)}
.judge-btn.wrong{border-color:var(--red); background:var(--red-l); color:var(--red)}
/* 结果反馈 */
.feedback{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-top:14px; display:none}
.feedback.show{display:block}
.fb-title{font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px}
.fb-title.ok{color:var(--green)} .fb-title.no{color:var(--red)}
.fb-ans{margin-top:8px; font-size:14px}
.fb-ans b{color:var(--brand)}
.fb-right{margin-top:6px; font-size:13.5px; color:var(--muted); background:#F5F8FC; border-radius:8px; padding:10px; line-height:1.7}
/* ===== 按钮 ===== */
.btn-row{display:flex; gap:10px; margin-top:16px}
.btn{flex:1; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; transition:.12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand); color:#fff}
.btn.ghost{background:var(--card); color:var(--brand); border:1.5px solid var(--brand)}
.btn.green{background:var(--green); color:#fff}
.btn.red{background:var(--red); color:#fff}
.btn.sm{flex:0; padding:8px 14px; font-size:13px}
.btn.full{width:100%}
/* ===== 统计 ===== */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.stat-cell{background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:12px 6px; text-align:center}
.stat-cell .num{font-size:20px; font-weight:800; color:var(--brand)}
.stat-cell .lab{font-size:11px; color:var(--muted); margin-top:2px}
/* ===== 底部导航 ===== */
.bottom-nav{position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.95); backdrop-filter:blur(6px); border-top:1px solid var(--line); padding:8px 8px calc(8px + env(safe-area-inset-bottom)); display:flex; z-index:30; max-width:680px; margin:0 auto}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; cursor:pointer; color:var(--muted); font-size:11px; border-radius:10px}
.nav-item.on{color:var(--brand)}
.nav-item svg{width:22px; height:22px}
/* ===== 列表 ===== */
.row-list{display:flex; flex-direction:column; gap:8px; margin:0 14px}
.row-item{background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer}
.row-item .ri-t{flex:1}
.row-item .ri-name{font-weight:600; font-size:14px}
.row-item .ri-meta{font-size:11.5px; color:var(--muted); margin-top:2px}
.badge{font-size:10.5px; padding:2px 7px; border-radius:20px; font-weight:700; flex:none}
.badge.amber{background:var(--amber-l); color:#B47D00}
.badge.red{background:var(--red-l); color:var(--red)}
.badge.green{background:var(--green-l); color:var(--green)}
.badge.gray{background:#EEF2F7; color:var(--muted)}
.empty{padding:60px 20px; text-align:center; color:var(--muted)}
.empty .e-ico{font-size:40px; opacity:.5}
/* memorize */
.mem-nav{display:flex; gap:10px; margin:4px 14px 12px; align-items:center}
.mem-nav .mm{flex:1; font-weight:700; color:var(--brand); text-align:center}
.q-kbd{font-size:11px; color:var(--muted)}
.mem-ans{margin-top:14px; background:var(--green-l); border-radius:12px; padding:12px 14px}
.mem-ans .ma-l{font-size:12px; color:#1E7A4E; font-weight:700; margin-bottom:4px}
.mem-ans .ma-a{font-size:15px; font-weight:700; color:#147A4A}
.mem-opts .opt-item{cursor:default; border-color:var(--line)}
.mem-opts .opt-item.isans{border-color:var(--green); background:var(--green-l)}
.mem-opts .opt-item.isans .oi-key{background:var(--green); color:#fff}
.ops{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.ops .btn{flex:1; min-width:90px}
.toast{position:fixed; top:60px; left:50%; transform:translateX(-50%); background:rgba(20,32,44,.92); color:#fff; padding:9px 16px; border-radius:20px; font-size:13px; z-index:99; opacity:0; pointer-events:none; transition:.25s}
.toast.show{opacity:1}
@media(min-width:480px){.bank-grid{grid-template-columns:1fr 1fr}}
/* ===== 新增：继续练习 / 跳题 / 存档 ===== */
.resume-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin:12px 14px; padding:14px 16px; display:flex; align-items:center; gap:12px; border:1.5px solid var(--brand)}
.resume-card .rc-ico{width:38px;height:38px;border-radius:12px;background:var(--brand-l);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.resume-card .rc-t{font-weight:700;font-size:14.5px}
.resume-card .rc-m{font-size:12px;color:var(--muted);margin-top:2px}
.resume-card .rc-btns{display:flex;gap:8px;flex:none}
.jump-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(16,32,54,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.jump-panel{background:#fff;width:100%;max-width:680px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;-webkit-overflow-scrolling:touch}
.jp-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px;margin-bottom:12px}
.jp-x{background:var(--brand-l);border:none;color:var(--brand);width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer}
.jp-input-row{display:flex;gap:10px;margin-bottom:12px}
.jp-input-row input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;outline:none;min-width:0;background:#fff}
.jp-input-row input:focus{border-color:var(--brand)}
.jp-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:12px}
.jp-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#F1F5FA;color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid transparent}
.jp-cell:active{transform:scale(.92)}
.jp-cell.cur{border-color:var(--brand);background:var(--brand);color:#fff}
.jp-cell.ok{background:var(--green-l);color:#1E7A4E;border-color:var(--green)}
.jp-cell.no{background:var(--red-l);color:var(--red);border-color:var(--red)}
.jp-legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.lg-dot{width:14px;height:14px;border-radius:4px;background:#F1F5FA;display:inline-block;vertical-align:-2px;margin-right:3px;border:1px solid var(--line)}
.lg-dot.lg-cur{background:var(--brand)}
.lg-dot.lg-ok{background:var(--green-l);border-color:var(--green)}
.lg-dot.lg-no{background:var(--red-l);border-color:var(--red)}
.jp-sec{font-size:12.5px;color:var(--muted);font-weight:600;margin:14px 0 6px}
.jump-panel textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:72px;resize:vertical;outline:none;background:#F8FAFD;color:var(--ink)}
.jp-actions{display:flex;gap:8px;margin-top:8px}
.jp-tip{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}
</style>
</head>

耗。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "光纤接头有很多型号，其中FC/PC表示圆型平面光纤接头。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "光纤有单模式和多模式两种，光纤的接口标准有ST、FC、SC、LC和MTRJ等。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "技术支撑岗负责管理和使用归属本地的设备资产、备品备件以及仪器仪表。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "加强雷雨、大风季节的机房安全管理，不定期检测地线和防雷设施。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "检查光纤的曲率半径，应大于光纤直径的20倍，一般情况下曲率半径≥40mm。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "接入网由一系列的传送实体组成，为电信业务提供必要的传送承载能力，对用户信令是透明的。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "进出租用机房，维护人员应注意做好业主或邻居工作，避免发生不必要的矛盾，有问题应及时协调处理。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "路由器工作在数据链路层。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "每个PON树的规划带宽应考虑一定的冗余，合理规划系统接入的用户数。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "千兆以太网口的英文缩写是GE。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "如果全部由无源器件组成，不包括任何有源节点，则这种光接入网就是PON。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "如果用户的网卡被禁用，拨号则会提示769错误。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "设备机房实行封闭式管理，并配备机房出入登记簿或电子化管理手段。出入机房必须严格履行登记审批手续，非因工作需要一律不得进入。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "设备应有良好的接地系统，以防强电影响和雷电的袭击。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "双绞线标准EIA/TIA 568A的线缆排序是：白橙、橙、白绿、蓝、白蓝、绿、白棕、棕。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "同一PON口下，各个ONU之间是互通的。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "同一PON口下一个ONU可用的光纤总带宽通常可以大于所有ONU用户可能的带宽总和。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "同一个VLAN中的两台主机可以跨越多台交换机。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "为保障网管计算机工作电源稳定，建议使用UPS供电。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "为了避免数据冲突并提高网络利用效率，下行方向采用TDMA多址接入方式并对各ONU的数据发送进行仲裁。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "维护人员应根据维护作业计划，对机房和设备定期进行预防性巡视检查。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "现场维护人员在插拔单板时，需佩戴好防静电手套或防静电手腕，严禁裸手插拔单板，否则人体静电可能会损坏单板器件。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "严禁操作与工作内容无关的设备和操作项目。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "严禁在带电的情况下开启机壳进行设备维护。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "要求OLT设备主控板、电源板、上行板双配置，OLT 机架供电建议双路直流电源引入。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "以太网采用CSMA/CA机制，来避免多个设备在同一时刻抢占线路。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "以太网中最小的帧长是48个字节。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "用多波长PON功率计测试光口的光功率如果为0dbm，表示该光口没有光功率。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "由于光纤上传输的光信号为不可见光，所以可以用肉眼直接观看光口。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "与OSI参考模型一样，TCP/IP协议（传输控制协议/网际协议）也分为七层。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "在1:32的分光比条件下，现有EPON系统支持最大传输距离是10KM。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "在EPON技术中，各个ONU都能收到广播来的所有信息，因此用户的数据是不安全的。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "在FTTH模式下，ONU的断电将造成宽带不通，但电话依然可以使用。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "在PON的国际标准中，GPON提供下行最大2.488Gbps，上行1.244Gbps传输速率，而EPON只提供上下行对称传输速率1.25Gbps。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "在光网络中，分光器可以无限制分光，只要能满足用户需求就行。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "在进行更换故障部件或者升级部件之前应检查备件的可互换性。在拿放、运输备件时，必须使用专用的防静电包装袋和防静电周转箱，严禁单板“叠罗汉”。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "在离开无人值守机房前应再进行一次巡视，并填写离开时间，关闭照明和门窗。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "在设备顶部操作，工具应放置妥当，避免工具掉进设备上导致设备短路引发事故。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "在首次给设备加电时，务必用仪表进行接地检查与短路测试。", "type": "判断", "opts": ["正确", "错误"], "ans": "正确"}, {"q": "在数据的保存过程中，机密的数据处于安全的空间则不需对其进行加密处理。", "type": "判断", "opts": ["正确", "错误"], "ans": "错误"}, {"q": "ODN在OLT和ONU间提供光通道。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "光纤有单模式（single mode）和多模式（multimode）两种，光纤的接口标准有ST、FC、SC、LC和MTRJ等。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "光分路器OBD是一种可以将一路光信号分成多路光信号以及完成相反过程的有源器件。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "配线（支线）光缆是指入户分纤盒至ONU之间的光缆。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "因为有源光网络比无源光网络覆盖范围和传输距离更大，所以有源光网络是光接入网最具发展潜力的技术", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "EPON是基于 IEEE 802.3ah 标准的以太网无源光缆网技术，上下行标称速率均为 1.25Gb/s", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "光缆接头盒按外形结构分为帽式和卧式。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "PON 系统的传输距离应采用最坏值计算法，分别计算 OLT 的 PON口至 ONU 之间上行和下行的传输距离，取两者中较小者为 PON 口至ONU 之间的最大传输距离。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "适配器建议采用无色端帽，以便于红光检测。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "集束光缆在光纤终端单元上应全部成端，也可采用部分成端方式。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "同一条集束光缆尽量成端在同一块光纤终端单元上，避免跨框、跨列。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "MODF侧面跳纤挂纤盘上禁止缠绕，只能使用搭挂方式过路。当跳纤长度略长时，可采用向上搭挂。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "光纤光缆预留圈、接头盒中光纤的盘留、机房及设备内尾纤的盘绕等造成的弯曲损耗属于微弯损耗。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "MODF架施工时，光缆有外护套，布放可与直流电源线、交流电源线一起布放", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "无跳纤光缆交接箱一般设置在光缆接入点，在FTTH/O接入方式下，也处于第二级分光点位置", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "电信FTTH应用的光分路器即可以是均匀分光、也可以是不均匀分光。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "光在光纤中的传播原理是光的全反射。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "PON 网络光纤链路损耗测算时，单个活接头的损耗按 0.2dB/个 取值。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "G.652D 光纤与模场直径不匹配的 G.657B 光纤连接时引入的附加损耗可取 0.2dB/连接点", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "盒式光分路器型无跳接光缆交接箱通常采用主干侧有跳纤的形式,实现无跳接功能。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "光缆成端时，无需将金属加强芯与箱体的接地端子紧固连接，避免雷击。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "光纤在箱内布放时，不论在何处转弯，其曲率半径应不小于30mm。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "环形钢筋混凝土电杆有环向裂纹宽度超过0.5mm、有可见纵向裂缝的或泪凝土破碎部分总面积超过200 mm2 情况之一者不得使用。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "架空光(电)缆的接头应落在杆上或杆旁 1.5m 左右的位置。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "综合业务接入区中接入光缆围绕主干光节点组网。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "接入光缆网主干光缆以星型结构为主。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "接入光缆网配线光缆结构分为星型、树型和环型三种。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "接入光缆网引入光缆主要采用环形结构。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "配线光节点到主干光节点之间、配线光节点到配线光节点之间的光缆定义为配线光缆。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "主干光节点本点所在的配线网格，需要单独设置配线光节点。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "接入光缆网的规划整体思路中，OLT节点作为最重要的节点，会影响网络布局，应优先规划。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "引入光缆通常利用率较低（<30%），通过配线光节点的汇聚，配线光缆的利用率可大幅上升，从而降低投资。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "主干光缆是用户业务接入的汇聚层，其网络安全至关重要，应尽量采用树型网络结构，环型为辅。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "架空光缆施工中，登高作业人员必须经过相关部门组织的登高培训学习，并通过考核取得特种作业操作证，才可以进行登高作业。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "布放吊挂式架空光缆应在每根杆上作一处伸缩预留。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "光缆环境验收时，如光缆路由经过厂房、出租屋、学生宿舍背后或房屋阳台，垃圾多易起火的地方，应及时提出整改。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "光缆验收时，对隐蔽工程需要有时间、地点、交接记录，签证齐全。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "主干光节点管辖的区域不宜过大，一般为2-4个配线光节点设置一个主干光节点。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "用户光节点的识别特征是，不直接接入用户，有设置分光器。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "配线光节点位置选择应宜设在节点覆盖区域内光缆网中心远离主干光节点的一侧。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "架空杆路巡检需要检查电杆有无倾倒、裂纹（横裂不超过三分之一，纵裂不超过二分之一）或露筋。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "光交接箱巡检中检查走线规范内容包括走线整齐规范、无超长尾纤、无缠绕。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "读取光功率计的dB读数（设置在dBm方式），此时光功率计显示的dB读数即为被测光纤盘的光链路（含两端光纤连接插头）的衰减值。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "架空光缆挂钩间距50cm，每3～5档作一处伸缩预留。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "大芯数光缆接续时，为提高熔接速度及方便盘纤，可以多芯共用热熔管。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "光纤长度测试时，测试全程距离不允许偏差大于5米。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "管道巡检中维护人员发现管道或人（手）孔沉陷、破损及井盖丢失等情况，只需要告知相关部门即可。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "ODN配套箱体巡检中要对分光器冗余端口进行清洁端口，对问题端口做好标记，端口防尘帽检查，缺少的及时补齐。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "不仅OTDR前面板的活动连接器，而且光纤中其它的活动连接器都会引起盲区。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "蘸有酒精的细棉签能清除熔接机V型槽中的污染物。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "OTDR判断被测试光纤中反射事件的门限值。在测试过程中，凡有超过该值的反射点即称为事件点。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "切割好的光纤端面沾有灰尘，用酒精重新擦拭下即可，不需要重新制作端面。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "如果光纤的尾端是破裂的端面,不会引起反射。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "OTDR测试平均时间越短，OTDR对噪声信号的抑制性能越好，损耗测试的精度也就越高。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "脉冲宽度选择的越宽，OTDR所发出的光功率越大，测试的距离也就越远，脉冲宽度越宽越好。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "操作可见光源时应注意光纤对端是否有光设备连接，不能在有光设备的光纤上放光，否则会造成光源的损坏。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "ONU是被动发光，只有当ONU接受OLT的光之后才能发光。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "新型光交接（网络）箱应按照功能区域放置分光器。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "MODF光路标签只能采用F型标签，不能采用T型标签。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "对工程施工中未按施工规范进行操作的或未按设计要求进行施工的部分，随工人员有权令其停工、返工、整改，并及时通知工程项目管理员。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "连续布放子管长度不宜超过200M，牵引子管的最大拉力不应超过材料的抗张强度，牵引速度要求均匀。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "光缆一次牵引长度一般不超过1000M，超长时应采取盘倒“8”字分段牵引或中间加辅助牵引，不允许断缆布放。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "光缆盘留位置合理，余缆的固定、绑扎牢靠，光缆盘留弯曲半径应不小于20倍缆径，光缆接头盒安装牢固。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "管道穿越铁路、高速、国道等高等级公路、普通道路、隧道的，一般情况下要用钢管穿越，其埋深要达到1M以上", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "直线路由标桩埋设距离一般为50M，转弯、接头、预留、跨越其它管线（物体）、村前村后等特殊地点必须埋设标桩。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "架空光缆吊线一般应间隔20档杆装设泄力终结,安装泄力终结的电杆应装设顺线拉线。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "割接应该避让业务高峰时间，以尽量减少对通信的影响。影响电路的割接一般在01：00～06：00 时段进行", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "在进行室外光缆的热熔接时，加强芯在接头盒固定牢固，不做电气连通。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "在进行光交接设备内光缆熔接时，带状光纤不允许分开与散状尾纤对接，带状纤盘预留不能有 S弯。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "跳纤维护时，光纤应保持自然顺直，无扭绞现象，拐弯时必须弯成圆弧，架内跳纤应保证各处曲率半径大于3cm，长度不足的跳纤需使用法兰盘等连接器连接两段跳纤。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "在作业过程中遇有不明用途的线条，一律按电力线对待，不准随意剪断", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "遇有电力线在电信线杆顶上方交越且间距较小的特殊情况时，在做好防护的前提下，可以不停电作业", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "高处作业人员与地面人员之间可以扔抛工具和材料。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "在梯子上作业时，需要工具材料应用绳索上下吊放。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "梯子上可以站有两人同时作业。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "杆上有人作业时，杆下必须有人保护，防止坠落。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "脚扣的踏脚板必须经常检测，其检测方法是：采取在踏脚板中心悬吊100 kg重物，是否有受损变形迹象。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "在建筑物临边作业时，可以不需要安全带。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "使用吊车或立杆器立杆时，应该有人在吊车臂下指挥", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "立杆未回土夯实前，应该及时上杆拆除立杆设备", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "在角杆上紧线时，操作人员应站在内角，角杆应按要求加装吊线辅助装置。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "缆盘置放的地面必须平实，用千斤顶支撑牢固。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "在墙上及室内钻孔布线时，如遇与电力线平行或穿越时，必须先停电、后作业。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "管道线缆敷设作业前, 必须检查使用的各种机具,确保齐备完好；作业时，工具不可随意替代。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "患有癫痫病不准从事高处作业。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "梯子靠在吊线时，其顶端至少应高出吊线1米。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "支设人字梯时，两梯夹角应保持30°。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "若跨越高速公路作业时，必须在距离作业点200M处设置安全警示标志", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "坐滑车前应检查吊板的绳索、吊钩的牢固程度，如吊钩已磨损四分之一时，不准使用。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "杆上有人作业时，距杆半径2m内不得有人", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "从事建设工程活动，必须严格执行基本建设程序，坚持先勘察、后设计、再施工的原则。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "农村区域ODN组网宜采用一级分光方式", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "架构B下综合业务接入区内设置一个接入点机房，接入设备一部分部署在综合业务局站，一部分部署在接入点机房。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "FTTH组网中，FTTH业务和FTTN、FTTB、FTTO业务可以在同一PON口下承载。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "城市小区、商务楼宇、园区、专业市场/商业区等>200住户区域，农村行政村、专业自然村、乡镇工业园、集镇和新农村建设点等区域均应划分为独立配线网格单元、设计配线光交节点，做到接入光缆不出配线网格。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "4-8个配线光交节点可设置一个主干光交网格，收容5000-10000住户。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "OLT节点越多，局房的建设投资越高；但同时光缆投资也越大。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "每个配线光节点能够覆盖6～16个用户光节点，或距离最远用户光节点的直线距离在200-500 米之间，即可保持投资在一个比较低的水平。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "在FTTX网络中，各种ONU可以通用。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "新型免跳接光交接箱的走线区一般采取双环，双环走线区的冗余尾纤可以通过内、外环上下缠绕，以便于保持走线的美观。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "光(电)缆线路进入交接设备时，可与交接设备共用一条地线，其接地电阻值应满足设计要求。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "线路工程施工时，在每个人(于)孔内的光(电)缆上，均应按照设计要求或建设单位的规定安装光(电)缆识别标志。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "新建主干光交箱体不可以接入周边零星业务，故主干交接节点周边应再设置配线交接节点。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "吊挂式架空吊线与电力线交越时，一般应从电力线的上方通过，与电力线交越部分的架空吊线应外套电力线保护管。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "在与强电线路平行地段进行光(电)缆施工或检修时，应将光(电)缆内的金属构件做临时接地。", "type": "判断", "opts": ["对", "错"], "ans": "正确"}, {"q": "管道人手孔内光缆应每条缆挂2个标牌。", "type": "判断", "opts": ["对", "错"], "ans": "错误"}, {"q": "架空光缆原则上间隔15杆设置双方拉线。", "type": "判断", "opts": const BANK_ORDER = Object.keys(BANKS);
const LETTERS = "ABCDEFGHIJ";

/* 存储层：优先 localStorage；不可用时自动降级为 cookie；再不行降级为内存（仅本次会话），兼容低版本安卓浏览器 */
var _storeMode='localStorage';
var _memStore={};
(function(){
  try{
    localStorage.setItem('__tk_test__','1'); localStorage.removeItem('__tk_test__');
  }catch(e){
    try{
      document.cookie='__tk_test__=1; path=/';
      _storeMode=(document.cookie.indexOf('__tk_test__')>=0)?'cookie':'memory';
    }catch(e2){ _storeMode='memory'; }
  }
})();
function _cookieGet(k){
  var m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));
  return m?decodeURIComponent(m[1]):null;
}
function _cookieSet(k,v){
  try{ document.cookie=k+'='+encodeURIComponent(v)+'; path=/; max-age=31536000'; }catch(e){}
}
const store = {
  get(k,d){
    try{
      var raw=null;
      if(_storeMode==='localStorage') raw=localStorage.getItem(k);
      else if(_storeMode==='cookie') raw=_cookieGet(k);
      else raw=(k in _memStore)?_memStore[k]:null;
      return raw?JSON.parse(raw):d;
    }catch(e){ return d; }
  },
  set(k,v){
    try{
      var s=JSON.stringify(v);
      if(_storeMode==='localStorage') localStorage.setItem(k,s);
      else if(_storeMode==='cookie') _cookieSet(k,s);
      else _memStore[k]=s;
    }catch(e){}
  }
};
function storeMode(){ return _storeMode; }
const WRONG_KEY='tk_wrong_v1';
const PROG_KEY='tk_prog_v1';
const SESSION_KEY='tk_session_v1';

/* ================= 会话存档（退出保存，随时继续） ================= */
function saveSession(){
  if(state.view!=='quiz' && state.view!=='memorize') return;
  if(!state.bank || !BANKS[state.bank]) return;
  if(!state.order || !state.order.length) return;
  store.set(SESSION_KEY, {
    bank:state.bank, mode:state.mode, order:state.order.slice(0),
    pos:state.pos, selected:(state.selected||[]).slice(0),
    answered:!!state.answered, results:Object.assign({}, state.results),
    sess:Object.assign({done:0,right:0,wrong:0}, state.sess), ts:Date.now()
  });
}
function clearSession(){ store.set(SESSION_KEY, ''); }
function sessionInfo(){
  var s=store.get(SESSION_KEY, null);
  if(!s || typeof s!=='object' || !s.bank || !BANKS[s.bank]) return null;
  if(!Array.isArray(s.order) || !s.order.length) return null;
  if(typeof s.pos!=='number' || isNaN(s.pos) || s.pos<0 || s.pos>=s.order.length) return null;
  return s;
}
function resumeSession(){
  var s=sessionInfo();
  if(!s){ toast('没有可继续的进度'); return; }
  var list=BANKS[s.bank];
  var order=s.order.filter(function(i){ return typeof i==='number' && i>=0 && i<list.length; });
  if(!order.length){ toast('进度数据无效，已清除'); clearSession(); render(); return; }
  state.bank=s.bank;
  state.mode=(s.mode==='rand'||s.mode==='wrong'||s.mode==='mem')?s.mode:'seq';
  state.order=order;
  state.pos=Math.min(Math.max(0, Math.floor(s.pos)), order.length-1);
  state.selected=Array.isArray(s.selected)?s.selected.slice(0):[];
  state.answered=!!s.answered;
  state.results=(s.results && typeof s.results==='object')?s.results:{};
  state.sess=Object.assign({done:0,right:0,wrong:0}, s.sess||{});
  state.jumpOpen=false; state.arcOpen=false;
  state.view=(state.mode==='mem')?'memorize':'quiz';
  render(); window.scrollTo(0,0);
  toast('已继续：'+state.bank+' 第 '+(state.pos+1)+'/'+order.length+' 题');
}
function resumeCardHtml(){
  var s=sessionInfo();
  if(!s) return '';
  var modeTxt=s.mode==='rand'?'随机':s.mode==='wrong'?'错题':s.mode==='mem'?'背题':'顺序';
  return `<div class="resume-card">
    <div class="rc-ico">▶</div>
    <div style="flex:1"><div class="rc-t">继续上次练习</div><div class="rc-m">${esc(s.bank)} · 第 ${s.pos+1}/${s.order.length} 题 · ${modeTxt}模式</div></div>
    <div class="rc-btns"><button class="btn primary sm" data-resume-go="1">继续</button><button class="btn ghost sm" data-resume-clear="1">放弃</button></div>
  </div>`;
}

/* ================= 跳题面板 ================= */
function openJump(){
  state.jumpOpen=true; render();
  try{
    var i=document.getElementById('jp-input');
    if(i) setTimeout(function(){ try{ i.focus(); }catch(e){} }, 80);
  }catch(e){}
}
function jumpTo(i){
  if(typeof i!=='number' || isNaN(i) || i<0 || i>=state.order.length){ toast('题目序号超出范围'); return; }
  state.pos=i;
  state.selected=[];
  state.answered=!!state.results[state.order[i]];
  state.jumpOpen=false;
  render(); window.scrollTo(0,0);
  toast('已跳转到第 '+(i+1)+' 题');
}
function jumpPanelHtml(){
  var total=state.order.length;
  var cells=state.order.map(function(qi,i){
    var r=state.results[qi];
    var cls=(i===state.pos)?'cur':(r==='right'?'ok':(r==='wrong'?'no':''));
    return '<div class="jp-cell '+cls+'" data-jump-n="'+i+'">'+(i+1)+'</div>';
  }).join('');
  return `<div class="jump-mask" data-jump-close="1">
    <div class="jump-panel">
      <div class="jp-head">跳转到题目<button class="jp-x" data-jump-close="1">×</button></div>
      <div class="jp-input-row">
        <input id="jp-input" type="number" min="1" max="${total}" placeholder="输入 1-${total}" onkeydown="if(event.key==='Enter'){var v=parseInt(this.value,10);if(v&&v>=1&&v<=${total})jumpTo(v-1);else toast('请输入 1-${total} 之间的序号');}">
        <button class="btn primary sm" data-jump-go="1">跳转</button>
      </div>
      <div class="jp-grid">${cells}</div>
      <div class="jp-legend"><span><span class="lg-dot lg-cur"></span>当前</span><span><span class="lg-dot lg-ok"></span>答对</span><span><span class="lg-dot lg-no"></span>答错</span><span><span class="lg-dot"></span>未答</span></div>
    </div>
  </div>`;
}

function openArchive(){ state.arcOpen=true; render(); }
function archivePanelHtml(){
  return `<div class="jump-mask" data-arc-close="1">

      <div class="jp-head">存档备份<button class="jp-x" data-arc-close="1">×</button></div>

      <textarea id="arc-text" readonly="readonly" rows="4" onclick="this.focus();this.select()">${esc(exportArchive())}</textarea>
      <div class="jp-actions"><button class="btn primary sm" data-arc-copy="1">复制</button><button class="btn ghost sm" data-arc-dl="1">下载文件</button></div>
      <div class="jp-sec">2. 导入存档（粘贴后覆盖当前进度）</div>
      <textarea id="arc-in" rows="3" placeholder="粘贴导出的存档内容到此处"></textarea>
      <div class="jp-actions"><button class="btn red sm" data-arc-import="1">导入并覆盖</button></div>
      <div class="jp-tip">存储模式：${storeMode()}。localStorage 最稳定；若显示 cookie/内存，说明浏览器限制了本地存储，请务必定期导出备份。换手机或清浏览器数据前，先导出存档即可恢复。</div>
    </div>
  </div>`;
}
function exportArchive(){
  return JSON.stringify({
    ver:1,
    time:new Date().toLocaleString(),
    prog:store.get(PROG_KEY,{}),
    wrong:store.get(WRONG_KEY,{}),
    session:store.get(SESSION_KEY,null)
  });
}
function importArchive(raw){
  var d=null;
  try{ d=JSON.parse(raw); }catch(e){ toast('存档内容不是有效格式'); return; }
  if(!d || typeof d!=='object'){ toast('存档内容不是有效格式'); return; }
  if(d.prog && typeof d.prog==='object') store.set(PROG_KEY, d.prog);
  if(d.wrong && typeof d.wrong==='object') store.set(WRONG_KEY, d.wrong);
  if(d.session && typeof d.session==='object') store.set(SESSION_KEY, d.session);
  toast('导入成功'); render();
}
function downloadArchive(){
  try{
    var text=exportArchive();
    var blob=new Blob([text],{type:'application/json;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='通信题库存档.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 1500);
  }catch(e){}
  toast('已尝试下载；若未开始，请用上方复制按钮');
}
function copyText(t, okMsg){
  if(!t){ toast('没有可复制的内容'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast(okMsg); }, function(){ legacyCopy(t, okMsg); });
  } else legacyCopy(t, okMsg);
}
function legacyCopy(t, okMsg){
  try{
    var ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=false;
    try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
    document.body.removeChild(ta);
    toast(ok?okMsg:'复制失败，请长按文本框手动复制');
  }catch(e){ toast('复制失败，请长按文本框手动复制'); }
}

/* ================= 工具 ================= */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function normAns(q){
  if(q.type==='判断') return q.ans==='正确'?'正确':'错误';
  return (q.ans||'').replace(/[^A-F]/g,'');
}
function isRight(q, picked){
  const a=normAns(q);
  if(q.type==='判断') return picked.join('')===a || (picked.length===1 && picked[0]===a);
  return [...a].sort().join('')===[...picked].sort().join('');
}
function getProg(bank){
  const p=store.get(PROG_KEY,{});
  return p[bank]||{best:0, tried:0, right:0};
}
function setProg(bank, fn){
  const p=store.get(PROG_KEY,{});
  const d=p[bank]||{best:0,tried:0,right:0};
  p[bank]=fn(d);
  store.set(PROG_KEY,p);
}
/* 建立练习题序 */
function buildOrder(mode){
  const list=BANKS[state.bank];
  if(mode==='wrong'){
    const ws=wrongStore();
    const arr=ws[state.bank]||[];
    state.order=arr.map(w=>w.i);
  } else if(mode==='rand'){
    const idx=[...list.keys()];
    for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
    state.order=idx;
  } else {
    state.order=[...list.keys()];
  }
  state.mode=mode; state.pos=0; state.selected=[]; state.answered=false; state.results={};
  state.sess={done:0,right:0,wrong:0};
}

function viewQuiz(){
  const list=BANKS[state.bank];
  if(!state.order.length) return emptyView('本模式暂无题目');
  const qi=state.order[state.pos];
  const q=list[qi];
  const total=state.order.length;
  const pct=Math.round((state.pos+1)/total*100);
  const typeChip = q.type==='单选'?'<span class="q-type">单选题</span>':q.type==='多选'?'<span class="q-type" style="background:#EFF0FF;color:#5E5CE6">多选题</span>':'<span class="q-type" style="background:#FFF6E6;color:#B47D00">判断题</span>';
  const rightCnt=Object.values(state.results).filter(r=>r==='right').length;
  const a=normAns(q);
  // 选项渲染
  let optsHtml='';
  if(q.type==='判断'){
    optsHtml=`<div class="judge-row">
      <div class="judge-btn ${state.answered&&a==='正确'?'correct':''}" ${state.answered?'data-lock':'data-judge="正确"'}>正确</div>
      <div class="judge-btn ${state.answered&&a==='错误'?'correct':''}" ${state.answered?'data-lock':'data-judge="错误"'}>错误</div>
    </div>`;
  } else {
    const pickedSet=new Set(state.selected);
    optsHtml=q.opts.map((o,idx)=>{
      const L=LETTERS[idx];
      const sel=pickedSet.has(L);
      let cls='opt-item';
      const isAns=a.includes(L);
      if(state.answered){
        cls='opt-item lock';
        if(sel && isAns){cls+=' correct';}
        else if(sel && !isAns){cls+=' wrong';}
        else if(isAns){cls+=' correct dim';}
        else cls+=' dim';
      } else if(sel){ cls+=' selected'; }
      return `<div class="${cls}" data-opt="${L}" ${state.answered?'data-lock':''}>
        <div class="oi-key">${L}</div><div style="flex:1">${esc(o)}</div>
        ${state.answered&&isAns&&!sel?'<span style="color:var(--green);font-weight:700"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#30A46C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span>':''}
      </div>`;
    }).join('');
  }
  // 反馈
  let fb='';
  if(state.answered){
    const isR=state.results[qi]==='right';
    fb=`<div class="feedback show">
      <div class="fb-title ${isR?'ok':'no'}">${isR?'答对了':'答错了'}</div>
      <div class="fb-ans">正确答案：<b>${a.split('').map(L=>LETTERS.indexOf(L)>=0&&q.type!=='判断'?L+'. '+esc(q.opts[LETTERS.indexOf(L)]):'').join('')}${q.type==='判断'?a:''}</b></div>
      ${q.type==='多选'&&!isR?'<div class="fb-right">你选择了：'+(state.selected.length?state.selected.join(', '):'未选择')+'</div>':''}
      <div class="btn-row"><button class="btn primary" data-next>${state.pos+1>=total?'完成':'下一题'}</button>
      ${q.type==='多选'&&!isR?'':''}</div>
    </div>`;
  } else if(q.type==='多选'){
    fb=`<div class="feedback show"><div class="fb-title" style="color:var(--muted)">已选 ${state.selected.length} 项（可多选）</div>
      <div class="btn-row"><button class="btn primary" data-submit>提交答案</button></div></div>`;
  }
  return `<div class="topbar">
      <button class="tb-btn" onclick="exitQuiz()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="tb-title">${state.bank} · ${state.mode==='rand'?'随机':state.mode==='wrong'?'错题':state.mode==='mem'?'背题':'顺序'}</div>

    <div class="q-wrap">
      <div class="q-progress"><div class="bar"><i style="width:${pct}%"></i></div><div class="q-count">${state.pos+1}/${total} · 对${rightCnt}</div></div>
      ${typeChip}

      <div class="opt-list">${optsHtml}</div>
      ${fb}

}

/* ================= 交互 ================= */
function go(v){ state.view=v; if(v==='home'){state.bank=null;} render(); window.scrollTo(0,0); }
function start(mode){
  buildOrder(mode);
  state.view = (mode==='mem')?'memorize':'quiz';
  render(); window.scrollTo(0,0);
}
function startWrong(b){ state.bank=b; buildOrder('wrong'); state.view='quiz'; render(); window.scrollTo(0,0); }
function pick(L){
  const list=BANKS[state.bank]; const qi=state.order[state.pos]; const q=list[qi];
  if(state.answered) return;
  if(q.type==='单选'){ state.selected=[L]; judge(); }
  else {
    if(state.selected.includes(L)) state.selected=state.selected.filter(x=>x!==L);
    else state.selected.push(L);
    render();
  }
}
function pickJudge(v){ if(state.answered) return; state.selected=[v]; judge(); }
function submitMulti(){ if(!state.selected.length){toast('请先选择选项');return;} judge(); }
function judge(){
  const list=BANKS[state.bank]; const qi=state.order[state.pos]; const q=list[qi];
  const ok=isRight(q, state.selected);
  state.answered=true;
  state.results[qi]= ok?'right':'wrong';
  state.sess.done++; ok?state.sess.right++:state.sess.wrong++;
  setProg(state.bank, d=>({tried:d.tried+1, right:d.right+(ok?1:0), best:d.best}));
  if(!ok){ addWrong(qi, q); }
  else { removeWrong(state.bank, qi); }
  render(); window.scrollTo(0,0);
}
function nextQ(){
  if(state.pos+1>=state.order.length){ finish(); return; }
  state.pos++; state.selected=[]; state.answered=false; render(); window.scrollTo(0,0);
}
function finish(){
  const r=state.sess;
  clearSession();
  toast(`本次完成 ${r.done} 题，答对 ${r.right}`);
  go('home');
}
function exitQuiz(){ saveSession(); toast('进度已保存，可随时继续'); go('home'); }
function markWrong(qi){
  const list=BANKS[state.bank]; addWrong(qi,list[qi]); toast('已加入错题本');
  nextQ();
}
function addWrong(qi,q){
  const ws=wrongStore(); const arr=ws[state.bank]=ws[state.bank]||[];
  if(!arr.some(w=>w.i===qi)){ arr.push({i:qi}); store.set(WRONG_KEY,ws); }
}
function removeWrong(bank,qi){
  const ws=wrongStore(); if(ws[bank]){ ws[bank]=ws[bank].filter(w=>w.i!==qi); if(!ws[bank].length) delete ws[bank]; store.set(WRONG_KEY,ws); }
}
function clearWrong(){ store.set(WRONG_KEY,{}); toast('错题已清空'); render(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* 底部导航 */
function bottomNav(){
  return `<div class="bottom-nav">
    <div class="nav-item ${state.view==='home'?'on':''}" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>首页</div>
    <div class="nav-item ${state.view==='wrong'?'on':''}" onclick="go('wrong')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a7 7 0 107 7M12 4v8l-5 2"/></svg>错题</div>
    <div class="nav-item ${state.view==='stats'?'on':''}" onclick="go('stats')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>统计</div>
  </div>`;
}

/* 事件委托：点击库卡片 / 选项 / 判断 / 提交 */
app.addEventListener('click', e=>{
  const bc=e.target.closest('.bank-card');
  if(bc){ state.bank=bc.dataset.bank; state.view='bank'; render(); window.scrollTo(0,0); return; }
  const opt=e.target.closest('[data-opt]');
  if(opt && !opt.hasAttribute('data-lock')){ pick(opt.dataset.opt); return; }
  const jb=e.target.closest('[data-judge]');
  if(jb && !jb.hasAttribute('data-lock')){ pickJudge(jb.dataset.judge); return; }
  const sm=e.target.closest('[data-submit]');
  if(sm){ submitMulti(); return; }
  const nq=e.target.closest('[data-next]');
  if(nq){ nextQ(); return; }
  /* 跳题面板（仅点击遮罩本身或 × 才关闭，面板内点击不关闭） */
  const jc=e.target.closest('[data-jump-close]');
  if(jc && jc===e.target){ state.jumpOpen=false; render(); return; }
  const jg=e.target.closest('[data-jump-go]');
  if(jg){
    const inp=document.getElementById('jp-input');
    const n=parseInt((inp&&inp.value)||'',10);
    if(!inp||isNaN(n)||n<1||n>state.order.length){ toast('请输入 1-'+state.order.length+' 之间的序号'); return; }
    jumpTo(n-1); return;
  }
  const jn=e.target.closest('[data-jump-n]');
  if(jn){ jumpTo(parseInt(jn.getAttribute('data-jump-n'),10)); return; }
  /* 继续上次练习 */
  const rg=e.target.closest('[data-resume-go]');
  if(rg){ resumeSession(); return; }
  const rcl=e.target.closest('[data-resume-clear]');
  if(rcl){
    if(window.confirm('确定放弃上次练习进度吗？')){ clearSession(); toast('已放弃，进度已清空'); render(); }
    return;
  }
  /* 存档面板（仅点击遮罩本身或 × 才关闭） */
  const ac=e.target.closest('[data-arc-close]');
  if(ac && ac===e.target){ state.arcOpen=false; render(); return; }
  const acp=e.target.closest('[data-arc-copy]');
  if(acp){
    const ta=document.getElementById('arc-text');
    copyText(ta?ta.value:'', '已复制存档内容'); return;
  }
  const adl=e.target.closest('[data-arc-dl]');
  if(adl){ downloadArchive(); return; }
  const aimp=e.target.closest('[data-arc-import]');
  if(aimp){
    const ta=document.getElementById('arc-in');
    if(ta&&ta.value&&ta.value.trim()){ importArchive(ta.value.trim()); }
    else toast('请先粘贴存档内容');
    return;
  }
});
render();
</script>
