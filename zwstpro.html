<style>

  --brand:#1466D6; --brand-d:#0B3D91; --brand-l:#EAF2FE;
  --green:#30A46C; --green-l:#EAF7F0;
  --red:#E5484D; --red-l:#FDEBEC;

}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6}

.resume-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin:12px 14px; padding:14px 16px; display:flex; align-items:center; gap:12px; border:1.5px solid var(--brand)}

<script>
"use strict";
/* ================= 数据与状态 ================= */
/* ================= 题库：外部 JSON 加载（本 HTML 不内置题库） ================= */
let BANKS = {};              // 运行时由 JSON 文件填充
let BANK_ORDER = [];         // 加载后更新
const BANK_CACHE_KEY='tk2_bank_cache_v1';
const BANK_META_KEY='tk2_bank_meta_v1';
let BANK_SOURCE='';          // 当前题库来源（文件名）
const LETTERS = "ABCDEFGHIJ";

/* ================= 题库加载（识别不到 JSON 文件时提示） ================= */
function normalizeBankData(raw){
  if(!raw || typeof raw!=='object') return null;
  var srcBanks = Array.isArray(raw) ? {'题库': raw} : raw;
  var names = Object.keys(srcBanks);
  if(!names.length) return null;
  var out={};
  for(var i=0;i<names.length;i++){
    var name=names[i], list=srcBanks[name];
    if(!Array.isArray(list) || !list.length) continue;
    var norm=[];
    for(var j=0;j<list.length;j++){
      var it=list[j];
      if(!it || typeof it!=='object') continue;
      var q = (it.q!=null)?it.q:(it.question!=null?it.question:null);
      var type = it.type || '';
      var opts = Array.isArray(it.opts)?it.opts.slice(0):(Array.isArray(it.options)?it.options.slice(0):[]);
      var ans = (it.ans!=null)?it.ans:(it.answer!=null?it.answer:null);
      if(q==null || ans==null) continue;
      if(type!=='单选' && type!=='多选' && type!=='判断') type = opts.length>1?'单选':'判断';
      norm.push({q:String(q), type:type, opts:opts, ans:String(ans)});
    }
    if(norm.length) out[name]=norm;
  }
  return Object.keys(out).length ? out : null;
}
function countAll(b){ var n=0, k; for(k in b){ n+=b[k].length; } return n; }
function applyBankData(norm, name){
  BANKS=norm;
  BANK_ORDER=Object.keys(norm);
  BANK_SOURCE=name||'';
  try{
    if(_storeMode==='localStorage'){
      store.set(BANK_CACHE_KEY, BANKS);
      store.set(BANK_META_KEY, {name:BANK_SOURCE, ts:Date.now()});
    }
  }catch(e){}
  state.view='home'; state.bank=null; state.jumpOpen=false; state.arcOpen=false;
  render(); window.scrollTo(0,0);
}
function tryLoadCachedBank(){
  if(_storeMode!=='localStorage') return;
  try{
    var b=store.get(BANK_CACHE_KEY, null);
    if(b && typeof b==='object'){
      var norm=normalizeBankData(b);
      if(norm){
        var meta=store.get(BANK_META_KEY, null);
        BANKS=norm; BANK_ORDER=Object.keys(norm);
        BANK_SOURCE=(meta && meta.name)?meta.name:'已缓存题库';
        return;
      }
    }
  }catch(e){}
  try{ store.set(BANK_CACHE_KEY, ''); }catch(e){}
}
function loadBankFromFile(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    var norm=null;
    try{ norm=normalizeBankData(JSON.parse(String(reader.result))); }
    catch(e){ toast('题库文件解析失败，请检查文件内容'); return; }
    if(!norm){ toast('无法识别的题库格式，请使用配套的题库 JSON 文件'); return; }
    applyBankData(norm, file.name);
    toast('题库加载成功：'+Object.keys(norm).length+' 个题库，共 '+countAll(norm)+' 题');
  };
  reader.onerror=function(){ toast('读取题库文件失败，请重试'); };
  reader.readAsText(file, 'utf-8');
}
function bankEmptyView(msg){
  var tip = msg || '缺少题库 JSON 文件';
  return `<div class="safe-top"></div>
  <div class="topbar"><div class="tb-title">通信理论题库 · 仅供综维内部交流</div><div class="tb-sub">严谨外传</div></div>
  <div class="card" style="text-align:center;padding:30px 20px">
    <div style="width:52px;height:52px;margin:0 auto;border-radius:14px;background:var(--amber-l);display:flex;align-items:center;justify-content:center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B47D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg>
    </div>
    <div style="font-weight:800;font-size:17px;margin-top:12px">${tip}</div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.9;text-align:left">
      本答题器不内置题库，需要搭配题库 JSON 文件一起使用：<br>
      ① 先下载题库 JSON 文件；<br>
      ② 点击下方“选择题库文件”，选中刚下载的 JSON 文件；<br>
      ③ 题库会自动缓存，下次打开无需重新选择。
      ④手机端选择题库后点击资源管理器，搜索通信试题.json
    </div>
    <label class="btn primary" style="max-width:260px;margin:18px auto 0;display:block;text-align:center">选择题库文件
      <input type="file" id="bank-file" accept=".json,application/json" style="display:none">
    </label>
    <div style="font-size:11px;color:var(--muted);margin-top:10px">支持两种格式：完整版（q/opts/ans）和 通用版（question/options/answer）</div>
  </div>`;
}
function bankSourceHtml(){
  return `<div style="display:flex;align-items:center;gap:8px;margin:10px 14px 0;font-size:12px;color:var(--muted)">
    <span style="background:var(--green-l);color:#1E7A4E;padding:3px 10px;border-radius:20px;font-weight:700;flex:none">题库已加载</span>
    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(BANK_SOURCE||'')}（${Object.keys(BANKS).length} 个题库 · ${countAll(BANKS)} 题）</span>
    <label style="color:var(--brand);font-weight:700;flex:none">更换<input type="file" id="bank-file" accept=".json,application/json" style="display:none"></label>
  </div>`;
}

/* 存储层：优先 localStorage；不可用时自动降级为 cookie；再不行降级为内存（仅本次会话），兼容低版本安卓浏览器 */
var _storeMode='localStorage';
var _memStore={};
(function(){
  try{
    localStorage.setItem('__tk_test__','1'); localStorage.removeItem('__tk_test__');
  }catch(e){
    try{
      document.cookie='__tk_test__=1; path=/';
      _storeMode=(document.cookie.indexOf('__tk_test__')>=0)?'cookie':'memory';
    }catch(e2){ _storeMode='memory'; }
  }
})();
function _cookieGet(k){
  var m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));
  return m?decodeURIComponent(m[1]):null;
}
function _cookieSet(k,v){
  try{ document.cookie=k+'='+encodeURIComponent(v)+'; path=/; max-age=31536000'; }catch(e){}
}
const store = {
  get(k,d){
    try{
      var raw=null;
      if(_storeMode==='localStorage') raw=localStorage.getItem(k);
      else if(_storeMode==='cookie') raw=_cookieGet(k);
      else raw=(k in _memStore)?_memStore[k]:null;
      return raw?JSON.parse(raw):d;
    }catch(e){ return d; }
  },
  set(k,v){
    try{
      var s=JSON.stringify(v);
      if(_storeMode==='localStorage') localStorage.setItem(k,s);
      else if(_storeMode==='cookie') _cookieSet(k,s);
      else _memStore[k]=s;
    }catch(e){}
  }
};
function storeMode(){ return _storeMode; }
const WRONG_KEY='tk_wrong_v1';
const PROG_KEY='tk_prog_v1';
const SESSION_KEY='tk_session_v1';

/* ================= 会话存档（按 题库×模式 独立自动保存，随时继续，互不覆盖） ================= */
function sessionRaw(){
  var m=store.get(SESSION_KEY, []);
  return Array.isArray(m)?m:[];
}
function saveSession(){
  if(state.view!=='quiz' && state.view!=='memorize') return;
  if(!state.bank || !BANKS[state.bank]) return;
  if(!state.order || !state.order.length) return;
  var data={
    order:state.order.slice(0),
    pos:state.pos,
    selected:(state.selected||[]).slice(0),
    answered:!!state.answered,
    results:Object.assign({}, state.results),
    sess:Object.assign({done:0,right:0,wrong:0}, state.sess),
    ts:Date.now()
  };
  var m=sessionRaw(), found=false, i;
  for(i=0;i<m.length;i++){
    if(m[i] && m[i].bank===state.bank && m[i].mode===state.mode){ m[i].data=data; found=true; break; }
  }
  if(!found) m.push({bank:state.bank, mode:state.mode, data:data});
  store.set(SESSION_KEY, m);
}
function clearSession(bank, mode){
  if(bank==null || mode==null) return;
  store.set(SESSION_KEY, sessionRaw().filter(function(e){ return !(e && e.bank===bank && e.mode===mode); }));
}
function validSession(bank, s){
  if(!s || typeof s!=='object') return false;
  if(!BANKS[bank]) return false;
  if(!Array.isArray(s.order) || !s.order.length) return false;
  if(typeof s.pos!=='number' || isNaN(s.pos) || s.pos<0 || s.pos>=s.order.length) return false;
  return true;
}
function sessionList(){
  var raw=sessionRaw(), out=[], i;
  for(i=0;i<raw.length;i++){
    var e=raw[i];
    if(!e || typeof e!=='object' || !e.bank || !e.mode) continue;
    if(validSession(e.bank, e.data)) out.push({bank:e.bank, mode:e.mode, s:e.data});
  }
  out.sort(function(a,b){ return ((b.s&&b.s.ts)||0)-((a.s&&a.s.ts)||0); });
  return out;
}
function modeTxt(mode){ return mode==='rand'?'随机':mode==='wrong'?'错题':mode==='mem'?'背题':'顺序'; }
function timeAgo(ts){
  if(!ts) return '';
  var diff=Date.now()-ts;
  if(diff<60e3) return '刚刚';
  if(diff<3600e3) return Math.floor(diff/60e3)+' 分钟前';
  if(diff<86400e3) return Math.floor(diff/3600e3)+' 小时前';
  return Math.floor(diff/86400e3)+' 天前';
}
function resumeSession(idx){
  var list=sessionList();
  var it=(typeof idx==='number' && list[idx])?list[idx]:null;
  if(!it){ toast('没有可继续的进度'); return; }
  var bank=it.bank, mode=it.mode, s=it.s;
  var arr=BANKS[bank];
  var order=s.order.filter(function(i){ return typeof i==='number' && i>=0 && i<arr.length; });
  if(!order.length){ toast('进度数据无效，已清除'); clearSession(bank, mode); render(); return; }
  state.bank=bank;
  state.mode=mode;
  state.order=order;
  state.pos=Math.min(Math.max(0, Math.floor(s.pos)), order.length-1);
  state.selected=Array.isArray(s.selected)?s.selected.slice(0):[];
  state.answered=!!s.answered;
  state.results=(s.results && typeof s.results==='object')?s.results:{};
  state.sess=Object.assign({done:0,right:0,wrong:0}, s.sess||{});
  state.jumpOpen=false; state.arcOpen=false;
  state.view=(mode==='mem')?'memorize':'quiz';
  render(); window.scrollTo(0,0);
  toast('已继续：'+bank+' · '+modeTxt(mode)+' 第 '+(state.pos+1)+'/'+order.length+' 题');
}
function resumeCardsHtml(){
  var list=sessionList();
  if(!list.length) return '';
  var html='';
  for(var i=0;i<list.length;i++){
    var it=list[i], s=it.s;
    html+='<div class="resume-card">'
      +'<div class="rc-ico">▶</div>'
      +'<div style="flex:1"><div class="rc-t">继续 · '+esc(it.bank)+' · '+modeTxt(it.mode)+'</div><div class="rc-m">第 '+(s.pos+1)+'/'+s.order.length+' 题 · '+timeAgo(s.ts)+'</div></div>'
      +'<div class="rc-btns"><button class="btn primary sm" data-resume-go="'+i+'">继续</button><button class="btn ghost sm" data-resume-clear="'+i+'">放弃</button></div>'
      +'</div>';
  }
  return html;
}

function openJump(){

  try{
    var i=document.getElementById('jp-input');
    if(i) setTimeout(function(){ try{ i.focus(); }catch(e){} }, 80);
  }catch(e){}
}
function jumpTo(i){
  if(typeof i!=='number' || isNaN(i) || i<0 || i>=state.order.length){ toast('题目序号超出范围'); return; }
  state.pos=i;
  state.selected=[];
  state.answered=!!state.results[state.order[i]];
  state.jumpOpen=false;
  render(); window.scrollTo(0,0);
  toast('已跳转到第 '+(i+1)+' 题');
}
function jumpPanelHtml(){
  var total=state.order.length;
  var cells=state.order.map(function(qi,i){
    var r=state.results[qi];
    var cls=(i===state.pos)?'cur':(r==='right'?'ok':(r==='wrong'?'no':''));
    return '<div class="jp-cell '+cls+'" data-jump-n="'+i+'">'+(i+1)+'</div>';
  }).join('');
  return `<div class="jump-mask" data-jump-close="1">
    <div class="jump-panel">
      <div class="jp-head">跳转到题目<button class="jp-x" data-jump-close="1">×</button></div>
      <div class="jp-input-row">
        <input id="jp-input" type="number" min="1" max="${total}" placeholder="输入 1-${total}" onkeydown="if(event.key==='Enter'){var v=parseInt(this.value,10);if(v&&v>=1&&v<=${total})jumpTo(v-1);else toast('请输入 1-${total} 之间的序号');}">
        <button class="btn primary sm" data-jump-go="1">跳转</button>
      </div>
      <div class="jp-grid">${cells}</div>
      <div class="jp-legend"><span><span class="lg-dot lg-cur"></span>当前</span><span><span class="lg-dot lg-ok"></span>答对</span><span><span class="lg-dot lg-no"></span>答错</span><span><span class="lg-dot"></span>未答</span></div>
    </div>
  </div>`;
}

      <div class="jp-actions"><button class="btn primary sm" data-arc-copy="1">复制</button><button class="btn ghost sm" data-arc-dl="1">下载文件</button></div>
      <div class="jp-sec">2. 导入存档（粘贴后覆盖当前进度）</div>
      <textarea id="arc-in" rows="3" placeholder="粘贴导出的存档内容到此处"></textarea>
      <div class="jp-actions"><button class="btn red sm" data-arc-import="1">导入并覆盖</button></div>
      <div class="jp-tip">存储模式：${storeMode()}。localStorage 最稳定；若显示 cookie/内存，说明浏览器限制了本地存储，请务必定期导出备份。换手机或清浏览器数据前，先导出存档即可恢复。</div>
    </div>
  </div>`;
}
function exportArchive(){
  return JSON.stringify({
    ver:2,
    time:new Date().toLocaleString(),
    prog:store.get(PROG_KEY,{}),
    wrong:store.get(WRONG_KEY,{}),
    session:store.get(SESSION_KEY,[])
  });
}
function importArchive(raw){
  var d=null;
  try{ d=JSON.parse(raw); }catch(e){ toast('存档内容不是有效格式'); return; }
  if(!d || typeof d!=='object'){ toast('存档内容不是有效格式'); return; }
  if(d.prog && typeof d.prog==='object') store.set(PROG_KEY, d.prog);
  if(d.wrong && typeof d.wrong==='object') store.set(WRONG_KEY, d.wrong);
  if(d.session !== undefined && d.session !== null){
    if(Array.isArray(d.session)){
      store.set(SESSION_KEY, d.session.filter(function(e){ return e && typeof e==='object' && e.bank && e.mode && e.data && typeof e.data==='object'; }));
    } else if(typeof d.session==='object'){
      /* 兼容旧版单存档格式（ver:1） */
      var old=d.session;
      if(old && old.bank && old.mode && Array.isArray(old.order)){
        store.set(SESSION_KEY, [{bank:old.bank, mode:old.mode, data:{order:old.order.slice(0), pos:old.pos, selected:Array.isArray(old.selected)?old.selected.slice(0):[], answered:!!old.answered, results:(old.results&&typeof old.results==='object')?old.results:{}, sess:Object.assign({done:0,right:0,wrong:0}, old.sess||{}), ts:old.ts||Date.now()}}]);
      }
    }
  }
  toast('导入成功'); render();
}
function downloadArchive(){
  try{
    var text=exportArchive();
    var blob=new Blob([text],{type:'application/json;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='通信题库存档.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 1500);
  }catch(e){}
  toast('已尝试下载；若未开始，请用上方复制按钮');
}
function copyText(t, okMsg){
  if(!t){ toast('没有可复制的内容'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast(okMsg); }, function(){ legacyCopy(t, okMsg); });
  } else legacyCopy(t, okMsg);
}
function legacyCopy(t, okMsg){
  try{
    var ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=false;
    try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
    document.body.removeChild(ta);
    toast(ok?okMsg:'复制失败，请长按文本框手动复制');
  }catch(e){ toast('复制失败，请长按文本框手动复制'); }
}

/* ================= 工具 ================= */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function normAns(q){
  if(q.type==='判断') return q.ans==='正确'?'正确':'错误';
  return (q.ans||'').replace(/[^A-F]/g,'');
}
function isRight(q, picked){
  const a=normAns(q);
  if(q.type==='判断') return picked.join('')===a || (picked.length===1 && picked[0]===a);
  return [...a].sort().join('')===[...picked].sort().join('');
}
function getProg(bank){
  const p=store.get(PROG_KEY,{});
  return p[bank]||{best:0, tried:0, right:0};
}
function setProg(bank, fn){
  const p=store.get(PROG_KEY,{});
  const d=p[bank]||{best:0,tried:0,right:0};
  p[bank]=fn(d);
  store.set(PROG_KEY,p);
}
/* 建立练习题序 */
function buildOrder(mode){
  const list=BANKS[state.bank];
  if(mode==='wrong'){
    const ws=wrongStore();
    const arr=ws[state.bank]||[];
    state.order=arr.map(w=>w.i);
  } else if(mode==='rand'){
    const idx=[...list.keys()];
    for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
    state.order=idx;
  } else {
    state.order=[...list.keys()];
  }
  state.mode=mode; state.pos=0; state.selected=[]; state.answered=false; state.results={};
  state.sess={done:0,right:0,wrong:0};
}

function viewQuiz(){
  const list=BANKS[state.bank];
  if(!state.order.length) return emptyView('本模式暂无题目');
  const qi=state.order[state.pos];
  const q=list[qi];
  const total=state.order.length;
  const pct=Math.round((state.pos+1)/total*100);
  const typeChip = q.type==='单选'?'<span class="q-type">单选题</span>':q.type==='多选'?'<span class="q-type" style="background:#EFF0FF;color:#5E5CE6">多选题</span>':'<span class="q-type" style="background:#FFF6E6;color:#B47D00">判断题</span>';
  const rightCnt=Object.values(state.results).filter(r=>r==='right').length;
  const a=normAns(q);
  // 选项渲染
  let optsHtml='';
  if(q.type==='判断'){
    optsHtml=`<div class="judge-row">
      <div class="judge-btn ${state.answered&&a==='正确'?'correct':''}" ${state.answered?'data-lock':'data-judge="正确"'}>正确</div>
      <div class="judge-btn ${state.answered&&a==='错误'?'correct':''}" ${state.answered?'data-lock':'data-judge="错误"'}>错误</div>
    </div>`;
  } else {
    const pickedSet=new Set(state.selected);
    optsHtml=q.opts.map((o,idx)=>{
      const L=LETTERS[idx];
      const sel=pickedSet.has(L);
      let cls='opt-item';
      const isAns=a.includes(L);
      if(state.answered){
        cls='opt-item lock';
        if(sel && isAns){cls+=' correct';}
        else if(sel && !isAns){cls+=' wrong';}
        else if(isAns){cls+=' correct dim';}
        else cls+=' dim';
      } else if(sel){ cls+=' selected'; }
      return `<div class="${cls}" data-opt="${L}" ${state.answered?'data-lock':''}>
        <div class="oi-key">${L}</div><div style="flex:1">${esc(o)}</div>
        ${state.answered&&isAns&&!sel?'<span style="color:var(--green);font-weight:700"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#30A46C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span>':''}
      </div>`;
    }).join('');
  }
  // 反馈
  let fb='';
  if(state.answered){
    const isR=state.results[qi]==='right';
    fb=`<div class="feedback show">
      <div class="fb-title ${isR?'ok':'no'}">${isR?'答对了':'答错了'}</div>
      <div class="fb-ans">正确答案：<b>${a.split('').map(L=>LETTERS.indexOf(L)>=0&&q.type!=='判断'?L+'. '+esc(q.opts[LETTERS.indexOf(L)]):'').join('')}${q.type==='判断'?a:''}</b></div>
      ${q.type==='多选'&&!isR?'<div class="fb-right">你选择了：'+(state.selected.length?state.selected.join(', '):'未选择')+'</div>':''}
      <div class="btn-row"><button class="btn primary" data-next>${state.pos+1>=total?'完成':'下一题'}</button>
      ${q.type==='多选'&&!isR?'':''}</div>
    </div>`;
  } else if(q.type==='多选'){
    fb=`<div class="feedback show"><div class="fb-title" style="color:var(--muted)">已选 ${state.selected.length} 项（可多选）</div>
      <div class="btn-row"><button class="btn primary" data-submit>提交答案</button></div></div>`;
  }
  return `<div class="topbar">
      <button class="tb-btn" onclick="exitQuiz()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="tb-title">${state.bank} · ${state.mode==='rand'?'随机':state.mode==='wrong'?'错题':state.mode==='mem'?'背题':'顺序'}</div>
      <button class="tb-btn" onclick="openJump()" title="跳题"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button></div>
    <div class="q-wrap">
      <div class="q-progress"><div class="bar"><i style="width:${pct}%"></i></div><div class="q-count">${state.pos+1}/${total} · 对${rightCnt}</div></div>
      ${typeChip}
      <div class="q-body">${esc(q.q)}</div>
      <div class="opt-list">${optsHtml}</div>
      ${fb}
    </div>
    ${state.jumpOpen?jumpPanelHtml():''}`;
}

function emptyView(msg){
  return `<div class="topbar"><button class="tb-btn" onclick="go('home')">‹</button><div class="tb-title">题库</div></div>
  <div class="empty"><div class="e-ico" style="opacity:.4"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#9AA9BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M3 8h18M3 12h18M3 16h18"/></svg></div><p>${msg}</p>
  <button class="btn primary full" style="max-width:260px;margin:10px auto;display:block" onclick="go('home')">返回首页</button></div>`;
}

/* ---- 背题 ---- */
function viewMemorize(){
  const list=BANKS[state.bank];
  if(!state.order.length) return emptyView('本模式暂无题目');
  const qi=state.order[state.pos];
  const q=list[qi];
  const total=state.order.length;
  const a=normAns(q);
  let optsHtml='';
  if(q.type==='判断'){
    optsHtml=`<div class="judge-row"><div class="judge-btn ${a==='正确'?'correct':''}">正确</div><div class="judge-btn ${a==='错误'?'correct':''}">错误</div></div>`;
  } else {
    optsHtml=q.opts.map((o,idx)=>{
      const L=LETTERS[idx];
      const isAns=a.includes(L);
      return `<div class="opt-item ${isAns?'isans':''}"><div class="oi-key">${L}</div><div style="flex:1">${esc(o)}</div>${isAns?'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#30A46C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg>':''}</div>`;
    }).join('');
  }
  const ansText = q.type==='判断'? a : a.split('').map(L=>L+'、'+esc(q.opts[LETTERS.indexOf(L)])).join('　');
  return `<div class="topbar"><button class="tb-btn" onclick="exitQuiz()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="tb-title">${state.bank} · 背题</div><button class="tb-btn" onclick="openJump()" title="跳题"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button></div>
    <div class="q-wrap">
      <div class="q-progress"><div class="bar"><i style="width:${Math.round((state.pos+1)/total*100)}%"></i></div><div class="q-count">${state.pos+1}/${total}</div></div>
      <span class="q-type" style="background:#FFF6E6;color:#B47D00">背题</span>
      <div class="q-body">${esc(q.q)}</div>
      <div class="mem-opts opt-list">${optsHtml}</div>
      <div class="mem-ans"><div class="ma-l">正确答案</div><div class="ma-a">${ansText}</div></div>
      <div class="ops">
        <button class="btn ghost" onclick="markWrong(${qi})">标为错题</button>
        <button class="btn primary" onclick="nextQ()">${state.pos+1>=total?'完成':'下一题'}</button>
      </div>
    </div>
    ${state.jumpOpen?jumpPanelHtml():''}`;
}

/* ---- 错题本 ---- */
function viewWrong(){
  if(!BANK_ORDER.length) return bankEmptyView('请先加载题库');
  const ws=wrongStore();
  const banks=Object.keys(ws).filter(b=>ws[b].length>0);
  if(!banks.length) return emptyView('还没有错题，继续刷题吧');
  let rows='';
  for(const b of banks){
    const arr=ws[b];
    rows+=`<div class="row-item" onclick="startWrong('${b}')"><div class="ri-t"><div class="ri-name">${b}</div><div class="ri-meta">${arr.length} 道错题</div></div><span class="badge amber">重练</span></div>`;
  }
  return `<div class="topbar"><button class="tb-btn" onclick="go('home')">‹</button><div class="tb-title">错题重练</div><button class="tb-btn" style="opacity:0">‹</button></div>
  <div class="row-list" style="margin-top:14px">${rows}</div>
  <div class="pad"><button class="btn red" onclick="clearWrong()">清空全部错题</button></div>`;
}

/* ---- 统计 ---- */
function viewStats(){
  if(!BANK_ORDER.length) return bankEmptyView('请先加载题库');
  let rows='';
  const all=store.get(PROG_KEY,{});
  for(const b of BANK_ORDER){
    const d=all[b]||{tried:0,right:0,best:0};
    const list=BANKS[b];
    const pct=d.tried?Math.round(d.right/d.tried*100):0;
    const wlen=(wrongStore()[b]||[]).length;
    rows+=`<div class="row-item"><div class="ri-t"><div class="ri-name">${b}</div><div class="ri-meta">共${list.length}题 · 练${d.tried} · 对${d.right}</div></div><span class="badge ${pct>=80?'green':pct>=60?'amber':'gray'}">正确率 ${pct}%</span></div>`;
  }
  const totalTry=Object.values(all).reduce((s,d)=>s+(d.tried||0),0);
  const totalRight=Object.values(all).reduce((s,d)=>s+(d.right||0),0);
  return `<div class="topbar"><button class="tb-btn" onclick="go('home')">‹</button><div class="tb-title">学习统计</div><button class="tb-btn" style="opacity:0">‹</button></div>
  <div class="stat-grid pad">
    <div class="stat-cell"><div class="num">${totalTry}</div><div class="lab">累计答题</div></div>
    <div class="stat-cell"><div class="num">${totalRight}</div><div class="lab">答对</div></div>
    <div class="stat-cell"><div class="num">${totalTry?Math.round(totalRight/totalTry*100):0}%</div><div class="lab">总正确率</div></div>
    <div class="stat-cell"><div class="num">${totalWrong()}</div><div class="lab">错题</div></div>
  </div>
  <div class="row-list">${rows}</div>`;
}

/* ================= 交互 ================= */
function go(v){ state.view=v; if(v==='home'){state.bank=null;} render(); window.scrollTo(0,0); }
function start(mode){
  buildOrder(mode);
  state.view = (mode==='mem')?'memorize':'quiz';
  render(); window.scrollTo(0,0);
}
function startWrong(b){ state.bank=b; buildOrder('wrong'); state.view='quiz'; render(); window.scrollTo(0,0); }
function pick(L){
  const list=BANKS[state.bank]; const qi=state.order[state.pos]; const q=list[qi];
  if(state.answered) return;
  if(q.type==='单选'){ state.selected=[L]; judge(); }
  else {
    if(state.selected.includes(L)) state.selected=state.selected.filter(x=>x!==L);
    else state.selected.push(L);
    render();
  }
}
function pickJudge(v){ if(state.answered) return; state.selected=[v]; judge(); }
function submitMulti(){ if(!state.selected.length){toast('请先选择选项');return;} judge(); }
function judge(){
  const list=BANKS[state.bank]; const qi=state.order[state.pos]; const q=list[qi];
  const ok=isRight(q, state.selected);
  state.answered=true;
  state.results[qi]= ok?'right':'wrong';
  state.sess.done++; ok?state.sess.right++:state.sess.wrong++;
  setProg(state.bank, d=>({tried:d.tried+1, right:d.right+(ok?1:0), best:d.best}));
  if(!ok){ addWrong(qi, q); }
  else { removeWrong(state.bank, qi); }
  render(); window.scrollTo(0,0);
}
function nextQ(){
  if(state.pos+1>=state.order.length){ finish(); return; }
  state.pos++; state.selected=[]; state.answered=false; render(); window.scrollTo(0,0);
}
function finish(){
  const r=state.sess;
  clearSession(state.bank, state.mode);
  toast(`本次完成 ${r.done} 题，答对 ${r.right}`);
  go('home');
}
function exitQuiz(){ saveSession(); toast('进度已保存，可随时继续'); go('home'); }
function markWrong(qi){
  const list=BANKS[state.bank]; addWrong(qi,list[qi]); toast('已加入错题本');
  nextQ();
}
function addWrong(qi,q){
  const ws=wrongStore(); const arr=ws[state.bank]=ws[state.bank]||[];
  if(!arr.some(w=>w.i===qi)){ arr.push({i:qi}); store.set(WRONG_KEY,ws); }
}
function removeWrong(bank,qi){
  const ws=wrongStore(); if(ws[bank]){ ws[bank]=ws[bank].filter(w=>w.i!==qi); if(!ws[bank].length) delete ws[bank]; store.set(WRONG_KEY,ws); }
}
function clearWrong(){ store.set(WRONG_KEY,{}); toast('错题已清空'); render(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* 底部导航 */
function bottomNav(){
  return `<div class="bottom-nav">
    <div class="nav-item ${state.view==='home'?'on':''}" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>首页</div>
    <div class="nav-item ${state.view==='wrong'?'on':''}" onclick="go('wrong')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a7 7 0 107 7M12 4v8l-5 2"/></svg>错题</div>
    <div class="nav-item ${state.view==='stats'?'on':''}" onclick="go('stats')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>统计</div>
  </div>`;
}

/* 事件委托：点击库卡片 / 选项 / 判断 / 提交 */
app.addEventListener('click', e=>{
  const bc=e.target.closest('.bank-card');
  if(bc){ state.bank=bc.dataset.bank; state.view='bank'; render(); window.scrollTo(0,0); return; }
  const opt=e.target.closest('[data-opt]');
  if(opt && !opt.hasAttribute('data-lock')){ pick(opt.dataset.opt); return; }
  const jb=e.target.closest('[data-judge]');
  if(jb && !jb.hasAttribute('data-lock')){ pickJudge(jb.dataset.judge); return; }
  const sm=e.target.closest('[data-submit]');
  if(sm){ submitMulti(); return; }
  const nq=e.target.closest('[data-next]');
  if(nq){ nextQ(); return; }
  /* 跳题面板（仅点击遮罩本身或 × 才关闭，面板内点击不关闭） */
  const jc=e.target.closest('[data-jump-close]');
  if(jc && jc===e.target){ state.jumpOpen=false; render(); return; }
  const jg=e.target.closest('[data-jump-go]');
  if(jg){
    const inp=document.getElementById('jp-input');
    const n=parseInt((inp&&inp.value)||'',10);
    if(!inp||isNaN(n)||n<1||n>state.order.length){ toast('请输入 1-'+state.order.length+' 之间的序号'); return; }
    jumpTo(n-1); return;
  }
  const jn=e.target.closest('[data-jump-n]');
  if(jn){ jumpTo(parseInt(jn.getAttribute('data-jump-n'),10)); return; }
  /* 继续上次练习（每张卡片对应一个独立存档） */
  const rg=e.target.closest('[data-resume-go]');
  if(rg){ resumeSession(parseInt(rg.getAttribute('data-resume-go'),10)); return; }
  const rcl=e.target.closest('[data-resume-clear]');
  if(rcl){
    if(window.confirm('确定放弃该练习进度吗？')){
      const li=sessionList();
      const it=li[parseInt(rcl.getAttribute('data-resume-clear'),10)];
      if(it) clearSession(it.bank, it.mode);
      toast('已放弃，进度已清空'); render();
    }
    return;
  }
  /* 存档面板（仅点击遮罩本身或 × 才关闭） */
  const ac=e.target.closest('[data-arc-close]');
  if(ac && ac===e.target){ state.arcOpen=false; render(); return; }
  const acp=e.target.closest('[data-arc-copy]');
  if(acp){
    const ta=document.getElementById('arc-text');
    copyText(ta?ta.value:'', '已复制存档内容'); return;
  }
  const adl=e.target.closest('[data-arc-dl]');
  if(adl){ downloadArchive(); return; }
  const aimp=e.target.closest('[data-arc-import]');
  if(aimp){
    const ta=document.getElementById('arc-in');
    if(ta&&ta.value&&ta.value.trim()){ importArchive(ta.value.trim()); }
    else toast('请先粘贴存档内容');
    return;
  }
});

document.addEventListener('change', function(e){
  var t=e.target;
  if(t && t.id==='bank-file' && t.files && t.files[0]){
    loadBankFromFile(t.files[0]);
    try{ t.value=''; }catch(e2){}
  }
});
tryLoadCachedBank();
render();
